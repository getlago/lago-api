name: Billing Matrix Daily

on:
  schedule:
    - cron: "10 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run the suite and print the report without committing, opening a PR, or posting to Slack"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  billing-matrix:
    name: Billing Matrix Daily
    runs-on: ubuntu-latest
    services:
      postgres:
        image: getlago/postgres-partman:15.0-alpine
        ports:
          - "5432:5432"
        env:
          POSTGRES_DB: lago
          POSTGRES_USER: lago
          POSTGRES_PASSWORD: lago
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      DATABASE_URL: "postgres://lago:lago@localhost:5432/lago"
      DATABASE_TEST_URL: "postgres://lago:lago@localhost:5432/lago_matrix_test"
      LAGO_REDIS_CACHE_URL: "redis://localhost:6379"
      LAGO_REDIS_STORE_URL: "localhost:6379"
      RAILS_MASTER_KEY: N+XcWoGDzKjuoxrU8BIPN5D0/GSuqx9s
      SECRET_KEY_BASE: cvIAI6ycC0OnVDRAjT5hmbRxnjCxl4YB
      LAGO_API_URL: https://api.lago.dev
      LAGO_PDF_URL: https://pdf.lago.dev
      LAGO_DATA_API_URL: http://data_api
      LAGO_FROM_EMAIL: noreply@getlago.com
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.6"
          bundler-cache: true

      - name: Generate RSA keys
        run: ./scripts/generate.rsa.sh

      - name: Set up billing matrix database
        run: |
          bin/rails db:create db:schema:load:primary

      - name: Run billing matrix
        id: run_matrix
        run: |
          set +e
          ruby billing_matrix/run.rb
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
        env:
          GIT_SHA: ${{ github.sha }}

      - name: Alarm on void run
        if: steps.run_matrix.outputs.exit_code == '2'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_DM_USER_ID: ${{ secrets.SLACK_DM_USER_ID }}
        run: |
          curl -sS https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$(jq -n --arg channel "$SLACK_DM_USER_ID" \
              '{channel: $channel, text: ":rotating_light: Billing matrix canary passed — the suite'\''s assertions can no longer be trusted. This run is void; investigate the harness before trusting any result."}')"

      # `has_news` is a boolean rather than a test on the report string: an empty report
      # still writes a newline through the heredoc, so comparing the text to '' is not a
      # reliable "nothing happened today" signal.
      - name: Build ledger report
        id: ledger
        if: steps.run_matrix.outputs.exit_code != '2'
        run: |
          pr_url="https://github.com/${{ github.repository }}/compare/main...billing-matrix/ledger?expand=1"
          output="$(ruby billing_matrix/ledger.rb --apply --format slack --pr-url "$pr_url")"
          if [[ -z "${output//[[:space:]]/}" ]]; then
            echo "has_news=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_news=true" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "report<<LEDGER_EOF"
            echo "$output"
            echo "LEDGER_EOF"
          } >> "$GITHUB_OUTPUT"

      # A report can exist while ledger.yml is unchanged — errored rows are reported but
      # deliberately never move a ledger entry. `git commit` exits 1 on an empty index, so
      # committing unconditionally would turn that ordinary morning into a red build.
      - name: Commit and push ledger
        id: commit
        if: steps.ledger.outputs.has_news == 'true' && env.DRY_RUN != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B billing-matrix/ledger
          git add billing_matrix/ledger.yml
          if git diff --cached --quiet; then
            echo "ledger unchanged; nothing to push"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(billing-matrix): update ledger"
            git push --force origin billing-matrix/ledger
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # Reusing one fixed branch is what makes tomorrow amend today's pull request instead
      # of opening a second one.
      - name: Open PR if needed
        if: steps.commit.outputs.pushed == 'true'
        run: |
          existing_pr="$(gh pr list --repo "${{ github.repository }}" --head billing-matrix/ledger --base main --state open --json number --jq '.[0].number')"
          if [[ -z "$existing_pr" ]]; then
            gh pr create --repo "${{ github.repository }}" \
              --base main \
              --head billing-matrix/ledger \
              --title "chore(billing-matrix): update ledger" \
              --body "Opened by Billing Matrix Daily. Contains only \`billing_matrix/ledger.yml\` — the day's status changes. Amended in place while it stays open."
          fi

      - name: Post report to Slack
        if: steps.ledger.outputs.has_news == 'true' && env.DRY_RUN != 'true'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_DM_USER_ID: ${{ secrets.SLACK_DM_USER_ID }}
          REPORT: ${{ steps.ledger.outputs.report }}
        run: |
          curl -sS https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$(jq -n --arg channel "$SLACK_DM_USER_ID" --arg text "$REPORT" '{channel: $channel, text: $text}')"

      # Through the environment, not string-interpolated into the script: report text is
      # built from row ids and mismatch values, and interpolating it directly is the
      # standard Actions command-injection hole.
      - name: Print dry-run report
        if: env.DRY_RUN == 'true' && steps.run_matrix.outputs.exit_code != '2'
        env:
          REPORT: ${{ steps.ledger.outputs.report }}
        run: printf '%s\n' "$REPORT"
