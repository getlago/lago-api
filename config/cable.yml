<% require "lago/redis_config_builder" %>
development:
  adapter: redis
  url: <%= ENV.fetch("LAGO_REDIS_CABLE_URL", ENV.fetch("REDIS_URL", "redis://localhost:6379/1")) %>
  channel_prefix: lago_development
  # The password of the URL above, kept out of it (see Lago::RedisConfigBuilder#cable).
  <<: <%= Lago::RedisConfigBuilder.new.cable.to_json %>

test:
  adapter: test

staging:
  adapter: redis
  url: <%= ENV.fetch("LAGO_REDIS_CABLE_URL", ENV.fetch("REDIS_URL", "redis://localhost:6379/1")) %>
  channel_prefix: lago_staging
  # The password of the URL above, kept out of it (see Lago::RedisConfigBuilder#cable).
  <<: <%= Lago::RedisConfigBuilder.new.cable.to_json %>

production:
  adapter: redis
  url: <%= ENV.fetch("LAGO_REDIS_CABLE_URL", ENV.fetch("REDIS_URL", "redis://localhost:6379/1")) %>
  channel_prefix: lago_production
  # The password of the URL above, kept out of it (see Lago::RedisConfigBuilder#cable).
  <<: <%= Lago::RedisConfigBuilder.new.cable.to_json %>
