# The autocorrection runs the service middlewares, such as the activity log, that `new(...).call` skips.
# Webhook services and the allowed receivers do not inherit `BaseService` and have no class-level `call`.
Lago/ServiceNewCall:
  SafeAutoCorrect: false
  AllowedReceivers:
    # Dates services return a dates object, not a result, which the middlewares cannot read.
    - Subscriptions::TerminatedDatesService
    - Commitments::DatesService
    - Commitments::Minimum::InAdvance::DatesService
    - Commitments::Minimum::InArrears::DatesService
  Exclude:
    - "spec/services/webhooks/**/*.rb"

# TODO: Fix these services
Lago/ServiceCall:
  Exclude:
    - "app/services/integration_mappings/create_service.rb"
    - "app/services/integrations/anrok/create_service.rb"
    - "app/services/integrations/okta/create_service.rb"
    - "app/services/integrations/xero/create_service.rb"
    - "app/services/invites/accept_service.rb"
    - "app/services/invoices/finalize_batch_service.rb"
    - "app/services/invoices/payments/retry_batch_service.rb"
    - "app/services/invoices/retry_batch_service.rb"

Style/FrozenStringLiteralComment:
  Enabled: true
  SafeAutoCorrect: true

Performance/CaseWhenSplat:
  Enabled: true

Rails/ApplicationJob:
  Exclude:
    - "spec/support/jobs/**/*"

# strong_migration does not work with bulk changes
Rails/BulkChangeTable:
  Enabled: false

Rails/InverseOf:
  Description: "Checks for associations where the inverse cannot be determined automatically."
  Enabled: false

Rails/HttpStatus:
  Description: "Enforces use of symbolic or numeric value to describe HTTP status."
  Enabled: false

Rails/HasManyOrHasOneDependent:
  Description: 'Forces a "dependent" options for has_one and has_many rails relations.'
  Enabled: false

Rails/TransactionExitStatement:
  Enabled: true

RSpec/ExampleLength:
  Description: "Checks for long examples."
  Enabled: false

RSpec/MultipleExpectations:
  Description: "Checks if examples contain too many expect calls."
  Enabled: false

RSpec/MultipleMemoizedHelpers:
  Enabled: false

RSpec/NestedGroups:
  Enabled: false

RSpec/NamedSubject:
  Enabled: false

RSpec/DescribeClass:
  Exclude:
    - "spec/scenarios/**/*"

# RSpec rules below are enabled by default in rubocop-rspec 3.X but we disabled to ease migration.
RSpec/IndexedLet:
  Enabled: false

RSpec/MatchArray:
  Enabled: false

RSpec/MetadataStyle:
  Enabled: false

RSpec/NoExpectationExample:
  Enabled: false

RSpec/ReceiveMessages:
  Enabled: false

RSpec/VerifiedDoubleReference:
  Enabled: false

RSpec/BeEq:
  Enabled: false

RSpec/BeNil:
  Enabled: false

# GraphQL

GraphQL/ArgumentDescription:
  Enabled: false

GraphQL/FieldDescription:
  Enabled: false

GraphQL/ObjectDescription:
  Enabled: false

GraphQL/ExtractType:
  Enabled: false

GraphQL/ExtractInputType:
  Exclude:
    - "app/graphql/mutations/admin/create_organization.rb"
    - "app/graphql/mutations/admin/toggle_feature.rb"
    - "app/graphql/mutations/applied_coupons/create.rb"
    - "app/graphql/mutations/credit_notes/create.rb"
    - "app/graphql/mutations/invites/accept.rb"
    - "app/graphql/mutations/invoices/regenerate_from_voided.rb"
    - "app/graphql/mutations/plans/create.rb"
    - "app/graphql/mutations/plans/update.rb"
    - "app/graphql/mutations/register_user.rb"
    - "app/graphql/mutations/wallet_transactions/create.rb"

ThreadSafety/NewThread:
  Exclude:
    - "spec/**/*"

ThreadSafety/DirChdir:
  Exclude:
    - "spec/**/*"
