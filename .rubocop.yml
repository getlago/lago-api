inherit_mode:
  merge:
    - Exclude

plugins:
  - rubocop-rails
  - rubocop-graphql
  - rubocop-factory_bot
  - rubocop-performance
  - rubocop-thread_safety
  - rubocop-rspec
  - rubocop-rspec_rails

require:
  - standard
  - ./dev/cops/service_call_cop.rb
  - ./dev/cops/discard_all_cop.rb
  - ./dev/cops/no_drop_column_or_table_cop.rb
  - ./dev/cops/migrations_concurrent_index_cop.rb
  - ./dev/cops/migrations_if_not_exists_cop.rb
  - ./dev/cops/lago_premium_around_cop.rb
  - ./dev/cops/active_job_perform_all_later_cop.rb
  - ./dev/cops/stub_perform_all_later_cop.rb
  - ./dev/cops/no_expect_receive_on_job_cop.rb
  - ./dev/cops/v2_timestamp_format_cop.rb
  - ./dev/cops/update_all_updated_at_cop.rb
  - ./dev/cops/service_new_call_cop.rb

inherit_gem:
  standard: config/base.yml

AllCops:
  NewCops: disable
  DisplayStyleGuide: true
  Exclude:
    - "bin/**/*"
    - "db/schema.rb"
    - "db/*_schema.rb"
    - "storage/**/*"
    - "tmp/**/*"
    - "coverage/**/*"
    - "log/**/*"

Lago/LagoPremiumAround:
  Include:
    - "spec/**/*.rb"

Lago/NoExpectReceiveOnJob:
  Include:
    - "spec/**/*.rb"

Lago/V2TimestampFormat:
  Include:
    - "app/serializers/v2/**/*.rb"

Lago/NoDropColumnOrTable:
  Include:
    - "db/migrate/**/*.rb"
  Exclude:
    - "db/migrate/20250218165958_drop_invoice_error_table.rb"
    - "db/migrate/20250227091909_remove_is_default_from_billing_entity.rb"
    - "db/migrate/20250526133654_drop_clickhouse_aggregation_from_organizations.rb"
    - "db/migrate/20250528133222_drop_invoice_custom_section_selections.rb"
    - "db/migrate/20250912081524_change_wallet_min_max_to_big_int.rb"
    - "db/migrate/20251007103421_drop_customer_snapshots.rb"
    - "db/migrate/20251020090137_remove_event_id_from_cached_aggregation.rb"
    - "db/migrate/20251221174251_create_roles.rb"
    - "db/migrate/20251221174733_create_membership_roles.rb"
    - "db/migrate/20251221174938_add_roles_to_invites.rb"
    - "db/migrate/20260109110146_create_enriched_events.rb"
    - "db/migrate/20260116121015_remove_role_from_memberships.rb"
    - "db/migrate/20260116121019_remove_role_from_invites.rb"
    - "db/migrate/20260119162712_drop_subscription_fixed_charge_units_overrides.rb"
    - "db/migrate/20260129145352_drop_properties_from_enriched_events.rb"
    - "db/migrate/20260409151451_create_enriched_store_migrations.rb"
    - "db/migrate/20260409161142_create_enriched_store_subscription_migrations.rb"
    - "db/migrate/20260908211313_drop_retired_pricing_type_and_plan_id.rb"
    - "db/migrate/20260908222044_drop_subscription_rate_cards.rb"
    - "db/migrate/20260910095513_drop_wallet_targetable_from_rate_cards.rb"
    - "db/migrate/20260910151708_drop_enriched_store_migration_tables.rb"
    - "db/migrate/20260921154906_replace_attribution_key_with_attribution_keys.rb"
    - "db/migrate/20260925110807_drop_ended_date_from_contract_rate_cards.rb"

# Existing migrations are immutable; enforce these requirements on migrations dated September 30, 2026 or later.
Lago/MigrationsConcurrentIndex:
  Include:
    - "db/migrate/**/*.rb"
  Exclude:
    - "db/migrate/202[0-5]*.rb"
    - "db/migrate/20260[0-8]*.rb"
    - "db/migrate/202609[0-2]*.rb"

Lago/MigrationsIfNotExists:
  Include:
    - "db/migrate/**/*.rb"
  Exclude:
    - "db/migrate/202[0-5]*.rb"
    - "db/migrate/20260[0-8]*.rb"
    - "db/migrate/202609[0-2]*.rb"

# Specs force test state with `update_all`. Existing migrations and backfill jobs are not changed;
# check migrations dated November 28, 2026 or later. The autocorrection breaks on a table without `updated_at`.
Lago/UpdateAllUpdatedAt:
  SafeAutoCorrect: false
  Exclude:
    - "spec/**/*.rb"
    - "db/migrate/202[0-5]*.rb"
    - "db/migrate/20260*.rb"
    - "db/migrate/202610*.rb"
