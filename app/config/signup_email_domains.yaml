# Private suffixes sold like a TLD, whose names companies buy (acme.us.com). The gem cuts each temp-mail domain to its
# ICANN root, so its us.com entry stands for one service under us.com: an entry naming one of these refuses only itself.
# Free registries, free DNS hosts and dynamic DNS (eu.org, duckdns.org) stay out, so names under them are refused.
# Adding one: deny the live temp-mail hosts the upstream lists name under it (one.gb.net), which the gem dropped.
