# Cells already guarded by specs OUTSIDE the golden suite.
#
# Many of the hand-written specs under `spec/scenarios/` assert exactly what a golden cell would.
# Marking those cells `~` rather than blank stops the map reporting a gap somebody is already
# watching, and stops anyone writing a duplicate row.
#
# Each cell names its OWN spec, so a cell and its reference cannot be mispaired — over-claiming is a
# lie the map would then repeat forever.
#
# Rules for an entry:
#   * point at a file AND line holding the actual assertion, not a file that "covers the area"
#   * claim only what the spec really exercises; under-claiming is free
#   * harness_spec.rb checks every referenced file exists and the line is inside it
#
# An external mark is WEAKER than a golden row: no derived `math`, no exact-value discipline, and it
# never counts toward the ledger's covered total. It means "somebody is watching this", not "this is
# pinned to the penny".
---
# by_aggregation_type/*: a STANDARD charge, varying the aggregation, asserted on current usage.
- block: B1
  cell: {charge_model: standard, aggregation: count_agg, observed_via: current-usage, events: many}
  covered_by: spec/scenarios/current_usage/by_aggregation_type/count_agg_spec.rb:47
- block: B1
  cell: {charge_model: standard, aggregation: sum_agg, observed_via: current-usage, events: many}
