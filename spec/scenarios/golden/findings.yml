- id: F60
  severity: HARNESS
  status: resolved
  title: invoice fee `units` was typed string-only while two green rows wrote an integer
  ticket:
  noted: '2026-08-26'
  digest:
  body: |-
    schema.json's invoice_expectation fee `units` was `"type": "string"`; b09/terminate/advance/none and
