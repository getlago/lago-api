# Findings the suite has recorded: suspected Lago defects and harness gaps.
#
# THE MASTER LIST. `rake golden:findings:export` regenerates the dated markdown log from this
# file, so the two cannot drift — edit here, never there.
#
# severity  MONEY (customer over/undercharged) | BROKEN (raises/500) | API (contract wrong)
#           | HARNESS (suite gap) | DOC (docs lie) | PROCESS
# status    recorded (seen, not triaged) | accepted | ticketed | investigating | withdrawn | resolved
#
# Which rows pin a finding is NOT stored: it is derived from rows' `pins:` at read time, so it
# cannot go stale. `digest` fingerprints those rows' assertions — if it moves, the defect changed
# size and `rake golden:triage` reports it rather than re-accepting it silently.
