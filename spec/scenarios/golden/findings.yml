    `invoice.customer.wallets.all?(&:traceable?)` (:74). Rows assert only the non-nil side.
- id: F30
  severity: MONEY
  status: recorded
  title: A wallet limited by BOTH fee type and metric widens instead of narrowing
  ticket:
  noted: '2026-08-26'
  digest:
  body: |-
