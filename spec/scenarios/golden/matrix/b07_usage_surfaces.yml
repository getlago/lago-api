    March ingests refs mar_a, mar_b, mar_b — three events, two distinct properties. Postgres
    UniqueCountQuery#operation_value_sql (unique_count_query.rb:276-287) scores a repeated `add` for a
    property already added as 0, so the aggregation is 2 units → 200¢, where count_agg on the same
    events would give 3 → 300¢. April ingests apr_a, apr_b, apr_b, apr_c — four events, three distinct
    → 3 units → 300¢ against count_agg's 4 → 400¢. Every period therefore contains the duplicate that
    separates unique_count from count.
