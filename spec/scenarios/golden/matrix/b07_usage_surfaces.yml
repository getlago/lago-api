  math: >-
    latest_agg is the aggregation for which the boundary event is always load-bearing: it IS the
    answer. April's last event carries 15 units and is timestamped 2024-04-30T23:59:59Z, the last
    representable second of the period, and the read is at that same instant. LatestService
    (latest_service.rb:16-18) takes the store's `last`, ordered `timestamp DESC, created_at DESC`
    (postgres_store.rb:235), within boundaries taken from Subscriptions::DatesService with
    current_usage: true (customer_usage_service.rb:162-180) → 15 units → 1_500¢. Lose the last second
    to an exclusive upper comparison and the latest becomes the 5 → 500¢; roll the period one second
    early and April is not the current period → 0¢. All three timestamps are distinct, so `last` has
    no tie to break arbitrarily.
    invoiced_usage_amount_cents is 2_000¢: March's latest, 20 units, priced at 1.00 and carried past
    the boundary by CalculateService#calculate_invoiced_usage_amount_cents (calculate_service.rb:41-52),
    which sums charge fee cents on the subscription's invoices. A lifetime figure that re-ran
    latest_agg over the whole subscription would answer 15 units for everything and March would
    vanish.

- id: b7/lifetime-usage/latest_agg/after-billing
  block: B7
  group: lat
  key: b07_lt_latest_bil
  axes: {surface: lifetime-usage, aggregation: latest_agg, timing: after-billing}
  dimensions: {periods_spanned: 2}
  premium: true
  setup: {organization: {premium_integrations: [lifetime_usage]}}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-05T10:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 10}}]}
    - {at: "2024-03-10T10:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 30}}]}
    - {at: "2024-03-20T10:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 20}}]}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - {at: "2024-04-05T10:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 25}}]}
    - {at: "2024-04-10T10:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 5}}]}
    - {at: "2024-04-20T10:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 15}}]}
    - {at: "2024-05-01T01:00:00Z", do: perform_billing}
    - {at: "2024-05-01T02:00:00Z", do: fetch_current_usage}
  expect:
    invoices: 2
    invoice:
      - {select: first, fees_amount_cents: 2000, total_amount_cents: 2000}
      - {select: last, fees_amount_cents: 1500, total_amount_cents: 1500}
    lifetime_usage:
      invoiced_usage_amount_cents: 3500
      current_usage_amount_cents: 0
      external_historical_usage_amount_cents: 0
    usage: {amount_cents: 0, total_amount_cents: 0}
  math: >-
    March 10/30/20 on the 5th, 10th and 20th → latest 20 units → 2_000¢; April 25/5/15 on the same
    days → latest 15 units → 1_500¢ (LatestService, latest_service.rb:16-18, over the store's `last`
    ordered `timestamp DESC, created_at DESC`, postgres_store.rb:235). Both invoices are pinned so the
    addends are checkable, and invoiced_usage_amount_cents is 3_500¢ —
    CalculateService#calculate_invoiced_usage_amount_cents (calculate_service.rb:41-52) sums
    `fees.charge.sum(:amount_cents)` across every finalized-or-draft subscription invoice of the
    lineage.
    3_500¢ is the number that shows what lifetime usage actually accumulates. Re-running latest_agg
    over the subscription's entire history would return 15 units → 1_500¢ and be
    indistinguishable from April alone; a per-period column would give 1_500¢; reset-on-billing 0¢;
    counting the just-billed period twice 5_000¢. Current usage is 0 in the empty May period, and the
    pair — 0 on the current-usage surface, 3_500¢ on lifetime — is the assertion. A current component
    left stale at April's 1_500¢ would put the total at 5_000¢, which is exactly the double-count a
    usage threshold measured against lifetime usage would act on.

- id: b7/usage-equals-invoice/count_agg/mid-period
  block: B7
  group: cnt
  key: b07_uei_cnt_mid
  axes: {surface: usage-equals-invoice, aggregation: count_agg, timing: mid-period}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: "%{key}", properties: {amount: 10}}
        - {code: "%{key}", properties: {amount: 30}}
        - {code: "%{key}", properties: {amount: 20}}
    - {at: "2024-03-10T10:00:00Z", do: fetch_current_usage}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    usage:
      amount_cents: 300
      taxes_amount_cents: 0
      total_amount_cents: 300
      charges_usage: [{billable_metric_code: "%{key}", units: "3.0", amount_cents: 300}]
    invoices: 1
    invoice:
      fees_amount_cents: 300
      taxes_amount_cents: 0
      total_amount_cents: 300
      fees: [{fee_type: subscription, amount_cents: 0}, {fee_type: charge, units: "3.0", amount_cents: 300}]
  math: >-
    ONE derivation, asserted on BOTH surfaces. count_agg counts events, not their values
    (BillableMetrics::Aggregations::CountService:9 — event_store.count), so the three events give
    3 units, priced by ChargeModels::StandardService:8 as 3 x 1.00 = 3.00 EUR, rounded to cents at
    Fees::ChargeService:295 -> 300¢. The SAME three events would give 60 under sum_agg, 30 under
    max_agg and 20 under latest_agg, so the number is aggregation-specific rather than an artefact of
    the fixture. 300¢ is then asserted twice: as current usage read on 10 March
    (Invoices::CustomerUsageService#compute_charge_fees:120, context :current_usage) and as the charge
    fee on the invoice April's billing run produces (Invoices::CalculateFeesService:136, no usage
    context). These are two different call paths into Fees::ChargeService and nothing else in the
    suite compares them. No event is ingested after the snapshot, so the two figures MUST be equal —
    a divergence means one of the two paths mis-aggregates or mis-prices the same events, and the
    failure names which side moved. The plan is 0¢ so that invoice.fees_amount_cents carries only the
    charge and the equality is not destroyed by a legitimate subscription fee.

- id: b7/usage-equals-invoice/count_agg/period-boundary
  block: B7
  group: cnt
  key: b07_uei_cnt_bnd
  axes: {surface: usage-equals-invoice, aggregation: count_agg, timing: period-boundary}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: "%{key}", properties: {amount: 10}}
        - {code: "%{key}", properties: {amount: 30}}
        - {code: "%{key}", properties: {amount: 20}}
    - {at: "2024-03-31T23:00:00Z", do: fetch_current_usage}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    usage:
      amount_cents: 300
      taxes_amount_cents: 0
      total_amount_cents: 300
      charges_usage: [{billable_metric_code: "%{key}", units: "3.0", amount_cents: 300}]
    invoices: 1
    invoice:
      fees_amount_cents: 300
      taxes_amount_cents: 0
      total_amount_cents: 300
      fees: [{fee_type: subscription, amount_cents: 0}, {fee_type: charge, units: "3.0", amount_cents: 300}]
  math: >-
    The canonical form of the invariant for count_agg: the usage read in the LAST hour of the period
    is the number the customer sees just before being billed, and it must be the number they are
    billed. 3 events -> 3 units (CountService:9) x 1.00 (StandardService:8) = 300¢
    (Fees::ChargeService:295), asserted as current usage on 31 March 23:00 and again as the charge fee
    on the invoice produced at 01:00 on 1 April. Both reads span the identical window: current usage
    takes charges_to_datetime from Subscriptions::DatesService with current_usage: true
    (customer_usage_service.rb:162,179) which for a calendar month is end_of_month
    (monthly_service.rb:25) — the very boundary the invoice uses. A divergence here is the defect this
    block exists for: usage and invoice disagreeing over the same closed period with the same events.

- id: b7/usage-equals-invoice/count_agg/after-billing
  block: B7
  group: cnt
  key: b07_uei_cnt_ab
  axes: {surface: usage-equals-invoice, aggregation: count_agg, timing: after-billing}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: "%{key}", properties: {amount: 10}}
        - {code: "%{key}", properties: {amount: 30}}
        - {code: "%{key}", properties: {amount: 20}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - at: "2024-04-05T10:00:00Z"
      do: ingest_events
      events: [{code: "%{key}", properties: {amount: 5}}, {code: "%{key}", properties: {amount: 15}}]
    - {at: "2024-04-25T10:00:00Z", do: fetch_current_usage}
    - {at: "2024-05-01T01:00:00Z", do: perform_billing}
  expect:
    usage:
      amount_cents: 200
      taxes_amount_cents: 0
      total_amount_cents: 200
      charges_usage: [{billable_metric_code: "%{key}", units: "2.0", amount_cents: 200}]
    invoices: 2
    invoice:
      - {select: {index: 0}, fees_amount_cents: 300, total_amount_cents: 300}
      - select: {index: 1}
        fees_amount_cents: 200
        taxes_amount_cents: 0
        total_amount_cents: 200
        fees: [{fee_type: subscription, amount_cents: 0}, {fee_type: charge, units: "2.0", amount_cents: 200}]
  math: >-
    What the invariant MEANS once an invoice exists: usage is per-period, so the read taken after
    March was billed must describe April alone, and it must equal the invoice April then produces.
    March's 3 events -> 3 units -> 300¢ on invoice[index=0]; April's 2 events -> 2 units
    (CountService:9) x 1.00 (StandardService:8) = 200¢ (Fees::ChargeService:295), asserted BOTH as the
    usage read on 25 April — after the March invoice exists — and as the charge fee on
    invoice[index=1]. Both April figures are 200 and not 500: current usage takes
    charges_from_datetime from the CURRENT period (customer_usage_service.rb:162) and the metric is
    non-recurring, so March's units do not carry. If either surface reported 500 the customer would be
    charged twice for March on one side of the product and not the other — asserting the two together
    is what makes a one-sided leak visible.

- id: b7/usage-equals-invoice/count_agg/after-termination
  block: B7
  group: cnt
  key: b07_uei_cnt_at
  axes: {surface: usage-equals-invoice, aggregation: count_agg, timing: after-termination}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: "%{key}", properties: {amount: 10}}
        - {code: "%{key}", properties: {amount: 30}}
        - {code: "%{key}", properties: {amount: 20}}
    - {at: "2024-03-20T10:00:00Z", do: fetch_current_usage}
    - {at: "2024-03-20T12:00:00Z", do: terminate_subscription}
  expect:
    usage:
      amount_cents: 300
      taxes_amount_cents: 0
      total_amount_cents: 300
      charges_usage: [{billable_metric_code: "%{key}", units: "3.0", amount_cents: 300}]
    invoices: 1
    invoice: {fees_amount_cents: 300, taxes_amount_cents: 0, total_amount_cents: 300}
  math: >-
    The final usage read and the final invoice. 3 events -> 3 units (CountService:9) x 1.00
    (StandardService:8) = 300¢ (Fees::ChargeService:295), asserted as the last usage read the customer
    can obtain and again as the termination invoice. The read is taken at 10:00 and the DELETE at
    12:00 on purpose: GET current_usage resolves the subscription through
    Customer#active_subscriptions (customer.rb:216), so once terminated the endpoint answers
    no_active_subscription and there is no usage surface left to compare — the last obtainable read IS
    the one that must match. The two windows are not identical (usage still ends at the period end,
    the invoice ends at terminated_at, dates_service.rb:117), but count_agg depends only on WHICH
    events fall inside, and every event is before 20 March, so the two must agree exactly. The plan is
    0¢, so invoice.fees_amount_cents carries only the charge and equals the usage figure directly.

