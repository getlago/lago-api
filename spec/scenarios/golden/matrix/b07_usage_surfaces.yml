      fees: [{fee_type: subscription, amount_cents: 0}, {fee_type: charge, units: "32.0", amount_cents: 3200}]
  math: >-
    The canonical invariant for the one aggregation that is a function of TIME as well as of values.
    April 2024, 30-day period: running total 0 for the 6 days to the 7th contributes 0; 10 for the 6
    days to the 13th gives 10x6/30 = 2; 40 for the 9 days to the 22nd gives 40x9/30 = 12; 60 for the
