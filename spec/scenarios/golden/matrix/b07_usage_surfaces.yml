    - {at: "2024-04-13T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 30}}]}
    - {at: "2024-04-22T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 20}}]}
    - {at: "2024-04-30T23:00:00Z", do: fetch_current_usage}
    - {at: "2024-05-01T01:00:00Z", do: perform_billing}
  expect:
    usage:
      amount_cents: 3200
      taxes_amount_cents: 0
      total_amount_cents: 3200
      charges_usage: [{billable_metric_code: "%{key}", units: "32.0", amount_cents: 3200}]
