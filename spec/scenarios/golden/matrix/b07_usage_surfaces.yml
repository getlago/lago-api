    March sums 10 + 30 + 20 = 60 -> 6_000¢ on invoice[index=0]. April sums 5 + 15 + 25 = 45 units
    (SumService:22) x 1.00 (StandardService:8) = 4_500¢ (Fees::ChargeService:295), and 4_500 is the
