    (charges_to_datetime = end_of_month on both paths, customer_usage_service.rb:162 and
    monthly_service.rb:25) and the same 30-day denominator (monthly_service.rb:35), so any difference
    is a difference in the integral itself. calendar_sensitive: the 30-day period is the arithmetic.

- id: b7/usage-equals-invoice/weighted_sum_agg/after-billing
  block: B7
  group: wsum
  key: b07_uei_wsum_ab
  axes: {surface: usage-equals-invoice, aggregation: weighted_sum_agg, timing: after-billing}
  dimensions: {period_days: 30}
  runners: [rspec]
  calendar_sensitive: true
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-06T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 31}}]}
    - {at: "2024-03-16T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 93}}]}
    - {at: "2024-03-21T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 62}}]}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - {at: "2024-04-05T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 10}}]}
    - {at: "2024-04-11T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 30}}]}
    - {at: "2024-04-17T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 20}}]}
    - {at: "2024-04-25T10:00:00Z", do: fetch_current_usage}
    - {at: "2024-05-01T01:00:00Z", do: perform_billing}
  expect:
    usage:
      amount_cents: 3800
      taxes_amount_cents: 0
      total_amount_cents: 3800
      charges_usage: [{billable_metric_code: "%{key}", units: "38.0", amount_cents: 3800}]
    invoices: 2
    invoice:
      - {select: {index: 0}, fees_amount_cents: 9600, total_amount_cents: 9600}
      - select: {index: 1}
        fees_amount_cents: 3800
        taxes_amount_cents: 0
        total_amount_cents: 3800
        fees: [{fee_type: subscription, amount_cents: 0}, {fee_type: charge, units: "38.0", amount_cents: 3800}]
  math: >-
    March (31-day period, denominator 31 days, monthly_service.rb:35): running total 0 for 5 days = 0;
    31 for the 10 days to the 16th = 31x10/31 = 10; 124 for the 5 days to the 21st = 124x5/31 = 20;
    186 for the 11 days to 1 April = 186x11/31 = 66. Total 96 units -> 9_600¢ on invoice[index=0]. The
    values 31/93/62 are chosen so every March segment divides exactly by 31. April (30-day period):
    0 for 4 days; 10 for the 6 days to the 11th = 2; 40 for the 6 days to the 17th = 8; 60 for the 14
    days to 1 May = 28. Total 38 units (WeightedSumService:16, WeightedSumQuery:115) x 1.00
    (StandardService:8) = 3_800¢ (Fees::ChargeService:295) — the single number asserted as the usage
    read on 25 April, after the March invoice exists, and as the charge fee on invoice[index=1]. The
    reset is the point: the metric is non-recurring, so WeightedSumService#initial_value returns 0
    rather than March's closing level of 186 (weighted_sum_service.rb:89-92). If either surface
    carried it, April would read 186x(period)/30 + 38, roughly 224 units, and asserting both surfaces
    is what makes a one-sided carry-over visible. calendar_sensitive: the 31- and 30-day denominators
    are the arithmetic.

- id: b7/usage-equals-invoice/weighted_sum_agg/after-termination
  block: B7
  group: wsum
  key: b07_uei_wsum_at
  axes: {surface: usage-equals-invoice, aggregation: weighted_sum_agg, timing: after-termination}
  dimensions: {period_days: 30}
  runners: [rspec]
  calendar_sensitive: true
  timeline:
    - {at: "2024-04-01T00:00:00Z", do: create_subscription}
    - {at: "2024-04-04T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 10}}]}
    - {at: "2024-04-10T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 30}}]}
    - {at: "2024-04-19T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: -40}}]}
    - {at: "2024-04-25T11:00:00Z", do: fetch_current_usage}
    - {at: "2024-04-25T12:00:00Z", do: terminate_subscription}
  expect:
    usage:
      amount_cents: 1400
      taxes_amount_cents: 0
      total_amount_cents: 1400
      charges_usage: [{billable_metric_code: "%{key}", units: "14.0", amount_cents: 1400}]
    invoices: 1
    invoice: {fees_amount_cents: 1400, taxes_amount_cents: 0, total_amount_cents: 1400}
  math: >-
    The only construction in which a weighted-sum usage read and a TERMINATION invoice can be equal at
    all, which is why the fixture looks the way it does. The two surfaces disagree about the window's
    end — usage still runs to end_of_month (customer_usage_service.rb:162, monthly_service.rb:25)
    while a terminated period ends at terminated_at (dates_service.rb:117) — and a weighted sum is an
    integral over that window, so any non-zero running total at the read instant would make the two
    figures legitimately different. Here the third event, -40, returns the running total to 0 on 19
    April, so every segment after it contributes 0 whether the window closes on 25 April or on 1 May.
    What is left is exact and identical on both paths: 0 for 3 days; 10 for the 6 days to the 10th =
    10x6/30 = 2; 40 for the 9 days to the 19th = 40x9/30 = 12; 0 thereafter. Total 14 units
    (WeightedSumService:16, WeightedSumQuery#period_ratio_sql:115, denominator 30 days from
    monthly_service.rb:35 — computed from the period start, so termination does not shorten it) x 1.00
    (StandardService:8) = 1_400¢ (Fees::ChargeService:295). The read is at 11:00 and the DELETE at
    12:00 because current_usage resolves through Customer#active_subscriptions (customer.rb:216) and
    answers nothing once the subscription is terminated. Trade-off stated plainly: with a zero tail
    this row cannot detect a wrong DENOMINATOR, only a wrong integral or a wrong window — the
    non-terminated rows above carry the denominator. calendar_sensitive: April's 30 days are the
    arithmetic.

- id: b07/hns/current-usage/sum_agg/after-termination
  block: B7
  group: sum
  key: b07_hns_cu
  axes: {surface: current-usage, aggregation: sum_agg, timing: after-termination}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-05T10:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 30}}]}
    - {at: "2024-03-10T10:00:00Z", do: terminate_subscription}
    - {at: "2024-03-10T11:00:00Z", do: fetch_current_usage}
  expect: {error: {stage: usage, status: 405, code: no_active_subscription}}
  note: >-
    The `after-termination` cell of the current-usage surface is a REFUSAL, and that refusal is the
    only thing there is to assert — so the row states it as one rather than pretending a number
    exists. Invoices::CustomerUsageService resolves the subscription through
    Customer#active_subscriptions (customer.rb:216 via customer_usage_service.rb:36), which scopes to
    status active; once the DELETE has terminated it the lookup finds nothing and :52 answers
    not_allowed_failure!(code: "no_active_subscription") → HTTP 405 (api_errors.rb:49-58). The 30
    units ingested before termination are deliberately present: they prove the refusal is about the
    subscription's STATE and not about there being no usage to report. The alternative outcomes are
    both nameable and both wrong — a 200 with the pre-termination usage (which the six
    usage-equals-invoice/*/after-termination rows show is what the LAST legal read returns), or a 404
    on the customer. Asserted through expect.error at the `usage` stage, which is the read this row
    exists to name.

- id: b07/hns/lifetime-usage/sum_agg/after-termination
  block: B7
  group: sum
  key: b07_hns_lt
  axes: {surface: lifetime-usage, aggregation: sum_agg, timing: after-termination}
  dimensions: {periods_spanned: 2}
  premium: true
  characterization: true
  setup: {organization: {premium_integrations: [lifetime_usage]}}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-05T10:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 30}}]}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - {at: "2024-04-05T10:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 20}}]}
    - {at: "2024-04-10T10:00:00Z", do: terminate_subscription}
    - {at: "2024-04-11T01:00:00Z", do: perform_usage_update}
  expect:
    invoices: 2
    invoice:
      - {select: first, fees_amount_cents: 3000, total_amount_cents: 3000}
      - {select: last, fees_amount_cents: 2000, total_amount_cents: 2000}
    lifetime_usage:
      select: {status: terminated}
      invoiced_usage_amount_cents: 3000
      current_usage_amount_cents: 0
      external_historical_usage_amount_cents: 0
  math: >-
    CHARACTERIZATION, and the number is the finding. Two invoices exist and the row pins both: March's
    30 units → 3_000¢ from the 1 April billing run, and April's 20 units → 2_000¢ on the termination
    invoice. The lineage total is therefore 5_000¢, which is what
    CalculateService#calculate_invoiced_usage_amount_cents would return — it sums
    `fees.charge.sum(:amount_cents)` over every finalized-or-draft subscription invoice of the
    external_id/subscription_at lineage (calculate_service.rb:41-52) and the termination invoice is
    one of them. It is never asked. :17-20 returns EARLY for any subscription that is not active,
    clearing recalculate_invoiced_usage and recalculate_current_usage without recomputing either, so
    the column keeps the 3_000¢ it was last given on 1 April and the 2_000¢ of terminal usage never
    reaches it. The explicit perform_usage_update on 11 April is there to prove the point rather than
    to fix it: even a deliberate refresh after termination cannot move the number. So 3_000¢ records
    what Lago does and 5_000¢ is what the field claims to mean — a subscription's lifetime invoiced
    usage permanently understates it by whatever the termination invoice carried. Read with
    `select: {status: terminated}` because subscriptions/base_controller.rb:20 defaults the lookup to
    status active and answers 404 otherwise.

# The 10 cells this file did not contain until the rows appended below it, and what changed — current-usage and lifetime-usage at
# timing: after-termination, six aggregations each, of which sum_agg is written above. Both were
# blocked on the READ rather than on the arithmetic, so the gap was identical for every aggregation
# and no aggregation could be rescued; both reads now exist and the remaining ten cells are ordinary
# writing work.
#
# current-usage: customer_usage_service.rb:36 resolves the subscription through
# Customer#active_subscriptions (customer.rb:216), so once terminated :52 answers
# MethodNotAllowedFailure `no_active_subscription` (HTTP 405, api_errors.rb:119 — see
# customer_usage_service_spec.rb:388). golden_snapshot_usage kept fetch_current_usage's default
# raise_on_error and expect.error's stages were setup-only, so the 405 could not be asserted; it is
# now a `usage` stage of expect.error, asserted at the fetch_current_usage step itself. The last
# obtainable 200 read is still pinned by the six usage-equals-invoice/*/after-termination rows above.
#
# lifetime-usage: assert_golden_lifetime_usage GETs
# /subscriptions/:external_id/lifetime_usage, and subscriptions/base_controller.rb:20 defaults to
# `status: :active` — 404 after termination. The endpoint needs `?status=terminated`
# (lifetime_usages_controller_spec.rb:79), now expressible as `expect.lifetime_usage.select`. The
# behaviour the cells pin is real and was invisible: calculate_service.rb:17-20 clears both refresh
# flags without recalculating once the subscription is inactive, so the termination invoice never
# reaches invoiced_usage_amount_cents — recorded by the characterization row above.
#
# Deliberately NOT faked with an upgrade, then or now. An upgrade terminates the previous
# subscription and leaves an ACTIVE one under the same external_id, which both reads then resolve to
# — that pins upgrade lineage (subscription.rb:127 moves the LifetimeUsage row to the new
# subscription), not usage after a termination, and it would make `after-termination` mean two
# different things in one block.

# The ten cells the comment above names, closed. The current-usage five assert the 405 through
# expect.error's `usage` stage; the lifetime-usage five read the surface through
# expect.lifetime_usage.select and are characterization rows, each recording the same defect with its
# own aggregation's numbers.

- id: b07/current-usage/count_agg/after-termination
  block: B7
  group: cnt
  key: b07_at_cu_count
  axes: {surface: current-usage, aggregation: count_agg, timing: after-termination}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: "%{key}", properties: {amount: 10}}
        - {code: "%{key}", properties: {amount: 30}}
        - {code: "%{key}", properties: {amount: 20}}
        - {code: "%{key}", properties: {amount: 30}}
    - {at: "2024-03-10T10:00:00Z", do: terminate_subscription}
    - {at: "2024-03-10T11:00:00Z", do: fetch_current_usage}
  expect: {error: {stage: usage, status: 405, code: no_active_subscription}}
  note: >-
    The refusal PRECEDES the aggregation, and that is the honest content of this cell:
    CustomerUsageService.with_external_ids resolves the subscription through
    Customer#active_subscriptions (customer_usage_service.rb:36 → customer.rb:216) before any charge
    is priced, so `subscription.blank?` at :52 answers not_allowed_failure!(code:
    "no_active_subscription") → HTTP 405 with the metric never consulted. All five current-usage
    after-termination rows therefore carry the SAME expectation and differ only in what a wrong 200
    would say — which is exactly why each is written rather than one standing in for all: the four
    events ingested before the DELETE are what make this row's counterfactual 4 units / 400¢
    (count_agg counts events, count_service.rb:9-11, not the 90 their amounts sum to), so a
    regression that resolved through `subscriptions` instead of `active_subscriptions` fails here
    with a number attributable to count_agg. The events also prove the 405 is about the
    subscription's STATE and not about there being nothing to report. The last obtainable 200 read
    for count_agg is pinned by b7/usage-equals-invoice/count_agg/after-termination above.

- id: b07/current-usage/max_agg/after-termination
  block: B7
  group: max
  key: b07_at_cu_max
  axes: {surface: current-usage, aggregation: max_agg, timing: after-termination}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: "%{key}", properties: {amount: 10}}
        - {code: "%{key}", properties: {amount: 40}}
        - {code: "%{key}", properties: {amount: 25}}
    - {at: "2024-03-10T10:00:00Z", do: terminate_subscription}
    - {at: "2024-03-10T11:00:00Z", do: fetch_current_usage}
  expect: {error: {stage: usage, status: 405, code: no_active_subscription}}
  note: >-
    Same 405 as its four siblings, reached at customer_usage_service.rb:52 because :36 resolves
    through Customer#active_subscriptions (customer.rb:216) and the DELETE has already moved the
    subscription out of that scope. The aggregation axis is inert at this cell by construction — the
    lookup fails before MaxService is instantiated — so what this row contributes is the
    max-attributable counterfactual: 10/40/25 with the largest in the middle would have priced
    max(10, 40, 25) = 40 units → 4_000¢ (max_service.rb:16-18), not the 75 a sum gives nor the 25 a
    latest gives. A 200 here fails with a number that names which aggregation ran. Deliberately NOT
    written as an upgrade, which would leave an ACTIVE subscription under the same external_id and
    make the read succeed against the new one.

- id: b07/current-usage/unique_count_agg/after-termination
  block: B7
  group: uniq-sub
  key: b07_at_cu_uniq
  axes: {surface: current-usage, aggregation: unique_count_agg, timing: after-termination}
  dimensions: {recurring: false}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-03T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {sub_id: s1}}]}
    - {at: "2024-03-04T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {sub_id: s2}}]}
    - {at: "2024-03-05T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {sub_id: s1}}]}
    - {at: "2024-03-06T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {sub_id: s3}}]}
    - at: "2024-03-07T00:00:00Z"
      do: ingest_events
      events: [{code: "%{key}", properties: {sub_id: s2, operation_type: remove}}]
    - {at: "2024-03-10T10:00:00Z", do: terminate_subscription}
    - {at: "2024-03-10T11:00:00Z", do: fetch_current_usage}
  expect: {error: {stage: usage, status: 405, code: no_active_subscription}}
  note: >-
    405 at customer_usage_service.rb:52, the subscription having left
    Customer#active_subscriptions (customer.rb:216) on termination — the read never reaches
    UniqueCountService, so the aggregation axis cannot change the outcome and this row's value is
    the counterfactual it makes attributable. The five events form the signed add/remove ledger
    (unique_count_query.rb:276-287): s1 = +1 then 0 for the repeat, s2 = +1 then -1 on the 7th, s3
    = +1, so a wrong 200 would report 2 units / 200¢ and not the 5 a count gives nor the 3 a
    COUNT(DISTINCT) that ignored the removal gives. `recurring: false` is explicit so the ledger is
    confined to this period (unique_count_service.rb:10) and the counterfactual is a period number
    rather than a lifetime one.

- id: b07/current-usage/weighted_sum_agg/after-termination
  block: B7
  group: wsum-nr
  key: b07_at_cu_wsum
  axes: {surface: current-usage, aggregation: weighted_sum_agg, timing: after-termination}
  dimensions: {recurring: false}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-03T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 31}}]}
    - {at: "2024-03-05T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 62}}]}
    - {at: "2024-03-08T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 31}}]}
    - {at: "2024-03-10T10:00:00Z", do: terminate_subscription}
    - {at: "2024-03-10T11:00:00Z", do: fetch_current_usage}
  expect: {error: {stage: usage, status: 405, code: no_active_subscription}}
  note: >-
    405 at customer_usage_service.rb:52 via the active_subscriptions lookup at :36
    (customer.rb:216). weighted_sum is the aggregation this cell loses most: it is the only one
    whose value depends on WHEN the read happens rather than only on the events, because
    WeightedSumQuery integrates the running total against a synthetic end-of-period row
    (weighted_sum_query.rb:68-100) and current usage keeps that bound at the month end even
    mid-period (customer_usage_service.rb:162-180). No number is stated here, and that is
    deliberate rather than lazy: the read is unobtainable after termination, so any figure would be
    unverifiable — the arithmetic itself is carried by b07/current-usage/weighted_sum_agg/mid-period
    and /period-boundary above, and the terminated-period integral by
    b7/usage-equals-invoice/weighted_sum_agg/after-termination. What this row pins is that the
    surface refuses rather than answering with a truncated or a full-month integral, either of which
    would be a defensible-looking 200. The three events (running total 31 → 93 → 124) exist so the
    refusal cannot be confused with an empty period. `runners` includes `live` because nothing here
    is a date-dependent amount — there is no amount at all — so the live runner's timeline shift
    cannot invalidate it, which is why this row is not calendar_sensitive while its mid-period
    sibling is.

- id: b07/current-usage/latest_agg/after-termination
  block: B7
  group: lat
  key: b07_at_cu_latest
  axes: {surface: current-usage, aggregation: latest_agg, timing: after-termination}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-03T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 10}}]}
    - {at: "2024-03-05T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 30}}]}
    - {at: "2024-03-07T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 20}}]}
    - {at: "2024-03-10T10:00:00Z", do: terminate_subscription}
    - {at: "2024-03-10T11:00:00Z", do: fetch_current_usage}
  expect: {error: {stage: usage, status: 405, code: no_active_subscription}}
  note: >-
    405 at customer_usage_service.rb:52; :36 resolves through Customer#active_subscriptions
    (customer.rb:216) and a terminated subscription is not in it. The aggregation never runs, so
    this row's job is to make the counterfactual latest-attributable: 10, 30, 20 at strictly
    increasing timestamps in three SEPARATE steps (events sharing one step share its instant and
    the ordering would rest on created_at alone) means a wrong 200 would report LatestService's
    `event_store.last` = 20 units → 2_000¢ (latest_service.rb:16-18,
    postgres_store.rb:233-237) — distinguishable at a glance from a sum's 60, a max's 30, a
    first-seen 10 and a count's 3. The 20 is neither the largest nor the smallest so "latest" cannot
    be satisfied by accident. Note that termination is what makes latest_agg's read unobtainable
    forever rather than merely stale: unlike the invoiced path there is no terminal snapshot on this
    surface.

- id: b07/lifetime-usage/count_agg/after-termination
  block: B7
  group: cnt
  key: b07_at_lt_count
  axes: {surface: lifetime-usage, aggregation: count_agg, timing: after-termination}
  dimensions: {periods_spanned: 2}
  premium: true
  characterization: true
  setup: {organization: {premium_integrations: [lifetime_usage]}}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: "%{key}", properties: {amount: 10}}
        - {code: "%{key}", properties: {amount: 30}}
        - {code: "%{key}", properties: {amount: 20}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - at: "2024-04-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: "%{key}", properties: {amount: 10}}
        - {code: "%{key}", properties: {amount: 10}}
        - {code: "%{key}", properties: {amount: 40}}
        - {code: "%{key}", properties: {amount: 40}}
    - {at: "2024-04-10T10:00:00Z", do: terminate_subscription}
    - {at: "2024-04-11T01:00:00Z", do: perform_usage_update}
  expect:
    invoices: 2
    invoice:
      - {select: first, fees_amount_cents: 300, total_amount_cents: 300}
      - {select: last, fees_amount_cents: 400, total_amount_cents: 400}
    lifetime_usage:
      select: {status: terminated}
      invoiced_usage_amount_cents: 300
      current_usage_amount_cents: 0
      external_historical_usage_amount_cents: 0
  math: >-
    CHARACTERIZATION with count_agg's numbers. count_agg counts EVENTS
    (count_service.rb:9-11), so March's 3 events are 3 units → 300¢ on the 1 April run and April's
    4 events are 4 units → 400¢ on the termination invoice; both are asserted so the addends are
    checkable apart from the sum. What the row records is that
    invoiced_usage_amount_cents stays at 300¢. The field's own definition says 700¢:
    CalculateService#calculate_invoiced_usage_amount_cents sums `invoice.fees.charge.sum(:amount_cents)`
    over EVERY finalized-or-draft subscription invoice of the external_id/subscription_at lineage
    (calculate_service.rb:41-52) and the termination invoice is one of them. It is never asked —
    :17-20 returns early for a subscription that is not active, clearing recalculate_invoiced_usage
    and recalculate_current_usage without recomputing either, so the column keeps the 300¢ it was
    last given on 1 April. The explicit perform_usage_update on 11 April proves the point rather
    than fixing it. The alternatives are all nameable and all different from 300: 700¢ if the
    lineage were re-summed, 400¢ if only the last invoice counted, 0¢ if the row were reset on
    termination. The amounts are deliberately unequal across the two periods (3 events then 4) so
    "kept the first period" and "took the last period" cannot both be satisfied by one number.
    current_usage_amount_cents is 0 and is asserted rather than omitted: April's usage was billed
    out by the termination invoice and a stale current component would double-count it. Read with
    `select: {status: terminated}` because subscriptions/base_controller.rb:20 defaults the lookup
    to status active and 404s otherwise.

- id: b07/lifetime-usage/max_agg/after-termination
  block: B7
  group: max
  key: b07_at_lt_max
  axes: {surface: lifetime-usage, aggregation: max_agg, timing: after-termination}
  dimensions: {periods_spanned: 2}
  premium: true
  characterization: true
  setup: {organization: {premium_integrations: [lifetime_usage]}}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: "%{key}", properties: {amount: 10}}
        - {code: "%{key}", properties: {amount: 40}}
        - {code: "%{key}", properties: {amount: 25}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - at: "2024-04-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: "%{key}", properties: {amount: 15}}
        - {code: "%{key}", properties: {amount: 55}}
        - {code: "%{key}", properties: {amount: 5}}
    - {at: "2024-04-10T10:00:00Z", do: terminate_subscription}
    - {at: "2024-04-11T01:00:00Z", do: perform_usage_update}
  expect:
    invoices: 2
    invoice:
      - {select: first, fees_amount_cents: 4000, total_amount_cents: 4000}
      - {select: last, fees_amount_cents: 5500, total_amount_cents: 5500}
    lifetime_usage:
      select: {status: terminated}
      invoiced_usage_amount_cents: 4000
      current_usage_amount_cents: 0
      external_historical_usage_amount_cents: 0
  math: >-
    CHARACTERIZATION with max_agg's numbers, and this row is the one where the four candidate
    readings are furthest apart. max is per PERIOD, never across the lifetime: MaxService takes
    `event_store.max` inside the period window (max_service.rb:16-18), so March gives
    max(10, 40, 25) = 40 units → 4_000¢ and April gives max(15, 55, 5) = 55 units → 5_500¢ on the
    termination invoice. April's maximum is deliberately LARGER than March's, which is what makes
    the row discriminate: invoiced_usage_amount_cents stays at 4_000¢ (what it was given on 1 April,
    calculate_service.rb:17-20 returning early once the subscription is inactive and clearing both
    refresh flags without recomputing), whereas 9_500¢ is what
    calculate_invoiced_usage_amount_cents would return over the lineage
    (calculate_service.rb:41-52), 5_500¢ is what both "only the last invoice" AND "max over the
    whole life" would give, and 0¢ is what a reset on termination would give. Had April's max been
    the smaller of the two, 4_000¢ would have been indistinguishable from a lifetime max and the row
    would have proved nothing about the defect. current_usage_amount_cents is 0 — April's 5_500¢ was
    invoiced out and no recalculation can run after termination. `select: {status: terminated}` is
    required by subscriptions/base_controller.rb:20.

- id: b07/lifetime-usage/unique_count_agg/after-termination
  block: B7
  group: uniq-sub
  key: b07_at_lt_uniq
  axes: {surface: lifetime-usage, aggregation: unique_count_agg, timing: after-termination}
  dimensions: {recurring: false, periods_spanned: 2}
  premium: true
  characterization: true
  setup: {organization: {premium_integrations: [lifetime_usage]}}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-03T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {sub_id: s1}}]}
    - {at: "2024-03-04T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {sub_id: s2}}]}
    - {at: "2024-03-05T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {sub_id: s1}}]}
    - {at: "2024-03-06T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {sub_id: s3}}]}
    - at: "2024-03-07T00:00:00Z"
      do: ingest_events
      events: [{code: "%{key}", properties: {sub_id: s2, operation_type: remove}}]
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - {at: "2024-04-03T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {sub_id: s4}}]}
    - {at: "2024-04-05T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {sub_id: s5}}]}
    - {at: "2024-04-07T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {sub_id: s6}}]}
    - {at: "2024-04-10T10:00:00Z", do: terminate_subscription}
    - {at: "2024-04-11T01:00:00Z", do: perform_usage_update}
  expect:
    invoices: 2
    invoice:
      - {select: first, fees_amount_cents: 200, total_amount_cents: 200}
      - {select: last, fees_amount_cents: 300, total_amount_cents: 300}
    lifetime_usage:
      select: {status: terminated}
      invoiced_usage_amount_cents: 200
      current_usage_amount_cents: 0
      external_historical_usage_amount_cents: 0
  math: >-
    CHARACTERIZATION with unique_count_agg's numbers. March is the signed add/remove ledger
    (unique_count_query.rb:276-287, operation_type defaulting to `add`,
    postgres_store.rb:598-599): s1 = +1 then 0 for the repeat, s2 = +1 then -1 on the 7th, s3 = +1
    → 2 units → 200¢, from five events, so a count_agg regression would show 500¢ and a naive
    COUNT(DISTINCT) that ignored the removal 300¢. April uses three FRESH ids s4/s5/s6 → 3 units →
    300¢ on the termination invoice; the ids are fresh rather than reused so the number cannot
    depend on whether the ledger carried over, and `recurring: false` sets use_from_boundary = true
    (unique_count_service.rb:10) confining each period's ledger to itself. The defect:
    invoiced_usage_amount_cents holds 200¢ — the value written on 1 April — because
    calculate_service.rb:17-20 returns early for an inactive subscription and clears both refresh
    flags without recomputing, so the 300¢ the termination invoice carried never reaches the column
    even though calculate_invoiced_usage_amount_cents would include it (:41-52 → 500¢). 300¢ would
    mean only-the-last-invoice, 0¢ a reset. current_usage_amount_cents is 0. Read with
    `select: {status: terminated}` (subscriptions/base_controller.rb:20).

- id: b07/lifetime-usage/weighted_sum_agg/after-termination
  block: B7
  group: wsum-nr
  key: b07_at_lt_wsum
  axes: {surface: lifetime-usage, aggregation: weighted_sum_agg, timing: after-termination}
  dimensions: {recurring: false, periods_spanned: 2}
  runners: [rspec]
  premium: true
  characterization: true
  calendar_sensitive: true
  setup: {organization: {premium_integrations: [lifetime_usage]}}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-05T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 31}}]}
    - {at: "2024-03-11T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 62}}]}
    - {at: "2024-03-19T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 31}}]}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - {at: "2024-04-03T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 15}}]}
    - {at: "2024-04-07T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 30}}]}
    - {at: "2024-04-11T00:00:00Z", do: terminate_subscription}
    - {at: "2024-04-12T01:00:00Z", do: perform_usage_update}
  expect:
    invoices: 2
    invoice:
      - {select: first, fees_amount_cents: 8200, total_amount_cents: 8200}
      - {select: last, fees_amount_cents: 800, total_amount_cents: 800}
    lifetime_usage:
      select: {status: terminated}
      invoiced_usage_amount_cents: 8200
      current_usage_amount_cents: 0
      external_historical_usage_amount_cents: 0
  math: >-
    CHARACTERIZATION with weighted_sum_agg's numbers, and the two periods use DIFFERENT denominators
    on purpose. WeightedSumQuery inserts a synthetic row at from_datetime carrying initial_value and
    one at to_datetime carrying 0 (weighted_sum_query.rb:68-100, :93-99), then sums
    cumulative_sum x seconds_to_next_row / charges_duration.days (:102-119); the trailing row's own
    span is zero and the CASE at :105-107 zeroes it. initial_value is 0 in both periods because the
    metric is not recurring (weighted_sum_service.rb:91-95). Every event value is chosen so its term
    divides exactly and no rounding is in question.
    MARCH, denominator 31 days: 03-01→03-05 running total 0 (4 days, 0); 03-05→03-11 total 31 for 6
    days = 31x6/31 = 6; 03-11→03-19 total 93 for 8 days = 93x8/31 = 24; 03-19→04-01 total 124 for 13
    days = 124x13/31 = 52. Total 82 units → 8_200¢ (standard_service.rb:7-9). A plain sum would give
    124 (12_400¢), max 62 (6_200¢), latest 31 (3_100¢).
    APRIL, the TERMINATION invoice: charges_to_datetime is clamped to terminated_at
    (dates_service.rb:117-122) so the window is 04-01→04-11, but charges_duration_in_days is the
    WHOLE period (dates_service.rb:202 → monthly_service.rb:35-41 measures from the period start),
    so the denominator is 30 days and not the 10 the window spans. 04-01→04-03 total 0 (2 days, 0);
    04-03→04-07 total 15 for 4 days = 15x4/30 = 2; 04-07→04-11 total 45 for 4 days = 45x4/30 = 6.
    Total 8 units → 800¢. An implementation that used the truncated window as its denominator would
    give 8 x 30/10 = 24 units (2_400¢) — that mismatch between window and denominator is the whole
    reason this cell is worth an assertion.
    THE DEFECT: invoiced_usage_amount_cents holds 8_200¢, the value written by the 1 April run,
    because calculate_service.rb:17-20 returns early once the subscription is inactive and clears
    both refresh flags without recomputing; calculate_invoiced_usage_amount_cents (:41-52) would sum
    the lineage to 9_000¢. 800¢ would mean only-the-last-invoice, 0¢ a reset.
    current_usage_amount_cents is 0. calendar_sensitive because March's 31 days and April's 30 ARE
    the arithmetic, hence rspec only. Read with `select: {status: terminated}`
    (subscriptions/base_controller.rb:20).

- id: b07/lifetime-usage/latest_agg/after-termination
  block: B7
  group: lat
  key: b07_at_lt_latest
  axes: {surface: lifetime-usage, aggregation: latest_agg, timing: after-termination}
  dimensions: {periods_spanned: 2}
  premium: true
  characterization: true
  setup: {organization: {premium_integrations: [lifetime_usage]}}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-05T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 10}}]}
    - {at: "2024-03-10T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 30}}]}
    - {at: "2024-03-20T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 20}}]}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - {at: "2024-04-03T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 40}}]}
    - {at: "2024-04-07T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 5}}]}
    - {at: "2024-04-10T10:00:00Z", do: terminate_subscription}
    - {at: "2024-04-11T01:00:00Z", do: perform_usage_update}
  expect:
    invoices: 2
    invoice:
      - {select: first, fees_amount_cents: 2000, total_amount_cents: 2000}
      - {select: last, fees_amount_cents: 500, total_amount_cents: 500}
    lifetime_usage:
      select: {status: terminated}
      invoiced_usage_amount_cents: 2000
      current_usage_amount_cents: 0
      external_historical_usage_amount_cents: 0
  math: >-
    CHARACTERIZATION with latest_agg's numbers. LatestService takes `event_store.last`, the
    in-window event ordered `timestamp DESC, created_at DESC` (latest_service.rb:16-18,
    postgres_store.rb:233-237), so March's 10/30/20 give 20 units → 2_000¢ and April's 40/5 give 5
    units → 500¢ on the termination invoice. Each event is its own step because events sharing a
    step share its instant and the ordering would then rest on created_at alone. Within March the 20
    is neither largest nor smallest, so a sum (60 → 6_000¢), a max (30 → 3_000¢) or a first-seen (10
    → 1_000¢) is visible against it; April's last value 5 is the SMALLEST of the whole life, which
    is what keeps the four candidate lifetime readings apart. The defect:
    invoiced_usage_amount_cents holds 2_000¢, written on 1 April, because
    calculate_service.rb:17-20 returns early for an inactive subscription and clears both refresh
    flags without recomputing. calculate_invoiced_usage_amount_cents (:41-52) would sum the lineage
    to 2_500¢; only-the-last-invoice would give 500¢, "latest across the whole life" also 500¢, a
    reset 0¢. current_usage_amount_cents is 0 — April's usage left on the termination invoice and no
    recalculation can run afterwards, as the explicit perform_usage_update on 11 April demonstrates
    rather than repairs. Read with `select: {status: terminated}`
    (subscriptions/base_controller.rb:20).
