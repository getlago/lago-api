    - {at: "2024-04-10T10:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 15}}]}
    - {at: "2024-04-20T10:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 25}}]}
    - {at: "2024-04-25T10:00:00Z", do: perform_usage_update}
    - {at: "2024-04-25T11:00:00Z", do: fetch_current_usage}
  expect:
    invoices: 1
    lifetime_usage:
      invoiced_usage_amount_cents: 3000
      current_usage_amount_cents: 2500
      external_historical_usage_amount_cents: 0
    usage:
      amount_cents: 2500
      total_amount_cents: 2500
      charges_usage: [{billable_metric_code: "%{key}", units: "25.0", amount_cents: 2500}]
  math: >-
    max_agg is where lifetime usage's real definition shows: units do NOT accumulate but MONEY does.
    March max(10, 30, 20) = 30 units → 3_000¢ (sum would give 60, latest 20 — the largest value sits
    in the middle of the three so a regression to either neighbour changes the answer). April
    max(5, 15, 25) = 25 units → 2_500¢.
    Nothing anywhere adds 30 and 25 into a 55-unit maximum: CalculateService#
    calculate_invoiced_usage_amount_cents (calculate_service.rb:41-52) accumulates
    `fees.charge.sum(:amount_cents)` — CENTS off already-priced fees — so invoiced_usage is 3_000¢
    and, once April is billed too, becomes 5_500¢. That is the derivation a reader most needs: a
    lifetime figure built by re-aggregating raw events over the subscription's whole life would
    report max(10,30,20,5,15,25) = 30 units → 3_000¢ for the two periods together, and would be
    indistinguishable from March alone. current_usage_amount_cents is April's 2_500¢
    (calculate_service.rb:28 → :54-56), asserted a second time through the current-usage endpoint so
    the two surfaces are pinned to one source.

