- id: b7/lifetime-usage/weighted_sum_agg/mid-period
  block: B7
  group: wsum
  key: b07_lt_wsum_mid
  axes: {surface: lifetime-usage, aggregation: weighted_sum_agg, timing: mid-period}
  dimensions: {periods_spanned: 2, weighted_interval: seconds}
  runners: [rspec]
  premium: true
  calendar_sensitive: true
  setup: {organization: {premium_integrations: [lifetime_usage]}}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-10T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 10}}]}
    - {at: "2024-03-13T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 30}}]}
    - {at: "2024-03-25T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 20}}]}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - {at: "2024-04-03T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 10}}]}
    - {at: "2024-04-06T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 30}}]}
    - {at: "2024-04-09T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 20}}]}
    - {at: "2024-04-25T10:00:00Z", do: perform_usage_update}
    - {at: "2024-04-25T11:00:00Z", do: fetch_current_usage}
  expect:
    invoices: 1
    lifetime_usage:
      invoiced_usage_amount_cents: 3000
      current_usage_amount_cents: 4900
      external_historical_usage_amount_cents: 0
    usage:
      amount_cents: 4900
      total_amount_cents: 4900
      charges_usage: [{billable_metric_code: "%{key}", units: "49.0", amount_cents: 4900}]
  math: >-
    Postgres WeightedSumQuery#period_ratio_sql (weighted_sum_query.rb:102-118) sums, per event, the
    running total up to that event multiplied by the seconds until the next event, divided by
    charges_duration in seconds; the upper edge is to_datetime.ceil, i.e. the next period's midnight
    (postgres_store.rb:358). Every timestamp is chosen so both periods come out exact.
    MARCH — 31 days = 2_678_400s. Events on the 10th (+10), 13th (+30), 25th (+20) give running totals
    10, 40, 60 held for 3, 12 and 7 days: (10x3 + 40x12 + 60x7) / 31 = 930/31 = 30.0 units → 3_000¢.
    APRIL — 30 days = 2_592_000s. Events on the 3rd, 6th, 9th give 10, 40, 60 held for 3, 3 and 22
    days: (10x3 + 40x3 + 60x22) / 30 = 1470/30 = 49.0 units → 4_900¢. Both are integers by
    construction, so a wrong month length is not hidden by rounding — hence calendar_sensitive.
    The three events per period carry 10/30/20, so plain sum would report 60 units (6_000¢), max 30
    (3_000¢), latest 20 (2_000¢): none of them is 4_900¢, and none is 3_000¢ in April. The mid-period
    read at April 25 is nonetheless 4_900¢ and not a pro-rated fraction of it, because current usage
    weights to the END of the period (customer_usage_service.rb:162-180, DatesService with
    current_usage: true) rather than to "now" — an implementation that weighted to the read instant
    would report (10x3 + 40x3 + 60x16)/30 = 39.0 units → 3_900¢.
    invoiced_usage_amount_cents is March's 3_000¢, carried across the boundary by
    CalculateService#calculate_invoiced_usage_amount_cents (calculate_service.rb:41-52);
    current_usage_amount_cents is April's 4_900¢ (calculate_service.rb:28 → :54-56), asserted twice so
    the current-usage endpoint and lifetime usage's current column are pinned to one source.

- id: b7/lifetime-usage/weighted_sum_agg/period-boundary
  block: B7
  group: wsum
  key: b07_lt_wsum_bnd
  axes: {surface: lifetime-usage, aggregation: weighted_sum_agg, timing: period-boundary}
  dimensions: {periods_spanned: 2, weighted_interval: seconds}
  runners: [rspec]
