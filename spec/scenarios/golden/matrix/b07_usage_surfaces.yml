    lifetime_usage:
      invoiced_usage_amount_cents: 3000
      current_usage_amount_cents: 4900
      external_historical_usage_amount_cents: 0
    usage:
      amount_cents: 4900
      total_amount_cents: 4900
      charges_usage: [{billable_metric_code: "%{key}", units: "49.0", amount_cents: 4900}]
  math: >-
    Read at 2024-04-30T23:59:59Z, the last representable second of April. For weighted_sum the
    boundary bites on PERIOD SELECTION rather than on event inclusion: an event landing at the
    boundary would be held for ~0 seconds and contribute nothing
    (WeightedSumQuery#period_ratio_sql, weighted_sum_query.rb:102-118, returns 0 for a zero-length
    interval), so the sharp question is which period the read belongs to. At 23:59:59 April is still
    current and the answer is 4_900¢; one second later the current period is May, empty, and the answer
    is 0¢. A period roll implemented one second early therefore produces a 4_900¢ error visible only
    here.
    APRIL — 30 days = 2_592_000s, events on the 3rd (+10), 6th (+30), 9th (+20) → running totals 10,
    40, 60 held for 3, 3 and 22 days to the upper edge to_datetime.ceil = 2024-05-01T00:00:00
    (postgres_store.rb:358): (10x3 + 40x3 + 60x22)/30 = 1470/30 = 49.0 units → 4_900¢. Note this is
    unchanged from the mid-period read: the weighted sum projects to the end of the period, so moving
    the read from April 25 to the last second changes nothing — which is exactly why an
    implementation that weighted to "now" instead would be caught, reporting 60x22 → the full 49.0
    only here and 39.0 (3_900¢) at April 25.
