    invoiced_usage_amount_cents is 200¢ because CalculateService#calculate_invoiced_usage_amount_cents
    (calculate_service.rb:41-52) sums charge fee cents across the subscription's invoices — while
    current_usage_amount_cents is April's 300¢ (calculate_service.rb:28 → :54-56). Note what the sum
    of 500¢ is NOT: a distinct count over both periods, which would also be 5 here only because the
    ref namespaces were kept disjoint on purpose.

