- id: b7/usage-equals-invoice/weighted_sum_agg/mid-period
  block: B7
  group: wsum
  key: b07_uei_wsum_mid
  axes: {surface: usage-equals-invoice, aggregation: weighted_sum_agg, timing: mid-period}
  dimensions: {period_days: 30}
  runners: [rspec]
  calendar_sensitive: true
  timeline:
    - {at: "2024-04-01T00:00:00Z", do: create_subscription}
    - {at: "2024-04-07T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 10}}]}
    - {at: "2024-04-10T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 30}}]}
    - {at: "2024-04-16T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 20}}]}
    - {at: "2024-04-20T10:00:00Z", do: fetch_current_usage}
    - {at: "2024-05-01T01:00:00Z", do: perform_billing}
  expect:
    usage:
      amount_cents: 3900
      taxes_amount_cents: 0
      total_amount_cents: 3900
      charges_usage: [{billable_metric_code: "%{key}", units: "39.0", amount_cents: 3900}]
    invoices: 1
    invoice:
      fees_amount_cents: 3900
      taxes_amount_cents: 0
      total_amount_cents: 3900
      fees: [{fee_type: subscription, amount_cents: 0}, {fee_type: charge, units: "39.0", amount_cents: 3900}]
  math: >-
    weighted_sum_agg is a time-weighted integral of the running total over the period:
    sum(cumulative_value x seconds_to_next_event) / period_seconds
    (BillableMetrics::Aggregations::WeightedSumService:16 ->
    Events::Stores::Postgres::WeightedSumQuery#period_ratio_sql:115, denominator
    charges_duration.days). April 2024 is a 30-day period. Running total 0 from 1-7 Apr contributes
    0; 10 for the 3 days to the 10th gives 10x3/30 = 1; 40 for the 6 days to the 16th gives 40x6/30 =
    8; 60 for the 15 days to 1 May gives 60x15/30 = 30. Total 39 units x 1.00
    (ChargeModels::StandardService:8) = 3_900¢ (Fees::ChargeService:295). Every segment divides
    exactly, so 39 is an exact decimal and not a rounding artefact. THIS is the row where a
    usage/invoice divergence is most plausible and most invisible: the usage read on 20 April already
    projects to the END of the period, because current usage takes charges_to_datetime from DatesService
    with current_usage: true (customer_usage_service.rb:162,179) and for a calendar month that is
    end_of_month (monthly_service.rb:25) — not "now". So the mid-period read and the invoice must
    return the same 39. If usage instead weighted to the read instant it would report 10x3/30 + 40x6/30
    + 60x(4 days 10h)/30 ~= 17.7 units (1_770¢) against the invoice's 3_900¢, and calendar_sensitive is
    set because the 30-day denominator IS the arithmetic.

- id: b7/usage-equals-invoice/weighted_sum_agg/period-boundary
