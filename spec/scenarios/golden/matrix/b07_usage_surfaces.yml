# B7 — Usage surfaces
#
# Invoices::CustomerUsageService carries 12 fix commits, daily_usages 18, lifetime_usages 9. Usage is
# computed by a genuinely different code path from the one that prices an invoiced fee, which is the
# same asymmetry that made `observed_via` an axis of B1.
#
# The flagship row here is the usage-equals-invoice invariant: current usage at the end of a period
# must equal the invoice that period then produces. No spec in spec/scenarios asserts that today, so
# the two paths are free to drift apart — and a customer who watches usage all month and then gets a
# different bill has no way to tell which number was wrong.
#
# Current usage describes the period IN PROGRESS, so rows snapshot it with a fetch_current_usage step
# before billing rolls the subscription into a fresh period.
---
- __matrix:
    defaults:
      provenance: coverage-gap
      dimensions: {interval: monthly, billing_time: calendar, charge_model: standard}
      runners: [rspec, live]
      setup:
        plan: {code: "golden_%{key}", interval: monthly, amount_cents: 0}
        charges: [{billable_metric_code: "%{key}", charge_model: standard, properties: {amount: "1"}}]
        customer: {external_id: "golden_%{key}_cust", currency: EUR}
        subscription: {external_id: "golden_%{key}_sub", billing_time: calendar}
    groups:
      cnt: {setup: {metrics: [{code: "%{key}", aggregation_type: count_agg}]}}
      sum: {setup: {metrics: [{code: "%{key}", aggregation_type: sum_agg, field_name: amount}]}}
      max: {setup: {metrics: [{code: "%{key}", aggregation_type: max_agg, field_name: amount}]}}
      lat: {setup: {metrics: [{code: "%{key}", aggregation_type: latest_agg, field_name: amount}]}}
      uniq: {setup: {metrics: [{code: "%{key}", aggregation_type: unique_count_agg, field_name: unique_id}]}}
      uniq-ref: {setup: {metrics: [{code: "%{key}", aggregation_type: unique_count_agg, field_name: ref}]}}
      uniq-sub: {setup: {metrics: [{code: "%{key}", aggregation_type: unique_count_agg, field_name: sub_id, recurring: false}]}}
      wsum: {setup: {metrics: [{code: "%{key}", aggregation_type: weighted_sum_agg, field_name: amount, weighted_interval: seconds}]}}
      wsum-nr:
        setup: {metrics: [{code: "%{key}", aggregation_type: weighted_sum_agg, field_name: amount, weighted_interval: seconds, recurring: false}]}

- id: b07/usage-equals-invoice/sum_agg/period-boundary
  block: B7
  key: b07_invariant
  axes: {surface: usage-equals-invoice, aggregation: sum_agg, timing: period-boundary}
  setup:
    metrics: [{code: b07_inv_sum, aggregation_type: sum_agg, field_name: amount}]
    charges: [{billable_metric_code: b07_inv_sum, charge_model: standard, properties: {amount: "1"}}]
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b07_inv_sum, properties: {amount: 10}}, {code: b07_inv_sum, properties: {amount: 20}}]
    - {at: "2024-03-31T23:00:00Z", do: fetch_current_usage}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    usage:
      amount_cents: 3000
      taxes_amount_cents: 0
      total_amount_cents: 3000
      charges_usage: [{billable_metric_code: b07_inv_sum, units: "30.0", amount_cents: 3000}]
    invoices: 1
    invoice:
      fees_amount_cents: 3000
      taxes_amount_cents: 0
      total_amount_cents: 3000
      fees: [{fee_type: subscription, amount_cents: 0}, {fee_type: charge, units: "30.0", amount_cents: 3000}]
  math: >-
    THE INVARIANT. 10 + 20 = 30 units at 1.00 → 3_000¢, and that same 3_000¢ must appear twice: once
    as current usage on the last hour of March, and again as the charge fee on the invoice April's
    billing run produces. The row states the number in both places rather than comparing them
    programmatically, so a divergence fails on whichever side moved and the diff names it.
    The plan amount is 0 deliberately: usage covers charges only, so a non-zero subscription fee
    would make the invoice legitimately larger and destroy the equality this row is built on.

- id: b07/current-usage/sum_agg/mid-period
  block: B7
  key: b07_mid
  axes: {surface: current-usage, aggregation: sum_agg, timing: mid-period}
  setup:
    metrics: [{code: "%{key}_sum", aggregation_type: sum_agg, field_name: amount}]
    charges: [{billable_metric_code: "%{key}_sum", charge_model: standard, properties: {amount: "1"}}]
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-05T10:00:00Z", do: ingest_events, events: [{code: "%{key}_sum", properties: {amount: 10}}]}
    - {at: "2024-03-10T10:00:00Z", do: fetch_current_usage}
    - {at: "2024-03-20T10:00:00Z", do: ingest_events, events: [{code: "%{key}_sum", properties: {amount: 99}}]}
  expect:
    usage:
      amount_cents: 1000
      total_amount_cents: 1000
      charges_usage: [{billable_metric_code: "%{key}_sum", units: "10.0", amount_cents: 1000}]
  math: >-
    Usage read on 10 March sees only the events that have happened by then: 10 units → 1_000¢. The
    99-unit event on the 20th is ingested AFTER the snapshot on purpose — if the assertion were
    reading live usage rather than the snapshot it would see 109 units and 10_900¢, so this row also
    proves the snapshot mechanism itself works.

- id: b07/current-usage/max_agg/mid-period
  block: B7
  group: max
  key: b07_max
  axes: {surface: current-usage, aggregation: max_agg, timing: mid-period}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: "%{key}", properties: {amount: 10}}
        - {code: "%{key}", properties: {amount: 40}}
        - {code: "%{key}", properties: {amount: 25}}
    - {at: "2024-03-10T10:00:00Z", do: fetch_current_usage}
  expect:
    usage:
      amount_cents: 4000
      total_amount_cents: 4000
      charges_usage: [{billable_metric_code: "%{key}", units: "40.0", amount_cents: 4000}]
  math: >-
    max_agg on the usage surface: max(10, 40, 25) = 40 units → 4_000¢, not the 75 a sum would give
    and not the 25 a latest would. The largest value arrives in the middle of the three so that a
    regression to either neighbour changes the answer.

- id: b07/current-usage/sum_agg/after-billing
  block: B7
  key: b07_after
  axes: {surface: current-usage, aggregation: sum_agg, timing: after-billing}
  setup:
    metrics: [{code: "%{key}_sum", aggregation_type: sum_agg, field_name: amount}]
    charges: [{billable_metric_code: "%{key}_sum", charge_model: standard, properties: {amount: "1"}}]
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-05T10:00:00Z", do: ingest_events, events: [{code: "%{key}_sum", properties: {amount: 30}}]}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - {at: "2024-04-02T10:00:00Z", do: fetch_current_usage}
  expect:
    usage: {amount_cents: 0, total_amount_cents: 0}
    invoices: 1
    invoice: {fees_amount_cents: 3000, total_amount_cents: 3000}
  math: >-
    Once March is billed the subscription is in a fresh April period, so current usage resets to 0
    while the 3_000¢ stays on the March invoice. Usage is per-period, not cumulative — the row that
    would catch usage leaking across a period boundary and double-billing the customer. A metered
    (non-recurring) metric is used deliberately: a recurring one legitimately carries units forward.

- id: b07/current-usage/count_agg/mid-period
  block: B7
  group: cnt
  key: b07_cu_count_mid
  axes: {surface: current-usage, aggregation: count_agg, timing: mid-period}
  timeline:
    - {at: "2024-04-01T00:00:00Z", do: create_subscription}
    - at: "2024-04-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: "%{key}", properties: {amount: 10}}
        - {code: "%{key}", properties: {amount: 30}}
        - {code: "%{key}", properties: {amount: 20}}
        - {code: "%{key}", properties: {amount: 30}}
    - {at: "2024-04-10T10:00:00Z", do: fetch_current_usage}
    - at: "2024-04-20T10:00:00Z"
      do: ingest_events
      events:
        - {code: "%{key}", properties: {amount: 7}}
        - {code: "%{key}", properties: {amount: 7}}
        - {code: "%{key}", properties: {amount: 7}}
  expect:
    usage:
      amount_cents: 400
      taxes_amount_cents: 0
      total_amount_cents: 400
      charges_usage: [{billable_metric_code: "%{key}", units: "4.0", amount_cents: 400}]
  math: >-
    count_agg on the usage surface counts EVENTS, not property values:
    CountService#compute_aggregation is `event_store.count` with no aggregation_property at all
    (count_service.rb:9-11, postgres_store.rb:100-102), so the four events ingested by 5 April give
    4 units, priced 4 x 1.00 = 400¢ by StandardService#compute_amount (standard_service.rb:7-9).
    The four amounts are 10/30/20/30 deliberately: an implementation that summed the only numeric
    property would report 90 units (9_000¢), one that took the max 30 (3_000¢), one that took the
    latest 30 (3_000¢), and one that counted DISTINCT amounts 3 (300¢). All four are visible against
    400¢. The three extra events on the 20th land AFTER the fetch_current_usage snapshot — live usage
    would read 7 events and 700¢ — so the row also proves the snapshot is what is being asserted
    (golden_runner.rb:380-383).

- id: b07/current-usage/count_agg/period-boundary
  block: B7
  group: cnt
  key: b07_cu_count_bnd
  axes: {surface: current-usage, aggregation: count_agg, timing: period-boundary}
  runners: [rspec]
  calendar_sensitive: true
  timeline:
    - {at: "2024-04-01T00:00:00Z", do: create_subscription}
    - at: "2024-04-30T23:59:59Z"
      do: ingest_events
      events:
        - {code: "%{key}", timestamp: "2024-03-31T23:59:59Z", properties: {amount: 91}}
        - {code: "%{key}", timestamp: "2024-04-01T00:00:00Z", properties: {amount: 10}}
        - {code: "%{key}", timestamp: "2024-04-01T00:00:00Z", properties: {amount: 30}}
        - {code: "%{key}", timestamp: "2024-04-15T12:00:00Z", properties: {amount: 20}}
        - {code: "%{key}", timestamp: "2024-04-30T23:59:59Z", properties: {amount: 40}}
        - {code: "%{key}", timestamp: "2024-05-01T00:00:00Z", properties: {amount: 92}}
    - {at: "2024-04-30T23:59:59Z", do: fetch_current_usage}
  expect:
    usage:
      amount_cents: 400
      taxes_amount_cents: 0
      total_amount_cents: 400
      charges_usage: [{billable_metric_code: "%{key}", units: "4.0", amount_cents: 400}]
  math: >-
    THE BOUNDARY ROW. Usage read at the last whole second of the period, with six events placed so
    that both ends of the aggregation window are pinned. Current usage takes its window from
    DatesService with current_usage: true (customer_usage_service.rb:162-180), so base_date is the
    READ date rather than a period behind it (dates_service.rb:233): reading on 30 April,
    compute_charges_from_date is 2024-04-01 (monthly_service.rb:20, calendar) and
    compute_charges_to_date is that month's end_of_month taken to end_of_day
    (monthly_service.rb:26 + dates_service.rb:242-246) = 2024-04-30T23:59:59.999999Z.
    The window is INCLUSIVE at both ends: Event.from_datetime is `timestamp >= ?` and the to-boundary
    is `timestamp <= ?` (event.rb:18-19, postgres_store.rb:11-13). So the two events stamped exactly
    2024-04-01T00:00:00Z are IN, the 15 April one is IN, the one at 2024-04-30T23:59:59Z is IN
    (23:59:59 <= 23:59:59.999999), the one a second before the period at 2024-03-31T23:59:59Z is OUT
    and the one at exactly the next period's first instant 2024-05-01T00:00:00Z is OUT. 4 events ->
    4 units -> 400¢. Every single off-by-one moves the number, and the counts are deliberately
    asymmetric (two events sit on the lower boundary, one on the upper) so that two simultaneous
    off-by-ones cannot cancel: an exclusive `>` at from_datetime gives 2 (200¢), including the
    pre-period event gives 5 (500¢), including the next-period event gives 5 (500¢), an exclusive
    `<` at to_datetime gives 3 (300¢), and dropping both boundary events gives 2 (200¢). Reading at
    23:59:59 also proves the period has not rolled early: if it had, the answer would be 1 (the
    05-01 event, 100¢) or 0.

- id: b07/current-usage/count_agg/after-billing
  block: B7
  group: cnt
  key: b07_cu_count_after
  axes: {surface: current-usage, aggregation: count_agg, timing: after-billing}
  timeline:
    - {at: "2024-04-01T00:00:00Z", do: create_subscription}
    - at: "2024-04-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: "%{key}", properties: {amount: 10}}
        - {code: "%{key}", properties: {amount: 30}}
        - {code: "%{key}", properties: {amount: 20}}
        - {code: "%{key}", properties: {amount: 30}}
    - {at: "2024-05-01T01:00:00Z", do: perform_billing}
    - {at: "2024-05-02T10:00:00Z", do: fetch_current_usage}
  expect:
    usage:
      amount_cents: 0
      taxes_amount_cents: 0
      total_amount_cents: 0
      charges_usage: [{billable_metric_code: "%{key}", units: "0.0", amount_cents: 0}]
    invoices: 1
    invoice:
      fees_amount_cents: 400
      taxes_amount_cents: 0
      total_amount_cents: 400
      fees: [{fee_type: subscription, amount_cents: 0}, {fee_type: charge, units: "4.0", amount_cents: 400}]
  math: >-
    Does the counter reset? Derived, not assumed. Reading on 2 May makes base_date the 2nd
    (dates_service.rb:233), so the window is 2024-05-01T00:00:00Z .. 2024-05-31T23:59:59.999999Z
    (monthly_service.rb:20,26). April's four events all have timestamps below that lower bound and
    Event.from_datetime is `timestamp >= ?` (event.rb:18), so none of them is in scope: count_agg is
    not recurring-capable at all (billable_metric.rb:113-118 forbids `recurring` on count_agg), so
    there is no carry-forward path and the aggregation is 0. The charge is still REPORTED at zero
    rather than omitted: with no in-period event Events::BillingPeriodFilterService leaves the
    default bucket empty, charge_service.rb:132-146 skips the aggregation and
    charge_service.rb:112-123 hydrates a zero-units fee instead, which the serializer maps like any
    other (charge_usage_serializer.rb:31-47). Hence units "0.0" and 0¢ in charges_usage, not a
    missing entry. The 400¢ does not vanish — it is on the April invoice (4 units x 1.00), which the
    row asserts on the same breath so a usage figure that leaked into May would show up as 400¢
    charged twice.

- id: b07/current-usage/sum_agg/period-boundary
  block: B7
  group: sum
  key: b07_cu_sum_bnd
  axes: {surface: current-usage, aggregation: sum_agg, timing: period-boundary}
  runners: [rspec]
  calendar_sensitive: true
  timeline:
    - {at: "2024-04-01T00:00:00Z", do: create_subscription}
    - at: "2024-04-30T23:59:59Z"
      do: ingest_events
      events:
        - {code: "%{key}", timestamp: "2024-03-31T23:59:59Z", properties: {amount: 500}}
        - {code: "%{key}", timestamp: "2024-04-01T00:00:00Z", properties: {amount: 10}}
        - {code: "%{key}", timestamp: "2024-04-15T12:00:00Z", properties: {amount: 30}}
        - {code: "%{key}", timestamp: "2024-04-30T23:59:59Z", properties: {amount: 20}}
        - {code: "%{key}", timestamp: "2024-05-01T00:00:00Z", properties: {amount: 700}}
    - {at: "2024-04-30T23:59:59Z", do: fetch_current_usage}
  expect:
    usage:
      amount_cents: 6000
      taxes_amount_cents: 0
      total_amount_cents: 6000
      charges_usage: [{billable_metric_code: "%{key}", units: "60.0", amount_cents: 6000}]
  math: >-
    The window for a usage read on 30 April is 2024-04-01T00:00:00Z ..
    2024-04-30T23:59:59.999999Z (customer_usage_service.rb:162-180, dates_service.rb:233,
    monthly_service.rb:20,26), inclusive at both ends (event.rb:18-19). SumService therefore sums
    only the three in-window amounts: 10 + 30 + 20 = 60 units -> 6_000¢ at 1.00 the unit
    (standard_service.rb:7-9). The two out-of-window amounts are deliberately large and unequal so
    each off-by-one is separately identifiable: an exclusive lower bound drops the 10 and gives 50
    (5_000¢); pulling in the event a second BEFORE the period gives 560 (56_000¢); pulling in the
    event at exactly the next period's first instant gives 760 (76_000¢); an exclusive upper bound
    drops the 20 and gives 40 (4_000¢). The three in-window values 10/30/20 also separate the
    aggregations: max would answer 30 (3_000¢), latest 20 (2_000¢), count 3 (300¢).

- id: b07/current-usage/max_agg/period-boundary
  block: B7
  group: max
  key: b07_cu_max_bnd
  axes: {surface: current-usage, aggregation: max_agg, timing: period-boundary}
  runners: [rspec]
  calendar_sensitive: true
  timeline:
    - {at: "2024-04-01T00:00:00Z", do: create_subscription}
    - at: "2024-04-30T23:59:59Z"
      do: ingest_events
      events:
        - {code: "%{key}", timestamp: "2024-03-31T23:59:59Z", properties: {amount: 999}}
        - {code: "%{key}", timestamp: "2024-04-01T00:00:00Z", properties: {amount: 40}}
        - {code: "%{key}", timestamp: "2024-04-15T12:00:00Z", properties: {amount: 25}}
        - {code: "%{key}", timestamp: "2024-04-30T23:59:59Z", properties: {amount: 10}}
        - {code: "%{key}", timestamp: "2024-05-01T00:00:00Z", properties: {amount: 500}}
    - {at: "2024-04-30T23:59:59Z", do: fetch_current_usage}
  expect:
    usage:
      amount_cents: 4000
      taxes_amount_cents: 0
      total_amount_cents: 4000
      charges_usage: [{billable_metric_code: "%{key}", units: "40.0", amount_cents: 4000}]
  math: >-
    MaxService is `events.maximum((properties->>'amount')::numeric)` over the period window
    (max_service.rb:16-18, postgres_store.rb:209-213), and the window is
    2024-04-01T00:00:00Z .. 2024-04-30T23:59:59.999999Z inclusive at both ends
    (dates_service.rb:233, monthly_service.rb:20,26, event.rb:18-19). The largest in-window value
    is placed ON the lower boundary on purpose: max(40, 25, 10) = 40 units -> 4_000¢
    (standard_service.rb:7-9). That makes the boundary comparison the thing the number depends on,
    which no mid-period row can do. An exclusive `>` at from_datetime drops the 40 and the answer
    collapses to 25 (2_500¢); the two out-of-window values are larger than everything in the period,
    so pulling in the event one second early answers 999 (99_900¢) and pulling in the next period's
    first instant answers 500 (50_000¢). Sum would give 75 (7_500¢), latest 10 (1_000¢), count 3
    (300¢).

- id: b07/current-usage/max_agg/after-billing
  block: B7
  group: max
  key: b07_cu_max_after
  axes: {surface: current-usage, aggregation: max_agg, timing: after-billing}
  timeline:
    - {at: "2024-04-01T00:00:00Z", do: create_subscription}
    - at: "2024-04-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: "%{key}", properties: {amount: 10}}
        - {code: "%{key}", properties: {amount: 40}}
        - {code: "%{key}", properties: {amount: 25}}
    - {at: "2024-05-01T01:00:00Z", do: perform_billing}
    - {at: "2024-05-02T10:00:00Z", do: fetch_current_usage}
  expect:
    usage:
      amount_cents: 0
      taxes_amount_cents: 0
      total_amount_cents: 0
      charges_usage: [{billable_metric_code: "%{key}", units: "0.0", amount_cents: 0}]
    invoices: 1
    invoice:
      fees_amount_cents: 4000
      taxes_amount_cents: 0
      total_amount_cents: 4000
      fees: [{fee_type: subscription, amount_cents: 0}, {fee_type: charge, units: "40.0", amount_cents: 4000}]
  math: >-
    A period high-water mark is the aggregation most likely to be implemented as remembered state, so
    this row derives whether it survives billing. It does not. MaxService reads only the event store
    over the current window (max_service.rb:16-18, postgres_store.rb:209-213) and keeps nothing
    else; `recurring` is forbidden on max_agg outright (billable_metric.rb:113-118), so there is no
    carry-forward path. Reading on 2 May the window is 2024-05-01T00:00:00Z ..
    2024-05-31T23:59:59.999999Z (dates_service.rb:233, monthly_service.rb:20,26), April's events are
    all below `timestamp >= from_datetime` (event.rb:18), and the charge is hydrated as a zero-units
    fee rather than dropped (charge_service.rb:112-146) -> units "0.0", 0¢. April's max(10, 40, 25)
    = 40 units -> 4_000¢ stays on the April invoice, asserted here so that a max leaking into the
    next period reads as 4_000¢ billed twice rather than as a plausible-looking usage figure.

- id: b07/current-usage/unique_count_agg/mid-period
  block: B7
  group: uniq-sub
  key: b07_cu_uniq_mid
  axes: {surface: current-usage, aggregation: unique_count_agg, timing: mid-period}
  dimensions: {recurring: false}
  timeline:
    - {at: "2024-04-01T00:00:00Z", do: create_subscription}
    - {at: "2024-04-03T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {sub_id: s1}}]}
    - {at: "2024-04-04T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {sub_id: s2}}]}
    - {at: "2024-04-05T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {sub_id: s1}}]}
    - {at: "2024-04-06T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {sub_id: s3}}]}
    - at: "2024-04-07T00:00:00Z"
      do: ingest_events
      events: [{code: "%{key}", properties: {sub_id: s2, operation_type: remove}}]
    - {at: "2024-04-10T10:00:00Z", do: fetch_current_usage}
  expect:
    usage:
      amount_cents: 200
      taxes_amount_cents: 0
      total_amount_cents: 200
      charges_usage: [{billable_metric_code: "%{key}", units: "2.0", amount_cents: 200}]
  math: >-
    unique_count is not "distinct values": it is a signed add/remove ledger per property, summed.
    UniqueCountQuery#operation_value_sql (unique_count_query.rb:276-287) gives +1 for the first
    `add` on a property, 0 for a repeated `add`, -1 for a `remove` that follows an `add`, and 0 for
    a `remove` with nothing to remove; operation_type defaults to `add` when the property is absent
    (postgres_store.rb:598-599). Per property: s1 = +1 then 0 (already added) = 1; s2 = +1 then -1
    (removed on the 7th) = 0; s3 = +1 = 1. Total 2 units -> 200¢ (standard_service.rb:7-9). Five
    events for two units is the whole point of the row: count_agg would answer 5 (500¢), a naive
    COUNT(DISTINCT sub_id) that ignored the removal would answer 3 (300¢), and an implementation
    that double-counted the repeated s1 add would answer 3 or 4. The metric is declared
    `recurring: false` explicitly, which sets use_from_boundary = true
    (unique_count_service.rb:10) and confines the ledger to this period.

- id: b07/current-usage/unique_count_agg/period-boundary
  block: B7
  group: uniq-sub
  key: b07_cu_uniq_bnd
  axes: {surface: current-usage, aggregation: unique_count_agg, timing: period-boundary}
  dimensions: {recurring: false}
  runners: [rspec]
  calendar_sensitive: true
  timeline:
    - {at: "2024-04-01T00:00:00Z", do: create_subscription}
    - at: "2024-04-30T23:59:59Z"
      do: ingest_events
      events:
        - {code: "%{key}", timestamp: "2024-03-31T23:59:59Z", properties: {sub_id: before}}
        - {code: "%{key}", timestamp: "2024-04-01T00:00:00Z", properties: {sub_id: s1}}
        - {code: "%{key}", timestamp: "2024-04-15T12:00:00Z", properties: {sub_id: s2}}
        - {code: "%{key}", timestamp: "2024-04-20T00:00:00Z", properties: {sub_id: s2}}
        - {code: "%{key}", timestamp: "2024-04-30T23:59:59Z", properties: {sub_id: s3}}
        - {code: "%{key}", timestamp: "2024-05-01T00:00:00Z", properties: {sub_id: after}}
    - {at: "2024-04-30T23:59:59Z", do: fetch_current_usage}
  expect:
    usage:
      amount_cents: 300
      taxes_amount_cents: 0
      total_amount_cents: 300
      charges_usage: [{billable_metric_code: "%{key}", units: "3.0", amount_cents: 300}]
  math: >-
    Non-recurring unique_count sets use_from_boundary = true (unique_count_service.rb:10), so the
    ledger is confined to 2024-04-01T00:00:00Z .. 2024-04-30T23:59:59.999999Z, inclusive at both
    ends (dates_service.rb:233, monthly_service.rb:20,26, event.rb:18-19). In window: s1 (+1, at
    exactly the lower boundary instant), s2 (+1), s2 again (0, repeated add suppressed by
    unique_count_query.rb:276-287), s3 (+1, at exactly 23:59:59 of the last day) = 3 units -> 300¢.
    Out of window: `before` at 2024-03-31T23:59:59Z and `after` at 2024-05-01T00:00:00Z. Each
    boundary property is distinct from every other, so no off-by-one is masked by a duplicate:
    an exclusive `>` at from_datetime loses s1 and answers 2 (200¢); an exclusive `<` at to_datetime
    loses s3 and answers 2 (200¢); including `before` answers 4 (400¢); including `after` answers 4
    (400¢). count_agg over the same window would answer 4 (400¢), so the dedup is exercised too.

- id: b07/current-usage/unique_count_agg/after-billing
  block: B7
  group: uniq-sub
  key: b07_cu_uniq_after
  axes: {surface: current-usage, aggregation: unique_count_agg, timing: after-billing}
  dimensions: {recurring: false}
  timeline:
    - {at: "2024-04-01T00:00:00Z", do: create_subscription}
    - {at: "2024-04-03T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {sub_id: s1}}]}
    - {at: "2024-04-04T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {sub_id: s2}}]}
    - {at: "2024-04-05T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {sub_id: s1}}]}
    - {at: "2024-05-01T01:00:00Z", do: perform_billing}
    - {at: "2024-05-02T10:00:00Z", do: fetch_current_usage}
  expect:
    usage:
      amount_cents: 0
      taxes_amount_cents: 0
      total_amount_cents: 0
      charges_usage: [{billable_metric_code: "%{key}", units: "0.0", amount_cents: 0}]
    invoices: 1
    invoice:
      fees_amount_cents: 200
      taxes_amount_cents: 0
      total_amount_cents: 200
      fees: [{fee_type: subscription, amount_cents: 0}, {fee_type: charge, units: "2.0", amount_cents: 200}]
  math: >-
    unique_count is the one aggregation where "does the counter reset" has two legitimate answers,
    and the metric attribute decides which: UniqueCountService sets
    `event_store.use_from_boundary = !billable_metric.recurring`
    (unique_count_service.rb:10). This metric declares `recurring: false`, so the lower bound IS
    applied and the ledger restarts every period. Reading on 2 May the window is
    2024-05-01T00:00:00Z .. 2024-05-31T23:59:59.999999Z (dates_service.rb:233,
    monthly_service.rb:20,26); no event falls in it, so the aggregation is 0 and the charge is
    hydrated as a zero-units fee rather than omitted (charge_service.rb:112-146) -> units "0.0", 0¢.
    A recurring unique_count would legitimately still report 2 here, which is exactly why the row
    pins the flag instead of relying on the default. April's ledger is s1 = +1 then 0, s2 = +1
    (unique_count_query.rb:276-287) = 2 units -> 200¢ on the April invoice; 3 events, 2 units, so a
    count_agg regression on the invoice side would read 300¢.

- id: b07/current-usage/weighted_sum_agg/mid-period
  block: B7
  group: wsum-nr
  key: b07_cu_wsum_mid
  axes: {surface: current-usage, aggregation: weighted_sum_agg, timing: mid-period}
  dimensions: {recurring: false}
  runners: [rspec]
  calendar_sensitive: true
  timeline:
    - {at: "2024-04-01T00:00:00Z", do: create_subscription}
    - {at: "2024-04-04T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 10}}]}
    - {at: "2024-04-07T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 30}}]}
    - {at: "2024-04-13T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 20}}]}
    - {at: "2024-04-20T10:00:00Z", do: fetch_current_usage}
  expect:
    usage:
      amount_cents: 4500
      taxes_amount_cents: 0
      total_amount_cents: 4500
      charges_usage: [{billable_metric_code: "%{key}", units: "45.0", amount_cents: 4500}]
  math: >-
    weighted_sum is a time-weighted average of the RUNNING TOTAL, and it exists on no invoice in the
    suite — this is the arithmetic that only current usage reaches. WeightedSumQuery builds one row
    per event plus a synthetic row at from_datetime carrying `initial_value` and one at to_datetime
    carrying 0 (weighted_sum_query.rb:68-100), then sums
    cumulative_sum x seconds_to_next_row / charges_duration_in_seconds
    (weighted_sum_query.rb:102-119). initial_value is 0 because the metric is not recurring
    (weighted_sum_service.rb:91-95). April is a 30-day calendar period so the denominator is
    30.days = 2_592_000s, and the upper bound is ceil'd to 2024-05-01T00:00:00Z
    (postgres_store.rb:350-372), making the window exactly 30 days. The three events are placed so
    every term divides exactly, leaving no rounding to argue about:
    2024-04-01 -> 04-04 the running total is 0 (3 days, contributes 0);
    04-04 -> 04-07 it is 10 for 3 days = 10 x 259_200 / 2_592_000 = 1;
    04-07 -> 04-13 it is 40 for 6 days = 40 x 518_400 / 2_592_000 = 8;
    04-13 -> 05-01 it is 60 for 18 days = 60 x 1_555_200 / 2_592_000 = 36.
    Total 45 units -> 4_500¢ (standard_service.rb:7-9). Note the tail runs to the PERIOD END, not to
    the read instant: current usage keeps charges_to_datetime at the end of the month even mid-period
    (customer_usage_service.rb:162-180, monthly_service.rb:26), so an implementation that weighted
    only up to "now" (20 April) would answer (30 + 240 + 420)/30 = 23 units (2_300¢). A plain sum
    answers 60 (6_000¢), latest 20 (2_000¢), max 30 (3_000¢), and an implementation that dropped the
    zero-valued lead-in and rescaled would answer 45 x 30/27 = 50 (5_000¢).

- id: b07/current-usage/weighted_sum_agg/period-boundary
  block: B7
  group: wsum-nr
  key: b07_cu_wsum_bnd
  axes: {surface: current-usage, aggregation: weighted_sum_agg, timing: period-boundary}
  dimensions: {recurring: false}
  runners: [rspec]
  calendar_sensitive: true
  timeline:
    - {at: "2024-04-01T00:00:00Z", do: create_subscription}
    - at: "2024-04-30T23:59:59Z"
      do: ingest_events
      events:
        - {code: "%{key}", timestamp: "2024-03-31T23:59:59Z", properties: {amount: 999}}
        - {code: "%{key}", timestamp: "2024-04-01T00:00:00Z", properties: {amount: 10}}
        - {code: "%{key}", timestamp: "2024-04-07T00:00:00Z", properties: {amount: 30}}
        - {code: "%{key}", timestamp: "2024-04-13T00:00:00Z", properties: {amount: 20}}
        - {code: "%{key}", timestamp: "2024-05-01T00:00:00Z", properties: {amount: 777}}
    - {at: "2024-04-30T23:59:59Z", do: fetch_current_usage}
  expect:
    usage:
      amount_cents: 4600
      taxes_amount_cents: 0
      total_amount_cents: 4600
      charges_usage: [{billable_metric_code: "%{key}", units: "46.0", amount_cents: 4600}]
  math: >-
    The same time-weighted sum as the mid-period row, but with the first event sitting exactly ON
    from_datetime and decoys one second either side of the period. Window: 2024-04-01T00:00:00Z ..
    2024-04-30T23:59:59.999999Z, ceil'd to 2024-05-01T00:00:00Z for the weighting
    (postgres_store.rb:350-372), 30 days = 2_592_000s in the denominator
    (weighted_sum_query.rb:102-119). The event at 2024-04-01T00:00:00Z shares its timestamp with
    the synthetic initial_value row (weighted_sum_query.rb:84-91); that tie is harmless because the
    zero-difference row contributes nothing whichever side of it it lands on — LEAD gives a 0-second
    gap and the CASE zeroes that term (weighted_sum_query.rb:105-107). Terms:
    04-01 -> 04-07 running total 10 for 6 days = 10 x 518_400 / 2_592_000 = 2;
    04-07 -> 04-13 it is 40 for 6 days = 8;
    04-13 -> 05-01 it is 60 for 18 days = 36.
    Total 46 units -> 4_600¢. This is the only place the inclusive `>=` at from_datetime
    (event.rb:18) changes a weighted answer: excluding the boundary event makes the running total 30
    from 04-07 and 50 from 04-13, i.e. 30 x 6/30 + 50 x 18/30 = 6 + 30 = 36 units (3_600¢).
    Admitting the 999 stamped one second before the period lifts every later running total by 999,
    giving 999 x 1/2_592_000 + 1_009 x 6/30 + 1_039 x 6/30 + 1_059 x 18/30 = 1_045.0004 units
    (104_500¢). Admitting the 777 at the next period's first instant makes it the last row before
    the synthetic end-of-period row, which sits at the same ceil'd instant, so its own term is zero
    but the 46 above becomes 46 + 777 x 0 = 46 with a raw difference sum of 837 instead of 60 — the
    reason both units and amount_cents are asserted rather than the total alone. A plain sum answers
    60 (6_000¢), latest 20 (2_000¢), max 30 (3_000¢).

- id: b07/current-usage/weighted_sum_agg/after-billing
  block: B7
  group: wsum-nr
  key: b07_cu_wsum_after
  axes: {surface: current-usage, aggregation: weighted_sum_agg, timing: after-billing}
  dimensions: {recurring: false}
  runners: [rspec]
  calendar_sensitive: true
  timeline:
    - {at: "2024-04-01T00:00:00Z", do: create_subscription}
    - {at: "2024-04-04T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 10}}]}
    - {at: "2024-04-07T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 30}}]}
    - {at: "2024-04-13T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 20}}]}
    - {at: "2024-05-01T01:00:00Z", do: perform_billing}
    - {at: "2024-05-02T10:00:00Z", do: fetch_current_usage}
  expect:
    usage:
      amount_cents: 0
      taxes_amount_cents: 0
      total_amount_cents: 0
      charges_usage: [{billable_metric_code: "%{key}", units: "0.0", amount_cents: 0}]
    invoices: 1
    invoice:
      fees_amount_cents: 4500
      taxes_amount_cents: 0
      total_amount_cents: 4500
      fees: [{fee_type: subscription, amount_cents: 0}, {fee_type: charge, units: "45.0", amount_cents: 4500}]
  math: >-
    weighted_sum is the aggregation with a real carry-forward mechanism — initial_value from the
    previous period's cached aggregation (weighted_sum_service.rb:91-109) — so whether it resets
    after billing is a genuine question, and the answer is decided by `recurring`. This metric is
    non-recurring, so `initial_value` returns 0 unconditionally
    (weighted_sum_service.rb:91-95) and nothing is carried. Reading on 2 May the window is
    2024-05-01T00:00:00Z .. 2024-05-31T23:59:59.999999Z (dates_service.rb:233,
    monthly_service.rb:20,26) and holds no event, so the charge is hydrated as a zero-units fee
    (charge_service.rb:112-146) -> units "0.0", 0¢. A recurring weighted_sum would legitimately
    report the 60 units still "active" at 60 x 31/31 = 60 units (6_000¢) in May, which is the number
    to look for if this row goes red. April is unchanged from the mid-period row: 0 for 3 days,
    10 for 3 days (=1), 40 for 6 days (=8), 60 for 18 days (=36) over a 30-day denominator
    (weighted_sum_query.rb:102-119) = 45 units -> 4_500¢ on the April invoice, and the row asserts
    that side too so a weighted sum leaking into May reads as double billing rather than as usage.

- id: b07/current-usage/latest_agg/mid-period
  block: B7
  group: lat
  key: b07_cu_latest_mid
  axes: {surface: current-usage, aggregation: latest_agg, timing: mid-period}
  timeline:
    - {at: "2024-04-01T00:00:00Z", do: create_subscription}
    - {at: "2024-04-03T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 10}}]}
    - {at: "2024-04-05T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 30}}]}
    - {at: "2024-04-07T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 20}}]}
    - {at: "2024-04-10T10:00:00Z", do: fetch_current_usage}
    - {at: "2024-04-19T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 99}}]}
  expect:
    usage:
      amount_cents: 2000
      taxes_amount_cents: 0
      total_amount_cents: 2000
      charges_usage: [{billable_metric_code: "%{key}", units: "20.0", amount_cents: 2000}]
  math: >-
    LatestService takes `event_store.last`, which is the in-window event ordered
    `timestamp DESC, created_at DESC` (latest_service.rb:16-18, postgres_store.rb:233-237), and
    clamps a negative value to zero (latest_service.rb:59-64). The three values are 10, 30, 20 with
    strictly increasing timestamps, which is the arrangement that separates every candidate
    aggregation at once: latest = 20 units -> 2_000¢, sum would be 60 (6_000¢), max 30 (3_000¢),
    first-seen 10 (1_000¢), count 3 (300¢). The 20 is deliberately neither the largest nor the
    smallest, so "latest" cannot be satisfied by accident. The three events are ingested in three
    SEPARATE steps rather than one: events in a single step share that step's instant, which would
    leave the ordering resting on created_at alone and make the row a test of ingestion order rather
    than of timestamp order. The 99 on the 19th is ingested AFTER the snapshot — live usage would
    read 9_900¢ — so the row proves the assertion reads the snapshot (golden_runner.rb:380-383).

- id: b07/current-usage/latest_agg/period-boundary
  block: B7
  group: lat
  key: b07_cu_latest_bnd
  axes: {surface: current-usage, aggregation: latest_agg, timing: period-boundary}
  runners: [rspec]
  calendar_sensitive: true
  timeline:
    - {at: "2024-04-01T00:00:00Z", do: create_subscription}
    - at: "2024-04-30T23:59:59Z"
      do: ingest_events
      events:
        - {code: "%{key}", timestamp: "2024-03-31T23:59:59Z", properties: {amount: 999}}
        - {code: "%{key}", timestamp: "2024-04-01T00:00:00Z", properties: {amount: 10}}
        - {code: "%{key}", timestamp: "2024-04-15T12:00:00Z", properties: {amount: 30}}
        - {code: "%{key}", timestamp: "2024-04-30T23:59:59Z", properties: {amount: 20}}
        - {code: "%{key}", timestamp: "2024-05-01T00:00:00Z", properties: {amount: 777}}
    - {at: "2024-04-30T23:59:59Z", do: fetch_current_usage}
  expect:
    usage:
      amount_cents: 2000
      taxes_amount_cents: 0
      total_amount_cents: 2000
      charges_usage: [{billable_metric_code: "%{key}", units: "20.0", amount_cents: 2000}]
  math: >-
    latest_agg is the aggregation the UPPER boundary can break on its own, because the answer IS the
    last in-window event. `event_store.last` orders by `timestamp DESC, created_at DESC` within the
    window (latest_service.rb:16-18, postgres_store.rb:233-237), and for a read on 30 April the
    window is 2024-04-01T00:00:00Z .. 2024-04-30T23:59:59.999999Z, inclusive at both ends
    (dates_service.rb:233, monthly_service.rb:20,26, event.rb:18-19). The last in-window event is
    the one stamped exactly 2024-04-30T23:59:59Z, carrying 20 -> 20 units -> 2_000¢
    (standard_service.rb:7-9). An exclusive `<` at to_datetime would drop it and answer 30
    (3_000¢); admitting the event at the next period's first instant 2024-05-01T00:00:00Z would
    answer 777 (77_700¢); admitting the one a second before the period cannot change `latest` but
    would change sum, which is why units is asserted rather than only the total. Sum over the window
    is 60 (6_000¢), max 30 (3_000¢), count 3 (300¢) — all distinct from 2_000¢.

- id: b07/current-usage/latest_agg/after-billing
  block: B7
  group: lat
  key: b07_cu_latest_after
  axes: {surface: current-usage, aggregation: latest_agg, timing: after-billing}
  timeline:
    - {at: "2024-04-01T00:00:00Z", do: create_subscription}
    - {at: "2024-04-03T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 10}}]}
    - {at: "2024-04-05T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 30}}]}
    - {at: "2024-04-07T00:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 20}}]}
    - {at: "2024-05-01T01:00:00Z", do: perform_billing}
    - {at: "2024-05-02T10:00:00Z", do: fetch_current_usage}
  expect:
    usage:
      amount_cents: 0
      taxes_amount_cents: 0
      total_amount_cents: 0
      charges_usage: [{billable_metric_code: "%{key}", units: "0.0", amount_cents: 0}]
    invoices: 1
    invoice:
      fees_amount_cents: 2000
      taxes_amount_cents: 0
      total_amount_cents: 2000
      fees: [{fee_type: subscription, amount_cents: 0}, {fee_type: charge, units: "20.0", amount_cents: 2000}]
  math: >-
    "Latest" reads like a gauge, and a gauge that resets to zero on the 1st of the month is a
    surprising behaviour to leave unasserted — so this row derives it. LatestService has no state
    beyond the event store and `recurring` is forbidden on latest_agg outright
    (billable_metric.rb:113-118), so there is nothing to carry: reading on 2 May the window is
    2024-05-01T00:00:00Z .. 2024-05-31T23:59:59.999999Z (dates_service.rb:233,
    monthly_service.rb:20,26), `event_store.last` finds no event in it
    (latest_service.rb:16-18, postgres_store.rb:233-237), and the charge is hydrated as a zero-units
    fee rather than omitted (charge_service.rb:112-146) -> units "0.0", 0¢. April's last event
    carried 20 -> 20 units -> 2_000¢ on the April invoice, asserted here so a latest value surviving
    into May reads as 2_000¢ billed twice. If the row instead reports 20 units in May, the gauge is
    persisting across periods and every customer watching it is being shown last month's reading.

- id: b7/lifetime-usage/count_agg/mid-period
  block: B7
  group: cnt
  key: b07_lt_count_mid
  axes: {surface: lifetime-usage, aggregation: count_agg, timing: mid-period}
  dimensions: {periods_spanned: 2}
  premium: true
  setup: {organization: {premium_integrations: [lifetime_usage]}}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-05T10:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 10}}]}
    - {at: "2024-03-10T10:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 30}}]}
    - {at: "2024-03-20T10:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 20}}]}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - {at: "2024-04-05T10:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 10}}]}
    - {at: "2024-04-10T10:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 30}}]}
    - at: "2024-04-20T10:00:00Z"
      do: ingest_events
      events: [{code: "%{key}", properties: {amount: 20}}, {code: "%{key}", properties: {amount: 40}}]
    - {at: "2024-04-25T10:00:00Z", do: perform_usage_update}
    - {at: "2024-04-25T11:00:00Z", do: fetch_current_usage}
  expect:
    invoices: 1
    lifetime_usage:
      invoiced_usage_amount_cents: 300
      current_usage_amount_cents: 400
      external_historical_usage_amount_cents: 0
    usage: {amount_cents: 400, total_amount_cents: 400}
  math: >-
    Two periods, read in the middle of the second. March carries 3 events, April 4, and count_agg
    prices event CARDINALITY: 3 units → 300¢ and 4 units → 400¢ at 1.00 per unit. The event property
    `amount` is deliberately populated with 10/30/20 (/40) even though count_agg has no field_name —
    an implementation that summed the field would report 60 in March and 100 in April, a max 30/40,
    a latest 20/40, so every neighbouring aggregation gives a different number here.
    invoiced_usage_amount_cents is NOT the current period: LifetimeUsages::CalculateService#
    calculate_invoiced_usage_amount_cents (calculate_service.rb:41-52) sums `fees.charge.sum(:amount_cents)`
    over every finalized-or-draft subscription invoice of the subscription lineage, so it is 300¢ —
    March, carried forward across the boundary. current_usage_amount_cents is the live per-period
    figure (calculate_service.rb:28 → :54-56, Invoices::CustomerUsageService with apply_taxes: false),
    so it is April's 400¢. The row asserts April's 400¢ TWICE — once through
    GET /customers/:id/current_usage and once as lifetime usage's current component — which is what
    pins them to the same source; a lifetime figure that quietly kept its own accumulator would
    diverge here. The 700¢ total the two columns sum to (lifetime_usage.rb:23-25) is the whole point
    of the surface: current usage alone can never report it.
    The read is armed, not stale: the April events create a UsageMonitoring::SubscriptionActivity
    (Events::PostProcessService#track_subscription_activity → TrackSubscriptionActivityService:25),
    and perform_usage_update's ProcessAllSubscriptionActivities pass recalculates the current
    component on every run (process_subscription_activity_service.rb:30-31). Clock::RefreshLifetime
    UsagesJob alone would NOT have refreshed it — it only picks rows with recalculate_invoiced_usage
    true (refresh_lifetime_usages_job.rb:14-19), and that flag was already consumed by the April 1
    billing run.

- id: b7/lifetime-usage/count_agg/period-boundary
  block: B7
  group: cnt
  key: b07_lt_count_bnd
  axes: {surface: lifetime-usage, aggregation: count_agg, timing: period-boundary}
  dimensions: {periods_spanned: 2}
  runners: [rspec]
  premium: true
  calendar_sensitive: true
  setup: {organization: {premium_integrations: [lifetime_usage]}}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-05T10:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 10}}]}
    - {at: "2024-03-10T10:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 30}}]}
    - {at: "2024-03-20T10:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 20}}]}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - {at: "2024-04-05T10:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 10}}]}
    - {at: "2024-04-10T10:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 30}}]}
    - {at: "2024-04-20T10:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 20}}]}
    - {at: "2024-04-30T23:59:59Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 40}}]}
    - {at: "2024-04-30T23:59:59Z", do: perform_usage_update}
    - {at: "2024-04-30T23:59:59Z", do: fetch_current_usage}
  expect:
    invoices: 1
    lifetime_usage:
      invoiced_usage_amount_cents: 300
      current_usage_amount_cents: 400
      external_historical_usage_amount_cents: 0
    usage: {amount_cents: 400, total_amount_cents: 400}
  math: >-
    The instant is chosen so an off-by-one moves the number in BOTH directions. The fourth April
    event is timestamped 2024-04-30T23:59:59Z — the last representable second of the calendar month —
    and the read happens at that same instant. Invoices::CustomerUsageService#boundaries
    (customer_usage_service.rb:162-180) asks Subscriptions::DatesService with current_usage: true, so
    charges_to_datetime is the period end: the boundary event is INSIDE April and the count is 4 →
    400¢. Drop the last second (an exclusive upper comparison) and the count is 3 → 300¢. Roll the
    period one second early and the current period is May, empty, → 0¢. Only at this instant do those
    three implementations disagree.
    invoiced_usage_amount_cents stays 300¢ — March's charge fee, summed over the subscription's
    invoices by CalculateService#calculate_invoiced_usage_amount_cents (calculate_service.rb:41-52) —
    which is the cumulativeness claim: the boundary read does not fold April into the invoiced
    column, and it does not lose March either. `amount` values 10/30/20/40 are carried on the events
    so a regression to sum (100), max (40) or latest (40) is a different number from 400¢ by
    coincidence only in cents, and differs in `units` (4 vs 100/40/40).

- id: b7/lifetime-usage/count_agg/after-billing
  block: B7
  group: cnt
  key: b07_lt_count_bil
  axes: {surface: lifetime-usage, aggregation: count_agg, timing: after-billing}
  dimensions: {periods_spanned: 2}
  premium: true
  setup: {organization: {premium_integrations: [lifetime_usage]}}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-05T10:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 10}}]}
    - {at: "2024-03-10T10:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 30}}]}
    - {at: "2024-03-20T10:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 20}}]}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - {at: "2024-04-05T10:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 10}}]}
    - {at: "2024-04-10T10:00:00Z", do: ingest_events, events: [{code: "%{key}", properties: {amount: 30}}]}
    - at: "2024-04-20T10:00:00Z"
      do: ingest_events
      events: [{code: "%{key}", properties: {amount: 20}}, {code: "%{key}", properties: {amount: 40}}]
    - {at: "2024-05-01T01:00:00Z", do: perform_billing}
    - {at: "2024-05-01T02:00:00Z", do: fetch_current_usage}
  expect:
    invoices: 2
    invoice:
      - {select: first, fees_amount_cents: 300, total_amount_cents: 300}
      - {select: last, fees_amount_cents: 400, total_amount_cents: 400}
    lifetime_usage:
      invoiced_usage_amount_cents: 700
      current_usage_amount_cents: 0
      external_historical_usage_amount_cents: 0
    usage: {amount_cents: 0, total_amount_cents: 0}
  math: >-
    THE CUMULATIVENESS ROW for count_agg, and the pairing is the whole assertion: after both periods
    are billed, current usage is 0 and lifetime usage is 700¢. Those two numbers in the same row are
    what distinguishes this surface from B7's current-usage slice, where the same timing legitimately
    reports 0.
    700¢ is derived, not observed: CalculateService#calculate_invoiced_usage_amount_cents
    (calculate_service.rb:41-52) sums `invoice.fees.charge.sum(:amount_cents)` over EVERY
    finalized-or-draft subscription invoice of the lineage — 3 March events → 300¢ plus 4 April
    events → 400¢. A per-period implementation would report 400¢ (only the invoice just produced);
    one that reset on billing would report 0¢; one that double-counted the period being billed would
    report 1_100¢. Both invoices are asserted so the addends are checkable independently of the sum.
    current_usage_amount_cents is 0 because the May period is empty and CalculateService recomputes
    the current component on every run (calculate_service.rb:28), and 0 is asserted rather than
    omitted: a stale current component left at April's 400¢ would make lifetime usage 1_100¢ and
    double-bill anything measured against it. perform_billing runs a usage update of its own
    (ScenariosHelper#perform_billing:431-437), and the May 1 invoice re-flags the row
    (Invoices::SubscriptionService#flag_lifetime_usage_for_refresh:203-205 →
    FlagRefreshFromInvoiceService:18-25), so this read is of a freshly recalculated row, not a stale one.

