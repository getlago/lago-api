- id: b21/b9/draft
  block: B21
  group: b9
  key: b21_w1_b9d
  axes: {subject_block: B9, surface: draft}
  premium: true
  calendar_sensitive: true
  expect:
    invoices: 1
    invoice:
      status: draft
      fees_amount_cents: 1600
      total_amount_cents: 1600
      fees_count: 1
      fees:
        - {fee_type: subscription, amount_cents: 1600, from_date: "2024-03-16T00:00:00Z", to_date: "2024-03-31T23:59:59Z"}
  math: >-
    b09/create-mid-period/arrears/none held open, and it must be identical: 16–31 March is 16 days at
    3_100¢ / 31 = 100¢ per day = 1_600¢, on the window 16–31 rather than 1–31.
    Proration is entirely producer-side. Fees::SubscriptionService runs at
    calculate_fees_service.rb:44, above the finalizing gate, and the window comes from
    DatesService#from_datetime clamping the computed 1 March to started_at (dates_service.rb:73-75) —
    nothing in either path consults the invoice's status. So this cell is an AGREEMENT, and the reason
    to pin it is that the whole B9 block had only ever measured proration on the finalized path: with
    sixteen of twenty blocks in that position, "the first invoice is prorated" and "the first invoice
    is prorated whenever we look at it" were the same statement, and only one of them had a test.
    from_date and to_date are asserted, not just the amount, for the same reason the borrowed row
    asserts them: a draft charging the right 1_600¢ for the wrong 1–31 March window would otherwise
    pass, and that window is what the customer reads.

- id: b21/b9/regenerated
  block: B21
  group: b9
  key: b21_w1_b9r
  axes: {subject_block: B9, surface: regenerated}
  premium: true
  calendar_sensitive: true
  timeline:
    - {"at":"2024-03-16T00:00:00Z","do":"create_subscription"}
    - {"at":"2024-04-01T01:00:00Z","do":"perform_billing"}
    - {"at":"2024-04-02T10:00:00Z","do":"refresh_invoice"}
  expect:
    invoices: 1
    invoice:
      status: draft
      fees_amount_cents: 1600
      total_amount_cents: 1600
      fees_count: 1
      fees:
        - {fee_type: subscription, amount_cents: 1600, from_date: "2024-03-16T00:00:00Z", to_date: "2024-03-31T23:59:59Z"}
  math: >-
    The same partial period rebuilt on 2 April — a day AFTER the period it prices ended, which is the
    reason this cell is not a duplicate of b21/b9/draft.
    A refresh does not remember the boundaries; it recomputes them.
    Invoices::RefreshDraftService#reset_invoice_values destroys the invoice_subscriptions outright
    (:122) and CreateInvoiceSubscriptionService is called again with `refresh: true` at a timestamp
    taken from the destroyed row — `invoice_subscriptions.first&.timestamp`
    (refresh_draft_service.rb:96-104), i.e. 1 April, NOT the 2 April wall clock. That indirection is
    the whole assertion: if the refresh had used Time.current, DatesService would resolve the period
    containing 2 April and bill 1–30 April, and the customer would be charged 3_100¢ for a month they
    have not had while the 16 prorated days vanished.
    1_600¢ on 16–31 March therefore excludes three implementations at once: the correct one, the
    wall-clock one (3_100¢ on 1–30 April), and one that recomputed the period correctly but lost the
    started_at clamp (3_100¢ on 1–31 March). Only the fee window separates the last two, which is why
    fees_count and both dates are asserted rather than the total alone.
    This is BIL-537's shape without its bug: there a refresh deleted a fee it should have kept, here
    it rebuilds one it must reproduce exactly.

- id: b21/b9/preview
  block: B21
  group: b9
  key: b21_w1_b9p
  axes: {subject_block: B9, surface: preview}
  premium: true
  calendar_sensitive: true
  setup: {"organization":{"premium_integrations":["preview"]},"customer":{"invoice_grace_period":null}}
  timeline:
    - {"at":"2024-03-16T00:00:00Z","do":"create_subscription"}
    - {"at":"2024-03-20T10:00:00Z","do":"preview_invoice"}
    - {"at":"2024-04-01T01:00:00Z","do":"perform_billing"}
  dimensions: {"grace_period":null}
  expect:
    invoices: 1
    invoice:
      status: finalized
      fees_amount_cents: 1600
      total_amount_cents: 1600
      fees_count: 1
      fees:
        - {fee_type: subscription, amount_cents: 1600, from_date: "2024-03-16T00:00:00Z", to_date: "2024-03-31T23:59:59Z"}
    preview:
      fees_amount_cents: 1600
      total_amount_cents: 1600
      fees_count: 1
      fees:
        - {fee_type: subscription, amount_cents: 1600, from_date: "2024-03-16T00:00:00Z", to_date: "2024-03-31T23:59:59Z"}
  math: >-
    "What will my first invoice be?" asked on 20 March, four days into a subscription that started on
    the 16th, and then compared with the invoice itself. Both must say 1_600¢ for 16–31 March.
    The preview does NOT price the period it is asked in. PreviewService#billing_time is
    `end_of_periods.first + 1.day` (preview_service.rb:145) where end_of_period comes from a
    current_usage DatesService at Time.current, so a preview taken on 20 March resolves 31 March + 1
    = 1 April and then computes boundaries AT that instant — which is why it forecasts the same period
    perform_billing raises on 1 April rather than the period after it. This is the projection context
    (`fetch_context` returns :default for a live subscription, :81-85; Preview::SubscriptionsService
    #context returns :projection because subscriptions.external_ids is present), and it is what a row
    meaning "predict my next invoice" has to be in: with no external_ids the request would silently
    become a PROPOSAL, which skips charge fees entirely and would answer this question with 0.
    A preview that fell into the following period would read 3_100¢ on 1–30 April, and one that priced
    the current period without the started_at clamp would read 3_100¢ on 1–31 March. Both are
    plausible readings of "next invoice" and both are wrong; the fee window is what tells them apart,
    so it is asserted on the preview as well as on the invoice.

- id: b21/b10/draft
  block: B21
  group: b10
  key: b21_w1_b10d
  vars: {"n1":"b21 w1 b10d coupon"}
  axes: {subject_block: B10, surface: draft}
  premium: true
  expect:
    invoices: 1
    invoice:
      status: draft
      fees_amount_cents: 16000
      coupons_amount_cents: 0
      sub_total_excluding_taxes_amount_cents: 16000
      taxes_amount_cents: 3400
      total_amount_cents: 19400
      fees_count: 3
      fees:
        - {fee_type: subscription, amount_cents: 1000, taxes_amount_cents: 150}
        - {fee_type: charge, item_code: b21_w1_b10d_taxed, amount_cents: 10000, taxes_amount_cents: 2500}
        - {fee_type: charge, item_code: b21_w1_b10d_untaxed, amount_cents: 5000, taxes_amount_cents: 750}
  math: >-
    b10/fixed_amount/once/charge held open, and it separates the block's two halves cleanly: the
    LADDER survives the draft and the coupon does not.
    The ladder is intact. Fees::ApplyTaxesService runs per fee inside
    Invoices::ComputeTaxesAndTotalsService at calculate_fees_service.rb:56, which is above the gate,
    and #applicable_taxes resolves the same three rungs it resolves on the finalized invoice
    (apply_taxes_service.rb:64-78): the charge's own 25% for b21_w1_b10d_taxed, the plan's 15% for the
    subscription fee and for the untaxed metric, and neither the customer's 10% nor the entity's 5%
    anywhere. That is asserted per fee because 150 / 2_500 / 750 and any uniform blend summing to
    3_400 are indistinguishable in an invoice total.
    The coupon is absent, and the ladder is what makes its absence expensive. Finalized, the 1_600¢
    coupon is spread across the three fees in proportion — 100 / 1_000 / 500 — and each remainder is
    taxed at ITS own rate: 900×15% + 9_000×25% + 4_500×15% = 135 + 2_250 + 675 = 3_060¢, total
    17_460¢. On the draft every fee is taxed gross: 150 + 2_500 + 750 = 3_400¢, total 19_400¢.
    So the draft overstates by 1_940¢ — 1_600 of missing discount and 340 of tax charged on it. The
    tax on a discount that will never be billed is the part a row asserting only coupons_amount_cents
    would miss, and it is why sub_total_excluding_taxes and taxes_amount_cents are both named.
    The coupon is not consumed either: `once` and still whole, because
    Credits::AppliedCouponsService was never called (:54, guarded by :368).

