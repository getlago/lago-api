        - {"code":"%{key}_sum","timestamp":"2024-03-05T11:00:00Z","properties":{"amount":10}}
        - {"code":"%{key}_sum","timestamp":"2024-03-05T12:00:00Z","properties":{"amount":5}}
    - {"at":"2024-04-01T01:00:00Z","do":"perform_billing"}
    - {"at":"2024-04-01T02:00:00Z","do":"refresh_invoice"}
  expect:
    invoices: 1
    invoice:
      status: draft
      fees_amount_cents: 10000
      coupons_amount_cents: 0
      sub_total_excluding_taxes_amount_cents: 10000
      taxes_amount_cents: 2000
      total_amount_cents: 12000
      fees_count: 3
      fees:
        - {fee_type: subscription, amount_cents: 2000}
        - {fee_type: charge, amount_cents: 3000}
        - {fee_type: commitment, amount_cents: 5000}
  math: >-
    b21/b12/draft rebuilt. Same three fees, same 12_000¢, and the true-up is the assertion because it
    is the one fee computed FROM the other fees — so a refresh has to recreate them in an order that
    lets it see them.
    #reset_invoice_values destroys all three fees; CalculateFeesService then recreates the
    subscription and charge fees inside the per-invoice_subscription loop and calls
    create_minimum_commitment_true_up_fee LAST, at :46. Commitments::Minimum::InArrears::
    CalculateTrueUpFeeService reads its fees back through FetchInvoicesService, which for a plan with
    no monthly-split intervals is `Invoice.where(id: invoice_subscription.invoice_id)` — this very
    invoice (fetch_invoices_service.rb:26-28). So it sums the 2_000¢ and 3_000¢ just written and
    charges the 5_000¢ shortfall against the 10_000¢ floor.
    Three wrong numbers are excluded. 10_000¢ of true-up (15_000¢ of fees, 18_000¢ due) is what a
    refresh that computed the true-up before the other fees, or against the destroyed ones, would
    produce — the floor charged in full as if the customer had spent nothing. 0¢ is what a refresh
    that counted the OLD commitment fee as spend would produce. And a stale 5_000¢ carried over
    rather than recomputed is excluded by the fee having been destroyed at all.
    The coupon stays withheld, so this surface asks 12_000¢ where the issued invoice asks 9_600¢
    (10_000 − 2_000 = 8_000 taxed at 20%). Producer above the gate, reducer below it, twice over: the
    line held on the first computation and holds on the second.

- id: b21/b12/preview
  block: B21
  group: b12
  key: b21_w1_b12p
  vars: {"n1":"b21 w1 b12p coupon"}
  axes: {subject_block: B12, surface: preview}
  premium: true
  setup: {"organization":{"premium_integrations":["preview"]},"customer":{"invoice_grace_period":null}}
  timeline:
