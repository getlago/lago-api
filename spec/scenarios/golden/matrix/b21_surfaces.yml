      balance_amount_cents: 3000
  math: >-
    b08/manual-full/credit/plain, followed by a second period held open. March is finalized by hand
    out of its grace period and credited in full, exactly as that row does: 30 units × 1.00 = 3_000¢
    of fees, a 3_000¢ spendable note.
    April then accrues 20 units = 2_000¢ and, finalized, would spend 2_000¢ of the note —
    Credits::CreditNoteService#apply_credits takes min(balance, remaining invoice amount)
    (credit_note_service.rb:40-46) — leaving credit_notes_amount_cents 2_000, a total of 0 and a
    balance of 1_000.
    As a draft it reads 2_000¢ due and the note untouched at 3_000¢. should_create_credit_note_credit?
    is `!not_in_finalizing_process?` (calculate_fees_service.rb:364-366), the bluntest of the three
    guards.
    The note is asserted with `select: {index: -1}` rather than bare, because a bare credit_note
    expectation compares the payload captured when the note was CREATED — on 3 April, before April's
    invoice existed — and would report balance 3_000¢ whether or not the draft had spent it. The
    whole row would pass while asserting nothing.
    This is the pair the B20 lead turned on, in the direction where the gate helps: there the credit
    was diverted into a note that a finalized invoice spent on the spot, so the total came out right
    and only the draft showed the double-bill. Here the withholding is what it is designed to be —
    the customer sees 2_000¢ due, will be billed 0, and the note is still theirs.

