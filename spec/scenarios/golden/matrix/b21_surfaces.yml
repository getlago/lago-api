    - at: "2024-03-05T10:00:00Z"
      do: "ingest_events"
      events:
        - {"code":"%{key}_sum","timestamp":"2024-03-05T10:00:00Z","properties":{"amount":50}}
        - {"code":"%{key}_sum","timestamp":"2024-03-05T11:00:00Z","properties":{"amount":30}}
        - {"code":"%{key}_sum","timestamp":"2024-03-05T12:00:00Z","properties":{"amount":20}}
    - {"at":"2024-04-01T01:00:00Z","do":"perform_billing"}
    - {"at":"2024-04-01T02:00:00Z","do":"refresh_invoice"}
  dimensions: {"coupon_frequency":"once"}
  expect:
    invoices: 1
    invoice:
      status: draft
      fees_amount_cents: 15000
      coupons_amount_cents: 0
      credit_notes_amount_cents: 0
      prepaid_credit_amount_cents: 0
      total_amount_cents: 15000
  math: >-
    b19/coupon/equal rebuilt: 5_000¢ plan + 100 units = 15_000¢, two 2_000¢ `once` coupons that both
    apply and add on the issued invoice, settling it at 11_000¢. The refreshed draft reads 15_000¢
    with neither applied.
    The multiplicity question is undecidable here, and the row says how badly: one coupon applied
    would give 13_000¢, both 11_000¢, and this surface reports 15_000¢ — further from either than they
    are from each other. A block that varies HOW MANY instances of a feature meet cannot be measured
    on a surface that admits none.
    What the refresh does establish is that both coupons are still spendable after two passes.
    `should_terminate_applied_coupon?` fires only from inside Credits::AppliedCouponService
    (applied_coupon_service.rb:78-85), which the gate at calculate_fees_service.rb:368 keeps
    unreached, so neither `once` coupon is marked consumed by either computation.
    That is the failure worth excluding rather than the totals. Had a refresh evaluated the coupons —
    even without booking the credits — the first pass could have terminated one and the second the
    other, and the finalized invoice would then discount 0¢ and bill 15_000¢ for real: a grace period
    silently destroying a customer's discounts, which is precisely what withholding exists to prevent.
    The three zeroes are asserted individually because the three withheld reducers share one total:
    15_000¢ is equally consistent with a coupon lost, a credit note lost or a wallet not spent, and
    only naming each says which of them this scenario had none of.

- id: b21/b19/preview
  block: B21
  group: b19
  key: b21_w1_b19p
  vars: {"n1":"b21 w1 b19p first","n2":"b21 w1 b19p second"}
  axes: {subject_block: B19, surface: preview}
  premium: true
  setup: {"organization":{"premium_integrations":["preview"]},"customer":{"invoice_grace_period":null}}
  timeline:
    - {"at":"2024-03-01T00:00:00Z","do":"create_subscription"}
    - at: "2024-03-05T10:00:00Z"
      do: "ingest_events"
      events:
        - {"code":"%{key}_sum","timestamp":"2024-03-05T10:00:00Z","properties":{"amount":50}}
        - {"code":"%{key}_sum","timestamp":"2024-03-05T11:00:00Z","properties":{"amount":30}}
        - {"code":"%{key}_sum","timestamp":"2024-03-05T12:00:00Z","properties":{"amount":20}}
    - {"at":"2024-03-20T10:00:00Z","do":"preview_invoice"}
    - {"at":"2024-04-01T01:00:00Z","do":"perform_billing"}
  dimensions: {"coupon_frequency":"once","grace_period":null}
  runners: ["rspec"]
  expect:
    invoices: 1
    invoice:
      status: finalized
      fees_amount_cents: 15000
      coupons_amount_cents: 4000
      sub_total_excluding_taxes_amount_cents: 11000
      total_amount_cents: 11000
    preview:
      fees_amount_cents: 15000
      coupons_amount_cents: 4000
      sub_total_excluding_taxes_amount_cents: 11000
      total_amount_cents: 11000
  math: >-
    The two surfaces AGREE that two coupons ADD, and reaching that through PreviewService means
    surviving a loop that could have stopped after one.
    Both read 4_000¢ of discount on 15_000¢ of fees and 11_000¢ due, matching b19/coupon/equal/invoice.
    Coupons::PreviewService iterates `applied_coupons` and breaks only on
    `unless invoice.sub_total_excluding_taxes_amount_cents&.positive?` (coupons/preview_service.rb:23)
    — the same guard as the real Credits::AppliedCouponsService:28. With a 15_000¢ base neither 2_000¢
    coupon exhausts it, so the loop runs twice, each AppliedCoupons::AmountService call returns the
    full 2_000¢, and coupons_amount_cents accumulates to 4_000¢.
    2_000¢ would be the answer if the preview took only the first applied coupon, and 15_000¢ if it
    read `customer.applied_coupons` in a scope that excluded them; both are plausible in a service
    whose coupons arrive as an injected array rather than from the invoice
    (preview_service.rb:7-10, populated by PreviewContextService from customer.applied_coupons.active).
    Neither coupon is consumed by the quote: `once` and both still whole when 1 April spends them for
    real, which is why the preview and the invoice can look at the same period and agree. Had the
    preview terminated them, the invoice on 1 April would have found none and billed 15_000¢ — so the
    invoice's own 4_000¢ is the control that the preview was read-only, exactly as the wallet is in
    b21/b6/preview and the credit-note balance in b21/b8/preview.
