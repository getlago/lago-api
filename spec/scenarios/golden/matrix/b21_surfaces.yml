# B21 — what each surface makes of a representative scenario from another block.
#
# Sixteen of twenty blocks had only ever asserted a finalized invoice. This block asks the question
# they never did: hold the same period open, refresh it, or quote it, and does it still say the same
# thing? For anything involving a reducer the answer is no, because coupons, credit notes and prepaid
# credit are all gated on `not_in_finalizing_process?` — so a draft shows the customer a number they
# will not be billed.
#
# One row per (subject block, surface). The scenario is deliberately borrowed from the subject block
# rather than invented, so a difference here is attributable to the surface and nothing else.
---
- __matrix:
    defaults:
      provenance: "coverage-gap"
      runners: ["rspec","live"]
      dimensions: {"interval":"monthly","billing_time":"calendar"}
      setup:
        metrics: [{"code":"%{key}_sum","aggregation_type":"sum_agg","field_name":"amount"}]
        plan: {"code":"golden_%{key}","interval":"monthly","amount_cents":0}
        charges: [{"billable_metric_code":"%{key}_sum","charge_model":"standard","properties":{"amount":"1"}}]
        customer: {"external_id":"golden_%{key}_cust","currency":"EUR","invoice_grace_period":5}
        subscription: {"external_id":"golden_%{key}_sub","billing_time":"calendar"}
    groups:
      b15:
        setup:
          taxes: [{"code":"%{key}_vat","name":"VAT","rate":20}]
          coupons:
            - name: "%{n1}"
              code: "%{key}_coupon"
              coupon_type: "fixed_amount"
              frequency: "once"
              amount_cents: 4000
              amount_currency: "EUR"
              expiration: "no_expiration"
        timeline:
          - {"at":"2024-03-01T00:00:00Z","do":"create_subscription"}
          - {"at":"2024-03-05T10:00:00Z","do":"ingest_events","events":[{"code":"%{key}_sum","properties":{"amount":100}}]}
          - {"at":"2024-04-01T01:00:00Z","do":"perform_billing"}
        dimensions: {"tax_rate":20,"grace_period":5}
      b19:
        setup:
          plan: {"amount_cents":5000}
          coupons:
            - name: "%{n1}"
              code: "%{key}_one"
              coupon_type: "fixed_amount"
              frequency: "once"
              amount_cents: 2000
              amount_currency: "EUR"
              expiration: "no_expiration"
            - name: "%{n2}"
              code: "%{key}_two"
              coupon_type: "fixed_amount"
              frequency: "once"
              amount_cents: 2000
              amount_currency: "EUR"
              expiration: "no_expiration"
        timeline:
          - {"at":"2024-03-01T00:00:00Z","do":"create_subscription"}
          - {"at":"2024-03-05T10:00:00Z","do":"ingest_events","events":[{"code":"%{key}_sum","properties":{"amount":100}}]}
          - {"at":"2024-04-01T01:00:00Z","do":"perform_billing"}
        dimensions: {"taxes":"none","grace_period":5}
      b12:
        setup:
          taxes: [{"code":"%{key}_vat","name":"VAT","rate":20}]
          plan: {"amount_cents":2000,"minimum_commitment":{"amount_cents":10000}}
          coupons:
            - name: "%{n1}"
              code: "%{key}_coupon"
              coupon_type: "fixed_amount"
              frequency: "once"
              amount_cents: 2000
              amount_currency: "EUR"
              expiration: "no_expiration"
        timeline:
          - {"at":"2024-03-01T00:00:00Z","do":"create_subscription"}
          - {"at":"2024-03-05T10:00:00Z","do":"ingest_events","events":[{"code":"%{key}_sum","properties":{"amount":30}}]}
          - {"at":"2024-04-01T01:00:00Z","do":"perform_billing"}
        dimensions: {"tax_rate":20,"grace_period":5,"commitment_amount_cents":10000}
      b5:
        setup:
          organization: {"premium_integrations":["progressive_billing"]}
          taxes: [{"code":"%{key}_vat","name":"VAT","rate":20}]
          plan: {"usage_thresholds":[{"amount_cents":2000}]}
        timeline:
          - {"at":"2024-03-01T00:00:00Z","do":"create_subscription"}
          - at: "2024-03-05T10:00:00Z"
            do: "ingest_events"
            events:
              - {"code":"%{key}_sum","timestamp":"2024-03-05T10:00:00Z","properties":{"amount":15}}
              - {"code":"%{key}_sum","timestamp":"2024-03-05T11:00:00Z","properties":{"amount":10}}
              - {"code":"%{key}_sum","timestamp":"2024-03-05T12:00:00Z","properties":{"amount":5}}
          - {"at":"2024-03-05T13:00:00Z","do":"perform_usage_update"}
          - {"at":"2024-04-01T01:00:00Z","do":"perform_billing"}
        dimensions: {"tax_rate":20,"grace_period":5,"threshold_amount_cents":2000}
      b6:
        setup: {"wallets":[{"name":"granted","rate_amount":"1","currency":"EUR","granted_credits":"10"}]}
        timeline:
          - {"at":"2024-03-01T00:00:00Z","do":"create_subscription"}
          - at: "2024-03-05T10:00:00Z"
            do: "ingest_events"
            events:
              - {"code":"%{key}_sum","timestamp":"2024-03-05T10:00:00Z","properties":{"amount":15}}
              - {"code":"%{key}_sum","timestamp":"2024-03-05T11:00:00Z","properties":{"amount":10}}
              - {"code":"%{key}_sum","timestamp":"2024-03-05T12:00:00Z","properties":{"amount":5}}
          - {"at":"2024-04-01T01:00:00Z","do":"perform_billing"}
        dimensions: {"taxes":"none","grace_period":5,"rate_amount":1}
      b8:
        timeline:
          - {"at":"2024-03-01T00:00:00Z","do":"create_subscription"}
          - at: "2024-03-05T10:00:00Z"
            do: "ingest_events"
            events:
              - {"code":"%{key}_sum","timestamp":"2024-03-05T10:00:00Z","properties":{"amount":15}}
              - {"code":"%{key}_sum","timestamp":"2024-03-05T11:00:00Z","properties":{"amount":10}}
              - {"code":"%{key}_sum","timestamp":"2024-03-05T12:00:00Z","properties":{"amount":5}}
          - {"at":"2024-04-01T01:00:00Z","do":"perform_billing"}
          - {"at":"2024-04-02T10:00:00Z","do":"finalize_invoice"}
          - at: "2024-04-03T10:00:00Z"
            do: "create_credit_note"
            credit_note: {"reason":"other","credit_amount_cents":3000,"refund_amount_cents":0,"items":[{"fee_type":"charge","amount_cents":3000}]}
          - at: "2024-04-05T10:00:00Z"
            do: "ingest_events"
            events:
              - {"code":"%{key}_sum","timestamp":"2024-04-05T10:00:00Z","properties":{"amount":12}}
              - {"code":"%{key}_sum","timestamp":"2024-04-05T11:00:00Z","properties":{"amount":5}}
              - {"code":"%{key}_sum","timestamp":"2024-04-05T12:00:00Z","properties":{"amount":3}}
          - {"at":"2024-05-01T01:00:00Z","do":"perform_billing"}
        dimensions: {"taxes":"none","grace_period":5,"credit_note_type":"credit"}
      b9:
        setup: {"plan":{"amount_cents":3100,"pay_in_advance":false},"metrics":null,"charges":null}
        timeline: [{"at":"2024-03-16T00:00:00Z","do":"create_subscription"},{"at":"2024-04-01T01:00:00Z","do":"perform_billing"}]
        dimensions: {"taxes":"none","grace_period":5,"created_day":16}
        runners: ["rspec"]
      b10:
        setup:
          taxes:
            - {"code":"%{key}_entity","name":"entity default","rate":5,"applied_to_organization":true}
            - {"code":"%{key}_customer","name":"customer","rate":10,"applied_to_organization":false}
            - {"code":"%{key}_plan","name":"plan","rate":15,"applied_to_organization":false}
            - {"code":"%{key}_charge","name":"charge","rate":25,"applied_to_organization":false}
          metrics:
            - {"code":"%{key}_taxed","aggregation_type":"sum_agg","field_name":"amount"}
            - {"code":"%{key}_untaxed","aggregation_type":"sum_agg","field_name":"amount"}
          plan: {"amount_cents":1000,"tax_codes":["%{key}_plan"]}
          charges:
            - {"billable_metric_code":"%{key}_taxed","charge_model":"standard","properties":{"amount":"1"},"tax_codes":["%{key}_charge"]}
            - {"billable_metric_code":"%{key}_untaxed","charge_model":"standard","properties":{"amount":"1"}}
          customer: {"tax_codes":["%{key}_customer"]}
          coupons:
            - name: "%{n1}"
              code: "%{key}_coupon"
              coupon_type: "fixed_amount"
              frequency: "once"
              amount_cents: 1600
              amount_currency: "EUR"
              expiration: "no_expiration"
        timeline:
          - {"at":"2024-03-01T00:00:00Z","do":"create_subscription"}
          - at: "2024-03-05T10:00:00Z"
            do: "ingest_events"
            events:
              - {"code":"%{key}_taxed","timestamp":"2024-03-05T10:00:00Z","properties":{"amount":50}}
              - {"code":"%{key}_taxed","timestamp":"2024-03-05T11:00:00Z","properties":{"amount":30}}
              - {"code":"%{key}_taxed","timestamp":"2024-03-05T12:00:00Z","properties":{"amount":20}}
              - {"code":"%{key}_untaxed","timestamp":"2024-03-05T13:00:00Z","properties":{"amount":25}}
              - {"code":"%{key}_untaxed","timestamp":"2024-03-05T14:00:00Z","properties":{"amount":15}}
              - {"code":"%{key}_untaxed","timestamp":"2024-03-05T15:00:00Z","properties":{"amount":10}}
          - {"at":"2024-04-01T01:00:00Z","do":"perform_billing"}
        dimensions: {"grace_period":5,"coupon_type":"fixed_amount","coupon_frequency":"once","tax_level":"charge"}

- id: b21/b15/draft
  block: B21
  group: b15
  key: b21_b15
  vars: {"n1":"b21 b15 coupon"}
  axes: {subject_block: B15, surface: draft}
  premium: true
  expect:
    invoices: 1
    invoice:
      status: draft
      fees_amount_cents: 10000
      coupons_amount_cents: 0
      sub_total_excluding_taxes_amount_cents: 10000
      taxes_amount_cents: 2000
      total_amount_cents: 12000
  math: >-
    b15/coupon/tax held open instead of issued. That row is the suite's canonical proof that a coupon
    applies BEFORE tax: 10_000¢ of fees less a 4_000¢ coupon = 6_000¢ taxed at 20% = 1_200¢, total
    7_200¢.
    As a draft the same period reads 12_000¢. The coupon is not applied at all —
    `should_create_coupon_credit?` returns false unless the invoice is finalizing
    (calculate_fees_service.rb:368) — so tax falls on the full undiscounted 10_000¢ and there is no
    discount to subtract.
    Both numbers are correct for what they are, and that is the point: the interaction B15 exists to
    pin is INVISIBLE on a draft, because only one of its two stages has run. A customer reading this
    invoice mid-period sees 12_000¢ and will be billed 7_200¢ — a 67% overstatement, and the larger the
    coupon the worse it gets.
    coupons_amount_cents is asserted as 0 rather than omitted, because "no coupon" and "a coupon of
    zero" look identical in a total.

- id: b21/b19/draft
  block: B21
  group: b19
  key: b21_b19
  vars: {"n1":"b21 first coupon","n2":"b21 second coupon"}
  axes: {subject_block: B19, surface: draft}
  premium: true
  expect:
    invoices: 1
    invoice:
      status: draft
      fees_amount_cents: 15000
      coupons_amount_cents: 0
      total_amount_cents: 15000
  math: >-
    b19/coupon/equal/invoice held open. Issued, that invoice discounts 4_000¢ — two 2_000¢ coupons that
    both apply and add — and settles at 11_000¢.
    As a draft it reads the full 15_000¢ with neither coupon applied, and the multiplicity question B19
    exists to answer cannot even be asked: whether two coupons add, compete or are consumed in an order
    is undecidable on a surface that applies none of them.
    There is a reason this gating is right, and it is worth stating because it looks like a bug. Both
    coupons are `frequency: once`. Had the draft consumed them, a refresh would have to give them back,
    and `should_terminate_applied_coupon?` has already decided one of them is spent. Withholding until
    finalization is what keeps a grace period from destroying a customer's discounts.

- id: b21/b12/draft
  block: B21
  group: b12
  key: b21_b12
  vars: {"n1":"b21 b12 coupon"}
  axes: {subject_block: B12, surface: draft}
  premium: true
  expect:
    invoices: 1
    invoice:
      status: draft
      fees_amount_cents: 10000
      coupons_amount_cents: 0
      sub_total_excluding_taxes_amount_cents: 10000
      taxes_amount_cents: 2000
      total_amount_cents: 12000
      fees_count: 3
      fees:
        - {fee_type: subscription, amount_cents: 2000}
        - {fee_type: charge, amount_cents: 3000}
        - {fee_type: commitment, amount_cents: 5000}
  math: >-
    b12/in-arrears/calendar/monthly held open, and the row that shows the gating is drawn in the right
    place rather than arbitrarily.
    The commitment true-up is PRESENT on the draft: 2_000¢ subscription + 3_000¢ of usage against a
    10_000¢ floor gives a 5_000¢ `commitment` fee, all three fees exactly as on the issued invoice.
    That is because a true-up is a fee PRODUCER, created alongside the others
    (calculate_fees_service.rb:46), and the finalizing gate sits below the producers.
    The coupon is absent, so the draft asks 12_000¢ where the issued invoice asks 9_600¢.
    So on one draft, in one row: the producer survives and the reducer does not, and the line between
    them is where the gate is. Asserting the three fees individually is what makes that visible —
    fees_amount_cents is 10_000¢ either way and could not tell the true-up was computed at all.

# ---------------------------------------------------------------------------------------------
# b21_w1 — the remaining 21 cells.
#
# Conventions, so the three rows of a subject block are directly comparable to each other and to
# the block they borrow from:
#   * the SCENARIO is lifted from a green row of the subject block and its pricing is not touched,
#     so any difference below is attributable to the surface and to nothing else. `math` names the
#     borrowed row and the number IT asserts — that finalized number is the other half of every
#     assertion here.
#   * `draft` holds the period open with invoice_grace_period 5 and asserts the untouched draft.
#     `regenerated` does the same and then rebuilds it with PUT /invoices/:id/refresh.
#     `preview` uses NO grace period and asserts POST /invoices/preview and the invoice it
#     forecasts in one row, so agreement is asserted rather than described.
#   * a preview is always taken mid-period. Invoices::PreviewService#billing_time is
#     `end_of_periods.first + 1.day` (preview_service.rb:145), so a projection taken on 20 March
#     quotes the very period that perform_billing raises on 1 April — the same period, twice.
#   * every row here is `premium: true`; preview rows also need
#     organization.premium_integrations: [preview] (preview_service.rb:22), and B5 rows need
#     [progressive_billing] plus `no_transaction: true`.
#   * three events wherever there is usage, valued so sum / max / latest all differ, even though
#     no row here varies aggregation — one event cannot tell a total from a delta and the totals
#     are identical to the borrowed row's anyway.
# ---------------------------------------------------------------------------------------------

- id: b21/b5/draft
  block: B21
  group: b5
  key: b21_w1_b5d
  axes: {subject_block: B5, surface: draft}
  premium: true
  no_transaction: true
  expect:
    invoices: 2
    invoice:
      - select: {invoice_type: progressive_billing}
        status: finalized
        fees_amount_cents: 3000
        taxes_amount_cents: 600
        total_amount_cents: 3600
      - select: {invoice_type: subscription}
        status: draft
        fees_amount_cents: 3000
        progressive_billing_credit_amount_cents: 3000
        sub_total_excluding_taxes_amount_cents: 0
        taxes_amount_cents: 0
        total_amount_cents: 0
  math: >-
    b05/fixed/single/credited-on-final with 20% VAT added and the period held open. That row's
    finalized period invoice reads fees 3_000¢, progressive_billing_credit 3_000¢, total 0 — and the
    draft here reads EXACTLY the same, which is the assertion.
    Progressive billing is the one reducer that is NOT gated on finalization: Credits::
    ProgressiveBillingService runs at calculate_fees_service.rb:53, above the three
    `not_in_finalizing_process?` guards at :364-379. So the draft both books the 3_000¢ credit and
    calls apply_credit_to_fees (progressive_billing_service.rb:68-84), which pushes the credit into
    the charge fee's precise_coupons_amount_cents. fee.sub_total_excluding_taxes_amount_cents is
    `amount_cents - precise_coupons_amount_cents` (fee.rb:238-240) = 0, so the fee's own tax is 0 and
    the invoice's is 0 too.
    A draft that showed the credit at invoice level but not at fee level would read taxes 600¢ and a
    600¢ total — tax charged twice on usage already taxed on the threshold invoice. That is exactly
    what b21/b5/preview finds on the OTHER surface, which is why this row asserts taxes_amount_cents
    explicitly rather than only the total: 0 and 0 look identical in a total that is zero either way.
    The threshold invoice is asserted too, and asserted as `finalized`: Invoices::
    ProgressiveBillingService ends in Invoices::FinalizeService.call! (:47) without ever consulting
    grace_period?, so a threshold invoice is never a draft — the grace period only reaches the
    period invoice, and a row that assumed otherwise would be selecting the wrong invoice.

- id: b21/b5/regenerated
  block: B21
  group: b5
  key: b21_w1_b5r
  axes: {subject_block: B5, surface: regenerated}
  premium: true
  no_transaction: true
  timeline:
    - {"at":"2024-03-01T00:00:00Z","do":"create_subscription"}
    - at: "2024-03-05T10:00:00Z"
      do: "ingest_events"
      events:
        - {"code":"%{key}_sum","timestamp":"2024-03-05T10:00:00Z","properties":{"amount":15}}
        - {"code":"%{key}_sum","timestamp":"2024-03-05T11:00:00Z","properties":{"amount":10}}
        - {"code":"%{key}_sum","timestamp":"2024-03-05T12:00:00Z","properties":{"amount":5}}
    - {"at":"2024-03-05T13:00:00Z","do":"perform_usage_update"}
    - {"at":"2024-04-01T01:00:00Z","do":"perform_billing"}
    - {"at":"2024-04-01T02:00:00Z","do":"refresh_invoice","select":{"invoice_type":"subscription"}}
  expect:
    invoices: 2
    invoice:
      - select: {invoice_type: progressive_billing}
        status: finalized
        fees_amount_cents: 3000
        total_amount_cents: 3600
      - select: {invoice_type: subscription}
        status: draft
        fees_amount_cents: 3000
        progressive_billing_credit_amount_cents: 3000
        sub_total_excluding_taxes_amount_cents: 0
        taxes_amount_cents: 0
        total_amount_cents: 0
  math: >-
    The same period as b21/b5/draft, rebuilt from scratch, and the interesting number is that the
    credit is booked ONCE and not twice.
    Invoices::RefreshDraftService#reset_invoice_values destroys the fees AND
    `invoice.credits.progressive_billing_invoice_kind` (refresh_draft_service.rb:123) before zeroing
    progressive_billing_credit_amount_cents (:132). Credits::ProgressiveBillingService then runs
    again on the rebuilt fees and re-derives the same 3_000¢ from Subscriptions::
    ProgressiveBilledAmount, whose to_credit_amount is the threshold invoice's fees_amount_cents net
    of coupons, its own progressive credits and its credit notes (progressive_billed_amount.rb:60-64)
    — a figure that does not move when a different invoice is refreshed.
    Had the reset missed the Credit rows, the second pass would ADD another 3_000¢ and the invoice
    would read progressive_billing_credit 6_000¢ against 3_000¢ of fees; had it missed
    apply_credit_to_fees, the per-fee reduction would be lost and the 600¢ of tax would reappear. The
    row asserts progressive_billing_credit_amount_cents, sub_total and taxes together because the
    total is 0 under all three readings and cannot separate them.
    `refresh_invoice` names its target with `select: {invoice_type: subscription}` rather than
    defaulting to the newest: the newest invoice here is the period invoice by creation order, but
    the threshold invoice is finalized and PUT /invoices/:id/refresh on it would be a no-op
    (refresh_draft_service.rb:32 `return result unless invoice.draft?`) — a silent pass.

- id: b21/b5/preview
  block: B21
  group: b5
  key: b21_w1_b5p
  axes: {subject_block: B5, surface: preview}
  premium: true
  no_transaction: true
  pins: ["F84"]
  setup: {"organization":{"premium_integrations":["preview","progressive_billing"]},"customer":{"invoice_grace_period":null}}
  timeline:
    - {"at":"2024-03-01T00:00:00Z","do":"create_subscription"}
    - at: "2024-03-05T10:00:00Z"
      do: "ingest_events"
      events:
        - {"code":"%{key}_sum","timestamp":"2024-03-05T10:00:00Z","properties":{"amount":15}}
        - {"code":"%{key}_sum","timestamp":"2024-03-05T11:00:00Z","properties":{"amount":10}}
        - {"code":"%{key}_sum","timestamp":"2024-03-05T12:00:00Z","properties":{"amount":5}}
    - {"at":"2024-03-05T13:00:00Z","do":"perform_usage_update"}
    - {"at":"2024-03-20T10:00:00Z","do":"preview_invoice"}
    - {"at":"2024-04-01T01:00:00Z","do":"perform_billing"}
  dimensions: {"grace_period":null}
  runners: ["rspec"]
  expect:
    invoices: 2
    invoice:
      select: {invoice_type: subscription}
      status: finalized
      fees_amount_cents: 3000
      progressive_billing_credit_amount_cents: 3000
      sub_total_excluding_taxes_amount_cents: 0
      taxes_amount_cents: 0
      total_amount_cents: 0
    preview:
      fees_amount_cents: 3000
      progressive_billing_credit_amount_cents: 3000
      sub_total_excluding_taxes_amount_cents: 0
      taxes_amount_cents: 600
      total_amount_cents: 600
  math: >-
    PINS F84, AND THE TWO SURFACES DISAGREE. The same period is quoted on 20 March and then issued on
    1 April, and the issued invoice is asserted in the same row so the gap is a fact rather than a
    claim: 0¢ due, 600¢ quoted.
    Both surfaces agree on the credit. Invoices::PreviewService#apply_progressive_billing_credits
    (preview_service.rb:330-359) deliberately reuses the read-only Subscriptions::
    ProgressiveBilledAmount, so it finds the same 3_000¢ and :302 subtracts it from
    sub_total_excluding_taxes — 3_000 − 0 − 3_000 = 0 on both surfaces.
    They disagree on the tax, and the reason is one missing line. The real pipeline calls
    apply_credit_to_fees, so the charge fee carries precise_coupons_amount_cents 3_000 and
    Fees::ApplyTaxesService taxes `fee.sub_total_excluding_taxes_amount_cents` = 0
    (apply_taxes_service.rb:38, fee.rb:238-240). The preview's copy of the arithmetic bumps only the
    invoice-level counter and never touches a fee, so :309 taxes the GROSS 3_000¢ at 20% = 600¢, and
    :312-317 then reads sub_total_including 0 + 600 and a total of 600¢.
    So the preview quotes 600¢ of VAT on a taxable base it has itself computed as zero — tax on usage
    the customer already paid tax on, on the threshold invoice this row also asserts. It is the exact
    shape of F70 reached from the other side: there the invoice lost the per-fee reduction because a
    churn broke the charge_id join, here the preview never attempts one.
    A zero-tax scenario cannot see this at all, which is why this row carries VAT while
    b05/fixed/single/credited-on-final does not: with rate 0 both surfaces read 0 and agree.

- id: b21/b6/draft
  block: B21
  group: b6
  key: b21_w1_b6d
  axes: {subject_block: B6, surface: draft}
  premium: true
  expect:
    invoices: 1
    invoice:
      status: draft
      fees_amount_cents: 3000
      prepaid_credit_amount_cents: 0
      total_amount_cents: 3000
    wallet:
      balance_cents: 1000
      credits_balance: "10.0"
  math: >-
    b06/granted/none/partial-cover held open. That row's finalized invoice reads fees 3_000¢,
    prepaid_credit 1_000¢, total 2_000¢, and the wallet ends empty.
    The draft reads 3_000¢ due and the wallet still full. should_create_applied_prepaid_credit?
    begins `return false if not_in_finalizing_process?` (calculate_fees_service.rb:375-379), so
    Credits::AppliedPrepaidCreditsService never runs and no WalletTransaction is written.
    Both halves are asserted because either alone is ambiguous. prepaid_credit_amount_cents 0 with an
    empty wallet would mean the credits were spent and the invoice failed to record it — money gone
    with nothing to show for it. A full wallet with a 2_000¢ total would mean the reverse. 0 and 1_000
    together are the only reading in which nothing has happened yet.
    And nothing happening yet is right: the gate is what makes a grace period reversible. Were a draft
    to burn 1_000¢ of prepaid credit, a refresh would have to give it back, and Invoices::
    RefreshDraftService has no code that does — it recredits nothing (compare Invoices::VoidService,
    which recredits coupons and wallet transactions explicitly, :37-49). The draft overstating by
    1_000¢ is the price of never having to un-spend a wallet.

- id: b21/b6/regenerated
