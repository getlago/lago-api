    (refresh_draft_service.rb:121-122); the Fee::AppliedTax rows go with them. The second pass
    resolves the ladder from scratch, per fee, and must land on 150 / 2_500 / 750 — the same three
    rungs, still shadowing the customer's 10% and the entity's 5%.
    Three regressions are excluded by the per-fee figures and by nothing else. A rebuilt fee that lost
    its charge association would fall to the plan's 15% and read 1_500¢ instead of 2_500¢, total
    18_400¢. A refresh that appended taxes rather than replacing them would double them to 6_800¢. A
    refresh that resolved the ladder against the invoice instead of the fee would apply one blended
    rate. All three are invisible in fees_amount_cents, which is 16_000¢ throughout.
    The coupon stays absent and unconsumed — `context: :refresh` keeps not_in_finalizing_process?
    true — so the surface still asks 19_400¢ where b10/fixed_amount/once/charge asks 17_460¢. Two
    passes do not move the customer any closer to the number they will pay, which is the honest
    reading of "refreshed and nothing moved" for a reducer that is gated rather than stale.

- id: b21/b10/preview
  block: B21
  group: b10
  key: b21_w1_b10p
  vars: {"n1":"b21 w1 b10p coupon"}
  axes: {subject_block: B10, surface: preview}
  premium: true
  no_transaction: true
  setup: {"organization":{"premium_integrations":["preview"]},"customer":{"invoice_grace_period":null}}
  timeline:
    - {"at":"2024-03-01T00:00:00Z","do":"create_subscription"}
    - at: "2024-03-05T10:00:00Z"
      do: "ingest_events"
      events:
        - {"code":"%{key}_taxed","timestamp":"2024-03-05T10:00:00Z","properties":{"amount":50}}
        - {"code":"%{key}_taxed","timestamp":"2024-03-05T11:00:00Z","properties":{"amount":30}}
        - {"code":"%{key}_taxed","timestamp":"2024-03-05T12:00:00Z","properties":{"amount":20}}
        - {"code":"%{key}_untaxed","timestamp":"2024-03-05T13:00:00Z","properties":{"amount":25}}
        - {"code":"%{key}_untaxed","timestamp":"2024-03-05T14:00:00Z","properties":{"amount":15}}
        - {"code":"%{key}_untaxed","timestamp":"2024-03-05T15:00:00Z","properties":{"amount":10}}
    - {"at":"2024-03-20T10:00:00Z","do":"preview_invoice"}
    - {"at":"2024-04-01T01:00:00Z","do":"perform_billing"}
  dimensions: {"grace_period":null}
  runners: ["rspec"]
  expect:
    invoices: 1
    invoice:
      status: finalized
      fees_amount_cents: 16000
      coupons_amount_cents: 1600
      sub_total_excluding_taxes_amount_cents: 14400
      taxes_amount_cents: 3060
      total_amount_cents: 17460
    preview:
      fees_amount_cents: 16000
      coupons_amount_cents: 1600
      sub_total_excluding_taxes_amount_cents: 14400
      taxes_amount_cents: 3060
      total_amount_cents: 17460
      fees_count: 3
      fees:
        - {fee_type: subscription, amount_cents: 1000, taxes_amount_cents: 135}
        - {fee_type: charge, item_code: b21_w1_b10p_taxed, amount_cents: 10000, taxes_amount_cents: 2250}
        - {fee_type: charge, item_code: b21_w1_b10p_untaxed, amount_cents: 5000, taxes_amount_cents: 675}
  math: >-
    The two surfaces AGREE on the hardest number in the block, and PreviewService gets there through
    its own code.
    Both read 3_060¢ of tax and 17_460¢ due, matching b10/fixed_amount/once/charge exactly. That is
    not a shared implementation: #compute_tax_and_totals reimplements the pipeline
    (preview_service.rb:292-321), and it happens to preserve both properties this block tests. The
    order is right — Coupons::PreviewService at :299, taxes at :309 — and so is the per-fee
    distribution: Coupons::PreviewService#add_credit walks the fees and increments
    precise_coupons_amount_cents by fee.compute_precise_credit_amount_cents (preview_service, coupons/
    preview_service.rb:57-62), the same method the real Credits::AppliedCouponsService uses. So the
    spread is 100 / 1_000 / 500 and each fee is taxed at its own rung on what remains:
    900×15% + 9_000×25% + 4_500×15% = 135 + 2_250 + 675.
    The per-fee taxes are asserted on the PREVIEW rather than on the invoice, because the invoice side
    is already pinned by the borrowed row and the preview side is where a second implementation could
    drift. Two drifts are excluded: a preview that taxed before discounting would read 3_400¢ and
    17_800¢ (b21/b10/draft's tax figure — the same mistake the draft makes for a different reason),
    and a preview that discounted at invoice level without touching the fees would read the same
    3_400¢ of fee tax while claiming a 14_400¢ sub_total, which is precisely the inconsistency
    b21/b5/preview catches on the progressive-billing path.
    Nothing is consumed: the coupon is `once` and still whole when 1 April spends it, which is why one
    period is enough here — the preview and the invoice are looking at the SAME period, not
    consecutive ones.
    `no_transaction: true` is REQUIRED and is not decoration. Invoices::PreviewService#add_charge_fees
    wraps each charge in `ActiveRecord::Base.connection_pool.with_connection` inside a Parallel block
    (preview_service.rb:204-226); with more than one charge that releases the connection carrying
    RSpec's test transaction, and the next lazy association load — `applied_coupon.coupon` at
    coupons/preview_service.rb:22 — comes back nil against an empty database, so the request 500s with
    `undefined method 'fixed_amount?' for nil`. Verified by bisection: the identical row with ONE
    charge does not raise, and this row with the deletion strategy does not either. It is the same
    mechanism as F73 (recorded as F86) and it makes every MULTI-CHARGE preview row in the suite need this flag.

- id: b21/b12/regenerated
  block: B21
  group: b12
  key: b21_w1_b12r
  vars: {"n1":"b21 w1 b12r coupon"}
  axes: {subject_block: B12, surface: regenerated}
  premium: true
  timeline:
    - {"at":"2024-03-01T00:00:00Z","do":"create_subscription"}
    - at: "2024-03-05T10:00:00Z"
      do: "ingest_events"
      events:
