        - {"code":"%{key}_sum","timestamp":"2024-03-05T11:00:00Z","properties":{"amount":10}}
        - {"code":"%{key}_sum","timestamp":"2024-03-05T12:00:00Z","properties":{"amount":5}}
    - {"at":"2024-03-20T10:00:00Z","do":"preview_invoice"}
    - {"at":"2024-04-01T01:00:00Z","do":"perform_billing"}
  dimensions: {"grace_period":null}
  runners: ["rspec"]
  expect:
    invoices: 1
    invoice:
      status: finalized
      fees_amount_cents: 10000
      coupons_amount_cents: 2000
      sub_total_excluding_taxes_amount_cents: 8000
      taxes_amount_cents: 1600
      total_amount_cents: 9600
    preview:
      fees_amount_cents: 10000
      coupons_amount_cents: 2000
      sub_total_excluding_taxes_amount_cents: 8000
      taxes_amount_cents: 1600
      total_amount_cents: 9600
      fees_count: 3
      fees:
        - {fee_type: subscription, amount_cents: 2000}
        - {fee_type: charge, amount_cents: 3000}
        - {fee_type: commitment, amount_cents: 5000}
  math: >-
    The two surfaces AGREE, on the only fee in the suite that a preview has to invent rather than
    project.
    Both read three fees totalling 10_000¢, a 2_000¢ coupon, 1_600¢ of tax and 9_600¢ due. The
    preview's true-up comes from a different service and a different input:
    Invoices::PreviewService#add_commitment_fee (:259-289) builds an UNSAVED InvoiceSubscription and
    hands Fees::Commitments::Minimum::CalculatePreviewFeeService the running fee total it has summed
    in memory — 2_000 + 3_000 = 5_000 — rather than letting the service read fees back from the
    database as the real InArrears path does. Two routes to `[10_000 − 5_000, 0].max`, and this row is
    what says they meet.
    The mid-period timing is where a commitment preview could plausibly go wrong and does not. The
    quote is taken on 20 March with only 3_000¢ of usage recorded, so a preview that measured usage
    to Time.current instead of to the period end would still find 3_000¢ here — but a preview that
    treated the partial period as SHORT would prorate the floor: Commitments::CalculateAmountService
    applies a proration_coefficient, and a coefficient of 20/31 would give a 6_452¢ floor, a 1_452¢
    true-up, 6_452¢ of fees and 5_342¢ due. It quotes the full month because billing_time is
    1 April (:145), not 20 March.
    The coupon then lands identically on both surfaces, spread 400 / 600 / 1_000 across the three
    fees, and the per-fee amounts are asserted on the preview because fees_count 3 alone cannot say
    the true-up was 5_000¢ rather than the floor charged whole.

- id: b21/b15/regenerated
  block: B21
  group: b15
  key: b21_w1_b15r
  vars: {"n1":"b21 w1 b15r coupon"}
  axes: {subject_block: B15, surface: regenerated}
  premium: true
  timeline:
    - {"at":"2024-03-01T00:00:00Z","do":"create_subscription"}
    - at: "2024-03-05T10:00:00Z"
      do: "ingest_events"
      events:
        - {"code":"%{key}_sum","timestamp":"2024-03-05T10:00:00Z","properties":{"amount":50}}
        - {"code":"%{key}_sum","timestamp":"2024-03-05T11:00:00Z","properties":{"amount":30}}
        - {"code":"%{key}_sum","timestamp":"2024-03-05T12:00:00Z","properties":{"amount":20}}
    - {"at":"2024-04-01T01:00:00Z","do":"perform_billing"}
    - {"at":"2024-04-01T02:00:00Z","do":"refresh_invoice"}
  dimensions: {"coupon_type":"fixed_amount"}
  expect:
    invoices: 1
    invoice:
      status: draft
      fees_amount_cents: 10000
      coupons_amount_cents: 0
      sub_total_excluding_taxes_amount_cents: 10000
      taxes_amount_cents: 2000
      total_amount_cents: 12000
  math: >-
    b15/coupon/tax rebuilt instead of held. The issued invoice is 7_200¢ — 10_000¢ of fees less a
    4_000¢ coupon, taxed at 20% on the 6_000¢ that remains. The refreshed draft is 12_000¢, the same
    figure b21/b15/draft reports, and reporting it AGAIN after a rebuild is the point.
    "Changed something, refreshed, nothing moved" is the sentence this row exists to make safe to say.
    A refresh that had applied the coupon would read 7_200¢ and would have consumed a `once` coupon on
    an invoice nobody has issued — and Invoices::RefreshDraftService contains no recredit path, so a
    subsequent void or a further refresh would not give it back. The 12_000¢ is therefore not a
    limitation of the refresh; it is the refresh declining to spend something it cannot un-spend, and
    `context: :refresh` keeping not_in_finalizing_process? true (calculate_fees_service.rb:368) is the
    single line that decides it.
    The block's whole subject — that the coupon comes BEFORE the tax — is undecidable on this surface,
    and the row says which field would have decided it: taxes_amount_cents. 2_000¢ is 20% of the gross
    10_000¢; the issued invoice's 1_200¢ is 20% of the discounted 6_000¢; the reverse order would have
    given 2_000¢ of tax and an 8_000¢ total. Two of those three readings produce 2_000¢ of tax, so a
    refreshed draft cannot tell "coupon withheld" from "tax applied first" — which is exactly why the
    interaction needs the finalized surface and why this row asserts the sub_total alongside it.

