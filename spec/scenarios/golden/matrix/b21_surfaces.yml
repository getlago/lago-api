      coupons_amount_cents: 4000
      sub_total_excluding_taxes_amount_cents: 6000
      taxes_amount_cents: 1200
      total_amount_cents: 7200
    preview:
      fees_amount_cents: 10000
      coupons_amount_cents: 4000
      sub_total_excluding_taxes_amount_cents: 6000
      taxes_amount_cents: 1200
      total_amount_cents: 7200
  math: >-
    The two surfaces AGREE on the ORDER, which is the only thing B15 measures.
    b15/coupon/tax is the suite's canonical proof that the coupon precedes the tax on a finalized
    invoice: 10_000¢ of fees, a 4_000¢ fixed coupon, 20% on the 6_000¢ that remains = 1_200¢, total
    7_200¢. The preview taken on 20 March reaches the same four numbers, and it is a genuinely
    independent derivation — Invoices::PreviewService#compute_tax_and_totals calls
    Coupons::PreviewService at :299 and only then apply_taxes at :309, mirroring
    calculate_fees_service.rb:54 and :56 in a file that shares no code with it.
    The row is sized so the two orders cannot coincide. Taxing first would give 10_000 + 2_000 = 12_000
    and then the coupon → 8_000¢, so a preview with the stages transposed would quote 800¢ more than
    the invoice it forecasts. A percentage coupon would commute and prove only that both stages ran.
    fees_amount_cents is 10_000¢ under either order and is asserted only as a control; the sequence
    lives in sub_total_excluding_taxes 6_000 and taxes 1_200.
    Both are asserted on both surfaces deliberately. Assert the preview alone and a wrong preview
    matching a wrong invoice would look like parity; assert the invoice alone and this becomes a
    duplicate of the B15 row it borrows from. The pair is the cell.

- id: b21/b19/regenerated
  block: B21
  group: b19
