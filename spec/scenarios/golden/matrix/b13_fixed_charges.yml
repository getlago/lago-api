      - select: {index: 2}
        invoice_type: subscription
        status: finalized
        fees_amount_cents: 30000
        taxes_amount_cents: 0
        total_amount_cents: 30000
        fees_count: 2
        fees:
          - fee_type: subscription
            amount_cents: 0
            from_date: "2024-04-01T00:00:00Z"
            to_date: "2024-04-30T23:59:59Z"
          - fee_type: fixed_charge
            item_code: b13_r2_grad_adv_dec
            units: "20.0"
            amount_cents: 30000
            precise_unit_amount: 15.0
            from_date: "2024-05-01T00:00:00Z"
            to_date: "2024-05-31T23:59:59Z"
  math: >-
    The graduated mirror of the standard advance decrease, and the tiering makes the "no refund" rule
    cost visibly more: the units given back are the ones in the CHEAP tier, but nothing is credited at
    all.
    Invoice 0, activation: delta 40, coefficient 1 → GraduatedService tiers 40 →
    30 × 10.00 + 100.00 = 400.00 and 40 - 31 + 1 = 10 units × 5.00 + 50.00 = 100.00 → 500.00 →
    50_000¢ at 12.50 per unit, for 2024-04-01..2024-04-30.
    Invoice 1, the change: `delta_units` = 20 - 40 = -20, so `build_zero_amount_fee` runs before the
    charge model is ever consulted (build_pay_in_advance_fixed_charge_service.rb:29-35) — a 0¢,
    0-unit fee on April's boundaries, on an invoice that is finalized rather than closed
    (transition_to_final_status_service.rb:31-37). The charge model is irrelevant on a decrease, which
    is why this fee is byte-identical to the standard rows' middle invoice.
    Invoice 2, periodic: the last event before the readjusted MAY window carries 20 units →
    20 × 10.00 + 100.00 = 300.00 → 30_000¢ at 15.00 per unit, dated 2024-05-01..2024-05-31, and tier 2
    is never entered so its 50.00 flat disappears. So April was paid at 50_000¢ and May costs 30_000¢
    for a position reduced on the 16th of April: 20_000¢ of tier-2-and-flat pricing the customer keeps
    paying for a fortnight after giving the units up.
    Excluded: a credit for the released units at their marginal price would be
    -(10 × 5.00 + 50.00 + 10 × 10.00) = -20_000¢ on invoice 1; a full credit of the difference
    500.00 - 300.00 = -20_000¢ likewise; re-billing the reduced quantity for April 30_000¢; and
    suppressing the invoice would give `invoices: 2`.

- id: b13/graduated/advance/not-prorated/subscription-override
  block: B13
  group: ovr-grad
