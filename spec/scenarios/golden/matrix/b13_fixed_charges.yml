# B13 — Fixed charges
#
# A fixed charge prices an ADD-ON on a plan: recurring units billed independently of metered usage,
# with period boundaries computed separately from charge boundaries.
#
# Note the creation order the API forces: inlining fixed_charges in POST /plans returns 500, so the
# runner posts them to /plans/:code/fixed_charges after the plan exists.
---
- __matrix:
    defaults:
      provenance: coverage-gap
      runners: [rspec]
      dimensions: {interval: monthly, billing_time: calendar, plan_pay_in_advance: false}
      setup:
        add_ons: [{code: "%{key}", name: Seat, amount_cents: 20000}]
        plan: {code: "golden_%{key}", interval: monthly, amount_cents: 0, pay_in_advance: false}
        fixed_charges: ~
        customer: {external_id: "golden_%{key}_cust", currency: EUR}
        subscription: {external_id: "golden_%{key}_sub", billing_time: calendar}
    groups:
      nc-std:
        dimensions: &ncdim {period_days: 30, days_billed: 15, units: 40}
        setup:
          add_ons: &seat [{code: "%{key}_seat", name: Seat, amount_cents: 20000}]
          fixed_charges: [{add_on_code: "%{key}_seat", charge_model: standard, units: 40, pay_in_advance: "%{pia}", prorated: "%{pro}", properties: {amount: "100"}}]
        timeline: &nctl [{at: "2024-04-16T00:00:00Z", do: create_subscription}, {at: "2024-05-01T01:00:00Z", do: perform_billing}]
      nc-grad:
        dimensions: *ncdim
        setup:
          add_ons: *seat
          fixed_charges:
            - add_on_code: "%{key}_seat"
              charge_model: graduated
              units: 40
              pay_in_advance: "%{pia}"
              prorated: "%{pro}"
              properties:
                graduated_ranges: &grad
                  - {from_value: 0, to_value: 30, per_unit_amount: "10", flat_amount: "100"}
                  - {from_value: 31, to_value: null, per_unit_amount: "5", flat_amount: "50"}
        timeline: *nctl
      nc-vol:
        dimensions: *ncdim
        setup:
          add_ons: *seat
          fixed_charges:
            - add_on_code: "%{key}_seat"
              charge_model: volume
              units: 40
              pay_in_advance: false
              prorated: "%{pro}"
              properties:
                volume_ranges: &vol
                  - {from_value: 0, to_value: 30, per_unit_amount: "10", flat_amount: "100"}
                  - {from_value: 31, to_value: null, per_unit_amount: "6", flat_amount: "200"}
        timeline: *nctl
      chg-seat:
        dimensions: {units_before: "%{ub}", units_after: "%{ua}", apply_units_immediately: true}
        setup:
          add_ons: *seat
          fixed_charges: [{add_on_code: "%{key}_seat", charge_model: standard, units: "%{ub}", pay_in_advance: false, prorated: false, properties: {amount: "100"}}]
        timeline:
          - &mk {at: "2024-04-01T00:00:00Z", do: create_subscription}
          - at: "2024-04-16T00:00:00Z"
            do: update_plan_fixed_charge
            fixed_charge: {add_on_code: "%{key}_seat", charge_model: standard, units: "%{ua}", apply_units_immediately: true, properties: {amount: "100"}}
          - &mb {at: "2024-05-01T01:00:00Z", do: perform_billing}
      chg-std:
        dimensions: &chgdim {period_days: 30, units_before: "%{ub}", units_after: "%{ua}", apply_units_immediately: true}
        setup:
          fixed_charges: [{add_on_code: "%{key}", charge_model: standard, units: "%{ub}", pay_in_advance: "%{pia}", prorated: "%{pro}", properties: {amount: "100"}}]
        timeline:
          - *mk
          - at: "2024-04-16T00:00:00Z"
            do: update_plan_fixed_charge
            fixed_charge: {add_on_code: "%{key}", charge_model: standard, units: "%{ua}", apply_units_immediately: true, properties: {amount: "100"}}
          - *mb
      chg-grad:
        dimensions: *chgdim
        setup:
          fixed_charges: [{add_on_code: "%{key}", charge_model: graduated, units: "%{ub}", pay_in_advance: "%{pia}", prorated: "%{pro}", properties: {graduated_ranges: *grad}}]
        timeline:
          - *mk
          - at: "2024-04-16T00:00:00Z"
            do: update_plan_fixed_charge
            fixed_charge: {add_on_code: "%{key}", charge_model: graduated, units: "%{ua}", apply_units_immediately: true, properties: {graduated_ranges: *grad}}
          - *mb
      chg-vol:
        dimensions: *chgdim
        setup:
          fixed_charges: [{add_on_code: "%{key}", charge_model: volume, units: "%{ub}", pay_in_advance: false, prorated: "%{pro}", properties: {volume_ranges: *vol}}]
        timeline:
          - *mk
          - at: "2024-04-16T00:00:00Z"
            do: update_plan_fixed_charge
            fixed_charge: {add_on_code: "%{key}", charge_model: volume, units: "%{ua}", apply_units_immediately: true, properties: {volume_ranges: *vol}}
          - *mb
      ovr-std:
        dimensions: &ovrdim {period_days: 30, plan_units: "%{pu}", override_units: "%{ou}", later_plan_units: "%{lu}", apply_units_immediately: true}
        setup:
          fixed_charges: [{add_on_code: "%{key}", charge_model: standard, units: "%{pu}", pay_in_advance: "%{pia}", prorated: "%{pro}", properties: {amount: "100"}}]
        timeline:
          - *mk
          - &movr
            at: "2024-04-16T00:00:00Z"
            do: update_subscription_fixed_charge
            fixed_charge: {add_on_code: "%{key}", units: "%{ou}", apply_units_immediately: true}
          - at: "2024-04-20T00:00:00Z"
            do: update_plan_fixed_charge
            fixed_charge: {add_on_code: "%{key}", charge_model: standard, units: "%{lu}", apply_units_immediately: true, properties: {amount: "100"}}
          - *mb
      ovr-grad:
        dimensions: *ovrdim
        setup:
          fixed_charges: [{add_on_code: "%{key}", charge_model: graduated, units: "%{pu}", pay_in_advance: "%{pia}", prorated: "%{pro}", properties: {graduated_ranges: *grad}}]
        timeline:
          - *mk
          - *movr
          - at: "2024-04-20T00:00:00Z"
            do: update_plan_fixed_charge
            fixed_charge: {add_on_code: "%{key}", charge_model: graduated, units: "%{lu}", apply_units_immediately: true, properties: {graduated_ranges: *grad}}
          - *mb
      ovr-vol:
        dimensions: *ovrdim
        setup:
          fixed_charges: [{add_on_code: "%{key}", charge_model: volume, units: "%{pu}", pay_in_advance: false, prorated: "%{pro}", properties: {volume_ranges: *vol}}]
        timeline:
          - *mk
          - *movr
          - at: "2024-04-20T00:00:00Z"
            do: update_plan_fixed_charge
            fixed_charge: {add_on_code: "%{key}", charge_model: volume, units: "%{lu}", apply_units_immediately: true, properties: {volume_ranges: *vol}}
          - *mb

- id: b13/standard/arrears/not-prorated/no-change
  block: B13
  key: b13_standard
  axes: {charge_model: standard, pay_in_advance: "false", prorated: "false", units_change: none}
  expect:
    invoices: 1
    invoice:
      fees_amount_cents: 100000
      total_amount_cents: 100000
      fees:
        - {fee_type: subscription, amount_cents: 0}
        - {fee_type: fixed_charge, units: "5.0", amount_cents: 100000}
  math: >-
    5 units at 200.00 each = 1_000.00 → 100_000¢, billed for the whole period because the charge is
    neither prorated nor paid in advance and the units never changed. The fee carries fee_type
    `fixed_charge`, distinct from `charge` and `subscription`, which is what makes it visible as a
    third kind of line on the invoice.
    The add-on carries its own amount_cents (which must be positive — 0 is rejected with
    amount_cents/value_is_out_of_range), but the FIXED CHARGE prices it: properties.amount is what
    the fee uses, so the two numbers are independent and this row would still read 100_000¢ if the
    add-on were priced differently.
  dimensions: {plan_pay_in_advance: ~}
  runners: [rspec, live]
  setup:
    add_ons: [{code: b13_seat, name: Seat, amount_cents: 20000}]
    plan: {pay_in_advance: ~}
    fixed_charges: [{add_on_code: b13_seat, charge_model: standard, units: 5, properties: {amount: "200"}}]
  timeline: [{at: "2024-03-01T00:00:00Z", do: create_subscription}, {at: "2024-04-01T01:00:00Z", do: perform_billing}]

# ---------------------------------------------------------------------------------------------
# Shared conventions for the `units_change: none` rows below, so every number is comparable.
#
# Legality (FixedCharge#validate_pay_in_advance / #validate_prorated, fixed_charge.rb:79-96):
# volume rejects pay_in_advance outright, and graduated rejects prorated + pay_in_advance. That is
# what removes 12 of the 48 axis combinations and leaves 36.
#
#   * April 2024, monthly / calendar, plan pay_in_arrears with amount_cents 0 and no taxes — so the
#     `pay_in_advance` axis is the FIXED CHARGE's flag alone, and the fixed-charge fee is the whole
#     invoice while the subscription fee stays a 0¢ marker for the period boundary.
#   * the subscription starts on 2024-04-16, mid-period, so proration bites without any units
#     change: 30 - 16 + 1 = 15 days of a 30-day period. 15/30 is exactly 1/2, which matters —
#     BuildPayInAdvanceFixedChargeService's coefficient is a FLOAT
#     (build_pay_in_advance_fixed_charge_service.rb:120-122), so a ratio like 21/31 would make the
#     expectation depend on double rounding. 1/2 is exact in both the SQL numeric path and the float
#     path, so the two halves of the block are compared on equal terms.
#   * 40 units everywhere → 20 prorated units. FixedChargeEvent units never change: the single event
#     is the one EmitFixedChargeEventsService writes at activation, at
#     `started_at + 1.second` = 2024-04-16T00:00:01Z (activate_service.rb:174-179).
#   * billing at 2024-05-01T01:00Z.
#
# Why proration is visible at all with `units_change: none`: ProratedAggregationService weights each
# event by (next event or period end + 1 day) - (event timestamp clamped to period start), over
# `fixed_charges_duration` (prorated_aggregation_service.rb:130-160). With one event on the 16th of a
# 30-day period whose from_datetime is clamped to started_at, that ratio is 15/30. An event at the
# START of the period would give 30/30 = 1 and prorated would equal un-prorated — which is why none
# of these rows starts on the 1st.
#
# The period-boundary assertions are the point of the block. `fixed_charges_*` boundaries are
# computed separately from `charges_*` and from the subscription's own `from/to_datetime`
# (calculate_fees_service.rb:30-39), and Fees::FixedChargeService#readjust_boundaries
# (fixed_charge_service.rb:238-252) OVERWRITES them for a pay-in-advance fixed charge with
# Subscriptions::DatesService.fixed_charge_pay_in_advance_interval — evaluated with
# `current_usage: true` at the invoice's timestamp, i.e. the period that is only just STARTING. So on
# the periodic invoice the subscription fee carries April and the fixed-charge fee carries May, on
# one invoice. Every advance row asserts both, because a right amount under the wrong label is the
# defect shape here.
# ---------------------------------------------------------------------------------------------

- id: b13/standard/advance/prorated/no-change
  block: B13
  group: nc-std
  key: b13_adv_pro
  vars: {pia: true, pro: true}
  axes: {charge_model: standard, pay_in_advance: "true", prorated: "true", units_change: none}
  calendar_sensitive: true
  expect:
    invoices: 2
    invoice:
      - select: {index: 0}
        invoice_type: subscription
        status: finalized
        fees_amount_cents: 200000
        taxes_amount_cents: 0
        total_amount_cents: 200000
        fees_count: 1
        fees:
          - fee_type: fixed_charge
            item_code: b13_adv_pro_seat
            item_type: AddOn
            units: "40.0"
            amount_cents: 200000
            precise_unit_amount: 50.0
            from_date: "2024-04-16T00:00:00Z"
            to_date: "2024-04-30T23:59:59Z"
      - select: {index: 1}
        invoice_type: subscription
        status: finalized
        fees_amount_cents: 400000
        taxes_amount_cents: 0
        total_amount_cents: 400000
        fees_count: 2
        fees:
          - fee_type: subscription
            amount_cents: 0
            from_date: "2024-04-16T00:00:00Z"
            to_date: "2024-04-30T23:59:59Z"
          - fee_type: fixed_charge
            item_code: b13_adv_pro_seat
            units: "40.0"
            amount_cents: 400000
            precise_unit_amount: 100.0
            from_date: "2024-05-01T00:00:00Z"
            to_date: "2024-05-31T23:59:59Z"
  math: >-
    Two invoices, and they are produced by two DIFFERENT services — that is the first thing this row
    pins.
    Invoice 1 is raised at activation, because Subscriptions::ActivateService bills a plan that pays
    in arrears as soon as any fixed charge pays in advance
    (activate_service.rb:195-199 → Invoices::CreatePayInAdvanceFixedChargesJob at
    `started_at + 1.second`). Its fee comes from Fees::BuildPayInAdvanceFixedChargeService, not from
    Fees::FixedChargeService, and it prorates by a formula of its own
    (build_pay_in_advance_fixed_charge_service.rb:118-126):
    `days = (fixed_charges_to_datetime.to_date - timestamp.to_date + 1)` = 30 - 16 + 1 = 15, over
    `fixed_charges_duration` = 30 → coefficient 0.5. `delta_units` is the event's 40 units minus the
    0 already billed for this period (:64-84), so the charge model is applied to 40 × 0.5 = 20 units:
    StandardService#compute_amount = `units × amount` = 20 × 100.00 = 2_000.00 → 200_000¢.
    The `units` field is NOT the prorated number — :131-132 stores `units: delta_units` = 40 — while
    `precise_unit_amount` is `amount / delta_units` = 2_000/40 = 50.00, i.e. half the 100.00 in
    properties. Both are asserted, because the amount alone cannot tell 20 units at 100.00 from
    40 units at 50.00, and the fields disagree about which happened.
    Invoice 2 is the ordinary periodic invoice for the April period, and its fixed-charge fee covers
    MAY. Fees::FixedChargeService#readjust_boundaries (fixed_charge_service.rb:238-252) throws away
    the invoice_subscription's April `fixed_charges_*` boundaries and replaces them with
    `fixed_charge_pay_in_advance_interval(boundaries.timestamp, subscription)`, evaluated with
    `current_usage: true` (dates_service.rb:40-52), so at a timestamp of 2024-05-01T01:00Z it returns
    2024-05-01 → 2024-05-31, duration 31. ProratedAggregationService then finds no event inside May
    and falls back to the last event before it (base_service.rb:41-49), whose effective span runs from
    the period start to `to_datetime + 1.day` → ratio 31/31 = 1 → 40 units × 100.00 = 4_000.00 →
    400_000¢, at a `precise_unit_amount` of 100.00. So one invoice carries a subscription fee for
    2024-04-16..2024-04-30 and a fixed-charge fee for 2024-05-01..2024-05-31, which is exactly the
    separate-boundary computation this block exists to pin.
    Candidate behaviours that this row rules out. If the advance fee ignored proration it would be
    400_000¢ on invoice 1 instead of 200_000¢. If it prorated by days ELAPSED rather than remaining
    it would use 16/30 → 40 × 0.5333 × 100 = 213_333¢. If the periodic invoice's fixed-charge fee
    took the invoice's own April boundaries instead of readjusting, it would either be suppressed by
    `already_billed?` (fixed_charge_service.rb:53-72 matches on the stored from/to pair, and April is
    already billed) or land on 200_000¢ with April dates — so the 400_000¢ May fee is the assertion
    that the readjustment happened.

- id: b13/standard/advance/not-prorated/no-change
  block: B13
  group: nc-std
  key: b13_adv_flat
  vars: {pia: true, pro: false}
  axes: {charge_model: standard, pay_in_advance: "true", prorated: "false", units_change: none}
  calendar_sensitive: true
  expect:
    invoices: 2
    invoice:
      - select: {index: 0}
        invoice_type: subscription
        status: finalized
        fees_amount_cents: 400000
        taxes_amount_cents: 0
        total_amount_cents: 400000
        fees_count: 1
        fees:
          - fee_type: fixed_charge
            item_code: b13_adv_flat_seat
            item_type: AddOn
            units: "40.0"
            amount_cents: 400000
            precise_unit_amount: 100.0
            from_date: "2024-04-16T00:00:00Z"
            to_date: "2024-04-30T23:59:59Z"
      - select: {index: 1}
        invoice_type: subscription
        status: finalized
        fees_amount_cents: 400000
        taxes_amount_cents: 0
        total_amount_cents: 400000
        fees_count: 2
        fees:
          - fee_type: subscription
            amount_cents: 0
            from_date: "2024-04-16T00:00:00Z"
            to_date: "2024-04-30T23:59:59Z"
          - fee_type: fixed_charge
            item_code: b13_adv_flat_seat
            units: "40.0"
            amount_cents: 400000
            from_date: "2024-05-01T00:00:00Z"
            to_date: "2024-05-31T23:59:59Z"
  math: >-
    The control for b13/standard/advance/prorated/no-change: same 15-of-30 days, same 40 units, same
    100.00 per unit, `prorated` flipped off. Fees::BuildPayInAdvanceFixedChargeService sets
    `proration_coefficient = 1` when the charge is not prorated
    (build_pay_in_advance_fixed_charge_service.rb:118-123), so the charge model is applied to the raw
    delta of 40 units: 40 × 100.00 = 4_000.00 → 400_000¢ for a period that is only half over. The
    customer pays the full month on the 16th, and `precise_unit_amount` stays at the properties'
    100.00 rather than dropping to 50.00 as the prorated row's does.
    The two rows therefore differ by exactly 200_000¢ on invoice 1 while agreeing on invoice 2 —
    440_000¢ of April-and-May under proration against 800_000¢ without it — which is what makes the
    pair worth having: the difference is the `prorated` flag and nothing else.
    The May fee is unchanged from the prorated row, because SimpleAggregationService returns the last
    event's units flat (simple_aggregation_service.rb:6-9) and the prorated aggregator happens to
    return a ratio of 1 for a full period. Its boundaries are still the readjusted MAY window
    (fixed_charge_service.rb:238-252) rather than the April period the subscription fee beside it
    reports, so both dates are asserted here too: with the amounts identical, the boundary is the
    only thing distinguishing "billed May in advance" from "billed April twice".

- id: b13/standard/arrears/prorated/no-change
  block: B13
  group: nc-std
  key: b13_arr_pro
  vars: {pia: false, pro: true}
  axes: {charge_model: standard, pay_in_advance: "false", prorated: "true", units_change: none}
  calendar_sensitive: true
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      status: finalized
      fees_amount_cents: 200000
      taxes_amount_cents: 0
      total_amount_cents: 200000
      fees_count: 2
      fees:
        - fee_type: subscription
          amount_cents: 0
          from_date: "2024-04-16T00:00:00Z"
          to_date: "2024-04-30T23:59:59Z"
        - fee_type: fixed_charge
          item_code: b13_arr_pro_seat
          item_type: AddOn
          units: "40.0"
          amount_cents: 200000
          precise_unit_amount: 50.0
          from_date: "2024-04-16T00:00:00Z"
          to_date: "2024-04-30T23:59:59Z"
  math: >-
    In arrears there is no activation invoice — Subscriptions::ActivateService only bills at the start
    when the plan pays in advance or a fixed charge does (activate_service.rb:190-199) — so the whole
    period is measured after the fact on one invoice, and `readjust_boundaries` leaves the
    invoice_subscription's own `fixed_charges_*` window alone (fixed_charge_service.rb:243). The
    fixed-charge fee and the subscription fee therefore share 2024-04-16..2024-04-30, and both are
    asserted: this is the row that says the two boundary computations AGREE when the charge is in
    arrears, which is what makes the advance rows' disagreement a finding rather than noise.
    The amount goes through FixedChargeEvents::Aggregations::ProratedAggregationService, whose SQL
    weights each event by `(period_end - period_start) / fixed_charges_duration`
    (prorated_aggregation_service.rb:130-160). The single event sits at 2024-04-16T00:00:01Z;
    `period_start` is its own timestamp (already inside the window, which itself was clamped up to
    `started_at` by dates_service.rb:124-143) and `period_end` is `to_datetime + 1.day` → 2024-05-01.
    (2024-05-01 - 2024-04-16) / 30 = 15/30 = 0.5 exactly, in Postgres numeric, so
    `aggregation` = 40 × 0.5 = 20.000000 while `full_units_number` stays at the event's 40
    (:20-24). There is no ProratedStandardService — ChargeModels::Factory:38-39 returns the plain
    StandardService — and its `compute_amount` is `units × amount` where `units` is the PRORATED
    aggregation (base_service.rb:34): 20 × 100.00 = 2_000.00 → 200_000¢.
    The fee reports the other number: Fees::FixedChargeService:112 stores
    `units: amount_result.full_units_number` = 40, and StandardService#unit_amount divides by that
    same 40 → `precise_unit_amount` 50.00. So 40 units are shown and 20 unit-months are billed.
    Un-prorated would be 40 × 100.00 = 400_000¢ (the value the sibling
    b13/graduated/arrears/... rows show for their own flag flip); prorating by days elapsed instead of
    remaining would give 16/30 → 213_333¢; prorating the SUBSCRIPTION fee's way, off `from_datetime`
    rather than the event timestamp, would also give 15/30 here and is deliberately not
    distinguishable in this row — b13/graduated/arrears/prorated/no-change separates them, because
    there the event-level split into tiers has no subscription-level equivalent.

- id: b13/graduated/advance/not-prorated/no-change
  block: B13
  group: nc-grad
  key: b13_grad_adv
  vars: {pia: true, pro: false}
  axes: {charge_model: graduated, pay_in_advance: "true", prorated: "false", units_change: none}
  calendar_sensitive: true
  expect:
    invoices: 2
    invoice:
      - select: {index: 0}
        invoice_type: subscription
        status: finalized
        fees_amount_cents: 50000
        taxes_amount_cents: 0
        total_amount_cents: 50000
        fees_count: 1
        fees:
          - fee_type: fixed_charge
            item_code: b13_grad_adv_seat
            item_type: AddOn
            units: "40.0"
            amount_cents: 50000
            precise_unit_amount: 12.5
            from_date: "2024-04-16T00:00:00Z"
            to_date: "2024-04-30T23:59:59Z"
      - select: {index: 1}
        invoice_type: subscription
        status: finalized
        fees_amount_cents: 50000
        taxes_amount_cents: 0
        total_amount_cents: 50000
        fees_count: 2
        fees:
          - fee_type: subscription
            amount_cents: 0
            from_date: "2024-04-16T00:00:00Z"
            to_date: "2024-04-30T23:59:59Z"
          - fee_type: fixed_charge
            item_code: b13_grad_adv_seat
            units: "40.0"
            amount_cents: 50000
            precise_unit_amount: 12.5
            from_date: "2024-05-01T00:00:00Z"
            to_date: "2024-05-31T23:59:59Z"
  math: >-
    `graduated` + `pay_in_advance` + `prorated` is rejected outright
    (FixedCharge#validate_prorated, fixed_charge.rb:88-96), so this is the only advance cell graduated
    has, and it is un-prorated by construction.
    Both fees price 40 raw units through ChargeModels::GraduatedService. The ranges are NOT adjacent —
    31 is 30 + 1, so `adjacent_ranges?` is false (graduated_service.rb:22-28) and
    RangeGraduatedService bills `to_value - from_value + 1` in every range after the first
    (range_graduated_service.rb:53-63). Tier 1: units capped at its `to_value` 30 → 30 × 10.00 = 300.00
    plus 100.00 flat = 400.00. Tier 2: `to_value` is null so the effective total is 40 → 40 - 31 + 1 =
    10 units → 10 × 5.00 = 50.00 plus 50.00 flat = 100.00. Total 500.00 → 50_000¢, and
    `precise_unit_amount` = 500.00 / 40 = 12.50 (unit_amount divides by `full_units_number`,
    graduated_service.rb:76-81). The two flat amounts are what make the tiering visible: pricing all
    40 units at tier 1 would give 40 × 10.00 + 100.00 = 500.00 too, but with only ONE flat fee, so the
    150.00 of flats asserted here is what says the second range was entered.
    Invoice 1 comes from Fees::BuildPayInAdvanceFixedChargeService, which builds a synthetic
    aggregation result of `delta_units` and hands it to the same ChargeModels::Factory
    (build_pay_in_advance_fixed_charge_service.rb:146-165), so a full month is billed on the 16th:
    50_000¢ for 15 days of service. Invoice 2 bills MAY, again through the readjusted advance window
    (fixed_charge_service.rb:238-252), so the invoice carries an April subscription fee beside a May
    fixed-charge fee and both dates are asserted.
    What this rules out: proration was not silently applied anywhere — half of 500.00 would be
    25_000¢ on invoice 1, and the prorated-graduated split that
    b13/graduated/arrears/prorated/no-change measures would be 32_500¢. An implementation that
    dropped the two flat amounts would give 300.00 + 50.00 = 350.00 → 35_000¢, and one that used
    adjacent-range arithmetic (no `+ 1` on the second range) would give
    300.00 + 9 × 5.00 + 150.00 = 495.00 → 49_500¢.

- id: b13/graduated/arrears/prorated/no-change
  block: B13
  group: nc-grad
  key: b13_grad_pro
  vars: {pia: false, pro: true}
  axes: {charge_model: graduated, pay_in_advance: "false", prorated: "true", units_change: none}
  calendar_sensitive: true
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      status: finalized
      fees_amount_cents: 32500
      taxes_amount_cents: 0
      total_amount_cents: 32500
      fees_count: 2
      fees:
        - fee_type: subscription
          amount_cents: 0
          from_date: "2024-04-16T00:00:00Z"
          to_date: "2024-04-30T23:59:59Z"
        - fee_type: fixed_charge
          item_code: b13_grad_pro_seat
          item_type: AddOn
          units: "40.0"
          amount_cents: 32500
          precise_unit_amount: 8.125
          from_date: "2024-04-16T00:00:00Z"
          to_date: "2024-04-30T23:59:59Z"
  math: >-
    The one cell in the block where the charge model itself changes: `graduated` + `prorated` is the
    only combination for which ChargeModels::Factory swaps in a different class
    (ProratedGraduatedService, factory.rb:40-45). It is handed TWO parallel arrays by
    ProratedAggregationService#per_event_aggregation (prorated_aggregation_service.rb:27-37):
    `event_aggregation` = [40] (the full units) and `event_prorated_aggregation` = [20] (40 × 15/30,
    derived as in b13/standard/arrears/prorated/no-change).
    The tier is chosen by the FULL number and the price is paid on the PRORATED one
    (prorated_graduated_service.rb:31-92). With one event: `full_sum` becomes 40 and `prorated_sum`
    20; tier 1's `to_value` is 30, so `overflow` = 40 - 30 = 10 full units spill into tier 2, and the
    prorated sum is split by `prorated_coefficient` = 20 / 40 = 0.5 → 10 × 0.5 = 5 prorated units
    moved out of tier 1. Tier 1 bills 15 × 10.00 = 150.00; tier 2 bills 5 × 5.00 = 25.00; and
    `result_with_flat_amount` (:110-122) then adds every flat amount up to the highest range REACHED
    by the full units, in full and un-prorated: 100.00 + 50.00 = 150.00. Total 325.00 → 32_500¢, with
    `precise_unit_amount` = 325.00 / 40 = 8.125 (:104-107 divides by the full-units sum).
    Three candidate behaviours, all excluded by that number. Prorating FIRST and then tiering would
    put all 20 units in tier 1 → 20 × 10.00 + 100.00 = 300.00 → 30_000¢. Ignoring proration is the
    sibling row's 500.00 → 50_000¢. Prorating the flat amounts too would give 150.00 + 25.00 + 75.00 =
    250.00 → 25_000¢. That the flats are NOT prorated while the per-unit amounts are is the
    substantive finding in this row, and it is only visible because the ranges carry flat fees.
    Boundaries: in arrears nothing is readjusted, so the fixed-charge fee and the subscription fee
    both report 2024-04-16..2024-04-30, and both are asserted.

- id: b13/graduated/arrears/not-prorated/no-change
  block: B13
  group: nc-grad
  key: b13_grad_flat
  vars: {pia: false, pro: false}
  axes: {charge_model: graduated, pay_in_advance: "false", prorated: "false", units_change: none}
  calendar_sensitive: true
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      status: finalized
      fees_amount_cents: 50000
      taxes_amount_cents: 0
      total_amount_cents: 50000
      fees_count: 2
      fees:
        - fee_type: subscription
          amount_cents: 0
          from_date: "2024-04-16T00:00:00Z"
          to_date: "2024-04-30T23:59:59Z"
        - fee_type: fixed_charge
          item_code: b13_grad_flat_seat
          item_type: AddOn
          units: "40.0"
          amount_cents: 50000
          precise_unit_amount: 12.5
          from_date: "2024-04-16T00:00:00Z"
          to_date: "2024-04-30T23:59:59Z"
  math: >-
    The control for b13/graduated/arrears/prorated/no-change: identical ranges, identical 40 units,
    identical 15-of-30-day period, `prorated` off. SimpleAggregationService returns the last event's
    units unchanged (simple_aggregation_service.rb:6-9), so both `aggregation` and
    `full_units_number` are 40 and the ordinary ChargeModels::GraduatedService prices them:
    tier 1 caps at its `to_value` 30 → 30 × 10.00 + 100.00 flat = 400.00; tier 2 takes
    40 - 31 + 1 = 10 units (the ranges are not adjacent, range_graduated_service.rb:53-63) →
    10 × 5.00 + 50.00 flat = 100.00. Total 500.00 → 50_000¢, `precise_unit_amount` 500.00 / 40 = 12.50.
    The pair is therefore 50_000¢ against 32_500¢ for the same units over the same half-period, and
    the 17_500¢ gap decomposes as exactly the per-unit half of the bill (350.00 → 175.00) with the
    150.00 of flat amounts untouched on both sides. Reading either row alone cannot see that; the two
    together locate the proration precisely in the per-unit component.
    This row also pins that a mid-period start costs nothing when the charge is not prorated: 15 days
    of service are billed at a full month's 500.00, with a period boundary that openly says
    2024-04-16..2024-04-30.

- id: b13/volume/arrears/prorated/no-change
  block: B13
  group: nc-vol
  key: b13_vol_pro
  vars: {pro: true}
  axes: {charge_model: volume, pay_in_advance: "false", prorated: "true", units_change: none}
  calendar_sensitive: true
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      status: finalized
      fees_amount_cents: 32000
      taxes_amount_cents: 0
      total_amount_cents: 32000
      fees_count: 2
      fees:
        - fee_type: subscription
          amount_cents: 0
          from_date: "2024-04-16T00:00:00Z"
          to_date: "2024-04-30T23:59:59Z"
        - fee_type: fixed_charge
          item_code: b13_vol_pro_seat
          item_type: AddOn
          units: "40.0"
          amount_cents: 32000
          precise_unit_amount: 8.0
          from_date: "2024-04-16T00:00:00Z"
          to_date: "2024-04-30T23:59:59Z"
  math: >-
    `volume` cannot pay in advance at all (FixedCharge#validate_pay_in_advance, fixed_charge.rb:79-85
    rejects it), so volume has only the two arrears cells, and this is the prorated one.
    There is no ProratedVolumeService — ChargeModels::Factory:56-57 returns the ordinary
    VolumeService — but VolumeService is prorated-aware in one specific place: `number_of_units`,
    which selects the RANGE, is `full_units_number` when the charge is prorated and the aggregation
    otherwise (volume_service.rb:63-65). So the tier is chosen by 40 units → the second range
    (31..∞, 6.00/unit, 200.00 flat) — while `per_unit_total_amount` multiplies the PRORATED
    aggregation (:52-54): 20 × 6.00 = 120.00. `flat_unit_amount` is added whole (:44-46), so the fee
    is 120.00 + 200.00 = 320.00 → 32_000¢, and `unit_amount` divides by the full 40 → 8.00. The
    reported `units` is `full_units_number` = 40 (Fees::FixedChargeService:112).
    Four candidate behaviours, all distinct here, which is why these particular ranges were chosen.
    Actual: tier by 40, price 20, flat in full = 32_000¢. Prorate first and then tier: 20 units falls
    in the FIRST range → 20 × 10.00 + 100.00 = 300.00 → 30_000¢. Ignore proration entirely:
    40 × 6.00 + 200.00 = 440.00 → 44_000¢ (the sibling row). Prorate the flat amount too:
    120.00 + 100.00 = 220.00 → 22_000¢. The 32_000¢ asserted here is the only one of the four that
    both crosses into the dearer per-unit rate and pays the whole flat fee for half a month.
    Boundaries are the un-readjusted arrears window, shared with the subscription fee, and both are
    asserted.

- id: b13/volume/arrears/not-prorated/no-change
  block: B13
  group: nc-vol
  key: b13_vol_flat
  vars: {pro: false}
  axes: {charge_model: volume, pay_in_advance: "false", prorated: "false", units_change: none}
  calendar_sensitive: true
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      status: finalized
      fees_amount_cents: 44000
      taxes_amount_cents: 0
      total_amount_cents: 44000
      fees_count: 2
      fees:
        - fee_type: subscription
          amount_cents: 0
          from_date: "2024-04-16T00:00:00Z"
          to_date: "2024-04-30T23:59:59Z"
        - fee_type: fixed_charge
          item_code: b13_vol_flat_seat
          item_type: AddOn
          units: "40.0"
          amount_cents: 44000
          precise_unit_amount: 11.0
          from_date: "2024-04-16T00:00:00Z"
          to_date: "2024-04-30T23:59:59Z"
  math: >-
    The control for b13/volume/arrears/prorated/no-change. SimpleAggregationService gives
    `aggregation` = `full_units_number` = 40, so VolumeService's `number_of_units` is 40 either way
    (volume_service.rb:63-65) and the second range applies: every unit is priced at that range's rate
    rather than tier by tier, which is what separates `volume` from `graduated` —
    40 × 6.00 = 240.00, plus the 200.00 flat = 440.00 → 44_000¢, `unit_amount` = 440.00 / 40 = 11.00.
    Graduated arithmetic on the same shape of ranges would bill the first 30 units at the first
    range's rate, so the b13/graduated rows sit at 50_000¢ where volume sits at 44_000¢ despite both
    reaching the same tier with the same 40 units — that difference is the charge_model axis doing its
    job.
    Against the prorated sibling: 44_000¢ against 32_000¢, a gap of 12_000¢ that is exactly half the
    240.00 of per-unit charge and none of the 200.00 flat. And as in every not-prorated row here, 15
    days of service cost a full month, on a fee that reports 2024-04-16..2024-04-30 as its period.

# ---------------------------------------------------------------------------------------------
# `units_change` — the axis that needed two new timeline verbs.
#
# A fixed charge's units are a MUTABLE quantity, and the whole point of the axis is that changing
# them mid-period is not the same operation as declaring them at creation. Two endpoints do it and
# they are not interchangeable:
#
#   PUT /plans/:plan_code/fixed_charges/:code        FixedCharges::UpdateService
#   PUT /subscriptions/:external_id/fixed_charges/:code  Subscriptions::UpdateOrOverrideFixedChargeService
#
# Both write `units` and then hand `apply_units_immediately` to FixedCharges::EmitEventsService,
# which is where the axis actually lives: the new FixedChargeEvent is stamped at `Time.current` when
# the flag is true and at `fixed_charges_period_to_datetime + 1.second` when it is false
# (emit_events_service.rb:22). For a NOT-prorated charge the aggregation reads
# `events_in_range.last.try(:units)` ordered by created_at
# (simple_aggregation_service.rb:6, base_service.rb:37-47), so an event stamped into the next period
# is not in range at all and the period bills the OLD units. The two settings therefore give two
# different invoices from the same request body, which is why the flag is forwarded rather than
# assumed — and why canary/fixed-charge-apply-units-immediately watches it.
#
# Shared conventions for the three rows below, so their numbers are comparable:
#   * April 2024, monthly / calendar, plan pay_in_arrears with amount_cents 0 and no taxes, so the
#     fixed-charge fee is the whole invoice and the subscription fee is a 0¢ period marker.
#   * subscription starts 2024-04-01T00:00:00Z — the START of the period on purpose. These rows vary
#     units, not dates, and a mid-period start would put proration into a number that is meant to
#     isolate the units change. The activation event is written at started_at + 1.second =
#     2024-04-01T00:00:01Z (activate_service.rb:174-179).
#   * the fixed charge is standard / arrears / not-prorated at 100.00 per unit, so the invoice reads
#     directly as units × 100.00 and any disagreement is a units disagreement.
#   * the change lands 2024-04-16T00:00:00Z, billing at 2024-05-01T01:00:00Z.
# ---------------------------------------------------------------------------------------------

- id: b13/standard/arrears/not-prorated/increase-mid-period
  block: B13
  group: chg-seat
  key: b13_inc
  vars: {ub: 10, ua: 25}
  axes: {charge_model: standard, pay_in_advance: "false", prorated: "false", units_change: increase-mid-period}
  calendar_sensitive: true
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      status: finalized
      fees_amount_cents: 250000
      taxes_amount_cents: 0
      total_amount_cents: 250000
      fees_count: 2
      fees:
        - fee_type: subscription
          amount_cents: 0
          from_date: "2024-04-01T00:00:00Z"
          to_date: "2024-04-30T23:59:59Z"
        - fee_type: fixed_charge
          item_code: b13_inc_seat
          item_type: AddOn
          units: "25.0"
          amount_cents: 250000
          precise_unit_amount: 100.0
          from_date: "2024-04-01T00:00:00Z"
          to_date: "2024-04-30T23:59:59Z"
  math: >-
    A NOT-prorated fixed charge does not blend the two halves of the period: SimpleAggregationService
    returns `events_in_range.last.try(:units)` (simple_aggregation_service.rb:6), and `events_in_range`
    orders by created_at (base_service.rb:44-46). Two events are in April — the activation event
    (10 units, 2024-04-01T00:00:01Z) and the update event (25 units, 2024-04-16T00:00:00Z, stamped at
    Time.current because apply_units_immediately is true, emit_events_service.rb:22). The later one
    wins outright, so the WHOLE period bills at 25 units: 25 × 100.00 = 2_500.00 → 250_000¢, with
    precise_unit_amount 100.00 and units "25.0" (Fee#units is amount_result.full_units_number,
    fixed_charge_service.rb:100).
    Three other answers are all plausible and all wrong, which is what this row is for. A per-day
    blend would give 10 × 15/30 + 25 × 15/30 = 17.5 units → 175_000¢ (that is what the PRORATED
    sibling will read). Keeping the units the charge was created with would give 100_000¢ — and
    100_000¢ is also exactly what `apply_units_immediately: false` produces, because the event would
    then be stamped at fixed_charges_period_to_datetime + 1.second = 2024-05-01T00:00:00Z, outside
    April's range entirely. Charging both quantities in full would give 350_000¢.
    FixedCharges::UpdateService does not move `charge_model` here — `plan.attached_to_subscriptions?`
    is true by this point (update_service.rb:31) — so the charge_model axis is fixed at creation and
    only units move. `properties` is resent because the endpoint replaces them: omitted, they fall
    back to ChargeModels::BuildDefaultPropertiesService, i.e. amount "0" (update_service.rb:36-38),
    and the invoice would read 0¢.

- id: b13/standard/arrears/not-prorated/decrease-mid-period
  block: B13
  group: chg-seat
  key: b13_dec
  vars: {ub: 10, ua: 4}
  axes: {charge_model: standard, pay_in_advance: "false", prorated: "false", units_change: decrease-mid-period}
  calendar_sensitive: true
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      status: finalized
      fees_amount_cents: 40000
      taxes_amount_cents: 0
      total_amount_cents: 40000
      fees_count: 2
      fees:
        - fee_type: subscription
          amount_cents: 0
          from_date: "2024-04-01T00:00:00Z"
          to_date: "2024-04-30T23:59:59Z"
        - fee_type: fixed_charge
          item_code: b13_dec_seat
          item_type: AddOn
          units: "4.0"
          amount_cents: 40000
          precise_unit_amount: 100.0
          from_date: "2024-04-01T00:00:00Z"
          to_date: "2024-04-30T23:59:59Z"
  math: >-
    The mirror of the increase row, and it is the direction worth asserting: last-event-wins is not a
    high-water mark. The same two events are in range, the 2024-04-16 one carries 4 units, and it wins
    on created_at, so the customer is billed 4 × 100.00 = 400.00 → 40_000¢ for a period in which they
    held 10 units for the first fifteen days. Lago does not bill the maximum (100_000¢), does not
    blend to 10 × 15/30 + 4 × 15/30 = 7 units (70_000¢), and does not floor the decrease at the period
    boundary. Asserted deliberately as a pair with the increase: one row alone cannot distinguish
    "the last event wins" from "the largest event wins", and the two directions together can.

- id: b13/standard/arrears/not-prorated/subscription-override
  block: B13
  key: b13_ovr
  axes: {charge_model: standard, pay_in_advance: "false", prorated: "false", units_change: subscription-override}
  premium: true
  calendar_sensitive: true
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      status: finalized
      fees_amount_cents: 250000
      taxes_amount_cents: 0
      total_amount_cents: 250000
      fees_count: 2
      fees:
        - fee_type: subscription
          amount_cents: 0
          from_date: "2024-04-01T00:00:00Z"
          to_date: "2024-04-30T23:59:59Z"
        - fee_type: fixed_charge
          item_code: b13_ovr_seat
          item_type: AddOn
          units: "25.0"
          amount_cents: 250000
          precise_unit_amount: 100.0
          from_date: "2024-04-01T00:00:00Z"
          to_date: "2024-04-30T23:59:59Z"
  math: >-
    A subscription-level units change is NOT a plan-level one, and the plan-level update on the 20th
    is in this row to prove it rather than as scenery.
    The override request carries only `units` and `apply_units_immediately`, so
    Subscriptions::UpdateOrOverrideFixedChargeService takes the cheap path — `units_only_change?` is
    true (fixed_charge_units_override_detection_concern.rb:26-31) — and writes a
    Subscription::FixedChargeUnitsOverride row of 25 units instead of cloning the plan
    (update_or_override_fixed_charge_service.rb:47-58). It then emits ONE FixedChargeEvent for this
    subscription alone, at 25 units because `units_for` reads
    `fixed_charge.effective_units_for(subscription)` (emit_events_service.rb:62-66,
    fixed_charge.rb:54-58), stamped 2024-04-16T00:00:00Z.
    Four days later the plan-level fixed charge is moved to 40 units. That request succeeds and the
    plan really does now say 40 — but FixedCharges::EmitEventsService's bulk path scopes to
    `.without_fixed_charge_units_override_for(fixed_charge)` (emit_events_service.rb:52), so this
    subscription receives NO event from it. Its last event in April is still the 25-unit override, and
    the invoice is 25 × 100.00 = 2_500.00 → 250_000¢.
    That is the discriminating number. If the override were merely a plan-level write under another
    URL, the 40-unit event would be the last in range and the invoice would read 400_000¢; if the
    override row existed but the plan update still emitted over it, likewise 400_000¢. 250_000¢ is
    reachable only if the per-subscription override both took effect and then survived a later
    plan-level change. `premium: true` because the endpoint is licence-gated outright —
    `return result.forbidden_failure! unless License.premium?`
    (update_or_override_fixed_charge_service.rb:22).
  dimensions: {plan_units: 10, override_units: 25, later_plan_units: 40, apply_units_immediately: true}
  setup:
    add_ons: [{code: "%{key}_seat", name: Seat, amount_cents: 20000}]
    fixed_charges: [{add_on_code: "%{key}_seat", charge_model: standard, units: 10, pay_in_advance: false, prorated: false, properties: {amount: "100"}}]
  timeline:
    - {at: "2024-04-01T00:00:00Z", do: create_subscription}
    - at: "2024-04-16T00:00:00Z"
      do: update_subscription_fixed_charge
      fixed_charge: {add_on_code: "%{key}_seat", units: 25, apply_units_immediately: true}
    - at: "2024-04-20T00:00:00Z"
      do: update_plan_fixed_charge
      fixed_charge: {add_on_code: "%{key}_seat", charge_model: standard, units: 40, apply_units_immediately: true, properties: {amount: "100"}}
    - {at: "2024-05-01T01:00:00Z", do: perform_billing}

# ---------------------------------------------------------------------------------------------
# `units_change` × the rest of the grid — the remaining 24 cells.
#
# Shared conventions for EVERY row below, so their numbers are comparable with each other and with
# the three `standard/arrears/not-prorated` units_change rows above:
#
#   * April 2024, monthly / calendar, plan pay_in_arrears with amount_cents 0 and no taxes, so the
#     `pay_in_advance` axis is the FIXED CHARGE's own flag and the fixed-charge fee is the whole
#     invoice while the subscription fee stays a 0¢ period marker.
#   * subscription starts 2024-04-01T00:00:00Z — the START of the period, deliberately. With no
#     units change a period-start subscription makes proration invisible (ratio 30/30 = 1), which is
#     exactly what these rows want: the ONLY thing proration can bite on here is the units change
#     itself, so `prorated` measures the change rather than the join date. The activation event is
#     written at started_at + 1.second = 2024-04-01T00:00:01Z
#     (activate_service.rb:174-179 → EmitFixedChargeEventsService).
#   * the units change lands 2024-04-16T00:00:00Z, i.e. 15 days into a 30-day period. 15/30 is
#     exactly 1/2 in both the Postgres-numeric arrears path (prorated_aggregation_service.rb:119-133)
#     and the Ruby-Float advance path (build_pay_in_advance_fixed_charge_service.rb:108-113), so the
#     two halves of the block are measured, not compared against float noise.
#   * `subscription-override` rows do it in two steps on purpose: PUT the SUBSCRIPTION's units on
#     2024-04-16, then PUT the PLAN's units on 2024-04-20. The second request succeeds and the plan
#     really does change; the assertion is that this subscription never sees it, because
#     FixedCharges::EmitEventsService's bulk scope is
#     `.without_fixed_charge_units_override_for(fixed_charge)` (emit_events_service.rb:52) and
#     Invoices::CreateAllPayInAdvanceFixedChargesJob filters the same way. Every such row names the
#     number the plan-level value WOULD have produced.
#   * billing at 2024-05-01T01:00:00Z.
#
# `apply_units_immediately: true` on every change, always sent explicitly. With it false the new
# FixedChargeEvent is stamped at `fixed_charges_period_to_datetime + 1.second` = 2024-05-01T00:00:00Z
# (emit_events_service.rb:22), outside April's aggregation range entirely, and every row below would
# read its pre-change units instead. The flag IS the mid-period half of the axis.
#
# Two structural facts these rows keep re-asserting, because they are the block's bug shape:
#
#   1. ARREARS blends, ADVANCE deltas. In arrears the whole period is aggregated after the fact from
#      the FixedChargeEvent stream, so one invoice carries one blended figure. In advance each
#      change raises its OWN invoice immediately (update_service.rb:51-53 for the plan endpoint,
#      write_service.rb:34-38 for the subscription one) priced on `new_units - already_paid_units`
#      (build_pay_in_advance_fixed_charge_service.rb:23-38), and the periodic invoice then bills the
#      NEXT period. So an advance row asserts three invoices and an arrears row asserts one.
#   2. On an advance invoice the fixed-charge fee's period is the READJUSTED window
#      (fixed_charge_service.rb:236-250), which on the periodic invoice is MAY while the subscription
#      fee beside it is APRIL. Both dates are asserted on every advance row: with the amounts often
#      equal, the boundary is the only thing separating "billed May in advance" from "billed April
#      twice".
# ---------------------------------------------------------------------------------------------

- id: b13/standard/arrears/prorated/increase-mid-period
  block: B13
  group: chg-std
  key: b13_r2_std_arr_pro_inc
  vars: {pia: false, pro: true, ub: 10, ua: 25}
  axes: {charge_model: standard, pay_in_advance: "false", prorated: "true", units_change: increase-mid-period}
  calendar_sensitive: true
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      status: finalized
      fees_amount_cents: 175000
      taxes_amount_cents: 0
      total_amount_cents: 175000
      fees_count: 2
      fees:
        - fee_type: subscription
          amount_cents: 0
          from_date: "2024-04-01T00:00:00Z"
          to_date: "2024-04-30T23:59:59Z"
        - fee_type: fixed_charge
          item_code: b13_r2_std_arr_pro_inc
          item_type: AddOn
          units: "25.0"
          amount_cents: 175000
          precise_unit_amount: 70.0
          from_date: "2024-04-01T00:00:00Z"
          to_date: "2024-04-30T23:59:59Z"
  math: >-
    This is the row the not-prorated increase above names as its counterfactual, and it is the one
    cell where a fixed charge actually BLENDS two quantities inside one period.
    ProratedAggregationService weights each event by the days it was in force
    (prorated_aggregation_service.rb:119-154). Two events are in April: 10 units at
    2024-04-01T00:00:01Z and 25 units at 2024-04-16T00:00:00Z (stamped at Time.current because
    apply_units_immediately is true). For the first, `period_start` is its own timestamp's DATE
    (2024-04-01) and `period_end` is the LEAD timestamp's DATE (2024-04-16) → 15/30. For the second,
    LEAD falls back to `to_datetime + 1.day` → DATE 2024-05-01 → (2024-05-01 - 2024-04-16)/30 = 15/30.
    So `aggregation` = 10 × 0.5 + 25 × 0.5 = 17.500000 in Postgres numeric, while
    `full_units_number` is the LAST event's units, 25 (:22).
    There is no ProratedStandardService (ChargeModels::Factory:38-39), so the plain StandardService
    prices the prorated aggregation: 17.5 × 100.00 = 1_750.00 → 175_000¢. The fee reports the other
    number — `units` is `full_units_number` = 25 (fixed_charge_service.rb:100) and
    `precise_unit_amount` is `compute_amount / full_units_number` = 1_750/25 = 70.00, which is
    NOT the 100.00 in properties. Both are asserted, because 175_000¢ alone cannot tell 17.5 units at
    100.00 from 25 units at 70.00 and the two fields disagree about which happened.
    Three candidate behaviours, each with its own number. Last-event-wins without proration is the
    sibling row's 25 × 100.00 = 250_000¢. Keeping the created units is 10 × 100.00 = 100_000¢ — which
    is also what `apply_units_immediately: false` would produce, since the event would then be stamped
    2024-05-01T00:00:00Z and fall outside April's range. Prorating only the INCREMENT and billing the
    base for the whole month would be 10 + 15 × 0.5 = 17.5 units too and is deliberately not
    separable here; b13/graduated/arrears/prorated/increase-mid-period separates them, because there
    the tier is chosen by the full units and the increment story would choose a different one.
    Boundaries: in arrears `readjust_boundaries` returns the invoice_subscription's own window
    untouched (fixed_charge_service.rb:242), so the fixed-charge fee and the subscription fee both
    report 2024-04-01..2024-04-30 and both are asserted — the arrears control for the advance rows'
    disagreement.

- id: b13/standard/arrears/prorated/decrease-mid-period
  block: B13
  group: chg-std
  key: b13_r2_std_arr_pro_dec
  vars: {pia: false, pro: true, ub: 10, ua: 4}
  axes: {charge_model: standard, pay_in_advance: "false", prorated: "true", units_change: decrease-mid-period}
  calendar_sensitive: true
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      status: finalized
      fees_amount_cents: 70000
      taxes_amount_cents: 0
      total_amount_cents: 70000
      fees_count: 2
      fees:
        - fee_type: subscription
          amount_cents: 0
          from_date: "2024-04-01T00:00:00Z"
          to_date: "2024-04-30T23:59:59Z"
        - fee_type: fixed_charge
          item_code: b13_r2_std_arr_pro_dec
          item_type: AddOn
          units: "4.0"
          amount_cents: 70000
          precise_unit_amount: 175.0
          from_date: "2024-04-01T00:00:00Z"
          to_date: "2024-04-30T23:59:59Z"
  math: >-
    The mirror of the prorated increase, and the reason the pair exists: proration is symmetric where
    last-event-wins is not. Same two events, same 15/30 weights, units going DOWN:
    `aggregation` = 10 × 0.5 + 4 × 0.5 = 7.000000, `full_units_number` = 4. StandardService prices
    the aggregation: 7 × 100.00 = 700.00 → 70_000¢.
    The reported fields invert in a way worth pinning: `units` is 4 and `precise_unit_amount` is
    700/4 = 175.00, which is 1.75× the 100.00 in properties, because the fee divides a ten-unit
    fortnight by a four-unit headline. This is the same
    units-and-unit-amount disagreement the advance rows show at half rate, in the opposite direction,
    and it is asserted rather than left implicit.
    Candidates: last-event-wins un-prorated is the b13/standard/arrears/not-prorated sibling's
    4 × 100.00 = 40_000¢. A high-water mark — weighting both halves at the OPENING 10 units — would be
    10 × 100.00 = 100_000¢; that Lago does not floor a decrease at the period's opening value is the
    substantive claim here. Applying the decrease retroactively from the start of the period would be
    4 × 100.00 = 40_000¢ again.
    Boundaries are the un-readjusted arrears window shared with the subscription fee, and both are
    asserted.

- id: b13/standard/arrears/prorated/subscription-override
  block: B13
  group: ovr-std
  key: b13_r2_std_arr_pro_ovr
  vars: {pia: false, pro: true, pu: 10, ou: 25, lu: 40}
  axes: {charge_model: standard, pay_in_advance: "false", prorated: "true", units_change: subscription-override}
  premium: true
  calendar_sensitive: true
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      status: finalized
      fees_amount_cents: 175000
      taxes_amount_cents: 0
      total_amount_cents: 175000
      fees_count: 2
      fees:
        - fee_type: subscription
          amount_cents: 0
          from_date: "2024-04-01T00:00:00Z"
          to_date: "2024-04-30T23:59:59Z"
        - fee_type: fixed_charge
          item_code: b13_r2_std_arr_pro_ovr
          item_type: AddOn
          units: "25.0"
          amount_cents: 175000
          precise_unit_amount: 70.0
          from_date: "2024-04-01T00:00:00Z"
          to_date: "2024-04-30T23:59:59Z"
  math: >-
    The prorated counterpart of b13/standard/arrears/not-prorated/subscription-override, and the
    proration is what makes the assertion sharp: a blended figure records not just WHICH units won
    but WHEN they started, so an event the row claims was never emitted cannot hide inside a
    last-event-wins answer.
    The 2024-04-16 request carries only `units` and `apply_units_immediately`, so
    Subscriptions::UpdateOrOverrideFixedChargeService takes the units-only path
    (fixed_charge_units_override_detection_concern.rb:26-31), writes a
    Subscription::FixedChargeUnitsOverride of 25 and emits ONE event for this subscription at
    2024-04-16T00:00:00Z (write_service.rb:19-32, units from
    `fixed_charge.effective_units_for(subscription)`). The 2024-04-20 plan-level move to 40 units
    really does change the plan, but EmitEventsService's bulk path scopes to
    `.without_fixed_charge_units_override_for(fixed_charge)` (emit_events_service.rb:52) and this
    subscription is excluded, so it receives NO third event.
    April therefore holds exactly two events, 10 at 2024-04-01T00:00:01Z and 25 at 2024-04-16, and the
    prorated aggregation is 10 × 15/30 + 25 × 15/30 = 17.500000 with `full_units_number` 25 →
    17.5 × 100.00 = 1_750.00 → 175_000¢ at a `precise_unit_amount` of 1_750/25 = 70.00, identical to
    b13/standard/arrears/prorated/increase-mid-period. That the two agree is the point: the override
    behaves exactly like a plan-level increase FOR THIS SUBSCRIPTION and then stops tracking the plan.
    Had the plan-level update reached it, the blend would be three-termed and visibly different:
    10 × 15/30 + 25 × 4/30 + 40 × 11/30 = 5 + 3.333333 + 14.666667 = 23.000000 → 2_300.00 →
    230_000¢ at `full_units_number` 40. Had the override never taken effect at all, the plan's own
    stream would give 10 × 19/30 + 40 × 11/30 = 6.333333 + 14.666667 = 21.000000 → 210_000¢. Neither
    is 175_000¢, so this number is reachable only if the override both applied and then survived.
    `premium: true` because the endpoint is licence-gated outright
    (update_or_override_fixed_charge_service.rb:21).

- id: b13/standard/advance/prorated/increase-mid-period
  block: B13
  group: chg-std
  key: b13_r2_std_adv_pro_inc
  vars: {pia: true, pro: true, ub: 10, ua: 25}
  axes: {charge_model: standard, pay_in_advance: "true", prorated: "true", units_change: increase-mid-period}
  calendar_sensitive: true
  expect:
    invoices: 3
    invoice:
      - select: {index: 0}
        invoice_type: subscription
        status: finalized
        fees_amount_cents: 100000
        taxes_amount_cents: 0
        total_amount_cents: 100000
        fees_count: 1
        fees:
          - fee_type: fixed_charge
            item_code: b13_r2_std_adv_pro_inc
            item_type: AddOn
            units: "10.0"
            amount_cents: 100000
            precise_unit_amount: 100.0
            from_date: "2024-04-01T00:00:00Z"
            to_date: "2024-04-30T23:59:59Z"
      - select: {index: 1}
        invoice_type: subscription
        status: finalized
        fees_amount_cents: 75000
        taxes_amount_cents: 0
        total_amount_cents: 75000
        fees_count: 1
        fees:
          - fee_type: fixed_charge
            item_code: b13_r2_std_adv_pro_inc
            units: "15.0"
            amount_cents: 75000
            precise_unit_amount: 50.0
            from_date: "2024-04-01T00:00:00Z"
            to_date: "2024-04-30T23:59:59Z"
      - select: {index: 2}
        invoice_type: subscription
        status: finalized
        fees_amount_cents: 250000
        taxes_amount_cents: 0
        total_amount_cents: 250000
        fees_count: 2
        fees:
          - fee_type: subscription
            amount_cents: 0
            from_date: "2024-04-01T00:00:00Z"
            to_date: "2024-04-30T23:59:59Z"
          - fee_type: fixed_charge
            item_code: b13_r2_std_adv_pro_inc
            units: "25.0"
            amount_cents: 250000
            precise_unit_amount: 100.0
            from_date: "2024-05-01T00:00:00Z"
            to_date: "2024-05-31T23:59:59Z"
  math: >-
    THREE invoices, from three different code paths, and the row exists to say that a mid-period
    increase on a pay-in-advance fixed charge is billed as an incremental DELTA rather than
    re-billed in full.
    Invoice 0 is the activation invoice: the plan pays in arrears but a fixed charge pays in advance,
    so Subscriptions::ActivateService enqueues Invoices::CreatePayInAdvanceFixedChargesJob at
    `started_at + 1.second` (activate_service.rb:195-199). Its boundaries come from
    `fixed_charge_pay_in_advance_interval(2024-04-01T00:00:01)` = 2024-04-01..2024-04-30, duration 30,
    and because the subscription starts ON the period boundary the proration coefficient is
    `days / duration` = (2024-04-30 - 2024-04-01 + 1) / 30 = 30/30 = 1.0
    (build_pay_in_advance_fixed_charge_service.rb:108-113). `already_paid_units` is 0, so delta = 10
    and the fee is 10 × 100.00 = 1_000.00 → 100_000¢ at a `precise_unit_amount` of 100.00. Starting at
    the period start is what makes the prorated and not-prorated siblings AGREE on this invoice, which
    isolates the `prorated` axis onto the change itself.
    Invoice 1 is raised by the change. FixedCharges::UpdateService emits the new 25-unit event at
    Time.current and then enqueues Invoices::CreateAllPayInAdvanceFixedChargesJob because
    `apply_units_immediately && fixed_charge.pay_in_advance?` (update_service.rb:44-53).
    Fees::BuildPayInAdvanceFixedChargeService recomputes the SAME April window,
    finds the activation fee by exact string match on the stored
    `properties->>'fixed_charges_from_datetime'/'…to_datetime'` and sums its units (:63-86) →
    `already_paid_units` = 10, so `delta_units` = 25 - 10 = 15. The coefficient is now
    (2024-04-30 - 2024-04-16 + 1) / 30 = 15/30 = 0.5, and the charge model is applied to
    15 × 0.5 = 7.5 units: 7.5 × 100.00 = 750.00 → 75_000¢. As with every advance fee, `units` stores
    the UN-prorated delta (:135) while `precise_unit_amount` is `amount / delta_units` = 750/15 =
    50.00 — both asserted, since 75_000¢ alone cannot tell 7.5 units at 100.00 from 15 at 50.00. Its
    period is APRIL: the delta tops up the period already paid for, it does not open a new one.
    Invoice 2 is the ordinary periodic invoice for April, whose fixed-charge fee covers MAY because
    `readjust_boundaries` replaces the April window with
    `fixed_charge_pay_in_advance_interval(2024-05-01T01:00Z)` = 2024-05-01..2024-05-31, duration 31
    (fixed_charge_service.rb:236-250). ProratedAggregationService finds no event inside May and falls
    back to the last event before it (base_service.rb:39-47), the 25-unit one, whose effective span is
    clamped to the period start and runs to `to_datetime + 1.day` → 31/31 = 1 → 25 × 100.00 =
    2_500.00 → 250_000¢ at 100.00 per unit. April's `already_billed?` guard does not fire because it
    is evaluated against the readjusted MAY dates (:57-74).
    What this rules out, with numbers. Re-billing the full new quantity for April instead of the delta
    would make invoice 1 read 25 × 0.5 × 100.00 = 125_000¢. Ignoring proration on the delta is the
    sibling b13/standard/advance/not-prorated/increase-mid-period's 150_000¢. Prorating by days
    ELAPSED rather than remaining would be 16/30 → 15 × 0.5333 × 100.00 = 80_000¢. And with
    `apply_units_immediately: false` there would be only TWO invoices, the event landing at
    2024-05-01T00:00:00Z instead — so `invoices: 3` is itself an assertion.

- id: b13/standard/advance/prorated/decrease-mid-period
  block: B13
  group: chg-std
  key: b13_r2_std_adv_pro_dec
  vars: {pia: true, pro: true, ub: 10, ua: 4}
  axes: {charge_model: standard, pay_in_advance: "true", prorated: "true", units_change: decrease-mid-period}
  calendar_sensitive: true
  expect:
    invoices: 3
    invoice:
      - select: {index: 0}
        invoice_type: subscription
        status: finalized
        fees_amount_cents: 100000
        total_amount_cents: 100000
        fees_count: 1
        fees:
          - fee_type: fixed_charge
            item_code: b13_r2_std_adv_pro_dec
            item_type: AddOn
            units: "10.0"
            amount_cents: 100000
            precise_unit_amount: 100.0
            from_date: "2024-04-01T00:00:00Z"
            to_date: "2024-04-30T23:59:59Z"
      - select: {index: 1}
        invoice_type: subscription
        status: finalized
        fees_amount_cents: 0
        taxes_amount_cents: 0
        total_amount_cents: 0
        fees_count: 1
        fees:
          - fee_type: fixed_charge
            item_code: b13_r2_std_adv_pro_dec
            units: "0.0"
            amount_cents: 0
            precise_unit_amount: 0.0
            from_date: "2024-04-01T00:00:00Z"
            to_date: "2024-04-30T23:59:59Z"
      - select: {index: 2}
        invoice_type: subscription
        status: finalized
        fees_amount_cents: 40000
        taxes_amount_cents: 0
        total_amount_cents: 40000
        fees_count: 2
        fees:
          - fee_type: subscription
            amount_cents: 0
            from_date: "2024-04-01T00:00:00Z"
            to_date: "2024-04-30T23:59:59Z"
          - fee_type: fixed_charge
            item_code: b13_r2_std_adv_pro_dec
            units: "4.0"
            amount_cents: 40000
            precise_unit_amount: 100.0
            from_date: "2024-05-01T00:00:00Z"
            to_date: "2024-05-31T23:59:59Z"
  math: >-
    A pay-in-advance decrease is NOT refunded, and it still raises an invoice. That is the whole row,
    and the deliberately odd middle invoice is the assertion.
    Invoice 0 is the activation invoice, 10 units at a coefficient of 30/30 = 1 → 100_000¢ for April,
    as in the increase sibling.
    Invoice 1 is raised by the change, because the trigger in FixedCharges::UpdateService is
    `apply_units_immediately && pay_in_advance?` with no sign test (update_service.rb:51-53). Inside,
    `delta_units` = 4 - 10 = -6, so `build_zero_amount_fee` runs instead of `build_delta_fee`
    (build_pay_in_advance_fixed_charge_service.rb:29-35): a fee of 0¢ and 0 units carrying the April
    boundaries, whose stated purpose in the source is "we still generate an invoice to document the
    change". Invoices::CreatePayInAdvanceFixedChargesService saves it unconditionally
    (create_pay_in_advance_fixed_charges_service.rb:30-33) and the zero-total invoice is FINALIZED
    rather than closed, because `finalize_zero_amount_invoice` defaults to true on the billing entity
    while the customer inherits it (transition_to_final_status_service.rb:31-37). All three of those —
    invoice exists, fee exists, status finalized — are asserted, because each is a place where a
    plausible implementation would produce nothing at all and the row would read `invoices: 2`.
    Invoice 2 is the periodic April invoice whose fixed-charge fee covers MAY (readjusted window,
    fixed_charge_service.rb:236-250). The last event before May is the 4-unit one, at a prorated ratio
    of 31/31 = 1 → 4 × 100.00 = 400.00 → 40_000¢. So the customer paid for 10 units all April, gave 6
    back on the 16th, got nothing for them, and starts paying for 4 in May.
    Note what is NOT distinguishable here and why that is itself worth recording: this row's numbers
    are IDENTICAL to b13/standard/advance/not-prorated/decrease-mid-period. A decrease never reaches
    `build_delta_fee`, so the proration coefficient is never computed, and May is a full period either
    way — proration is structurally invisible on an advance decrease. The pair is kept because the
    axis cell is legal and the equality is the finding; b13/standard/advance/*/increase-mid-period is
    where the flag separates them (75_000¢ against 150_000¢).
    Candidates excluded: a pro-rata credit for the 6 released units would be -6 × 0.5 × 100.00 =
    -30_000¢, a full credit -60_000¢, and re-billing the reduced quantity for April would be
    4 × 0.5 × 100.00 = 20_000¢. All three would show on invoice 1 instead of 0¢.

- id: b13/standard/advance/prorated/subscription-override
  block: B13
  group: ovr-std
  key: b13_r2_std_adv_pro_ovr
  vars: {pia: true, pro: true, pu: 10, ou: 25, lu: 40}
  axes: {charge_model: standard, pay_in_advance: "true", prorated: "true", units_change: subscription-override}
  premium: true
  calendar_sensitive: true
  expect:
    invoices: 3
    invoice:
      - select: {index: 0}
        invoice_type: subscription
        fees_amount_cents: 100000
        total_amount_cents: 100000
        fees_count: 1
        fees:
          - fee_type: fixed_charge
            item_code: b13_r2_std_adv_pro_ovr
            item_type: AddOn
            units: "10.0"
            amount_cents: 100000
            precise_unit_amount: 100.0
            from_date: "2024-04-01T00:00:00Z"
            to_date: "2024-04-30T23:59:59Z"
      - select: {index: 1}
        invoice_type: subscription
        fees_amount_cents: 75000
        total_amount_cents: 75000
        fees_count: 1
        fees:
          - fee_type: fixed_charge
            item_code: b13_r2_std_adv_pro_ovr
            units: "15.0"
            amount_cents: 75000
            precise_unit_amount: 50.0
            from_date: "2024-04-01T00:00:00Z"
            to_date: "2024-04-30T23:59:59Z"
      - select: {index: 2}
        invoice_type: subscription
        status: finalized
        fees_amount_cents: 250000
        taxes_amount_cents: 0
        total_amount_cents: 250000
        fees_count: 2
        fees:
          - fee_type: subscription
            amount_cents: 0
            from_date: "2024-04-01T00:00:00Z"
            to_date: "2024-04-30T23:59:59Z"
          - fee_type: fixed_charge
            item_code: b13_r2_std_adv_pro_ovr
            units: "25.0"
            amount_cents: 250000
            precise_unit_amount: 100.0
            from_date: "2024-05-01T00:00:00Z"
            to_date: "2024-05-31T23:59:59Z"
  math: >-
    The override cell where the override has to survive TWICE — once against the plan-level event
    stream and once against the plan-level INVOICE trigger, which are two separate filters in two
    separate files.
    Invoices 0 and 1 are the activation invoice (10 units, coefficient 30/30 = 1 → 100_000¢) and the
    override invoice. For the second, Subscriptions::FixedChargeUnitsOverrides::WriteService writes
    the 25-unit override row, emits one event for this subscription, and — because
    `apply_units_immediately && fixed_charge.pay_in_advance? && subscription.active?` —
    enqueues Invoices::CreatePayInAdvanceFixedChargesJob itself (write_service.rb:27-38). The delta is
    25 - 10 = 15 against the April fee already on the books, at a coefficient of 15/30, so
    15 × 0.5 × 100.00 = 750.00 → 75_000¢ with `units` 15 and `precise_unit_amount` 50.00: byte for
    byte the same fee b13/standard/advance/prorated/increase-mid-period gets from the PLAN endpoint.
    That equality is deliberate — the override is a units change like any other for the subscription
    it names.
    The 2024-04-20 plan-level move to 40 units is where the row earns its keep. It succeeds, and the
    plan is genuinely at 40 afterwards, but this subscription gets neither an event nor an invoice:
    EmitEventsService's bulk scope excludes it
    (`.without_fixed_charge_units_override_for`, emit_events_service.rb:52) and
    Invoices::CreateAllPayInAdvanceFixedChargesJob applies the same scope before enqueuing per
    subscription (create_all_pay_in_advance_fixed_charges_job.rb:19-25). So `invoices: 3`, not 4.
    Invoice 2 is the periodic invoice; the last event before the readjusted MAY window is still the
    25-unit override → 25 × 100.00 = 250_000¢ for 2024-05-01..2024-05-31, beside an APRIL subscription
    fee.
    Two counterfactuals, both reachable by a one-line change. If only the event filter existed and not
    the job filter, there would be a FOURTH invoice for delta 40 - 25 = 15 at (2024-04-30 -
    2024-04-20 + 1)/30 = 11/30 → 15 × 0.366667 × 100.00 = 55_000¢. If neither filter existed, that
    fourth invoice would appear AND May would bill 40 × 100.00 = 400_000¢ instead of 250_000¢.
    `premium: true`: the subscription endpoint is licence-gated
    (update_or_override_fixed_charge_service.rb:21).

- id: b13/standard/advance/not-prorated/increase-mid-period
  block: B13
  group: chg-std
  key: b13_r2_std_adv_flat_inc
  vars: {pia: true, pro: false, ub: 10, ua: 25}
  axes: {charge_model: standard, pay_in_advance: "true", prorated: "false", units_change: increase-mid-period}
  calendar_sensitive: true
  expect:
    invoices: 3
    invoice:
      - select: {index: 0}
        invoice_type: subscription
