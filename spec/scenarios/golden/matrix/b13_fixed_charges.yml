    30 × 10.00 + 100.00 + 10 × 5.00 + 50.00 = 500.00 → 50_000¢ at 12.50, dated
    2024-05-01..2024-05-31 beside an April subscription fee.
    The counterfactuals are far apart here. If the plan-level update had reached this subscription
    there would be a FOURTH invoice for delta 60 - 40 = 20 → tier 1 from zero again → 30_000¢, and May
