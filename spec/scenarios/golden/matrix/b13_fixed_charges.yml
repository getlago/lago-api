    read 60_000¢ as well. Only 50_000¢ in May with three invoices says the override applied and held.
    `premium: true`: licence-gated (update_or_override_fixed_charge_service.rb:21).

# `volume` rejects pay_in_advance outright (FixedCharge#validate_pay_in_advance, fixed_charge.rb:79-85),
# so volume has only arrears cells. The six rows below reuse the volume ranges of the
# `units_change: none` volume rows verbatim — 0..30 at 10.00/unit + 100.00 flat, then 31..∞ at
# 6.00/unit + 200.00 flat — where the UPPER range is cheaper per unit but carries the dearer flat fee.
# That shape is what makes a tier crossing visible in both directions, and the quantities below (10,
# 50, 60) are chosen so the prorated total and the tier-selecting full units land in DIFFERENT ranges;
# with 40 units they would coincide and the row would prove nothing.

- id: b13/volume/arrears/not-prorated/increase-mid-period
  block: B13
  group: chg-vol
  key: b13_r2_vol_arr_flat_inc
  vars: {pro: false, ub: 10, ua: 50}
  axes: {charge_model: volume, pay_in_advance: "false", prorated: "false", units_change: increase-mid-period}
  calendar_sensitive: true
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      status: finalized
      fees_amount_cents: 50000
      taxes_amount_cents: 0
      total_amount_cents: 50000
      fees_count: 2
      fees:
        - fee_type: subscription
          amount_cents: 0
          from_date: "2024-04-01T00:00:00Z"
          to_date: "2024-04-30T23:59:59Z"
        - fee_type: fixed_charge
          item_code: b13_r2_vol_arr_flat_inc
          item_type: AddOn
          units: "50.0"
          amount_cents: 50000
          precise_unit_amount: 10.0
          from_date: "2024-04-01T00:00:00Z"
          to_date: "2024-04-30T23:59:59Z"
  math: >-
    Volume is the charge model where a units change can move EVERY unit's price, not just the marginal
    ones, and this row measures that on an increase that crosses the range boundary.
    SimpleAggregationService returns the last April event's units (simple_aggregation_service.rb:6-9),
    so both `aggregation` and `full_units_number` are 50 and VolumeService's `number_of_units` is 50
    either way (volume_service.rb:62-64, the `prorated?` branch being irrelevant here). `matching_range`
    is therefore the second range, 31..∞ (:56-60), and every unit is priced at ITS rate rather than
    tier by tier: 50 × 6.00 = 300.00, plus that range's 200.00 flat = 500.00 → 50_000¢,
    `unit_amount` = 500.00 / 50 = 10.00.
    The pre-change quantity would have billed in the FIRST range: 10 × 10.00 + 100.00 = 200.00 →
    20_000¢, which is also what `apply_units_immediately: false` produces (the event landing at
    2024-05-01T00:00:00Z, outside April's range). Graduated arithmetic on the same shape of ranges
    would keep the first thirty units at 10.00: 30 × 10.00 + 100.00 + 20 × 6.00 + 200.00 = 720.00 →
    72_000¢, so the 50_000¢ here is the charge_model axis doing its job — volume RE-PRICES rather than
    stacks. A blend, which the prorated sibling performs, gives 10 × 0.5 + 50 × 0.5 = 30 unit-months
    and a different answer again (38_000¢ there, for reasons the sibling's math sets out).
    Note the direction of the effect: crossing into a range whose per-unit price is LOWER still raises
    the bill, because the flat amount doubles from 100.00 to 200.00. That is why these ranges were
    chosen with a cheaper upper rate.
    Boundaries: arrears, so `readjust_boundaries` leaves the invoice's own window alone
    (fixed_charge_service.rb:242) and the fixed-charge fee shares 2024-04-01..2024-04-30 with the
    subscription fee. Both asserted.

- id: b13/volume/arrears/not-prorated/decrease-mid-period
  block: B13
  group: chg-vol
  key: b13_r2_vol_arr_flat_dec
  vars: {pro: false, ub: 60, ua: 10}
  axes: {charge_model: volume, pay_in_advance: "false", prorated: "false", units_change: decrease-mid-period}
  calendar_sensitive: true
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      status: finalized
      fees_amount_cents: 20000
      taxes_amount_cents: 0
      total_amount_cents: 20000
      fees_count: 2
      fees:
        - fee_type: subscription
          amount_cents: 0
          from_date: "2024-04-01T00:00:00Z"
          to_date: "2024-04-30T23:59:59Z"
        - fee_type: fixed_charge
          item_code: b13_r2_vol_arr_flat_dec
          item_type: AddOn
          units: "10.0"
          amount_cents: 20000
          precise_unit_amount: 20.0
          from_date: "2024-04-01T00:00:00Z"
          to_date: "2024-04-30T23:59:59Z"
  math: >-
    The mirror of the volume increase, and the row that shows a decrease can DROP a range: the account
    held 60 units for the first half of April and 10 for the second, and it is billed entirely in the
    first range.
    SimpleAggregationService takes the last event's 10 units, so `number_of_units` is 10 and
    `matching_range` is 0..30 (volume_service.rb:56-64): 10 × 10.00 = 100.00 plus that range's 100.00
    flat = 200.00 → 20_000¢, `unit_amount` = 200.00 / 10 = 20.00. The upper range's 200.00 flat is not
    charged at all.
    That is the whole span of the volume decrease: 20_000¢, against 56_000¢ (60 × 6.00 + 200.00) had a
    high-water mark been used, and against 45_000¢ for the prorated sibling — a factor of nearly three
    between the cheapest and dearest defensible reading of the same April. Read with
    b13/volume/arrears/not-prorated/increase-mid-period, the pair pins last-event-wins: 10 → 50 bills
    50_000¢ and 60 → 10 bills 20_000¢, so it is neither the maximum, nor the opening value, nor any
    blend.
    Boundaries: the un-readjusted arrears window, shared with the subscription fee; both asserted.

- id: b13/volume/arrears/not-prorated/subscription-override
  block: B13
  group: ovr-vol
  key: b13_r2_vol_arr_flat_ovr
  vars: {pro: false, pu: 10, ou: 50, lu: 25}
  axes: {charge_model: volume, pay_in_advance: "false", prorated: "false", units_change: subscription-override}
  premium: true
  calendar_sensitive: true
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      status: finalized
      fees_amount_cents: 50000
      taxes_amount_cents: 0
      total_amount_cents: 50000
      fees_count: 2
      fees:
        - fee_type: subscription
          amount_cents: 0
          from_date: "2024-04-01T00:00:00Z"
          to_date: "2024-04-30T23:59:59Z"
        - fee_type: fixed_charge
          item_code: b13_r2_vol_arr_flat_ovr
          item_type: AddOn
          units: "50.0"
          amount_cents: 50000
          precise_unit_amount: 10.0
          from_date: "2024-04-01T00:00:00Z"
          to_date: "2024-04-30T23:59:59Z"
  math: >-
    The volume override, set up so the plan's later value (25 units) sits in the FIRST range while the
    override's (50) sits in the second — a leak would therefore change the flat amount and the per-unit
    rate together, not just the quantity.
    The 2024-04-16 request is units-only, so Subscriptions::UpdateOrOverrideFixedChargeService writes a
    Subscription::FixedChargeUnitsOverride of 50 and emits one event for this subscription
    (update_or_override_fixed_charge_service.rb:41-58 → write_service.rb:19-32). The 2024-04-20
    plan-level move to 25 units succeeds against the plan and skips this subscription, because
    EmitEventsService's bulk scope is `.without_fixed_charge_units_override_for(fixed_charge)`
    (emit_events_service.rb:52).
    The last April event is therefore the 50-unit override. SimpleAggregationService returns 50,
    `number_of_units` is 50, `matching_range` is 31..∞ and every unit is priced at 6.00:
    50 × 6.00 = 300.00 plus the 200.00 flat = 500.00 → 50_000¢, `unit_amount` 500.00 / 50 = 10.00.
    Had the plan-level update reached this subscription, 25 units would be the last event, the FIRST
    range would apply and the fee would be 25 × 10.00 + 100.00 = 350.00 → 35_000¢ — a lower amount at a
    HIGHER unit price of 14.00, which is the signature of dropping a range. Had the override never
    applied at all the answer would be 35_000¢ too. So 50_000¢ says the override applied and survived,
    and 10.00 per unit says which range it landed in.
    `premium: true`: licence-gated endpoint (update_or_override_fixed_charge_service.rb:21).

- id: b13/volume/arrears/prorated/increase-mid-period
  block: B13
  group: chg-vol
  key: b13_r2_vol_arr_pro_inc
  vars: {pro: true, ub: 10, ua: 50}
  axes: {charge_model: volume, pay_in_advance: "false", prorated: "true", units_change: increase-mid-period}
  calendar_sensitive: true
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      status: finalized
      fees_amount_cents: 38000
      taxes_amount_cents: 0
      total_amount_cents: 38000
      fees_count: 2
      fees:
        - fee_type: subscription
          amount_cents: 0
          from_date: "2024-04-01T00:00:00Z"
          to_date: "2024-04-30T23:59:59Z"
        - fee_type: fixed_charge
          item_code: b13_r2_vol_arr_pro_inc
          item_type: AddOn
          units: "50.0"
          amount_cents: 38000
          precise_unit_amount: 7.6
          from_date: "2024-04-01T00:00:00Z"
          to_date: "2024-04-30T23:59:59Z"
  math: >-
    Volume prorated is the one charge model that uses the full units and the prorated units for two
    DIFFERENT jobs in the same computation, and a mid-period increase is what makes the two disagree.
    There is no ProratedVolumeService — ChargeModels::Factory:56-57 returns the ordinary VolumeService —
    but VolumeService is prorated-aware in exactly one place: `number_of_units`, which selects the
    RANGE, is `full_units_number` when the charge is prorated and the aggregation otherwise
    (volume_service.rb:62-64).
    ProratedAggregationService weights the two April events by days in force
    (prorated_aggregation_service.rb:119-154): 10 × 15/30 = 5 then 50 × 15/30 = 25, so
    `aggregation` = 30.000000, while `full_units_number` is the LAST event's units, 50 (:22).
    So the range is chosen by 50 → the second range, 31..∞ at 6.00/unit with a 200.00 flat — while
    `per_unit_total_amount` multiplies the PRORATED aggregation (:52-54): 30 × 6.00 = 180.00.
    `flat_unit_amount` is added whole (:44-46). Fee = 180.00 + 200.00 = 380.00 → 38_000¢, and
    `unit_amount` divides by the FULL 50 → 7.60 (:30-33). The reported `units` is `full_units_number`
    = 50 (fixed_charge_service.rb:100), so the fee says 50 units at 7.60 while 30 unit-months at 6.00
    were actually priced — both asserted, because the amount alone cannot separate them.
    The quantities were chosen so all four candidate behaviours differ, which 40 units would not have
    achieved. Actual: range by 50, price 30, flat in full = 38_000¢. Prorate first and then choose the
    range: 30 unit-months lands in the FIRST range (30 ≤ 30) → 30 × 10.00 + 100.00 = 400.00 →
    40_000¢ — dearer than the actual, despite pricing the same 30 unit-months, because the cheap upper
    rate is lost. Ignore proration entirely: the sibling's 50 × 6.00 + 200.00 = 500.00 → 50_000¢.
    Prorate the flat amount too: 180.00 + 200.00 × 0.6 = 300.00 → 30_000¢. That the flat is NOT
    prorated while the per-unit amount is is the substantive claim, and it is only visible because the
    ranges carry flat fees.
    Boundaries: arrears, un-readjusted, shared with the subscription fee; both asserted.

- id: b13/volume/arrears/prorated/decrease-mid-period
  block: B13
  group: chg-vol
  key: b13_r2_vol_arr_pro_dec
  vars: {pro: true, ub: 60, ua: 10}
  axes: {charge_model: volume, pay_in_advance: "false", prorated: "true", units_change: decrease-mid-period}
  calendar_sensitive: true
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      status: finalized
      fees_amount_cents: 45000
      taxes_amount_cents: 0
      total_amount_cents: 45000
      fees_count: 2
      fees:
        - fee_type: subscription
          amount_cents: 0
          from_date: "2024-04-01T00:00:00Z"
          to_date: "2024-04-30T23:59:59Z"
        - fee_type: fixed_charge
          item_code: b13_r2_vol_arr_pro_dec
          item_type: AddOn
          units: "10.0"
          amount_cents: 45000
          precise_unit_amount: 45.0
          from_date: "2024-04-01T00:00:00Z"
          to_date: "2024-04-30T23:59:59Z"
  math: >-
    The cell where volume's split of duties produces its most counter-intuitive bill: the range is
    chosen by the CLOSING 10 units, so the account is priced in the FIRST range, but the quantity
    priced is 35 unit-months — three and a half times the closing headcount, at the dearer rate.
    ProratedAggregationService gives 60 × 15/30 + 10 × 15/30 = 35.000000
    (prorated_aggregation_service.rb:119-154) and `full_units_number` = 10 (:22).
    VolumeService's `number_of_units` is the FULL units when prorated (volume_service.rb:62-64), i.e.
    10, so `matching_range` is 0..30 (:56-60) — the range the closing position sits in, not the one the
    period's volume would suggest. `per_unit_total_amount` then multiplies the prorated aggregation by
    THAT range's rate (:52-54): 35 × 10.00 = 350.00, and the 100.00 flat is added whole (:44-46) →
    450.00 → 45_000¢. `unit_amount` divides by the full 10 → 45.00 (:30-33), four and a half times the
    range's own 10.00, and the fee reports `units` 10 beside it. Both are asserted: this pair of fields
    is the only place the discrepancy is visible.
    This is deliberately DEARER than the un-prorated sibling's 20_000¢ — proration here more than
    doubles the bill, because the units held for the first fortnight are re-priced at the closing
    range's higher per-unit rate instead of the 6.00 they were contracted at.
    Candidates, all distinct with these quantities. Actual: range by full 10, price 35 unit-months at
    10.00, flat in full = 45_000¢. Choosing the range by the PRORATED 35 instead lands in the second
    range → 35 × 6.00 + 200.00 = 410.00 → 41_000¢. Ignoring proration is the sibling's
    10 × 10.00 + 100.00 = 200.00 → 20_000¢. A high-water mark on 60 units would be
    60 × 6.00 + 200.00 = 560.00 → 56_000¢. And prorating the flat amount by the period share the
    aggregation implies (35/10 is above 1, so the honest reading of that alternative is the un-scaled
    flat) is excluded by the total: 45_000¢ contains exactly 100.00 of flat and 350.00 of per-unit
    charge, and no other split of 450.00 matches both this row and its un-prorated sibling.
    Boundaries: arrears, un-readjusted, shared with the subscription fee; both asserted.

- id: b13/volume/arrears/prorated/subscription-override
  block: B13
  group: ovr-vol
  key: b13_r2_vol_arr_pro_ovr
  vars: {pro: true, pu: 10, ou: 50, lu: 25}
  axes: {charge_model: volume, pay_in_advance: "false", prorated: "true", units_change: subscription-override}
  premium: true
  calendar_sensitive: true
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      status: finalized
      fees_amount_cents: 38000
      taxes_amount_cents: 0
      total_amount_cents: 38000
      fees_count: 2
      fees:
        - fee_type: subscription
          amount_cents: 0
          from_date: "2024-04-01T00:00:00Z"
          to_date: "2024-04-30T23:59:59Z"
        - fee_type: fixed_charge
          item_code: b13_r2_vol_arr_pro_ovr
          item_type: AddOn
          units: "50.0"
          amount_cents: 38000
          precise_unit_amount: 7.6
          from_date: "2024-04-01T00:00:00Z"
          to_date: "2024-04-30T23:59:59Z"
  math: >-
    The last of the 36 cells, and the one with the most inputs riding on a single filter: a stray
    plan-level event would move the prorated aggregation, the full units, the chosen RANGE and the flat
    amount, all at once.
    The 2024-04-16 units-only PUT writes a Subscription::FixedChargeUnitsOverride of 50 and emits one
    event for this subscription (update_or_override_fixed_charge_service.rb:41-58 →
    write_service.rb:19-32). The 2024-04-20 plan-level PUT moves the plan to 25 and skips this
    subscription (`.without_fixed_charge_units_override_for`, emit_events_service.rb:52).
    April therefore holds two events, 10 at 2024-04-01T00:00:01Z and 50 at 2024-04-16, so
    `aggregation` = 10 × 15/30 + 50 × 15/30 = 30.000000 and `full_units_number` = 50 — identical to
    b13/volume/arrears/prorated/increase-mid-period, and so is the fee: range chosen by 50 → 31..∞,
    30 unit-months × 6.00 = 180.00, plus the 200.00 flat in full = 380.00 → 38_000¢, `unit_amount`
    380.00 / 50 = 7.60 (volume_service.rb:30-33, 52-64).
    Had the plan-level event reached this subscription, all four inputs would change together:
    `aggregation` = 10 × 15/30 + 50 × 4/30 + 25 × 11/30 = 5 + 6.666667 + 9.166667 = 20.833334,
    `full_units_number` = 25, which selects the FIRST range → 20.833334 × 10.00 + 100.00 = 308.33334 →
    30_833¢ at a unit amount of 12.33. Had the override never applied, the stream would be 10 then 25 →
    `aggregation` = 10 × 19/30 + 25 × 11/30 = 6.333333 + 9.166667 = 15.500000, full 25, first range →
    15.5 × 10.00 + 100.00 = 255.00 → 25_500¢. Three distinct amounts, two distinct ranges and two
    distinct flat fees, so 38_000¢ with a 7.60 unit amount is reachable only if the override applied
    and then survived the plan change.
    `premium: true`: licence-gated endpoint (update_or_override_fixed_charge_service.rb:21).
