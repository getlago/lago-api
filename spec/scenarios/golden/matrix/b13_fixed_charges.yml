        total_amount_cents: 50000
        fees_count: 2
        fees:
          - fee_type: subscription
            amount_cents: 0
            from_date: "2024-04-01T00:00:00Z"
            to_date: "2024-04-30T23:59:59Z"
          - fee_type: fixed_charge
            item_code: b13_r2_grad_adv_ovr
            units: "40.0"
            amount_cents: 50000
            precise_unit_amount: 12.5
            from_date: "2024-05-01T00:00:00Z"
            to_date: "2024-05-31T23:59:59Z"
  math: >-
    Graduated's only advance override cell, and it asserts the override against BOTH plan-level
    mechanisms at once: the event stream and the bulk invoice trigger.
    Invoice 0, activation: delta 20 at coefficient 1 → tier 1 only → 20 × 10.00 + 100.00 = 300.00 →
    30_000¢ at 15.00 per unit.
    Invoice 1, the 2024-04-16 units-only override to 40. WriteService writes the
    Subscription::FixedChargeUnitsOverride, emits ONE event for this subscription, and enqueues
    Invoices::CreatePayInAdvanceFixedChargesJob itself (write_service.rb:27-38). `already_paid_units`
    = 20 → delta 20 → the delta is tiered from zero again → 300.00 → 30_000¢, `precise_unit_amount`
    15.00, April boundaries. Identical to the plan-endpoint fee in
    b13/graduated/advance/not-prorated/increase-mid-period, including the re-charged 100.00 flat.
    The 2024-04-20 plan-level move to 60 units changes the plan and does nothing here: no event
    (`.without_fixed_charge_units_override_for`, emit_events_service.rb:52) and no invoice
    (create_all_pay_in_advance_fixed_charges_job.rb:19-25 applies the same scope before enqueuing per
    subscription). Hence `invoices: 3`.
