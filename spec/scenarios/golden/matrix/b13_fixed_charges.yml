# The graduated rows below reuse the ranges of the `units_change: none` graduated rows verbatim —
# 0..30 at 10.00/unit + 100.00 flat, then 31..∞ at 5.00/unit + 50.00 flat — so their numbers are
# directly comparable with them. The ranges are NOT adjacent (31 = 30 + 1), so `adjacent_ranges?` is
# false and RangeGraduatedService bills `to_value - from_value + 1` in the upper range
# (amount_details/range_graduated_service.rb:53-65). The flat amounts are what make the tiering
# visible at all: they are what a "priced everything at tier 1" implementation would omit.

- id: b13/graduated/arrears/not-prorated/increase-mid-period
  block: B13
  group: chg-grad
  key: b13_r2_grad_arr_flat_inc
  vars: {pia: false, pro: false, ub: 10, ua: 40}
  axes: {charge_model: graduated, pay_in_advance: "false", prorated: "false", units_change: increase-mid-period}
  calendar_sensitive: true
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      status: finalized
      fees_amount_cents: 50000
      taxes_amount_cents: 0
      total_amount_cents: 50000
      fees_count: 2
      fees:
        - fee_type: subscription
          amount_cents: 0
          from_date: "2024-04-01T00:00:00Z"
          to_date: "2024-04-30T23:59:59Z"
        - fee_type: fixed_charge
          item_code: b13_r2_grad_arr_flat_inc
          item_type: AddOn
          units: "40.0"
          amount_cents: 50000
          precise_unit_amount: 12.5
          from_date: "2024-04-01T00:00:00Z"
          to_date: "2024-04-30T23:59:59Z"
  math: >-
    A not-prorated graduated fixed charge does not blend and does not accumulate: the last event's
    units are re-tiered from zero for the whole period. SimpleAggregationService returns
    `events_in_range.last.units` (simple_aggregation_service.rb:6-9) over the two April events
    (10 at 2024-04-01T00:00:01Z, 40 at 2024-04-16T00:00:00Z, ordered by created_at,
    base_service.rb:39-47) → both `aggregation` and `full_units_number` are 40, and the ordinary
    ChargeModels::GraduatedService prices them. Tier 1 caps at its `to_value` 30 → 30 × 10.00 = 300.00
    plus 100.00 flat = 400.00. Tier 2's `to_value` is null so the effective total is 40 →
    40 - 31 + 1 = 10 units → 10 × 5.00 = 50.00 plus 50.00 flat = 100.00. Total 500.00 → 50_000¢,
    `precise_unit_amount` = 500.00 / 40 = 12.50 (graduated_service.rb:63-68 divides by
    `full_units_number`).
    The units change is what makes the tier boundary do work here: the pre-change quantity, 10 units,
    sits entirely inside tier 1 and would bill 10 × 10.00 + 100.00 = 200.00 → 20_000¢, with ONE flat
    amount instead of two. So the number separates four behaviours. 50_000¢: last event wins, tiered
    from zero. 20_000¢: created units kept — and 20_000¢ is equally what
    `apply_units_immediately: false` yields, the event landing at 2024-05-01T00:00:00Z outside April's
    range. 70_000¢: both quantities tiered independently and summed (200.00 + 500.00). 30_000¢:
    only the INCREMENT tiered, 40 - 10 = 30 units → 300.00 + 100.00 flat, which is what an
    advance-style delta would compute — and is exactly what
    b13/graduated/advance/not-prorated/increase-mid-period does bill on its own middle invoice.
    Boundaries: arrears, so `readjust_boundaries` leaves the invoice's own window alone
    (fixed_charge_service.rb:242) and the fixed-charge fee shares 2024-04-01..2024-04-30 with the
    subscription fee. Both asserted.

- id: b13/graduated/arrears/not-prorated/decrease-mid-period
  block: B13
  group: chg-grad
  key: b13_r2_grad_arr_flat_dec
  vars: {pia: false, pro: false, ub: 40, ua: 10}
  axes: {charge_model: graduated, pay_in_advance: "false", prorated: "false", units_change: decrease-mid-period}
  calendar_sensitive: true
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      status: finalized
      fees_amount_cents: 20000
      taxes_amount_cents: 0
      total_amount_cents: 20000
      fees_count: 2
      fees:
        - fee_type: subscription
          amount_cents: 0
          from_date: "2024-04-01T00:00:00Z"
          to_date: "2024-04-30T23:59:59Z"
        - fee_type: fixed_charge
          item_code: b13_r2_grad_arr_flat_dec
          item_type: AddOn
          units: "10.0"
          amount_cents: 20000
          precise_unit_amount: 20.0
          from_date: "2024-04-01T00:00:00Z"
          to_date: "2024-04-30T23:59:59Z"
  math: >-
    The mirror of the graduated increase, and the direction that proves the aggregation is
    last-event-wins rather than a high-water mark — a distinction that costs a whole TIER here, not
    just some units.
    The same two events are in range, the later one carries 10 units, and SimpleAggregationService
    takes it (simple_aggregation_service.rb:6). GraduatedService then tiers 10 from zero: tier 1's
    `to_value` 30 exceeds 10, so `effective_total` is 10 → 10 × 10.00 = 100.00 plus 100.00 flat =
    200.00, and `amount_details` breaks out of the range loop because `range[:to_value] >= units`
    (graduated_service.rb:11-18) — tier 2 is never entered and its 50.00 flat is never charged. Total
    200.00 → 20_000¢, `precise_unit_amount` = 200.00 / 10 = 20.00.
    That the SECOND flat amount disappears is the sharp part. A high-water-mark aggregation would keep
    40 units, re-enter tier 2 and bill 50_000¢ — 30_000¢ more, of which 50.00 is pure flat fee that no
    unit justifies. Blending the period (which the prorated sibling does) gives
    40 × 0.5 + 10 × 0.5 = 25 units, still inside tier 1, at 35_000¢. Crediting the released units
    would give a negative fee, which fixed_charge_service.rb:87-90 clamps to 0 in any case.
    Read with b13/graduated/arrears/not-prorated/increase-mid-period, the pair pins the aggregation
    exactly: 10 → 40 bills 50_000¢ and 40 → 10 bills 20_000¢, so neither the maximum nor the sum nor
    the opening value is what Lago uses. One row alone cannot say that.
    Boundaries are the un-readjusted arrears window shared with the subscription fee; both asserted.

- id: b13/graduated/arrears/not-prorated/subscription-override
  block: B13
  group: ovr-grad
  key: b13_r2_grad_arr_flat_ovr
  vars: {pia: false, pro: false, pu: 10, ou: 40, lu: 25}
  axes: {charge_model: graduated, pay_in_advance: "false", prorated: "false", units_change: subscription-override}
  premium: true
  calendar_sensitive: true
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      status: finalized
      fees_amount_cents: 50000
      taxes_amount_cents: 0
      total_amount_cents: 50000
      fees_count: 2
      fees:
        - fee_type: subscription
          amount_cents: 0
          from_date: "2024-04-01T00:00:00Z"
          to_date: "2024-04-30T23:59:59Z"
        - fee_type: fixed_charge
          item_code: b13_r2_grad_arr_flat_ovr
          item_type: AddOn
          units: "40.0"
          amount_cents: 50000
          precise_unit_amount: 12.5
          from_date: "2024-04-01T00:00:00Z"
          to_date: "2024-04-30T23:59:59Z"
  math: >-
    The override cell chosen so that the plan's later value lands in a DIFFERENT TIER from the
    override's — 25 units is inside tier 1, 40 crosses into tier 2 — so the assertion is not a units
    comparison but a price-structure one, and a leak would move the flat-fee count as well as the
    amount.
    The 2024-04-16 request is units-only, so Subscriptions::UpdateOrOverrideFixedChargeService writes
    a Subscription::FixedChargeUnitsOverride of 40 and emits one event for this subscription
    (update_or_override_fixed_charge_service.rb:41-58 → write_service.rb:19-32). The 2024-04-20
    plan-level move to 25 units succeeds, the plan really is at 25 afterwards, and this subscription is
    skipped: EmitEventsService's bulk scope is `.without_fixed_charge_units_override_for(fixed_charge)`
    (emit_events_service.rb:52).
    So the last April event is the 40-unit override, SimpleAggregationService returns 40, and
    GraduatedService bills both tiers: 30 × 10.00 + 100.00 = 400.00, then 40 - 31 + 1 = 10 units at
    5.00 + 50.00 flat = 100.00. Total 500.00 → 50_000¢, `precise_unit_amount` 500.00 / 40 = 12.50, and
    150.00 of that is flat fees — the second of which exists only because tier 2 was reached.
    Had the plan-level update reached this subscription, its 25 units would be the last event and the
    fee would be 25 × 10.00 + 100.00 = 350.00 → 35_000¢ with a SINGLE flat amount. Had the override
    never applied, the stream would be 10 then 25 and the answer would be 35_000¢ too — so 50_000¢ is
    reachable only if the override took effect AND survived the later plan change, and the 15_000¢ gap
    is not a rounding-sized difference that a wrong derivation could land on by accident.
    `premium: true`: the endpoint is licence-gated (update_or_override_fixed_charge_service.rb:21).

- id: b13/graduated/arrears/prorated/increase-mid-period
  block: B13
  group: chg-grad
  key: b13_r2_grad_arr_pro_inc
  vars: {pia: false, pro: true, ub: 10, ua: 40}
  axes: {charge_model: graduated, pay_in_advance: "false", prorated: "true", units_change: increase-mid-period}
  calendar_sensitive: true
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      status: finalized
      fees_amount_cents: 36875
      taxes_amount_cents: 0
      total_amount_cents: 36875
      fees_count: 2
      fees:
        - fee_type: subscription
          amount_cents: 0
          from_date: "2024-04-01T00:00:00Z"
          to_date: "2024-04-30T23:59:59Z"
        - fee_type: fixed_charge
          item_code: b13_r2_grad_arr_pro_inc
          item_type: AddOn
          units: "40.0"
          amount_cents: 36875
          precise_unit_amount: 9.21875
          from_date: "2024-04-01T00:00:00Z"
          to_date: "2024-04-30T23:59:59Z"
  math: >-
    The only cell in the block where a units change and a tier boundary and proration all bear on one
    number, and it is the one place the charge model itself is different: `graduated` + `prorated` is
    the sole combination for which ChargeModels::Factory swaps in ProratedGraduatedService
    (factory.rb:40-45).
    Step 1, the aggregation. ProratedAggregationService weights the two April events by days in force
    (prorated_aggregation_service.rb:119-154): 10 units for 2024-04-01..2024-04-16 → 10 × 15/30 = 5,
    then 40 units for 2024-04-16..2024-05-01 → 40 × 15/30 = 20. `aggregation` = 25.000000, while
    `full_units_number` is the LAST event's units, 40 (:22).
    Step 2, and this is the part worth pinning: the fixed-charge aggregator's `per_event_aggregation`
    does NOT return one entry per event. It returns two one-element arrays,
    `event_aggregation = [full_units_number]` = [40] and
    `event_prorated_aggregation = [aggregation]` = [25] (:27-34) — the whole period collapsed into a
    single synthetic "event". So ProratedGraduatedService sees one 40-unit event whose prorated value
    is 25, and the per-event structure the class was written for (charges, where each event is a
    separate row) is absent here. The consequence is that the tiering is driven by the period TOTAL,
    not by the order the units arrived in.
    Step 3, the pricing (prorated_graduated_service.rb:34-93). `full_sum` becomes 40, `prorated_sum`
    25; tier 1's `to_value` is 30, so `overflow` = 40 - 30 = 10 full units spill upward and the
    prorated sum is split by `prorated_coefficient` = 25.fdiv(40) = 0.625: tier 1 keeps
    30 × 0.625 = 18.75 prorated units at 10.00 = 187.50, tier 2 takes 10 × 0.625 = 6.25 at 5.00 =
    31.25. `result_with_flat_amount` (:112-123) then adds every flat amount up to the highest range
    REACHED by the FULL units, in full and un-prorated: 100.00 + 50.00 = 150.00. Total 368.75 →
    36_875¢, `precise_unit_amount` = 368.75 / 40 = 9.21875 (:103-108 divides by the full-units sum).
    Four candidates, all separated by these numbers. Prorating first and tiering the result would put
    25 units wholly in tier 1 → 25 × 10.00 + 100.00 = 350.00 → 35_000¢ (and lose the second flat fee).
    Ignoring proration is the sibling b13/graduated/arrears/not-prorated/increase-mid-period's
    500.00 → 50_000¢. Prorating the flat amounts too would give 187.50 + 31.25 + 93.75 = 312.50 →
    31_250¢. And a high-water aggregation, weighting both halves of April at 40 units, would give a
    coefficient of 1 and reproduce the un-prorated 50_000¢ — so the 36_875¢ here also says the earlier
    ten units were not silently promoted.
    Boundaries: arrears, so nothing is readjusted and both fees report 2024-04-01..2024-04-30.

- id: b13/graduated/arrears/prorated/decrease-mid-period
  block: B13
  group: chg-grad
  key: b13_r2_grad_arr_pro_dec
  vars: {pia: false, pro: true, ub: 40, ua: 10}
  axes: {charge_model: graduated, pay_in_advance: "false", prorated: "true", units_change: decrease-mid-period}
  calendar_sensitive: true
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      status: finalized
      fees_amount_cents: 35000
      taxes_amount_cents: 0
      total_amount_cents: 35000
      fees_count: 2
      fees:
        - fee_type: subscription
          amount_cents: 0
          from_date: "2024-04-01T00:00:00Z"
          to_date: "2024-04-30T23:59:59Z"
        - fee_type: fixed_charge
          item_code: b13_r2_grad_arr_pro_dec
          item_type: AddOn
          units: "10.0"
          amount_cents: 35000
          precise_unit_amount: 35.0
          from_date: "2024-04-01T00:00:00Z"
          to_date: "2024-04-30T23:59:59Z"
  math: >-
    The row that shows the prorated-graduated coefficient can exceed 1, and that the tier is chosen by
    the LAST event's units rather than by the period's unit-months or by the maximum held.
    The aggregation is 40 × 15/30 + 10 × 15/30 = 30.000000 unit-months, `full_units_number` = 10.
    So `per_event_aggregation` hands ProratedGraduatedService `event_aggregation = [10]` and
    `event_prorated_aggregation = [30]` (prorated_aggregation_service.rb:27-34) — a "prorated" figure
    THREE TIMES the full one, because half a month at 40 units outweighs the closing 10.
    In ProratedGraduatedService (:34-93), `full_sum` becomes 10 and `prorated_sum` 30. Tier selection
    runs off `full_sum`: 10 < tier 1's `to_value` of 30, so `skip_overflow_calculation?` is true
    (:163-167), no overflow is computed and the loop exits with everything in tier 1. The whole
    prorated sum is then priced at tier 1's rate: 30 × 10.00 = 300.00, and
    `result_with_flat_amount` adds only tier 1's flat amount because `max_full_units` (10) is inside
    it (:112-123). Total 350.00 → 35_000¢. `precise_unit_amount` = 350.00 / 10 = 35.00 — three and a
    half times the 10.00 tier rate — and `units` is 10, so the fee openly reports ten units at a
    price that thirty unit-months earned. Both fields are asserted; the amount alone cannot show it.
    That combination is the substantive claim, and it is a deliberate asymmetry with the increase
    sibling: 30 prorated unit-months are billed at TIER 1 here while 25 prorated unit-months are split
    across tiers there, purely because the closing quantity differs.
    Candidates. Ignoring proration is 10 × 10.00 + 100.00 = 200.00 → 20_000¢, the
    b13/graduated/arrears/not-prorated/decrease-mid-period sibling. A high-water aggregation —
    weighting both halves at the OPENING 40 units — gives prorated 40 and full 40, coefficient 1, and
    crosses into tier 2: 30 × 10.00 + 10 × 5.00 + 150.00 of flats = 500.00 → 50_000¢. Prorating first
    and then tiering gives 30 units, which lands exactly on tier 1's boundary and so reproduces
    350.00 — indistinguishable here by construction, and separated by the increase sibling where the
    same alternative reads 35_000¢ against 36_875¢. Prorating the flat amount too would be
    300.00 + 50.00 = 350.00, likewise indistinguishable here and separated by the increase sibling
    (150.00 of flats against a prorated 93.75).
    Boundaries: arrears, un-readjusted, shared with the subscription fee; both asserted.

- id: b13/graduated/arrears/prorated/subscription-override
  block: B13
  group: ovr-grad
  key: b13_r2_grad_arr_pro_ovr
  vars: {pia: false, pro: true, pu: 10, ou: 40, lu: 25}
  axes: {charge_model: graduated, pay_in_advance: "false", prorated: "true", units_change: subscription-override}
  premium: true
  calendar_sensitive: true
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      status: finalized
      fees_amount_cents: 36875
      taxes_amount_cents: 0
      total_amount_cents: 36875
      fees_count: 2
      fees:
        - fee_type: subscription
          amount_cents: 0
          from_date: "2024-04-01T00:00:00Z"
          to_date: "2024-04-30T23:59:59Z"
        - fee_type: fixed_charge
          item_code: b13_r2_grad_arr_pro_ovr
          item_type: AddOn
          units: "40.0"
          amount_cents: 36875
          precise_unit_amount: 9.21875
          from_date: "2024-04-01T00:00:00Z"
          to_date: "2024-04-30T23:59:59Z"
  math: >-
    The strictest override assertion in the block, because both of the numbers that describe the
    period — the prorated total AND the tier-selecting full units — change if a single unwanted event
    reaches this subscription, and they change in different directions.
    The units-only PUT on 2024-04-16 writes a Subscription::FixedChargeUnitsOverride of 40 and emits
    one event for this subscription (update_or_override_fixed_charge_service.rb:41-58 →
    write_service.rb:19-32). The plan-level PUT on 2024-04-20 moves the plan to 25 units and skips this
    subscription (`.without_fixed_charge_units_override_for`, emit_events_service.rb:52).
    So April holds two events, 10 at 2024-04-01T00:00:01Z and 40 at 2024-04-16, giving
    `aggregation` = 10 × 15/30 + 40 × 15/30 = 25.000000 and `full_units_number` = 40 — identical to
    b13/graduated/arrears/prorated/increase-mid-period, so the fee is identical too:
    coefficient 25.fdiv(40) = 0.625, tier 1 30 × 0.625 × 10.00 = 187.50, tier 2
    10 × 0.625 × 5.00 = 31.25, flats 100.00 + 50.00 un-prorated = 150.00 → 368.75 → 36_875¢ at
    `precise_unit_amount` 368.75 / 40 = 9.21875.
    Had the plan-level event reached this subscription, April would hold THREE events and both inputs
    would move: `aggregation` = 10 × 15/30 + 40 × 4/30 + 25 × 11/30 = 5 + 5.333333 + 9.166667 =
    19.500000 and `full_units_number` = 25, which no longer reaches tier 2 at all — coefficient
    19.5/25 = 0.78, 25 × 0.78 × 10.00 = 195.00 plus tier 1's flat 100.00 only = 295.00 → 29_500¢.
    Had the override never applied, the stream would be 10 then 25 →
    aggregation 10 × 19/30 + 25 × 11/30 = 6.333333 + 9.166667 = 15.500000, full 25, coefficient 0.62 →
    25 × 0.62 × 10.00 = 155.00 + 100.00 = 255.00 → 25_500¢. Three distinct amounts and two distinct
    flat-fee counts, so 36_875¢ is reachable only if the override applied and then survived.
    `premium: true`: licence-gated endpoint (update_or_override_fixed_charge_service.rb:21).

# `graduated` + `pay_in_advance` + `prorated` is rejected outright (FixedCharge#validate_prorated,
# fixed_charge.rb:88-96), so the three rows below are graduated's only advance cells and they are
# un-prorated by construction. They use 20 units as the starting quantity rather than 10, so every
# delta divides its amount exactly and no expectation depends on BigDecimal division precision.

- id: b13/graduated/advance/not-prorated/increase-mid-period
  block: B13
  group: chg-grad
  key: b13_r2_grad_adv_inc
  vars: {pia: true, pro: false, ub: 20, ua: 40}
  axes: {charge_model: graduated, pay_in_advance: "true", prorated: "false", units_change: increase-mid-period}
  calendar_sensitive: true
  expect:
    invoices: 3
    invoice:
      - select: {index: 0}
        invoice_type: subscription
        fees_amount_cents: 30000
        total_amount_cents: 30000
        fees_count: 1
        fees:
          - fee_type: fixed_charge
            item_code: b13_r2_grad_adv_inc
            item_type: AddOn
            units: "20.0"
            amount_cents: 30000
            precise_unit_amount: 15.0
            from_date: "2024-04-01T00:00:00Z"
            to_date: "2024-04-30T23:59:59Z"
      - select: {index: 1}
        invoice_type: subscription
        fees_amount_cents: 30000
        total_amount_cents: 30000
        fees_count: 1
        fees:
          - fee_type: fixed_charge
            item_code: b13_r2_grad_adv_inc
            units: "20.0"
            amount_cents: 30000
            precise_unit_amount: 15.0
            from_date: "2024-04-01T00:00:00Z"
            to_date: "2024-04-30T23:59:59Z"
      - select: {index: 2}
        invoice_type: subscription
        status: finalized
        fees_amount_cents: 50000
        taxes_amount_cents: 0
        total_amount_cents: 50000
        fees_count: 2
        fees:
          - fee_type: subscription
            amount_cents: 0
            from_date: "2024-04-01T00:00:00Z"
            to_date: "2024-04-30T23:59:59Z"
          - fee_type: fixed_charge
            item_code: b13_r2_grad_adv_inc
            units: "40.0"
            amount_cents: 50000
            precise_unit_amount: 12.5
            from_date: "2024-05-01T00:00:00Z"
            to_date: "2024-05-31T23:59:59Z"
  math: >-
    The row where the advance delta and a tiered charge model meet, and the answer is the one a
    reviewer is least likely to guess: the DELTA is priced as if it were a fresh subscription, from
    tier 1 upward, INCLUDING tier 1's flat amount a second time.
    Invoice 0, activation: `already_paid_units` = 0, delta = 20, coefficient 1 (not prorated). The
    delta is handed to ChargeModels::Factory through a synthetic aggregation result whose
    `aggregation` and `full_units_number` are both 20
    (build_pay_in_advance_fixed_charge_service.rb:148-164) → GraduatedService tiers 20: tier 1's
    `to_value` 30 exceeds 20 so `effective_total` is 20 → 20 × 10.00 = 200.00 plus 100.00 flat =
    300.00, and the range loop breaks (graduated_service.rb:11-18). 300.00 → 30_000¢,
    `precise_unit_amount` = 300/20 = 15.00.
    Invoice 1, the change: `already_paid_units` = 20 read off invoice 0's fee by exact April-boundary
    match (:63-86) → delta = 20 again, and the SAME calculation runs on it → another 300.00 →
    30_000¢, `precise_unit_amount` 15.00. So the customer pays 100.00 of tier-1 flat fee TWICE inside
    one April, and both 20-unit blocks are priced at tier 1's 10.00 even though the account is now at
    40 units and its 31st..40th units are contractually worth 5.00.
    The incremental price a reader would expect is `cost(40) - cost(20)`, i.e.
    (30 × 10.00 + 100.00 + 10 × 5.00 + 50.00) - 300.00 = 500.00 - 300.00 = 200.00 → 20_000¢. Lago
    bills 30_000¢, 50% more, and the whole 100.00 excess is the re-charged flat amount. April therefore
    costs 60_000¢ in advance for a position that the ARREARS graduated rows bill at 50_000¢ for the
    same 40 closing units — the pay_in_advance axis is worth 10_000¢ here, all of it flat fee.
    Invoice 2, periodic: SimpleAggregationService over the readjusted MAY window
    (fixed_charge_service.rb:236-250) takes the last event's 40 units and tiers them ONCE:
    30 × 10.00 + 100.00 = 400.00, then 40 - 31 + 1 = 10 units × 5.00 + 50.00 = 100.00 → 500.00 →
    50_000¢ at 12.50 per unit, dated 2024-05-01..2024-05-31 beside an APRIL subscription fee. So the
    same 40 units cost 60_000¢ in the month they were acquired and 50_000¢ in the next one, which is
    the clearest statement of the delta-pricing behaviour the block can make.
    Also excluded, on invoice 1: 20_000¢ (`cost(40) - cost(20)`, the incremental price), 50_000¢ (the
    full new quantity re-billed for April, which would double-charge the first twenty units), 10_000¢
    (the delta priced entirely at the marginal tier the account now sits in, 20 × 5.00 with no flat),
    and `invoices: 2` — which is what `apply_units_immediately: false` gives, the event landing at
    2024-05-01T00:00:00Z instead.

- id: b13/graduated/advance/not-prorated/decrease-mid-period
  block: B13
  group: chg-grad
