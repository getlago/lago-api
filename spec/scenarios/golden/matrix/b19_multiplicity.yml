    - {at: "2024-04-01T02:00:00Z", do: refresh_invoice}
  expect:
    invoices: 1
    invoice:
      status: draft
      fees_amount_cents: 35000
      coupons_amount_cents: 0
      credit_notes_amount_cents: 0
      prepaid_credit_amount_cents: 0
      sub_total_excluding_taxes_amount_cents: 35000
      total_amount_cents: 35000
      fees_count: 3
  math: >-
    The same metric priced by two models, rebuilt: 5_000¢ plan + 10_000¢ standard + 20_000¢ package
    (ceil(100/30) = 4 × 50.00) = 35_000¢, the arithmetic derived in b19/charge/unequal/invoice and
    unaffected by the surface because producers run before the finalizing gate
    (calculate_fees_service.rb:42-47 vs :364-379).
    What the regeneration adds is that the rebuild has to re-resolve WHICH charge is which. The two
    charges differ only in `charge_model` and `properties` and share a billable metric, so a
    rebuild that re-read the plan's charges in a different order, or that carried one charge's
    properties onto the other, would still produce two fees over the same 100 units — and 35_000¢ is
    the only total that comes out of pricing them once each with their own model. Both-standard is
    25_000¢, both-package 45_000¢, and either charge lost is 15_000¢ or 25_000¢.
    `fees_count: 3` guards the shape (subscription + two charge fees) and the three finalizing-gated
    reducers are asserted as 0 so the draft cannot pass by having allocated something it should be
    withholding. Per-fee amounts stay unassertable: both charge fees carry the metric's code as
    `item_code` and collide on every `FEE_MATCH_KEYS` field (F67).

- id: b19/fixed_charge/equal/invoice
  block: B19
  axes: {feature: fixed_charge, arrangement: equal, observed_via: invoice}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, charge_model: standard}
  provenance: coverage-gap
  runners: [rspec, live]
  setup:
    add_ons:
      - {code: b19_w1_fcei_a, name: Seat A, amount_cents: 10000}
      - {code: b19_w1_fcei_b, name: Seat B, amount_cents: 10000}
    plan: {code: golden_b19_w1_fcei, interval: monthly, amount_cents: 0}
    fixed_charges:
      - {add_on_code: b19_w1_fcei_a, charge_model: standard, units: 4, properties: {amount: "100"}}
      - {add_on_code: b19_w1_fcei_b, charge_model: standard, units: 4, properties: {amount: "100"}}
    customer: {external_id: golden_b19_w1_fcei_cust, currency: EUR}
    subscription: {external_id: golden_b19_w1_fcei_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_amount_cents: 80000
      sub_total_excluding_taxes_amount_cents: 80000
      total_amount_cents: 80000
      fees_count: 3
      fees:
        - {fee_type: subscription, amount_cents: 0}
        - {fee_type: fixed_charge, item_code: b19_w1_fcei_a, units: 4, amount_cents: 40000}
        - {fee_type: fixed_charge, item_code: b19_w1_fcei_b, units: 4, amount_cents: 40000}
  math: >-
    Two identically configured fixed charges on one plan: 4 units at 100.00 each, twice.
    40_000¢ + 40_000¢ = 80_000¢, with the plan at 0¢ so the fixed charges ARE the invoice and the
    subscription fee is a 0¢ period marker (the convention B13 uses).
    A fixed charge prices an ADD-ON, and each needs its own add-on here — `FixedCharge`'s code is
    defaulted from the add-on's code by `Plans::CreateService#fixed_charge_params_with_code`
    (:150-157), so two charges over one add-on would be a code collision rather than a duplicate.
    Two add-ons at the same price with the same units is the honest reading of `equal` for this
    feature, and it is also what makes the two fees separable: `Fee#item_code` is
    `fixed_charge_add_on.code` for a fixed-charge fee (fee.rb:121), so unlike the two charge fees in
    b19/charge/equal/invoice these two are distinguishable by content and the per-fee split really
    can be asserted.
    `CalculateFeesService#create_fixed_charge_fees` runs as its own producer at :44, independent of
    `create_charges_fees`, and iterates the plan's fixed charges — so the failure this excludes is
    one fixed charge being billed and the other silently dropped: 40_000¢ and `fees_count` 2. The
    add-ons' own `amount_cents` (10_000¢) is deliberately NOT the price: the fixed charge's
    `properties.amount` is, which is why the fees read 40_000¢ rather than 10_000¢ and why this row
    would be unchanged if the add-ons were priced differently.

- id: b19/fixed_charge/unequal/invoice
  block: B19
  axes: {feature: fixed_charge, arrangement: unequal, observed_via: invoice}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, charge_model: standard}
  provenance: coverage-gap
  runners: [rspec, live]
  setup:
    add_ons:
      - {code: b19_w1_fcui_a, name: Seat A, amount_cents: 10000}
      - {code: b19_w1_fcui_b, name: Seat B, amount_cents: 10000}
    plan: {code: golden_b19_w1_fcui, interval: monthly, amount_cents: 0}
    fixed_charges:
      - {add_on_code: b19_w1_fcui_a, charge_model: standard, units: 4, properties: {amount: "100"}}
      - {add_on_code: b19_w1_fcui_b, charge_model: standard, units: 2, properties: {amount: "300"}}
    customer: {external_id: golden_b19_w1_fcui_cust, currency: EUR}
    subscription: {external_id: golden_b19_w1_fcui_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_amount_cents: 100000
      sub_total_excluding_taxes_amount_cents: 100000
      total_amount_cents: 100000
      fees_count: 3
      fees:
        - {fee_type: subscription, amount_cents: 0}
        - {fee_type: fixed_charge, item_code: b19_w1_fcui_a, units: 4, amount_cents: 40000}
        - {fee_type: fixed_charge, item_code: b19_w1_fcui_b, units: 2, amount_cents: 60000}
  math: >-
    Two fixed charges that differ on BOTH axes a fixed charge has — 4 units at 100.00 = 40_000¢ and
    2 units at 300.00 = 60_000¢ — so neither the units nor the unit price of one can be substituted
    for the other's without changing the answer. 100_000¢ in total, on a 0¢ plan.
    The numbers are chosen so that every plausible cross-wiring is a different total: swapping the
    units between the charges gives 20_000 + 120_000 = 140_000¢; applying one charge's price to both
    gives 80_000¢ or 180_000¢; billing either charge alone gives 40_000¢ or 60_000¢. That matters
    because a fixed charge's units live on a `FixedChargeEvent` emitted at creation rather than in
    the charge row that prices them (`FixedCharges::EmitEventsService`), so units and price are read
    from two different places and a duplicate is the case where they can be paired up wrongly.
    Per-fee assertion is available here — `Fee#item_code` is the add-on's code for a fixed-charge fee
    (fee.rb:121) and the two add-ons differ — so the split is asserted rather than just the total,
    which is what makes the cross-wiring counterfactuals above detectable at all rather than only
    the "one charge lost" one.
    Both charges are arrears and not prorated, and the subscription runs a whole calendar month, so
    no proration coefficient enters and the row is not calendar-sensitive.

- id: b19/fixed_charge/equal/preview
  block: B19
  axes: {feature: fixed_charge, arrangement: equal, observed_via: preview}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, charge_model: standard}
  provenance: coverage-gap
  runners: [rspec]
  premium: true
  setup:
