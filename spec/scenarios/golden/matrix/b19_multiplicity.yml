- id: b19/subscription_fee/equal/invoice
  block: B19
  axes: {feature: subscription_fee, arrangement: equal, observed_via: invoice}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, subscriptions: 2}
  provenance: coverage-gap
  runners: [rspec, live]
  setup:
    plan: {code: golden_b19_w1_sfei, interval: monthly, amount_cents: 6000}
    customer: {external_id: golden_b19_w1_sfei_cust, currency: EUR}
    subscription: {external_id: golden_b19_w1_sfei_sub_a, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-01T00:10:00Z"
      do: create_subscription
      params: {external_id: golden_b19_w1_sfei_sub_b}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_amount_cents: 12000
      sub_total_excluding_taxes_amount_cents: 12000
      total_amount_cents: 12000
      fees_count: 2
      fees:
        - {fee_type: subscription, item_code: golden_b19_w1_sfei, amount_cents: 6000}
        - {fee_type: subscription, item_code: golden_b19_w1_sfei, amount_cents: 6000}
  math: >-
    Two subscriptions on the SAME plan for the same customer, landing on ONE invoice with two
    subscription fees: 6_000¢ + 6_000¢ = 12_000¢.
    That they consolidate is the structural claim, and it comes from
    `Subscriptions::OrganizationBillingService#call`, which groups billable subscriptions
    `group_by(&:customer_id)` and then splits only by payment method, currency, billing entity,
    `consolidate_invoice` and purchase order number before handing the whole group to ONE
    `BillSubscriptionJob` (:15-44, :532-560). Both subscriptions here are calendar/monthly/EUR on
    the same billing entity with `consolidate_invoice` at its default, so nothing splits them and
    `invoices: 1` is an assertion in its own right — two invoices of 6_000¢ would be a different
    behaviour with the same total.
    `CalculateFeesService` then loops over the invoice's `invoice_subscriptions`
    (calculate_fees_service.rb:20-47) and calls `create_subscription_fee` once per subscription, so
    the count of fees is the count of subscriptions. A wrong implementation that billed the customer
    once — deduplicating by plan, or keying the fee on the plan rather than the subscription — reads
    6_000¢ and `fees_count` 1.
    The two fee expectations are identical because they must be: `Fee#item_code` for a subscription
    fee is `subscription.plan.code` (fee.rb:123) and both fees share the plan, the period and the
    type, so they collide on every `FEE_MATCH_KEYS` field (F67) and are only assertable while
    interchangeable. The unequal sibling puts them on different plans, which is what makes the split
    nameable there.

- id: b19/subscription_fee/unequal/invoice
  block: B19
  axes: {feature: subscription_fee, arrangement: unequal, observed_via: invoice}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, subscriptions: 2}
  provenance: coverage-gap
  runners: [rspec, live]
  setup:
    plan: {code: golden_b19_w1_sfui_a, interval: monthly, amount_cents: 6000}
    plans:
      - {code: golden_b19_w1_sfui_b, interval: monthly, amount_cents: 15000}
    customer: {external_id: golden_b19_w1_sfui_cust, currency: EUR}
    subscription: {external_id: golden_b19_w1_sfui_sub_a, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-01T00:10:00Z"
      do: create_subscription
      params: {external_id: golden_b19_w1_sfui_sub_b, plan_code: golden_b19_w1_sfui_b}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_amount_cents: 21000
      sub_total_excluding_taxes_amount_cents: 21000
      total_amount_cents: 21000
      fees_count: 2
      fees:
        - {fee_type: subscription, item_code: golden_b19_w1_sfui_a, amount_cents: 6000}
        - {fee_type: subscription, item_code: golden_b19_w1_sfui_b, amount_cents: 15000}
  math: >-
    Two subscriptions on DIFFERENT plans, consolidated onto one invoice: 6_000¢ + 15_000¢ = 21_000¢.
    Different plans is what makes the per-fee split assertable — `Fee#item_code` for a subscription
    fee is `subscription.plan.code` (fee.rb:123), so the two fees differ on a
    `GoldenRunner::FEE_MATCH_KEYS` field and each expectation matches exactly one fee (unlike the
    equal sibling, F67). And the amounts are deliberately far apart, so a fee built against the
    wrong subscription's plan reads 12_000¢ or 30_000¢ rather than the correct 21_000¢.
    They still share one invoice because `Subscriptions::OrganizationBillingService` groups by
    customer and then splits only on payment method, currency, billing entity, `consolidate_invoice`
    and purchase order number (:15-44, :532-560) — the PLAN is not a splitting criterion, only the
    plan's currency is, and both are EUR. Both are calendar/monthly so both are billable on
    1 April. `invoices: 1` therefore asserts the consolidation and `fees_count: 2` asserts that
    consolidation did not collapse the two subscriptions into one line.
    The failure this excludes is the invoice-level one that a same-plan row cannot see: a fee keyed
    on the invoice's first subscription would bill 6_000¢ twice (12_000¢) and look perfectly
    consistent doing it.

- id: b19/subscription_fee/equal/preview
  block: B19
  axes: {feature: subscription_fee, arrangement: equal, observed_via: preview}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, subscriptions: 2}
  provenance: coverage-gap
  runners: [rspec]
  premium: true
  setup:
    organization: {premium_integrations: [preview]}
    plan: {code: golden_b19_w1_sfep, interval: monthly, amount_cents: 6000}
    customer: {external_id: golden_b19_w1_sfep_cust, currency: EUR}
    subscription: {external_id: golden_b19_w1_sfep_sub_a, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-01T00:10:00Z"
      do: create_subscription
      params: {external_id: golden_b19_w1_sfep_sub_b}
    - at: "2024-03-20T10:00:00Z"
      do: preview_invoice
      params:
        subscriptions:
          external_ids: [golden_b19_w1_sfep_sub_a, golden_b19_w1_sfep_sub_b]
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_amount_cents: 12000
      total_amount_cents: 12000
      fees_count: 2
    preview:
      fees_amount_cents: 12000
      sub_total_excluding_taxes_amount_cents: 12000
      total_amount_cents: 12000
      fees_count: 2
  math: >-
    Two subscriptions on one plan, previewed together: 6_000¢ + 6_000¢ = 12_000¢, the same invoice
    b19/subscription_fee/equal/invoice finalizes.
    The preview has to be ASKED for both, which is why the step carries an explicit
    `subscriptions.external_ids` — the runner otherwise previews only the last subscription it
    created, and a one-subscription preview would quote 6_000¢ against a 12_000¢ invoice while
    looking correct in isolation. With both named,
    `Invoices::PreviewService` loops `subscriptions.each { add_subscription_fee ... }`
    (preview_service.rb:43-49) and builds one fee per subscription.
    Two guards have to pass for that to be reachable at all, and they are the reason this cell is
    not simply implied by the invoice: `currencies_aligned?` (:84-93) rejects a mixed-currency set
    and `billing_times_aligned?` (:95-103) rejects subscriptions whose `end_of_period` differ. Both
    subscriptions here are calendar/monthly/EUR started on the same day, so both guards pass; a
    preview that refused the pair would fail the row rather than silently forecasting half of it.
    `fees_count: 2` on both surfaces is what says the two fees stayed two — the totals alone cannot
    distinguish two 6_000¢ fees from one 12_000¢ fee, and `Fee#item_code` is the plan's code for
    both so the per-fee amounts are not separately matchable (F67).

