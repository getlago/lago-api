    - at: "2024-04-03T10:00:00Z"
      do: create_credit_note
      credit_note:
        reason: other
        credit_amount_cents: 6000
        refund_amount_cents: 0
        items: [{fee_type: charge, amount_cents: 6000}]
    - {at: "2024-05-01T01:00:00Z", do: perform_billing}
    - {at: "2024-06-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 3
    invoice:
      - select: {index: 0}
        fees_amount_cents: 20000
        credit_notes_amount_cents: 0
        total_amount_cents: 20000
      - select: {index: 1}
        fees_amount_cents: 5000
        credit_notes_amount_cents: 5000
        total_amount_cents: 0
      - select: {index: 2}
        fees_amount_cents: 5000
        credit_notes_amount_cents: 5000
        total_amount_cents: 0
    credit_note:
      select: {index: -1}
      credit_status: available
      balance_amount_cents: 4000
  math: >-
    14_000¢ of credit notes against a 5_000¢ invoice, so the interesting fact is not that the credit
    is capped — it is that the SECOND note is never looked at, and therefore survives whole.
    March: 5_000¢ plan + 150 units = 20_000¢, and two notes are raised off its charge fee — 8_000¢
    on 2 April, 6_000¢ on 3 April (14_000¢ of a 15_000¢ fee, so both are creditable).
    April (invoice 1): `remaining_invoice_amount` = 5_000¢. The older note's 8_000¢ balance exceeds
    it, so `compute_credit_amount` returns 5_000¢, the balance drops to 3_000¢, and
    `break if remaining_invoice_amount.zero?` (credit_note_service.rb:66) ends the loop — the
    6_000¢ note is not evaluated, not partially consumed, not flipped to consumed.
    May (invoice 2) proves both halves of that at once: the first note returns with exactly its
    3_000¢ remainder and is exhausted, and only then does the second contribute — 2_000¢ of its
    6_000¢, leaving 4_000¢ available. Both invoices settle at 0, so neither of them alone says
    anything; the second note's final balance is the assertion.
