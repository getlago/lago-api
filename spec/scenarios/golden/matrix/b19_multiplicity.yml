    March, finalized out of grace: priority 1 pays the whole 5_000¢ and the low-priority wallet is
    skipped before any transaction is built (`next if remaining_amount <= 0` and
    `next if total_amount_cents <= 0`, allocate_prepaid_credits_by_wallets_service.rb:44, :68),
