# B19 — two of the same feature on one invoice.
#
# B17 asks what happens when different reducers meet. These rows ask what happens when the same one
# appears twice. Two instances either add, or they compete for the same money — and when they compete
# something decides which goes first, and therefore which one survives to the next period. Those
# orderings all exist in the code and none of them was asserted anywhere.
---
- id: b19/coupon/unequal/invoice
  block: B19
  axes: {feature: coupon, arrangement: unequal, observed_via: invoice}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none}
  provenance: coverage-gap
  runners: [rspec, live]
  setup:
    metrics: [{code: b19_uneq_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b19_uneq, interval: monthly, amount_cents: 8000}
    charges: [{billable_metric_code: b19_uneq_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b19_uneq_cust, currency: EUR}
    subscription: {external_id: golden_b19_uneq_sub, billing_time: calendar}
    coupons:
      - name: b19 unlimited coupon
        code: b19_uneq_open
        coupon_type: fixed_amount
        frequency: once
        amount_cents: 5000
        amount_currency: EUR
        expiration: no_expiration
      - name: b19 metric-limited coupon
        code: b19_uneq_limited
        coupon_type: fixed_amount
        frequency: once
        amount_cents: 5000
        amount_currency: EUR
        expiration: no_expiration
        applies_to: {billable_metric_codes: [b19_uneq_sum]}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b19_uneq_sum, properties: {amount: 20}}]
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_amount_cents: 10000
      coupons_amount_cents: 7000
      sub_total_excluding_taxes_amount_cents: 3000
      total_amount_cents: 3000
  math: >-
    Two coupons of the SAME size, 5_000¢ each, and the invoice discounts 7_000¢ rather than 10_000¢ —
    because the order they are applied in decides how much of the limited one can be used at all.
    `Credits::AppliedCouponsService#applied_coupons` sorts metric-limited first, then plan-limited,
    then oldest first (applied_coupons_service.rb:50-53). So the metric-limited coupon goes first even
    though it was declared second, and it may only reduce the fee for its metric: 20 units × 1.00 =
    2_000¢. It contributes 2_000¢ of its 5_000¢ and, because 2_000 < 5_000, is NOT terminated —
    `should_terminate_applied_coupon?` requires `credit_amount >= remaining_amount`
    (applied_coupon_service.rb:78-85).
    The unlimited coupon then takes 5_000¢ of the remaining 8_000¢, leaving 3_000¢ due.
    Reverse the order and the invoice is different: the unlimited coupon would take 5_000¢ of the
    10_000¢ first, spreading pro rata so only 1_000¢ of the 2_000¢ charge fee survives for the limited
    coupon to reduce — 6_000¢ of discount and 4_000¢ due. The plan fee is deliberately four times the
    charge fee so that the limitation binds; with two unlimited coupons the totals commute and the row
    would prove nothing.

- id: b19/coupon/capped/invoice
  block: B19
  axes: {feature: coupon, arrangement: capped, observed_via: invoice}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none}
  provenance: coverage-gap
  runners: [rspec, live]
  setup:
    plan: {code: golden_b19_cap, interval: monthly, amount_cents: 10000}
    customer: {external_id: golden_b19_cap_cust, currency: EUR}
    subscription: {external_id: golden_b19_cap_sub, billing_time: calendar}
    coupons:
      - name: b19 large coupon
        code: b19_cap_large
        coupon_type: fixed_amount
        frequency: once
        amount_cents: 12000
        amount_currency: EUR
        expiration: no_expiration
      - name: b19 small coupon
        code: b19_cap_small
        coupon_type: fixed_amount
        frequency: once
        amount_cents: 4000
        amount_currency: EUR
        expiration: no_expiration
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - {at: "2024-05-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {index: 0}
        fees_amount_cents: 10000
        coupons_amount_cents: 10000
        total_amount_cents: 0
      - select: {index: 1}
        fees_amount_cents: 10000
        coupons_amount_cents: 6000
        total_amount_cents: 4000
  math: >-
    Two coupons worth 16_000¢ against a 10_000¢ invoice. The interesting part is not that the discount
    is capped at 10_000¢ — it is that the second coupon is never looked at, and therefore survives.
    March: the 12_000¢ coupon is older so it goes first and takes the whole 10_000¢. The loop then
    stops — `break unless invoice.sub_total_excluding_taxes_amount_cents&.positive?`
    (applied_coupons_service.rb:28) — so the 4_000¢ coupon is not evaluated, not partially consumed,
    and not terminated. The large one is not terminated either: it gave 10_000¢ of its 12_000¢ and
    keeps 2_000¢.
    April proves both of those claims at once. The large coupon returns with exactly its 2_000¢
    remainder and is terminated on using it; the small coupon then contributes its untouched 4_000¢ —
    6_000¢ of discount and 4_000¢ due.
    Had the second coupon been consumed to its cap in March, April would carry no discount at all and
    read 10_000¢. Had it been partially consumed, April would be somewhere between. The two invoices
    together are what pin it; neither alone can.

- id: b19/coupon/equal/invoice
  block: B19
  axes: {feature: coupon, arrangement: equal, observed_via: invoice}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none}
  provenance: coverage-gap
  runners: [rspec, live]
  setup:
    metrics: [{code: b19_eq_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b19_eq, interval: monthly, amount_cents: 5000}
    charges: [{billable_metric_code: b19_eq_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b19_eq_cust, currency: EUR}
    subscription: {external_id: golden_b19_eq_sub, billing_time: calendar}
    coupons:
      - name: b19 first coupon
        code: b19_eq_one
        coupon_type: fixed_amount
        frequency: once
        amount_cents: 2000
        amount_currency: EUR
        expiration: no_expiration
      - name: b19 second coupon
        code: b19_eq_two
        coupon_type: fixed_amount
        frequency: once
        amount_cents: 2000
        amount_currency: EUR
        expiration: no_expiration
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b19_eq_sum, properties: {amount: 100}}]
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - {at: "2024-05-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {index: 0}
        fees_amount_cents: 15000
        coupons_amount_cents: 4000
        sub_total_excluding_taxes_amount_cents: 11000
        total_amount_cents: 11000
      - select: {index: 1}
        fees_amount_cents: 5000
        coupons_amount_cents: 0
        total_amount_cents: 5000
  math: >-
    The base case the other two arrangements are measured against: two coupons small enough that
    neither constrains the other simply add. 15_000¢ of fees less 2_000¢ less 2_000¢ = 11_000¢.
    The second invoice is what makes this more than arithmetic. Both coupons gave their full amount,
    so both satisfy `credit_amount >= remaining_amount` and both are terminated — April carries no
    discount and bills the bare 5_000¢ subscription fee.
    That is the distinction from b19/coupon/capped/invoice, where the same `once` frequency leaves one
    coupon alive with a remainder and the other untouched entirely. `once` does not mean "one invoice";
    it means "until exhausted", and only asserting a second period tells the two apart.

- id: b19/prepaid_credit/unequal/invoice
  block: B19
  axes: {feature: prepaid_credit, arrangement: unequal, observed_via: invoice}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none}
  provenance: coverage-gap
  runners: [rspec, live]
  setup:
    plan: {code: golden_b19_wal, interval: monthly, amount_cents: 5000}
    customer: {external_id: golden_b19_wal_cust, currency: EUR}
    subscription: {external_id: golden_b19_wal_sub, billing_time: calendar}
    wallets:
      - {name: second, code: b19_wal_second, rate_amount: "1", currency: EUR, granted_credits: "100", priority: 2}
      - {name: first, code: b19_wal_first, rate_amount: "1", currency: EUR, granted_credits: "30", priority: 1}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_amount_cents: 5000
      prepaid_credit_amount_cents: 5000
      total_amount_cents: 0
    wallet:
      code: b19_wal_second
      balance_cents: 8000
  math: >-
    Two wallets holding 13_000¢ between them against a 5_000¢ invoice, so the invoice settles either
    way and the only question is whose credits were spent.
    `Wallet.in_application_order` sorts by ascending priority, not by creation, so the 30-credit wallet
    at priority 1 goes first despite being declared second. It contributes its whole 3_000¢ and the
    priority-2 wallet covers the remaining 2_000¢, ending at 8_000¢.
    That 8_000¢ is the entire assertion. Had priority been ignored and the larger wallet gone first it
    would have paid the whole 5_000¢ and ended at 5_000¢, with the small wallet untouched — same
    invoice, same prepaid_credit_amount_cents, same zero due. Only the balance of the wallet that did
    NOT go first distinguishes the two, which is why the row selects it by code rather than asserting
    the invoice alone.

# ---------------------------------------------------------------------------------------------
# b19_w1 — the remaining cells of the block.
#
# Shared conventions, so every number below is comparable:
#   * monthly / calendar, EUR, no taxes unless the feature under test IS tax
#   * `invoice` rows read a finalized invoice; `preview` rows assert the SAME numbers twice, once
#     on POST /invoices/preview and once on the invoice it forecasts; `regenerated` rows hold a
#     draft open under a grace period and rebuild it with PUT /invoices/:id/refresh
#   * every regenerated row needs `premium: true` (invoice_grace_period is dropped without a
#     licence), every preview row needs `premium: true` AND
#     organization.premium_integrations: [preview], every credit-note row needs `premium: true`
#   * `equal` asks whether BOTH instances take effect at all, so the amounts are chosen so that
#     "one applied" and "both applied" differ loudly; `unequal` and `capped` assert WHICH instance
#     was consumed and which survived, because two instances summing to the same discount look
#     identical on one invoice.
# ---------------------------------------------------------------------------------------------

- id: b19/coupon/equal/preview
  block: B19
  axes: {feature: coupon, arrangement: equal, observed_via: preview}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, coupon_frequency: once}
  provenance: coverage-gap
  runners: [rspec]
  premium: true
  setup:
    organization: {premium_integrations: [preview]}
    metrics: [{code: b19_w1_ceqp_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b19_w1_ceqp, interval: monthly, amount_cents: 5000}
    charges: [{billable_metric_code: b19_w1_ceqp_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b19_w1_ceqp_cust, currency: EUR}
    subscription: {external_id: golden_b19_w1_ceqp_sub, billing_time: calendar}
    coupons:
      - name: b19 w1 ceqp first
        code: b19_w1_ceqp_a
        coupon_type: fixed_amount
        frequency: once
        amount_cents: 2000
        amount_currency: EUR
        expiration: no_expiration
      - name: b19 w1 ceqp second
        code: b19_w1_ceqp_b
        coupon_type: fixed_amount
        frequency: once
        amount_cents: 2000
        amount_currency: EUR
        expiration: no_expiration
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b19_w1_ceqp_sum, timestamp: "2024-03-05T10:00:00Z", properties: {amount: 50}}
        - {code: b19_w1_ceqp_sum, timestamp: "2024-03-05T11:00:00Z", properties: {amount: 30}}
        - {code: b19_w1_ceqp_sum, timestamp: "2024-03-05T12:00:00Z", properties: {amount: 20}}
    - {at: "2024-03-20T10:00:00Z", do: preview_invoice}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_amount_cents: 15000
      coupons_amount_cents: 4000
      sub_total_excluding_taxes_amount_cents: 11000
      total_amount_cents: 11000
    preview:
      fees_amount_cents: 15000
      coupons_amount_cents: 4000
      sub_total_excluding_taxes_amount_cents: 11000
      total_amount_cents: 11000
  math: >-
    The `equal` question — do both instances take effect at all — asked of the surface that
    reimplements the pipeline. 5_000¢ plan + 100 units × 1.00 = 15_000¢ of fees, and two 2_000¢
    coupons neither of which constrains the other.
    Preview walks the same sort as the real invoice (`Invoices::PreviewContextService:98-103` uses
    the identical `limited_billable_metrics DESC, limited_plans DESC, created_at ASC` order as
    `Credits::AppliedCouponsService#applied_coupons`, applied_coupons_service.rb:50-53) and the
    same per-coupon arithmetic (`Coupons::PreviewService` calls the very same
    `AppliedCoupons::AmountService`). Neither coupon is limited, so each takes its base from the
    running `sub_total`: 15_000 → credit 2_000 → 13_000 → credit 2_000 → 11_000. The invoice then
    recomputes `sub_total = fees − coupons` = 15_000 − 4_000 = 11_000
    (preview_service.rb:305-308), which is what makes the two surfaces comparable at all.
    A wrong implementation that applies one applied_coupon and silently ignores the second — the
    plausible failure here, because `Coupons::PreviewService` iterates and `next`s in four places —
    reads 2_000¢ of discount and 13_000¢ due on ONE of the two surfaces, which is exactly the
    divergence this row exists to catch. The three events (50/30/20) are deliberately not one
    event: one event cannot tell sum_agg from max_agg or latest_agg, and this row would then also
    pass with the charge misconfigured.

- id: b19/coupon/unequal/preview
  block: B19
  axes: {feature: coupon, arrangement: unequal, observed_via: preview}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, coupon_frequency: once}
  provenance: coverage-gap
  runners: [rspec]
  premium: true
  characterization: true
  pins: ["F99"]
  setup:
    organization: {premium_integrations: [preview]}
    metrics: [{code: b19_w1_cunp_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b19_w1_cunp, interval: monthly, amount_cents: 8000}
    charges: [{billable_metric_code: b19_w1_cunp_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b19_w1_cunp_cust, currency: EUR}
    subscription: {external_id: golden_b19_w1_cunp_sub, billing_time: calendar}
    coupons:
      - name: b19 w1 cunp unlimited
        code: b19_w1_cunp_open
        coupon_type: fixed_amount
        frequency: once
        amount_cents: 5000
        amount_currency: EUR
        expiration: no_expiration
      - name: b19 w1 cunp metric-limited
        code: b19_w1_cunp_limited
        coupon_type: fixed_amount
        frequency: once
        amount_cents: 5000
        amount_currency: EUR
        expiration: no_expiration
        applies_to: {billable_metric_codes: [b19_w1_cunp_sum]}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b19_w1_cunp_sum, timestamp: "2024-03-05T10:00:00Z", properties: {amount: 10}}
        - {code: b19_w1_cunp_sum, timestamp: "2024-03-05T11:00:00Z", properties: {amount: 6}}
        - {code: b19_w1_cunp_sum, timestamp: "2024-03-05T12:00:00Z", properties: {amount: 4}}
    - {at: "2024-03-20T10:00:00Z", do: preview_invoice}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_amount_cents: 10000
      coupons_amount_cents: 7000
      sub_total_excluding_taxes_amount_cents: 3000
      total_amount_cents: 3000
    preview:
      fees_amount_cents: 10000
      coupons_amount_cents: 5000
      sub_total_excluding_taxes_amount_cents: 5000
      total_amount_cents: 5000
  math: >-
    CHARACTERIZATION — the preview and the invoice it forecasts disagree, and the row records what
    Lago does rather than what it should do. Same configuration as
    b19/coupon/unequal/invoice: 8_000¢ plan + 20 units × 1.00 = 10_000¢ of fees, one unlimited
    5_000¢ coupon and one 5_000¢ coupon limited to the metric.
    THE INVOICE (derived in b19/coupon/unequal/invoice): the metric-limited coupon sorts first
    (applied_coupons_service.rb:50-53), may only reduce its own metric's fee, so it contributes
    2_000¢ of its 5_000¢ and is not terminated; the unlimited coupon then takes 5_000¢ of the
    remaining 8_000¢ → 7_000¢ of discount, 3_000¢ due.
    THE PREVIEW: `Coupons::PreviewService#fees` returns `Fee.none` for any coupon with
    `limited_billable_metrics?`, and the loop then `next`s on `fees.none?`
    (coupons/preview_service.rb:22-27, :78-86) — so the metric-limited coupon is not merely
    mis-based, it is skipped entirely. Only the unlimited coupon runs, taking 5_000¢ of the
    10_000¢ sub_total → 5_000¢ of discount, 5_000¢ due. The preview overstates the invoice by
    2_000¢, i.e. by the whole contribution of the limited instance.
    The `Fee.none` carries `# TODO: update later when charges will be added to the preview`, which
    is stale: `PreviewService#add_charge_fees` (preview_service.rb:173-230) builds charge fees, and
    this row's preview contains the 2_000¢ charge fee the coupon was supposed to reduce.
    Correct behaviour would be 7_000¢ / 3_000¢ on both surfaces; a fix must move BOTH the fee scope
    and the base (`base_amount_cents` uses gross `fees.sum(&:amount_cents)` here where
    applied_coupon_service.rb:96-105 nets out `precise_coupons_amount_cents`).

- id: b19/coupon/capped/preview
  block: B19
  axes: {feature: coupon, arrangement: capped, observed_via: preview}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, coupon_frequency: once}
  provenance: coverage-gap
  runners: [rspec]
  premium: true
  pins: ["F03"]
  setup:
    organization: {premium_integrations: [preview]}
    plan: {code: golden_b19_w1_ccpp, interval: monthly, amount_cents: 10000}
    customer: {external_id: golden_b19_w1_ccpp_cust, currency: EUR}
    subscription: {external_id: golden_b19_w1_ccpp_sub, billing_time: calendar}
    coupons:
      - name: b19 w1 ccpp large
        code: b19_w1_ccpp_large
        coupon_type: fixed_amount
        frequency: once
        amount_cents: 12000
        amount_currency: EUR
        expiration: no_expiration
      - name: b19 w1 ccpp small
        code: b19_w1_ccpp_small
        coupon_type: fixed_amount
        frequency: once
        amount_cents: 4000
        amount_currency: EUR
        expiration: no_expiration
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - {at: "2024-04-20T10:00:00Z", do: preview_invoice}
    - {at: "2024-05-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {index: 0}
        fees_amount_cents: 10000
        coupons_amount_cents: 10000
        total_amount_cents: 0
      - select: {index: 1}
        fees_amount_cents: 10000
        coupons_amount_cents: 6000
        sub_total_excluding_taxes_amount_cents: 4000
        total_amount_cents: 4000
    preview:
      fees_amount_cents: 10000
      coupons_amount_cents: 6000
      sub_total_excluding_taxes_amount_cents: 4000
      total_amount_cents: 4000
  math: >-
    PINS F03. 16_000¢ of `once` coupons against a 10_000¢ invoice, previewed in the period AFTER
    the cap bit — which is the only place the surviving remainder is visible.
    March (invoice 0): the 12_000¢ coupon is older so it goes first and, because
    `AppliedCoupons::AmountService` returns the whole base when `remaining_amount > base`
    (amount_service.rb:34-38), takes all 10_000¢. The loop then stops on
    `break unless sub_total_excluding_taxes_amount_cents&.positive?`
    (applied_coupons_service.rb:28), so the 4_000¢ coupon is never evaluated. Neither is
    terminated: `should_terminate_applied_coupon?` needs `credit_amount >= remaining_amount`
    (applied_coupon_service.rb:78-85) and 10_000 < 12_000.
    That is F03 — a "one-time" coupon larger than the invoice keeps discounting later periods —
    and April is where it is collected: the large coupon returns with exactly its 2_000¢ remainder
    (terminated on using it), the small coupon contributes its untouched 4_000¢, so 6_000¢ of
    discount and 4_000¢ due.
    The preview taken on 20 April must reach the same 6_000¢ from the same two applied_coupons:
    `PreviewContextService` reads `customer.applied_coupons.active`, which still contains both, and
    `Coupons::PreviewService` calls the same `AmountService`, so remaining_amount 2_000 (< the
    10_000¢ base) yields 2_000 and then 4_000 against the 8_000¢ that is left.
    Had March consumed the second coupon to the cap, both surfaces would read 10_000¢ due in April;
    had the remainder been forfeited on termination, they would read 6_000¢ due. Neither the
    invoice nor the preview alone separates those; the pair of periods does.

