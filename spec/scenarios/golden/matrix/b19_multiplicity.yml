    The capped pair, with the surviving remainder held on a draft instead of being spent.
    March, finalized out of its grace period: the older 12_000¢ coupon takes the whole 10_000¢ and
    the loop breaks before the 4_000¢ coupon is looked at (applied_coupons_service.rb:28), so the
    large one keeps 2_000¢ and the small one is untouched — 6_000¢ of live coupon going into April.
    That is the whole point of asserting the draft here: it reads 10_000¢ due while 6_000¢ of
    allocatable coupon exists, because `should_create_coupon_credit?` refuses to run outside the
    finalizing process (calculate_fees_service.rb:368-373). The refresh rebuilds it and must land
    on the same 10_000¢.
    The counterfactuals are all visible in that one number. Had the draft applied the coupons it
    would read 4_000¢ — and would have consumed a `once` coupon that a later refresh could not
    give back, which is precisely what the gate is for. Had March consumed both coupons to the cap
    there would be nothing left to withhold and the distinction would be invisible; the finalized
    invoice above is what rules that out, by showing the discount stopping at 10_000¢ of 16_000¢.
    b19/coupon/capped/preview is the same configuration on the surface that DOES apply the
    remainder, and reads 6_000¢ of discount in April — the two rows bracket the gate.

- id: b19/credit_note/equal/invoice
  block: B19
  axes: {feature: credit_note, arrangement: equal, observed_via: invoice}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    plan: {code: golden_b19_w1_cnei, interval: monthly, amount_cents: 10000}
    customer: {external_id: golden_b19_w1_cnei_cust, currency: EUR}
    subscription: {external_id: golden_b19_w1_cnei_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - at: "2024-04-02T10:00:00Z"
      do: create_credit_note
      credit_note:
        reason: other
        credit_amount_cents: 3500
        refund_amount_cents: 0
        items: [{fee_type: subscription, amount_cents: 3500}]
    - at: "2024-04-03T10:00:00Z"
      do: create_credit_note
      credit_note:
        reason: other
        credit_amount_cents: 3500
        refund_amount_cents: 0
        items: [{fee_type: subscription, amount_cents: 3500}]
    - {at: "2024-05-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {index: 0}
        fees_amount_cents: 10000
        credit_notes_amount_cents: 0
        total_amount_cents: 10000
      - select: {index: 1}
        fees_amount_cents: 10000
        credit_notes_amount_cents: 7000
        sub_total_excluding_taxes_amount_cents: 10000
        total_amount_cents: 3000
    credit_note:
      select: {index: -1}
      credit_status: consumed
      balance_amount_cents: 0
  math: >-
    Two credit notes of the SAME size on one invoice: do both get drawn on, or does the second
    silently go unspent?
    March bills the bare 10_000¢ plan and carries no credit note of its own — the notes are raised
    AGAINST it, and `Credits::CreditNoteService#credit_notes` excludes
    `where.not(invoice_id: invoice.id)` (credit_note_service.rb:70-78), so a note can never reduce
    the invoice it was issued from. Both notes credit 3_500¢ of the 10_000¢ subscription fee, which
    fits: the second is validated against `creditable_amount_cents`, already reduced to 6_500¢ by
    the first.
    April (invoice 1) is where both are consumed. `apply_credits` starts from
    `remaining_invoice_amount = invoice.total_amount_cents` = 10_000¢ and walks the notes oldest
    first: 3_500 then 3_500, neither capped, 7_000¢ of credit and 3_000¢ due. Because both notes
    are fully drawn, `update_remaining_credit` zeroes each balance and flips each to `consumed`
    (credit_note_service.rb:88-96) — which is why the newest note is asserted at balance 0 rather
    than the invoice alone.
    One-applied is the failure this row exists to exclude, and it is loud: 6_500¢ due instead of
    3_000¢, with a note still sitting at 3_500¢ available. The notes are also each smaller than
    the invoice, so no cap is involved and the arrangement really is `equal` — the capped variant is
    b19/credit_note/capped/invoice.

- id: b19/credit_note/unequal/invoice
  block: B19
  axes: {feature: credit_note, arrangement: unequal, observed_via: invoice}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    metrics: [{code: b19_w1_cnui_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b19_w1_cnui, interval: monthly, amount_cents: 5000}
    charges: [{billable_metric_code: b19_w1_cnui_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b19_w1_cnui_cust, currency: EUR}
    subscription: {external_id: golden_b19_w1_cnui_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b19_w1_cnui_sum, timestamp: "2024-03-05T10:00:00Z", properties: {amount: 70}}
        - {code: b19_w1_cnui_sum, timestamp: "2024-03-05T11:00:00Z", properties: {amount: 50}}
        - {code: b19_w1_cnui_sum, timestamp: "2024-03-05T12:00:00Z", properties: {amount: 30}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - at: "2024-04-02T10:00:00Z"
      do: create_credit_note
      credit_note:
        reason: other
        credit_amount_cents: 4000
        refund_amount_cents: 0
        items: [{fee_type: subscription, amount_cents: 4000}]
    - at: "2024-04-03T10:00:00Z"
      do: create_credit_note
      credit_note:
        reason: other
        credit_amount_cents: 11000
        refund_amount_cents: 0
        items: [{fee_type: charge, amount_cents: 11000}]
    - {at: "2024-05-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {index: 0}
        fees_amount_cents: 20000
        credit_notes_amount_cents: 0
        total_amount_cents: 20000
      - select: {index: 1}
        fees_amount_cents: 5000
        credit_notes_amount_cents: 5000
        total_amount_cents: 0
    credit_note:
      select: {index: -1}
      credit_status: available
      balance_amount_cents: 10000
  math: >-
    Two notes of DIFFERENT sizes drawn on the same invoice, sized so the invoice runs out inside the
    second one — which is the only arrangement in which the consumption order of credit notes is
    observable at all.
    March: 5_000¢ plan + 150 units × 1.00 = 20_000¢. Two notes are raised against it: 4_000¢ off
    the subscription fee (2 April) and 11_000¢ off the charge fee (3 April). April has no usage, so
    invoice 1 is the bare 5_000¢ plan.
    `apply_credits` walks `order(created_at: :asc)` (credit_note_service.rb:70-78) with
    `remaining_invoice_amount` = 5_000¢. The OLDER note is consumed whole (4_000¢, remaining 1_000¢)
    and the newer one is then capped by `compute_credit_amount` at that 1_000¢
    (credit_note_service.rb:80-86), leaving it 10_000¢ of its 11_000¢ and still `available`.
    5_000¢ of credit, nothing due.
    The invoice cannot tell the two orders apart — either way 5_000¢ of credit clears a 5_000¢
    invoice — so the ONLY load-bearing assertion is the surviving balance. Newest-first would have
    spent 5_000¢ of the big note (balance 6_000¢) and left the 4_000¢ note untouched; pro-rata
    sharing would leave 7_333¢. 10_000¢ is oldest-first, and nothing else.

- id: b19/credit_note/capped/invoice
  block: B19
  axes: {feature: credit_note, arrangement: capped, observed_via: invoice}
