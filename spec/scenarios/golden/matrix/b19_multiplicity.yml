      fees_amount_cents: 21000
      total_amount_cents: 21000
      fees_count: 2
    preview:
      fees_amount_cents: 21000
      sub_total_excluding_taxes_amount_cents: 21000
      total_amount_cents: 21000
      fees_count: 2
      fees:
        - {fee_type: subscription, item_code: golden_b19_w1_sfup_a, amount_cents: 6000}
