      fees_amount_cents: 5000
      prepaid_credit_amount_cents: 5000
      total_amount_cents: 0
    preview:
      fees_amount_cents: 5000
      prepaid_credit_amount_cents: 5000
      total_amount_cents: 0
  math: >-
    Two 3_000¢ wallets and a 5_000¢ invoice, forecast before either is spent. The arithmetic is the
    one derived in b19/prepaid_credit/equal/invoice: the first wallet is bounded by its balance, the
    second by the remaining invoice, 5_000¢ of prepaid credit and nothing due.
    The preview is not a reimplementation here — `PreviewService#create_applied_prepaid_credits`
    calls the very same `Credits::AllocatePrepaidCreditsByWalletsService`
    (preview_service.rb:368-377) — but it feeds it an UNSAVED invoice, so the service takes the
    `invoice.persisted? ? invoice.fees.includes(:charge) : invoice.fees` branch
    (allocate_prepaid_credits_by_wallets_service.rb:73) and reads `sub_total_excluding_taxes` and
    `taxes_precise_amount_cents` off in-memory fees. That is the divergence risk this cell exists
    to close: same allocator, different input, and a preview that quoted 3_000¢ of credit against
    an invoice that applies 5_000¢ would be a forecast the customer could not reconcile.
    No wallet is spent by the preview — it returns the transactions rather than creating them — so
    the subsequent real billing starts from full balances and lands on the same numbers. And no
    `expect.wallet`, for the same reason as the invoice sibling: at equal priority and identical
    creation instants the tie-break in `order(:priority, :created_at)` is undetermined, so which
    wallet keeps the last 1_000¢ is not a fact this row may assert.

