    Because the plans differ, `Fee#item_code` differs (fee.rb:123) and the rebuild's PAIRING is
    assertable, not just its total. `CalculateFeesService` walks the invoice's
    `invoice_subscriptions` and builds a subscription fee from each one's own subscription and
    boundaries (:20-47), so a refresh that re-resolved both fees from the same invoice_subscription
    would read 12_000¢ or 30_000¢, and one that kept the fees rather than replacing them would read
    42_000¢ with `fees_count` 4. 6_000¢ against plan A and 15_000¢ against plan B is the only
    correct rebuild, and the amounts are far enough apart that no swap lands on 21_000¢.
    `invoices: 1` still asserts the consolidation itself, which the grace period does not change:
    `Subscriptions::OrganizationBillingService` groups by customer and never splits on plan
