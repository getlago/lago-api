- id: b19/add_on/equal/invoice
  block: B19
  axes: {feature: add_on, arrangement: equal, observed_via: invoice}
  dimensions: {tax_rate: 20, invoice_type: one_off}
  provenance: coverage-gap
  runners: [rspec, live]
  setup:
    taxes:
      - {code: b19_hns_aoei_vat, name: VAT, rate: 20}
    add_ons:
      - {code: b19_hns_aoei_a, name: Onboarding A, amount_cents: 5000}
      - {code: b19_hns_aoei_b, name: Onboarding B, amount_cents: 5000}
    customer: {external_id: golden_b19_hns_aoei_cust, currency: EUR}
  timeline:
    - at: "2024-03-01T00:00:00Z"
      do: create_one_off_invoice
      one_off: {add_ons: [b19_hns_aoei_a, b19_hns_aoei_b]}
  expect:
    invoices: 1
    invoice:
      invoice_type: one_off
      status: finalized
      fees_amount_cents: 10000
      sub_total_excluding_taxes_amount_cents: 10000
      taxes_amount_cents: 2000
      total_amount_cents: 12000
      fees_count: 2
      fees:
        - {fee_type: add_on, item_code: b19_hns_aoei_a, amount_cents: 5000, units: 1, taxes_amount_cents: 1000}
        - {fee_type: add_on, item_code: b19_hns_aoei_b, amount_cents: 5000, units: 1, taxes_amount_cents: 1000}
  math: >-
    Two add-on fees on one invoice: do both take effect, and do their amounts add?
    They do, and the mechanism is a loop over the payload rather than a lookup keyed by add-on.
    `Fees::OneOffService#call` iterates `fees.each` and builds one `Fee.new(..., fee_type: :add_on,
    invoiceable: add_on)` per ENTRY (one_off_service.rb:19-68), with nothing de-duplicating by add-on
    and no upsert; `Invoices::CreateOneOffService` then sums them wholesale —
    `invoice.fees_amount_cents = invoice.fees.sum(:amount_cents)` and
    `sub_total_excluding_taxes_amount_cents = fees_amount_cents` (create_one_off_service.rb:51-52).
    Each fee's `amount_cents` is `(unit_amount_cents * units).round` (:37) where `unit_amount_cents`
    comes from the payload, and ScenariosHelper#create_one_off_invoice sends each add-on's own
    `amount_cents` — 5_000¢ x 1 unit, twice, so 10_000¢ of fees.
    Neither add-on carries taxes of its own and the call sends no `tax_codes`, so
    `Fees::ApplyTaxesService#applicable_taxes` falls past the explicit-codes rung and past
    `return fee.add_on.taxes if fee.add_on? && fee.add_on.taxes.any?` (apply_taxes_service.rb:64-66)
    to the billing-entity default at :81-82, which is where `applied_to_organization: true` put the
    single 20% VAT. 20% of 5_000¢ is 1_000¢ per fee, 2_000¢ in total, 12_000¢ due.
    The failure this row is sized to catch is a one-fee-per-add-on-type collapse — a
    `find_or_initialize_by` or an upsert keyed on `invoiceable`, which reads as a reasonable thing to
    write and would produce `fees_count` 1, 5_000¢ of fees, 1_000¢ of tax and 6_000¢ due on an
    invoice that still looks internally consistent. Asserting `fees_count` AND both fees by
    `item_code` is what separates "two fees" from "one fee that happens to total right", which the
    invoice totals alone cannot.
    b19/add_on/unequal/invoice is the companion: there the two add-ons carry DIFFERENT add-on-level
    taxes, which proves the ladder is walked per fee rather than once per invoice.

- id: b19/add_on/unequal/invoice
  block: B19
  axes: {feature: add_on, arrangement: unequal, observed_via: invoice}
  dimensions: {tax_rate: 20, invoice_type: one_off}
  provenance: coverage-gap
  runners: [rspec, live]
  setup:
    taxes:
      - {code: b19_hns_aoui_hi, name: High VAT, rate: 20, applied_to_organization: false}
      - {code: b19_hns_aoui_lo, name: Low VAT, rate: 5, applied_to_organization: false}
    add_ons:
      - {code: b19_hns_aoui_a, name: Onboarding A, amount_cents: 8000, tax_codes: [b19_hns_aoui_hi]}
      - {code: b19_hns_aoui_b, name: Onboarding B, amount_cents: 2000, tax_codes: [b19_hns_aoui_lo]}
    customer: {external_id: golden_b19_hns_aoui_cust, currency: EUR}
  timeline:
    - at: "2024-03-01T00:00:00Z"
      do: create_one_off_invoice
      one_off: {add_ons: [b19_hns_aoui_a, b19_hns_aoui_b]}
  expect:
    invoices: 1
    invoice:
      invoice_type: one_off
      status: finalized
      coupons_amount_cents: 0
      fees_amount_cents: 10000
      sub_total_excluding_taxes_amount_cents: 10000
      taxes_amount_cents: 1700
      total_amount_cents: 11700
      fees_count: 2
      fees:
        - {fee_type: add_on, item_code: b19_hns_aoui_a, amount_cents: 8000, units: 1, taxes_amount_cents: 1600, taxes_rate: 20.0}
        - {fee_type: add_on, item_code: b19_hns_aoui_b, amount_cents: 2000, units: 1, taxes_amount_cents: 100, taxes_rate: 5.0}
  math: >-
    Two add-on fees that must be taxed DIFFERENTLY on the same invoice, which is the add-on feature's
    version of "two instances that differ in a way the order exposes": the tax ladder is not walked
    once per invoice, it is walked once per fee.
    `Fees::ApplyTaxesService` is constructed with `fee:` and resolves `applicable_taxes` from that
    fee alone; the add-on rung is `return fee.add_on.taxes if fee.add_on? && fee.add_on.taxes.any?`
    (apply_taxes_service.rb:64-66), reached because `Fees::OneOffService` sends no `tax_codes` and so
    the explicit-codes rung above it does not fire. `Invoices::ComputeTaxesAndTotalsService` calls it
    per fee, and the invoice's `taxes_amount_cents` is the SUM of what each fee resolved, never a
    single rate applied to the sub-total.
    8_000¢ at its own 20% = 1_600¢; 2_000¢ at its own 5% = 100¢; 1_700¢ of tax on 10_000¢ of fees,
    11_700¢ due. Both taxes are created `applied_to_organization: false` and the customer carries
    none, so the billing-entity fallback at :81-82 cannot smuggle either of them onto the other fee.
    Four counterfactuals, all separated by these amounts. First-fee-wins (the ladder resolved once
    and reused): 20% on 10_000¢ = 2_000¢, 12_000¢. Last-fee-wins: 5% → 500¢, 10_500¢. Both taxes on
    both fees (a resolution that unions rather than selects, i.e. the additive answer): 25% on
    10_000¢ = 2_500¢, 12_500¢, and each fee's `taxes_rate` would read 25.0. A blended average rate
    applied to the sub-total: 12.5% → 1_250¢. The amounts are deliberately 8_000/2_000 rather than
    two equal ones, because with equal amounts first-wins, last-wins and blended all land on
    1_250¢ and the row would prove nothing.
    Asserting each fee's own `taxes_rate` as well as its `taxes_amount_cents` is what pins the
    per-fee resolution itself rather than an invoice total that several wrong implementations share.
    b19/add_on/equal/invoice is the control: with no add-on-level taxes anywhere, both fees fall to
    the same billing-entity default and the rates really are identical.
