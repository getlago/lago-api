  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - {at: "2024-04-01T02:00:00Z", do: refresh_invoice}
  expect:
    invoices: 1
    invoice:
      status: draft
      fees_amount_cents: 10000
      coupons_amount_cents: 0
      credit_notes_amount_cents: 0
      prepaid_credit_amount_cents: 0
      sub_total_excluding_taxes_amount_cents: 10000
      taxes_amount_cents: 2000
      total_amount_cents: 12000
      fees_count: 1
      fees:
        - {fee_type: subscription, amount_cents: 10000, taxes_amount_cents: 2000, taxes_rate: 20.0}
  math: >-
    Precedence, re-resolved from scratch. The plan's 20% wins over the customer's 5% because
    `applicable_taxes` returns at the plan level and never reads the customer's
    (apply_taxes_service.rb:77-80), so the draft reads 2_000¢ of tax and 12_000¢ due.
    This is the cell where a refresh is genuinely at risk rather than merely re-derived, because the
    refresh path is the one thing that RE-RUNS the precedence chain against whatever the records say
    now. `Customers::ApplyTaxesService` and `Taxes::UpdateService`/`DestroyService` are among the
    services that flag drafts `ready_to_be_refreshed` precisely so that a tax change is picked up,
    and `Invoices::RefreshDraftService` destroys the fees and rebuilds them — new `Fee` records with
    empty `applied_taxes`, so the chain is walked again from the top rather than reusing the
    resolution the original build made.
    A rebuild that lost the plan level would fall through to the customer's 5% and read 500¢ /
    10_500¢; one that merged both levels would read 2_500¢ / 12_500¢ with `taxes_rate` 25.0. The
    fee's `taxes_rate` is asserted alongside the amount because the amounts alone cannot separate
    "one tax at 20%" from any other combination summing to 20.
    b19/tax/unequal/preview forecasts the same 2_000¢ and b19/tax/unequal/invoice finalizes it, so
    the three surfaces of this cell are pinned to one number.

- id: b19/charge/equal/invoice
  block: B19
  axes: {feature: charge, arrangement: equal, observed_via: invoice}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, charge_model: standard}
  provenance: coverage-gap
  runners: [rspec, live]
  setup:
    metrics: [{code: b19_w1_chei_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b19_w1_chei, interval: monthly, amount_cents: 5000}
    charges:
      - {billable_metric_code: b19_w1_chei_sum, charge_model: standard, properties: {amount: "1"}}
      - {billable_metric_code: b19_w1_chei_sum, charge_model: standard, properties: {amount: "1"}}
    customer: {external_id: golden_b19_w1_chei_cust, currency: EUR}
    subscription: {external_id: golden_b19_w1_chei_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b19_w1_chei_sum, timestamp: "2024-03-05T10:00:00Z", properties: {amount: 50}}
        - {code: b19_w1_chei_sum, timestamp: "2024-03-05T11:00:00Z", properties: {amount: 30}}
        - {code: b19_w1_chei_sum, timestamp: "2024-03-05T12:00:00Z", properties: {amount: 20}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_amount_cents: 25000
      sub_total_excluding_taxes_amount_cents: 25000
      total_amount_cents: 25000
      fees_count: 3
      fees:
        - {fee_type: subscription, amount_cents: 5000}
        - {fee_type: charge, item_code: b19_w1_chei_sum, units: 100, amount_cents: 10000}
        - {fee_type: charge, item_code: b19_w1_chei_sum, units: 100, amount_cents: 10000}
  math: >-
    TWO charges on ONE billable metric, priced identically: the same 100 units are aggregated twice
    and billed twice. 5_000¢ plan + 10_000¢ + 10_000¢ = 25_000¢.
    That this is even expressible is the first half of the row. `Charge#validate_code_unique`
    (charge.rb:182-188) makes a charge's CODE unique within a plan, not its billable metric, and
    `Plans::CreateService#charge_params_with_code` (:143-148) fills the code in from
    `Charges::GenerateCodeService`, which auto-suffixes on collision — the second charge is created
    as `b19_w1_chei_sum_2`. `Plans::ChargeablesValidationService` only checks that the metrics
    exist. Nothing anywhere de-duplicates by metric.
    The second half is that both are then billed. `CalculateFeesService#create_charges_fees`
    iterates `subscription.plan.charges.where(invoiceable: true)` and calls `Fees::ChargeService`
    per charge (calculate_fees_service.rb:117-147), each with its own aggregation and its own
    `ChargeCacheMiddleware` key — so the units are not shared or netted, they are re-aggregated. Two
    fees of 100 units at 1.00.
    A wrong implementation that de-duplicated by billable metric, or that let the second charge's
    cache entry collide with the first's, reads 15_000¢ — the loud difference this row is sized for.
    The two charge-fee expectations are deliberately IDENTICAL: `Fee#item_code` is the billable
    metric's code for a charge fee (fee.rb:117-118), so the two fees share every one of
    `GoldenRunner::FEE_MATCH_KEYS` and could not be told apart if their amounts differed (F67). Equal
    amounts make the match unambiguous, which is another reason this arrangement is the one that gets
    a per-fee assertion.

- id: b19/charge/unequal/invoice
  block: B19
  axes: {feature: charge, arrangement: unequal, observed_via: invoice}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, charge_model: package}
  provenance: coverage-gap
  runners: [rspec, live]
  setup:
    metrics: [{code: b19_w1_chui_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b19_w1_chui, interval: monthly, amount_cents: 5000}
    charges:
      - {billable_metric_code: b19_w1_chui_sum, charge_model: standard, properties: {amount: "1"}}
      - billable_metric_code: b19_w1_chui_sum
        charge_model: package
        properties: {amount: "50", free_units: 0, package_size: 30}
    customer: {external_id: golden_b19_w1_chui_cust, currency: EUR}
    subscription: {external_id: golden_b19_w1_chui_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b19_w1_chui_sum, timestamp: "2024-03-05T10:00:00Z", properties: {amount: 50}}
        - {code: b19_w1_chui_sum, timestamp: "2024-03-05T11:00:00Z", properties: {amount: 30}}
        - {code: b19_w1_chui_sum, timestamp: "2024-03-05T12:00:00Z", properties: {amount: 20}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_amount_cents: 35000
      sub_total_excluding_taxes_amount_cents: 35000
      total_amount_cents: 35000
      fees_count: 3
  math: >-
    Two charges on ONE metric with DIFFERENT models, so the same 100 units are priced twice by two
    different formulas and the invoice carries both answers.
    Standard leg: 100 × 1.00 = 10_000¢. Package leg:
    `paid_units = 100 − free_units(0)`, `package_count = 100.fdiv(30).ceil = 4`, and
    `4 × per_package_unit_amount(50) = 200.00` → 20_000¢ (package_service.rb:7-13, :60-70; the same
    "amount is per PACKAGE, rounded up" convention b03/package/sum_agg pins).
    Plus the 5_000¢ plan: 35_000¢.
    The point of mixing the models is that the two legs cannot be confused for one another, and
    neither can be confused for a doubled copy of the other: 10_000 + 20_000 is distinguishable from
    two standard legs (20_000), two package legs (40_000), and a single surviving charge of either
    kind (15_000 or 25_000). Each aggregation is run independently —
    `CalculateFeesService#create_charges_fees` calls `Fees::ChargeService` per charge with its own
    `Subscriptions::ChargeCacheMiddleware` key (calculate_fees_service.rb:133-146) — so a cache
    keyed on the metric rather than the charge would show up here as the same amount twice.
    NO per-fee assertion, deliberately. `Fee#item_code` is the billable metric's code for both fees
    (fee.rb:117-118) and the two share `fee_type`, `item_type`, `from_date` and `to_date` as well, so
    every key in `GoldenRunner::FEE_MATCH_KEYS` collides and `assert_golden_fees` would match the
    10_000¢ expectation against whichever fee `has_many :fees` returned first — a coin flip, not an
    assertion (F67). `fees_count` plus the invoice total is what is honestly assertable here; the
    equal sibling above can assert the split only because its two fees are interchangeable.

- id: b19/charge/equal/preview
  block: B19
  axes: {feature: charge, arrangement: equal, observed_via: preview}
  dimensions: {interval: monthly, billing_time: calendar, taxes: charge-level, tax_rate: 20, charge_model: standard}
  provenance: coverage-gap
  runners: [rspec]
  premium: true
  characterization: true
  pins: ["F72", "F73"]
  setup:
    organization: {premium_integrations: [preview]}
    taxes: [{code: b19_w1_chep_vat, name: VAT, rate: 20, applied_to_organization: false}]
    metrics: [{code: b19_w1_chep_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b19_w1_chep, interval: monthly, amount_cents: 5000}
    charges:
      - billable_metric_code: b19_w1_chep_sum
        charge_model: standard
        properties: {amount: "1"}
        tax_codes: [b19_w1_chep_vat]
      - billable_metric_code: b19_w1_chep_sum
        charge_model: standard
        properties: {amount: "1"}
        tax_codes: [b19_w1_chep_vat]
    customer: {external_id: golden_b19_w1_chep_cust, currency: EUR}
    subscription: {external_id: golden_b19_w1_chep_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b19_w1_chep_sum, timestamp: "2024-03-05T10:00:00Z", properties: {amount: 50}}
        - {code: b19_w1_chep_sum, timestamp: "2024-03-05T11:00:00Z", properties: {amount: 30}}
        - {code: b19_w1_chep_sum, timestamp: "2024-03-05T12:00:00Z", properties: {amount: 20}}
    - {at: "2024-03-20T10:00:00Z", do: preview_invoice}
  expect:
    preview:
      fees_amount_cents: 25000
      sub_total_excluding_taxes_amount_cents: 25000
      taxes_amount_cents: 0
      sub_total_including_taxes_amount_cents: 25000
      total_amount_cents: 25000
      fees_count: 3
  math: >-
    Two identically priced charges on one metric, forecast: 5_000¢ plan + 100 units × 1.00, twice =
    25_000¢ of fees (the arithmetic derived and finalized in b19/charge/equal/invoice). Tax is 20% on
    the two CHARGE fees only — 2_000¢ + 2_000¢ = 4_000¢ — because it is attached to the charges
    rather than to the plan or the organization, so the subscription fee falls through
    `applicable_taxes` to a billing entity with no default tax and is untaxed. 29_000¢ forecast.
    `fees_count: 3` is load-bearing: it distinguishes two charge fees from one at twice the price,
    which the totals cannot. Per-fee amounts are unassertable because both charge fees carry the
    metric's code as `item_code` (fee.rb:117-118, F67).
    THE SHAPE OF THIS ROW IS DICTATED BY TWO DEFECTS, both verified in the container against the real
    service, and both invisible to every existing preview row because b17's whole preview column has
    exactly ONE charge per plan.
    F72: with two or more charges and no charge-level tax, `POST /invoices/preview` raises
    NoMethodError. The preview's charge fees come back with a nil `subscription` once
    `add_charge_fees` returns more than one fee, so `Fees::ApplyTaxesService`'s `plan` falls back to
    `fee.subscription&.plan` = nil and `plan.taxes.any?` (apply_taxes_service.rb:71) blows up. The
    `tax_codes` on the charges are therefore not decoration — they make the chain return one line
    earlier, at `fee.charge.taxes` (:68), before `plan` is read at all.
    F73: the same two-charge path leaves the caller on a different database connection —
    `add_charge_fees` wraps each charge in `ActiveRecord::Base.connection_pool.with_connection` inside
    `Parallel.flat_map` (preview_service.rb:203-229), and after the second block every query in the
    example reads an empty database (ApiKey, Organization and Plan all count 0). Three consequences,
    all measured. NOTHING can follow `preview_invoice` here: no `perform_billing` and no
    `expect.invoice`, because the invoice read is an HTTP call needing the organization's API key —
    so the preview is asserted alone and its agreement with the real invoice is carried by
    b19/charge/equal/invoice, which bills the same fees over the same period. The invoice-level tax
    reads 0 even though both charge fees carry 2_000¢ each, which is why `taxes_amount_cents: 0` is
    asserted and why this row is CHARACTERIZATION: 29_000¢ is the correct forecast and 25_000¢ is
    what Lago returns. And a SECOND multi-charge preview in the same RSpec process comes out wrong
    (a 35_000¢ plan previewed 25_000¢), which is why b19/charge/unequal/preview does not exist —
    that cell is blocked on F73, not on a derivation. Unrelated later examples are unaffected;
    verified both ways in the container.

- id: b19/charge/equal/regenerated
  block: B19
  axes: {feature: charge, arrangement: equal, observed_via: regenerated}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, charge_model: standard, grace_period: 5}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    metrics: [{code: b19_w1_cher_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b19_w1_cher, interval: monthly, amount_cents: 5000}
    charges:
      - {billable_metric_code: b19_w1_cher_sum, charge_model: standard, properties: {amount: "1"}}
      - {billable_metric_code: b19_w1_cher_sum, charge_model: standard, properties: {amount: "1"}}
    customer: {external_id: golden_b19_w1_cher_cust, currency: EUR, invoice_grace_period: 5}
    subscription: {external_id: golden_b19_w1_cher_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b19_w1_cher_sum, timestamp: "2024-03-05T10:00:00Z", properties: {amount: 50}}
        - {code: b19_w1_cher_sum, timestamp: "2024-03-05T11:00:00Z", properties: {amount: 30}}
        - {code: b19_w1_cher_sum, timestamp: "2024-03-05T12:00:00Z", properties: {amount: 20}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - {at: "2024-04-01T02:00:00Z", do: refresh_invoice}
  expect:
    invoices: 1
    invoice:
      status: draft
      fees_amount_cents: 25000
      coupons_amount_cents: 0
      credit_notes_amount_cents: 0
      prepaid_credit_amount_cents: 0
      sub_total_excluding_taxes_amount_cents: 25000
      total_amount_cents: 25000
      fees_count: 3
      fees:
        - {fee_type: subscription, amount_cents: 5000}
        - {fee_type: charge, item_code: b19_w1_cher_sum, units: 100, amount_cents: 10000}
        - {fee_type: charge, item_code: b19_w1_cher_sum, units: 100, amount_cents: 10000}
  math: >-
    Two identical charges on one metric, rebuilt. Producers are not gated on finalization — only
    coupons, credit notes and prepaid credit are (calculate_fees_service.rb:364-379) — so the draft
    carries the full 25_000¢ that b19/charge/equal/invoice finalizes: 5_000¢ plan + 100 units × 1.00,
    twice.
    A refresh is a destroy-and-rebuild, and that is precisely why duplicate charges are worth
    asserting on this surface. `Invoices::RefreshDraftService` drops the draft's fees and re-runs
    `CalculateFeesService`, so the second charge has to be re-discovered from
    `subscription.plan.charges` and re-aggregated with its own cache key. Two failure modes are
    excluded by the numbers below: a rebuild that emitted one charge fee (15_000¢, `fees_count` 2)
    and a rebuild that ADDED to the existing fees instead of replacing them (45_000¢, `fees_count`
    5) — the second being a real hazard, because the two charge fees are indistinguishable by
    content and a duplicate would not look out of place.
    `fees_count: 3` is what turns that into an assertion. The two charge-fee expectations are
    identical, which is what makes them matchable at all given that both fees carry the metric's
    code as `item_code` (fee.rb:117-118, F67). The three withheld reducers are asserted as 0 so a
    draft that quietly allocated one cannot pass.

- id: b19/charge/unequal/regenerated
  block: B19
  axes: {feature: charge, arrangement: unequal, observed_via: regenerated}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, charge_model: package, grace_period: 5}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
