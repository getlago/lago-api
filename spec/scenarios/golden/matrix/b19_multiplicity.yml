    honoured or ignored — and the ordering claim can only be made against the real wallet after the
    real billing. Hence the `expect.wallet` on the priority-2 wallet: 8_000¢ if priority decided the
    order, 5_000¢ if the larger wallet had gone first and paid the whole invoice.
    Recording that blind spot is part of the cell's value: a preview cannot be used to check wallet
    ordering, and a row that asserted only the preview would look like it covered this and cover
    nothing.

