- id: b19/credit_note/equal/regenerated
  block: B19
  axes: {feature: credit_note, arrangement: equal, observed_via: regenerated}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, grace_period: 5}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    plan: {code: golden_b19_w1_cner, interval: monthly, amount_cents: 10000}
    customer: {external_id: golden_b19_w1_cner_cust, currency: EUR, invoice_grace_period: 5}
    subscription: {external_id: golden_b19_w1_cner_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - {at: "2024-04-02T10:00:00Z", do: finalize_invoice}
    - at: "2024-04-03T10:00:00Z"
      do: create_credit_note
      credit_note:
        reason: other
        credit_amount_cents: 3500
        refund_amount_cents: 0
        items: [{fee_type: subscription, amount_cents: 3500}]
    - at: "2024-04-04T10:00:00Z"
      do: create_credit_note
      credit_note:
        reason: other
        credit_amount_cents: 3500
        refund_amount_cents: 0
        items: [{fee_type: subscription, amount_cents: 3500}]
    - {at: "2024-05-01T01:00:00Z", do: perform_billing}
    - {at: "2024-05-01T02:00:00Z", do: refresh_invoice}
  expect:
    invoices: 2
    invoice:
      - select: {index: 0}
        status: finalized
        fees_amount_cents: 10000
        total_amount_cents: 10000
      - select: {index: 1}
        status: draft
        fees_amount_cents: 10000
        coupons_amount_cents: 0
        credit_notes_amount_cents: 0
        prepaid_credit_amount_cents: 0
        total_amount_cents: 10000
    credit_note:
      select: {index: -1}
      credit_status: available
      balance_amount_cents: 3500
  math: >-
    Two equal notes, and a draft that must not touch either of them.
    March is finalized by hand out of its 5-day grace period at the bare 10_000¢ plan; the two
    3_500¢ notes are then raised against it. April's invoice is generated as a DRAFT and rebuilt by
    `PUT /invoices/:id/refresh`, and it reads 10_000¢ of fees with 0¢ of credit note —
    `should_create_credit_note_credit?` is `!not_in_finalizing_process?`
    (calculate_fees_service.rb:364-366), so a draft carries no credit note at all. Asserting that
    0 rather than omitting it is the point: an omitted field would let a draft that HAD consumed
    the notes pass.
    The other half of the assertion is the notes themselves. Both are still `available` with their
    full 3_500¢ after the refresh, because nothing was allocated and so nothing had to be given
    back. A draft that allocated them would show 3_000¢ due, a consumed note at balance 0, and a
    refresh would then have to un-consume it — which is exactly the state the gate exists to
    prevent.
    Finalized, the same period reads 3_000¢ (derived in b19/credit_note/equal/invoice), so the
    draft is 7_000¢ higher than what the customer will owe. That is expected behaviour, not a
    defect, and this row is what stops it from being "fixed" by accident.

