    b19/tax/equal/invoice: the rates add to 20%, so 10_000¢ of fee carries 2_000¢ of tax.
    The preview must reach it through `PreviewService#apply_taxes`, which calls the same
    `Fees::ApplyTaxesService` per fee and then `Invoices::ApplyTaxesService` on the invoice
    (preview_service.rb:379-388) — so the per-tax loop and the `applied_taxes_rate +=` accumulation
    are shared, and what is NOT shared is the surrounding total arithmetic:
    `sub_total_including_taxes = sub_total_excluding_taxes + taxes` and
    `total = sub_total_including_taxes − credit_notes` are recomputed inline at
    preview_service.rb:310-316 rather than by `Invoices::ComputeTaxesAndTotalsService`.
    That is why all four totals are asserted on the preview and not just the tax: the risk is not
    that the two taxes fail to add on this surface but that the second one adds into the fee and
    then fails to reach the invoice header, which shows up as a 12_000¢ fee-level total under an
    11_000¢ invoice-level one. A single-tax implementation reads 1_000¢ / 11_000¢ on both lines.

- id: b19/tax/unequal/preview
  block: B19
  axes: {feature: tax, arrangement: unequal, observed_via: preview}
  dimensions: {interval: monthly, billing_time: calendar, tax_rate: 20}
  provenance: coverage-gap
  runners: [rspec]
  premium: true
  setup:
    organization: {premium_integrations: [preview]}
    taxes:
      - {code: b19_w1_txup_plan, name: Plan VAT, rate: 20, applied_to_organization: false}
      - {code: b19_w1_txup_cust, name: Customer VAT, rate: 5, applied_to_organization: false}
    plan:
      code: golden_b19_w1_txup
      interval: monthly
      amount_cents: 10000
      tax_codes: [b19_w1_txup_plan]
    customer:
      external_id: golden_b19_w1_txup_cust
      currency: EUR
      tax_codes: [b19_w1_txup_cust]
    subscription: {external_id: golden_b19_w1_txup_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-20T10:00:00Z", do: preview_invoice}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_amount_cents: 10000
      taxes_amount_cents: 2000
      total_amount_cents: 12000
    preview:
      fees_amount_cents: 10000
      sub_total_excluding_taxes_amount_cents: 10000
      taxes_amount_cents: 2000
      total_amount_cents: 12000
  math: >-
    Precedence, forecast. A plan tax of 20% and a customer tax of 5%, and the plan's wins outright:
    `applicable_taxes` returns `plan.taxes` and never reaches `customer.taxes`
    (apply_taxes_service.rb:77-80), so 10_000¢ carries 2_000¢ and not 2_500¢.
    The reason this cell is worth a row of its own rather than being assumed from
    b19/tax/unequal/invoice is that a preview resolves the fee's associations differently. Its
    subscription fee is built by `Fees::SubscriptionService` with `context: :preview` and is never
    saved, and `Fees::ApplyTaxesService` is then called as `call(fee:)` with no `plan:` argument —
    so `plan` falls back to `fee.subscription&.plan` (apply_taxes_service.rb:11) rather than being
    handed down as it is from `CalculateFeesService`. If that fallback resolved to nil the guard
    `plan.taxes.any?` would raise, and if it resolved to an override plan without the tax the chain
    would fall through to the CUSTOMER's 5% and the preview would quote 10_500¢ against a 12_000¢
    invoice. Asserting 2_000¢ on both surfaces is what pins the fallback to the same plan the
    invoice used.
    Counterfactuals on the preview line: additive 2_500¢ / 12_500¢, customer-wins 500¢ / 10_500¢,
    no tax at all 0¢ / 10_000¢ (the shape `apply_zero_tax` produces when provider taxation is
    misdetected, preview_service.rb:410-413).

- id: b19/tax/equal/regenerated
  block: B19
  axes: {feature: tax, arrangement: equal, observed_via: regenerated}
  dimensions: {interval: monthly, billing_time: calendar, tax_rate: 20, grace_period: 5}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    taxes:
      - {code: b19_w1_txer_a, name: VAT A, rate: 10}
      - {code: b19_w1_txer_b, name: VAT B, rate: 10}
    plan: {code: golden_b19_w1_txer, interval: monthly, amount_cents: 10000}
    customer: {external_id: golden_b19_w1_txer_cust, currency: EUR, invoice_grace_period: 5}
    subscription: {external_id: golden_b19_w1_txer_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - {at: "2024-04-01T02:00:00Z", do: refresh_invoice}
  expect:
    invoices: 1
    invoice:
      status: draft
      fees_amount_cents: 10000
      coupons_amount_cents: 0
      credit_notes_amount_cents: 0
      prepaid_credit_amount_cents: 0
      sub_total_excluding_taxes_amount_cents: 10000
      taxes_amount_cents: 2000
      total_amount_cents: 12000
      fees_count: 1
      fees:
        - {fee_type: subscription, amount_cents: 10000, taxes_amount_cents: 2000, taxes_rate: 20.0}
  math: >-
    Tax is the one reducer a draft DOES carry, so this is the cell where a regeneration has to
    reproduce a non-zero amount rather than a zero.
    `Invoices::RefreshDraftService` rebuilds the draft by destroying its fees and re-running
    `CalculateFeesService`, and only the three finalizing-gated reducers drop out
    (calculate_fees_service.rb:364-379); `Invoices::ComputeTaxesAndTotalsService` runs
    unconditionally at :57. So both 10% taxes are re-resolved from the billing entity, re-summed by
    `Fees::ApplyTaxesService` (apply_taxes_service.rb:24-52) and the draft reads 2_000¢ of tax on
    10_000¢ of fee — 20.0 on the fee's `taxes_rate` — exactly what the finalized twin
    b19/tax/equal/invoice reads.
    The two failure modes a refresh could introduce are both excluded here. One is a re-run that
    resolves only one of the two taxes (1_000¢, `taxes_rate` 10.0). The other is a re-run that
    re-applies taxes onto fees that already carry them — `Fees::ApplyTaxesService` opens with
    `return result if fee.applied_taxes.any?` (:18), which is a no-op on a REBUILT fee but a
    double-taxation guard on a reused one; had the refresh kept the fees and re-applied, the row
    would read 4_000¢ and 40.0.
    The three withheld reducers are asserted as 0 rather than omitted, so this row cannot pass by
    finding a draft that quietly allocated something.

- id: b19/tax/unequal/regenerated
  block: B19
  axes: {feature: tax, arrangement: unequal, observed_via: regenerated}
  dimensions: {interval: monthly, billing_time: calendar, tax_rate: 20, grace_period: 5}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    taxes:
      - {code: b19_w1_txur_plan, name: Plan VAT, rate: 20, applied_to_organization: false}
      - {code: b19_w1_txur_cust, name: Customer VAT, rate: 5, applied_to_organization: false}
    plan:
