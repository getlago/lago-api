- id: b19/prepaid_credit/equal/invoice
  block: B19
  axes: {feature: prepaid_credit, arrangement: equal, observed_via: invoice}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, wallet_priority: equal}
  provenance: coverage-gap
  runners: [rspec, live]
  setup:
    plan: {code: golden_b19_w1_pcei, interval: monthly, amount_cents: 5000}
    customer: {external_id: golden_b19_w1_pcei_cust, currency: EUR}
    subscription: {external_id: golden_b19_w1_pcei_sub, billing_time: calendar}
    wallets:
      - {name: first, code: b19_w1_pcei_a, rate_amount: "1", currency: EUR, granted_credits: "30", priority: 1}
      - {name: second, code: b19_w1_pcei_b, rate_amount: "1", currency: EUR, granted_credits: "30", priority: 1}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_amount_cents: 5000
      prepaid_credit_amount_cents: 5000
      prepaid_granted_credit_amount_cents: 5000
      total_amount_cents: 0
  math: >-
    Two identically configured wallets, neither of which can settle the invoice alone: 3_000¢ each
    against 5_000¢ due. The question is whether the allocator moves on to the SECOND wallet once the
    first is empty, or stops.
    `Credits::AllocatePrepaidCreditsByWalletsService` walks `Wallet.in_application_order` and, per
    wallet, tries each fee bucket with `transaction_amount = [remaining_amount,
    remaining_wallet_balance, remaining_invoice_amount].min`
    (allocate_prepaid_credits_by_wallets_service.rb:40-66). The single `["subscription", nil]`
    bucket starts at 5_000¢: the first wallet is bounded by its own 3_000¢ balance, the second by
    the 2_000¢ of invoice that is left — 5_000¢ of prepaid credit and nothing due. Both wallets hold
    granted credits, so all 5_000¢ lands in `prepaid_granted_credit_amount_cents` and none in the
    purchased column, which is the second half of the assertion: it says the credits were sourced
    from wallets and not from a mis-classified top-up.
    A one-wallet implementation reads 3_000¢ of prepaid credit and 2_000¢ still due — the loud
    difference this row is sized for.
    Deliberately NO `expect.wallet`: both wallets share priority 1 and are created inside the same
    frozen `travel_to`, so `order(:priority, :created_at)` (wallet.rb:69-71) has nothing left to
    break the tie and which of the two ends at 1_000¢ is not determined. The invoice-level totals
    are order-independent, which is exactly why they are the whole assertion here; the ordered cases
    are b19/prepaid_credit/unequal/invoice and .../capped/invoice.

- id: b19/prepaid_credit/capped/invoice
  block: B19
  axes: {feature: prepaid_credit, arrangement: capped, observed_via: invoice}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, wallet_priority: distinct}
  provenance: coverage-gap
  runners: [rspec, live]
  setup:
    plan: {code: golden_b19_w1_pcci, interval: monthly, amount_cents: 5000}
    customer: {external_id: golden_b19_w1_pcci_cust, currency: EUR}
    subscription: {external_id: golden_b19_w1_pcci_sub, billing_time: calendar}
    wallets:
      - {name: high priority, code: b19_w1_pcci_a, rate_amount: "1", currency: EUR, granted_credits: "80", priority: 1}
      - {name: low priority, code: b19_w1_pcci_b, rate_amount: "1", currency: EUR, granted_credits: "40", priority: 2}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_amount_cents: 5000
      prepaid_credit_amount_cents: 5000
      total_amount_cents: 0
    wallet:
      code: b19_w1_pcci_b
      balance_cents: 4000
  math: >-
    12_000¢ of wallet balance against a 5_000¢ invoice: the pool of invoice runs out inside the
    first wallet, so allocation decides not how much each pays but whether the second is touched at
    all.
    The priority-1 wallet is taken first (`Wallet.in_application_order` is
    `order(:priority, :created_at)`, wallet.rb:69-71) and covers the whole 5_000¢, which drives
    `remaining_invoice_amount` and the bucket's `ordered_remaining_amounts` entry to zero. The
    priority-2 wallet then hits `next if remaining_amount <= 0`
    (allocate_prepaid_credits_by_wallets_service.rb:44) on the only bucket there is, accumulates no
    transactions, and is dropped by `next if total_amount_cents <= 0` (:68) — no wallet transaction,
    no partial consumption, balance untouched at 4_000¢.
    That 4_000¢ is the entire assertion, because the invoice is identical under every allocation:
    5_000¢ of prepaid credit and nothing due whichever wallet paid. Reverse the order and the
    low-priority wallet would be drained to 0¢ and the other left at 7_000¢. Split the invoice pro
    rata by balance and it would read 1_667¢. Only the untouched 4_000¢ is priority-ordered
    consumption with a hard stop.

