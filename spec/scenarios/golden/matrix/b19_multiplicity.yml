      - {add_on_code: b19_w1_fcep_b, charge_model: standard, units: 4, properties: {amount: "100"}}
    customer: {external_id: golden_b19_w1_fcep_cust, currency: EUR}
    subscription: {external_id: golden_b19_w1_fcep_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-20T10:00:00Z", do: preview_invoice}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_amount_cents: 80000
      total_amount_cents: 80000
    preview:
      fees_amount_cents: 80000
      sub_total_excluding_taxes_amount_cents: 80000
      total_amount_cents: 80000
  math: >-
    Two equal fixed charges, forecast: 4 × 100.00 twice = 80_000¢, the arithmetic derived in
    b19/fixed_charge/equal/invoice.
    The preview builds fixed-charge fees in its own loop, `add_fixed_charge_fees`
    (preview_service.rb:232-257), which iterates `subscription.fixed_charges` and calls
    `Fees::FixedChargeService` with `context: :invoice_preview`. The preview is deliberately taken
    on 20 MARCH, inside the first period: `should_create_fixed_charge_fee?` refuses an arrears fixed
    charge when `is_starting_subscription?` is true, and that predicate is
    `invoice_subscriptions.count == 1 && the last one is subscription_starting?`
    (preview_service.rb:319-330, :447-452). Before the first invoice exists the count is 0, so both
    fees are built; in the SECOND period the count is exactly 1 and both would be suppressed —
    a preview of 0¢ against an invoice of 80_000¢, which is a trap and not this cell's subject.
    `fees_amount_cents` rather than a `fees:` list, on purpose: whether the preview emits the plan's
    0¢ subscription fee alongside the two fixed-charge fees is not something this cell should pin
    (a 0¢ fee changes `fees_count` without changing a cent), and 80_000¢ is the same number either
    way. One fixed charge lost gives 40_000¢; both charges built from the same add-on's units gives
    80_000¢ but is excluded by the invoice sibling's per-fee assertion.

