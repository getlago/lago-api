- id: b19/prepaid_credit/equal/regenerated
  block: B19
  axes: {feature: prepaid_credit, arrangement: equal, observed_via: regenerated}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, wallet_priority: equal, grace_period: 5}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    plan: {code: golden_b19_w1_pcer, interval: monthly, amount_cents: 5000}
    customer: {external_id: golden_b19_w1_pcer_cust, currency: EUR, invoice_grace_period: 5}
    subscription: {external_id: golden_b19_w1_pcer_sub, billing_time: calendar}
    wallets:
      - {name: first, code: b19_w1_pcer_a, rate_amount: "1", currency: EUR, granted_credits: "30", priority: 1}
      - {name: second, code: b19_w1_pcer_b, rate_amount: "1", currency: EUR, granted_credits: "30", priority: 1}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - {at: "2024-04-02T10:00:00Z", do: finalize_invoice}
    - {at: "2024-05-01T01:00:00Z", do: perform_billing}
    - {at: "2024-05-01T02:00:00Z", do: refresh_invoice}
  expect:
    invoices: 2
    invoice:
      - select: {index: 0}
        status: finalized
        fees_amount_cents: 5000
        prepaid_credit_amount_cents: 5000
        total_amount_cents: 0
      - select: {index: 1}
        status: draft
        fees_amount_cents: 5000
        coupons_amount_cents: 0
        credit_notes_amount_cents: 0
        prepaid_credit_amount_cents: 0
        total_amount_cents: 5000
  math: >-
    Two equal wallets, one period settled and the next held open as a draft.
    March, finalized by hand out of its grace period: 3_000¢ + 2_000¢ from the two wallets settles
    the 5_000¢ plan, leaving 1_000¢ of credit between them (which of the two holds it is
    undetermined — equal priority, identical creation instant — so no wallet is asserted).
    April is the cell. The draft reads 5_000¢ of fees and 0¢ of prepaid credit:
    `should_create_applied_prepaid_credit?` begins
    `return false if not_in_finalizing_process?` (calculate_fees_service.rb:375-379), and the
    refresh must reproduce it rather than allocating. That gate is not cosmetic here — it is the
    only thing stopping a draft from burning the surviving 1_000¢ of wallet credit that a later
    refresh, or a plan change, would have to hand back. `Invoices::VoidService` does recredit
    outbound wallet transactions, but a REFRESH does not, so credit spent on a draft would simply
    be gone.
    A refresh that allocated would show 4_000¢ due and both wallets at zero. 5_000¢ due with 0¢ of
    prepaid credit is the correct, deliberate answer, and asserting the field as 0 rather than
    omitting it is what makes the row able to say so.

