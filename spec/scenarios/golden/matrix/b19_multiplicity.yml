    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b19_w1_chur_sum, timestamp: "2024-03-05T10:00:00Z", properties: {amount: 50}}
        - {code: b19_w1_chur_sum, timestamp: "2024-03-05T11:00:00Z", properties: {amount: 30}}
        - {code: b19_w1_chur_sum, timestamp: "2024-03-05T12:00:00Z", properties: {amount: 20}}
