    and 10_000¢ at priority 2 against a 5_000¢ invoice. The priority-1 wallet contributes its whole
    3_000¢ and the priority-2 wallet the remaining 2_000¢, ending at 8_000¢.
    The row makes two separate claims, because the surface can only carry one of them.
    (1) The preview total: 5_000¢ of prepaid credit, nothing due. This is what the customer is shown
    and it must match the invoice to the cent — same allocator
    (preview_service.rb:368-377 → `Credits::AllocatePrepaidCreditsByWalletsService`), unsaved fees.
