    - {at: "2024-04-02T10:00:00Z", do: finalize_invoice}
    - {at: "2024-05-01T01:00:00Z", do: perform_billing}
    - {at: "2024-05-01T02:00:00Z", do: refresh_invoice}
  expect:
    invoices: 2
    invoice:
      - select: {index: 0}
        status: finalized
        fees_amount_cents: 15000
        coupons_amount_cents: 4000
        sub_total_excluding_taxes_amount_cents: 11000
        total_amount_cents: 11000
      - select: {index: 1}
        status: draft
        fees_amount_cents: 5000
        coupons_amount_cents: 0
        credit_notes_amount_cents: 0
        prepaid_credit_amount_cents: 0
        sub_total_excluding_taxes_amount_cents: 5000
        total_amount_cents: 5000
  math: >-
    Two identically configured coupons, one period finalized and the next rebuilt as a draft, so the
    row asserts the multiplicity AND what a regeneration makes of it.
    March, finalized by hand out of its grace period: 5_000¢ plan + 100 units = 15_000¢, each
    coupon takes its 2_000¢ from the running sub_total → 11_000¢ due. Both are `recurring` over 3
    periods, so `decrement_frequency_duration_remaining` leaves each with 2 and NEITHER is
    terminated (applied_coupon_service.rb:49-53, :86-88) — this is the deliberate difference from
    b19/coupon/equal/invoice, where the same pair is `once` and both die on the first invoice.
    April therefore has two live coupons worth 4_000¢, and the draft shows none of them: 5_000¢ of
    fees and 5_000¢ due. `should_create_coupon_credit?` begins
    `return false if not_in_finalizing_process?` (calculate_fees_service.rb:368-373), so a draft is
    fee producers and tax alone — which is what stops a grace-period draft from consuming a
    coupon that a refresh would have to give back. `PUT /invoices/:id/refresh` rebuilds the draft
    from scratch and must land on the same 5_000¢, not on the 1_000¢ the customer will eventually
    be billed.
