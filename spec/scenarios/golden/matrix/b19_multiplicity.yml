    to the invoice. `transaction_amount` takes the min of three quantities and the invoice is the
    binding one here; a preview that dropped `remaining_invoice_amount` from that min would quote
    12_000¢ of credit against a 5_000¢ invoice and a negative total. `total_amount_cents: 0` on the
