    May); sharing the 5_000¢ pro rata by balance would leave 3_857¢. 4_000¢ is oldest-first with a
    hard break, and only that.

- id: b19/credit_note/equal/preview
  block: B19
  axes: {feature: credit_note, arrangement: equal, observed_via: preview}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none}
  provenance: coverage-gap
  runners: [rspec]
  premium: true
  setup:
    organization: {premium_integrations: [preview]}
    plan: {code: golden_b19_w1_cnep, interval: monthly, amount_cents: 10000}
    customer: {external_id: golden_b19_w1_cnep_cust, currency: EUR}
    subscription: {external_id: golden_b19_w1_cnep_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - at: "2024-04-02T10:00:00Z"
      do: create_credit_note
      credit_note:
        reason: other
        credit_amount_cents: 3500
        refund_amount_cents: 0
        items: [{fee_type: subscription, amount_cents: 3500}]
    - at: "2024-04-03T10:00:00Z"
      do: create_credit_note
      credit_note:
        reason: other
        credit_amount_cents: 3500
        refund_amount_cents: 0
        items: [{fee_type: subscription, amount_cents: 3500}]
    - {at: "2024-04-20T10:00:00Z", do: preview_invoice}
    - {at: "2024-05-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {index: 0}
        fees_amount_cents: 10000
        total_amount_cents: 10000
      - select: {index: 1}
        fees_amount_cents: 10000
        credit_notes_amount_cents: 7000
        total_amount_cents: 3000
    preview:
      fees_amount_cents: 10000
      credit_notes_amount_cents: 7000
      total_amount_cents: 3000
  math: >-
    Two equal notes, forecast before they are spent. The arithmetic is the one derived in
    b19/credit_note/equal/invoice — 10_000¢ of fees, two 3_500¢ notes raised against March, 7_000¢
    of credit and 3_000¢ due in April.
    What the row adds is that the preview reaches it through the SAME service and must therefore
    agree exactly: `Invoices::Preview::CreditsService#persisted_credits` calls
    `Credits::CreditNoteService` with `context: :preview` (credits_service.rb:22-26), so the
    ordering, the `compute_credit_amount` cap and the `break` on a fully covered invoice are shared
    code rather than a reimplementation. What `context: :preview` skips is the writes — no `Credit`
    row, no `update_remaining_credit`, and no `apply_credit_to_fees` — so a preview is repeatable
    and the two notes are still `available` at 20 April even though the preview has "spent" them.
    That skipped `apply_credit_to_fees` is why this cell is worth asserting on its own rather than
    assumed from the invoice: it is the one place the two paths differ, and it is invisible until a
    fee-level consumer (a limited wallet, whose ceiling is
    `sub_total + taxes - precise_credit_notes`) is present. This row deliberately has none, so the
    two surfaces must match to the cent, and any difference is a defect rather than a known gap.
    A preview that applied only one note would read 6_500¢ due against the invoice's 3_000¢.

