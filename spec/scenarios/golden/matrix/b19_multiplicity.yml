  math: >-
    Two subscriptions on different plans, previewed together: 6_000¢ + 15_000¢ = 21_000¢, matching
    b19/subscription_fee/unequal/invoice.
    This is the one preview cell in the block where the per-fee split IS assertable, because the two
    fees carry different plan codes as `item_code` (fee.rb:123) and so are separable by
    `GoldenRunner::FEE_MATCH_KEYS`. That makes the row able to say more than the total: it pins each
    fee to its own subscription's plan, which is exactly the pairing
    `PreviewService#add_subscription_fee` could get wrong while still summing to a plausible number
    — building both fees from `first_subscription` reads 12_000¢, from the last 30_000¢, and mixing
    the plan of one with the boundaries of the other would show up as a wrong per-fee amount rather
    than a wrong total.
    Both subscriptions must be named in the step, or the runner previews only the last one created
    (15_000¢ against a 21_000¢ invoice). With both named, `currencies_aligned?` passes because both
    plans are EUR and `billing_times_aligned?` passes because both are calendar/monthly with the
    same `end_of_period` (preview_service.rb:84-103) — a mixed pair would be refused outright, and
    a preview refusing the multiplicity is a different finding from one mis-summing it.

- id: b19/subscription_fee/equal/regenerated
  block: B19
  axes: {feature: subscription_fee, arrangement: equal, observed_via: regenerated}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, subscriptions: 2, grace_period: 5}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    plan: {code: golden_b19_w1_sfer, interval: monthly, amount_cents: 6000}
    customer: {external_id: golden_b19_w1_sfer_cust, currency: EUR, invoice_grace_period: 5}
    subscription: {external_id: golden_b19_w1_sfer_sub_a, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-01T00:10:00Z"
      do: create_subscription
      params: {external_id: golden_b19_w1_sfer_sub_b}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - {at: "2024-04-01T02:00:00Z", do: refresh_invoice}
  expect:
    invoices: 1
    invoice:
      status: draft
      fees_amount_cents: 12000
      coupons_amount_cents: 0
      credit_notes_amount_cents: 0
      prepaid_credit_amount_cents: 0
      sub_total_excluding_taxes_amount_cents: 12000
      total_amount_cents: 12000
      fees_count: 2
      fees:
        - {fee_type: subscription, item_code: golden_b19_w1_sfer, amount_cents: 6000}
        - {fee_type: subscription, item_code: golden_b19_w1_sfer, amount_cents: 6000}
  math: >-
    Two subscriptions on one plan, consolidated onto one draft and rebuilt: 6_000¢ + 6_000¢ =
    12_000¢, unchanged from the finalized b19/subscription_fee/equal/invoice because subscription
    fees are producers (calculate_fees_service.rb:42) and only the three reducers are gated on
    finalization (:364-379).
    A refresh is where a consolidated invoice is most exposed, and that is the point of the cell.
    `Invoices::RefreshDraftService` destroys the draft's fees and re-runs `CalculateFeesService`,
    which rebuilds one subscription fee per `invoice_subscription` — so the rebuild depends on the
    invoice still carrying BOTH `invoice_subscriptions`, a join a refresh does not recreate. A
    rebuild that saw one of them reads 6_000¢ with `fees_count` 1; one that appended rather than
    replaced reads 24_000¢ with `fees_count` 4. Both are excluded by the count together with the
    total.
    The two fee expectations are identical, which is what makes them matchable: `Fee#item_code` is
    the plan's code for a subscription fee (fee.rb:123) and both fees share plan, type and period,
    so they collide on every `FEE_MATCH_KEYS` field (F67). The three withheld reducers are asserted
    as 0 rather than omitted, so a draft that allocated one cannot slip through.

