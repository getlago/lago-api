- id: b19/tax/equal/invoice
  block: B19
  axes: {feature: tax, arrangement: equal, observed_via: invoice}
  dimensions: {interval: monthly, billing_time: calendar, tax_rate: 20}
  provenance: coverage-gap
  runners: [rspec, live]
  setup:
    taxes:
      - {code: b19_w1_txei_a, name: VAT A, rate: 10}
      - {code: b19_w1_txei_b, name: VAT B, rate: 10}
    plan: {code: golden_b19_w1_txei, interval: monthly, amount_cents: 10000}
    customer: {external_id: golden_b19_w1_txei_cust, currency: EUR}
    subscription: {external_id: golden_b19_w1_txei_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_amount_cents: 10000
      sub_total_excluding_taxes_amount_cents: 10000
      taxes_amount_cents: 2000
      total_amount_cents: 12000
      fees_count: 1
      fees:
        - {fee_type: subscription, amount_cents: 10000, taxes_amount_cents: 2000, taxes_rate: 20.0}
  math: >-
    Two taxes at the same rate, both applied at the same level: do the rates ADD, or does one
    overwrite the other?
    They add, and the mechanism is a loop rather than a lookup. `Fees::ApplyTaxesService` iterates
    `applicable_taxes`, builds one `Fee::AppliedTax` per tax, and accumulates
    `applied_taxes_amount_cents += tax_amount_cents` and `applied_taxes_rate += tax.rate`
    (apply_taxes_service.rb:24-52). Both taxes here are created with `applied_to_organization: true`,
    so both become billing-entity taxes and both fall out of the final branch of `applicable_taxes`
    (:81-82) — the only branch that can return more than one tax from more than one source.
    10_000¢ of subscription fee, 10% + 10% = 20% → 2_000¢ of tax, 12_000¢ due, and the fee's own
    `taxes_rate` reads 20.0 because that column is the SUM of the applied rates, not a single tax's.
    The failure this row is sized to catch is a last-one-wins implementation: 1_000¢ of tax,
    11_000¢ due, `taxes_rate` 10.0 — half the VAT collected, on an invoice that still looks
    internally consistent. Asserting the fee's `taxes_rate` as well as the amount is what separates
    "one tax at 20%" from "two taxes at 10%", which the amounts alone cannot.
    Note the rounding is sum-then-round (`fee.taxes_amount_cents = applied_taxes_amount_cents.round`
    at :46-48, over unrounded per-tax floats), so on a base with a fractional half-cent per tax the
    two orders would differ by 1¢; 10_000¢ at 10% is exact in both, which keeps this row about
    additivity alone.

- id: b19/tax/unequal/invoice
  block: B19
  axes: {feature: tax, arrangement: unequal, observed_via: invoice}
  dimensions: {interval: monthly, billing_time: calendar, tax_rate: 20}
  provenance: coverage-gap
  runners: [rspec, live]
  setup:
    taxes:
      - {code: b19_w1_txui_plan, name: Plan VAT, rate: 20, applied_to_organization: false}
      - {code: b19_w1_txui_cust, name: Customer VAT, rate: 5, applied_to_organization: false}
    plan:
      code: golden_b19_w1_txui
      interval: monthly
      amount_cents: 10000
      tax_codes: [b19_w1_txui_plan]
    customer:
      external_id: golden_b19_w1_txui_cust
      currency: EUR
      tax_codes: [b19_w1_txui_cust]
    subscription: {external_id: golden_b19_w1_txui_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_amount_cents: 10000
      sub_total_excluding_taxes_amount_cents: 10000
      taxes_amount_cents: 2000
      total_amount_cents: 12000
      fees_count: 1
      fees:
        - {fee_type: subscription, amount_cents: 10000, taxes_amount_cents: 2000, taxes_rate: 20.0}
  math: >-
    Two taxes that do NOT add, because they are attached at different levels and the levels are
    ordered. This is the tax feature's version of "something decides which one goes first": for
    coupons it is a sort, for wallets a priority, and for taxes it is the guard chain in
    `Fees::ApplyTaxesService#applicable_taxes` (apply_taxes_service.rb:64-83), where the FIRST level
    that has any tax returns and every level below it is never consulted.
    A subscription fee reaches `if (fee.charge? || fee.subscription? || ...) && plan.taxes.any? →
    return plan.taxes` (:77-79) before `return customer.taxes if customer.taxes.any?` (:80). So the
    plan's 20% applies alone: 10_000¢ × 20% = 2_000¢, 12_000¢ due, fee `taxes_rate` 20.0. Both taxes
    are created with `applied_to_organization: false` so the billing-entity fallback at :81-82
    cannot smuggle either of them back in.
    Three counterfactuals, all distinguishable on these numbers. Additive (the naive reading of
    "the customer has two taxes"): 25% → 2_500¢ and 12_500¢. Customer-wins: 5% → 500¢ and 10_500¢.
    Both levels merged and de-duplicated: still 25%. The rates are deliberately 20 and 5 rather than
    two equal rates, because with equal rates the precedence and the additive answers would differ
    only by a factor of two and a plan-vs-customer mix-up would be invisible.
    b19/tax/equal/invoice is the control: at the SAME level two taxes really do add, so this row
    records precedence, not a refusal to stack.

- id: b19/tax/equal/preview
  block: B19
  axes: {feature: tax, arrangement: equal, observed_via: preview}
  dimensions: {interval: monthly, billing_time: calendar, tax_rate: 20}
  provenance: coverage-gap
