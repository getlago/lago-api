# B11 — Plan & charge overrides / cascade
#
# The worst bug-rate-to-coverage ratio measured anywhere in spec/scenarios: 64 fix commits across
# Charges::{Update,Create,Destroy}ChildrenService and Plans::UpdateService, against roughly four
# scenario specs.
#
# A subscription-level `plan_overrides` creates a CHILD plan belonging to that subscription alone.
# From then on the parent and the child can diverge, and `cascade_updates` decides whether an edit to
# the parent reaches the child. Getting that wrong silently reprices — or fails to reprice — every
# customer on an overridden plan, which is exactly the kind of change nobody notices until invoicing.
#
# All rows need `premium: true`: Plans::OverrideService refuses without a licence.
#
# Note that PUT /plans/:code/charges/:code is a full REPLACEMENT, not a patch: charge_model has to be
# resent even when only the properties change, or the request fails with charge_model/value_is_mandatory.
#
# Shared conventions: monthly / calendar, three events summing to 30 units, standard charge at 1.00
# per unit on the parent → 3_000¢ unless a cascade changes the price.
---
- id: b11/create-child/plan-override
  block: B11
  axes: {operation: create-child, target: plan-override}
  dimensions: {interval: monthly, billing_time: calendar}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    metrics: [{code: b11_child_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b11_child, interval: monthly, amount_cents: 1000}
    charges: [{billable_metric_code: b11_child_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b11_child_cust, currency: EUR}
    subscription:
      external_id: golden_b11_child_sub
      billing_time: calendar
      plan_overrides: {amount_cents: 5000}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b11_child_sum, properties: {amount: 30}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_amount_cents: 8000
      total_amount_cents: 8000
      fees:
        - {fee_type: subscription, amount_cents: 5000}
        - {fee_type: charge, units: "30.0", amount_cents: 3000}
  math: >-
    The override raises the subscription price from the parent's 1_000¢ to 5_000¢ for this
    subscription only, while the charge is inherited untouched: 30 units × 1.00 = 3_000¢. Total
    5_000 + 3_000 = 8_000¢. Asserting BOTH fees is the point — an override that leaked into the
    charge, or failed to reach the subscription fee, changes exactly one of these two numbers.

- id: b11/update-parent-cascade/plan-override
  block: B11
  axes: {operation: update-parent-cascade, target: plan-override}
  dimensions: {interval: monthly, billing_time: calendar, cascade_updates: true}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    metrics: [{code: b11_casc_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b11_cascade, interval: monthly, amount_cents: 1000}
    charges: [{billable_metric_code: b11_casc_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b11_cascade_cust, currency: EUR}
    subscription:
      external_id: golden_b11_cascade_sub
      billing_time: calendar
      plan_overrides: {amount_cents: 5000}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-02T10:00:00Z"
      do: update_plan_charge
      charge:
        billable_metric_code: b11_casc_sum
        charge_model: standard
        properties: {amount: "2"}
        cascade_updates: true
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b11_casc_sum, properties: {amount: 30}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_amount_cents: 11000
      total_amount_cents: 11000
      fees:
        - {fee_type: subscription, amount_cents: 5000}
        - {fee_type: charge, units: "30.0", amount_cents: 6000}
  math: >-
    The parent's charge is repriced from 1.00 to 2.00 WITH cascade_updates, so the child plan created
    by the override receives the change: 30 units × 2.00 = 6_000¢. The overridden subscription fee is
    untouched at 5_000¢ — cascading a charge must not undo an override of a different field — giving
    5_000 + 6_000 = 11_000¢. Compare the no-cascade row below, which uses an identical setup and
    yields 8_000¢.

- id: b11/update-parent-no-cascade/plan-override
  block: B11
  axes: {operation: update-parent-no-cascade, target: plan-override}
  dimensions: {interval: monthly, billing_time: calendar, cascade_updates: false}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    metrics: [{code: b11_nocasc_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b11_no_cascade, interval: monthly, amount_cents: 1000}
    charges: [{billable_metric_code: b11_nocasc_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b11_no_cascade_cust, currency: EUR}
    subscription:
      external_id: golden_b11_no_cascade_sub
      billing_time: calendar
      plan_overrides: {amount_cents: 5000}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-02T10:00:00Z"
      do: update_plan_charge
      charge:
        billable_metric_code: b11_nocasc_sum
        charge_model: standard
        properties: {amount: "2"}
        cascade_updates: false
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b11_nocasc_sum, properties: {amount: 30}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_amount_cents: 8000
      total_amount_cents: 8000
      fees:
        - {fee_type: subscription, amount_cents: 5000}
        - {fee_type: charge, units: "30.0", amount_cents: 3000}
  math: >-
    Identical to the cascade row except cascade_updates is false, so the child plan keeps the price
    it was created with: 30 units × 1.00 = 3_000¢, total 8_000¢ rather than 11_000¢. The 3_000¢
    difference between these two rows is the entire behaviour of the flag, and it is invisible on the
    parent plan — only a subscription billed against the child reveals which way it went.

# ---------------------------------------------------------------------------------------------
# Reading of the `target` axis, made explicit because the three values are otherwise labels.
#
# Lago has no single "override" object: an override is a CHILD PLAN, and the three targets are the
# three services that decide what a child inherits.
#
#   plan-override        the charge configuration of the child plan — Charges::UpdateChildrenService
#   subscription-override  the child plan's own amount_cents, i.e. the subscription FEE —
#                        Plans::UpdateService#cascade_subscription_fee_update / Plans::UpdateAmountService
#   charge-filter        pricing that reaches the fee through a ChargeFilter rather than the
#                        charge's own properties — Charges::OverrideService's filter duplication
#
# The three existing rows above all sit on plan-override, which is why they all cascade a charge.
#
# Every row keeps exactly ONE charge fee on the invoice. A charge that has filters emits one fee per
# filter plus one for the events matching none of them, and fees are matched by identity keys
# (fee_type, item_code, item_type, from_date, to_date) which two fees of the same charge share — so
# rows aim all their events at a single bucket and let Fees::ChargeService drop the empty one
# (app/services/fees/charge_service.rb:68 rejecting via should_persist_fee?, :353). `fees_count` is
# asserted alongside the amount so "the filter vanished" cannot hide as "the amount changed".

- id: b11/create-child/subscription-override
  block: B11
  axes: {operation: create-child, target: subscription-override}
  dimensions: {interval: monthly, billing_time: calendar, override_field: amount_cents}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    metrics: [{code: b11_subov_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b11_sub_override, interval: monthly, amount_cents: 1000}
    charges: [{billable_metric_code: b11_subov_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b11_sub_override_cust, currency: EUR}
    subscription:
      external_id: golden_b11_sub_override_sub
      billing_time: calendar
      plan_overrides: {amount_cents: 2500}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b11_subov_sum, properties: {amount: 30}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_count: 2
      fees_amount_cents: 5500
      total_amount_cents: 5500
      fees:
        - {fee_type: subscription, amount_cents: 2500}
        - {fee_type: charge, units: "30.0", amount_cents: 3000}
    resource:
      kind: plan
      fields: {amount_cents: 1000}
  math: >-
    Plans::OverrideService dups the plan and writes amount_cents onto the COPY, setting
    parent_id to the original (app/services/plans/override_service.rb:19-29); the original row is
    never touched. So this subscription bills 2_500¢ while GET /plans/golden_b11_sub_override — which
    the controller scopes to `.parents` (app/controllers/api/v1/plans_controller.rb:52) — still
    reports 1_000¢. The charge is inherited by Charges::OverrideService with empty params, so its
    properties survive verbatim: 30 units × 1.00 = 3_000¢, total 5_500¢. Asserting the invoice AND
    the parent plan in one row is the point: an override implemented as a plan edit (Plans::UpdateService
    instead of OverrideService) would still bill 5_500¢ here while repricing every other subscription
    on the plan — the invoice alone cannot tell the two apart. An override that never reached the
    subscription fee would bill 1_000 + 3_000 = 4_000¢.

- id: b11/create-child/charge-filter
  block: B11
  axes: {operation: create-child, target: charge-filter}
  dimensions: {interval: monthly, billing_time: calendar, filter_key: region}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    metrics:
      - code: b11_cfchild_sum
        aggregation_type: sum_agg
        field_name: amount
        filters: [{key: region, values: ["eu", "us"]}]
    plan: {code: golden_b11_child_filter, interval: monthly, amount_cents: 1000}
    charges:
      - billable_metric_code: b11_cfchild_sum
        charge_model: standard
        properties: {amount: "1"}
        filters:
          - invoice_display_name: EU region
            properties: {amount: "3"}
            values: {region: ["eu"]}
    customer: {external_id: golden_b11_child_filter_cust, currency: EUR}
    subscription:
      external_id: golden_b11_child_filter_sub
      billing_time: calendar
      plan_overrides: {amount_cents: 5000}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b11_cfchild_sum, properties: {amount: 30, region: "eu"}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_count: 2
      fees_amount_cents: 14000
      total_amount_cents: 14000
      fees:
        - {fee_type: subscription, amount_cents: 5000}
        - {fee_type: charge, units: "30.0", amount_cents: 9000}
  math: >-
    Charges::OverrideService duplicates the parent charge's filters AND each filter's values onto the
    child charge (app/services/charges/override_service.rb:26-30), so the eu price of 3.00 follows the
    override even though the row never mentions the child: 30 units × 3.00 = 9_000¢, plus the
    overridden 5_000¢ subscription fee = 14_000¢. The un-filtered bucket receives no events, so its
    zero fee is rejected before saving and only two fees remain. Two distinct failure modes both land
    on 8_000¢ and are why fees_count is asserted with the amount: filters not duplicated at all, and
    filters duplicated without their values — in either case the 30 units fall through to the charge's
    own properties at 1.00 = 3_000¢.

- id: b11/update-parent-cascade/subscription-override
  block: B11
  axes: {operation: update-parent-cascade, target: subscription-override}
  dimensions: {interval: monthly, billing_time: calendar, cascade_updates: true, child_diverged: true}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    metrics: [{code: b11_cascsub_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b11_cascade_subfee, interval: monthly, amount_cents: 1000}
    charges: [{billable_metric_code: b11_cascsub_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b11_cascade_subfee_cust, currency: EUR}
    subscription:
      external_id: golden_b11_cascade_subfee_sub
      billing_time: calendar
      plan_overrides: {amount_cents: 5000}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-02T10:00:00Z"
      do: update_plan
      params: {amount_cents: 3000, cascade_updates: true}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b11_cascsub_sum, properties: {amount: 30}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_count: 2
      fees_amount_cents: 8000
      total_amount_cents: 8000
      fees:
        - {fee_type: subscription, amount_cents: 5000}
        - {fee_type: charge, units: "30.0", amount_cents: 3000}
  math: >-
    cascade_updates is TRUE and the child is still left alone. Plans::UpdateService only pushes a new
    amount_cents to children that had not diverged: the query is
    `plan.children.where(amount_cents: old_amount_cents)`
    (app/services/plans/update_service.rb:131), and Plans::UpdateAmountService guards it a second
    time with `return result if plan.amount_cents != expected_amount_cents`
    (app/services/plans/update_amount_service.rb:19). This child was created at 5_000¢ against an old
    parent amount of 1_000¢, so it matches neither guard and keeps 5_000¢ while the parent moves to
    3_000¢. The charge is resent unchanged by the same call, so usage stays at 30 × 1.00 = 3_000¢ and
    the total is 8_000¢. An implementation that cascaded to every child would bill 3_000 + 3_000 =
    6_000¢ — silently discarding a negotiated price, which is the failure this row exists to catch.
    Compare the create-child rows: the same 5_000¢ override, before anybody edits the parent.

- id: b11/update-parent-no-cascade/subscription-override
  block: B11
  axes: {operation: update-parent-no-cascade, target: subscription-override}
  dimensions: {interval: monthly, billing_time: calendar, cascade_updates: false, child_diverged: false}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    metrics: [{code: b11_nocascsub_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b11_no_cascade_subfee, interval: monthly, amount_cents: 1000}
    charges: [{billable_metric_code: b11_nocascsub_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b11_no_cascade_subfee_cust, currency: EUR}
    subscription:
      external_id: golden_b11_no_cascade_subfee_sub
      billing_time: calendar
      plan_overrides: {name: b11 no-cascade child}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-02T10:00:00Z"
      do: update_plan
      params: {amount_cents: 3000}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b11_nocascsub_sum, properties: {amount: 30}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_count: 2
      fees_amount_cents: 4000
      total_amount_cents: 4000
      fees:
        - {fee_type: subscription, amount_cents: 1000}
        - {fee_type: charge, units: "30.0", amount_cents: 3000}
  math: >-
    The mirror image of the cascade row, and deliberately NOT its A/B twin. Here the override renames
    the plan and leaves amount_cents inherited, so the child sits at 1_000¢ — exactly the value
    `where(amount_cents: old_amount_cents)` (app/services/plans/update_service.rb:131) selects. It is
    spared anyway, because cascade_needed? is `cascade? && plan.children.present?`
    (app/services/plans/update_service.rb:123-125) and no cascade_updates was sent, so
    cascade_subscription_fee_update returns before enqueuing anything. The subscription therefore
    bills the old 1_000¢ against a parent now priced at 3_000¢, plus 30 × 1.00 = 3_000¢ of usage =
    4_000¢. Sending cascade_updates: true on this same setup would give 3_000 + 3_000 = 6_000¢ — and
    that contrast is the reason the two subscription-override rows differ in their child rather than
    only in the flag: a child that inherited the price moves, a child that negotiated one does not,
    and only the pair shows both halves.

- id: b11/update-parent-cascade/charge-filter
  block: B11
  axes: {operation: update-parent-cascade, target: charge-filter}
  dimensions: {interval: monthly, billing_time: calendar, cascade_updates: true, bucket: filtered}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    metrics:
      - code: b11_cascfilt_sum
        aggregation_type: sum_agg
        field_name: amount
        filters: [{key: region, values: ["eu", "us"]}]
    plan: {code: golden_b11_cascade_filter, interval: monthly, amount_cents: 1000}
    charges:
      - billable_metric_code: b11_cascfilt_sum
        charge_model: standard
        properties: {amount: "1"}
        filters:
          - invoice_display_name: EU region
            properties: {amount: "3"}
            values: {region: ["eu"]}
    customer: {external_id: golden_b11_cascade_filter_cust, currency: EUR}
    subscription:
      external_id: golden_b11_cascade_filter_sub
      billing_time: calendar
      plan_overrides: {amount_cents: 5000}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-02T10:00:00Z"
      do: update_plan_charge
      charge:
        billable_metric_code: b11_cascfilt_sum
        charge_model: standard
        properties: {amount: "9"}
        cascade_updates: true
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b11_cascfilt_sum, properties: {amount: 30, region: "eu"}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_count: 2
      fees_amount_cents: 14000
      total_amount_cents: 14000
      fees:
        - {fee_type: subscription, amount_cents: 5000}
        - {fee_type: charge, units: "30.0", amount_cents: 9000}
  math: >-
    A cascade that reaches the child and changes nothing the customer pays. The parent charge's own
    properties go 1.00 → 9.00 and the change is pushed down: trigger_cascade enqueues
    Charges::UpdateChildrenJob (app/services/charges/cascade_updatable.rb:9-20) and
    Charges::UpdateChildrenService replaces the child's properties because
    `equal_properties: old_parent.equal_properties?(child_charge)` holds — the child was still at 1.00
    (app/services/charges/update_children_service.rb:37). The child's FILTER is untouched twice over:
    Charges::UpdateService only rewrites filters when the payload carries a `filters` key and never in
    cascade mode (`if filters && !cascade`, app/services/charges/update_service.rb:58-64), and
    ChargeFilters::CascadeDispatcher sees before == after and enqueues nothing
    (app/services/charge_filters/cascade_dispatcher.rb:18-20). All 30 units carry region=eu, so the
    filter prices them: 30 × 3.00 = 9_000¢, plus the overridden 5_000¢ = 14_000¢. Note what this
    means operationally — repricing the charge from 1.00 to 9.00 with cascade on moves nothing for
    this customer, because every one of their events is filtered. A cascade that overwrote the child's
    filter properties, or destroyed the filter and let the events fall to the new default, gives
    30 × 9.00 = 27_000¢ and a 32_000¢ total either way.

- id: b11/update-parent-no-cascade/charge-filter
  block: B11
  axes: {operation: update-parent-no-cascade, target: charge-filter}
  dimensions: {interval: monthly, billing_time: calendar, cascade_updates: false, bucket: unfiltered}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    metrics:
      - code: b11_nocascfilt_sum
        aggregation_type: sum_agg
        field_name: amount
        filters: [{key: region, values: ["eu", "us"]}]
    plan: {code: golden_b11_no_cascade_filter, interval: monthly, amount_cents: 1000}
    charges:
      - billable_metric_code: b11_nocascfilt_sum
        charge_model: standard
        properties: {amount: "1"}
        filters:
          - invoice_display_name: EU region
            properties: {amount: "3"}
            values: {region: ["eu"]}
    customer: {external_id: golden_b11_no_cascade_filter_cust, currency: EUR}
    subscription:
      external_id: golden_b11_no_cascade_filter_sub
      billing_time: calendar
      plan_overrides: {amount_cents: 5000}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-02T10:00:00Z"
      do: update_plan_charge
      charge:
        billable_metric_code: b11_nocascfilt_sum
        charge_model: standard
        properties: {amount: "9"}
        cascade_updates: false
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b11_nocascfilt_sum, properties: {amount: 30, region: "us"}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_count: 2
      fees_amount_cents: 8000
      total_amount_cents: 8000
      fees:
        - {fee_type: subscription, amount_cents: 5000}
        - {fee_type: charge, units: "30.0", amount_cents: 3000}
  math: >-
    Same repricing of the parent charge, 1.00 → 9.00, with cascade_updates false: trigger_cascade
    returns on its first line (`return unless cascade_updates`,
    app/services/charges/cascade_updatable.rb:10), so the child keeps both its 1.00 default AND the
    eu filter it inherited. The events carry region=us, which the charge's only filter does not
    cover, so Fees::ChargeService prices them from the child charge's own properties — the
    "events not matching any filters" bucket at app/services/fees/charge_service.rb:107-109 —
    giving 30 × 1.00 = 3_000¢ on top of the overridden 5_000¢ = 8_000¢. The eu bucket has no events,
    its zero fee is dropped, and fees_count is 2. The same setup with cascade_updates: true bills
    30 × 9.00 = 27_000¢, so the 24_000¢ gap between this row and that is the whole flag. A charge
    filter that wrongly captured non-matching events would price these units at 3.00 = 9_000¢.

- id: b11/delete-charge/plan-override
  block: B11
  pins: ["F05"]
  axes: {operation: delete-charge, target: plan-override}
  dimensions: {interval: monthly, billing_time: calendar, cascade_updates: true}
  provenance: characterization
  characterization: true
  runners: [rspec, live]
  premium: true
  setup:
    metrics: [{code: b11_delcasc_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b11_delete_cascade, interval: monthly, amount_cents: 1000}
    charges: [{billable_metric_code: b11_delcasc_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b11_delete_cascade_cust, currency: EUR}
    subscription:
      external_id: golden_b11_delete_cascade_sub
      billing_time: calendar
      plan_overrides: {amount_cents: 5000}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b11_delcasc_sum, properties: {amount: 30}}
    - at: "2024-03-10T10:00:00Z"
      do: update_plan
      params: {charges: [], cascade_updates: true}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_count: 1
      fees_amount_cents: 5000
      total_amount_cents: 5000
      fees:
        - {fee_type: subscription, amount_cents: 5000}
  math: >-
    PUT /plans/:code is a full replacement, so an empty `charges` array IS the delete: sanitize_charges
    takes plan.charges minus the payload and discards what is left
    (app/services/plans/update_service.rb:241-248), and because cascade_updates was sent
    cascade_charge_removal enqueues Charges::DestroyChildrenJob
    (app/services/plans/update_service.rb:142-146), which discards the child's copy — the child plan
    carries an active subscription, which is exactly the scope DestroyChildrenService selects
    (app/services/charges/destroy_children_service.rb:19-21). Charge declares
    `default_scope -> { kept }` (app/models/charge.rb:62), so Invoices::CalculateFeesService iterating
    `subscription.plan.charges` sees nothing at all. The 30 units ingested on 5 March had already
    accrued when the charge was deleted on the 10th and are dropped anyway — the April invoice is the
    overridden subscription fee alone, 5_000¢, with a single fee. A deletion that failed to cascade
    leaves the child billing 30 × 1.00 and the total is 8_000¢, which is what the
    delete-charge/subscription-override row asserts; a deletion that also somehow spared the parent
    would leave two charge fees.

- id: b11/delete-charge/subscription-override
  block: B11
  pins: ["F06"]
  axes: {operation: delete-charge, target: subscription-override}
  dimensions: {interval: monthly, billing_time: calendar, cascade_updates: false}
  provenance: characterization
  characterization: true
  runners: [rspec, live]
  premium: true
  setup:
    metrics: [{code: b11_delnocasc_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b11_delete_no_cascade, interval: monthly, amount_cents: 1000}
    charges: [{billable_metric_code: b11_delnocasc_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b11_delete_no_cascade_cust, currency: EUR}
    subscription:
      external_id: golden_b11_delete_no_cascade_sub
      billing_time: calendar
      plan_overrides: {amount_cents: 5000}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b11_delnocasc_sum, properties: {amount: 30}}
    - at: "2024-03-10T10:00:00Z"
      do: update_plan
      params: {charges: []}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
