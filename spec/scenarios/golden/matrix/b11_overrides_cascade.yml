      total_amount_cents: 8000
      fees:
        - {fee_type: subscription, amount_cents: 5000}
        - {fee_type: charge, units: "30.0", amount_cents: 3000}
  math: >-
    The surprising half of the pair, and the one worth pinning: the charge is deleted from the plan and
    the overridden customer keeps paying for it. Without cascade_updates, cascade_needed? is false
    (app/services/plans/update_service.rb:123-125) so cascade_charge_removal never enqueues
    Charges::DestroyChildrenJob and only the PARENT charge is discarded — Charges::DestroyService is
    called on it directly with cascade_updates defaulting to false
    (app/services/charges/destroy_service.rb:29-31). The child plan created for this subscription
    still owns its own Charge row with properties {amount: "1"}, so April bills 30 × 1.00 = 3_000¢ on
    top of the overridden 5_000¢ subscription fee = 8_000¢, for a charge that no longer appears on the
    plan an operator reads. An implementation that destroyed children unconditionally would bill
    5_000¢ and stop invoicing this customer's usage without anyone asking it to; the cascade row above
    asserts exactly that 5_000¢, so the 3_000¢ between the two rows is the flag.

- id: b11/delete-charge/charge-filter
  block: B11
  axes: {operation: delete-charge, target: charge-filter}
  dimensions: {interval: monthly, billing_time: calendar, cascade_updates: true, filter_key: region}
  provenance: characterization
  characterization: true
  runners: [rspec, live]
  premium: true
  setup:
    metrics:
      - code: b11_delfilt_sum
        aggregation_type: sum_agg
        field_name: amount
        filters: [{key: region, values: ["eu", "us"]}]
    plan: {code: golden_b11_delete_filter, interval: monthly, amount_cents: 1000}
    charges:
      - billable_metric_code: b11_delfilt_sum
        charge_model: standard
        properties: {amount: "1"}
        filters:
          - invoice_display_name: EU region
            properties: {amount: "3"}
            values: {region: ["eu"]}
    customer: {external_id: golden_b11_delete_filter_cust, currency: EUR}
    subscription:
      external_id: golden_b11_delete_filter_sub
      billing_time: calendar
      plan_overrides: {amount_cents: 5000}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b11_delfilt_sum, properties: {amount: 30, region: "eu"}}
    - at: "2024-03-10T10:00:00Z"
      do: update_plan
      params: {charges: [], cascade_updates: true}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_count: 1
      fees_amount_cents: 5000
      total_amount_cents: 5000
      fees:
        - {fee_type: subscription, amount_cents: 5000}
  math: >-
    Deleting a charge takes its filters with it, on the child as well as the parent.
    Charges::DestroyService discards the charge and then stamps deleted_at on its filters and filter
    values with update_all, bypassing callbacks entirely
    (app/services/charges/destroy_service.rb:22-23); the cascade repeats the whole service on the
    child (app/services/charges/destroy_children_service.rb:19-21). The 30 units carrying region=eu,
    ingested five days before the deletion and priced at 3.00 by the inherited filter, therefore
    produce no fee at all: the April invoice is the overridden subscription fee alone, 5_000¢, one
    fee. fees_count is the load-bearing assertion here rather than the amount — a child filter that
    outlived its parent charge, or filter rows left un-stamped so Fees::ChargeService still iterated
    them, would add a 9_000¢ charge fee and a 14_000¢ total, and a filter surviving with its values
    stripped would add a 3_000¢ one. The amount alone cannot distinguish "no charge" from "a charge
    that aggregated nothing".

# ---------------------------------------------------------------------------------------------
# The three filter operations.
#
# Nothing above edits a charge FILTER after setup, which is why nine cells sat blocked. Filters are
# addressed by UUID, and a YAML row cannot know a UUID — so these rows drive the filter set as a
# REPLACEMENT ARRAY on PUT /plans/:code/charges/:code, resolving filters by their `values`. One verb
# therefore expresses all three operations: a `values` combination the child has not seen is a
# create, a known one with new `properties` is an update, and one absent from the array is a delete
# (ChargeFilters::CreateOrUpdateBatchService:57-78, and :227-234 for the empty-array case).
#
# Reading of the `target` axis for these three operations — it names WHICH part of the override the
# filter edit has to respect, because the edit itself is the same call in all three. All nine send
# cascade_updates: true, since a filter edit that is NOT cascaded cannot reach the child plan the
# subscription bills against and so cannot be observed on an invoice at all — the no-cascade half of
# that question is already pinned by b11/update-parent-no-cascade/charge-filter.
#
#   charge-filter        the child's own FILTER SET, in isolation. The charge's own properties are
#                        resent UNCHANGED, and every unit lands in the bucket the edit touches, so
#                        nothing but the filter can account for the number.
#   plan-override        the child's inherited CHARGE, edited in the SAME call. Properties go
#                        1.00 -> 7.00 alongside the filter edit and the units are split 20 eu / 10 us,
#                        so both halves of the cascade are on one invoice: Charges::UpdateChildrenService
#                        writes the child's charge properties and ChargeFilters::CascadeService writes
#                        its filter, and neither may overwrite the other's work.
#   subscription-override  the child plan's own amount_cents. The row re-reads GET /plans/:code to
#                        prove the edit went to a CHILD and left the parent's price alone.
#
# The charge-filter and subscription-override rows keep exactly ONE charge fee: all 30 units carry
# region=eu and the empty bucket has its zero fee rejected by should_persist_fee?
# (app/services/fees/charge_service.rb:68, :353). The plan-override rows deliberately keep TWO, which
# is why they assert fees_count and the totals rather than a `fees:` list — two fees of one charge
# share every identity key in FEE_MATCH_KEYS, so a per-fee list could not tell them apart.

- id: b11/filter-create/charge-filter
  block: B11
  axes: {operation: filter-create, target: charge-filter}
  dimensions: {interval: monthly, billing_time: calendar, cascade_updates: true, filter_key: region}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    metrics:
      - code: b11_fcre_cf_sum
        aggregation_type: sum_agg
        field_name: amount
        filters: [{key: region, values: ["eu", "us"]}]
    plan: {code: golden_b11_fcre_cf, interval: monthly, amount_cents: 1000}
    charges:
      - billable_metric_code: b11_fcre_cf_sum
        charge_model: standard
        properties: {amount: "1"}
    customer: {external_id: golden_b11_fcre_cf_cust, currency: EUR}
    subscription:
      external_id: golden_b11_fcre_cf_sub
      billing_time: calendar
      plan_overrides: {amount_cents: 5000}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-02T10:00:00Z"
      do: update_plan_charge
      charge:
        billable_metric_code: b11_fcre_cf_sum
        charge_model: standard
        properties: {amount: "1"}
        cascade_updates: true
        filters:
          - invoice_display_name: EU region
            properties: {amount: "3"}
            values: {region: ["eu"]}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b11_fcre_cf_sum, properties: {amount: 30, region: "eu"}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_count: 2
      fees_amount_cents: 14000
      total_amount_cents: 14000
      fees:
        - {fee_type: subscription, amount_cents: 5000}
        - {fee_type: charge, units: "30.0", amount_cents: 9000}
  math: >-
    The parent charge had no filters when the override duplicated it, so the child has none either.
    Sending a one-element `filters` array creates the eu filter on the parent
    (ChargeFilters::CreateOrUpdateBatchService:74, accumulate_new_filter), and because
    cascade_updates was sent, cascade_filter_changes diffs before=[] against after=[eu] and
    CascadeDispatcher enqueues a "create" job (app/services/charge_filters/cascade_dispatcher.rb:22-30),
    which ChargeFilters::CascadeService#create_child_filter runs against every child charge whose plan
    carries an active subscription (app/services/charge_filters/cascade_service.rb:99-125). The child
    therefore gains an eu filter priced at 3.00 that it never had, and the 30 units carrying region=eu
    are priced by it: 30 x 3.00 = 9_000¢ on top of the overridden 5_000¢ subscription fee = 14_000¢.
    A create that never reached the child leaves it filterless and the 30 units fall to the child
    charge's own 1.00 = 3_000¢ for an 8_000¢ total. The parent charge's own properties are resent
    UNCHANGED at 1.00 so that this row moves only if the FILTER moved — a charge-level cascade cannot
    account for the difference, which is what separates this row from
    b11/filter-create/plan-override, where the same call reprices the charge as well.

- id: b11/filter-create/plan-override
  block: B11
  axes: {operation: filter-create, target: plan-override}
  dimensions: {interval: monthly, billing_time: calendar, cascade_updates: true, filter_key: region}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    metrics:
      - code: b11_fcre_po_sum
        aggregation_type: sum_agg
        field_name: amount
        filters: [{key: region, values: ["eu", "us"]}]
    plan: {code: golden_b11_fcre_po, interval: monthly, amount_cents: 1000}
    charges:
      - billable_metric_code: b11_fcre_po_sum
        charge_model: standard
        properties: {amount: "1"}
    customer: {external_id: golden_b11_fcre_po_cust, currency: EUR}
    subscription:
      external_id: golden_b11_fcre_po_sub
      billing_time: calendar
      plan_overrides: {amount_cents: 5000}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-02T10:00:00Z"
      do: update_plan_charge
      charge:
        billable_metric_code: b11_fcre_po_sum
        charge_model: standard
        properties: {amount: "7"}
        cascade_updates: true
        filters:
          - invoice_display_name: EU region
            properties: {amount: "3"}
            values: {region: ["eu"]}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b11_fcre_po_sum, properties: {amount: 20, region: "eu"}}
        - {code: b11_fcre_po_sum, properties: {amount: 10, region: "us"}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_count: 3
      fees_amount_cents: 18000
      total_amount_cents: 18000
  math: >-
    One call creates a filter AND reprices the charge underneath it, and both halves of the cascade
    have to land on the same child. Charges::UpdateService captures the parent's old attributes before
    mutating it (app/services/charges/update_service.rb:22-24), so trigger_cascade enqueues
    Charges::UpdateChildrenJob with the NEW properties and the OLD parent for comparison; the child
    was still at 1.00, so `equal_properties: old_parent.equal_properties?(child_charge)` holds and
    Charges::UpdateChildrenService replaces its properties with 7.00
    (app/services/charges/update_children_service.rb:37, app/models/charge.rb:90-92). Separately,
    cascade_filter_changes diffs before=[] against after=[eu] and CascadeDispatcher enqueues a
    "create" (app/services/charge_filters/cascade_dispatcher.rb:22-30), which
    ChargeFilters::CascadeService#create_child_filter runs against the child
    (app/services/charge_filters/cascade_service.rb:99-125). The 20 eu units are therefore priced by
    the brand-new filter at 3.00 = 6_000¢ and the 10 us units by the newly-cascaded charge default at
    7.00 = 7_000¢ (the "events not matching any filters" bucket,
    app/services/fees/charge_service.rb:107-109), plus the overridden 5_000¢ subscription fee =
    18_000¢ across three fees. Every partial outcome is a different number: the filter not created
    prices all 30 units at 7.00 for 21_000¢ and a 26_000¢ total over two fees; the charge properties
    not cascaded gives 6_000 + 10 x 1.00 = 7_000¢ and 16_000¢; the filter created but swallowing the
    us traffic gives 30 x 3.00 = 9_000¢ and 14_000¢ over two fees. fees_count is asserted rather than
    a `fees:` list because the two charge fees share every FEE_MATCH_KEYS identity field.

- id: b11/filter-create/subscription-override
  block: B11
  axes: {operation: filter-create, target: subscription-override}
  dimensions: {interval: monthly, billing_time: calendar, cascade_updates: true, override_field: amount_cents}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    metrics:
      - code: b11_fcre_so_sum
        aggregation_type: sum_agg
        field_name: amount
        filters: [{key: region, values: ["eu", "us"]}]
    plan: {code: golden_b11_fcre_so, interval: monthly, amount_cents: 1000}
    charges:
      - billable_metric_code: b11_fcre_so_sum
        charge_model: standard
        properties: {amount: "1"}
    customer: {external_id: golden_b11_fcre_so_cust, currency: EUR}
    subscription:
      external_id: golden_b11_fcre_so_sub
      billing_time: calendar
      plan_overrides: {amount_cents: 2500}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-02T10:00:00Z"
      do: update_plan_charge
      charge:
        billable_metric_code: b11_fcre_so_sum
        charge_model: standard
        properties: {amount: "1"}
        cascade_updates: true
        filters:
          - invoice_display_name: EU region
            properties: {amount: "3"}
            values: {region: ["eu"]}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b11_fcre_so_sum, properties: {amount: 30, region: "eu"}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_count: 2
      fees_amount_cents: 11500
      total_amount_cents: 11500
      fees:
        - {fee_type: subscription, amount_cents: 2500}
        - {fee_type: charge, units: "30.0", amount_cents: 9000}
    resource:
      kind: plan
      fields: {amount_cents: 1000}
  math: >-
    A cascading filter creation must not disturb the plan-level override, and must not be applied to
    the parent's own subscribers by accident. The filter cascade only ever touches ChargeFilter rows
    (app/services/charge_filters/cascade_service.rb:83-125) — it never loads a Plan — so the child
    plan keeps the 2_500¢ Plans::OverrideService wrote onto the copy
    (app/services/plans/override_service.rb:19-29) and GET /plans/golden_b11_fcre_so, which the
    controller scopes to `.parents` (app/controllers/api/v1/plans_controller.rb:52), still reports
    1_000¢. The eu filter reaches the child as in the charge-filter row, so usage is 30 x 3.00 =
    9_000¢ and the total is 2_500 + 9_000 = 11_500¢. The resource assertion is the load-bearing half:
    an implementation that reached the child by repricing the PARENT plan's charge and letting every
    subscriber inherit it would still bill 11_500¢ here while moving every other customer on the
    plan. An override lost to the cascade would bill 1_000 + 9_000 = 10_000¢.

- id: b11/filter-update/charge-filter
  block: B11
  axes: {operation: filter-update, target: charge-filter}
  dimensions: {interval: monthly, billing_time: calendar, cascade_updates: true, filter_key: region}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    metrics:
      - code: b11_fupd_cf_sum
        aggregation_type: sum_agg
        field_name: amount
        filters: [{key: region, values: ["eu", "us"]}]
    plan: {code: golden_b11_fupd_cf, interval: monthly, amount_cents: 1000}
    charges:
      - billable_metric_code: b11_fupd_cf_sum
        charge_model: standard
        properties: {amount: "1"}
        filters:
          - invoice_display_name: EU region
            properties: {amount: "3"}
            values: {region: ["eu"]}
    customer: {external_id: golden_b11_fupd_cf_cust, currency: EUR}
    subscription:
      external_id: golden_b11_fupd_cf_sub
      billing_time: calendar
      plan_overrides: {amount_cents: 5000}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-02T10:00:00Z"
      do: update_plan_charge
      charge:
        billable_metric_code: b11_fupd_cf_sum
        charge_model: standard
        properties: {amount: "1"}
        cascade_updates: true
        filters:
          - invoice_display_name: EU region
            properties: {amount: "5"}
            values: {region: ["eu"]}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b11_fupd_cf_sum, properties: {amount: 30, region: "eu"}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_count: 2
      fees_amount_cents: 20000
      total_amount_cents: 20000
      fees:
        - {fee_type: subscription, amount_cents: 5000}
        - {fee_type: charge, units: "30.0", amount_cents: 15000}
  math: >-
    Repricing an EXISTING filter, as opposed to the charge's own properties, which is what
    b11/update-parent-cascade/charge-filter already covers and which moved nothing. The replacement
    array names the same `values` as the filter already on the charge, so CreateOrUpdateBatchService
    resolves it through filters_by_values_key and UPDATES it rather than creating a second one
    (app/services/charge_filters/create_or_update_batch_service.rb:63-71). CascadeDispatcher sees the
    same values with different properties and enqueues "update" carrying both the old and the new
    properties (app/services/charge_filters/cascade_dispatcher.rb:18-30).
    ChargeFilters::CascadeService#update_child_filter then checks whether the child had DIVERGED —
    `filter_customized?` compares old_properties against the child's
    (app/services/charge_filters/cascade_service.rb:148-152) — and this child's filter is the verbatim
    duplicate Charges::OverrideService made of the parent's, still at 3.00, so it is overwritten to
    5.00. 30 units of eu traffic x 5.00 = 15_000¢ plus the overridden 5_000¢ = 20_000¢. A cascade
    that wrongly judged the child customized would leave it at 3.00: 9_000¢ and a 14_000¢ total, and
    an "update" that created a SECOND filter instead of resolving the existing one by its values would
    double the eu bucket. The charge's own properties are resent unchanged at 1.00, so only the filter
    can account for this row's amount.

- id: b11/filter-update/plan-override
  block: B11
  axes: {operation: filter-update, target: plan-override}
  dimensions: {interval: monthly, billing_time: calendar, cascade_updates: true, filter_key: region}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    metrics:
      - code: b11_fupd_po_sum
        aggregation_type: sum_agg
        field_name: amount
        filters: [{key: region, values: ["eu", "us"]}]
    plan: {code: golden_b11_fupd_po, interval: monthly, amount_cents: 1000}
    charges:
      - billable_metric_code: b11_fupd_po_sum
        charge_model: standard
        properties: {amount: "1"}
        filters:
          - invoice_display_name: EU region
            properties: {amount: "3"}
            values: {region: ["eu"]}
    customer: {external_id: golden_b11_fupd_po_cust, currency: EUR}
    subscription:
      external_id: golden_b11_fupd_po_sub
      billing_time: calendar
      plan_overrides: {amount_cents: 5000}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-02T10:00:00Z"
      do: update_plan_charge
      charge:
        billable_metric_code: b11_fupd_po_sum
        charge_model: standard
        properties: {amount: "7"}
        cascade_updates: true
        filters:
          - invoice_display_name: EU region
            properties: {amount: "5"}
            values: {region: ["eu"]}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b11_fupd_po_sum, properties: {amount: 20, region: "eu"}}
        - {code: b11_fupd_po_sum, properties: {amount: 10, region: "us"}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_count: 3
      fees_amount_cents: 22000
      total_amount_cents: 22000
  math: >-
    The filter is repriced 3.00 -> 5.00 and the charge under it 1.00 -> 7.00 in one call, and the two
    cascades write different rows on the same child: Charges::UpdateChildrenService the charge's
    properties, ChargeFilters::CascadeService the filter's. The "update" job carries the parent's OLD
    filter properties so the child can be checked for divergence
    (app/services/charge_filters/cascade_dispatcher.rb:22-30); this child's filter is the verbatim
    duplicate Charges::OverrideService made (app/services/charges/override_service.rb:26-30), still at
    3.00, so filter_customized? is false and it is overwritten to 5.00
    (app/services/charge_filters/cascade_service.rb:85-97, 148-152). 20 eu units x 5.00 = 10_000¢,
    10 us units x 7.00 = 7_000¢, overridden subscription fee 5_000¢ = 22_000¢ over three fees. The
    row separates four outcomes that a single-bucket row cannot: neither cascade landing gives
    20 x 3 + 10 x 1 = 7_000¢ and 12_000¢; only the charge cascade landing gives 6_000 + 7_000 =
    13_000¢ and 18_000¢; only the filter cascade landing gives 10_000 + 1_000 = 11_000¢ and 16_000¢;
    and a filter wrongly judged customized would leave the eu units at 3.00 for 18_000¢ — the same
    total as "the filter edit never happened", which is why the charge half is repriced too rather
    than resent unchanged.

- id: b11/filter-update/subscription-override
  block: B11
  axes: {operation: filter-update, target: subscription-override}
  dimensions: {interval: monthly, billing_time: calendar, cascade_updates: true, override_field: amount_cents}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    metrics:
      - code: b11_fupd_so_sum
        aggregation_type: sum_agg
        field_name: amount
        filters: [{key: region, values: ["eu", "us"]}]
    plan: {code: golden_b11_fupd_so, interval: monthly, amount_cents: 1000}
    charges:
      - billable_metric_code: b11_fupd_so_sum
        charge_model: standard
        properties: {amount: "1"}
        filters:
          - invoice_display_name: EU region
            properties: {amount: "3"}
            values: {region: ["eu"]}
    customer: {external_id: golden_b11_fupd_so_cust, currency: EUR}
    subscription:
      external_id: golden_b11_fupd_so_sub
      billing_time: calendar
      plan_overrides: {amount_cents: 2500}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-02T10:00:00Z"
      do: update_plan_charge
      charge:
        billable_metric_code: b11_fupd_so_sum
        charge_model: standard
        properties: {amount: "1"}
        cascade_updates: true
        filters:
          - invoice_display_name: EU region
            properties: {amount: "5"}
            values: {region: ["eu"]}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b11_fupd_so_sum, properties: {amount: 30, region: "eu"}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_count: 2
      fees_amount_cents: 17500
      total_amount_cents: 17500
      fees:
        - {fee_type: subscription, amount_cents: 2500}
        - {fee_type: charge, units: "30.0", amount_cents: 15000}
    resource:
      kind: plan
      fields: {amount_cents: 1000}
  math: >-
    The filter reprice cascades to the child exactly as in the charge-filter row — 30 x 5.00 =
    15_000¢ — while the negotiated 2_500¢ subscription fee is untouched, giving 17_500¢. The
    subscription fee lives on the child PLAN's amount_cents and the filter cascade only ever writes
    ChargeFilter rows (app/services/charge_filters/cascade_service.rb:83-125), so nothing in this path
    can reach it; GET /plans/golden_b11_fupd_so is asserted at 1_000¢ to show the edit also stayed off
    the parent, which the controller's `.parents` scope
    (app/controllers/api/v1/plans_controller.rb:52) is what makes observable. Two failures this pins
    that the invoice alone cannot: an override folded back into the parent plan reads 2_500¢ from GET
    /plans while billing the same 17_500¢, and a cascade that reset the child plan's amount to the
    parent's would bill 1_000 + 15_000 = 16_000¢.

- id: b11/filter-delete/charge-filter
  block: B11
  axes: {operation: filter-delete, target: charge-filter}
  dimensions: {interval: monthly, billing_time: calendar, cascade_updates: true, filter_key: region}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    metrics:
      - code: b11_fdel_cf_sum
        aggregation_type: sum_agg
        field_name: amount
        filters: [{key: region, values: ["eu", "us"]}]
    plan: {code: golden_b11_fdel_cf, interval: monthly, amount_cents: 1000}
    charges:
      - billable_metric_code: b11_fdel_cf_sum
        charge_model: standard
        properties: {amount: "1"}
        filters:
          - invoice_display_name: EU region
            properties: {amount: "3"}
            values: {region: ["eu"]}
    customer: {external_id: golden_b11_fdel_cf_cust, currency: EUR}
    subscription:
      external_id: golden_b11_fdel_cf_sub
      billing_time: calendar
      plan_overrides: {amount_cents: 5000}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-02T10:00:00Z"
      do: update_plan_charge
      charge:
        billable_metric_code: b11_fdel_cf_sum
        charge_model: standard
        properties: {amount: "1"}
        cascade_updates: true
        filters: []
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b11_fdel_cf_sum, properties: {amount: 30, region: "eu"}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_count: 2
      fees_amount_cents: 8000
      total_amount_cents: 8000
      fees:
        - {fee_type: subscription, amount_cents: 5000}
        - {fee_type: charge, units: "30.0", amount_cents: 3000}
  math: >-
    An EMPTY replacement array is the delete: CreateOrUpdateBatchService short-circuits to remove_all,
    which stamps deleted_at on every filter value and discards the filter
    (app/services/charge_filters/create_or_update_batch_service.rb:24-28, 227-237). CascadeDispatcher
    then finds an entry in `before` with no counterpart in `after` and enqueues "destroy"
    (app/services/charge_filters/cascade_dispatcher.rb:33-43), which CascadeService#destroy_child_filter
    applies to the child's copy (app/services/charge_filters/cascade_service.rb:139-144). The child
    charge is left with no kept filters, so Fees::ChargeService takes its `unless charge.filters.any?`
    branch (app/services/fees/charge_service.rb:97) and the 30 units of eu traffic, previously priced
    at 3.00 by the inherited filter, fall to the charge's own 1.00: 3_000¢ plus the overridden
    5_000¢ = 8_000¢. This is the operationally dangerous direction of the three — deleting a filter
    makes usage CHEAPER rather than erroring — and it is why fees_count is asserted with the amount: a
    child filter that survived un-stamped would still price 9_000¢ for a 14_000¢ total, and a filter
    whose row survived with its values stripped would add a second, empty bucket.

- id: b11/filter-delete/plan-override
  block: B11
  axes: {operation: filter-delete, target: plan-override}
  dimensions: {interval: monthly, billing_time: calendar, cascade_updates: true, filter_key: region}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    metrics:
      - code: b11_fdel_po_sum
        aggregation_type: sum_agg
        field_name: amount
        filters: [{key: region, values: ["eu", "us"]}]
    plan: {code: golden_b11_fdel_po, interval: monthly, amount_cents: 1000}
    charges:
      - billable_metric_code: b11_fdel_po_sum
        charge_model: standard
        properties: {amount: "1"}
        filters:
          - invoice_display_name: EU region
            properties: {amount: "3"}
            values: {region: ["eu"]}
    customer: {external_id: golden_b11_fdel_po_cust, currency: EUR}
    subscription:
      external_id: golden_b11_fdel_po_sub
      billing_time: calendar
      plan_overrides: {amount_cents: 5000}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-02T10:00:00Z"
      do: update_plan_charge
      charge:
        billable_metric_code: b11_fdel_po_sum
        charge_model: standard
        properties: {amount: "7"}
        cascade_updates: true
        filters: []
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b11_fdel_po_sum, properties: {amount: 20, region: "eu"}}
        - {code: b11_fdel_po_sum, properties: {amount: 10, region: "us"}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_count: 2
      fees_amount_cents: 26000
      total_amount_cents: 26000
      fees:
        - {fee_type: subscription, amount_cents: 5000}
        - {fee_type: charge, units: "30.0", amount_cents: 21000}
  math: >-
    Deleting the only filter COLLAPSES the two buckets into one, which is why this row asserts a fee
    list where its two siblings cannot. The empty replacement array sends
    CreateOrUpdateBatchService to remove_all on the parent
    (app/services/charge_filters/create_or_update_batch_service.rb:24-28, 227-237), CascadeDispatcher
    finds a `before` entry with no counterpart in `after` and enqueues "destroy"
    (app/services/charge_filters/cascade_dispatcher.rb:33-43), and
    CascadeService#destroy_child_filter discards the child's copy and stamps its values
    (app/services/charge_filters/cascade_service.rb:139-144). The child charge is left with no kept
    filters — Charge/ChargeFilter both carry a `kept` default scope — so Fees::ChargeService takes its
    `unless charge.filters.any?` branch (app/services/fees/charge_service.rb:97) and prices ALL 30
    units, eu and us alike, from the properties the same call cascaded down: 30 x 7.00 = 21_000¢ plus
    the overridden 5_000¢ = 26_000¢ in two fees. The three failure modes are all distinguishable:
    a filter surviving on the child gives 20 x 3 + 10 x 7 = 13_000¢ and 18_000¢ over THREE fees; the
    charge properties not cascading gives 30 x 1.00 = 3_000¢ and 8_000¢; a filter whose row survived
    with its values stripped adds a third, empty bucket. Note the direction, which is the reason the
    cell is worth a row at all: deleting a filter here makes eu traffic MORE expensive, because the
    default it falls back on is dearer than the filter was.

- id: b11/filter-delete/subscription-override
  block: B11
  axes: {operation: filter-delete, target: subscription-override}
  dimensions: {interval: monthly, billing_time: calendar, cascade_updates: true, override_field: amount_cents}
  provenance: coverage-gap
