    (app/services/charge_filters/cascade_service.rb:139-144), so neither the child plan's amount_cents
    nor the parent plan can move — GET /plans/golden_b11_fdel_so is asserted at 1_000¢ to show the
    whole operation stayed inside the child. The three numbers are separable on purpose: an override
    lost to the cascade bills 1_000 + 3_000 = 4_000¢, a filter that survived the cascade bills
    2_500 + 9_000 = 11_500¢, and both leave GET /plans reading 1_000¢ — only asserting the
    subscription fee and the parent plan together tells the two apart.
