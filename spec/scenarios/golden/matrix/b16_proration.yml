    - at: "2024-03-22T10:00:00Z"
      do: ingest_events
      events: [{code: b16_grad_uc, properties: {seat_id: seat_2}}]
    - at: "2024-03-22T11:00:00Z"
      do: ingest_events
      events: [{code: b16_grad_uc, properties: {seat_id: seat_3}}]
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      status: finalized
      fees_amount_cents: 6100
      taxes_amount_cents: 0
      total_amount_cents: 6100
      fees_count: 2
      fees:
        - {fee_type: subscription, amount_cents: 0}
        - fee_type: charge
          units: "3.0"
          amount_cents: 6100
          from_date: "2024-03-01T00:00:00Z"
          to_date: "2024-03-31T23:59:59Z"
  math: >-
    Same machinery as b16/graduated/sum_agg/false, fed by the unique-count breakdown instead:
    ProratedAggregations::UniqueCountService#per_event_aggregation
    (unique_count_service.rb:104-124) returns full = [1, 1, 1] — one per relevant `add`, -1 for a
    relevant `remove` — and prorated = the per-seat day fractions from
    prorated_unique_count_breakdown, each ceiled to 5 decimals: seat_1 21/31 → 0.67742, seat_2 and
    seat_3 10/31 → 0.32259, ordered by timestamp then property.
    ProratedGraduatedService then tiers by the FULL count and prices by the PRORATED one
    (prorated_graduated_service.rb:11-94). Tier 1 holds one seat, so seat_1's 0.67742 is priced at
    31.00 → 21.00002; seat_2 and seat_3 fall in tier 2, and the trailing line :91 prices their
    0.32259 + 0.32259 = 0.64518 at 62.00 → 40.00116. Total 61.00118, rounded to the currency's two
    decimals (charge_service.rb:296-300) → 61.00 → 6_100¢, against `units: 3`.
    The tier boundary at 1 seat is what makes the row informative: the first seat is priced at the
    cheap tier even though it is the one present LONGEST, because the tier follows arrival order and
    not duration.
    Tiering the prorated total (41/31 ≈ 1.32259) instead would put 1 seat in tier 1 and 0.32259 in
    tier 2 → 31.00 + 20.00 = 51.00 → 5_100¢. Ignoring proration → 1 × 31.00 + 2 × 62.00 = 155.00 →
    15_500¢. Neither is 6_100¢.

- id: b16/volume/sum_agg/false
  block: B16
  axes: {charge_model: volume, aggregation: sum_agg, pay_in_advance: 'false'}
  dimensions:
    recurring: true
    prorated: true
    interval: monthly
    billing_time: calendar
    plan_pay_in_advance: false
    period_days: 31
  provenance: coverage-gap
  runners: [rspec]
  calendar_sensitive: true
  setup:
    metrics: [{code: b16_vol_sum, aggregation_type: sum_agg, field_name: units, recurring: true}]
    plan: {code: golden_b16_vol_sum, interval: monthly, amount_cents: 0, pay_in_advance: false}
    charges:
      - billable_metric_code: b16_vol_sum
        charge_model: volume
        prorated: true
        properties:
          volume_ranges:
            - {from_value: 0, to_value: 50, per_unit_amount: "1", flat_amount: "0"}
            - {from_value: 51, to_value: null, per_unit_amount: "2", flat_amount: "0"}
    customer: {external_id: golden_b16_vol_sum_cust, currency: EUR}
    subscription: {external_id: golden_b16_vol_sum_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-11T10:00:00Z"
      do: ingest_events
      events: [{code: b16_vol_sum, properties: {units: 31}}]
    - at: "2024-03-22T10:00:00Z"
      do: ingest_events
      events: [{code: b16_vol_sum, properties: {units: 62}}]
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      status: finalized
      fees_amount_cents: 8200
      taxes_amount_cents: 0
      total_amount_cents: 8200
      fees_count: 2
      fees:
        - {fee_type: subscription, amount_cents: 0}
        - fee_type: charge
          units: "93.0"
          events_count: 2
          amount_cents: 8200
          from_date: "2024-03-01T00:00:00Z"
          to_date: "2024-03-31T23:59:59Z"
  math: >-
    There is no ProratedVolumeService: ChargeModels::Factory:52-53 always returns VolumeService,
    which handles proration in one line — `number_of_units` is `full_units_number` when the charge is
    prorated (volume_service.rb:62-64) and is used to pick the tier and nothing else, while
    `per_unit_total_amount` multiplies the PRORATED `units` by that tier's rate
    (volume_service.rb:52-54).
    So the tier is chosen by the 93 un-prorated units — 93 > 50, so tier 2 at 2.00 — and the 41
    prorated units (31 × 21/31 + 62 × 10/31 = 21 + 20, postgres_store.rb:301-315) are all priced
    there: 41 × 2.00 = 82.00, plus tier 2's flat amount of 0 → 8_200¢. `units` on the fee is again
    the un-prorated 93 (charge_service.rb:302-307).
    The 50-unit boundary is deliberately between the prorated total (41) and the full total (93), so
    the two candidate readings disagree: choosing the tier from the PRORATED units would land in
    tier 1 and give 41 × 1.00 = 41.00 → 4_100¢. Ignoring proration altogether gives 93 × 2.00 =
    186.00 → 18_600¢. Volume, unlike graduated, prices every unit at the single tier reached, so
    a graduated reading of the same ranges would give 50 × 1.00 + 43 × 2.00 = 136.00 on full units.
    Only "tier from full units, quantity prorated" gives 8_200¢.

- id: b16/volume/unique_count_agg/false
  block: B16
  axes: {charge_model: volume, aggregation: unique_count_agg, pay_in_advance: 'false'}
  dimensions:
    recurring: true
    prorated: true
    interval: monthly
    billing_time: calendar
    plan_pay_in_advance: false
    period_days: 31
    flat_amount: 10
  provenance: coverage-gap
  runners: [rspec]
  calendar_sensitive: true
  setup:
    metrics: [{code: b16_vol_uc, aggregation_type: unique_count_agg, field_name: seat_id, recurring: true}]
    plan: {code: golden_b16_vol_uc, interval: monthly, amount_cents: 0, pay_in_advance: false}
    charges:
      - billable_metric_code: b16_vol_uc
        charge_model: volume
        prorated: true
        properties:
          volume_ranges:
            - {from_value: 0, to_value: 2, per_unit_amount: "31", flat_amount: "0"}
            - {from_value: 3, to_value: null, per_unit_amount: "62", flat_amount: "10"}
    customer: {external_id: golden_b16_vol_uc_cust, currency: EUR}
    subscription: {external_id: golden_b16_vol_uc_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-11T10:00:00Z"
      do: ingest_events
      events: [{code: b16_vol_uc, properties: {seat_id: seat_1}}]
    - at: "2024-03-22T10:00:00Z"
      do: ingest_events
      events: [{code: b16_vol_uc, properties: {seat_id: seat_2}}]
    - at: "2024-03-22T11:00:00Z"
      do: ingest_events
      events: [{code: b16_vol_uc, properties: {seat_id: seat_3}}]
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      status: finalized
      fees_amount_cents: 9200
      taxes_amount_cents: 0
      total_amount_cents: 9200
      fees_count: 2
      fees:
        - {fee_type: subscription, amount_cents: 0}
        - fee_type: charge
          units: "3.0"
          amount_cents: 9200
          from_date: "2024-03-01T00:00:00Z"
          to_date: "2024-03-31T23:59:59Z"
  math: >-
    Same VolumeService reading as b16/volume/sum_agg/false — tier from `number_of_units` =
    full_units_number, quantity from the prorated `units` (volume_service.rb:52-64) — plus the half
    of compute_amount the other volume row leaves at zero: the tier's FLAT amount is added whole,
    un-prorated (`compute_amount` = per_unit_total_amount + flat_unit_amount,
    volume_service.rb:11-13 and :44-46).
    3 un-prorated seats (unique_count_service.rb:23) select tier 2, from_value 3. The prorated
    aggregation is (21 + 10 + 10)/31 = 41/31, ceiled to 1.32259
    (unique_count_query.rb:302-329, unique_count_service.rb:22), priced at 62.00 →
    82.00058, plus the flat 10.00 → 92.00058, rounded to two decimals
    (charge_service.rb:296-300) → 92.00 → 9_200¢.
    That the flat fee is NOT prorated is the specific thing this row records: a subscriber who
    reached tier 2 for the last 10 days of the month still pays its full entry fee. Prorating the
    flat amount as well would give 82.00 + 10.00 × 41/93 ≈ 86.41 → 8_641¢.
    Choosing the tier from the prorated units instead would use `number_of_units.ceil` = 2 → tier 1
    → 1.32259 × 31.00 = 41.00029 → 4_100¢. Ignoring proration gives 3 × 62.00 + 10.00 = 196.00 →
    19_600¢. Neither is 9_200¢.
