    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 4
    invoice:
      - select: {index: 0}
        fees_amount_cents: 10000
        total_amount_cents: 10000
      - select: {index: 2}
        fees_count: 1
        fees_amount_cents: 5000
        total_amount_cents: 5000
        fees:
          - {fee_type: charge, units: "50.0", amount_cents: 5000}
    preview:
      fees_count: 1
      fees_amount_cents: 5000
      sub_total_excluding_taxes_amount_cents: 5000
      total_amount_cents: 5000
  math: >-
    CHARACTERIZATION, and the row that pins this surface as STRUCTURALLY BLIND to the whole column.
    The preview is taken on 25 March, a week after the replacement has already over-billed 5_000¢. It
    is a projection of March (`billing_time` = `end_of_periods.first + 1.day`,
    preview_service.rb:141-151), so it is a forecast of the very period the advance fees belong to.
    `Invoices::PreviewService#add_charge_fees` filters the plan's charges with the same two clauses
    CalculateFeesService uses — `.where(invoiceable: true)` and
    `.where.not(pay_in_advance: true, billable_metric: {recurring: false})` (preview_service.rb:184-192)
