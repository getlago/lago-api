    customer: {external_id: golden_b20_w1_sor_cust, currency: EUR}
    subscription: {external_id: golden_b20_w1_sor_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w1_sor_sum, properties: {amount: 100}}]
    - {at: "2024-03-05T11:00:00Z", do: perform_usage_update}
    - at: "2024-03-06T10:00:00Z"
      do: update_customer
      params: {invoice_grace_period: 5}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - at: "2024-04-02T10:00:00Z"
      do: update_subscription_fixed_charge
      fixed_charge:
        add_on_code: b20_w1_sor_seat
        units: 1
        properties: {amount: "0"}
    - {at: "2024-04-03T10:00:00Z", do: refresh_invoice, select: {invoice_type: subscription}}
  expect:
    invoices: 2
    invoice:
      - select: {invoice_type: progressive_billing}
        fees_amount_cents: 10000
        total_amount_cents: 10000
      - select: {invoice_type: subscription}
        status: draft
        fees_amount_cents: 10000
        progressive_billing_credit_amount_cents: 0
        credit_notes_amount_cents: 0
        sub_total_excluding_taxes_amount_cents: 10000
        total_amount_cents: 10000
    credit_note:
      select: {index: -1}
      credit_amount_cents: 10000
      total_amount_cents: 10000
      balance_amount_cents: 10000
  math: >-
    CHARACTERIZATION, and the sequence in which a working draft is broken by a refresh whose only
    trigger was a no-op price update on an unrelated fixed charge.
    The March period draft is created on 1 April while the plan is still the original, so its charge
    fee shares the threshold fee's charge_id, the cap matches, 10_000¢ is credited and the draft sits
    at 0¢. On 2 April the fixed charge is updated with its own units and its own price — nothing
    changes — but because `properties` was sent the request clones the plan and every charge on it. On
    the 3rd the draft is refreshed.
    RefreshDraftService destroys the fees and
    `invoice.credits.progressive_billing_invoice_kind`, zeroes
    progressive_billing_credit_amount_cents, and re-runs CalculateFeesService against
    `subscription.plan.charges` — now the clone's. The threshold invoice's `to_credit_amount` is back to
    the full 10_000¢ (the credit that had netted it down was just destroyed, and no note existed yet),
    the cap misses, and the whole amount is diverted into a credit note the draft may not spend.
    THE DRAFT GOES FROM 0¢ TO 10_000¢ AND A 10_000¢ CREDIT NOTE APPEARS. The credit note is asserted
    with `select: {index: -1}` — without a selector expect.credit_note reads a creation-time payload
    this row never produced — and its 10_000¢ balance is the positive evidence that the threshold money
    existed and was diverted rather than never collected.
    THE CONTROL IS b20/plan-upgrade/progressive_billing_credit/regenerated: identical refresh, identical
    threshold, charge_id rewritten by an upgrade, and the draft comes back at 0. The refresh is when the
    rewritten id is first consulted, not the cause.

- id: b20/subscription-override/progressive_billing_credit/preview
  block: B20
  axes: {churn: subscription-override, carried_state: progressive_billing_credit, observed_via: preview}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, threshold_amount_cents: 5000}
  provenance: coverage-gap
  characterization: true
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  no_transaction: true
  setup:
    organization: {premium_integrations: [progressive_billing, preview]}
    add_ons: [{code: b20_w1_sop_seat, name: Seat, amount_cents: 20000}]
    metrics: [{code: b20_w1_sop_sum, aggregation_type: sum_agg, field_name: amount}]
    plan:
      code: golden_b20_w1_sop
      interval: monthly
      amount_cents: 0
      usage_thresholds: [{amount_cents: 5000}]
    charges: [{billable_metric_code: b20_w1_sop_sum, charge_model: standard, properties: {amount: "1"}}]
    fixed_charges:
      - add_on_code: b20_w1_sop_seat
        charge_model: standard
        units: 1
        pay_in_advance: false
        prorated: false
        properties: {amount: "0"}
    customer: {external_id: golden_b20_w1_sop_cust, currency: EUR}
    subscription: {external_id: golden_b20_w1_sop_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w1_sop_sum, properties: {amount: 100}}]
    - {at: "2024-03-05T11:00:00Z", do: perform_usage_update}
    - at: "2024-03-10T10:00:00Z"
      do: update_subscription_fixed_charge
      fixed_charge:
        add_on_code: b20_w1_sop_seat
        units: 1
        properties: {amount: "0"}
    - {at: "2024-03-25T10:00:00Z", do: preview_invoice}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {invoice_type: progressive_billing}
        fees_amount_cents: 10000
        total_amount_cents: 10000
      - select: {invoice_type: subscription}
        fees_amount_cents: 10000
        progressive_billing_credit_amount_cents: 0
        credit_notes_amount_cents: 10000
        total_amount_cents: 0
    preview:
      fees_amount_cents: 10000
      progressive_billing_credit_amount_cents: 0
      sub_total_excluding_taxes_amount_cents: 10000
      total_amount_cents: 10000
  math: >-
    CHARACTERIZATION. The quote and the bill disagree by the whole progressively billed amount, and the
    quote is the honest one.
    Invoices::PreviewService keeps its own copy of the cap, keyed on the same column:
    `billed_charge_ids = progressive_invoice.fees.charge.pluck(:charge_id)` then
    `next 0 unless billed_charge_ids.include?(fee.charge_id)` (preview_service.rb:346-352). After the
    10 March fixed-charge update cloned the plan, the previewed fee carries the clone's charge_id, the
    include? is false, `creditable_amount_cents` is 0 and `amount_cents = [10_000, 0].min` is dropped
    by `next unless amount_cents.positive?`.
    A preview may not issue a credit note — the comment at :344-345 says the excess is simply dropped —
    so there is no second spelling of the money here. The customer is quoted 10_000¢ on a period for
    which 10_000¢ has already been taken, which is exactly the overstatement the comment at :324-329
    says this code exists to prevent, and the 1 May invoice asserted beside it settles at 0 by spending
    a credit note instead. Same lost join, two disguises: the invoice hides it and the preview does not.
    THE CONTROL IS b20/plan-upgrade/progressive_billing_credit/preview — same preview code, same
    threshold, charge_id rewritten by an upgrade — where the credit is found and both surfaces read 0.
    The previewed period has usage by construction (100 units on 5 March, previewed on the 25th);
    Invoices::PreviewService raises a 500 on a charge with no usage in the period, so a preview row that
    dies rather than disagrees is that, not this.

# ---------------------------------------------------------------------------------------------
# commitment_progress x plan-upgrade — plan_id again, and the one churn that PRORATES the floor
# instead of dropping it.
#
# Both plans price at amount_cents 0, so no subscription fee is ever prorated and every number below
# is usage plus the true-up that tops it up to the floor.

- id: b20/plan-upgrade/commitment_progress/invoice
  block: B20
  axes: {churn: plan-upgrade, carried_state: commitment_progress, observed_via: invoice}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, commitment_amount_cents: 30000, upgrade_day: 16}
  provenance: coverage-gap
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  setup:
    metrics: [{code: b20_w1_mui_sum, aggregation_type: sum_agg, field_name: amount}]
    plan:
      code: golden_b20_w1_mui_a
      interval: monthly
      amount_cents: 0
      minimum_commitment: {amount_cents: 30000}
    plans:
      - code: golden_b20_w1_mui_b
        interval: monthly
        amount_cents: 0
        charges:
          - {billable_metric_code: b20_w1_mui_sum, charge_model: standard, properties: {amount: "2"}}
    charges: [{billable_metric_code: b20_w1_mui_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b20_w1_mui_cust, currency: EUR}
    subscription: {external_id: golden_b20_w1_mui_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w1_mui_sum, properties: {amount: 30}}]
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - at: "2024-04-05T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w1_mui_sum, properties: {amount: 30}}]
    - at: "2024-04-16T10:00:00Z"
      do: create_subscription
      params: {plan_code: golden_b20_w1_mui_b}
    - {at: "2024-04-16T10:01:00Z", do: perform_billing}
    - at: "2024-04-20T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w1_mui_sum, properties: {amount: 40}}]
    - {at: "2024-05-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 3
    invoice:
      - select: {index: 0}
        fees_amount_cents: 30000
        fees_count: 3
        total_amount_cents: 30000
        fees:
          - {fee_type: charge, units: "30.0", amount_cents: 3000}
          - {fee_type: commitment, amount_cents: 27000}
      - select: {index: 1}
        fees_amount_cents: 16000
        fees_count: 3
        total_amount_cents: 16000
        fees:
          - {fee_type: charge, units: "30.0", amount_cents: 3000}
          - {fee_type: commitment, amount_cents: 13000}
      - select: {index: 2}
        fees_amount_cents: 8000
        fees_count: 2
        total_amount_cents: 8000
        fees:
          - {fee_type: charge, units: "40.0", amount_cents: 8000}
  math: >-
    An upgrade does not lose the commitment — it PRORATES it and then leaves it behind, and the two
    halves of that sentence are the two invoices in the middle and at the end.
    March (index 0) is the whole-period control: 30 units x 1.00 = 3_000¢ against a 30_000¢ floor, so
    Commitments::Minimum::InArrears::CalculateTrueUpFeeService raises 27_000¢
    (`commitment_amount_cents - fees_total_amount_cents`, calculate_true_up_fee_service.rb:37-41) and
    the invoice reads 30_000¢. The coefficient is 1 because the period is whole.
    The 16 April termination invoice (index 1) prorates the FLOOR, not just the usage.
    Commitments::CalculateAmountService multiplies the commitment by
    Commitments::CalculateProratedCoefficientService's days/days_total, and both are computed with
    `Utils::Datetime.date_diff_with_timezone`, which is `(to - from).fdiv(1.day).ceil`
    (utils/datetime.rb:55-69):
      days       = ceil((2024-04-16 10:00 − 2024-04-01 00:00) / 1d) = ceil(15.42) = 16
      days_total = ceil((2024-04-30 23:59:59 − 2024-04-01 00:00) / 1d) = ceil(29.99) = 30
    30_000 x 16/30 = 16_000¢, and the usage inside the terminated period is 30 units x 1.00 = 3_000¢,
    so the true-up is 13_000¢ and the invoice reads 16_000¢.
    Note WHICH date service produces those bounds, because it is not the obvious one:
    Subscriptions::TerminatedDatesService returns its input unchanged when
    `subscription.next_subscription.present?` (terminated_dates_service.rb:12), and on an upgrade the
    next subscription is exactly what was just created. So the bounds are the CURRENT period's
    (1–30 April, `current_usage: true` for a terminated non-downgraded arrears subscription), not the
    terminated stub's. Had they been the terminated bounds, days_total would also be 16, the
    coefficient 1, and this invoice would read 30_000¢ with a 27_000¢ true-up.
    Plan B's own first period (index 2, 16–30 April) has NO floor at all: 40 units x 2.00 = 8_000¢,
    two fees, no commitment fee. Every lookup in the calculator is scoped by `subscription_id`
    (calculate_true_up_fee_service.rb, in_arrears/*), but it never runs, because the commitment is
    reached only through `subscription.plan.minimum_commitment` and B has none.
    THE THREE NUMBERS ARE 30_000 / 16_000 / 8_000 and each has a named counterfactual: 30_000¢ on
    index 1 if the proration used the terminated bounds, 3_000¢ if the commitment were looked up
    through the new subscription's plan, and 10_000¢ on index 2 if a floor of 30_000 x 14/30 followed
    the upgrade. fees_count is asserted throughout because the per-fee split is the only thing that
    says whether a total is usage or a true-up.

- id: b20/plan-upgrade/commitment_progress/draft
  block: B20
  axes: {churn: plan-upgrade, carried_state: commitment_progress, observed_via: draft}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, commitment_amount_cents: 30000, upgrade_day: 16, grace_period: 5}
  provenance: coverage-gap
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  setup:
    metrics: [{code: b20_w1_mud_sum, aggregation_type: sum_agg, field_name: amount}]
    plan:
      code: golden_b20_w1_mud_a
      interval: monthly
      amount_cents: 0
      minimum_commitment: {amount_cents: 30000}
    plans:
      - code: golden_b20_w1_mud_b
        interval: monthly
        amount_cents: 0
        charges:
          - {billable_metric_code: b20_w1_mud_sum, charge_model: standard, properties: {amount: "2"}}
    charges: [{billable_metric_code: b20_w1_mud_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b20_w1_mud_cust, currency: EUR}
    subscription: {external_id: golden_b20_w1_mud_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w1_mud_sum, properties: {amount: 30}}]
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - at: "2024-04-02T10:00:00Z"
      do: update_customer
      params: {invoice_grace_period: 5}
    - at: "2024-04-05T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w1_mud_sum, properties: {amount: 30}}]
    - at: "2024-04-16T10:00:00Z"
      do: create_subscription
      params: {plan_code: golden_b20_w1_mud_b}
    - {at: "2024-04-16T10:01:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {index: 0}
        status: finalized
        fees_amount_cents: 30000
        fees_count: 3
        total_amount_cents: 30000
      - select: {index: 1}
        status: draft
        fees_amount_cents: 16000
        fees_count: 3
        coupons_amount_cents: 0
        credit_notes_amount_cents: 0
        total_amount_cents: 16000
        fees:
          - {fee_type: charge, units: "30.0", amount_cents: 3000}
          - {fee_type: commitment, amount_cents: 13000}
  math: >-
    The prorated floor is visible on a draft, which is the useful fact about this surface: a commitment
    true-up is a fee PRODUCER (calculate_fees_service.rb:46), created above the
    `not_in_finalizing_process?` gate at :364-379, so unlike a coupon it is not withheld and a
    grace-period draft shows the customer the real number.
    Same arithmetic as b20/plan-upgrade/commitment_progress/invoice: March finalizes at 30_000¢ before
    the grace period is raised on 2 April (raising rather than shortening, because
    Customers::UpdateInvoiceIssuingDateSettingsService:24-32 issues existing drafts when a period is
    shortened); the 16 April upgrade's termination invoice is held open and reads 3_000¢ of usage plus a
    13_000¢ true-up against a floor prorated to 30_000 x 16/30 = 16_000¢.
    coupons_amount_cents and credit_notes_amount_cents are asserted at 0 so the 16_000¢ cannot be read
    as a net figure: nothing has been taken off, and the draft is producers plus tax as always.
    THE COUNTERFACTUAL IS 3_000¢ — a draft with two fees and no true-up, which is what this surface
    would show if the commitment had been looked up through the NEW subscription's plan rather than the
    terminated one's. That is not a hypothetical shape either: it is exactly what plan B's own first
    period reads in the /invoice sibling.
    The timeline stops at the termination invoice, so `invoices: 2` also pins that the upgrade raised no
    invoice of its own for plan B — an arrears plan at amount_cents 0 bills nothing at subscription
    start, and a third invoice here would mean something else happened.

- id: b20/plan-upgrade/commitment_progress/regenerated
  block: B20
  axes: {churn: plan-upgrade, carried_state: commitment_progress, observed_via: regenerated}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, commitment_amount_cents: 30000, upgrade_day: 16, grace_period: 5}
  provenance: coverage-gap
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  setup:
    metrics: [{code: b20_w1_mur_sum, aggregation_type: sum_agg, field_name: amount}]
    plan:
      code: golden_b20_w1_mur_a
      interval: monthly
      amount_cents: 0
      minimum_commitment: {amount_cents: 30000}
    plans:
      - code: golden_b20_w1_mur_b
        interval: monthly
        amount_cents: 0
        charges:
          - {billable_metric_code: b20_w1_mur_sum, charge_model: standard, properties: {amount: "2"}}
    charges: [{billable_metric_code: b20_w1_mur_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b20_w1_mur_cust, currency: EUR}
    subscription: {external_id: golden_b20_w1_mur_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w1_mur_sum, properties: {amount: 30}}]
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - at: "2024-04-02T10:00:00Z"
      do: update_customer
      params: {invoice_grace_period: 5}
    - at: "2024-04-05T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w1_mur_sum, properties: {amount: 30}}]
    - at: "2024-04-16T10:00:00Z"
      do: create_subscription
      params: {plan_code: golden_b20_w1_mur_b}
    - {at: "2024-04-16T10:01:00Z", do: perform_billing}
    - at: "2024-04-17T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w1_mur_sum, timestamp: "2024-04-10T10:00:00Z", properties: {amount: 10}}]
    - {at: "2024-04-17T11:00:00Z", do: refresh_invoice, select: {index: 1}}
  expect:
    invoices: 2
    invoice:
      - select: {index: 0}
        fees_amount_cents: 30000
        fees_count: 3
        total_amount_cents: 30000
      - select: {index: 1}
        status: draft
        fees_amount_cents: 16000
        fees_count: 3
        total_amount_cents: 16000
        fees:
          - {fee_type: charge, units: "40.0", amount_cents: 4000}
          - {fee_type: commitment, amount_cents: 12000}
  math: >-
    A refresh that provably ran, and a total that provably did not move — which is the whole content of
    this cell.
    The termination draft is built on 16 April from the 30 units then known: 3_000¢ of usage and a
    13_000¢ true-up against the 16_000¢ prorated floor. A BACKDATED event is then ingested on the 17th
    carrying `timestamp: 2024-04-10`, inside the terminated period, and the draft is refreshed.
    RefreshDraftService destroys the fees and re-runs CalculateFeesService, so the period now aggregates
    40 units: the charge fee becomes 4_000¢ and the true-up is RE-DERIVED as 16_000 − 4_000 = 12_000¢.
    fees_amount_cents stays 16_000¢.
    That invariance is the assertion, and it is only readable through the per-fee split — 3_000/13_000
    before the refresh, 4_000/12_000 after, 16_000 both times. A refresh that failed to re-derive the
    true-up would read 17_000¢ (4_000 of usage on top of a stale 13_000 true-up); one that dropped the
    commitment as an override does would read 4_000¢; and one that never picked up the late event would
    read 3_000/13_000. Three distinguishable wrong answers, all excluded.
    It also pins that the prorated coefficient survives the refresh. The coefficient is recomputed from
    `all_invoice_subscriptions.first.from_datetime` and `min(terminated_at, end_of_period)`
    (calculate_prorated_coefficient_service.rb), against invoice_subscriptions that
    RefreshDraftService destroys and rebuilds — so 16/30 has to come out the same the second time, and
    a floor that came back at 30_000¢ (coefficient 1) would show as a 26_000¢ true-up.
    March is asserted as the positive evidence that the commitment exists and produces a true-up on this
    subscription at all.

- id: b20/plan-upgrade/commitment_progress/preview
  block: B20
  axes: {churn: plan-upgrade, carried_state: commitment_progress, observed_via: preview}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, commitment_amount_cents: 30000, upgrade_day: 16}
  provenance: coverage-gap
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  setup:
    organization: {premium_integrations: [preview]}
    metrics: [{code: b20_w1_mup_sum, aggregation_type: sum_agg, field_name: amount}]
    plan:
      code: golden_b20_w1_mup_a
      interval: monthly
      amount_cents: 0
      minimum_commitment: {amount_cents: 30000}
    plans:
      - code: golden_b20_w1_mup_b
        interval: monthly
        amount_cents: 0
        charges:
          - {billable_metric_code: b20_w1_mup_sum, charge_model: standard, properties: {amount: "2"}}
    charges: [{billable_metric_code: b20_w1_mup_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b20_w1_mup_cust, currency: EUR}
    subscription: {external_id: golden_b20_w1_mup_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w1_mup_sum, properties: {amount: 30}}]
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - at: "2024-04-16T10:00:00Z"
      do: create_subscription
      params: {plan_code: golden_b20_w1_mup_b}
    - {at: "2024-04-16T10:01:00Z", do: perform_billing}
    - at: "2024-04-20T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w1_mup_sum, properties: {amount: 40}}]
    - {at: "2024-04-25T10:00:00Z", do: preview_invoice}
    - {at: "2024-05-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 3
    invoice:
      - select: {index: 0}
        fees_amount_cents: 30000
        fees_count: 3
        total_amount_cents: 30000
      - select: {index: 2}
        fees_amount_cents: 8000
        fees_count: 2
        total_amount_cents: 8000
    preview:
      fees_amount_cents: 8000
      sub_total_excluding_taxes_amount_cents: 8000
      total_amount_cents: 8000
      fees_count: 1
  math: >-
    What the customer is quoted for life after the upgrade: 8_000¢, with no floor.
    Invoices::PreviewService reaches the commitment through the same single reference the invoice does —
    `add_commitment_fee` opens with `return unless subscription.plan.minimum_commitment`
    (preview_service.rb:259-260) — and after the 16 April upgrade the subscription's plan is B, which
    has none. So the previewed 16–30 April invoice is 40 units x 2.00 = 8_000¢ and nothing else, and the
    1 May invoice confirms it at 8_000¢.
    fees_count differs between the two by design and the row asserts both: the preview builds ONE fee
    (the charge) because Invoices::PreviewService adds a subscription fee only where the plan has an
    amount, while the real invoice persists a 0¢ subscription fee alongside the charge — a shape
    difference that is worth pinning precisely because it is the kind of thing a reader would otherwise
    read as a missing commitment.
    THE COUNTERFACTUAL IS 16_000¢ ON BOTH SIDES: had the floor followed the upgrade, plan B's partial
    period would be topped up to 30_000 x 15/30. March, asserted here at 30_000¢ with its three fees,
    is what proves the commitment was configured and producing a true-up before the churn — without it
    an 8_000¢ preview is indistinguishable from a plan that never had a floor.
    The previewed period has usage on purpose (40 units on the 20th, previewed on the 25th):
    Invoices::PreviewService raises a 500 on a charge with no usage in the period.

# ---------------------------------------------------------------------------------------------
# paid_advance_fee x plan-override — the fixed-charge half of lead 2's join, reached by the CLONE path.
#
# Two different services look for an already-paid advance fixed charge and they do NOT agree:
#   Fees::BuildPayInAdvanceFixedChargeService#find_already_paid_units scopes on
#     `fixed_charge: [fixed_charge, fixed_charge.parent]` (build_pay_in_advance_fixed_charge_service.rb:63-83)
#     — one level of parent, so a clone still finds the fee its parent was billed for.
#   Fees::FixedChargeService#already_billed? scopes on `fixed_charge.fees` with NO parent fallback
#     (fixed_charge_service.rb:53-75).
# The delta invoice therefore prices correctly across the churn, and a REFRESH of the draft it came
# from does not. These three rows are the two sides and the refresh between them.

- id: b20/plan-override/paid_advance_fee/invoice
  block: B20
  axes: {churn: plan-override, carried_state: paid_advance_fee, observed_via: invoice}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, plan_pay_in_advance: true, plan_units: 10, updated_units: 12, apply_units_immediately: true}
  provenance: coverage-gap
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  setup:
    add_ons: [{code: b20_w1_pai_seat, name: Seat, amount_cents: 20000}]
    plan: {code: golden_b20_w1_pai, interval: monthly, amount_cents: 0, pay_in_advance: true}
    fixed_charges:
      - add_on_code: b20_w1_pai_seat
        charge_model: standard
        units: 10
        pay_in_advance: true
        prorated: false
        properties: {amount: "100"}
    customer: {external_id: golden_b20_w1_pai_cust, currency: EUR}
    subscription: {external_id: golden_b20_w1_pai_sub, billing_time: calendar}
  timeline:
    - {at: "2024-04-01T00:00:00Z", do: create_subscription}
    - at: "2024-04-16T00:00:00Z"
      do: update_subscription_fixed_charge
      fixed_charge:
        add_on_code: b20_w1_pai_seat
        units: 12
        apply_units_immediately: true
        properties: {amount: "100"}
  expect:
    invoices: 2
    invoice:
      - select: {index: 0}
        status: finalized
        fees_amount_cents: 100000
        total_amount_cents: 100000
        fees:
          - {fee_type: subscription, amount_cents: 0}
          - {fee_type: fixed_charge, item_code: b20_w1_pai_seat, units: "10.0", amount_cents: 100000}
      - select: {index: 1}
        fees_amount_cents: 20000
        total_amount_cents: 20000
        fees:
          - {fee_type: fixed_charge, item_code: b20_w1_pai_seat, units: "2.0", amount_cents: 20000}
  math: >-
    THE CONTROL for lead 2's join, on the churn that rewrites the fixed charge's id rather than its
    event stream — and it passes, because ONE of the two lookups was given a parent fallback.
    The plan pays in advance and its fixed charge carries 10 units at 100.00, so 1 April raises a
    `subscription` invoice with a 0¢ subscription fee and a 100_000¢ fixed-charge fee against the
    PLAN's fixed charge. (Lead 2's shape put the 10 units on a creation-time override instead; here
    they are on the plan, which is what makes the next step create a child rather than update one.)
    On 16 April the units are raised to 12 with `properties` sent as well. That extra key is the whole
    churn: `units_only_fixed_charge_params?` is false
    (fixed_charge_units_override_detection_concern.rb:26-31), so
    Subscriptions::UpdateOrOverrideFixedChargeService takes `override_via_plan`, Plans::OverrideService
    clones the plan, and FixedCharges::OverrideService dups the fixed charge with
    `c.parent_id = fixed_charge.id` (override_service.rb:30). The subscription now bills through a
    fixed charge that has never been invoiced for anything.
    `apply_units_immediately` then fires Invoices::CreatePayInAdvanceFixedChargesJob, and
    Fees::BuildPayInAdvanceFixedChargeService prices the DELTA:
    `find_already_paid_units` scopes on `fixed_charge: [fixed_charge, fixed_charge.parent]` and on the
    period's fixed_charges_from/to (:63-83), so it reaches the 1 April fee through the clone's parent
    and reports 10 already-paid units. delta = 12 − 10 = 2, priced at 2 x 100.00 = 20_000¢.
    THE NUMBER IF THE PARENT FALLBACK WERE MISSING IS 120_000¢ — twelve units re-tiered from zero, on
    top of the 100_000¢ already invoiced, for a total April of 220_000¢ on a period worth 120_000¢.
    That is not speculation about the code: it is what the sibling lookup in Fees::FixedChargeService
    does without a parent, and it is F32's mechanism (`delta_units` handed to the charge model as if it
    were a fresh subscription).
    Both invoices are asserted with their per-fee units because the delta is only meaningful against
    what was already paid: without index 0's 10 units at 100_000¢ there is nothing for
    `find_already_paid_units` to find, and a 20_000¢ delta over an empty period would be just as
    consistent with a setup that never billed the fixed charge at all.

- id: b20/plan-override/paid_advance_fee/draft
  block: B20
  axes: {churn: plan-override, carried_state: paid_advance_fee, observed_via: draft}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, plan_pay_in_advance: true, plan_units: 10, updated_units: 12, apply_units_immediately: true, grace_period: 5}
  provenance: coverage-gap
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  setup:
    add_ons: [{code: b20_w1_pad_seat, name: Seat, amount_cents: 20000}]
    plan: {code: golden_b20_w1_pad, interval: monthly, amount_cents: 0, pay_in_advance: true}
    fixed_charges:
      - add_on_code: b20_w1_pad_seat
        charge_model: standard
        units: 10
        pay_in_advance: true
        prorated: false
        properties: {amount: "100"}
    customer:
      external_id: golden_b20_w1_pad_cust
      currency: EUR
      invoice_grace_period: 5
    subscription: {external_id: golden_b20_w1_pad_sub, billing_time: calendar}
  timeline:
    - {at: "2024-04-01T00:00:00Z", do: create_subscription}
    - at: "2024-04-16T00:00:00Z"
      do: update_subscription_fixed_charge
      fixed_charge:
        add_on_code: b20_w1_pad_seat
        units: 12
        apply_units_immediately: true
        properties: {amount: "100"}
  expect:
    invoices: 2
    invoice:
      - select: {index: 0}
        status: draft
        fees_amount_cents: 100000
        fees_count: 2
        total_amount_cents: 100000
        fees:
          - {fee_type: subscription, amount_cents: 0}
          - {fee_type: fixed_charge, item_code: b20_w1_pad_seat, units: "10.0", amount_cents: 100000}
      - select: {index: 1}
        fees_amount_cents: 20000
        total_amount_cents: 20000
  math: >-
    The same 20_000¢ delta with the April invoice held open, and the row that makes the /regenerated
    sibling a defect rather than a setup artefact.
    Identical to b20/plan-override/paid_advance_fee/invoice except for a 5-day grace period declared in
    `setup`, which is legitimate here (unlike the progressive-billing rows) because there is no earlier
    invoice to protect: the 1 April invoice is the first thing that happens.
    THE PLAN PAYING IN ADVANCE IS LOAD-BEARING AND NOT DECORATION. Only
    Invoices::SubscriptionService consults `grace_period?` (subscription_service.rb:177,193), and it is
    the service that raises the subscription-start invoice for an ADVANCE plan. With an arrears plan
    whose only content is an advance fixed charge, the first invoice comes from a path that finalizes on
    creation and there is no draft to hold — three attempts at lead 2 died there, which is why it is
    written down in reference/invoice-paths.md.
    So the draft carries a 0¢ subscription fee and the 100_000¢ fixed-charge fee for its 10 units,
    fees_count 2, and the delta invoice adds 20_000¢: April is owed 120_000¢ across the two.
    The delta is still 20_000¢ and not 120_000¢ because `find_already_paid_units` has no
    invoice-status filter (build_pay_in_advance_fixed_charge_service.rb:63-83) — a DRAFT fee counts as
    already paid, which is correct here and is itself worth pinning.
    THIS IS THE CONTROL. Everything that could disturb the draft has happened — the plan was cloned,
    the fixed charge was replaced by a child, the delta invoice was issued — and the draft is intact.
    So when b20/plan-override/paid_advance_fee/regenerated finds it empty, the fee is not missing
    because the clone removed it, nor because the delta invoice claimed it at creation time. It is
    missing only after a refresh.

- id: b20/plan-override/paid_advance_fee/regenerated
  block: B20
  pins: ["F75"]
  axes: {churn: plan-override, carried_state: paid_advance_fee, observed_via: regenerated}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, plan_pay_in_advance: true, plan_units: 10, updated_units: 12, apply_units_immediately: true, grace_period: 5}
  provenance: BIL-537
  characterization: true
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  setup:
    add_ons: [{code: b20_w1_par_seat, name: Seat, amount_cents: 20000}]
    plan: {code: golden_b20_w1_par, interval: monthly, amount_cents: 0, pay_in_advance: true}
    fixed_charges:
      - add_on_code: b20_w1_par_seat
        charge_model: standard
        units: 10
        pay_in_advance: true
        prorated: false
        properties: {amount: "100"}
    customer:
      external_id: golden_b20_w1_par_cust
      currency: EUR
      invoice_grace_period: 5
    subscription: {external_id: golden_b20_w1_par_sub, billing_time: calendar}
  timeline:
    - {at: "2024-04-01T00:00:00Z", do: create_subscription}
    - at: "2024-04-16T00:00:00Z"
      do: update_subscription_fixed_charge
      fixed_charge:
        add_on_code: b20_w1_par_seat
        units: 12
        apply_units_immediately: true
        properties: {amount: "100"}
    - {at: "2024-04-17T00:00:00Z", do: refresh_invoice, select: {index: 0}}
  expect:
    invoices: 2
    invoice:
      - select: {index: 0}
        status: draft
        fees_amount_cents: 0
        fees_count: 1
        total_amount_cents: 0
        fees:
          - {fee_type: subscription, amount_cents: 0}
      - select: {index: 1}
        fees_amount_cents: 20000
        total_amount_cents: 20000
  math: >-
    CHARACTERIZATION — BIL-537 reproduced through a second churn, which is what says the bug is the
    lookup and not the units-only override path the ticket happened to arrive on.
    Lead 2 reached this by raising units on a subscription whose plan was ALREADY an override, so the
    child fixed charge was updated in place and only its event stream moved. Here the plan carries the
    10 units, so sending `properties` alongside them clones the plan and creates a CHILD fixed charge
    with a fresh id (FixedCharges::OverrideService:30). Different churn, different column rewritten,
    same outcome.
    The refresh is where the two lookups disagree. Fees::FixedChargeService#already_billed?
    (fixed_charge_service.rb:53-75) asks whether this fixed charge has a fee for this period on any
    invoice that is not voided or deleted — scoped to `fixed_charge.fees`, WITH NO
    `fixed_charge.parent` fallback, unlike find_already_paid_units. After the clone,
    `subscription.fixed_charges` is the child, and the child does have such a fee: the 2-unit delta fee
    on the 16 April invoice, whose fixed_charges_from/to are the same 1–30 April. So `already_billed?`
    returns true, Fees::FixedChargeService returns before building anything, and the refreshed draft
    keeps nothing but its 0¢ subscription fee.
    CORRECT BEHAVIOUR IS THE 100_000¢ THE DRAFT WAS BUILT WITH, which its control row
    b20/plan-override/paid_advance_fee/draft asserts unchanged under an identical timeline minus the
    refresh. April is invoiced 20_000¢ on a period owing 120_000¢ — 100_000¢ of cash, deleted by a
    refresh, with no error anywhere.
    fees_count 1 is asserted with the amount because a fee that came back at 0¢ and a fee that never
    came back are different bugs, and only the count separates them.

- id: b20/subscription-override/paid_advance_fee/invoice
  block: B20
  axes: {churn: subscription-override, carried_state: paid_advance_fee, observed_via: invoice}
  dimensions:
    interval: monthly
    billing_time: calendar
    taxes: none
    plan_pay_in_advance: true
    plan_units: 0
    created_units: 10
    updated_units: 12
    apply_units_immediately: true
  provenance: BIL-537
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  setup:
    add_ons: [{code: b20_w1_sav_seat, name: Seat, amount_cents: 20000}]
    plan: {code: golden_b20_w1_sav, interval: monthly, amount_cents: 0, pay_in_advance: true}
    fixed_charges:
      - add_on_code: b20_w1_sav_seat
        charge_model: standard
        units: 0
        pay_in_advance: true
        prorated: false
        properties: {amount: "100"}
    customer: {external_id: golden_b20_w1_sav_cust, currency: EUR}
    subscription:
      external_id: golden_b20_w1_sav_sub
      billing_time: calendar
      plan_overrides:
        fixed_charges:
          - {add_on_code: b20_w1_sav_seat, units: 10}
  timeline:
    - {at: "2024-04-01T00:00:00Z", do: create_subscription}
    - at: "2024-04-16T00:00:00Z"
      do: update_subscription_fixed_charge
      fixed_charge:
        add_on_code: b20_w1_sav_seat
        units: 12
        apply_units_immediately: true
  expect:
    invoices: 2
    invoice:
      - select: {index: 0}
        status: finalized
        fees_amount_cents: 100000
        fees_count: 2
        total_amount_cents: 100000
        fees:
          - {fee_type: subscription, amount_cents: 0}
          - {fee_type: fixed_charge, item_code: b20_w1_sav_seat, units: "10.0", amount_cents: 100000}
      - select: {index: 1}
        fees_amount_cents: 20000
        total_amount_cents: 20000
        fees:
          - {fee_type: fixed_charge, item_code: b20_w1_sav_seat, units: "2.0", amount_cents: 20000}
  math: >-
    Lead 2's exact setup with the grace period removed, which is what the finalized surface of that
    cell means — and it is the row that shows the join WORKING before any refresh consults it.
    The plan's fixed charge carries 0 units, so the 10 arrive as a creation-time override
    (Subscriptions::CreateService#create_fixed_charge_units_overrides). With no grace period the
    1 April `subscription` invoice finalizes immediately at 100_000¢: a 0¢ subscription fee and 10
    units at 100.00. The subscription is therefore already on a CHILD plan, which decides what the next
    step does.
    Raising the units to 12 on 16 April with a units-only body would normally write a
    Subscription::FixedChargeUnitsOverride, but `units_only_change?` opens with
    `return false if subscription_plan_parent_present`
    (update_or_override_fixed_charge_service.rb:44-48) — the plan already has a parent, so it takes
    `override_via_plan` instead, `ensure_plan_override` returns the existing child plan unchanged
    (plan_override_concern.rb:8-10), and `find_or_create_fixed_charge_override` finds the child's own
    fixed charge and UPDATES it in place. So no id is rewritten here; what moves is the fixed charge's
    event stream, which is the other column `subscription-override` rewrites.
    The delta is then priced correctly: `find_already_paid_units` matches
    `fixed_charge: [fixed_charge, fixed_charge.parent]` on the same 1–30 April boundaries
    (build_pay_in_advance_fixed_charge_service.rb:63-83), finds the 10-unit fee on the very record it
    just updated, and bills 12 − 10 = 2 units at 100.00 = 20_000¢. April is owed 120_000¢ across two
    finalized invoices.
    THE COUNTERFACTUAL IS 120_000¢ ON THE SECOND INVOICE — twelve units re-tiered from zero, F32's
    mechanism — for an April of 220_000¢.
    AND THE PAIR THAT MATTERS IS WITH THE OTHER SURFACES OF THIS SAME CELL: the /draft row shows the
    same two invoices with the first held open, and the /regenerated row shows the refresh deleting the
    100_000¢ fee. This row is what says the state was found correctly at every point before a refresh
    was asked for, so the 0¢ there is the refresh and nothing else.

- id: b20/hns/charge-replaced/progressive_billing_credit/invoice
  block: B20
  axes: {churn: charge-replaced, carried_state: progressive_billing_credit, observed_via: invoice}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, threshold_amount_cents: 5000}
  provenance: coverage-gap
  characterization: true
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  no_transaction: true
  setup:
    organization: {premium_integrations: [progressive_billing]}
    metrics: [{code: b20_hns_cr_sum, aggregation_type: sum_agg, field_name: amount}]
    plan:
      code: golden_b20_hns_cr
      interval: monthly
      amount_cents: 0
      usage_thresholds: [{amount_cents: 5000}]
    charges: [{billable_metric_code: b20_hns_cr_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b20_hns_cr_cust, currency: EUR}
    subscription: {external_id: golden_b20_hns_cr_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b20_hns_cr_sum, properties: {amount: 100}}]
    - {at: "2024-03-05T11:00:00Z", do: perform_usage_update}
    - at: "2024-03-10T10:00:00Z"
      do: update_plan
      params:
        charges:
          - {billable_metric_code: b20_hns_cr_sum, charge_model: standard, properties: {amount: "1"}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {invoice_type: progressive_billing}
        fees_amount_cents: 10000
        total_amount_cents: 10000
      - select: {invoice_type: subscription}
        fees_amount_cents: 10000
        progressive_billing_credit_amount_cents: 0
        credit_notes_amount_cents: 10000
        total_amount_cents: 0
  math: >-
    CHARACTERIZATION. A charge REPLACEMENT loses a progressive-billing credit exactly the way a plan
    override does, and it is the churn that isolates the cause: no plan is cloned and no plan_id moves,
    only `charge_id`.
    `Plans::UpdateService#process_charges` (update_service.rb:230-235) creates a charge for a payload
    entry carrying no `id`, and `sanitize_charges` (:241-248) then discards every charge the array did
    not name — so ONE `update_plan` body with a single id-less entry for the same metric replaces the
    charge record while leaving the plan, the subscription and the metric untouched.
    100 units cross the 5_000¢ threshold on 5 March and 10_000¢ is collected on a progressive_billing
    invoice whose charge fee carries the OLD charge_id. The 10 March replacement mints a new charge; the
    period invoice bills the same 100 units through it (aggregation queries events by metric code, not
    by charge id) so fees are again 10_000¢. `Credits::ProgressiveBillingService` then caps the credit
    at `invoice.fees.charge.where(charge_id: progressive_billing_invoice.fees.charge.pluck(:charge_id))`
    (progressive_billing_service.rb:29-33) — which matches NOTHING across the replacement, so the cap is
    0, `amount_to_credit > total_charges_amount` holds, and the whole 10_000¢ is diverted into
    CreditNotes::CreateFromProgressiveBillingInvoice with `amount_to_credit` set to 0.
    Hence progressive_billing_credit_amount_cents 0 and a 10_000¢ credit note.
    THE COUNTERFACTUAL IS progressive_billing_credit_amount_cents 10_000 and credit_notes_amount_cents
    0 — which is what b05 gets when nothing is reconfigured. The total is 0 either way, which is the
    trap: only the two fields above tell a credit from a numbered, separately-spendable credit note.
    Companion of b20/plan-override/progressive_billing_credit/invoice: same symptom, one rewritten
    column instead of three, so the two together name `charge_id` as the sole cause.

- id: b20/hns/metric-deleted/coupon_application/invoice
  block: B20
  axes: {churn: metric-deleted, carried_state: coupon_application, observed_via: invoice}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, coupon_amount_cents: 2000, coupon_limitation: billable-metric}
  provenance: coverage-gap
  characterization: true
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  setup:
    metrics: [{code: b20_hns_md_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b20_hns_md, interval: monthly, amount_cents: 5000}
    charges: [{billable_metric_code: b20_hns_md_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b20_hns_md_cust, currency: EUR}
    subscription: {external_id: golden_b20_hns_md_sub, billing_time: calendar}
    coupons:
      - name: b20 hns metric coupon
        code: b20_hns_md_cpn
        coupon_type: fixed_amount
        frequency: recurring
        frequency_duration: 6
        amount_cents: 2000
        amount_currency: EUR
        expiration: no_expiration
        applies_to: {billable_metric_codes: [b20_hns_md_sum]}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b20_hns_md_sum, properties: {amount: 100}}]
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - {at: "2024-04-10T10:00:00Z", do: delete_metric, code: b20_hns_md_sum}
    - {at: "2024-05-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {index: 0}
        fees_count: 2
        fees_amount_cents: 15000
        coupons_amount_cents: 2000
        sub_total_excluding_taxes_amount_cents: 13000
        total_amount_cents: 13000
      - select: {index: 1}
        fees_count: 1
        fees_amount_cents: 5000
        coupons_amount_cents: 0
        sub_total_excluding_taxes_amount_cents: 5000
        total_amount_cents: 5000
  math: >-
    CHARACTERIZATION. Deleting a billable metric takes the metric-limited coupon with it, and neither
    the invoice nor the coupon says so.
    March is the control. The plan bills 5_000¢ and 100 units bill 100 x 1.00 = 10_000¢, so fees are
    15_000¢. `Credits::AppliedCouponService#billable_metric_related_fees`
    (applied_coupon_service.rb:120-125) scopes the discountable fees to
    `invoice.fees.joins(charge: :billable_metric).where(billable_metric: {id: ...coupon_targets})` — an
    INNER JOIN through `charge`, so the subscription fee is never a candidate and the base is the
    10_000¢ charge fee alone. The fixed 2_000¢ therefore comes off a 10_000¢ base, not a 15_000¢ one:
    coupons 2_000, sub-total 13_000.
    On 10 April `BillableMetrics::DestroyService` discards the metric AND
    `metric.charges.update_all(deleted_at:)` (destroy_service.rb:29). Charge carries
    `default_scope -> { kept }` (models/charge.rb:62), so April's invoice has no charge fee at all —
    fees_count 1 at 5_000¢ — and the coupon's join finds nothing. `fees.any?` is false, so
    AppliedCouponService returns at :22 BEFORE creating any Credit: coupons_amount_cents 0, and
    `frequency_duration_remaining` is not even decremented, so the coupon sits at full life on a
    customer it can never discount again.
    THE COUNTERFACTUAL IS 3_000¢. A reader who assumes a fixed-amount coupon falls back to the whole
    invoice when its limitation no longer resolves would expect 5_000 − 2_000; a reader who assumes the
    discarded charge still bills its accrued usage (it does not — see F05) would expect fees 15_000
    again. Both are named here, and both are wrong.
    fees_count is asserted on both invoices because it is the only field that distinguishes "the charge
    was deleted" from "the period simply had no usage", and sub_total is asserted beside the coupon
    because the coupon is the sole difference between it and fees_amount_cents.

- id: b20/hns/metric-deleted/coupon_application/regenerated
  block: B20
  axes: {churn: metric-deleted, carried_state: coupon_application, observed_via: regenerated}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, grace_period: 30, coupon_limitation: billable-metric}
  provenance: coverage-gap
  characterization: true
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  setup:
    metrics: [{code: b20_hns_mdr_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b20_hns_mdr, interval: monthly, amount_cents: 5000}
    charges: [{billable_metric_code: b20_hns_mdr_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b20_hns_mdr_cust, currency: EUR, invoice_grace_period: 30}
    subscription: {external_id: golden_b20_hns_mdr_sub, billing_time: calendar}
    coupons:
      - name: b20 hns metric coupon regen
        code: b20_hns_mdr_cpn
        coupon_type: fixed_amount
        frequency: recurring
        frequency_duration: 6
        amount_cents: 2000
        amount_currency: EUR
        expiration: no_expiration
        applies_to: {billable_metric_codes: [b20_hns_mdr_sum]}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b20_hns_mdr_sum, properties: {amount: 100}}]
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - {at: "2024-04-05T10:00:00Z", do: delete_metric, code: b20_hns_mdr_sum}
    - {at: "2024-04-06T01:00:00Z", do: perform_invoices_refresh}
  expect:
    invoices: 1
    invoice:
      status: draft
      fees_count: 1
      fees_amount_cents: 5000
      coupons_amount_cents: 0
      total_amount_cents: 5000
  math: >-
    CHARACTERIZATION, and the surface that separates the deletion from the clock.
    A 30-day grace period holds March's invoice as a DRAFT, so the 1 April run produces
    fees 15_000¢ (5_000¢ plan + 100 x 1.00) and NO coupon: a draft carries no coupon, no credit note
    and no prepaid credit, all three gated on `not_in_finalizing_process?`
    (calculate_fees_service.rb:364-379). So coupons_amount_cents is 0 both before and after the churn,
    and what this row pins is the FEE the coupon is anchored to — the only thing
    `billable_metric_related_fees` can join to (applied_coupon_service.rb:120-125).
    On 5 April the metric is deleted. `BillableMetrics::DestroyService` is one of the four writers that
    flag drafts for recomputation: `Invoice.where(id: draft_invoice_ids).update_all(ready_to_be_refreshed: true)`
    over `Invoice.draft.joins(plans: [:billable_metrics])` (destroy_service.rb:23-31). That flag is the
    ONLY thing Clock::RefreshDraftInvoicesJob consults, so the 6 April refresh recomputes the draft and
    the charge fee — whose charge was discarded in the same transaction — is gone: fees_count 1,
    fees_amount_cents 5_000, total 5_000.
    THE COUNTERFACTUAL IS 15_000¢ WITH TWO FEES, and it is not hypothetical — it is what
    `Charges::UpdateService` produces for the same shape of change, because it does not set the flag
    (see the B18 rows). So this row is simultaneously the evidence that the deletion reaches an open
    invoice and the evidence that a charge edit does not. The finalized reading of the same churn is
    b20/hns/metric-deleted/coupon_application/invoice, where the coupon is live and drops from 2_000¢ to
    0¢; here it was never applied at all, which is why `invoices: 1` and `status: draft` are asserted —
    a row that accidentally finalized would be measuring that other cell.

# ---------------------------------------------------------------------------------------------
# W2 — the two churns that were unreachable until `delete_metric` and `update_plan`'s
# `billable_metric_code` existed, plus the six surfaces a previous writer would not guess.
#
#   metric-deleted   rewrites billable_metric_id AND retires charge_id, because
#                    BillableMetrics::DestroyService discards the metric and
#                    `metric.charges.update_all(deleted_at:)` in the same transaction
#                    (destroy_service.rb:23-31). It is also the only churn that FLAGS open drafts,
#                    so draft and regenerated are genuinely different surfaces here.
#   charge-replaced  rewrites charge_id and NOTHING else — no plan clone, no new subscription — so
#                    it is the churn that isolates that column from everything an override moves.
#
# Every row below carries positive evidence that the state EXISTED before the churn (the finalized
# threshold invoice, the pre-churn coupon-discounted invoice, the pre-churn advance invoice), because
# a lost join returns nothing rather than raising: without it a row asserting the post-churn amount
# passes whether the state was lost or never created. And every one names, in `math:`, the number the
# same row would carry had the state been found — if the two coincide the row guards nothing.

- id: b20/metric-deleted/progressive_billing_credit/invoice
  block: B20
  axes: {churn: metric-deleted, carried_state: progressive_billing_credit, observed_via: invoice}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, threshold_amount_cents: 5000, plan_amount_cents: 8000}
  provenance: coverage-gap
  characterization: true
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  no_transaction: true
  setup:
    organization: {premium_integrations: [progressive_billing]}
    metrics: [{code: b20_w2_mdp_sum, aggregation_type: sum_agg, field_name: amount}]
    plan:
      code: golden_b20_w2_mdp
      interval: monthly
      amount_cents: 8000
      usage_thresholds: [{amount_cents: 5000}]
    charges: [{billable_metric_code: b20_w2_mdp_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b20_w2_mdp_cust, currency: EUR}
    subscription: {external_id: golden_b20_w2_mdp_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w2_mdp_sum, properties: {amount: 100}}]
    - {at: "2024-03-05T11:00:00Z", do: perform_usage_update}
    - at: "2024-03-08T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w2_mdp_sum, properties: {amount: 60}}]
    - {at: "2024-03-10T10:00:00Z", do: delete_metric, code: b20_w2_mdp_sum}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {invoice_type: progressive_billing}
        status: finalized
        fees_amount_cents: 10000
        total_amount_cents: 10000
      - select: {invoice_type: subscription}
        fees_count: 1
        fees_amount_cents: 8000
        progressive_billing_credit_amount_cents: 0
        credit_notes_amount_cents: 8000
        sub_total_excluding_taxes_amount_cents: 8000
        total_amount_cents: 0
    credit_note:
      select: {index: -1}
      credit_amount_cents: 10000
      total_amount_cents: 10000
      balance_amount_cents: 2000
  math: >-
    CHARACTERIZATION. Deleting the metric deletes the fee the progressive credit was collected
    against, so the money comes back as a credit note LARGER than the invoice it lands on — and the
    remainder is left sitting on the customer as a separate refundable document.
    100 units cross the 5_000¢ threshold on 5 March and the threshold invoice takes the whole accrued
    10_000¢. 60 more units arrive on the 8th with no `perform_usage_update`, so no second threshold
    invoice is raised and March now holds 160 units the period is due to bill.
    On 10 March `BillableMetrics::DestroyService` discards the metric and, in the same transaction,
    `metric.charges.update_all(deleted_at:)` (destroy_service.rb:29). `Charge` carries
    `default_scope -> { kept }` (models/charge.rb:62), so `subscription.plan.charges` is empty when
    CalculateFeesService builds the March invoice: fees_count 1, the 8_000¢ subscription fee alone.
    Credits::ProgressiveBillingService then caps the credit at
    `invoice.fees.charge.where(charge_id: progressive_billing_invoice.fees.charge.pluck(:charge_id))`
    (progressive_billing_service.rb:29-33). `invoice.fees.charge` is EMPTY, so the cap is 0,
    `amount_to_credit` (10_000) > `total_charges_amount` (0), and the entire 10_000¢ is handed to
    CreditNotes::CreateFromProgressiveBillingInvoice with `amount_to_credit` set to 0 —
    progressive_billing_credit_amount_cents 0.
    The note is then spent at stage :62 up to what the invoice can absorb: credit_notes 8_000 on a
    8_000¢ invoice, total 0, and 2_000¢ of credit-note balance left over.
    THE NUMBER IF THE STATE HAD BEEN FOUND IS 14_000¢, not 0. With the metric alive the same period
    bills 8_000 + 160 x 1.00 = 24_000¢, the cap is the 16_000¢ charge fee, 10_000 <= 16_000 so no note
    is minted at all, and the invoice settles at 24_000 - 10_000 = 14_000¢ with
    progressive_billing_credit_amount_cents 10_000 and credit_notes_amount_cents 0. Every asserted
    field moves, which is what makes the row a guard rather than a decoration: fees 8_000 vs 24_000,
    credit 0 vs 10_000, notes 8_000 vs 0, total 0 vs 14_000.
    The threshold invoice is asserted `finalized` beside it because ProgressiveBilledAmount only reads
    invoices that are finalized or failed (progressive_billed_amount.rb:28-38) — a threshold invoice
    held back as a draft would make every line above true for the wrong reason.

- id: b20/metric-deleted/progressive_billing_credit/draft
  block: B20
  axes: {churn: metric-deleted, carried_state: progressive_billing_credit, observed_via: draft}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, threshold_amount_cents: 5000, plan_amount_cents: 8000, grace_period: 5}
  provenance: coverage-gap
  characterization: true
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  no_transaction: true
  setup:
    organization: {premium_integrations: [progressive_billing]}
    metrics: [{code: b20_w2_mdd_sum, aggregation_type: sum_agg, field_name: amount}]
    plan:
      code: golden_b20_w2_mdd
      interval: monthly
      amount_cents: 8000
      usage_thresholds: [{amount_cents: 5000}]
    charges: [{billable_metric_code: b20_w2_mdd_sum, charge_model: standard, properties: {amount: "1"}}]
    customer:
      external_id: golden_b20_w2_mdd_cust
      currency: EUR
      invoice_grace_period: 5
    subscription: {external_id: golden_b20_w2_mdd_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w2_mdd_sum, properties: {amount: 100}}]
    - {at: "2024-03-05T11:00:00Z", do: perform_usage_update}
    - at: "2024-03-08T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w2_mdd_sum, properties: {amount: 60}}]
    - {at: "2024-03-10T10:00:00Z", do: delete_metric, code: b20_w2_mdd_sum}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {invoice_type: progressive_billing}
        status: finalized
        fees_amount_cents: 10000
        total_amount_cents: 10000
      - select: {invoice_type: subscription}
        status: draft
        fees_count: 1
        fees_amount_cents: 8000
        progressive_billing_credit_amount_cents: 0
        credit_notes_amount_cents: 0
        sub_total_excluding_taxes_amount_cents: 8000
        total_amount_cents: 8000
    credit_note:
      select: {index: -1}
      credit_amount_cents: 10000
      balance_amount_cents: 10000
  math: >-
    CHARACTERIZATION, and the surface where the diverted credit cannot be spent at all.
    Identical to b20/metric-deleted/progressive_billing_credit/invoice except for a 5-day grace
    period, which is safe to declare in `setup` here because the threshold invoice is not raised by
    Invoices::SubscriptionService and is finalized regardless — asserted, not assumed, by
    `status: finalized` on it.
    The deletion diverts the same 10_000¢ into a credit note, but a draft may not consume one:
    `should_create_credit_note_credit?` returns false while `not_in_finalizing_process?`
    (calculate_fees_service.rb:364-379). So credit_notes_amount_cents is 0 and the draft asks for the
    8_000¢ subscription fee in full on top of the 10_000¢ already collected, while the whole 10_000¢
    note sits unspent at `balance_amount_cents: 10000`.
    THE NUMBER IF THE STATE HAD BEEN FOUND IS 14_000¢ — with the metric alive the draft carries
    8_000 + 16_000 = 24_000¢ of fees and progressive billing is the one reducer a draft still applies
    (it runs at :53, ahead of the gate), so 10_000¢ is credited and the draft reads 14_000¢. Here it
    reads 8_000¢: a smaller number reached by deleting 16_000¢ of billable usage and refusing the
    10_000¢ that was supposed to offset it.
    Pairs with the /invoice row exactly as lead 1's two rows pair: on the finalized surface the note
    is spent on the spot and the invoice settles at 0, so the loss is invisible in the total; hold the
    same invoice open and the customer is shown a bill on money they have already paid.

- id: b20/metric-deleted/progressive_billing_credit/regenerated
  block: B20
  axes: {churn: metric-deleted, carried_state: progressive_billing_credit, observed_via: regenerated}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, threshold_amount_cents: 5000, plan_amount_cents: 8000, grace_period: 5}
  provenance: coverage-gap
  characterization: true
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  no_transaction: true
  setup:
    organization: {premium_integrations: [progressive_billing]}
    metrics: [{code: b20_w2_mdr_sum, aggregation_type: sum_agg, field_name: amount}]
    plan:
      code: golden_b20_w2_mdr
      interval: monthly
      amount_cents: 8000
      usage_thresholds: [{amount_cents: 5000}]
    charges: [{billable_metric_code: b20_w2_mdr_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b20_w2_mdr_cust, currency: EUR}
    subscription: {external_id: golden_b20_w2_mdr_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w2_mdr_sum, properties: {amount: 100}}]
    - {at: "2024-03-05T11:00:00Z", do: perform_usage_update}
    - at: "2024-03-06T10:00:00Z"
      do: update_customer
      params: {invoice_grace_period: 5}
    - at: "2024-03-08T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w2_mdr_sum, properties: {amount: 60}}]
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - {at: "2024-04-02T10:00:00Z", do: delete_metric, code: b20_w2_mdr_sum}
    - {at: "2024-04-03T01:00:00Z", do: perform_invoices_refresh}
  expect:
    invoices: 2
    invoice:
      - select: {invoice_type: progressive_billing}
        status: finalized
        fees_amount_cents: 10000
        total_amount_cents: 10000
      - select: {invoice_type: subscription}
        status: draft
        fees_count: 1
        fees_amount_cents: 8000
        progressive_billing_credit_amount_cents: 0
        credit_notes_amount_cents: 0
        sub_total_excluding_taxes_amount_cents: 8000
        total_amount_cents: 8000
    credit_note:
      select: {index: -1}
      credit_amount_cents: 10000
      balance_amount_cents: 10000
  math: >-
    CHARACTERIZATION, and the only row in this column where the loss can be watched happening,
    because the draft is correct first and wrong afterwards.
    The order is deliberately the reverse of the /invoice and /draft rows. The threshold invoice takes
    10_000¢ on 5 March; the grace period is raised on the 6th, AFTER it, because
    Customers::UpdateInvoiceIssuingDateSettingsService:24-32 finalizes existing drafts when a period
    is shortened and a grace period declared in `setup` would have put a later reading at risk; 60
    more units land on the 8th; and the March invoice is drafted on 1 April WHILE THE METRIC IS STILL
    ALIVE. At that point it is right: 8_000¢ + 160 x 1.00 = 24_000¢ of fees, the charge_id cap matches
    the threshold fee, 10_000¢ is credited, and the draft reads 14_000¢ with no credit note anywhere.
    On 2 April the metric is deleted. `BillableMetrics::DestroyService` is one of the four writers
    that flag open drafts — it collects `Invoice.draft.joins(plans: [:billable_metrics])` at :23,
    BEFORE discarding the charges at :29, which is the only reason the flag is set at all — and that
    flag is the sole thing `Clock::RefreshDraftInvoicesJob` consults, so `perform_invoices_refresh`
    on the 3rd is what makes this the regenerated surface rather than an endpoint call that ignores it.
    RefreshDraftService then loses the money in three steps: `reset_invoice_values` destroys
    `invoice.credits.progressive_billing_invoice_kind` and zeroes
    progressive_billing_credit_amount_cents; CalculateFeesService rebuilds fees from
    `subscription.plan.charges`, which the `kept` default scope has just emptied; and
    ProgressiveBillingService re-runs against an invoice with no charge fees, so the cap is 0, the
    threshold invoice's `to_credit_amount` is back to the full 10_000¢ now that the credit which
    netted it down is gone, and the whole amount is diverted into a credit note the draft may not
    spend.
    THE DRAFT GOES FROM 14_000¢ TO 8_000¢ AND A 10_000¢ CREDIT NOTE APPEARS. Correct settlement for a
    customer who paid 10_000¢ and owes 8_000¢ is a 2_000¢ refund; what they get is an 8_000¢ bill and
    a separate 10_000¢ document.
    fees_count 1 is asserted with the amount because a charge fee rebuilt at 0¢ and a charge fee not
    rebuilt at all are different bugs and only the count separates them.

- id: b20/metric-deleted/progressive_billing_credit/preview
  block: B20
  axes: {churn: metric-deleted, carried_state: progressive_billing_credit, observed_via: preview}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, threshold_amount_cents: 5000, plan_amount_cents: 8000}
  provenance: coverage-gap
  characterization: true
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  no_transaction: true
  setup:
    organization: {premium_integrations: [progressive_billing, preview]}
    metrics: [{code: b20_w2_mdv_sum, aggregation_type: sum_agg, field_name: amount}]
    plan:
      code: golden_b20_w2_mdv
      interval: monthly
      amount_cents: 8000
      usage_thresholds: [{amount_cents: 5000}]
    charges: [{billable_metric_code: b20_w2_mdv_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b20_w2_mdv_cust, currency: EUR}
    subscription: {external_id: golden_b20_w2_mdv_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w2_mdv_sum, properties: {amount: 100}}]
    - {at: "2024-03-05T11:00:00Z", do: perform_usage_update}
    - at: "2024-03-08T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w2_mdv_sum, properties: {amount: 60}}]
    - {at: "2024-03-10T10:00:00Z", do: delete_metric, code: b20_w2_mdv_sum}
    - {at: "2024-03-25T10:00:00Z", do: preview_invoice}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {invoice_type: progressive_billing}
        status: finalized
        fees_amount_cents: 10000
        total_amount_cents: 10000
      - select: {invoice_type: subscription}
        fees_count: 1
        fees_amount_cents: 8000
        progressive_billing_credit_amount_cents: 0
        credit_notes_amount_cents: 8000
        total_amount_cents: 0
    preview:
      fees_count: 1
      fees_amount_cents: 8000
      progressive_billing_credit_amount_cents: 0
      sub_total_excluding_taxes_amount_cents: 8000
      total_amount_cents: 8000
  math: >-
    CHARACTERIZATION. The fourth implementation of the same cap, and the surface on which the diverted
    credit has nowhere to hide.
    The preview is taken on 25 March, after the deletion and before the period closes. It is a
    PROJECTION: `Invoices::PreviewService#billing_time` returns `end_of_periods.first + 1.day` for a
    persisted subscription (preview_service.rb:141-151), so the previewed period is March, the same
    period the 1 April run bills.
    `add_charge_fees` reads `subscription.plan.charges` under the same `kept` default scope
    (preview_service.rb:184-192), so the previewed invoice carries the 8_000¢ subscription fee and
    nothing else. `apply_progressive_billing_credits` then reuses the read-only
    Subscriptions::ProgressiveBilledAmount — which still finds the threshold invoice, because it is
    scoped by subscription and boundaries and not by any charge — and applies its OWN copy of the cap:
    `billed_charge_ids = progressive_invoice.fees.charge.pluck(:charge_id)` and
    `next 0 unless billed_charge_ids.include?(fee.charge_id)` (:346-352). The subscription fee's
    `charge_id` is nil, so `creditable_amount_cents` is 0, `amount_cents = [10_000, 0].min` is 0, and
    `next unless amount_cents.positive?` drops the credit. A preview may not issue a credit note
    (:344-345 says the excess is simply dropped), so there is no second spelling of the money to make
    the total look right: the customer is quoted 8_000¢ for a period on which 10_000¢ has already been
    collected.
    THE NUMBER IF THE STATE HAD BEEN FOUND IS 14_000¢ — with the metric alive the preview carries
    8_000 + 16_000 = 24_000¢, the charge fee's id IS in `billed_charge_ids`, creditable is 16_000 and
    the credit is min(10_000, 16_000) = 10_000. So the previewed total moves 14_000 -> 8_000 and the
    credit 10_000 -> 0.
    THE INVOICE IS ASSERTED BESIDE IT AND DISAGREES: same fees, but a 8_000¢ credit note application
    brings it to 0. Same lost state, two disguises — the invoice hides it in a credit note and settles
    at zero, the preview shows a bill for a period already paid for. That contrast is why
    `observed_via` is an axis, and why a row asserting only the finalized total would have called this
    cell healthy.
    ONE live charge is load-bearing for a different reason too: F72 500s the preview on any plan with
    two or more untaxed charges, so this row could not have used a surviving second metric.

- id: b20/metric-deleted/coupon_application/draft
  block: B20
  axes: {churn: metric-deleted, carried_state: coupon_application, observed_via: draft}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, coupon_amount_cents: 2000, coupon_limitation: billable-metric, grace_period: 5}
  provenance: coverage-gap
  characterization: true
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  no_transaction: true
  setup:
    metrics: [{code: b20_w2_mcd_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b20_w2_mcd, interval: monthly, amount_cents: 5000}
    charges: [{billable_metric_code: b20_w2_mcd_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b20_w2_mcd_cust, currency: EUR}
    subscription: {external_id: golden_b20_w2_mcd_sub, billing_time: calendar}
    coupons:
      - name: b20 w2 metric coupon draft
        code: b20_w2_mcd_cpn
        coupon_type: fixed_amount
        frequency: recurring
        frequency_duration: 6
        amount_cents: 2000
        amount_currency: EUR
        expiration: no_expiration
        applies_to: {billable_metric_codes: [b20_w2_mcd_sum]}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w2_mcd_sum, properties: {amount: 100}}]
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - at: "2024-04-05T10:00:00Z"
      do: update_customer
      params: {invoice_grace_period: 5}
    - at: "2024-04-10T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w2_mcd_sum, properties: {amount: 100}}]
    - {at: "2024-04-20T10:00:00Z", do: delete_metric, code: b20_w2_mcd_sum}
    - {at: "2024-05-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {index: 0}
        status: finalized
        fees_count: 2
        fees_amount_cents: 15000
        coupons_amount_cents: 2000
        sub_total_excluding_taxes_amount_cents: 13000
        total_amount_cents: 13000
      - select: {index: 1}
        status: draft
        fees_count: 1
        fees_amount_cents: 5000
        coupons_amount_cents: 0
        sub_total_excluding_taxes_amount_cents: 5000
        total_amount_cents: 5000
  math: >-
    CHARACTERIZATION. March is the positive evidence that the coupon existed and worked; April is what
    the deletion leaves of it, held open so the two reducers can be told apart.
    MARCH, finalized. 5_000¢ plan + 100 x 1.00 = 15_000¢ of fees.
    `Credits::AppliedCouponService#billable_metric_related_fees` (applied_coupon_service.rb:120-125)
    scopes the discountable fees to `invoice.fees.joins(charge: :billable_metric)` — an INNER JOIN
    through `charge`, so the subscription fee is never a candidate and the 2_000¢ comes off the
    10_000¢ charge fee, not off 15_000¢. coupons 2_000, sub-total 13_000. Without this invoice the row
    could not tell a coupon that stopped working from a coupon that never applied.
    APRIL, draft. The grace period is raised on 5 April — after March finalized, so
    Customers::UpdateInvoiceIssuingDateSettingsService:24-32 has no draft to issue. 100 more units
    arrive on the 10th, which is the whole point: the period the churn affects contains usage a live
    metric bills at 10_000¢, so the row cannot pass identically either way. On the 20th
    `BillableMetrics::DestroyService` discards the metric and its charges (:29), and the `kept` default
    scope (models/charge.rb:62) then empties `subscription.plan.charges`: fees_count 1, 5_000¢.
    THE NUMBER IF THE METRIC HAD SURVIVED IS 15_000¢ WITH TWO FEES. coupons_amount_cents is 0 EITHER
    WAY, because a draft withholds coupons entirely (`not_in_finalizing_process?`,
    calculate_fees_service.rb:364-379) — so what this row pins on the draft surface is the FEE the
    coupon is anchored to, the only thing `billable_metric_related_fees` can join to, and the
    difference is 5_000 vs 15_000 rather than 0 vs 2_000.
    The finalized sibling b20/metric-deleted/coupon_application/invoice is where the coupon itself
    moves, from 2_000¢ to 0¢, and where `frequency_duration_remaining` is shown never to decrement
    because AppliedCouponService returns at :22 on `fees.any?` being false. The two rows are the same
    deletion read through the two halves of the gate.

- id: b20/metric-deleted/coupon_application/preview
  block: B20
  pins: ["F71"]
  axes: {churn: metric-deleted, carried_state: coupon_application, observed_via: preview}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, coupon_amount_cents: 2000, coupon_limitation: billable-metric}
  provenance: coverage-gap
  characterization: true
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  no_transaction: true
  setup:
    organization: {premium_integrations: [preview]}
    metrics: [{code: b20_w2_mcv_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b20_w2_mcv, interval: monthly, amount_cents: 5000}
    charges: [{billable_metric_code: b20_w2_mcv_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b20_w2_mcv_cust, currency: EUR}
    subscription: {external_id: golden_b20_w2_mcv_sub, billing_time: calendar}
    coupons:
      - name: b20 w2 metric coupon preview
        code: b20_w2_mcv_cpn
        coupon_type: fixed_amount
        frequency: recurring
        frequency_duration: 6
        amount_cents: 2000
        amount_currency: EUR
        expiration: no_expiration
        applies_to: {billable_metric_codes: [b20_w2_mcv_sum]}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w2_mcv_sum, properties: {amount: 100}}]
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - at: "2024-04-10T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w2_mcv_sum, properties: {amount: 100}}]
    - {at: "2024-04-20T10:00:00Z", do: delete_metric, code: b20_w2_mcv_sum}
    - {at: "2024-04-25T10:00:00Z", do: preview_invoice}
    - {at: "2024-05-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {index: 0}
        fees_count: 2
        fees_amount_cents: 15000
        coupons_amount_cents: 2000
        total_amount_cents: 13000
      - select: {index: 1}
        fees_count: 1
        fees_amount_cents: 5000
        coupons_amount_cents: 0
        total_amount_cents: 5000
    preview:
      fees_count: 1
      fees_amount_cents: 5000
      coupons_amount_cents: 0
      sub_total_excluding_taxes_amount_cents: 5000
      total_amount_cents: 5000
  math: >-
    CHARACTERIZATION, and the row that says this cell's own axis is invisible on this surface.
    March finalized at 13_000¢ is the positive evidence: a metric-limited coupon takes 2_000¢ off the
    10_000¢ charge fee (applied_coupon_service.rb:120-125). April is previewed on the 25th, five days
    after the metric is deleted; the projection is April, because
    `Invoices::PreviewService#billing_time` is `end_of_periods.first + 1.day` for a persisted
    subscription (preview_service.rb:141-151).
    THE COUPON IS 0¢ ON THE PREVIEW BOTH BEFORE AND AFTER THE CHURN, and that coincidence is the
    finding rather than a defect in the row. `Coupons::PreviewService#fees` returns `Fee.none` for any
    `limited_billable_metrics?` coupon and the loop then `next`s on `fees.none?`
    (coupons/preview_service.rb:27,76-86), so a metric-limited coupon is never applied to a preview at
    all — the churn cannot move a number that is structurally zero. That is F71, and pinning it here
    is what stops a future reader from taking the 0 as evidence that the deletion broke the coupon.
    WHAT DOES MOVE, AND WHAT THIS ROW THEREFORE GUARDS, IS THE FEE: 5_000¢ previewed against the
    15_000¢ a live metric would have carried, because `add_charge_fees` reads
    `subscription.plan.charges` under the `kept` default scope (preview_service.rb:184-192) and the
    discarded charge is gone from it. The two invoices asserted beside it are where the coupon axis is
    real — 2_000¢ in March, 0¢ in April once `billable_metric_related_fees` joins to nothing — so the
    row reads as the divergence it is: the invoice loses 2_000¢ of discount it was applying, and the
    preview cannot report either the discount or its loss.

- id: b20/charge-replaced/progressive_billing_credit/draft
  block: B20
  axes: {churn: charge-replaced, carried_state: progressive_billing_credit, observed_via: draft}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, threshold_amount_cents: 5000, grace_period: 5}
  provenance: coverage-gap
  characterization: true
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  no_transaction: true
  setup:
    organization: {premium_integrations: [progressive_billing]}
    metrics: [{code: b20_w2_crd_sum, aggregation_type: sum_agg, field_name: amount}]
    plan:
      code: golden_b20_w2_crd
      interval: monthly
      amount_cents: 0
      usage_thresholds: [{amount_cents: 5000}]
    charges: [{billable_metric_code: b20_w2_crd_sum, charge_model: standard, properties: {amount: "1"}}]
    customer:
      external_id: golden_b20_w2_crd_cust
      currency: EUR
      invoice_grace_period: 5
    subscription: {external_id: golden_b20_w2_crd_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w2_crd_sum, properties: {amount: 100}}]
    - {at: "2024-03-05T11:00:00Z", do: perform_usage_update}
    - at: "2024-03-10T10:00:00Z"
      do: update_plan
      params:
        charges:
          - {billable_metric_code: b20_w2_crd_sum, charge_model: standard, properties: {amount: "1"}}
    - at: "2024-03-15T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w2_crd_sum, properties: {amount: 50}}]
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {invoice_type: progressive_billing}
        status: finalized
        fees_amount_cents: 10000
        total_amount_cents: 10000
      - select: {invoice_type: subscription}
        status: draft
        fees_amount_cents: 15000
        progressive_billing_credit_amount_cents: 0
        credit_notes_amount_cents: 0
        sub_total_excluding_taxes_amount_cents: 15000
        total_amount_cents: 15000
    credit_note:
      select: {index: -1}
      credit_amount_cents: 10000
      balance_amount_cents: 10000
  math: >-
    CHARACTERIZATION. The churn that rewrites `charge_id` and nothing else, on the surface where the
    lost credit costs money — and with usage AFTER the replacement, so the new charge is demonstrably
    the one doing the billing.
    100 units cross the 5_000¢ threshold on 5 March and the threshold invoice takes 10_000¢ against
    the OLD charge id. The 10 March `update_plan` sends one id-less charges entry for the same metric:
    `Plans::UpdateService#process_charges` creates a charge for it (update_service.rb:230-235) and
    `sanitize_charges` discards the one the array did not name (:241-248), so the charge record is
    replaced while the plan, the subscription and the metric are untouched. 50 more units arrive on
    the 15th and are billed by the new charge, which is what makes the 15_000¢ below evidence that the
    replacement is live rather than a no-op.
    The March draft therefore bills 150 x 1.00 = 15_000¢ (aggregation queries events by metric, not by
    charge id) and Credits::ProgressiveBillingService caps the credit at
    `invoice.fees.charge.where(charge_id: progressive_billing_invoice.fees.charge.pluck(:charge_id))`
    (progressive_billing_service.rb:29-33). Across the replacement that join matches nothing, the cap
    is 0, `amount_to_credit` > `total_charges_amount`, and the whole 10_000¢ becomes a credit note
    with `amount_to_credit` set to 0.
    A DRAFT MAY NOT SPEND A CREDIT NOTE (`should_create_credit_note_credit?` is false while not
    finalizing, calculate_fees_service.rb:364), so credit_notes_amount_cents is 0 and the draft asks
    for 15_000¢ on a period where 10_000¢ has already been collected.
    THE NUMBER IF THE STATE HAD BEEN FOUND IS 5_000¢: 15_000 of fees less a 10_000 progressive credit,
    which is what b05 gets when nothing is reconfigured. 15_000 vs 5_000, and
    progressive_billing_credit_amount_cents 0 vs 10_000.
    Companion of b20/hns/charge-replaced/progressive_billing_credit/invoice, where the same diverted
    note is spent on the spot and the total is accidentally right. One rewritten column, two surfaces,
    and only the draft shows the money.

- id: b20/charge-replaced/progressive_billing_credit/regenerated
  block: B20
  axes: {churn: charge-replaced, carried_state: progressive_billing_credit, observed_via: regenerated}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, threshold_amount_cents: 5000, grace_period: 5}
  provenance: coverage-gap
  characterization: true
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  no_transaction: true
  setup:
    organization: {premium_integrations: [progressive_billing]}
    metrics: [{code: b20_w2_crr_sum, aggregation_type: sum_agg, field_name: amount}]
    plan:
      code: golden_b20_w2_crr
      interval: monthly
      amount_cents: 0
      usage_thresholds: [{amount_cents: 5000}]
    charges: [{billable_metric_code: b20_w2_crr_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b20_w2_crr_cust, currency: EUR}
    subscription: {external_id: golden_b20_w2_crr_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w2_crr_sum, properties: {amount: 100}}]
    - {at: "2024-03-05T11:00:00Z", do: perform_usage_update}
    - at: "2024-03-06T10:00:00Z"
      do: update_customer
      params: {invoice_grace_period: 5}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - at: "2024-04-02T10:00:00Z"
      do: update_plan
      params:
        charges:
          - {billable_metric_code: b20_w2_crr_sum, charge_model: standard, properties: {amount: "1"}}
    - {at: "2024-04-03T10:00:00Z", do: refresh_invoice, select: {invoice_type: subscription}}
  expect:
    invoices: 2
    invoice:
      - select: {invoice_type: progressive_billing}
        status: finalized
        fees_amount_cents: 10000
        total_amount_cents: 10000
      - select: {invoice_type: subscription}
        status: draft
        fees_amount_cents: 10000
        progressive_billing_credit_amount_cents: 0
        credit_notes_amount_cents: 0
        sub_total_excluding_taxes_amount_cents: 10000
        total_amount_cents: 10000
    credit_note:
      select: {index: -1}
      credit_amount_cents: 10000
      total_amount_cents: 10000
      balance_amount_cents: 10000
  math: >-
    CHARACTERIZATION. A draft that was right becomes wrong when a charge record is swapped under it,
    with no plan clone and no new subscription to blame.
    The threshold invoice takes 10_000¢ on 5 March; the grace period is raised on the 6th, after it
    (Customers::UpdateInvoiceIssuingDateSettingsService:24-32 finalizes drafts when a period is
    shortened); the March invoice is drafted on 1 April WHILE THE ORIGINAL CHARGE IS STILL THERE, so
    its charge fee carries the same charge_id as the threshold fee, the cap at
    progressive_billing_service.rb:29-33 matches, 10_000¢ is credited and the draft sits at 0¢.
    The replacement lands on 2 April — one id-less `update_plan` charges entry, so
    `process_charges` creates a new charge and `sanitize_charges` discards the old
    (update_service.rb:230-248) — and the draft is refreshed on the 3rd.
    RefreshDraftService then destroys `invoice.credits.progressive_billing_invoice_kind` and zeroes
    progressive_billing_credit_amount_cents, rebuilds the charge fee from the NEW charge, and re-runs
    ProgressiveBillingService, which now finds `total_charges_amount` 0. `to_credit_amount` is back to
    the full 10_000¢ because the credit that netted it down was just destroyed, so the whole amount
    goes into CreditNotes::CreateFromProgressiveBillingInvoice.
    THE DRAFT GOES FROM 0¢ TO 10_000¢ and a 10_000¢ credit note appears that it may not spend. The
    customer has paid 10_000¢ and is shown 10_000¢ more.
    THE CONTROL IS b20/plan-upgrade/progressive_billing_credit/regenerated — identical shape,
    identical refresh, charge_id rewritten by an upgrade instead, and there the draft comes back at 0.
    So the refresh is not the cause; the refresh is only when the rewritten id is first consulted. And
    b20/plan-override/progressive_billing_credit/regenerated is the same outcome reached by rewriting
    three columns instead of one, which together name `charge_id` as the sole cause.
    The credit note carries `select: {index: -1}` because without a selector expect.credit_note
    asserts the payload captured at CREATION by a `create_credit_note` step this row does not have.

- id: b20/charge-replaced/progressive_billing_credit/preview
  block: B20
  axes: {churn: charge-replaced, carried_state: progressive_billing_credit, observed_via: preview}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, threshold_amount_cents: 5000}
  provenance: coverage-gap
  characterization: true
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  no_transaction: true
  setup:
    organization: {premium_integrations: [progressive_billing, preview]}
    metrics: [{code: b20_w2_crv_sum, aggregation_type: sum_agg, field_name: amount}]
    plan:
      code: golden_b20_w2_crv
      interval: monthly
      amount_cents: 0
      usage_thresholds: [{amount_cents: 5000}]
    charges: [{billable_metric_code: b20_w2_crv_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b20_w2_crv_cust, currency: EUR}
    subscription: {external_id: golden_b20_w2_crv_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w2_crv_sum, properties: {amount: 100}}]
    - {at: "2024-03-05T11:00:00Z", do: perform_usage_update}
    - at: "2024-03-10T10:00:00Z"
      do: update_plan
      params:
        charges:
          - {billable_metric_code: b20_w2_crv_sum, charge_model: standard, properties: {amount: "1"}}
    - {at: "2024-03-25T10:00:00Z", do: preview_invoice}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {invoice_type: progressive_billing}
        status: finalized
        fees_amount_cents: 10000
        total_amount_cents: 10000
      - select: {invoice_type: subscription}
        fees_amount_cents: 10000
        progressive_billing_credit_amount_cents: 0
        credit_notes_amount_cents: 10000
        total_amount_cents: 0
    preview:
      fees_amount_cents: 10000
      progressive_billing_credit_amount_cents: 0
      sub_total_excluding_taxes_amount_cents: 10000
      total_amount_cents: 10000
  math: >-
    CHARACTERIZATION. `Invoices::PreviewService` keeps its own copy of the charge_id cap, so it is
    exposed to a charge replacement exactly as the invoice pipeline is — and it is the surface where
    the loss cannot be disguised.
    The threshold invoice takes 10_000¢ on 5 March; the charge is replaced on the 10th by one id-less
    `update_plan` charges entry (update_service.rb:230-248); the preview is taken on the 25th, after
    the replacement and before the period closes, as a projection of March
    (`billing_time` = `end_of_periods.first + 1.day`, preview_service.rb:141-151).
    `apply_progressive_billing_credits` reuses the read-only Subscriptions::ProgressiveBilledAmount,
    which still finds the threshold invoice because it joins on subscription and boundaries only, then
    filters with `billed_charge_ids = progressive_invoice.fees.charge.pluck(:charge_id)` and
    `next 0 unless billed_charge_ids.include?(fee.charge_id)` (:346-352). The previewed fee belongs to
    the NEW charge, so the include? is false, `creditable_amount_cents` is 0,
    `amount_cents = [10_000, 0].min` is 0 and the guard `next unless amount_cents.positive?` drops the
    credit. A preview may not mint the credit note that hides the loss on a finalized invoice
    (:344-345), so the quote is the whole period again: 10_000¢ on a period that has already paid
    10_000¢.
    THE NUMBER IF THE STATE HAD BEEN FOUND IS 0 with a 10_000¢ credit, which is what
    b20/plan-upgrade/progressive_billing_credit/preview asserts through the same preview code.
    THE INVOICE ASSERTED BESIDE IT DISAGREES WITH THE PREVIEW: 10_000¢ of fees, credit 0, a 10_000¢
    credit note, total 0. Same rewritten column, two disguises, and the total alone can tell neither.

# ---------------------------------------------------------------------------------------------
# paid_advance_fee where the churn rewrites a METRIC's charge, not a fixed charge.
#
# The four existing rows in this column all reach the state through Fees::FixedChargeService, which a
# metric churn cannot touch — a fixed charge has no billable metric. The join at risk here is the
# other one CARRIED_STATE_KEYS names: `CachedAggregation.charge_id`
# (billable_metrics/aggregations/base_service.rb:230-243), written by
# Fees::CreatePayInAdvanceService#cache_aggregation_result (:207-226) and read back by
# SumService#compute_pay_in_advance_aggregation (:139-174) to work out how much of the period's peak
# the customer has ALREADY paid for.
#
# WHICH IS WHY EVERY ROW BELOW INGESTS A DECREMENT. With positive events only the running total is
# monotonic, the delta is the event's own value, and a lost cache produces exactly the same fee — the
# row would be decoration. It takes a negative event to put `current_aggregation` BELOW
# `max_aggregation`, which is the one state the cache carries that cannot be recomputed from the
# events alone.

- id: b20/charge-replaced/paid_advance_fee/invoice
  block: B20
  axes: {churn: charge-replaced, carried_state: paid_advance_fee, observed_via: invoice}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, plan_amount_cents: 5000, charge_pay_in_advance: true, charge_invoiceable: true}
  provenance: coverage-gap
  characterization: true
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  setup:
    metrics: [{code: b20_w2_cai_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b20_w2_cai, interval: monthly, amount_cents: 5000}
    charges:
      - billable_metric_code: b20_w2_cai_sum
        charge_model: standard
        pay_in_advance: true
        invoiceable: true
        properties: {amount: "1"}
    customer: {external_id: golden_b20_w2_cai_cust, currency: EUR}
    subscription: {external_id: golden_b20_w2_cai_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w2_cai_sum, properties: {amount: 100}}]
    - at: "2024-03-08T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w2_cai_sum, properties: {amount: -60}}]
    - at: "2024-03-12T10:00:00Z"
      do: update_plan
      params:
        charges:
          - billable_metric_code: b20_w2_cai_sum
            charge_model: standard
            pay_in_advance: true
            invoiceable: true
            properties: {amount: "1"}
    - at: "2024-03-18T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w2_cai_sum, properties: {amount: 50}}]
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 4
    invoice:
      - select: {index: 0}
        status: finalized
        fees_count: 1
        fees_amount_cents: 10000
        total_amount_cents: 10000
        fees:
          - {fee_type: charge, units: "100.0", amount_cents: 10000}
      - select: {index: 1}
        fees_amount_cents: 0
        total_amount_cents: 0
      - select: {index: 2}
        fees_count: 1
        fees_amount_cents: 5000
        total_amount_cents: 5000
        fees:
          - {fee_type: charge, units: "50.0", amount_cents: 5000}
      - select: {index: 3}
        fees_amount_cents: 5000
        total_amount_cents: 5000
  math: >-
    CHARACTERIZATION. Replacing a charge record makes Lago forget how much of the period's peak usage
    the customer has already paid for, and it bills them for it a second time.
    The charge pays in advance and is invoiceable, so each event raises its own invoice
    (b03/standard/sum_agg/invoiceable is the uncomplicated version of that).
    5 MARCH, +100. No cached aggregation yet, so
    SumService#compute_pay_in_advance_aggregation returns the event's own value 100 and writes
    `current_aggregation: 100, max_aggregation: 100` against THIS charge's id
    (create_pay_in_advance_service.rb:212-226). ApplyPayInAdvanceChargeModelService prices the delta as
    `amount_from_aggregation - amount_excluding_persisted_event` = 100 x 1.00 - 40... no: 100 x 1.00 -
    0 x 1.00 = 100.00 → 10_000¢, units 100. That invoice is the positive evidence the state exists.
    8 MARCH, -60. The cache is found: `current_aggregation` 100 - 60 = 40, `old_max` 100, and 40 is
    NOT greater than 100, so the delta is 0 and the cache is rewritten as `current 40, max 100`
    (:161-172). The fee is 40 x 1.00 - 40 x 1.00 = 0, and `display_applied_units_for_zero_invoice?`
    holds (40 <= 100) so the units shown are the applied -60, floored to 0
    (apply_pay_in_advance_charge_model_service.rb:112-125). A 0¢ invoice is still raised, because
    Invoices::CreatePayInAdvanceChargeService returns early only on `fees.none?` (:16) and a 0¢ fee is
    a fee. THIS EVENT IS THE WHOLE POINT: it is what puts current below max, the one thing the cache
    carries that cannot be recomputed from the event stream.
    12 MARCH, the churn. One id-less `update_plan` charges entry for the same metric:
    `Plans::UpdateService#process_charges` creates a charge (update_service.rb:230-235) and
    `sanitize_charges` discards the old one (:241-248). New charge_id, same plan, same subscription,
    same metric — and every CachedAggregation row still points at the dead id.
    18 MARCH, +50. `find_cached_aggregation` scopes on `charge_id: charge.id`
    (aggregations/base_service.rb:230-243), which now matches nothing, so the service takes its
    no-cache branch and returns the raw 50 as the delta. The period sum is still 90 (aggregation reads
    events by metric, not by charge), so the fee is 90 x 1.00 - 40 x 1.00 = 50.00 → 5_000¢.
    THE NUMBER IF THE CACHE HAD BEEN FOUND IS 0¢. current would be 40 + 50 = 90 against a max of 100,
    90 is not greater than 100, the delta is 0 and the fee is 90 x 1.00 - 90 x 1.00 = 0 — correct,
    because the customer already paid for a peak of 100 and 90 is still under it. So the row's two
    readings are 5_000¢ and 0¢ on the same event, and the customer pays 15_000¢ for a period whose
    peak usage cost 10_000¢.
    The 1 April period invoice carries only the 5_000¢ subscription fee: `create_charges_fees` skips
    the charge entirely via `.where.not(pay_in_advance: true, billable_metric: {recurring: false})`
