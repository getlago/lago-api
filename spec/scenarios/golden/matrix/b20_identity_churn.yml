  math: >-
    CHARACTERIZATION. The quote agrees with the invoice, and both are 5_000¢ below the floor the
    customer contracted for.
    Invoices::PreviewService reimplements the whole pipeline, and it reaches the commitment through the
    same single reference the invoice does: `add_commitment_fee` opens with
    `return unless subscription.plan.minimum_commitment` (preview_service.rb:259-260). The override on
    10 April left the subscription on a clone with no commitment, so the guard fires and the previewed
    April invoice carries the subscription fee and the charge fee only — 2_000 + 3_000 = 5_000¢, two
    fees, no true-up, and the 1 May invoice confirms it.
    That agreement matters because preview and invoice differ constantly elsewhere in this block
    (b20/filter-changed/progressive_billing_credit/preview, b17/pb-coupon-tax/preview). Here they do
    not, and the reason is structural: a commitment is not a reducer with two implementations to drift
    apart — it is one nil check on the plan, made twice.
    THE CONTROL NUMBER IS 10_000¢ WITH THREE FEES, asserted on the March invoice in this same row.
    Without the override the preview would quote the true-up too, because a preview applies producers
    unconditionally; with it, neither surface can see the commitment and the customer is quoted the
    reduced amount as though it were correct.
    The charge deliberately has usage in the previewed period: Invoices::PreviewService dies on a plan
    whose charge has no usage (three nils in one path), so a zero-usage April would fail this row with
    a 500 rather than a disagreement.

# ---------------------------------------------------------------------------------------------
# The two surfaces lead 1 did not reach, completing plan-override x progressive_billing_credit.

- id: b20/plan-override/progressive_billing_credit/regenerated
  block: B20
  axes: {churn: plan-override, carried_state: progressive_billing_credit, observed_via: regenerated}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, threshold_amount_cents: 5000, grace_period: 5}
  provenance: coverage-gap
  characterization: true
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  no_transaction: true
  setup:
    organization: {premium_integrations: [progressive_billing]}
    metrics: [{code: b20_w1_pbr_sum, aggregation_type: sum_agg, field_name: amount}]
    plan:
      code: golden_b20_w1_pbr
      interval: monthly
      amount_cents: 0
      usage_thresholds: [{amount_cents: 5000}]
    charges: [{billable_metric_code: b20_w1_pbr_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b20_w1_pbr_cust, currency: EUR}
    subscription: {external_id: golden_b20_w1_pbr_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w1_pbr_sum, properties: {amount: 100}}]
    - {at: "2024-03-05T11:00:00Z", do: perform_usage_update}
    - at: "2024-03-06T10:00:00Z"
      do: update_customer
      params: {invoice_grace_period: 5}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - at: "2024-04-02T10:00:00Z"
      do: update_subscription
      params:
        plan_overrides: {name: b20 w1 overridden plan}
    - {at: "2024-04-03T10:00:00Z", do: refresh_invoice, select: {invoice_type: subscription}}
  expect:
    invoices: 2
    invoice:
      - select: {invoice_type: progressive_billing}
        status: finalized
        fees_amount_cents: 10000
        total_amount_cents: 10000
      - select: {invoice_type: subscription}
        status: draft
        fees_amount_cents: 10000
        progressive_billing_credit_amount_cents: 0
        credit_notes_amount_cents: 0
        sub_total_excluding_taxes_amount_cents: 10000
        total_amount_cents: 10000
    credit_note:
      select: {index: -1}
      credit_amount_cents: 10000
      total_amount_cents: 10000
      balance_amount_cents: 10000
  math: >-
    CHARACTERIZATION, and the version of lead 1 in which the loss is caused by the refresh and can be
    watched happening.
    The order is deliberately the opposite of the /invoice and /draft rows. The threshold invoice takes
    10_000¢ on 5 March; the grace period is raised on the 6th (after it, because
    Customers::UpdateInvoiceIssuingDateSettingsService:24-32 issues drafts when a period is shortened);
    the March period invoice is drafted on 1 April WHILE THE PLAN IS STILL THE ORIGINAL, so its charge
    fee carries the same charge_id as the threshold fee, the cap at
    progressive_billing_service.rb:29-33 matches, 10_000¢ is credited and the draft sits at 0¢. The
    override lands on 2 April; the draft is refreshed on the 3rd.
    RefreshDraftService then does three things in sequence that together lose the money:
    `reset_invoice_values` destroys `invoice.credits.progressive_billing_invoice_kind` and zeroes
    progressive_billing_credit_amount_cents; CalculateFeesService rebuilds the charge fee from
    `subscription.plan.charges`, which is now the CLONE's charge with a fresh id; and
    ProgressiveBillingService re-runs, finds `total_charges_amount` 0 because the fee it just built no
    longer matches the threshold fee's charge_id, and — `amount_to_credit` being 10_000 and the
    threshold invoice's `to_credit_amount` being back to the full 10_000 now that the credit which had
    netted it down is destroyed — diverts the entire amount into
    CreditNotes::CreateFromProgressiveBillingInvoice and sets `amount_to_credit` to 0.
    THE DRAFT GOES FROM 0¢ TO 10_000¢ AND A 10_000¢ CREDIT NOTE APPEARS, which the draft may not spend
    (`should_create_credit_note_credit?` is false while not finalizing, calculate_fees_service.rb:364).
    The customer has paid 10_000¢ and is shown 10_000¢ more.
    THE CONTROL IS b20/plan-upgrade/progressive_billing_credit/regenerated: identical shape, identical
    refresh, charge_id rewritten by an upgrade instead — and there the draft comes back at 0. So the
    refresh is not the cause; the refresh is only when the rewritten id is first consulted.
    The credit note is asserted with `select: {index: -1}` because without a selector
    expect.credit_note reads the payload captured at CREATION by this row's own create_credit_note step
    — of which there is none — and because its 10_000¢ balance is the positive evidence that the
    threshold money existed and was diverted rather than never collected.

- id: b20/plan-override/progressive_billing_credit/preview
  block: B20
  axes: {churn: plan-override, carried_state: progressive_billing_credit, observed_via: preview}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, threshold_amount_cents: 5000}
  provenance: coverage-gap
  characterization: true
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  no_transaction: true
  setup:
    organization: {premium_integrations: [progressive_billing, preview]}
    metrics: [{code: b20_w1_pbp_sum, aggregation_type: sum_agg, field_name: amount}]
    plan:
      code: golden_b20_w1_pbp
      interval: monthly
      amount_cents: 0
      usage_thresholds: [{amount_cents: 5000}]
    charges: [{billable_metric_code: b20_w1_pbp_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b20_w1_pbp_cust, currency: EUR}
    subscription: {external_id: golden_b20_w1_pbp_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w1_pbp_sum, properties: {amount: 100}}]
    - {at: "2024-03-05T11:00:00Z", do: perform_usage_update}
    - at: "2024-03-10T10:00:00Z"
      do: update_subscription
      params:
        plan_overrides: {name: b20 w1 overridden plan}
    - {at: "2024-03-25T10:00:00Z", do: preview_invoice}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {invoice_type: progressive_billing}
        fees_amount_cents: 10000
        total_amount_cents: 10000
      - select: {invoice_type: subscription}
        fees_amount_cents: 10000
        progressive_billing_credit_amount_cents: 0
        credit_notes_amount_cents: 10000
        total_amount_cents: 0
    preview:
      fees_amount_cents: 10000
      progressive_billing_credit_amount_cents: 0
      sub_total_excluding_taxes_amount_cents: 10000
      total_amount_cents: 10000
  math: >-
    CHARACTERIZATION. The surface on which the diverted credit cannot be disguised: the preview quotes
    the whole period again.
    The setup is lead 1's, with a preview taken on 25 March — after the 10 March override and before
    the period closes.
    Invoices::PreviewService keeps its OWN copy of the cap. It reuses the read-only
    Subscriptions::ProgressiveBilledAmount (which is subscription-scoped and still finds the threshold
    invoice), then filters the fees it may credit with
    `billed_charge_ids = progressive_invoice.fees.charge.pluck(:charge_id)` and
    `next 0 unless billed_charge_ids.include?(fee.charge_id)` (preview_service.rb:346-352). The
    previewed fee comes from the OVERRIDE plan's charge, so the include? is false,
    `creditable_amount_cents` is 0, `amount_cents = [10_000, 0].min` is 0 and the guard
    `next unless amount_cents.positive?` drops the credit entirely.
    And a preview may not issue a credit note — the comment at :344-345 says the excess is simply
    dropped — so there is no second spelling of the money to make the total look right. The quote is
    10_000¢ for a period on which 10_000¢ has already been collected: exactly the overstatement the
    comment at :324-329 says this code exists to prevent.
    THE INVOICE IS ASSERTED BESIDE IT AND DISAGREES: 10_000¢ of fees, credit 0, a 10_000¢ credit note,
    total 0. Same lost join, two different disguises — the invoice hides it in a credit note and
    settles at zero, the preview hides nothing and doubles the bill. That contrast is why
    `observed_via` is an axis of this block, and it is the reason a row asserting only the finalized
    total would have reported this cell as healthy.
    THE CONTROL NUMBER IS A 10_000¢ CREDIT AND A ZERO TOTAL ON BOTH SIDES, which is what
    b20/plan-upgrade/progressive_billing_credit/preview asserts with the same shape and the same
    preview code.

# ---------------------------------------------------------------------------------------------
# coupon_application x plan-override — plan_id, and the one join in this block that was DELIBERATELY
# made override-aware.
#
# Credits::AppliedCouponService#plan_related_fees joins on
# `applied_coupon.coupon.parent_and_overriden_plans.map(&:id)` (applied_coupon_service.rb:113-118),
# and Coupon#parent_and_overriden_plans is `plans + plans.map(&:children)` (coupon.rb:91-93) — an
# override plan's parent_id is the plan the coupon names, so the clone is in the list. The invoice
# therefore keeps a plan-limited coupon across an override.
# Invoices::PreviewService does NOT: Coupons::PreviewService#plan_related_fees compares
# `coupon.plans.map(&:id).include?(invoice.subscriptions[0].plan_id)` (preview_service.rb:87-93),
# an exact plan_id match with no children. The four rows below are that divergence.

- id: b20/plan-override/coupon_application/invoice
  block: B20
  axes: {churn: plan-override, carried_state: coupon_application, observed_via: invoice}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, coupon_amount_cents: 2000, coupon_limitation: plan}
  provenance: coverage-gap
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  setup:
    metrics: [{code: b20_w1_cpi_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b20_w1_cpi, interval: monthly, amount_cents: 5000}
    charges: [{billable_metric_code: b20_w1_cpi_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b20_w1_cpi_cust, currency: EUR}
    subscription: {external_id: golden_b20_w1_cpi_sub, billing_time: calendar}
    coupons:
      - name: b20 w1 plan coupon
        code: b20_w1_cpi_cpn
        coupon_type: fixed_amount
        frequency: recurring
        frequency_duration: 6
        amount_cents: 2000
        amount_currency: EUR
        expiration: no_expiration
        applies_to: {plan_codes: [golden_b20_w1_cpi]}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w1_cpi_sum, properties: {amount: 100}}]
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - at: "2024-04-10T10:00:00Z"
      do: update_subscription
      params:
        plan_overrides: {name: b20 w1 overridden plan}
    - at: "2024-04-15T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w1_cpi_sum, properties: {amount: 100}}]
    - {at: "2024-05-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {index: 0}
        fees_amount_cents: 15000
        coupons_amount_cents: 2000
        sub_total_excluding_taxes_amount_cents: 13000
        total_amount_cents: 13000
      - select: {index: 1}
        fees_amount_cents: 15000
        coupons_amount_cents: 2000
        sub_total_excluding_taxes_amount_cents: 13000
        total_amount_cents: 13000
  math: >-
    THE ONE JOIN IN THIS BLOCK SOMEBODY ALREADY FIXED, and the row that stops it regressing.
    A coupon limited to `plan_codes: [golden_b20_w1_cpi]` discounts 2_000¢ of a 15_000¢ period
    (5_000¢ plan + 100 units x 1.00). March is the control: fees 15_000, coupon 2_000, total 13_000.
    On 10 April the subscription is overridden, so from then on `subscription.plan_id` is the CLONE's
    and the coupon names the parent. April still discounts 2_000¢, because
    Credits::AppliedCouponService#plan_related_fees scopes on
    `plan: {id: applied_coupon.coupon.parent_and_overriden_plans.map(&:id)}`
    (applied_coupon_service.rb:113-118) and Coupon#parent_and_overriden_plans is
    `plans + plans.map(&:children)` (coupon.rb:91-93) — Plans::OverrideService sets
    `p.parent_id = plan.id` on the clone, so the clone is one of those children.
    THE COUNTERFACTUAL IS 15_000¢, and it is not hypothetical: it is what the PREVIEW of this same
    period quotes, because Coupons::PreviewService compares plan_id exactly. See
    b20/plan-override/coupon_application/preview.
    fees_amount_cents is asserted on both invoices so the row cannot pass on a period that billed
    nothing, and sub_total_excluding_taxes_amount_cents alongside the coupon amount because the coupon
    is the only thing between the two: 15_000 − 2_000 = 13_000. `frequency_duration: 6` is generous on
    purpose — the coupon is spent twice here and must still be live in April, so a 0 in that column
    can only mean the plan join missed, never that the coupon ran out.

- id: b20/plan-override/coupon_application/draft
  block: B20
  axes: {churn: plan-override, carried_state: coupon_application, observed_via: draft}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, coupon_amount_cents: 2000, coupon_limitation: plan, grace_period: 5}
  provenance: coverage-gap
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  setup:
    metrics: [{code: b20_w1_cpd_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b20_w1_cpd, interval: monthly, amount_cents: 5000}
    charges: [{billable_metric_code: b20_w1_cpd_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b20_w1_cpd_cust, currency: EUR}
    subscription: {external_id: golden_b20_w1_cpd_sub, billing_time: calendar}
    coupons:
      - name: b20 w1 plan coupon
        code: b20_w1_cpd_cpn
        coupon_type: fixed_amount
        frequency: recurring
        frequency_duration: 6
        amount_cents: 2000
        amount_currency: EUR
        expiration: no_expiration
        applies_to: {plan_codes: [golden_b20_w1_cpd]}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w1_cpd_sum, properties: {amount: 100}}]
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - at: "2024-04-02T10:00:00Z"
      do: update_customer
      params: {invoice_grace_period: 5}
    - at: "2024-04-10T10:00:00Z"
      do: update_subscription
      params:
        plan_overrides: {name: b20 w1 overridden plan}
    - at: "2024-04-15T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w1_cpd_sum, properties: {amount: 100}}]
    - {at: "2024-05-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {index: 0}
        status: finalized
        fees_amount_cents: 15000
        coupons_amount_cents: 2000
        total_amount_cents: 13000
      - select: {index: 1}
        status: draft
        fees_amount_cents: 15000
        coupons_amount_cents: 0
        credit_notes_amount_cents: 0
        prepaid_credit_amount_cents: 0
        sub_total_excluding_taxes_amount_cents: 15000
        total_amount_cents: 15000
  math: >-
    THE SURFACE THAT CANNOT ANSWER THE QUESTION, stated as such rather than dressed up.
    Coupons are gated: `should_create_coupon_credit?` returns false while
    `not_in_finalizing_process?` (calculate_fees_service.rb:367-373), so a draft carries no coupon at
    all — whether or not the plan join would have found one. The April draft therefore reads 15_000¢
    with coupons_amount_cents 0, and that 0 is NOT evidence about the churn.
    What this row does establish, and why it is worth a cell rather than a footnote:
      * The coupon exists and works on this subscription — March, in the same row, is finalized with
        2_000¢ discounted. Without that assertion a reader cannot tell a gated coupon from an absent
        one, which is precisely the silent-lookup failure mode this block exists to catch.
      * The gating is the ONLY reason for the 0. credit_notes_amount_cents and
        prepaid_credit_amount_cents are asserted at 0 beside it because they are gated by the same
        three lines, and sub_total_excluding_taxes_amount_cents 15_000 says nothing has been taken off
        the fees at all.
      * The churn did not disturb the producers: fees are 15_000¢ before and after the override, so the
        override changed no price and the whole of the difference between this row and its /invoice
        sibling (13_000¢) is the withheld coupon.
    The gating is deliberate — it stops a draft from consuming a `once` coupon that a refresh would
    have to give back — so this row is intended behaviour, not characterization. The cell's real answer
    lives in b20/plan-override/coupon_application/invoice, and this row is what says the draft could
    never have shown it.

- id: b20/plan-override/coupon_application/regenerated
  block: B20
  axes: {churn: plan-override, carried_state: coupon_application, observed_via: regenerated}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, coupon_amount_cents: 2000, coupon_limitation: plan, grace_period: 5}
  provenance: coverage-gap
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  setup:
    metrics: [{code: b20_w1_cpr_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b20_w1_cpr, interval: monthly, amount_cents: 5000}
    charges: [{billable_metric_code: b20_w1_cpr_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b20_w1_cpr_cust, currency: EUR}
    subscription: {external_id: golden_b20_w1_cpr_sub, billing_time: calendar}
    coupons:
      - name: b20 w1 plan coupon
        code: b20_w1_cpr_cpn
        coupon_type: fixed_amount
        frequency: recurring
        frequency_duration: 6
        amount_cents: 2000
        amount_currency: EUR
        expiration: no_expiration
        applies_to: {plan_codes: [golden_b20_w1_cpr]}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w1_cpr_sum, properties: {amount: 100}}]
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - at: "2024-04-02T10:00:00Z"
      do: update_customer
      params: {invoice_grace_period: 5}
    - at: "2024-04-15T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w1_cpr_sum, properties: {amount: 100}}]
    - {at: "2024-05-01T01:00:00Z", do: perform_billing}
    - at: "2024-05-02T10:00:00Z"
      do: update_subscription
      params:
        plan_overrides: {name: b20 w1 overridden plan, amount_cents: 9000}
    - {at: "2024-05-03T10:00:00Z", do: refresh_invoice, select: {index: 1}}
  expect:
    invoices: 2
    invoice:
      - select: {index: 0}
        fees_amount_cents: 15000
        coupons_amount_cents: 2000
        total_amount_cents: 13000
      - select: {index: 1}
        status: draft
        fees_amount_cents: 19000
        coupons_amount_cents: 0
        credit_notes_amount_cents: 0
        sub_total_excluding_taxes_amount_cents: 19000
        total_amount_cents: 19000
        fees:
          - {fee_type: subscription, amount_cents: 9000}
          - {fee_type: charge, units: "100.0", amount_cents: 10000}
  math: >-
    A refresh AFTER the override, and the row is built so that the refresh provably happened — which
    the /draft sibling cannot show.
    The override on 2 May carries `amount_cents: 9000` as well as a name, so the clone's subscription
    fee is 9_000¢ rather than the original 5_000¢. The April draft was built on 1 May at the old price
    (5_000 + 10_000 = 15_000¢); the refresh on the 3rd rebuilds it from
    `subscription.plan` — now the clone — and it comes back at 9_000 + 10_000 = 19_000¢. Without that
    price change a refreshed draft and an unrefreshed one would read the same number and the cell would
    assert nothing about the surface.
    The coupon stays at 0 for the reason it does on any draft: `should_create_coupon_credit?` returns
    false while the invoice is not finalizing (calculate_fees_service.rb:367-373), and
    RefreshDraftService calls CalculateFeesService with `context: :refresh`, so the refreshed draft is
    still a draft. So a refresh does not consult the plan-limited coupon join at all — a plan-limited
    coupon can neither be lost nor kept here, and 0 is the only value this surface has.
    THE POSITIVE EVIDENCE IS MARCH, finalized in this same row at 15_000¢ with 2_000¢ discounted: the
    coupon is applied, limited to the parent plan, and live (frequency_duration 6). And the per-fee
    assertion is what makes the 19_000¢ readable — 9_000¢ of subscription fee is the override, 10_000¢
    of charge is the unchanged 1.00 price, and neither number can be reached without the refresh
    having re-read the clone.
    When the invoice finalizes on 6 May the coupon returns: RefreshDraftAndFinalizeService runs the
    same service with `context: :finalize`, the gate opens, and the 2_000¢ is taken off the 19_000¢.
    The draft understates the discount; it does not lose it.

- id: b20/plan-override/coupon_application/preview
  block: B20
  pins: ["F71"]
  axes: {churn: plan-override, carried_state: coupon_application, observed_via: preview}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, coupon_amount_cents: 2000, coupon_limitation: plan}
  provenance: coverage-gap
  characterization: true
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  setup:
    organization: {premium_integrations: [preview]}
    metrics: [{code: b20_w1_cpp_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b20_w1_cpp, interval: monthly, amount_cents: 5000}
    charges: [{billable_metric_code: b20_w1_cpp_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b20_w1_cpp_cust, currency: EUR}
    subscription: {external_id: golden_b20_w1_cpp_sub, billing_time: calendar}
    coupons:
      - name: b20 w1 plan coupon
        code: b20_w1_cpp_cpn
        coupon_type: fixed_amount
        frequency: recurring
        frequency_duration: 6
        amount_cents: 2000
        amount_currency: EUR
        expiration: no_expiration
        applies_to: {plan_codes: [golden_b20_w1_cpp]}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w1_cpp_sum, properties: {amount: 100}}]
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - at: "2024-04-10T10:00:00Z"
      do: update_subscription
      params:
        plan_overrides: {name: b20 w1 overridden plan}
    - at: "2024-04-15T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w1_cpp_sum, properties: {amount: 100}}]
    - {at: "2024-04-25T10:00:00Z", do: preview_invoice}
    - {at: "2024-05-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {index: 0}
        fees_amount_cents: 15000
        coupons_amount_cents: 2000
        total_amount_cents: 13000
      - select: {index: 1}
        fees_amount_cents: 15000
        coupons_amount_cents: 2000
        total_amount_cents: 13000
    preview:
      fees_amount_cents: 15000
      coupons_amount_cents: 0
      sub_total_excluding_taxes_amount_cents: 15000
      total_amount_cents: 15000
  math: >-
    CHARACTERIZATION — the same coupon, the same period, two implementations of the same plan join, and
    only one of them was taught about overrides. The customer is quoted 15_000¢ and billed 13_000¢.
    The invoice keeps the coupon: Credits::AppliedCouponService#plan_related_fees scopes on
    `applied_coupon.coupon.parent_and_overriden_plans.map(&:id)` (applied_coupon_service.rb:113-118),
    which includes the override plan because it is a child of the plan the coupon names.
    The preview does not: Coupons::PreviewService#plan_related_fees is
    `if applied_coupon.coupon.plans.map(&:id).include?(invoice.subscriptions[0].plan_id) then
    invoice.fees else Fee.none end` (preview_service.rb:87-93) — an exact plan_id membership test with
    no `children`. After the 10 April override the subscription's plan_id is the clone's, the test is
    false, `fees` is empty and `next if fees.none?` skips the coupon entirely. No credit is built, so
    coupons_amount_cents stays 0 and the previewed total is the gross 15_000¢.
    A PREVIEW THAT DISAGREES WITH THE INVOICE IT FORECASTS IS THE BUG WORTH CATCHING, and 2_000¢ is
    the whole of the disagreement: fees are 15_000¢ on both sides, so nothing else moved. This is also
    the direction that hurts — the quote is HIGHER than the bill, so it does not merely mislead, it
    argues the customer out of a discount they have.
    THE CONTROL IS MARCH, before the override: the coupon's plan is the subscription's plan, the exact
    match holds, and preview and invoice would agree at 13_000¢. Both April invoices are asserted at
    2_000¢ discounted so the row fails if the coupon was simply exhausted rather than unmatched.

# ---------------------------------------------------------------------------------------------
# coupon_application x plan-upgrade — the same plan_id join, but the churn moves the subscription to a
# plan that is NOT a child of the one the coupon names, so `parent_and_overriden_plans` cannot save it.
#
# Both plans price at amount_cents 0 so nothing is ever prorated: every number below is usage x rate,
# and the only thing that can move a total is the coupon. Plan B prices the metric at 2.00 against A's
# 1.00, which is also what makes the change an UPGRADE (a cheaper plan would create a pending
# subscription and change nothing until the period ends).

- id: b20/plan-upgrade/coupon_application/invoice
  block: B20
  axes: {churn: plan-upgrade, carried_state: coupon_application, observed_via: invoice}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, coupon_amount_cents: 2000, coupon_limitation: plan, upgrade_day: 16}
  provenance: coverage-gap
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  setup:
    metrics: [{code: b20_w1_cui_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b20_w1_cui_a, interval: monthly, amount_cents: 0}
    plans:
      - code: golden_b20_w1_cui_b
        interval: monthly
        amount_cents: 0
        charges:
          - {billable_metric_code: b20_w1_cui_sum, charge_model: standard, properties: {amount: "2"}}
    charges: [{billable_metric_code: b20_w1_cui_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b20_w1_cui_cust, currency: EUR}
    subscription: {external_id: golden_b20_w1_cui_sub, billing_time: calendar}
    coupons:
      - name: b20 w1 plan-a coupon
        code: b20_w1_cui_cpn
        coupon_type: fixed_amount
        frequency: recurring
        frequency_duration: 6
        amount_cents: 2000
        amount_currency: EUR
        expiration: no_expiration
        applies_to: {plan_codes: [golden_b20_w1_cui_a]}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w1_cui_sum, properties: {amount: 30}}]
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - at: "2024-04-05T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w1_cui_sum, properties: {amount: 30}}]
    - at: "2024-04-16T10:00:00Z"
      do: create_subscription
      params: {plan_code: golden_b20_w1_cui_b}
    - {at: "2024-04-16T10:01:00Z", do: perform_billing}
    - at: "2024-04-20T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w1_cui_sum, properties: {amount: 40}}]
    - {at: "2024-05-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 3
    invoice:
      - select: {index: 0}
        fees_amount_cents: 3000
        coupons_amount_cents: 2000
        total_amount_cents: 1000
      - select: {index: 1}
        fees_amount_cents: 3000
        coupons_amount_cents: 2000
        total_amount_cents: 1000
      - select: {index: 2}
        fees_amount_cents: 8000
        coupons_amount_cents: 0
        sub_total_excluding_taxes_amount_cents: 8000
        total_amount_cents: 8000
  math: >-
    THE POINT AT WHICH THE OVERRIDE-AWARE JOIN STOPS BEING ENOUGH, in three invoices that share one
    coupon.
    March (index 0) is the control: 30 units x 1.00 = 3_000¢ on plan A, and the coupon — limited to
    `plan_codes: [golden_b20_w1_cui_a]` — takes 2_000¢ off. Total 1_000¢.
    The 16 April upgrade terminates A and bills it in arrears (index 1). The fees on that invoice
    belong to a subscription whose plan is still A, so
    Credits::AppliedCouponService#plan_related_fees matches through
    `parent_and_overriden_plans` (which contains A itself) and the coupon lands again: 30 units x 1.00
    = 3_000¢ less 2_000¢ = 1_000¢. That second application is the second piece of positive evidence —
    the coupon is not merely configured, it is being spent, right up to the churn.
    Plan B's own first period (index 2, 16–30 April) is where the join fails: 40 units x 2.00 = 8_000¢
    and NO discount. `parent_and_overriden_plans` is `plans + plans.map(&:children)` (coupon.rb:91-93);
    B is neither A nor a child of A — Subscriptions::PlanUpgradeService builds a fresh Subscription
    pointing at B with `previous_subscription_id` set (plan_upgrade_service.rb:52-72), and nothing in
    that lineage makes B a child of A — so `plan_related_fees` returns an empty relation,
    `return result unless fees.any?` fires, and no Credit is built.
    THE COUNTERFACTUAL IS 6_000¢. `frequency_duration: 6` is deliberately generous: the coupon has been
    applied twice and has four periods left, so coupons_amount_cents 0 on index 2 can only mean the
    plan join missed and never that the coupon was exhausted. That distinction is the whole reason the
    duration is asserted-by-construction rather than left at the default.
    Whether this is a DEFECT depends on what a plan-limited coupon is for, and the row does not
    pretend to settle it — a coupon naming plan A arguably should stop when the customer leaves A. What
    it does settle is that an upgrade silently ends a live discount with no event, no webhook and no
    trace on any invoice, which is the class of thing this block exists to make visible.

