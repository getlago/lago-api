    - at: "2024-03-08T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w2_pud_sum, properties: {amount: -60}}]
    - at: "2024-03-12T10:00:00Z"
      do: create_subscription
      params: {plan_code: golden_b20_w2_pud_b}
    - at: "2024-03-18T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w2_pud_sum, properties: {amount: 50}}]
