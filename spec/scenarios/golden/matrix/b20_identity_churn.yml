    The quote is the 5_000¢ subscription fee and nothing else, and fees_count 1 is asserted to say so.
    THE PREVIEWED NUMBERS ARE THE SAME WHETHER THE CACHE WAS FOUND OR LOST — 5_000¢ either way — and
    that coincidence is the finding rather than a defect in the row. A customer who has been billed
    15_000¢ in advance for a period worth 10_000¢ can ask Lago what this period will cost and be told
    5_000¢, with no mention of the 15_000¢ already taken and no way for the answer to reflect the
    error. Every other surface in this block at least reports the wrong number; this one reports
    nothing.
    THE DISCRIMINATING ASSERTIONS ARE THEREFORE THE INVOICES BESIDE IT: index 0 at 10_000¢ is the
    positive evidence the cache existed, and index 2 at 5_000¢ with 50 units is the over-charge that a
    found cache would have priced at 0¢. Without them the preview block alone would guard nothing,
    which is exactly the trap this block's `observed_via` axis exists to expose.

- id: b20/metric-deleted/paid_advance_fee/invoice
  block: B20
  axes: {churn: metric-deleted, carried_state: paid_advance_fee, observed_via: invoice}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, plan_amount_cents: 5000, charge_pay_in_advance: true, charge_invoiceable: true}
  provenance: coverage-gap
  characterization: true
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  setup:
    metrics: [{code: b20_w2_mai_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b20_w2_mai, interval: monthly, amount_cents: 5000}
    charges:
      - billable_metric_code: b20_w2_mai_sum
        charge_model: standard
        pay_in_advance: true
        invoiceable: true
        properties: {amount: "1"}
    customer: {external_id: golden_b20_w2_mai_cust, currency: EUR}
    subscription: {external_id: golden_b20_w2_mai_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w2_mai_sum, properties: {amount: 100}}]
    - {at: "2024-03-12T10:00:00Z", do: delete_metric, code: b20_w2_mai_sum}
    - at: "2024-03-18T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w2_mai_sum, properties: {amount: 200}}]
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {index: 0}
        status: finalized
        fees_count: 1
        fees_amount_cents: 10000
        total_amount_cents: 10000
        fees:
          - {fee_type: charge, units: "100.0", amount_cents: 10000}
      - select: {index: 1}
        fees_count: 1
        fees_amount_cents: 5000
        total_amount_cents: 5000
        fees:
          - {fee_type: subscription, amount_cents: 5000}
  math: >-
    CHARACTERIZATION. Deleting a metric does not stop its pay-in-advance events arriving — it stops
    them being billed, silently, with no invoice, no fee and no error.
    5 MARCH, +100. The charge pays in advance and is invoiceable, so the event raises its own invoice
    at once: 100 units x 1.00 = 10_000¢, and a CachedAggregation row against this charge's id holding
    `current 100, max 100` (create_pay_in_advance_service.rb:212-226). That invoice is the positive
    evidence the machinery worked before the churn — without it a row asserting silence afterwards
    would pass on a subscription that never billed anything at all.
    12 MARCH. `BillableMetrics::DestroyService` discards the metric and
    `metric.charges.update_all(deleted_at:)` (destroy_service.rb:29).
    18 MARCH, +200. `Events::PostProcessService#handle_pay_in_advance` returns before enqueueing
    anything: its `charges` lookup is
    `subscription.plan.charges.pay_in_advance.joins(:billable_metric).where(billable_metric: {code:})`
    (:136-146), and both `Charge` and `BillableMetric` carry a `kept` default scope, so it comes back
    empty and `return unless charges.any?` (:131) fires. No Fees::CreatePayInAdvanceService call, no
    fee, no invoice — hence `invoices: 2`, which is the assertion that carries the whole finding.
    THE NUMBER IF THE STATE HAD BEEN FOUND IS 20_000¢ ON A THIRD INVOICE. With the metric alive the
    cache is found, `current_aggregation` 100 + 200 = 300 exceeds `max_aggregation` 100, so the delta
    is 300 - 100 = 200 and the fee is 300 x 1.00 - 100 x 1.00 = 200.00 → 20_000¢
    (sum_service.rb:161-168). So the two readings of this row are three invoices totalling 35_000¢ and
    two totalling 15_000¢: 200 units of usage the customer consumed and was never asked to pay for.
    A deleted metric legitimately stops BILLING. What it should not do is keep accepting events for a
    charge that no longer exists while the period invoice reports nothing unusual: the 1 April invoice
    is a clean 5_000¢ subscription fee, fees_count 1, with no trace that 200 units went past.
    Compare b20/charge-replaced/paid_advance_fee/invoice, where the same lost `charge_id` on the same
    cache costs the customer 5_000¢ EXTRA. One column, two churns, opposite directions of error —
    which is why the invoice count and the per-fee units are both asserted here rather than the total
    alone.

- id: b20/metric-deleted/paid_advance_fee/draft
  block: B20
  axes: {churn: metric-deleted, carried_state: paid_advance_fee, observed_via: draft}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, plan_amount_cents: 5000, charge_pay_in_advance: true, charge_invoiceable: true, grace_period: 5}
  provenance: coverage-gap
