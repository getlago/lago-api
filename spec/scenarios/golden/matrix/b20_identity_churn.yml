        units: 1
        pay_in_advance: false
        prorated: false
        properties: {amount: "0"}
    customer: {external_id: golden_b20_w1_sod_cust, currency: EUR}
    subscription: {external_id: golden_b20_w1_sod_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w1_sod_sum, properties: {amount: 100}}]
    - {at: "2024-03-05T11:00:00Z", do: perform_usage_update}
    - at: "2024-03-06T10:00:00Z"
      do: update_customer
      params: {invoice_grace_period: 5}
    - at: "2024-03-10T10:00:00Z"
      do: update_subscription_fixed_charge
      fixed_charge:
        add_on_code: b20_w1_sod_seat
        units: 1
        properties: {amount: "0"}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {invoice_type: progressive_billing}
        status: finalized
        fees_amount_cents: 10000
        total_amount_cents: 10000
      - select: {invoice_type: subscription}
        status: draft
        fees_amount_cents: 10000
        progressive_billing_credit_amount_cents: 0
        coupons_amount_cents: 0
        credit_notes_amount_cents: 0
        prepaid_credit_amount_cents: 0
        sub_total_excluding_taxes_amount_cents: 10000
        total_amount_cents: 10000
  math: >-
    CHARACTERIZATION, AND THIS IS WHERE THE MONEY GOES. The customer has paid 10_000¢ and is shown
    10_000¢ more for the same 100 units.
    Identical to b20/subscription-override/progressive_billing_credit/invoice except that the grace
    period is raised to 5 days on 6 March — after the threshold invoice is finalized, because
    Customers::UpdateInvoiceIssuingDateSettingsService:24-32 issues existing drafts when a period is
    shortened rather than lengthened.
    The diversion happens exactly as it does on the finalized invoice: the clone's charge_id defeats
    the cap, `amount_to_credit` exceeds `total_charges_amount` of 0, and a 10_000¢ credit note is
    minted. But a credit note is BEHIND the finalization gate —
    `should_create_credit_note_credit?` is `!not_in_finalizing_process?`
    (calculate_fees_service.rb:364) — so the draft cannot spend the thing that made its total look
    right on the other surface. progressive_billing_credit_amount_cents 0 and
    credit_notes_amount_cents 0 together are the finding: the money is in neither column.
    The other two gated reducers are asserted at 0 for the same reason the /draft sibling of lead 1
    asserts them: a draft carries fees plus tax and nothing else, so a reader can see that 10_000¢ is
    the whole of what will be demanded and not a figure awaiting a discount.
    THE CONTROL IS b20/plan-upgrade/progressive_billing_credit/draft — same surface, same grace-period
    ordering, same threshold, and a total of 0 — which is what says the 10_000¢ here is the rewritten
    charge_id and not the draft.

- id: b20/subscription-override/progressive_billing_credit/regenerated
  block: B20
  axes: {churn: subscription-override, carried_state: progressive_billing_credit, observed_via: regenerated}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, threshold_amount_cents: 5000, grace_period: 5}
  provenance: coverage-gap
  characterization: true
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  no_transaction: true
  setup:
