  math: >-
    The one direction in which the preview's exact plan_id test is RIGHT, and it agrees with the
    invoice for the wrong reason.
    Preview and invoice reach the coupon by different code — Coupons::PreviewService#plan_related_fees
    is `coupon.plans.map(&:id).include?(invoice.subscriptions[0].plan_id)` (preview_service.rb:87-93)
