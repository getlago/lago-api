    subscription: {external_id: golden_b20_w1_fcp_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w1_fcp_sum, properties: {amount: 100, region: "eu"}}]
    - {at: "2024-03-05T11:00:00Z", do: perform_usage_update}
    - at: "2024-03-10T10:00:00Z"
      do: update_plan_charge
      charge:
        billable_metric_code: b20_w1_fcp_sum
        charge_model: standard
        properties: {amount: "1"}
        filters:
          - invoice_display_name: EU and US
            properties: {amount: "1"}
            values: {region: ["eu", "us"]}
    - {at: "2024-03-25T10:00:00Z", do: preview_invoice}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {invoice_type: progressive_billing}
        fees_amount_cents: 10000
        total_amount_cents: 12000
      - select: {invoice_type: subscription}
        fees_amount_cents: 10000
        progressive_billing_credit_amount_cents: 10000
        taxes_amount_cents: 2000
        total_amount_cents: 2000
    preview:
      fees_amount_cents: 10000
      progressive_billing_credit_amount_cents: 10000
      sub_total_excluding_taxes_amount_cents: 0
      taxes_amount_cents: 2000
      total_amount_cents: 2000
  math: >-
    CHARACTERIZATION, and the only cell in this block where preview and invoice AGREE on a wrong
    number — which is exactly what identifies the cause.
    Invoices::PreviewService has no fee-level distribution at all: apply_progressive_billing_credits
    (preview_service.rb:330-358) adds the credit to invoice.progressive_billing_credit_amount_cents
    and stops there, so a previewed fee is ALWAYS taxed on its undiscounted amount. On every other
    progressive-billing row that makes the preview disagree with the invoice — b17/pb-coupon-tax
    records the pair at 2_600¢ against 714¢ — because the invoice clamps the fee's taxable base and
    the preview does not.
    Here the filter edit removes the invoice's clamp too, and the two land on the same 2_000¢. The
    agreement is the diagnosis: it says the invoice's tax has stopped being a function of what was
    credited and has become a function of the gross fee, which is precisely what a preview does when it
    has nothing to distribute.
    The cap behaves identically on both sides for the same reason it does on the invoice — the preview
    keeps its own copy of it, keyed on charge_id (`billed_charge_ids.include?(fee.charge_id)`, :346-352)
    — so both report the full 10_000¢ credited and a 0 sub-total.
    THE CONTROL: without the filter edit these two rows would differ, invoice 0¢ against preview
    2_000¢. Asserting both surfaces in one row is what turns "the preview is wrong" into "the invoice
    has become as wrong as the preview", and the threshold invoice's 12_000¢ is what proves there was
    a credit to mis-distribute rather than none to begin with.

# ---------------------------------------------------------------------------------------------
# commitment_progress x plan-override — lead 1's third sibling: plan_id, same override.
#
# A minimum commitment is reached ONLY through subscription.plan.minimum_commitment, and
# Plans::OverrideService copies it onto the clone only when the caller sends one:
# `if params[:minimum_commitment].present? && License.premium?` (override_service.rb:64-72). A
# `plan_overrides` body that does not mention it therefore produces a plan with NO commitment, and
# every one of these four rows is that one line.
# Unlike a progressive credit, a commitment true-up is a fee PRODUCER (calculate_fees_service.rb:46,
# ahead of every reducer and of the finalization gate at :364-379), so this column is observable on
# all four surfaces and reads the same on each.

- id: b20/plan-override/commitment_progress/invoice
  block: B20
  pins: ["F69"]
  axes: {churn: plan-override, carried_state: commitment_progress, observed_via: invoice}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, commitment_amount_cents: 10000}
  provenance: coverage-gap
  characterization: true
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  setup:
    metrics: [{code: b20_w1_mci_sum, aggregation_type: sum_agg, field_name: amount}]
    plan:
      code: golden_b20_w1_mci
      interval: monthly
      amount_cents: 2000
      minimum_commitment: {amount_cents: 10000}
    charges: [{billable_metric_code: b20_w1_mci_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b20_w1_mci_cust, currency: EUR}
    subscription: {external_id: golden_b20_w1_mci_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w1_mci_sum, properties: {amount: 30}}]
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - at: "2024-04-10T10:00:00Z"
      do: update_subscription
      params:
        plan_overrides: {name: b20 w1 overridden plan}
    - at: "2024-04-15T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w1_mci_sum, properties: {amount: 30}}]
    - {at: "2024-05-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {index: 0}
        fees_amount_cents: 10000
        fees_count: 3
        total_amount_cents: 10000
        fees:
          - {fee_type: subscription, amount_cents: 2000}
          - {fee_type: charge, units: "30.0", amount_cents: 3000}
          - {fee_type: commitment, amount_cents: 5000}
      - select: {index: 1}
        fees_amount_cents: 5000
        fees_count: 2
        total_amount_cents: 5000
        fees:
          - {fee_type: subscription, amount_cents: 2000}
          - {fee_type: charge, units: "30.0", amount_cents: 3000}
  math: >-
    CHARACTERIZATION — a plan override silently cancels the minimum commitment, and the customer's
    floor drops from 10_000¢ to whatever they happen to use.
    March is the control, and it is the positive evidence this block requires: 2_000¢ plan +
    30 units x 1.00 = 5_000¢ of billable content against a 10_000¢ floor, so
    Commitments::Minimum::InArrears::CalculateTrueUpFeeService raises a 5_000¢ commitment fee
    (calculate_true_up_fee_service.rb:37-41, `commitment_amount_cents - fees_total_amount_cents`) and
    the invoice reads 10_000¢ across three fees. The period is whole, so the proration coefficient is
    31/31 = 1 and the floor is the full 10_000¢.
    On 10 April the subscription is updated with `plan_overrides` carrying nothing but a name — no
    price change is needed, because the override itself is the churn.
    Subscriptions::UpdateService takes the `handle_plan_override` branch, Plans::OverrideService dups
    the plan (so amount_cents 2_000 and the 1.00 charge both survive: `plan.dup`, then
    Charges::OverrideService per charge) and repoints the subscription at the clone. The commitment is
    NOT dup'd. It is a separate record, rebuilt only from `params[:minimum_commitment]`
    (override_service.rb:64-72), and the request carried none — so `subscription.plan.minimum_commitment`
    is nil from 10 April on.
    April therefore bills 2_000 + 3_000 = 5_000¢ and stops.
    `should_create_minimum_commitment_true_up_fee?` calls the calculator, which returns 0 for a nil
    commitment (`return 0 if !minimum_commitment`), and the guard at :257 drops the fee.
    THE TWO NUMBERS ARE 5_000¢ AND 10_000¢, and fees_count is asserted with them because the amount
    alone cannot say WHY: April spending its way up to 10_000¢ of usage would also read 10_000¢, with
    two fees rather than three. March's three fees and April's two are what name the missing one.
    The counterfactual is not hypothetical — it is what the customer signed. Every subsequent period
    on this subscription has no floor, and nothing on the plan anyone reads says so.

- id: b20/plan-override/commitment_progress/draft
  block: B20
  pins: ["F69"]
  axes: {churn: plan-override, carried_state: commitment_progress, observed_via: draft}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, commitment_amount_cents: 10000, grace_period: 5}
  provenance: coverage-gap
