  expect:
    invoices: 5
    invoice:
      - select: {index: 0}
        status: finalized
        fees_amount_cents: 10000
        total_amount_cents: 10000
      - select: {index: 3}
        status: finalized
        fees_count: 1
        fees_amount_cents: 5000
        total_amount_cents: 5000
        fees:
          - {fee_type: charge, units: "50.0", amount_cents: 5000}
      - select: {index: 4}
        status: draft
        fees_count: 1
        fees_amount_cents: 0
        total_amount_cents: 0
  math: >-
    The control from the /invoice row with a 5-day grace period, and the row that says WHICH of the
    upgrade's five invoices a grace period can still reach.
    Not the advance ones. Invoices::CreatePayInAdvanceChargeService calls
    Invoices::TransitionToFinalStatusService directly (:46) and never consults `grace_period?` — only
    Invoices::SubscriptionService does (subscription_service.rb:177,193) — so index 0 (10_000¢) and
    index 3 (5_000¢) are both asserted `finalized`. The 5_000¢ that the upgrade's new period correctly
    starts charging from zero is taken the moment the event lands, five days inside a grace period
    that has no bearing on it.
    What the grace period does hold is index 4, plan B's 12-31 March period invoice, at 0¢ with a
    single 0¢ subscription fee — `create_charges_fees` skips the in-advance charge on a non-recurring
    metric (calculate_fees_service.rb:130-132), so the open invoice carries nothing from the advance
    path and cannot reconcile it.
    THE TWO READINGS OF THE COLUMN ARE STILL 5_000¢ AND 0¢ ON INDEX 3 — the fee a lost cache prices
    from zero versus the 0¢ a carried one would produce — and here 5_000¢ is the CORRECT one, because
    the upgrade moved the period boundary as well as the charge id. `fees_count: 1` on index 4 is what
    says the draft did not quietly acquire a second reading of the same usage.

