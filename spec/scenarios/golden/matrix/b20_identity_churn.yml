    - {at: "2024-04-16T10:01:00Z", do: perform_billing}
    - at: "2024-04-17T10:00:00Z"
      do: update_customer
      params: {invoice_grace_period: 5}
    - at: "2024-04-20T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w1_cur_sum, properties: {amount: 40}}]
    - {at: "2024-05-01T01:00:00Z", do: perform_billing}
    - at: "2024-05-02T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w1_cur_sum, timestamp: "2024-04-25T10:00:00Z", properties: {amount: 10}}]
    - {at: "2024-05-02T11:00:00Z", do: refresh_invoice, select: {index: 2}}
  expect:
    invoices: 3
    invoice:
      - select: {index: 0}
        fees_amount_cents: 3000
        coupons_amount_cents: 2000
        total_amount_cents: 1000
      - select: {index: 2}
        status: draft
        fees_amount_cents: 10000
        coupons_amount_cents: 0
        credit_notes_amount_cents: 0
        total_amount_cents: 10000
        fees:
          - {fee_type: charge, units: "50.0", amount_cents: 10000}
  math: >-
    A refresh that provably ran, so the cell is about the surface and not about the number happening to
    match.
    Plan B's 16–30 April draft is built on 1 May from the 40 units ingested on the 20th: 40 x 2.00 =
    8_000¢. A BACKDATED event is then ingested on 2 May carrying `timestamp: 2024-04-25` — inside the
    period the draft covers — and the draft is refreshed. RefreshDraftService destroys the fees and
    re-aggregates the period, which now holds 50 units, so the draft comes back at 10_000¢ with a
    single charge fee of 50 units. 8_000¢ against 10_000¢ is what says the refresh happened; without
    the late event a refreshed and an unrefreshed draft would read the same and the row would assert
    nothing about `regenerated`.
    The coupon stays at 0 across the refresh, and for a structural reason worth stating: a refresh does
    not open the coupon gate. RefreshDraftService calls CalculateFeesService with `context: :refresh`,
    `not_in_finalizing_process?` is still true, and `should_create_coupon_credit?` still returns false
    (calculate_fees_service.rb:367-373). So no amount of refreshing can make this surface consult the
    plan join at all — which is the honest answer for this cell, and different from "the join was
    consulted and missed".
    THE POSITIVE EVIDENCE IS MARCH, asserted in this row: 3_000¢ of plan-A usage with 2_000¢
    discounted. The coupon exists, is limited to plan A, and had four periods left when the upgrade
    happened. Its absence from plan B's draft is therefore about identity, not about supply — and
    b20/plan-upgrade/coupon_application/invoice is where that is shown on a finalized invoice.

