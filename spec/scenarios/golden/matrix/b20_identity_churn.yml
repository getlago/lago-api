  math: >-
    CHARACTERIZATION. The same silence, with the period invoice held open — which is what says the
    silence is not a timing artefact.
    Identical to b20/metric-deleted/paid_advance_fee/invoice except for a 5-day grace period. The 5
    March advance invoice is FINALIZED regardless, because Invoices::CreatePayInAdvanceChargeService
    calls TransitionToFinalStatusService directly (:46) and only Invoices::SubscriptionService consults
    `grace_period?` (subscription_service.rb:177,193) — asserted here rather than assumed. The March
    period invoice is a draft, and it carries the 5_000¢ subscription fee and nothing else.
    THE READING THIS SURFACE ADDS is that the 200 unbilled units do not turn up on the open invoice
    either. One might reasonably expect a period held open past the churn to sweep up usage the advance
    path dropped; it does not, because `create_charges_fees` excludes the charge on two independent
    grounds — `.where.not(pay_in_advance: true, billable_metric: {recurring: false})` and the `kept`
    default scope that has removed it from `subscription.plan.charges` altogether
    (calculate_fees_service.rb:130-132, models/charge.rb:62). fees_count 1 is the assertion.
    THE NUMBER IF THE STATE HAD BEEN FOUND IS STILL 20_000¢ on a third invoice, so this row and its
    /invoice sibling separate the same two readings — 15_000¢ collected versus 35_000¢ owed — and this
    one adds that no open invoice ever gets the chance to correct it.

- id: b20/metric-deleted/paid_advance_fee/regenerated
  block: B20
  axes: {churn: metric-deleted, carried_state: paid_advance_fee, observed_via: regenerated}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, plan_amount_cents: 5000, charge_pay_in_advance: true, charge_invoiceable: true, grace_period: 5}
  provenance: coverage-gap
  characterization: true
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  setup:
    metrics: [{code: b20_w2_mar_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b20_w2_mar, interval: monthly, amount_cents: 5000}
    charges:
      - billable_metric_code: b20_w2_mar_sum
        charge_model: standard
        pay_in_advance: true
        invoiceable: true
        properties: {amount: "1"}
    customer: {external_id: golden_b20_w2_mar_cust, currency: EUR}
    subscription: {external_id: golden_b20_w2_mar_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w2_mar_sum, properties: {amount: 100}}]
    - at: "2024-03-06T10:00:00Z"
      do: update_customer
      params: {invoice_grace_period: 5}
    - at: "2024-03-18T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w2_mar_sum, properties: {amount: 200}}]
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - {at: "2024-04-02T10:00:00Z", do: delete_metric, code: b20_w2_mar_sum}
    - {at: "2024-04-03T01:00:00Z", do: perform_invoices_refresh}
  expect:
    invoices: 3
    invoice:
      - select: {index: 0}
        status: finalized
        fees_amount_cents: 10000
        total_amount_cents: 10000
      - select: {index: 1}
        status: finalized
        fees_count: 1
        fees_amount_cents: 20000
        total_amount_cents: 20000
        fees:
          - {fee_type: charge, units: "200.0", amount_cents: 20000}
      - select: {index: 2}
        status: draft
        fees_count: 1
        fees_amount_cents: 5000
        total_amount_cents: 5000
        fees:
          - {fee_type: subscription, amount_cents: 5000}
  math: >-
    THE CONTROL FOR THIS WHOLE COLUMN, and the row that turns the two rows above from a symptom into a
    trigger. Here the churn lands AFTER the events, so the cache is found every time, and every number
    is the one the /invoice and /draft rows say is missing.
    The order is deliberately reversed. 100 units on 5 March raise a 10_000¢ advance invoice and write
    `current 100, max 100`; the grace period is raised on the 6th, after that invoice is finalized;
    200 units on 18 March find the cache — `find_cached_aggregation` scopes on
    `charge_id: charge.id` (aggregations/base_service.rb:230-243) and the charge is still the same
    record — so `current_aggregation` 300 exceeds `max_aggregation` 100, the delta is 200 and the fee
    is 300 x 1.00 - 100 x 1.00 = 200.00 → 20_000¢ (sum_service.rb:161-168). THAT 20_000¢ INVOICE IS
    THE NUMBER b20/metric-deleted/paid_advance_fee/invoice DOES NOT HAVE, on an identical setup whose
    only difference is that the deletion had not happened yet.
    The March draft is then raised on 1 April at 5_000¢, the metric is deleted on the 2nd —
    `BillableMetrics::DestroyService` collects `Invoice.draft.joins(plans: [:billable_metrics])` at :23
    BEFORE discarding the charges at :29, which is the only reason the draft gets flagged at all — and
    `perform_invoices_refresh` on the 3rd recomputes it, because that flag is the sole thing
    Clock::RefreshDraftInvoicesJob consults.
    THE REFRESH CHANGES NOTHING, and that is the second thing this row establishes. The draft comes
    back with the same single 5_000¢ subscription fee: the deletion cannot claw back the two advance
    invoices, and the refresh does not try. So the 35_000¢ collected here is correct and stays correct,
    while the 15_000¢ collected by the /invoice row for the same 300 units stays wrong. Same code, same
    amounts, one step reordered.
    `invoices: 3` against the siblings' `invoices: 2` is the load-bearing assertion — the count is what
    says the missing money is a missing INVOICE and not a mispriced one.

- id: b20/metric-deleted/paid_advance_fee/preview
  block: B20
  axes: {churn: metric-deleted, carried_state: paid_advance_fee, observed_via: preview}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, plan_amount_cents: 5000, charge_pay_in_advance: true, charge_invoiceable: true}
  provenance: coverage-gap
  characterization: true
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  setup:
    organization: {premium_integrations: [preview]}
    metrics: [{code: b20_w2_mav_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b20_w2_mav, interval: monthly, amount_cents: 5000}
    charges:
      - billable_metric_code: b20_w2_mav_sum
        charge_model: standard
        pay_in_advance: true
        invoiceable: true
        properties: {amount: "1"}
    customer: {external_id: golden_b20_w2_mav_cust, currency: EUR}
    subscription: {external_id: golden_b20_w2_mav_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w2_mav_sum, properties: {amount: 100}}]
    - {at: "2024-03-12T10:00:00Z", do: delete_metric, code: b20_w2_mav_sum}
    - at: "2024-03-18T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w2_mav_sum, properties: {amount: 200}}]
    - {at: "2024-03-25T10:00:00Z", do: preview_invoice}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {index: 0}
        fees_amount_cents: 10000
        total_amount_cents: 10000
      - select: {index: 1}
        fees_count: 1
        fees_amount_cents: 5000
        total_amount_cents: 5000
    preview:
      fees_count: 1
      fees_amount_cents: 5000
      sub_total_excluding_taxes_amount_cents: 5000
      total_amount_cents: 5000
  math: >-
    CHARACTERIZATION. What the customer is quoted while 200 units of their usage are going unbilled:
    the same 5_000¢ they would be quoted if everything were working.
    The preview is taken on 25 March, after the deletion and after the dropped events, as a projection
    of March (`billing_time` = `end_of_periods.first + 1.day`, preview_service.rb:141-151).
    `add_charge_fees` excludes the charge twice over — `.where.not(pay_in_advance: true,
    billable_metric: {recurring: false})` (preview_service.rb:184-192) would have excluded it even
    while the metric lived, and the `kept` default scope (models/charge.rb:62) has now removed it from
    `subscription.plan.charges` entirely. So the quote is the 5_000¢ subscription fee, fees_count 1.
    THE PREVIEWED NUMBERS DO NOT MOVE WITH THE CHURN — 5_000¢ before the deletion and 5_000¢ after —
    and saying so is the point of the row rather than a weakness in it. `paid_advance_fee` is not a
    state this surface can observe at all: preview never quotes an in-advance charge on a
    non-recurring metric, so it can neither report the 200 units that were dropped nor the 20_000¢ they
    were worth. Any future row that reads a healthy preview here as evidence the advance path is
    healthy is reading a constant.
    THE DISCRIMINATING ASSERTIONS ARE THE INVOICES BESIDE IT: index 0 at 10_000¢ proves the advance
    path worked before the churn, and `invoices: 2` proves the 18 March event raised nothing — where
    the control b20/metric-deleted/paid_advance_fee/regenerated has three invoices and a 20_000¢ one
    among them.

# ---------------------------------------------------------------------------------------------
# The six surfaces a previous writer would not guess, and the two source facts that settle them.
#
#   WHICH PERIOD A PREVIEW PROJECTS FOR A PAY-IN-ADVANCE PLAN. It projects the NEXT one, and the
#   plan's payment terms have nothing to do with it: `Invoices::PreviewService#billing_time` is
#   `end_of_periods.first + 1.day` for any PERSISTED subscription (preview_service.rb:141-151), and
#   the `first_subscription.plan.pay_in_advance?` branch below it is reachable only for a subscription
#   that does not exist yet — a proposal. So a projection taken in April is a forecast of MAY.
#
#   WHAT THE FIXED-CHARGE LOOKUP MAKES OF IT. Nothing, because it never looks.
#   `Fees::FixedChargeService#already_billed?` (fixed_charge_service.rb:53-75) matches only fees whose
#   `fixed_charges_from_datetime`/`_to_datetime` equal THIS period's, so a May projection finds no
#   April fee to subtract and quotes the full post-override units. The delta arithmetic of
#   `find_already_paid_units` is not in the preview path at all.

- id: b20/plan-override/paid_advance_fee/preview
  block: B20
  axes: {churn: plan-override, carried_state: paid_advance_fee, observed_via: preview}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, plan_pay_in_advance: true, plan_units: 10, updated_units: 12, apply_units_immediately: true, previewed_period: next}
  provenance: coverage-gap
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  setup:
    organization: {premium_integrations: [preview]}
    add_ons: [{code: b20_w2_pov_seat, name: Seat, amount_cents: 20000}]
    plan: {code: golden_b20_w2_pov, interval: monthly, amount_cents: 0, pay_in_advance: true}
    fixed_charges:
      - add_on_code: b20_w2_pov_seat
        charge_model: standard
        units: 10
        pay_in_advance: true
        prorated: false
        properties: {amount: "100"}
    customer: {external_id: golden_b20_w2_pov_cust, currency: EUR}
    subscription: {external_id: golden_b20_w2_pov_sub, billing_time: calendar}
  timeline:
    - {at: "2024-04-01T00:00:00Z", do: create_subscription}
    - at: "2024-04-16T00:00:00Z"
      do: update_subscription_fixed_charge
      fixed_charge:
        add_on_code: b20_w2_pov_seat
        units: 12
        apply_units_immediately: true
        properties: {amount: "100"}
    - {at: "2024-04-20T10:00:00Z", do: preview_invoice}
  expect:
    invoices: 2
    invoice:
      - select: {index: 0}
        status: finalized
        fees_amount_cents: 100000
        total_amount_cents: 100000
        fees:
          - {fee_type: subscription, amount_cents: 0}
          - {fee_type: fixed_charge, item_code: b20_w2_pov_seat, units: "10.0", amount_cents: 100000}
      - select: {index: 1}
        fees_amount_cents: 20000
        total_amount_cents: 20000
        fees:
          - {fee_type: fixed_charge, item_code: b20_w2_pov_seat, units: "2.0", amount_cents: 20000}
    preview:
      fees_amount_cents: 120000
      sub_total_excluding_taxes_amount_cents: 120000
      total_amount_cents: 120000
  math: >-
    The fourth surface of the cell b20/plan-override/paid_advance_fee/{invoice,draft,regenerated}
    cover, and the one that was left blank because two things had to be read out of the preview code
    first. Both are now in the comment above this row.
    APRIL, invoiced. The plan pays in advance and its fixed charge carries 10 units at 100.00, so
    1 April raises a `subscription` invoice at 100_000¢. Raising the units to 12 on the 16th WITH
    `properties` makes `units_only_fixed_charge_params?` false
    (fixed_charge_units_override_detection_concern.rb:26-31), so the plan is cloned and the fixed
    charge is duped with `parent_id` set (fixed_charges/override_service.rb:30);
    `apply_units_immediately` then prices the delta through `find_already_paid_units`, which scopes on
    `fixed_charge: [fixed_charge, fixed_charge.parent]` and on the period's boundaries
    (build_pay_in_advance_fixed_charge_service.rb:63-83), reaches the 1 April fee through the parent
    and bills 12 - 10 = 2 units = 20_000¢. Both invoices are asserted because they are the positive
    evidence that the already-paid state exists and was found: without index 0's 10 units there is
    nothing for the delta to be a delta of.
    THE PREVIEW IS A FORECAST OF MAY, NOT A RE-READ OF APRIL. Taken on 20 April on a persisted
    subscription, `billing_time` is `end_of_periods.first + 1.day` = 1 May, and
    Subscriptions::DatesService for a pay-in-advance plan at that instant gives the 1-31 May period.
    `should_create_fixed_charge_fee?` admits an advance fixed charge on a live subscription
    (preview_service.rb:452-458), so Fees::FixedChargeService prices May from the CLONE's current
    units: 12 x 100.00 = 120_000¢, plus the plan's own 0¢ subscription fee.
    THE NUMBER THE DELTA ARITHMETIC WOULD HAVE PRODUCED IS 20_000¢, and it is the wrong answer to a
    different question. `already_billed?` (fixed_charge_service.rb:53-75) matches only fees carrying
    THIS period's `fixed_charges_from_datetime`/`_to_datetime`; the 100_000¢ and 20_000¢ fees are both
    stamped 1-30 April, so May finds nothing and quotes its 12 seats in full. That is correct — May is
    a period nothing has been paid for — and it is why this row is NOT marked characterization while
    its /regenerated sibling, which loses 100_000¢ of April to the same family of lookups, is.
    120_000 vs 20_000 is the whole content of the row: a reader who assumed the preview reuses the
    already-paid delta would expect the smaller number, and the two differ by the entire fixed charge.

- id: b20/subscription-override/paid_advance_fee/preview
  block: B20
  axes: {churn: subscription-override, carried_state: paid_advance_fee, observed_via: preview}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, plan_pay_in_advance: true, plan_units: 0, created_units: 10, updated_units: 12, apply_units_immediately: true, previewed_period: next}
  provenance: coverage-gap
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  setup:
    organization: {premium_integrations: [preview]}
    add_ons: [{code: b20_w2_sov_seat, name: Seat, amount_cents: 20000}]
    plan: {code: golden_b20_w2_sov, interval: monthly, amount_cents: 0, pay_in_advance: true}
    fixed_charges:
      - add_on_code: b20_w2_sov_seat
        charge_model: standard
        units: 0
        pay_in_advance: true
        prorated: false
        properties: {amount: "100"}
    customer: {external_id: golden_b20_w2_sov_cust, currency: EUR}
    subscription:
      external_id: golden_b20_w2_sov_sub
      billing_time: calendar
      plan_overrides:
        fixed_charges:
          - {add_on_code: b20_w2_sov_seat, units: 10}
  timeline:
    - {at: "2024-04-01T00:00:00Z", do: create_subscription}
    - at: "2024-04-16T00:00:00Z"
      do: update_subscription_fixed_charge
      fixed_charge:
        add_on_code: b20_w2_sov_seat
        units: 12
        apply_units_immediately: true
    - {at: "2024-04-20T10:00:00Z", do: preview_invoice}
  expect:
    invoices: 2
    invoice:
      - select: {index: 0}
        status: finalized
        fees_amount_cents: 100000
        fees_count: 2
        total_amount_cents: 100000
        fees:
          - {fee_type: subscription, amount_cents: 0}
          - {fee_type: fixed_charge, item_code: b20_w2_sov_seat, units: "10.0", amount_cents: 100000}
      - select: {index: 1}
        fees_amount_cents: 20000
        total_amount_cents: 20000
        fees:
          - {fee_type: fixed_charge, item_code: b20_w2_sov_seat, units: "2.0", amount_cents: 20000}
    preview:
      fees_amount_cents: 120000
      sub_total_excluding_taxes_amount_cents: 120000
      total_amount_cents: 120000
  math: >-
    The last surface of BIL-537's own cell, and it agrees with its plan-override twin — which is what
    says the previewed number depends on the PERIOD and not on which churn rewrote which column.
    Lead 2's setup exactly: the plan's fixed charge carries 0 units so the 10 arrive as a creation-time
    override (Subscriptions::CreateService#create_fixed_charge_units_overrides), 1 April finalizes at
    100_000¢, and the 16 April units-only body takes `override_via_plan` anyway because
    `units_only_change?` opens with `return false if subscription_plan_parent_present`
    (update_or_override_fixed_charge_service.rb:44-48) — the plan already has a parent, so the child's
    own fixed charge is UPDATED IN PLACE. No id is rewritten; what moves is the fixed charge's event
    stream. `find_already_paid_units` finds the 10-unit fee on the very record it just updated and
    bills 12 - 10 = 2 = 20_000¢.
    THE PREVIEW ON 20 APRIL PROJECTS MAY, for the same reason as in the plan-override row:
    `billing_time` is `end_of_periods.first + 1.day` for a persisted subscription
    (preview_service.rb:141-151). May's fixed-charge fee is priced from the override's current 12 units
    at 12 x 100.00 = 120_000¢, and `already_billed?` (fixed_charge_service.rb:53-75) finds nothing to
    subtract because both April fees carry April's `fixed_charges_from_datetime`.
    THE COUNTERFACTUAL IS 20_000¢ — the delta number — and it is the answer a reader gets by assuming
    the preview reuses `find_already_paid_units`. It does not: that service is only reached from
    Invoices::CreatePayInAdvanceFixedChargesJob, never from PreviewService, so no already-paid state is
    consulted on this surface at all.
    THIS IS THE CELL WHERE ID CHURN IS AT ITS MOST DANGEROUS — the /regenerated sibling is BIL-537
    itself, a refresh deleting the 100_000¢ fee — so it matters that the previewed 120_000¢ is asserted
    against the two April invoices in the same row: the quote is right, and it is right for a reason
    (a period nothing has paid for) rather than by accident.

- id: b20/plan-upgrade/paid_advance_fee/invoice
  block: B20
  axes: {churn: plan-upgrade, carried_state: paid_advance_fee, observed_via: invoice}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, plan_amount_cents: 0, charge_pay_in_advance: true, charge_invoiceable: true, upgrade_day: 12}
  provenance: coverage-gap
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  setup:
    metrics: [{code: b20_w2_pui_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b20_w2_pui_a, interval: monthly, amount_cents: 0}
    plans:
      - code: golden_b20_w2_pui_b
        interval: monthly
        amount_cents: 0
        charges:
          - billable_metric_code: b20_w2_pui_sum
            charge_model: standard
            pay_in_advance: true
            invoiceable: true
            properties: {amount: "1"}
    charges:
      - billable_metric_code: b20_w2_pui_sum
        charge_model: standard
        pay_in_advance: true
        invoiceable: true
        properties: {amount: "1"}
    customer: {external_id: golden_b20_w2_pui_cust, currency: EUR}
    subscription: {external_id: golden_b20_w2_pui_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w2_pui_sum, properties: {amount: 100}}]
    - at: "2024-03-08T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w2_pui_sum, properties: {amount: -60}}]
    - at: "2024-03-12T10:00:00Z"
      do: create_subscription
      params: {plan_code: golden_b20_w2_pui_b}
    - at: "2024-03-18T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w2_pui_sum, properties: {amount: 50}}]
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 5
    invoice:
      - select: {index: 0}
        status: finalized
        fees_count: 1
        fees_amount_cents: 10000
        total_amount_cents: 10000
        fees:
          - {fee_type: charge, units: "100.0", amount_cents: 10000}
      - select: {index: 1}
        fees_amount_cents: 0
        total_amount_cents: 0
      - select: {index: 3}
        status: finalized
        fees_count: 1
        fees_amount_cents: 5000
        total_amount_cents: 5000
        fees:
          - {fee_type: charge, units: "50.0", amount_cents: 5000}
      - select: {index: 4}
        fees_amount_cents: 0
        total_amount_cents: 0
  math: >-
    THE CONTROL for the `paid_advance_fee` column, on the churn that rewrites charge_id by changing
    plans rather than by swapping a record underneath one — and the reset it causes is CORRECT.
    The state is the same one b20/charge-replaced/paid_advance_fee/invoice loses: the
    CachedAggregation row that records how much of the period's peak has been paid for, found by
    `charge_id` together with `external_subscription_id` and the period's from/to datetimes
    (aggregations/base_service.rb:230-243). 100 units on 5 March bill 10_000¢ and write
    `current 100, max 100`; -60 on the 8th bills 0¢ and rewrites it to `current 40, max 100`, which is
    the state a lost join throws away.
    The upgrade on 12 March terminates the plan-A subscription and starts a plan-B one. Plan B's
    charge is a different record, so charge_id is rewritten exactly as a replacement rewrites it — BUT
    THE PERIOD IS REWRITTEN WITH IT. The new subscription's boundaries start on 12 March, so the 50
    units on the 18th are aggregated over 12-31 March, the earlier events fall outside that window,
    and the sum is 50 rather than 90. `find_cached_aggregation` would have missed on `from_datetime`
    even if the charge id had been carried across.
    So the 18 March fee is 50 x 1.00 - 0 = 50.00 -> 5_000¢ AND THAT IS THE RIGHT ANSWER: a new plan is
    a new period and a new peak, and the 100 units paid for under plan A do not entitle the customer
    to 100 free units under plan B. The counterfactual is 0¢ — what a carried cache would produce —
    and it would be a give-away, which is the opposite of the error the /charge-replaced row commits
    with the identical column rewritten.
    THIS ROW IS WHY THAT ONE IS A DEFECT RATHER THAN A DESIGN. Same state, same key, same rewrite,
    and here the loss is accounted for by a boundary change the customer can see; there the boundaries
    are untouched and nothing accounts for it. The final `subscription`-type invoice is asserted at 0¢
    to say the plan-B period does not re-bill the advance fees, and `credit_note: null` is not written
    — the row asserts no credit note by asserting the amounts that a credit note would move.

- id: b20/plan-upgrade/paid_advance_fee/draft
  block: B20
  axes: {churn: plan-upgrade, carried_state: paid_advance_fee, observed_via: draft}
