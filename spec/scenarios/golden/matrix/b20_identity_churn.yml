# B20 — carried state after the configuration that produced it is replaced.
#
# Lago finds carried state again by joining on record ids. A plan override, a subscription override or
# an upgrade rewrites those ids, and the lookup then returns NOTHING rather than raising — so a credit
# is silently not applied, or a fee is silently deleted. Cells are the intersection of what a churn
# rewrites and what a state is matched by, so each one names a join actually at risk.
#
# The first two rows here are reproductions of bugs reported from production.
---
- id: b20/plan-override/progressive_billing_credit/invoice
  block: B20
  axes: {churn: plan-override, carried_state: progressive_billing_credit, observed_via: invoice}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, threshold_amount_cents: 5000}
  provenance: reported-bug
  characterization: true
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  no_transaction: true
  setup:
    organization: {premium_integrations: [progressive_billing]}
    metrics: [{code: b20_pbo_sum, aggregation_type: sum_agg, field_name: amount}]
    plan:
      code: golden_b20_pbo
      interval: monthly
      amount_cents: 0
      usage_thresholds: [{amount_cents: 5000}]
    charges: [{billable_metric_code: b20_pbo_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b20_pbo_cust, currency: EUR}
    subscription: {external_id: golden_b20_pbo_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b20_pbo_sum, properties: {amount: 100}}]
    - {at: "2024-03-05T11:00:00Z", do: perform_usage_update}
    - at: "2024-03-10T10:00:00Z"
      do: update_subscription
      params:
        plan_overrides: {name: b20 overridden plan}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {invoice_type: progressive_billing}
        fees_amount_cents: 10000
        total_amount_cents: 10000
      - select: {invoice_type: subscription}
        fees_amount_cents: 10000
        progressive_billing_credit_amount_cents: 0
        credit_notes_amount_cents: 10000
        total_amount_cents: 0
  math: >-
    REPORTED BUG, REPRODUCED — CHARACTERIZATION. An override silently converts a progressive-billing
    CREDIT into a CREDIT NOTE.
    100 units cross the 5_000¢ threshold on 5 March and 10_000¢ is collected. The subscription is then
    updated with `plan_overrides` — here only a name, deliberately, because the override itself is the
    cause and no price change is needed. `Subscriptions::UpdateService` takes the `handle_plan_override`
    branch (update_service.rb:84-85) and repoints the subscription at a NEW plan whose charges are
    fresh records with fresh ids. (A units-only override takes a different branch, :82-83, and does not
    create a plan — which is why that variant does not reproduce this.)
    The period invoice then bills the same 100 units at the same 1.00 = 10_000¢ and tries to credit
    what was collected. ProgressiveBillingService caps the credit at
    `invoice.fees.charge.where(charge_id: progressive_billing_invoice.fees.charge.pluck(:charge_id))`.
    Across the override boundary that join matches NOTHING, so the cap is 0 — and because
    `amount_to_credit > total_charges_amount`, the whole 10_000¢ is diverted into
    CreditNotes::CreateFromProgressiveBillingInvoice and `amount_to_credit` is set to 0.
    Hence the row: progressive_billing_credit_amount_cents 0, and a 10_000¢ credit note which the
    invoice then spends on itself at stage :62, landing on a 0¢ total.
    THE TOTAL BEING RIGHT IS A COINCIDENCE OF THIS SURFACE. A credit note is a numbered,
    customer-facing, refundable document that should not exist here; it can be spent on a DIFFERENT
    invoice, leaving this one unpaid; and it is recognised differently in reporting. The sibling row
    b20/plan-override/progressive_billing_credit/draft shows what happens when the credit note cannot
    be spent on the invoice that created it — the customer is billed twice.

- id: b20/plan-override/progressive_billing_credit/draft
  block: B20
  axes: {churn: plan-override, carried_state: progressive_billing_credit, observed_via: draft}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, threshold_amount_cents: 5000, grace_period: 5}
  provenance: reported-bug
  characterization: true
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  no_transaction: true
  setup:
    organization: {premium_integrations: [progressive_billing]}
    metrics: [{code: b20_pbd_sum, aggregation_type: sum_agg, field_name: amount}]
    plan:
      code: golden_b20_pbd
      interval: monthly
      amount_cents: 0
      usage_thresholds: [{amount_cents: 5000}]
    charges: [{billable_metric_code: b20_pbd_sum, charge_model: standard, properties: {amount: "1"}}]
    customer:
      external_id: golden_b20_pbd_cust
      currency: EUR
      invoice_grace_period: 5
    subscription: {external_id: golden_b20_pbd_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b20_pbd_sum, properties: {amount: 100}}]
    - {at: "2024-03-05T11:00:00Z", do: perform_usage_update}
    - at: "2024-03-10T10:00:00Z"
      do: update_subscription
      params:
        plan_overrides: {name: b20 overridden plan}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {invoice_type: subscription}
        status: draft
        fees_amount_cents: 10000
        progressive_billing_credit_amount_cents: 0
        credit_notes_amount_cents: 0
        total_amount_cents: 10000
  math: >-
    REPORTED BUG, REPRODUCED — CHARACTERIZATION, and this is the surface where it costs money.
    Identical to b20/plan-override/progressive_billing_credit/invoice except for a 5-day grace period,
    so the period invoice is a DRAFT. The override has already turned the 10_000¢ progressive credit
    into a credit note, exactly as it does there.
    But a draft withholds credit notes — `should_create_credit_note_credit?` returns false unless the
    invoice is finalizing (calculate_fees_service.rb:364) — so nothing offsets the fees. The draft
    reads 10_000¢ due on top of the 10_000¢ already collected: the customer is shown, and on
    finalization charged, twice for the same usage.
    Two rows, one cause, and only the pairing shows the severity. On a finalized invoice the diverted
    credit note is spent on the spot and the total is accidentally right; hold the same invoice open
    for a grace period and the money is simply gone. Any fix should make the progressive credit follow
    the override — matching on the override's parent charge rather than on charge_id alone — at which
    point both rows change and the credit note stops being created at all.




- id: b20/subscription-override/paid_advance_fee/regenerated
  block: B20
  axes: {churn: subscription-override, carried_state: paid_advance_fee, observed_via: regenerated}
  dimensions:
    interval: monthly
    billing_time: calendar
    taxes: none
    grace_period: 5
    plan_pay_in_advance: true
    plan_units: 0
    created_units: 10
    updated_units: 12
    apply_units_immediately: true
  provenance: BIL-537
  characterization: true
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  setup:
    add_ons: [{code: b20_adv_seat, name: Seat, amount_cents: 20000}]
    plan: {code: golden_b20_adv, interval: monthly, amount_cents: 0, pay_in_advance: true}
    fixed_charges:
      - add_on_code: b20_adv_seat
        charge_model: standard
        units: 0
        pay_in_advance: true
        prorated: false
        properties: {amount: "100"}
    customer:
      external_id: golden_b20_adv_cust
      currency: EUR
      invoice_grace_period: 5
    subscription:
      external_id: golden_b20_adv_sub
      billing_time: calendar
      plan_overrides:
        fixed_charges:
          - {add_on_code: b20_adv_seat, units: 10}
  timeline:
    - {at: "2024-04-01T00:00:00Z", do: create_subscription}
    - at: "2024-04-16T00:00:00Z"
      do: update_subscription_fixed_charge
      fixed_charge:
        add_on_code: b20_adv_seat
        units: 12
        apply_units_immediately: true
    - {at: "2024-04-17T00:00:00Z", do: refresh_invoice, select: {index: 0}}
  expect:
    invoice:
      - select: {index: 0}
        status: draft
        fees_amount_cents: 0
        total_amount_cents: 0
        fees_count: 1
        fees:
          - {fee_type: subscription, amount_cents: 0}
  math: >-
    BIL-537 — REPRODUCED. CHARACTERIZATION: the refresh deletes the fixed-charge fee. Correct
    behaviour is the 100_000¢ the draft was built with, which its control row
    b20/subscription-override/paid_advance_fee/draft asserts unchanged.
    Three details are load-bearing and none is obvious from the symptom.
    The PLAN pays in advance, so a subscription fee is raised at period start and the invoice is a
    `subscription` invoice — the kind Invoices::SubscriptionService raises, and therefore the kind that
    consults `grace_period?` (subscription_service.rb:177,193) and can be held open as a draft. With an
    arrears plan the first invoice comes from another path that is finalized on creation, and there is
    no draft to refresh at all.
    The plan's fixed charge carries 0 units, so the 10 arrive as a creation-time override
    (Subscriptions::CreateService#create_fixed_charge_units_overrides) rather than from the plan.
    The grace period is 5 days, which is what leaves the 1 April invoice open.
    So the draft holds a 0¢ subscription fee and a 100_000¢ fixed-charge fee for 10 units. Raising the
    units to 12 with `apply_units_immediately` then issues a separate invoice for the 2-unit delta,
    correct in itself and covered by b13/standard/advance/not-prorated/subscription-override.
    The question is what a REFRESH makes of the draft. Rebuilding its fees means deciding whether the
    period's fixed charge is already paid — a lookup that reaches the fee through the fixed-charge
    event stream rather than through the charge. The reported symptom is that it matches the delta fee,
    concludes the period is settled, and deletes the 10-unit fee, leaving April at 20_000¢ rather than
    120_000¢.
    B13 covers this units change 36 ways and cannot see it: no grace period, no `observed_via`, so
    none of its invoices is ever open long enough to refresh.
    The pair is what makes this a defect rather than a setup artefact. Identical rows, one with the
    refresh step and one without: without it the draft carries 100_000¢, with it the draft carries
    NOTHING but the 0¢ subscription fee. The refresh is the whole difference, and the customer is
    invoiced 20_000¢ for a period they owe 120_000¢ on.

- id: b20/subscription-override/paid_advance_fee/draft
  block: B20
  axes: {churn: subscription-override, carried_state: paid_advance_fee, observed_via: draft}
  dimensions:
    interval: monthly
    billing_time: calendar
    taxes: none
    grace_period: 5
    plan_pay_in_advance: true
    plan_units: 0
    created_units: 10
    updated_units: 12
    apply_units_immediately: true
  provenance: BIL-537
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  setup:
    add_ons: [{code: b20_dft_seat, name: Seat, amount_cents: 20000}]
    plan: {code: golden_b20_dft, interval: monthly, amount_cents: 0, pay_in_advance: true}
    fixed_charges:
      - add_on_code: b20_dft_seat
        charge_model: standard
        units: 0
        pay_in_advance: true
        prorated: false
        properties: {amount: "100"}
    customer:
      external_id: golden_b20_dft_cust
      currency: EUR
      invoice_grace_period: 5
    subscription:
      external_id: golden_b20_dft_sub
      billing_time: calendar
      plan_overrides:
        fixed_charges:
          - {add_on_code: b20_dft_seat, units: 10}
  timeline:
    - {at: "2024-04-01T00:00:00Z", do: create_subscription}
    - at: "2024-04-16T00:00:00Z"
      do: update_subscription_fixed_charge
      fixed_charge:
        add_on_code: b20_dft_seat
        units: 12
        apply_units_immediately: true
  expect:
    invoice:
      - select: {index: 0}
        status: draft
        fees_amount_cents: 100000
        total_amount_cents: 100000
        fees_count: 2
        fees:
          - {fee_type: subscription, amount_cents: 0}
          - {fee_type: fixed_charge, item_code: b20_dft_seat, units: "10.0", amount_cents: 100000}
  math: >-
    The control for BIL-537, and the row that makes the bug a bug.
    Identical to b20/subscription-override/paid_advance_fee/regenerated in every respect except that
    the draft is never refreshed. The units are still raised from 10 to 12 with immediate application,
    so the delta invoice is still issued — everything that could plausibly disturb the draft has
    happened.
    And the draft is intact: a 0¢ subscription fee and the 100_000¢ fixed-charge fee for its 10 units,
    120_000¢ owed for April across the two invoices.
    So the fee is not missing because the override removed it, nor because the creation-time override
    never billed it, nor because the delta invoice claimed it. It is missing only after a refresh. That
    is the entire content of the pairing, and without this row the characterization could be explained
    away as a setup that never had the fee to begin with.

# ---------------------------------------------------------------------------------------------
# Siblings of lead 1 (leads.yml): the SAME lost join reached three other ways.
#
#   plan-upgrade    — charge_id again, rewritten by a plan change rather than an override
#   filter-changed  — charge_filter_id instead, which is the half of the join the CAP does not use
#   commitment      — plan_id, same override
#
# Every row below pairs the churned invoice with the threshold invoice that proves the state EXISTED,
# because a lost join returns nothing rather than raising: without that pairing a row asserting the
# post-churn amount passes whether the credit was lost or never created.

- id: b20/plan-upgrade/progressive_billing_credit/invoice
  block: B20
  axes: {churn: plan-upgrade, carried_state: progressive_billing_credit, observed_via: invoice}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, threshold_amount_cents: 5000, upgrade_day: 16}
  provenance: coverage-gap
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  no_transaction: true
  setup:
    organization: {premium_integrations: [progressive_billing]}
    metrics: [{code: b20_w1_pug_sum, aggregation_type: sum_agg, field_name: amount}]
    plan:
      code: golden_b20_w1_pug_a
      interval: monthly
      amount_cents: 0
      usage_thresholds: [{amount_cents: 5000}]
    plans:
      - code: golden_b20_w1_pug_b
        interval: monthly
        amount_cents: 0
        charges:
          - {billable_metric_code: b20_w1_pug_sum, charge_model: standard, properties: {amount: "2"}}
    charges: [{billable_metric_code: b20_w1_pug_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b20_w1_pug_cust, currency: EUR}
    subscription: {external_id: golden_b20_w1_pug_sub, billing_time: calendar}
  timeline:
    - {at: "2024-04-01T00:00:00Z", do: create_subscription}
    - at: "2024-04-05T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w1_pug_sum, properties: {amount: 100}}]
    - {at: "2024-04-05T11:00:00Z", do: perform_usage_update}
    - at: "2024-04-16T10:00:00Z"
      do: create_subscription
      params: {plan_code: golden_b20_w1_pug_b}
    - {at: "2024-04-16T10:01:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {invoice_type: progressive_billing}
        fees_amount_cents: 10000
        total_amount_cents: 10000
      - select: {invoice_type: subscription}
        fees_amount_cents: 10000
        progressive_billing_credit_amount_cents: 10000
        credit_notes_amount_cents: 0
        sub_total_excluding_taxes_amount_cents: 0
        total_amount_cents: 0
  math: >-
    THE CONTROL for lead 1's plan-upgrade sibling, and it passes: an upgrade rewrites plan_id and
    charge_id exactly as an override does, and the credit is NOT lost — because the churn closes the
    period it belonged to before anything has to be joined across it.
    100 units cross 5_000¢ on 5 April and 10_000¢ is collected. The upgrade on 16 April terminates
    plan A and bills it in arrears for the same 100 units at A's own 1.00 = 10_000¢
    (plan B prices the metric at 2.00 deliberately, so re-pricing A's usage at B's rate would read
    20_000¢ and this row would fail loudly instead of quietly).
    Both halves of the join then still match. Subscriptions::ProgressiveBilledAmount scopes on
    `.where(subscription: subscription)` (progressive_billed_amount.rb:39) and the termination invoice
    belongs to the OLD subscription record, which is the one the threshold invoice was raised against;
    and ProgressiveBillingService's cap,
    `invoice.fees.charge.where(charge_id: progressive_billing_invoice.fees.charge.pluck(:charge_id))`
    (progressive_billing_service.rb:29-33), reads A's charge on both sides because the new
    subscription's B charges are on a DIFFERENT invoice that this period never produces.
    So `amount_to_credit` 10_000 is not greater than `total_charges_amount` 10_000, no credit note is
    minted, and the 10_000¢ is credited as a credit: sub_total 0, total 0.
    THE COUNTERFACTUAL IS THE OVERRIDE ROW. Had the join missed — as it does in
    b20/plan-override/progressive_billing_credit/invoice — `total_charges_amount` would be 0, the
    whole 10_000¢ would be diverted into a credit note and this invoice would read
    progressive_billing_credit_amount_cents 0 / credit_notes_amount_cents 10_000. Both spellings land
    on total 0, which is precisely why the credit and credit-note fields are asserted here rather
    than the total alone: the total cannot tell them apart, and `credit_notes_amount_cents: 0` is the
    assertion that says no customer-facing refundable document was created.
    The threshold invoice is asserted alongside so the row fails if the 10_000¢ was never collected —
    a setup that produced no state to lose would otherwise satisfy every line above.

- id: b20/plan-upgrade/progressive_billing_credit/draft
  block: B20
  axes: {churn: plan-upgrade, carried_state: progressive_billing_credit, observed_via: draft}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, threshold_amount_cents: 5000, grace_period: 5, upgrade_day: 16}
  provenance: coverage-gap
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  no_transaction: true
  setup:
    organization: {premium_integrations: [progressive_billing]}
    metrics: [{code: b20_w1_pgd_sum, aggregation_type: sum_agg, field_name: amount}]
    plan:
      code: golden_b20_w1_pgd_a
      interval: monthly
      amount_cents: 0
      usage_thresholds: [{amount_cents: 5000}]
    plans:
      - code: golden_b20_w1_pgd_b
        interval: monthly
        amount_cents: 0
        charges:
          - {billable_metric_code: b20_w1_pgd_sum, charge_model: standard, properties: {amount: "2"}}
    charges: [{billable_metric_code: b20_w1_pgd_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b20_w1_pgd_cust, currency: EUR}
    subscription: {external_id: golden_b20_w1_pgd_sub, billing_time: calendar}
  timeline:
    - {at: "2024-04-01T00:00:00Z", do: create_subscription}
    - at: "2024-04-05T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w1_pgd_sum, properties: {amount: 100}}]
    - {at: "2024-04-05T11:00:00Z", do: perform_usage_update}
    - at: "2024-04-06T10:00:00Z"
      do: update_customer
      params: {invoice_grace_period: 5}
    - at: "2024-04-16T10:00:00Z"
      do: create_subscription
      params: {plan_code: golden_b20_w1_pgd_b}
    - {at: "2024-04-16T10:01:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {invoice_type: progressive_billing}
        status: finalized
        fees_amount_cents: 10000
        total_amount_cents: 10000
      - select: {invoice_type: subscription}
        status: draft
        fees_amount_cents: 10000
        progressive_billing_credit_amount_cents: 10000
        coupons_amount_cents: 0
        credit_notes_amount_cents: 0
        prepaid_credit_amount_cents: 0
        sub_total_excluding_taxes_amount_cents: 0
        total_amount_cents: 0
  math: >-
    The surface on which lead 1's override loses money, applied to the upgrade — and here it does not,
    which is what makes the pair a diagnosis rather than a symptom.
    Identical to b20/plan-upgrade/progressive_billing_credit/invoice except that the grace period is
    raised to 5 days on 6 April, AFTER the threshold invoice is finalized. That ordering is deliberate:
    Customers::UpdateInvoiceIssuingDateSettingsService:24-32 finalizes every existing draft when the
    period is SHORTENED, so a grace period declared in `setup` would have put the threshold invoice
    itself at risk, and raising it later leaves the threshold invoice finalized at 10_000¢ while the
    16 April termination invoice is held open.
    Progressive billing is the one reducer a draft still applies — it runs at
    calculate_fees_service.rb:53, ahead of the `not_in_finalizing_process?` gate at :364-379 that
    withholds coupons, credit notes and prepaid credit. So the credit of 10_000¢ appears on the draft
    and the draft settles at 0.
    THIS IS THE EXACT LINE THE OVERRIDE FALLS OVER. There the credit is diverted into a credit note,
    and a credit note IS behind the gate: b20/plan-override/progressive_billing_credit/draft reads
    10_000¢ due on top of the 10_000¢ already collected. Here nothing is diverted, so there is nothing
    for the gate to withhold. The three zero assertions (coupons, credit notes, prepaid) are what
    distinguishes "credited" from "diverted then withheld" — without them a draft reading 0 could mean
    either, and only one of the two is correct.

- id: b20/plan-upgrade/progressive_billing_credit/regenerated
  block: B20
  axes: {churn: plan-upgrade, carried_state: progressive_billing_credit, observed_via: regenerated}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, threshold_amount_cents: 5000, grace_period: 5, upgrade_day: 16}
  provenance: coverage-gap
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  no_transaction: true
  setup:
    organization: {premium_integrations: [progressive_billing]}
    metrics: [{code: b20_w1_pgr_sum, aggregation_type: sum_agg, field_name: amount}]
    plan:
      code: golden_b20_w1_pgr_a
      interval: monthly
      amount_cents: 0
      usage_thresholds: [{amount_cents: 5000}]
    plans:
      - code: golden_b20_w1_pgr_b
        interval: monthly
        amount_cents: 0
        charges:
          - {billable_metric_code: b20_w1_pgr_sum, charge_model: standard, properties: {amount: "2"}}
    charges: [{billable_metric_code: b20_w1_pgr_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b20_w1_pgr_cust, currency: EUR}
    subscription: {external_id: golden_b20_w1_pgr_sub, billing_time: calendar}
  timeline:
    - {at: "2024-04-01T00:00:00Z", do: create_subscription}
    - at: "2024-04-05T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w1_pgr_sum, properties: {amount: 100}}]
    - {at: "2024-04-05T11:00:00Z", do: perform_usage_update}
    - at: "2024-04-06T10:00:00Z"
      do: update_customer
      params: {invoice_grace_period: 5}
    - at: "2024-04-16T10:00:00Z"
      do: create_subscription
      params: {plan_code: golden_b20_w1_pgr_b}
    - {at: "2024-04-16T10:01:00Z", do: perform_billing}
    - {at: "2024-04-17T10:00:00Z", do: refresh_invoice, select: {invoice_type: subscription}}
  expect:
    invoices: 2
    invoice:
      - select: {invoice_type: progressive_billing}
        fees_amount_cents: 10000
        total_amount_cents: 10000
      - select: {invoice_type: subscription}
        status: draft
        fees_amount_cents: 10000
        progressive_billing_credit_amount_cents: 10000
        credit_notes_amount_cents: 0
        sub_total_excluding_taxes_amount_cents: 0
        total_amount_cents: 0
  math: >-
    A refresh is where a lost join stops being theoretical, because RefreshDraftService recomputes the
    credit from scratch: `reset_invoice_values` destroys
    `invoice.credits.progressive_billing_invoice_kind` (refresh_draft_service.rb) and zeroes
    progressive_billing_credit_amount_cents, then CalculateFeesService runs the whole pipeline again
    against the configuration as it stands NOW.
    For the upgrade that recomputation still succeeds. The termination invoice's fees are rebuilt for
    the same subscription record and the same plan-A charge, so
    Subscriptions::ProgressiveBilledAmount finds the threshold invoice again (`to_credit_amount` is
    back to the full 10_000¢ because the credit that had netted it down was just destroyed) and the
    charge_id cap matches again. The draft comes back at 0.
    THE SIBLING THIS PAIRS WITH IS b20/plan-override/progressive_billing_credit/regenerated, where the
    same refresh rebuilds the fees against the OVERRIDE plan's charges: there the cap misses, 10_000¢
    is minted as a credit note the draft may not spend, and the draft goes from 0¢ to 10_000¢. The two
    rows differ in one step only — which churn happened — so the refresh is not the cause and the
    identity rewrite is.
    Asserting fees_amount_cents 10_000 with the credit is not decoration: a refresh that failed to
    rebuild the charge fee at all would also read total 0, and would do so with fees 0.

- id: b20/plan-upgrade/progressive_billing_credit/preview
  block: B20
  axes: {churn: plan-upgrade, carried_state: progressive_billing_credit, observed_via: preview}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, threshold_amount_cents: 5000, upgrade_day: 16}
  provenance: coverage-gap
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  no_transaction: true
  setup:
    organization: {premium_integrations: [progressive_billing, preview]}
    metrics: [{code: b20_w1_pgp_sum, aggregation_type: sum_agg, field_name: amount}]
    plan:
      code: golden_b20_w1_pgp_a
      interval: monthly
      amount_cents: 0
      usage_thresholds: [{amount_cents: 5000}]
