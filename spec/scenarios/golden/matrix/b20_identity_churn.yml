        status: finalized
        fees_amount_cents: 3000
        coupons_amount_cents: 2000
        total_amount_cents: 1000
      - select: {index: 1}
        status: finalized
        fees_amount_cents: 3000
        coupons_amount_cents: 2000
        total_amount_cents: 1000
      - select: {index: 2}
        status: draft
        fees_amount_cents: 8000
        coupons_amount_cents: 0
        credit_notes_amount_cents: 0
        prepaid_credit_amount_cents: 0
        sub_total_excluding_taxes_amount_cents: 8000
        total_amount_cents: 8000
  math: >-
    A DRAFT CANNOT ANSWER THIS CELL, and the row is built so that the reason is unambiguous rather
    than merely absent.
    The grace period is raised on 17 April, AFTER the upgrade's termination invoice has finalized. So
    both plan-A invoices (March and the termination) are finalized WITH their 2_000¢ discount, and only
    plan B's first period is held open. That ordering is what this row buys over its /invoice sibling:
    a plan-limited coupon is shown working twice, and then not working, on three invoices of one
    subscription lifetime.
    Plan B's draft reads 8_000¢ with no discount, and there are now two sufficient explanations —
    the coupon is gated on a draft (`should_create_coupon_credit?` is false while
    `not_in_finalizing_process?`, calculate_fees_service.rb:367-373) and the plan join misses B — so
    this surface CANNOT distinguish them. The row says so rather than claiming the churn was observed:
    the cell's real answer is in b20/plan-upgrade/coupon_application/invoice, where the same period
    finalizes at 8_000¢ and proves the 0 was not the gate.
    What the row does assert on its own account: credit_notes_amount_cents and
    prepaid_credit_amount_cents are 0, so no other gated reducer is standing in; and
    sub_total_excluding_taxes_amount_cents equals fees_amount_cents, so nothing at all has been taken
    off. A draft here is fees and nothing else.

