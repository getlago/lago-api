# ---------------------------------------------------------------------------------------------
# progressive_billing_credit x subscription-override — the SAME charge_id loss as lead 1, reached
# through the fixed-charge endpoint rather than through `plan_overrides`.
#
# Subscriptions::UpdateOrOverrideFixedChargeService has two paths and the row picks one by what it
# sends: `units_only_fixed_charge_params?` (fixed_charge_units_override_detection_concern.rb:26-31)
# is true only for a body of units/apply_units_immediately, which writes a
# Subscription::FixedChargeUnitsOverride and touches no plan. Send `properties` as well and it takes
# `override_via_plan` -> `ensure_plan_override` -> Plans::OverrideService, which CLONES THE WHOLE PLAN
# including every metered charge (override_service.rb:44-49). So a request about a fixed charge's price
# rewrites the charge_id of an unrelated metered charge, and the progressive credit is lost.
#
# The fixed charge exists only to make the endpoint reachable, and is priced at amount "0" so it can
# never contribute to any total: everything asserted below is the metered charge.

- id: b20/subscription-override/progressive_billing_credit/invoice
  block: B20
  axes: {churn: subscription-override, carried_state: progressive_billing_credit, observed_via: invoice}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, threshold_amount_cents: 5000}
  provenance: coverage-gap
  characterization: true
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  no_transaction: true
  setup:
    organization: {premium_integrations: [progressive_billing]}
    add_ons: [{code: b20_w1_soi_seat, name: Seat, amount_cents: 20000}]
    metrics: [{code: b20_w1_soi_sum, aggregation_type: sum_agg, field_name: amount}]
    plan:
      code: golden_b20_w1_soi
      interval: monthly
      amount_cents: 0
      usage_thresholds: [{amount_cents: 5000}]
    charges: [{billable_metric_code: b20_w1_soi_sum, charge_model: standard, properties: {amount: "1"}}]
    fixed_charges:
      - add_on_code: b20_w1_soi_seat
        charge_model: standard
        units: 1
        pay_in_advance: false
        prorated: false
        properties: {amount: "0"}
    customer: {external_id: golden_b20_w1_soi_cust, currency: EUR}
    subscription: {external_id: golden_b20_w1_soi_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w1_soi_sum, properties: {amount: 100}}]
    - {at: "2024-03-05T11:00:00Z", do: perform_usage_update}
    - at: "2024-03-10T10:00:00Z"
      do: update_subscription_fixed_charge
      fixed_charge:
        add_on_code: b20_w1_soi_seat
        units: 1
        properties: {amount: "0"}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {invoice_type: progressive_billing}
        fees_amount_cents: 10000
        total_amount_cents: 10000
      - select: {invoice_type: subscription}
        fees_amount_cents: 10000
        progressive_billing_credit_amount_cents: 0
        credit_notes_amount_cents: 10000
        total_amount_cents: 0
    credit_note:
      select: {index: -1}
      credit_amount_cents: 10000
      total_amount_cents: 10000
  math: >-
    CHARACTERIZATION. Lead 1's defect reached by a request that mentions neither the plan nor the
    metered charge.
    100 units cross the 5_000¢ threshold on 5 March and 10_000¢ is collected. On 10 March the
    subscription's fixed charge is updated with the units it already has (1) and the price it already
    has ("0") — a request that changes NOTHING about what is billed. Because `properties` is present the
    body is not units-only, so Subscriptions::UpdateOrOverrideFixedChargeService takes
    `override_via_plan`, `ensure_plan_override` calls Plans::OverrideService, and that service
    dups the plan and then runs Charges::OverrideService over EVERY charge on it
    (override_service.rb:44-49). The metered charge the threshold invoice was billed against is now a
    different record with a different id, and the subscription points at the clone.
    The April invoice then reproduces lead 1 exactly. The cap
    `invoice.fees.charge.where(charge_id: progressive_billing_invoice.fees.charge.pluck(:charge_id))`
    (progressive_billing_service.rb:29-33) matches nothing, `total_charges_amount` is 0, and because
    `amount_to_credit` (10_000) exceeds it the whole sum is diverted into
    CreditNotes::CreateFromProgressiveBillingInvoice and `amount_to_credit` becomes 0. So
    progressive_billing_credit_amount_cents is 0, a 10_000¢ credit note exists, and the invoice spends
    it on itself at calculate_fees_service.rb:62 to land on a total of 0.
    THE FIXED CHARGE IS PRICED AT ZERO ON PURPOSE, so no number here can come from it and the only
    thing the request did was move a UUID. THE TOTAL BEING RIGHT IS THE ACCIDENT lead 1 already
    documented: the credit note is a numbered refundable document that should not exist, can be spent
    on a different invoice, and is withheld entirely on a draft — which is what the /draft sibling
    charges the customer twice for.
    THE CONTROL IS b20/plan-upgrade/progressive_billing_credit/invoice: same threshold, same 10_000¢,
    charge_id rewritten by a churn that closes the period, and there the credit is found and no note is
    minted. Asserting credit_notes_amount_cents and the note itself is what separates "credited" from
    "diverted", since the total cannot.

- id: b20/subscription-override/progressive_billing_credit/draft
  block: B20
  axes: {churn: subscription-override, carried_state: progressive_billing_credit, observed_via: draft}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, threshold_amount_cents: 5000, grace_period: 5}
  provenance: coverage-gap
  characterization: true
