      events: [{code: b20_w2_pur_sum, properties: {amount: 50}}]
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - {at: "2024-04-02T10:00:00Z", do: refresh_invoice, select: {index: -1}}
  expect:
    invoices: 5
    invoice:
      - select: {index: 0}
        status: finalized
        fees_amount_cents: 10000
        total_amount_cents: 10000
      - select: {index: 3}
        status: finalized
        fees_count: 1
        fees_amount_cents: 5000
        total_amount_cents: 5000
        fees:
          - {fee_type: charge, units: "50.0", amount_cents: 5000}
      - select: {index: 4}
        status: draft
        fees_count: 1
        fees_amount_cents: 0
        total_amount_cents: 0
  math: >-
    The /draft row plus a refresh of plan B's open period invoice on 2 April, and the answer is that
    the refresh consults none of it.
    Invoices::RefreshDraftService rebuilds the draft from current configuration, and the configuration
    still says plan B's only charge pays in advance on a non-recurring metric — excluded by
    `create_charges_fees` (calculate_fees_service.rb:130-132) — so the draft comes back with the same
    single 0¢ subscription fee. `fees_count: 1` and `fees_amount_cents: 0` are the assertions: nothing
    was added, and no charge fee for the 50 units already billed in advance appeared.
    THAT IS THE CONTROL RESULT THIS SURFACE EXISTS FOR. On the fixed-charge side of the same cell a
    refresh is destructive — b20/plan-override/paid_advance_fee/regenerated and BIL-537 itself both
    show one DELETING a 100_000¢ fee it decides is already paid, because
    Fees::FixedChargeService#already_billed? (fixed_charge_service.rb:53-75) goes looking for one. On
    the metric-charge side there is no equivalent lookup in the refresh path at all: the advance fees
    live on their own finalized invoices, the refresh never reads CachedAggregation, and index 3 stays
    at 5_000¢ before and after.
    THE TWO READINGS REMAIN 5_000¢ AND 0¢ ON INDEX 3, still with 5_000¢ correct because the upgrade
    moved the period. What this row adds over /draft is that a recomputation is not a second chance:
    whatever the advance path charged is final, right or wrong, and the two rows in this column that
    are marked characterization — /charge-replaced and /metric-deleted — are wrong for good.

- id: b20/plan-upgrade/paid_advance_fee/preview
  block: B20
  axes: {churn: plan-upgrade, carried_state: paid_advance_fee, observed_via: preview}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, plan_amount_cents: 0, charge_pay_in_advance: true, charge_invoiceable: true, upgrade_day: 12}
  provenance: coverage-gap
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  setup:
    organization: {premium_integrations: [preview]}
    metrics: [{code: b20_w2_puv_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b20_w2_puv_a, interval: monthly, amount_cents: 0}
    plans:
      - code: golden_b20_w2_puv_b
        interval: monthly
        amount_cents: 0
        charges:
          - billable_metric_code: b20_w2_puv_sum
            charge_model: standard
            pay_in_advance: true
            invoiceable: true
            properties: {amount: "1"}
    charges:
      - billable_metric_code: b20_w2_puv_sum
        charge_model: standard
        pay_in_advance: true
        invoiceable: true
        properties: {amount: "1"}
    customer: {external_id: golden_b20_w2_puv_cust, currency: EUR}
    subscription: {external_id: golden_b20_w2_puv_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w2_puv_sum, properties: {amount: 100}}]
    - at: "2024-03-08T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w2_puv_sum, properties: {amount: -60}}]
    - at: "2024-03-12T10:00:00Z"
      do: create_subscription
      params: {plan_code: golden_b20_w2_puv_b}
    - at: "2024-03-18T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w2_puv_sum, properties: {amount: 50}}]
    - {at: "2024-03-25T10:00:00Z", do: preview_invoice}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 5
    invoice:
      - select: {index: 0}
        status: finalized
        fees_amount_cents: 10000
        total_amount_cents: 10000
      - select: {index: 3}
        status: finalized
        fees_count: 1
        fees_amount_cents: 5000
        total_amount_cents: 5000
        fees:
          - {fee_type: charge, units: "50.0", amount_cents: 5000}
    preview:
      fees_count: 1
      fees_amount_cents: 0
      sub_total_excluding_taxes_amount_cents: 0
      total_amount_cents: 0
  math: >-
    The last surface of the control column, and it is the same structural blindness the other two
    `paid_advance_fee` preview rows pin — reached here through an upgrade instead of a churn that
    breaks something.
    The preview is taken on 25 March, thirteen days after the upgrade, as a projection of plan B's
    current period (`billing_time` = `end_of_periods.first + 1.day`, preview_service.rb:141-151).
    `add_charge_fees` filters with the same two clauses CalculateFeesService uses —
    `.where(invoiceable: true)` and `.where.not(pay_in_advance: true, billable_metric: {recurring:
    false})` (preview_service.rb:184-192) — so plan B's only charge is excluded and the quote is the
    plan's 0¢ subscription fee alone.
    `fees_count: 1` IS THE LOAD-BEARING ASSERTION HERE, because every amount on this preview is 0 and
    a preview that had returned nothing at all would read the same. One fee at 0¢ says the projection
    ran and produced the subscription fee; it is the charge that is missing, not the answer.
    THE PREVIEWED NUMBERS ARE 0 WHETHER THE CACHE WAS CARRIED OR RESET, so this surface cannot observe
    its own cell — the same finding as b20/charge-replaced/paid_advance_fee/preview and
    b20/metric-deleted/paid_advance_fee/preview, and worth stating three times because in this column
    a healthy-looking preview means nothing at all. The discriminating assertions are the invoices:
    index 0 at 10_000¢ is the evidence the cache existed, and index 3 at 5_000¢ with 50 units is the
    post-upgrade fee that a carried cache would have priced at 0¢ — correctly 5_000¢ here, because the
    upgrade moved the period boundary with the charge id.
