      params: {invoice_grace_period: 5}
    - at: "2024-04-15T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w1_mcr_sum, properties: {amount: 30}}]
    - {at: "2024-05-01T01:00:00Z", do: perform_billing}
    - at: "2024-05-02T10:00:00Z"
      do: update_subscription
      params:
        plan_overrides: {name: b20 w1 overridden plan}
    - {at: "2024-05-03T10:00:00Z", do: refresh_invoice, select: {index: 1}}
  expect:
    invoices: 2
    invoice:
      - select: {index: 0}
        fees_amount_cents: 10000
        fees_count: 3
        total_amount_cents: 10000
      - select: {index: 1}
        status: draft
        fees_amount_cents: 5000
        fees_count: 2
        total_amount_cents: 5000
        fees:
          - {fee_type: subscription, amount_cents: 2000}
          - {fee_type: charge, units: "30.0", amount_cents: 3000}
  math: >-
    CHARACTERIZATION, and the version of this cell in which the money is watched leaving.
    The order is deliberately the reverse of the other three rows: the April draft is built on 1 May
    while the commitment is still on the plan, so it is created holding 2_000 + 3_000 + a 5_000¢
    true-up = 10_000¢. The override lands on 2 May, the refresh on the 3rd.
    RefreshDraftService destroys the fees and re-runs CalculateFeesService against the plan the
    subscription now points at — the clone, which has no commitment — and rebuilds the draft as
    2_000 + 3_000 = 5_000¢. The subscription fee and the charge fee both come back UNCHANGED, because
    Plans::OverrideService dup'd the plan's amount_cents and Charges::OverrideService dup'd the 1.00
    charge; only the commitment, which is rebuilt from params rather than dup'd, is gone.
    So this row asserts a 5_000¢ swing produced by a refresh whose configuration diff is a plan NAME.
    THE CONTROL IS 10_000¢ WITH THREE FEES, which is both what the draft held before the refresh and
    what March still reads — and March is asserted here for exactly that reason: it is the same
    machinery, on the same subscription, producing the true-up correctly, which is what rules out "the
    commitment was never configured" as an explanation for April.
    Note what does NOT need to be true for this to bite: nothing flagged the draft. Plans::UpdateService
    sets ready_to_be_refreshed and Subscriptions::UpdateService does not, so the clock job would leave
    this draft alone and it would finalize on 6 May through RefreshDraftAndFinalizeService, which calls
    the same service with context: :finalize WITHOUT consulting the flag. The 5_000¢ arrives either
    way; the explicit refresh only makes it observable while the invoice still exists as a draft.

- id: b20/plan-override/commitment_progress/preview
  block: B20
  pins: ["F69"]
