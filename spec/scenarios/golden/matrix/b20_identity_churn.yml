    charges: [{billable_metric_code: b20_w1_pgp_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b20_w1_pgp_cust, currency: EUR}
    subscription: {external_id: golden_b20_w1_pgp_sub, billing_time: calendar}
  timeline:
    - {at: "2024-04-01T00:00:00Z", do: create_subscription}
    - at: "2024-04-05T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w1_pgp_sum, properties: {amount: 100}}]
    - {at: "2024-04-05T11:00:00Z", do: perform_usage_update}
    - at: "2024-04-15T10:00:00Z"
      do: preview_invoice
      params:
        subscriptions: {terminated_at: "2024-04-16T10:00:00Z"}
    - at: "2024-04-16T10:00:00Z"
      do: create_subscription
      params: {plan_code: golden_b20_w1_pgp_b}
    - {at: "2024-04-16T10:01:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {invoice_type: progressive_billing}
        fees_amount_cents: 10000
        total_amount_cents: 10000
      - select: {invoice_type: subscription}
        fees_amount_cents: 10000
        progressive_billing_credit_amount_cents: 10000
        total_amount_cents: 0
    preview:
      fees_amount_cents: 10000
      progressive_billing_credit_amount_cents: 10000
      sub_total_excluding_taxes_amount_cents: 0
      total_amount_cents: 0
  math: >-
    What the customer is QUOTED for the plan change, next to what they are billed — the fourth
    surface, and a fourth implementation of the same join.
    An upgrade is previewed as the termination it performs: passing `subscriptions.terminated_at`
    puts Preview::SubscriptionsService in its `termination` context, which is the invoice the upgrade
    on 16 April actually raises for plan A. The preview is taken on the 15th, before the change, so it
    is a genuine forecast rather than a re-read.
    Invoices::PreviewService REIMPLEMENTS the credit rather than sharing it
    (preview_service.rb:330-358): it reuses the read-only Subscriptions::ProgressiveBilledAmount, then
    applies its own copy of the cap — `billed_charge_ids = progressive_invoice.fees.charge.pluck(:charge_id)`
    and `next 0 unless billed_charge_ids.include?(fee.charge_id)` (:346-352). SAME COLUMN, SECOND
    IMPLEMENTATION, so the preview is exposed to exactly the churn the invoice is. Across the upgrade
    both agree: 10_000¢ of fees, 10_000¢ credited, total 0.
    THE NUMBER THAT WOULD APPEAR IF THE JOIN MISSED IS 10_000¢, not 0 — the preview drops the excess
    rather than diverting it (`amount_cents = [to_credit_amount, creditable_amount_cents].min` with
    creditable 0, then `next unless amount_cents.positive?`), so it cannot issue the credit note that
    disguises the loss on a finalized invoice. That makes preview the surface on which a lost credit
    is most visible, and it is why the sibling b20/plan-override/progressive_billing_credit/preview
    quotes the whole period again.
    Asserting the invoice in the same row is what proves the forecast was right rather than merely
    self-consistent, and the threshold invoice is what proves there was a credit to forecast at all.

# ---------------------------------------------------------------------------------------------
# filter-changed — lead 1's join, but the half of it the CAP does not use.
#
# ProgressiveBillingService joins TWICE on different keys. The cap at :29-33 matches on charge_id
# alone; the per-fee distribution at :70-76 matches on charge_id AND charge_filter_id AND grouped_by.
# A filter edit rewrites only charge_filter_id, so the cap still finds its money and the distribution
# does not — and the distribution is what writes fee.precise_coupons_amount_cents, which is the
# taxable base every fee is taxed on (fee.rb:238-239 -> fees/apply_taxes_service.rb:37).
# So this column is the only place in the block where the invoice TOTAL moves while the credit is
# reported in full. Every row here therefore carries a tax; without one the defect is invisible.

- id: b20/filter-changed/progressive_billing_credit/invoice
  block: B20
  pins: ["F70"]
  axes: {churn: filter-changed, carried_state: progressive_billing_credit, observed_via: invoice}
  dimensions: {interval: monthly, billing_time: calendar, tax_rate: 20, threshold_amount_cents: 5000, filter_key: region}
  provenance: coverage-gap
  characterization: true
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  no_transaction: true
  setup:
    organization: {premium_integrations: [progressive_billing]}
    taxes: [{code: b20_w1_fci_vat, name: VAT, rate: 20}]
    metrics:
      - code: b20_w1_fci_sum
        aggregation_type: sum_agg
        field_name: amount
        filters: [{key: region, values: ["eu", "us"]}]
    plan:
      code: golden_b20_w1_fci
      interval: monthly
      amount_cents: 0
      usage_thresholds: [{amount_cents: 5000}]
    charges:
      - billable_metric_code: b20_w1_fci_sum
        charge_model: standard
        properties: {amount: "1"}
        filters:
          - invoice_display_name: EU only
            properties: {amount: "1"}
            values: {region: ["eu"]}
    customer: {external_id: golden_b20_w1_fci_cust, currency: EUR}
    subscription: {external_id: golden_b20_w1_fci_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w1_fci_sum, properties: {amount: 100, region: "eu"}}]
    - {at: "2024-03-05T11:00:00Z", do: perform_usage_update}
    - at: "2024-03-10T10:00:00Z"
      do: update_plan_charge
      charge:
        billable_metric_code: b20_w1_fci_sum
        charge_model: standard
        properties: {amount: "1"}
        filters:
          - invoice_display_name: EU and US
            properties: {amount: "1"}
            values: {region: ["eu", "us"]}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {invoice_type: progressive_billing}
        fees_amount_cents: 10000
        taxes_amount_cents: 2000
        total_amount_cents: 12000
      - select: {invoice_type: subscription}
        fees_amount_cents: 10000
        progressive_billing_credit_amount_cents: 10000
        credit_notes_amount_cents: 0
        sub_total_excluding_taxes_amount_cents: 0
        taxes_amount_cents: 2000
        total_amount_cents: 2000
  math: >-
    CHARACTERIZATION — a customer who has already paid 12_000¢ for a period worth 12_000¢ is invoiced
    2_000¢ more, and the invoice says it credited every cent.
    Setup: one filter, `region: [eu]`, priced identically to the charge itself at 1.00, so PRICE never
    changes anywhere in this row and only IDENTITY does. 100 eu units cross the 5_000¢ threshold on
    5 March: the threshold invoice bills 10_000¢ + 20% = 12_000¢, and its single charge fee carries
    charge_filter_id = the eu filter.
    On 10 March the filter's values are widened to `region: [eu, us]`.
    ChargeFilters::CreateOrUpdateBatchService resolves entries by their `values`, not by id
    (create_or_update_batch_service.rb:63-77): `{region: [eu, us]}` matches nothing already on the
    charge, so a NEW filter is inserted and the old eu filter is discarded at :77. The charge itself is
    untouched — same record, same id, same 1.00 — and the 100 eu units still match, now through a
    filter with a different UUID.
    The April invoice then splits in two:
      * THE CAP FINDS THE MONEY. progressive_billing_service.rb:29-33 matches on charge_id only, which
        the edit never touched, so total_charges_amount = 10_000¢, `amount_to_credit` 10_000 is not
        greater than it, no credit note is minted, and progressive_billing_credit_amount_cents reads
        the full 10_000¢. sub_total_excluding_taxes = 10_000 − 10_000 = 0.
      * THE DISTRIBUTION DOES NOT. apply_credit_to_fees (:70-76) requires
        `f.charge_filter_id == progressive_fee.charge_filter_id`; the threshold fee points at the
        discarded filter and the April fee at the new one, so the loop matches nothing and the April
        fee's precise_coupons_amount_cents stays 0.
    Tax is computed from the FEES, not from the invoice sub-total:
    Invoices::ApplyTaxesService#compute_tax_amount_cents sums `fee.sub_total_excluding_taxes_amount_cents`
    (apply_taxes_service.rb:78-82), and that is `amount_cents − precise_coupons_amount_cents`
    (fee.rb:238-239) = 10_000 − 0 = 10_000. So 20% of 10_000 = 2_000¢ of tax on an invoice whose own
    taxable sub-total is ZERO, and total = 0 + 2_000 = 2_000¢.
    THE CONTROL NUMBER IS 0. Leave the filter alone and the distribution matches, the fee's taxable
    base is clamped to 0, tax is 0 and the invoice settles at 0 — which is what
    b20/plan-upgrade/progressive_billing_credit/invoice shows with the same shape and no tax, and what
    b17/pb-coupon-tax/invoice shows with a tax. The 2_000¢ here is the entire content of the row.
    Both invoices are asserted because a broken setup is otherwise indistinguishable: if the threshold
    invoice had never been raised there would be no credit to distribute, the April invoice would read
    fees 10_000 / credit 0 / tax 2_000 / total 12_000, and the credit assertion is what separates that
    from this.

- id: b20/filter-changed/progressive_billing_credit/draft
  block: B20
  pins: ["F70"]
  axes: {churn: filter-changed, carried_state: progressive_billing_credit, observed_via: draft}
  dimensions: {interval: monthly, billing_time: calendar, tax_rate: 20, threshold_amount_cents: 5000, grace_period: 5, filter_key: region}
  provenance: coverage-gap
  characterization: true
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  no_transaction: true
  setup:
    organization: {premium_integrations: [progressive_billing]}
    taxes: [{code: b20_w1_fcd_vat, name: VAT, rate: 20}]
    metrics:
      - code: b20_w1_fcd_sum
        aggregation_type: sum_agg
        field_name: amount
        filters: [{key: region, values: ["eu", "us"]}]
    plan:
      code: golden_b20_w1_fcd
      interval: monthly
      amount_cents: 0
      usage_thresholds: [{amount_cents: 5000}]
    charges:
      - billable_metric_code: b20_w1_fcd_sum
        charge_model: standard
        properties: {amount: "1"}
        filters:
          - invoice_display_name: EU only
            properties: {amount: "1"}
            values: {region: ["eu"]}
    customer: {external_id: golden_b20_w1_fcd_cust, currency: EUR}
    subscription: {external_id: golden_b20_w1_fcd_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w1_fcd_sum, properties: {amount: 100, region: "eu"}}]
    - {at: "2024-03-05T11:00:00Z", do: perform_usage_update}
    - at: "2024-03-06T10:00:00Z"
      do: update_customer
      params: {invoice_grace_period: 5}
    - at: "2024-03-10T10:00:00Z"
      do: update_plan_charge
      charge:
        billable_metric_code: b20_w1_fcd_sum
        charge_model: standard
        properties: {amount: "1"}
        filters:
          - invoice_display_name: EU and US
            properties: {amount: "1"}
            values: {region: ["eu", "us"]}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {invoice_type: progressive_billing}
        status: finalized
        fees_amount_cents: 10000
        taxes_amount_cents: 2000
        total_amount_cents: 12000
      - select: {invoice_type: subscription}
        status: draft
        fees_amount_cents: 10000
        progressive_billing_credit_amount_cents: 10000
        coupons_amount_cents: 0
        credit_notes_amount_cents: 0
        sub_total_excluding_taxes_amount_cents: 0
        taxes_amount_cents: 2000
        total_amount_cents: 2000
  math: >-
    CHARACTERIZATION. The same 2_000¢ of phantom tax, and this surface proves it is not the
    finalization stage that produces it.
    Identical to b20/filter-changed/progressive_billing_credit/invoice except that the grace period is
    raised to 5 days on 6 March — after the threshold invoice is finalized, because
    Customers::UpdateInvoiceIssuingDateSettingsService:24-32 issues existing drafts when the period is
    shortened rather than lengthened.
    The draft reads exactly what the finalized invoice reads. That is the finding, not an accident of
    duplication: everything the gate at calculate_fees_service.rb:364-379 withholds is asserted at 0
    here (coupons, credit notes, prepaid credit), so the 2_000¢ cannot be a withheld reducer waiting to
    cancel it. Progressive billing runs at :53, ahead of the gate, and the tax stage runs
    unconditionally — so the mis-distribution and the tax it inflates both happen on a draft, and the
    number the customer will be charged is already visible five days before it is issued.
    THE CONTROL IS THE SAME TWO NUMBERS WITHOUT THE FILTER EDIT: credit 10_000¢, tax 0, total 0. And
    the counterfactual that this row's assertions rule out is a lost CAP rather than a lost
    distribution: had charge_id moved too, as it does under an override, the credit would be 0, a
    10_000¢ credit note would be minted, the gate would withhold it and the draft would read
    12_000¢ — which is b20/plan-override/progressive_billing_credit/draft.

- id: b20/filter-changed/progressive_billing_credit/regenerated
  block: B20
  pins: ["F70"]
  axes: {churn: filter-changed, carried_state: progressive_billing_credit, observed_via: regenerated}
  dimensions: {interval: monthly, billing_time: calendar, tax_rate: 20, threshold_amount_cents: 5000, grace_period: 5, filter_key: region}
  provenance: coverage-gap
  characterization: true
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  no_transaction: true
  setup:
    organization: {premium_integrations: [progressive_billing]}
    taxes: [{code: b20_w1_fcr_vat, name: VAT, rate: 20}]
    metrics:
      - code: b20_w1_fcr_sum
        aggregation_type: sum_agg
        field_name: amount
        filters: [{key: region, values: ["eu", "us"]}]
    plan:
      code: golden_b20_w1_fcr
      interval: monthly
      amount_cents: 0
      usage_thresholds: [{amount_cents: 5000}]
    charges:
      - billable_metric_code: b20_w1_fcr_sum
        charge_model: standard
        properties: {amount: "1"}
        filters:
          - invoice_display_name: EU only
            properties: {amount: "1"}
            values: {region: ["eu"]}
    customer: {external_id: golden_b20_w1_fcr_cust, currency: EUR}
    subscription: {external_id: golden_b20_w1_fcr_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b20_w1_fcr_sum, properties: {amount: 100, region: "eu"}}]
    - {at: "2024-03-05T11:00:00Z", do: perform_usage_update}
    - at: "2024-03-06T10:00:00Z"
      do: update_customer
      params: {invoice_grace_period: 5}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - at: "2024-04-02T10:00:00Z"
      do: update_plan_charge
      charge:
        billable_metric_code: b20_w1_fcr_sum
        charge_model: standard
        properties: {amount: "1"}
        filters:
          - invoice_display_name: EU and US
            properties: {amount: "1"}
            values: {region: ["eu", "us"]}
    - {at: "2024-04-03T10:00:00Z", do: refresh_invoice, select: {invoice_type: subscription}}
  expect:
    invoices: 2
    invoice:
      - select: {invoice_type: progressive_billing}
        fees_amount_cents: 10000
        taxes_amount_cents: 2000
        total_amount_cents: 12000
      - select: {invoice_type: subscription}
        status: draft
        fees_amount_cents: 10000
        progressive_billing_credit_amount_cents: 10000
        credit_notes_amount_cents: 0
        sub_total_excluding_taxes_amount_cents: 0
        taxes_amount_cents: 2000
        total_amount_cents: 2000
  math: >-
    CHARACTERIZATION, and the sharpest form of this column: here the draft is built CORRECTLY first
    and the refresh breaks it.
    The order is the point. The April 1 draft is computed while the eu filter still exists, so its
    charge fee carries the same charge_filter_id as the threshold fee, apply_credit_to_fees matches,
    the fee's taxable base is clamped to 0 and the draft settles at 0¢. Only then, on 2 April, is the
    filter widened; on the 3rd the draft is refreshed.
    RefreshDraftService destroys the fees, the applied taxes and
    `invoice.credits.progressive_billing_invoice_kind`, zeroes progressive_billing_credit_amount_cents
    and re-runs CalculateFeesService against the charge as it stands now. `to_credit_amount` is
    therefore back to the full 10_000¢ (the credit that had netted it down is gone, and no credit note
    was ever minted), the cap still matches on charge_id, the distribution now does not, and the draft
    comes back at 2_000¢.
    So a refresh MOVES a draft from 0¢ to 2_000¢ with no configuration change the invoice can show:
    the charge is the same record at the same price and the fee's units and amount are identical. Only
    a UUID moved.
    `PUT /invoices/:id/refresh` is used rather than the clock job on purpose —
    Charges::UpdateService does not set ready_to_be_refreshed (unlike Plans::UpdateService), so
    Clock::RefreshDraftInvoicesJob would never pick this draft up and the row would assert the
    UNREFRESHED 0¢ while claiming to test a refresh. The endpoint ignores the flag, which is what
    makes this cell reachable at all — and finalization ignores it too
    (RefreshDraftAndFinalizeService passes context: :finalize without consulting it), so the 2_000¢
    arrives with or without the explicit refresh. This row makes the mechanism visible while the
    invoice is still a draft.

- id: b20/filter-changed/progressive_billing_credit/preview
  block: B20
  pins: ["F70"]
  axes: {churn: filter-changed, carried_state: progressive_billing_credit, observed_via: preview}
  dimensions: {interval: monthly, billing_time: calendar, tax_rate: 20, threshold_amount_cents: 5000, filter_key: region}
  provenance: coverage-gap
