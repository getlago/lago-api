    - {at: "2024-05-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {index: 0}
        status: finalized
        fees_amount_cents: 10000
        fees_count: 3
        total_amount_cents: 10000
      - select: {index: 1}
        status: draft
        fees_amount_cents: 5000
        fees_count: 2
        coupons_amount_cents: 0
        credit_notes_amount_cents: 0
        total_amount_cents: 5000
        fees:
          - {fee_type: subscription, amount_cents: 2000}
          - {fee_type: charge, units: "30.0", amount_cents: 3000}
  math: >-
    CHARACTERIZATION. The cancelled commitment is visible five days before the invoice is issued,
    which is the useful half of this cell: a producer is not gated, so a draft is a truthful preview of
    the loss rather than an artefact of withheld reducers.
    Identical to b20/plan-override/commitment_progress/invoice except the grace period is raised to
    5 days on 2 April — after the March invoice has finalized, since
    Customers::UpdateInvoiceIssuingDateSettingsService:24-32 issues existing drafts when the period is
    shortened, not lengthened. March stays finalized at 10_000¢ with its three fees; April is held open.
    The April draft reads 5_000¢. The commitment true-up is created at calculate_fees_service.rb:46,
    in the producer phase, ABOVE the `not_in_finalizing_process?` gate at :364-379 — so unlike a
    coupon or a credit note it would appear on a draft if it existed. It does not appear, and
    coupons_amount_cents / credit_notes_amount_cents are asserted at 0 to say that no withheld reducer
    is standing in for it: 5_000¢ is the whole of what the period holds.
    THE CONTROL NUMBER IS 10_000¢ — three fees, as March has. b12's thirty-six cells cover this
    commitment in every interval and billing time and cannot see this, because none of them holds an
    invoice open or reconfigures the plan underneath one.

- id: b20/plan-override/commitment_progress/regenerated
  block: B20
  pins: ["F69"]
  axes: {churn: plan-override, carried_state: commitment_progress, observed_via: regenerated}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none, commitment_amount_cents: 10000, grace_period: 5}
