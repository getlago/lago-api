    0), which is why the offset cell is written unpaid instead.
    refund_status stays `pending`: should_handle_refund? (create_service.rb:243-248) needs a payment
    with a provider and a manual payment has none. credit_status reads `available` even though
    nothing is spendable, so balance_amount_cents is what says the money is gone.
    total_due_amount_cents 0 on invoice 0 is the payment, not the note — a credit note never reduces
    an invoice's due (invoice.rb:407).

