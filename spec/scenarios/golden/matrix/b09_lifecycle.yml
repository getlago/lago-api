  - {at: "2024-04-01T00:00:00Z", do: create_subscription}
  - {at: "2024-04-11T01:00:00Z", do: perform_subscriptions_activation}
  - {at: "2024-04-11T12:00:00Z", do: pay_invoice, invoice_type: subscription}
