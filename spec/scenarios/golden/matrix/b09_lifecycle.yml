- id: b09/gated-activation/arrears/none
  block: B9
  key: b09_w2_ga_arr
  setup:
    plan: {code: golden_b09_w2_ga_arr, interval: monthly, amount_cents: 3000, pay_in_advance: false}
    subscription: {subscription_at: "2024-04-11T00:00:00Z"}
  timeline:
  - {at: "2024-04-01T00:00:00Z", do: create_subscription}
  - {at: "2024-04-11T01:00:00Z", do: perform_subscriptions_activation}
  - {at: "2024-05-01T01:00:00Z", do: perform_billing}
  dimensions: {taxes: none, subscription_at: "2024-04-11T00:00:00Z"}
  axes: {transition: gated-activation, plan_pay_in_advance: "false", on_termination_credit_note: none}
  calendar_sensitive: true
  expect:
    invoices: 1
    invoice:
      fees_amount_cents: 2000
      total_amount_cents: 2000
      fees_count: 1
      fees:
        - {fee_type: subscription, amount_cents: 2000, from_date: "2024-04-11T00:00:00Z", to_date: "2024-04-30T23:59:59Z"}
  math: >-
    The arrears half of the gate, and the only legal arrears cell of this axis:
    `on_termination_credit_note` is refused outright on an arrears plan (Subscription validates its
    absence, subscription.rb:80), which the block's `subscription_lifecycle` constraint encodes, so
    the field is left off the subscription entirely and the runner's termination-policy PUT
    (golden_runner.rb:364-373) sends nothing.
    Nothing happens on 1 April: handle_future_subscription (create_service.rb:198-201) calls
    `pending!` and returns. Activation on the 11th runs activate_standalone ->
    bill_subscription(skip_charges: true), which on an ARREARS plan with no pay-in-advance fixed
    charges enqueues NOTHING (activate_service.rb:181-196 bills only if plan.pay_in_advance? or
    fixed_charges.pay_in_advance.any?) — so unlike its advance sibling
    b09/hns/gated-activation/advance/none, which raises a 1_600c invoice at the moment of activation,
    this row's activation raises no invoice at all. The first and only invoice arrives when the
    period closes: 20 days from 11 April through 30 April inclusive at 3_000c / 30 = 100c per day =
    2_000c, with from_date the 11th rather than the 1st because DatesService#from_datetime clamps
    the computed 1 April up to started_at.beginning_of_day (dates_service.rb:73-75) and started_at
    was set by mark_as_active! at activation, not at creation.
    WHAT THE AXIS VALUE ASSERTS HERE: `none` on the arrears side is the ABSENCE of the column, not a
    coerced default. TerminateService would still coerce blank to `:credit` (terminate_service.rb:11)
    but generate_credit_note_for_unconsumed_subscription? (:170-174) gates on pay_in_advance? first,
    so no arrears subscription can ever produce a termination credit note whatever the field said —
    which is why the other four values are illegal rather than merely untested here.
    `invoices: 1` is the load-bearing count. Without perform_subscriptions_activation it would be 0,
    not 1: the subscription stays pending for the whole timeline and OrganizationBillingService
    scopes to `.active`, so the 1 May run would find nothing to bill. And an implementation that
    activated but billed the full month would show 3_000c for 1-30 April.
