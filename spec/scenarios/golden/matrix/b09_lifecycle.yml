    calculate_refund (create_from_termination.rb:161-169) takes
    paid_amount_prorated_to_subscription - creditable_used_amount. paid_amount_prorated (:179-190) is
    fee_amount / invoice.sub_total_including_taxes x total_paid = 6_000/6_000 x 6_000 = 6_000c.
    creditable_used_amount is day_price x used_duration, and used_duration (:195-211) runs from
    date_service.from_datetime.to_date — 11 April, clamped to started_at.beginning_of_day — through
    terminated_at 21 April inclusive = 11 days, so 3_300c. potential_refund = 6_000 - 3_300 = 2_700,
    capped at the total creditable 2_700 -> refund 2_700, credit = 2_700 - 2_700 = 0
    (calculate_amounts :143). 20 days billed = 11 used + 9 credited, which is the arithmetic
    cross-check.
    WHAT THIS ROW ASSERTS DIFFERENTLY, and why pay_invoice is load-bearing: WITHOUT IT THIS ROW
