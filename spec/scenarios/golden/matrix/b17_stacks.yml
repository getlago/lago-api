    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b17_ccw_early, properties: {amount: 100}}]
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - at: "2024-04-02T10:00:00Z"
      do: create_credit_note
      credit_note:
        reason: other
        credit_amount_cents: 4800
        refund_amount_cents: 0
        items: [{fee_type: charge, amount_cents: 6000}]
    - at: "2024-04-10T10:00:00Z"
      do: ingest_events
      events: [{code: b17_ccw_late, properties: {amount: 80}}]
    - {at: "2024-05-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {index: 0}
        fees_amount_cents: 10000
        coupons_amount_cents: 2000
        total_amount_cents: 8000
      - select: {index: 1}
        fees_amount_cents: 8000
        coupons_amount_cents: 2000
        sub_total_excluding_taxes_amount_cents: 6000
        credit_notes_amount_cents: 4800
        prepaid_credit_amount_cents: 1200
        total_amount_cents: 0
    wallet:
      balance_cents: 3800
  math: >-
    The three reducers that all take from the customer's own money — a discount, a credit they are
    owed, and credits they hold — with no tax between them, so the only question is how much of each
    is consumed and in what order.
    April invoice: 100 units of `early` = 10_000¢ less the 2_000¢ recurring coupon = 8_000¢. The
    wallet is limited to `late` and cannot touch it. Crediting 6_000¢ of the charge returns its share
    of the coupon (6_000/10_000 × 2_000 = 1_200¢) → a 4_800¢ balance.
    May invoice: 80 units of `late` = 8_000¢, coupon 2_000¢ again → 6_000¢ base. The credit note goes
    first and takes 4_800¢, leaving 1_200¢. The wallet is then capped per fee at
    `sub_total_excluding_taxes + taxes - precise_credit_notes` = 6_000 - 4_800 = 1_200¢, so despite
    holding 5_000¢ it contributes exactly the remainder and keeps 3_800¢.
    Each earlier stage shrinks what the next one is allowed to spend, and the wallet balance is the
    only field that records it: every ordering of these three ends at a 0¢ invoice, and they differ
    only in how much of the customer's credit was burned to get there.

