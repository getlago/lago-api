  math: >-
    THE SAME STACK AS b17/coupon-tax-credit-note/invoice, REGENERATED AS A DRAFT, AND IT SHOWS THE
    CUSTOMER A COMPLETELY DIFFERENT NUMBER: 12_000¢ against the 4_400¢ they will actually be billed.
