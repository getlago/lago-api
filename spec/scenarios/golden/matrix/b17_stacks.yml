    which preview has no equivalent of.
    All arithmetic is derived in b17/pb-coupon-tax/invoice; this row only asserts that
    different code reaches the same answer.
    PREVIEW DIVERGES FROM THE INVOICE HERE, AND THIS ROW RECORDS BOTH SIDES.
    The invoice figures above are what the customer is billed; the preview figures are what they were
    quoted. Preview credits progressive billing at invoice level — added in this session, without it
    the quote was out by the whole progressively billed amount — but never at FEE level, so each fee
    is still taxed on its undiscounted share. The invoice does the opposite and overcorrects:
    `apply_credit_to_fees` writes the amount BILLED rather than the amount CREDITED into the fee and
    clamps its taxable base to zero.
    Neither is right. Both errors have the same origin — a credit that has to be shared across fees
    and is not — and fixing `apply_credit_to_fees` to distribute the capped credit would settle both
    at once, at which point this row and its /invoice sibling should agree.
