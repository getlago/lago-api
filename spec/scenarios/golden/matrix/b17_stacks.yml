    Every stage lands on a different quantity — the coupon on the base, the tax on what the coupon
    left, the credit note on the taxed total, the wallet on what the credit note left — so the eight
    asserted numbers are eight independent statements rather than one restated four times.

- id: b17/pb-tax-credit-note/invoice
  block: B17
  axes: {stack: progressive_billing+tax+credit_note, observed_via: invoice}
  dimensions: {interval: monthly, billing_time: calendar, tax_rate: 20, threshold_amount_cents: 5000}
  provenance: characterization
  characterization: true
  runners: [rspec]
  premium: true
  no_transaction: true
  setup:
    organization: {premium_integrations: [progressive_billing]}
    taxes: [{code: b17_ptc_vat, name: VAT, rate: 20}]
    metrics: [{code: b17_ptc_sum, aggregation_type: sum_agg, field_name: amount}]
    plan:
      code: golden_b17_ptc
      interval: monthly
      amount_cents: 5000
      usage_thresholds: [{amount_cents: 5000}]
    charges: [{billable_metric_code: b17_ptc_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b17_ptc_cust, currency: EUR}
    subscription: {external_id: golden_b17_ptc_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b17_ptc_sum, properties: {amount: 100}}]
    - {at: "2024-03-05T11:00:00Z", do: perform_usage_update}
    - at: "2024-03-06T10:00:00Z"
      do: create_credit_note
      credit_note:
        reason: other
        credit_amount_cents: 7200
        refund_amount_cents: 0
        items: [{fee_type: charge, amount_cents: 6000}]
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {invoice_type: progressive_billing}
        fees_amount_cents: 10000
        taxes_amount_cents: 2000
        total_amount_cents: 12000
      - select: {invoice_type: subscription}
        fees_amount_cents: 15000
        progressive_billing_credit_amount_cents: 2800
        sub_total_excluding_taxes_amount_cents: 12200
        taxes_amount_cents: 1000
        credit_notes_amount_cents: 7200
        total_amount_cents: 6000
        fees:
          - {fee_type: charge, amount_cents: 10000, taxes_amount_cents: 0}
          - {fee_type: subscription, amount_cents: 5000, taxes_amount_cents: 1000}
  math: >-
    CHARACTERIZATION, and the row that completes the trigger. b17/pb-coupon-tax/invoice showed a
    COUPON on the threshold invoice corrupts the tax; b17/pb-tax-wallet/invoice showed prepaid credit
    does not. This one predicts, from the mechanism rather than from observation, that a CREDIT NOTE
    does — because `to_credit_amount` subtracts credit notes exactly as it subtracts coupons.
    Threshold invoice: 10_000¢ of charge, 20% = 2_000¢ → 12_000¢. Crediting 6_000¢ of the fee returns
    its tax too → 7_200¢.
    Period invoice: `to_credit_amount` = 10_000 − 7_200 = 2_800¢, less than the 10_000¢ billed — so
    `apply_credit_to_fees` writes the billed 10_000¢ into the charge fee, clamps its taxable base to
    0, and the fee is taxed at 0. The invoice's own base is 15_000 − 2_800 = 12_200¢, which at 20%
    should be 2_440¢; tax follows the fees instead and lands at 1_000¢, the subscription fee alone.
    1_440¢ of VAT is not collected. The credit note is then spent in full after tax → 6_000¢ due.
    Three rows now bracket the defect exactly: it fires when anything reduces what the threshold
    invoice collected (coupon, credit note) and not when the reduction is prepaid credit, which
    `to_credit_amount` ignores.

- id: b17/pb-credit-note-wallet/invoice
  block: B17
  axes: {stack: progressive_billing+credit_note+prepaid_credit, observed_via: invoice}
  dimensions: {interval: monthly, billing_time: calendar, threshold_amount_cents: 5000, taxes: none}
  provenance: coverage-gap
  runners: [rspec]
  premium: true
  no_transaction: true
  setup:
    organization: {premium_integrations: [progressive_billing]}
    metrics: [{code: b17_pcnw_sum, aggregation_type: sum_agg, field_name: amount}]
    plan:
      code: golden_b17_pcnw
      interval: monthly
      amount_cents: 5000
      usage_thresholds: [{amount_cents: 5000}]
    charges: [{billable_metric_code: b17_pcnw_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b17_pcnw_cust, currency: EUR}
    subscription: {external_id: golden_b17_pcnw_sub, billing_time: calendar}
    wallets:
      - name: granted
        rate_amount: "1"
        currency: EUR
        granted_credits: "30"
        applies_to: {fee_types: [subscription]}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b17_pcnw_sum, properties: {amount: 100}}]
    - {at: "2024-03-05T11:00:00Z", do: perform_usage_update}
    - at: "2024-03-06T10:00:00Z"
      do: create_credit_note
      credit_note:
        reason: other
        credit_amount_cents: 6000
        refund_amount_cents: 0
        items: [{fee_type: charge, amount_cents: 6000}]
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {invoice_type: progressive_billing}
        fees_amount_cents: 10000
        prepaid_credit_amount_cents: 0
        total_amount_cents: 10000
      - select: {invoice_type: subscription}
        fees_amount_cents: 15000
        progressive_billing_credit_amount_cents: 4000
        sub_total_excluding_taxes_amount_cents: 11000
        credit_notes_amount_cents: 6000
        prepaid_credit_amount_cents: 2273
        total_amount_cents: 2727
    wallet:
      balance_cents: 727
  math: >-
    The three reducers that all descend from the same threshold invoice, with no tax to separate them,
    so what is left is purely a question of how much each stage is permitted to spend.
    Threshold invoice: 10_000¢ of charge. The wallet is limited to `subscription` fees and this
    invoice has none, so it cannot be touched — without that it would empty here and the stack would
    collapse to a pair.
    Crediting 6_000¢ of the charge gives a 6_000¢ balance, which then does double duty on the period
    invoice exactly as in b17/pb-coupon-credit-note/invoice: `to_credit_amount` = 10_000 − 6_000 =
    4_000¢, base 15_000 − 4_000 = 11_000¢, and the same 6_000¢ is spent as credit → 5_000¢ left.
    The wallet is capped per fee at `sub_total_excluding_taxes + taxes - precise_credit_notes`, and may
    only look at the subscription fee, so what it may spend depends on how the credit note was split.
    That split is `credit x (amount_cents - precise_coupons_amount_cents + taxes_amount_cents) /
    invoice_total` (credit_note_service.rb#apply_credit_to_fees), and the charge fee weighs nothing in
    it — the progressive stage set its `precise_coupons_amount_cents` to the full 10_000¢, so its
    weight is 10_000 − 10_000 = 0. The whole 6_000¢ is therefore weighted onto the subscription fee:
    6_000 × 5_000/11_000 = 2_727.27¢, leaving a ceiling of 2_272.73¢. The wallet spends 2_273¢ of its
    3_000¢ and keeps 727¢; 2_727¢ remains due.
    Spreading by gross fee amounts instead (5_000/15_000 × 6_000 = 2_000¢) would give a 3_000¢
    ceiling, a drained wallet and a 2_000¢ invoice — which is what this row was first written to
    expect, and it was wrong for a reason worth knowing rather than by a rounding.
    The wallet balance is the assertion that matters: the limitation, the credit note's split and the
    progressive credit all bear on it, and none of the three is visible in the total.

- id: b17/pb-coupon-tax-credit-note/invoice
  block: B17
  axes: {stack: progressive_billing+coupon+tax+credit_note, observed_via: invoice}
