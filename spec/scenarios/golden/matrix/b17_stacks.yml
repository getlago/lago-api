    Period invoice: `to_credit_amount` = 10_000 − 2_000 − 4_800 = 3_200¢, base 15_000 − 3_200 − 2_000
    = 9_800¢, and tax comes out 831¢ where 20% of the base is 1_960¢ — the charge fee's taxable base
