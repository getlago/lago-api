# B17 — three or more reducers on one invoice.
#
# B15 asks which of two stages runs first. These rows ask a different question: after progressive
# billing, a coupon, tax, a credit note and a wallet have each moved the figure, is every stage still
# operating on the base it is supposed to see? A pair row cannot tell, because with only two stages
# there is no "already moved" to get wrong.
#
# Cells are derived — subsets of GoldenLegality::BILLING_FEATURE_REDUCERS of size >= 3, named in
# pipeline order — so this block grows by itself if the pipeline gains a stage.
---
- id: b17/full-stack/invoice
  block: B17
  axes:
    stack: progressive_billing+coupon+tax+credit_note+prepaid_credit
    observed_via: invoice
  dimensions: {interval: monthly, billing_time: calendar, tax_rate: 20, threshold_amount_cents: 5000}
  provenance: characterization
  characterization: true
  runners: [rspec]
  premium: true
  no_transaction: true
  setup:
    organization: {premium_integrations: [progressive_billing]}
    taxes: [{code: b17_full_vat, name: VAT, rate: 20}]
    metrics: [{code: b17_full_sum, aggregation_type: sum_agg, field_name: amount}]
    plan:
      code: golden_b17_full
      interval: monthly
      amount_cents: 5000
      usage_thresholds: [{amount_cents: 5000}]
    charges: [{billable_metric_code: b17_full_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b17_full_cust, currency: EUR}
    subscription: {external_id: golden_b17_full_sub, billing_time: calendar}
    coupons:
      - name: b17 recurring coupon
        code: b17_full_coupon
        coupon_type: fixed_amount
        frequency: recurring
        frequency_duration: 3
        amount_cents: 2000
        amount_currency: EUR
        expiration: no_expiration
    wallets:
      - name: granted
        rate_amount: "1"
        currency: EUR
        granted_credits: "30"
        applies_to: {fee_types: [subscription]}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b17_full_sum, properties: {amount: 100}}]
    - {at: "2024-03-05T11:00:00Z", do: perform_usage_update}
    - at: "2024-03-06T10:00:00Z"
      do: create_credit_note
      credit_note:
        reason: other
        credit_amount_cents: 4800
        refund_amount_cents: 0
        items: [{fee_type: charge, amount_cents: 5000}]
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {invoice_type: progressive_billing}
        fees_amount_cents: 10000
        coupons_amount_cents: 2000
        sub_total_excluding_taxes_amount_cents: 8000
        taxes_amount_cents: 1600
        total_amount_cents: 9600
      - select: {invoice_type: subscription}
        fees_amount_cents: 15000
        progressive_billing_credit_amount_cents: 3200
        coupons_amount_cents: 2000
        sub_total_excluding_taxes_amount_cents: 9800
        taxes_amount_cents: 831
        credit_notes_amount_cents: 4800
        prepaid_credit_amount_cents: 2733
        total_amount_cents: 3098
        fees:
          - {fee_type: charge, amount_cents: 10000, taxes_amount_cents: 0}
          - {fee_type: subscription, amount_cents: 5000, taxes_amount_cents: 831}
    wallet:
      balance_cents: 267
  math: >-
    Every stage of the pipeline on one invoice, and each one asserted separately so a divergence names
    the stage that produced it rather than just a wrong total.
    Threshold invoice (5 March): 100 units × 1.00 = 10_000¢ of charge, the recurring coupon takes
    2_000¢ before tax → 8_000¢ base, 20% = 1_600¢, total 9_600¢. A credit note is then raised on it
    for 5_000¢ of fee, which returns its share of the coupon (5_000/10_000 × 2_000 = 1_000¢) and its
    tax: (5_000 − 1_000) × 1.2 = 4_800¢ of spendable balance.
    Period invoice (1 April), stage by stage:
    fees 5_000¢ subscription + 10_000¢ charge = 15_000¢;
    progressive billing credits what was actually collected, not what was billed —
    `to_credit_amount = fees − coupons − pb_credits − credit_notes` = 10_000 − 2_000 − 4_800 =
    3_200¢, under the 10_000¢ charge cap;
    the coupon takes another 2_000¢ (it is `recurring` over 3 periods, so unlike a `once` coupon it
    survives the threshold invoice — see b15/coupon/progressive_billing);
    base 15_000 − 3_200 − 2_000 = 9_800¢, tax 1_960¢;
    the credit note is spent after tax, all 4_800¢ of it → 5_831¢ left;
    the wallet is spent last and is limited to `subscription` fees, and a limited wallet is capped per
    fee at `sub_total_excluding_taxes + taxes - precise_credit_notes`
    (allocate_prepaid_credits_by_wallets_service.rb:74-77). The credit note had already absorbed
    2_253¢ of the subscription fee, so only 2_733¢ of the wallet's 3_000¢ is usable → 3_098¢ due and
    267¢ left on the wallet. The charge fee is skipped outright by that service because its base is
    0 — a consequence of the tax defect below, not a separate rule.
    CHARACTERIZATION — the tax figure is wrong and this row records what Lago does, not what it
    should do. Derivation says 20% of the 9_800¢ base = 1_960¢; Lago charges 831¢, under-collecting
    1_129¢ of VAT.
    Cause, from `Credits::ProgressiveBillingService#apply_credit_to_fees`:
    `fee.precise_coupons_amount_cents += progressive_fee.amount_cents`, clamped to the fee amount.
    It adds the amount the threshold invoice BILLED (10_000¢), not the amount actually credited
    (3_200¢), so the charge fee's taxable base clamps to 0 and the fee is taxed at 0 — visible in the
    fee assertions above. The invoice-level `sub_total_excluding_taxes_amount_cents` is meanwhile
    reduced by only 3_200¢, so the invoice's own base (9_800¢) and the sum of its fees' bases no
    longer agree, and tax follows the fees.
    The two coincide whenever `to_credit_amount` equals the billed amount, which is every case B5 and
    B15 cover. They diverge exactly when something already reduced the threshold invoice — a coupon or
    a credit note — which is why it took a three-deep stack to surface. Correct behaviour would
    distribute the CAPPED credit across the fees.
    What the stack tests that the pairs cannot: the credit note reduces the progressive-billing credit
    (3_200¢ rather than 8_000¢) while ALSO being spent in full on the same invoice — counted once on
    each side of tax, for two different purposes. That is the interaction that exposed the tax defect.

- id: b17/coupon-tax-wallet/preview
  block: B17
  axes: {stack: coupon+tax+prepaid_credit, observed_via: preview}
  dimensions: {interval: monthly, billing_time: calendar, tax_rate: 20}
  provenance: coverage-gap
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  setup:
    organization: {premium_integrations: [preview]}
    taxes: [{code: b17_pv_vat, name: VAT, rate: 20}]
    metrics: [{code: b17_pv_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b17_preview, interval: monthly, amount_cents: 5000}
    charges: [{billable_metric_code: b17_pv_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b17_preview_cust, currency: EUR}
    subscription: {external_id: golden_b17_preview_sub, billing_time: calendar}
    coupons:
      - name: b17 preview coupon
        code: b17_preview_coupon
        coupon_type: fixed_amount
        frequency: recurring
        frequency_duration: 3
        amount_cents: 2000
        amount_currency: EUR
        expiration: no_expiration
    wallets:
      - {name: granted, rate_amount: "1", currency: EUR, granted_credits: "30"}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b17_pv_sum, properties: {amount: 100}}]
    - {at: "2024-03-25T10:00:00Z", do: preview_invoice}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_amount_cents: 15000
      coupons_amount_cents: 2000
      sub_total_excluding_taxes_amount_cents: 13000
      taxes_amount_cents: 2600
      prepaid_credit_amount_cents: 3000
      total_amount_cents: 12600
    preview:
      fees_amount_cents: 15000
      coupons_amount_cents: 2000
      sub_total_excluding_taxes_amount_cents: 13000
      taxes_amount_cents: 2600
      prepaid_credit_amount_cents: 3000
      total_amount_cents: 12600
  math: >-
    Three reducers, asserted twice with identical numbers — once on the invoice and once on the
    preview that predicts it. A preview is worth nothing except insofar as it equals the invoice, and
    a stack is where it stops doing so: preview reimplements the pipeline in
    Invoices::PreviewService#compute_tax_and_totals rather than sharing it, so every stage is a place
    the two can drift.
    5_000¢ subscription + 100 units × 1.00 = 15_000¢ of fees; the coupon takes 2_000¢ before tax →
    13_000¢ base; 20% = 2_600¢ → 15_600¢; the wallet's 30 credits are spent last, after tax, →
    12_600¢ due.
    The preview is taken on 25 March, when usage is already final and the wallet still holds its
    3_000¢, so it must produce the same six numbers. Each is asserted on both sides rather than just
    the total, because a stage-by-stage divergence that happens to cancel out in the total is the
    failure mode preview actually has — b04/preview/with-progressive-billing is the case where it did.
    No progressive billing here on purpose: that stack is b17/full-stack/invoice, and it carries a
    known tax defect which would make an equality row assert the bug on both sides.

- id: b17/pb-coupon-tax/invoice
  block: B17
  axes: {stack: progressive_billing+coupon+tax, observed_via: invoice}
  dimensions: {interval: monthly, billing_time: calendar, tax_rate: 20, threshold_amount_cents: 5000}
  provenance: characterization
  characterization: true
  runners: [rspec]
  premium: true
  no_transaction: true
  setup:
    organization: {premium_integrations: [progressive_billing]}
    taxes: [{code: b17_pct_vat, name: VAT, rate: 20}]
    metrics: [{code: b17_pct_sum, aggregation_type: sum_agg, field_name: amount}]
    plan:
      code: golden_b17_pb_coupon_tax
      interval: monthly
      amount_cents: 5000
      usage_thresholds: [{amount_cents: 5000}]
    charges: [{billable_metric_code: b17_pct_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b17_pct_cust, currency: EUR}
    subscription: {external_id: golden_b17_pct_sub, billing_time: calendar}
    coupons:
      - name: b17 pct coupon
        code: b17_pct_coupon
        coupon_type: fixed_amount
        frequency: recurring
        frequency_duration: 3
        amount_cents: 2000
        amount_currency: EUR
        expiration: no_expiration
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b17_pct_sum, properties: {amount: 100}}]
    - {at: "2024-03-05T11:00:00Z", do: perform_usage_update}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {invoice_type: progressive_billing}
        fees_amount_cents: 10000
        coupons_amount_cents: 2000
        taxes_amount_cents: 1600
        total_amount_cents: 9600
      - select: {invoice_type: subscription}
        fees_amount_cents: 15000
        progressive_billing_credit_amount_cents: 8000
        coupons_amount_cents: 2000
        sub_total_excluding_taxes_amount_cents: 5000
        taxes_amount_cents: 714
        total_amount_cents: 5714
        fees:
          - {fee_type: charge, amount_cents: 10000, taxes_amount_cents: 0}
          - {fee_type: subscription, amount_cents: 5000, taxes_amount_cents: 714}
  math: >-
    CHARACTERIZATION — the minimal reproduction of the tax defect recorded by b17/full-stack/invoice — three stages, not
    five, and no credit note.
    Threshold invoice: 100 units = 10_000¢ of charge, coupon 2_000¢ → 8_000¢ base, 20% = 1_600¢,
    total 9_600¢.
    Period invoice: 5_000¢ subscription + 10_000¢ charge = 15_000¢ of fees. The credit is what was
    collected, `fees - coupons` = 8_000¢, not the 10_000¢ billed. The coupon takes 2_000¢ more, so
    the invoice's own base is 15_000 - 8_000 - 2_000 = 5_000¢ and tax should be 1_000¢.
    Lago charges 714¢, under-collecting 286¢ of VAT.
    The trigger is now exact, and narrower than the five-stack row suggested: `to_credit_amount`
    (8_000¢) is less than the amount the threshold invoice BILLED (10_000¢), and
    `apply_credit_to_fees` writes the billed figure into `fee.precise_coupons_amount_cents`, clamped
    to the fee. The charge fee's base clamps to 0 and it is taxed at 0 — asserted above. The invoice's
    own base is still 5_000¢, so the invoice and the sum of its fees disagree and tax follows the
    fees. A coupon on the threshold invoice is enough; no credit note and no third reducer are needed.
    b17/pb-tax-wallet/invoice is the control: prepaid credit is the one reducer `to_credit_amount`
    does not subtract, so there the two figures agree and the tax is right at 1_000¢. Together the two
    rows say the defect is not "progressive billing plus tax" but "progressive billing plus tax plus
    anything that reduced what the threshold invoice collected".

- id: b17/pb-tax-wallet/invoice
  block: B17
  axes: {stack: progressive_billing+tax+prepaid_credit, observed_via: invoice}
  dimensions: {interval: monthly, billing_time: calendar, tax_rate: 20, threshold_amount_cents: 5000}
  provenance: coverage-gap
  runners: [rspec]
  premium: true
  no_transaction: true
  setup:
    organization: {premium_integrations: [progressive_billing]}
    taxes: [{code: b17_ptw_vat, name: VAT, rate: 20}]
    metrics: [{code: b17_ptw_sum, aggregation_type: sum_agg, field_name: amount}]
    plan:
      code: golden_b17_pb_tax_wallet
      interval: monthly
      amount_cents: 5000
      usage_thresholds: [{amount_cents: 5000}]
    charges: [{billable_metric_code: b17_ptw_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b17_ptw_cust, currency: EUR}
    subscription: {external_id: golden_b17_ptw_sub, billing_time: calendar}
    wallets:
      - {name: granted, rate_amount: "1", currency: EUR, granted_credits: "50"}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b17_ptw_sum, properties: {amount: 100}}]
    - {at: "2024-03-05T11:00:00Z", do: perform_usage_update}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {invoice_type: progressive_billing}
        fees_amount_cents: 10000
        taxes_amount_cents: 2000
        prepaid_credit_amount_cents: 5000
        total_amount_cents: 7000
      - select: {invoice_type: subscription}
        fees_amount_cents: 15000
        progressive_billing_credit_amount_cents: 10000
        sub_total_excluding_taxes_amount_cents: 5000
        taxes_amount_cents: 1000
        prepaid_credit_amount_cents: 0
        total_amount_cents: 6000
    wallet:
      balance_cents: 0
  math: >-
    The control for b17/pb-coupon-tax/invoice, and the row that pins down what actually triggers the
    tax defect.
    Prepaid credit is the one reducer `to_credit_amount` does NOT subtract, so here the credit equals
    the amount billed — 10_000¢ — and the figure `apply_credit_to_fees` writes into the charge fee is
    the same 10_000¢. Fee bases and invoice base therefore agree: subscription 5_000¢ + charge 0¢ =
    5_000¢, tax 1_000¢, exactly 20% of the invoice's own 5_000¢ base. Correct.
    Threshold invoice: 10_000¢ of charge, 2_000¢ tax, the wallet's 5_000¢ spent on it → 7_000¢ cash.
    Period invoice: 15_000¢ of fees, 10_000¢ credited, 5_000¢ base, 1_000¢ tax → 6_000¢, and the
    wallet is already empty so it contributes nothing.
    Cash total 13_000¢ = 18_000¢ gross less the 5_000¢ of credits. The defect needs something that
    reduces to_credit — a coupon or a credit note on the threshold invoice — and prepaid credit is
    not it.

- id: b17/coupon-tax-credit-note/invoice
  block: B17
  axes: {stack: coupon+tax+credit_note, observed_via: invoice}
  dimensions: {interval: monthly, billing_time: calendar, tax_rate: 20}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    taxes: [{code: b17_ctc_vat, name: VAT, rate: 20}]
    metrics: [{code: b17_ctc_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b17_ctc, interval: monthly, amount_cents: 5000}
    charges: [{billable_metric_code: b17_ctc_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b17_ctc_cust, currency: EUR}
    subscription: {external_id: golden_b17_ctc_sub, billing_time: calendar}
    coupons:
      - name: b17 ctc coupon
        code: b17_ctc_coupon
        coupon_type: fixed_amount
        frequency: recurring
        frequency_duration: 3
        amount_cents: 2000
        amount_currency: EUR
        expiration: no_expiration
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b17_ctc_sum, properties: {amount: 100}}]
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - at: "2024-04-02T10:00:00Z"
      do: create_credit_note
      credit_note:
        reason: other
        credit_amount_cents: 5200
        refund_amount_cents: 0
        items: [{fee_type: charge, amount_cents: 5000}]
    - at: "2024-04-10T10:00:00Z"
      do: ingest_events
      events: [{code: b17_ctc_sum, properties: {amount: 50}}]
    - {at: "2024-05-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {index: 0}
        fees_amount_cents: 15000
        coupons_amount_cents: 2000
        sub_total_excluding_taxes_amount_cents: 13000
        taxes_amount_cents: 2600
        total_amount_cents: 15600
      - select: {index: 1}
        fees_amount_cents: 10000
        coupons_amount_cents: 2000
        sub_total_excluding_taxes_amount_cents: 8000
        taxes_amount_cents: 1600
        credit_notes_amount_cents: 5200
        total_amount_cents: 4400
  math: >-
    Three reducers straddling tax: the coupon lowers the base, the credit note only the total, and tax
    sits between them. The stack is what makes the credit note's own value depend on the coupon.
    April invoice: 5_000¢ subscription + 100 units = 15_000¢ of fees, coupon 2_000¢ → 13_000¢ base,
    20% = 2_600¢, total 15_600¢.
    Crediting 5_000¢ of the charge fee returns a proportional slice of the coupon and its tax: the
    charge fee carried 10_000/15_000 × 2_000 = 1_333.33¢ of coupon, of which half belongs to the
    5_000¢ credited → 4_333.33¢ pre-tax, ×1.2 = 5_200¢ of spendable balance. Neither the coupon nor
    the tax alone predicts that figure.
    May invoice: 5_000¢ subscription + 50 units = 10_000¢, coupon 2_000¢ again → 8_000¢ base,
    1_600¢ tax → 9_600¢, less the whole 5_200¢ credit note = 4_400¢.
    Applying the credit note before tax would give 8_000 - 5_200 = 2_800¢ of base, 560¢ of tax and a
    3_360¢ total, so the intermediate fields are asserted rather than the total alone.

- id: b17/tax-credit-note-wallet/invoice
  block: B17
  axes: {stack: tax+credit_note+prepaid_credit, observed_via: invoice}
  dimensions: {interval: monthly, billing_time: calendar, tax_rate: 20}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    taxes: [{code: b17_tcw_vat, name: VAT, rate: 20}]
    metrics:
      - {code: b17_tcw_early, aggregation_type: sum_agg, field_name: amount}
      - {code: b17_tcw_late, aggregation_type: sum_agg, field_name: amount}
    plan: {code: golden_b17_tcw, interval: monthly, amount_cents: 0}
    charges:
      - {billable_metric_code: b17_tcw_early, charge_model: standard, properties: {amount: "1"}}
      - {billable_metric_code: b17_tcw_late, charge_model: standard, properties: {amount: "1"}}
    customer: {external_id: golden_b17_tcw_cust, currency: EUR}
    subscription: {external_id: golden_b17_tcw_sub, billing_time: calendar}
    wallets:
      - name: granted
        rate_amount: "1"
        currency: EUR
        granted_credits: "50"
        applies_to: {billable_metric_codes: [b17_tcw_late]}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b17_tcw_early, properties: {amount: 100}}]
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - at: "2024-04-02T10:00:00Z"
      do: create_credit_note
      credit_note:
        reason: other
        credit_amount_cents: 7200
        refund_amount_cents: 0
        items: [{fee_type: charge, amount_cents: 6000}]
    - at: "2024-04-10T10:00:00Z"
      do: ingest_events
      events: [{code: b17_tcw_late, properties: {amount: 80}}]
    - {at: "2024-05-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {index: 0}
        fees_amount_cents: 10000
        taxes_amount_cents: 2000
        prepaid_credit_amount_cents: 0
        total_amount_cents: 12000
      - select: {index: 1}
        fees_amount_cents: 8000
        taxes_amount_cents: 1600
        credit_notes_amount_cents: 7200
        prepaid_credit_amount_cents: 2400
        total_amount_cents: 0
    wallet:
      balance_cents: 2600
  math: >-
    The two post-tax reducers plus the tax they both sit behind, and the row where the credit note
    determines how much of the wallet is even usable.
    April invoice: 100 units of `early` = 10_000¢, tax 2_000¢ → 12_000¢. The wallet is limited to
    `late`, so it cannot touch this invoice — without that it would drain here and the stack would
    never form. Crediting 6_000¢ of the charge returns its tax too → 7_200¢ of balance.
    May invoice: 80 units of `late` = 8_000¢, tax 1_600¢ → 9_600¢. The credit note is spent first and
    in full: 9_600 - 7_200 = 2_400¢. The wallet is then capped per fee at
    `sub_total_excluding_taxes + taxes - precise_credit_notes`
    (allocate_prepaid_credits_by_wallets_service.rb:74-77) = 9_600 - 7_200 = 2_400¢, so despite
    holding 5_000¢ it may contribute only 2_400¢ — exactly what is left — and 2_600¢ stays on it.
    Reverse the last two stages and the wallet would spend 5_000¢ first, leaving 4_600¢ for a credit
    note that would then keep 2_600¢ of unusable balance instead. Same 0¢ total, different customer
    assets, which is why the wallet balance is asserted.

- id: b17/pb-coupon-credit-note/invoice
  block: B17
  axes: {stack: progressive_billing+coupon+credit_note, observed_via: invoice}
  dimensions: {interval: monthly, billing_time: calendar, threshold_amount_cents: 5000, taxes: none}
  provenance: coverage-gap
  runners: [rspec]
  premium: true
  no_transaction: true
  setup:
    organization: {premium_integrations: [progressive_billing]}
    metrics: [{code: b17_pcc_sum, aggregation_type: sum_agg, field_name: amount}]
    plan:
      code: golden_b17_pcc
      interval: monthly
      amount_cents: 5000
      usage_thresholds: [{amount_cents: 5000}]
    charges: [{billable_metric_code: b17_pcc_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b17_pcc_cust, currency: EUR}
    subscription: {external_id: golden_b17_pcc_sub, billing_time: calendar}
    coupons:
      - name: b17 pcc coupon
