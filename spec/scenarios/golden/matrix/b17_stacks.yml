    `to_credit_amount`, the same behaviour b15/coupon/progressive_billing reports as a finding,
    surfacing here through a second reducer rather than in isolation.

- id: b17/coupon-credit-note-wallet/invoice
  block: B17
  axes: {stack: coupon+credit_note+prepaid_credit, observed_via: invoice}
  dimensions: {interval: monthly, billing_time: calendar, taxes: none}
  provenance: coverage-gap
