    progressive_billing + coupon + tax predicted before the period closes. The same numbers are asserted
    on the invoice and on the preview, because a preview earns its keep only by agreeing with the
    invoice it forecasts.
    A preview is not a draft: Invoices::PreviewService applies the coupon, the credit note and the
    wallet that a draft withholds, and since the fix in this session it also credits progressive
    billing. But it REIMPLEMENTS the pipeline rather than sharing CalculateFeesService, so every
