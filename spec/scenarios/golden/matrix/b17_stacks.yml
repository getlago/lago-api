        reason: other
        credit_amount_cents: 4000
        refund_amount_cents: 0
        items: [{fee_type: charge, amount_cents: 5000}]
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {invoice_type: progressive_billing}
        fees_amount_cents: 10000
        coupons_amount_cents: 2000
        total_amount_cents: 8000
      - select: {invoice_type: subscription}
        fees_amount_cents: 15000
        progressive_billing_credit_amount_cents: 4000
        coupons_amount_cents: 2000
        sub_total_excluding_taxes_amount_cents: 9000
        credit_notes_amount_cents: 4000
        total_amount_cents: 5000
  math: >-
    A credit note raised against a threshold invoice is counted TWICE by the period invoice, on
    opposite sides of the ledger, and this is the smallest stack where that is visible.
    Threshold invoice: 10_000¢ of charge less the 2_000¢ recurring coupon = 8_000¢. Crediting 5_000¢
    of the fee returns its half of the coupon (1_000¢) → a 4_000¢ balance.
    Period invoice, 15_000¢ of fees:
    `to_credit_amount` = 10_000 − 2_000 coupons − 4_000 credit notes = 4_000¢, so the progressive
    credit is what the customer is still out of pocket for, not what was billed;
    the coupon takes 2_000¢ again → base 15_000 − 4_000 − 2_000 = 9_000¢;
    then the SAME 4_000¢ credit note is spent as credit → 5_000¢ due.
    Subtracting it once and forgetting the other use is the obvious bug in either direction: skip it in
    `to_credit_amount` and the credit becomes 8_000¢ (invoice 1_000¢), skip it as a credit and the
    invoice is 9_000¢. Both are one line away and both are wrong, which is why the two fields are
    asserted separately rather than through the total.

- id: b17/pb-coupon-wallet/invoice
  block: B17
  axes: {stack: progressive_billing+coupon+prepaid_credit, observed_via: invoice}
