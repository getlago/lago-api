        coupons_amount_cents: 2000
        sub_total_excluding_taxes_amount_cents: 9800
        taxes_amount_cents: 831
        credit_notes_amount_cents: 4800
        total_amount_cents: 5831
  math: >-
    CHARACTERIZATION — b17/full-stack/invoice with the wallet removed, which isolates the tax defect
    from the wallet arithmetic layered on top of it there.
    Identical up to the last stage: threshold invoice 10_000¢ less the 2_000¢ coupon = 8_000¢ base,
