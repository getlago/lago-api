        prepaid_credit_amount_cents: 0
        total_amount_cents: 5000
    wallet:
      balance_cents: 0
  math: >-
    Two reducers reduce what the threshold invoice COLLECTED, and only one of them reduces what the
    period invoice credits back. That asymmetry is the whole content of this stack.
    Threshold invoice: 10_000¢ of charge, coupon 2_000¢ → 8_000¢, and the wallet's 5_000¢ is spent
    after that → 3_000¢ cash, wallet emptied.
    Period invoice: `to_credit_amount` = fees − coupons − pb − credit_notes = 10_000 − 2_000 = 8_000¢.
    The wallet's 5_000¢ is NOT subtracted, so the credit covers money the wallet paid as well as cash
    the customer paid. Base 15_000 − 8_000 − 2_000 = 5_000¢; the wallet is already empty so the last
    stage contributes nothing; 5_000¢ due.
