    on the subscription fee + 1_200¢ on the charge fee + 2_000¢ on the commitment fee. Each fee is then
    taxed at ITS own rate on what remains (apply_taxes_service.rb:37): 1_200 × 10% = 120¢; 1_800 × 10% =
    180¢; 3_000 × 20% = 600¢ — 900¢ in total. fees_amount_cents is 10_000¢ under either order and is
    therefore not load-bearing here. `once` is asserted across TWO periods, not one, because a single
    invoice cannot tell the three frequencies apart. On the first invoice the credit equals the whole
    applied amount, so applied_coupon_service.rb:82 sees `credit_amount >= remaining_amount` and
    terminates the applied coupon; the second period's invoice therefore carries coupons_amount_cents: 0
    and the undiscounted tax. Had the coupon been `forever` the second invoice would repeat the first. The
    undiscounted invoice in this row is 10_000¢ of fees, 1_500¢ of tax, 11_500¢ total. One more ordering
    is baked into these numbers: the true-up is a PRODUCER, created at calculate_fees_service.rb:46 before
    the coupon reducer at :54, and calculate_true_up_fee_service.rb:37-41 reads raw amount_cents. So it
