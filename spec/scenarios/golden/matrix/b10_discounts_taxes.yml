    (tax-first: 11_500¢) and taxes_amount_cents 1_125¢ (tax-first: 1_500¢). Each of the three separates
    the orders even where the total does not. Per-fee arithmetic, and it is per-fee because the rates
    differ (or, where they do not, because the invoice total would hide a wrong rung behind a blend).
    applied_coupon_service.rb:37 with fee.rb:235 spreads the credit pro rata on amount_cents: 500¢ on the
    subscription fee + 750¢ on the charge fee + 1_250¢ on the commitment fee. Each fee is then taxed at
    ITS own rate on what remains (apply_taxes_service.rb:37): 1_500 × 10% = 150¢; 2_250 × 10% = 225¢;
    3_750 × 20% = 750¢ — 1_125¢ in total. fees_amount_cents is 10_000¢ under either order and is therefore
    not load-bearing here. `forever` is asserted across THREE periods. applied_coupon_service.rb:79
    returns false from should_terminate_applied_coupon? unconditionally for a forever coupon, and
    amount_service.rb:32-35 re-reads the full amount rather than a dwindling remainder, so every invoice
    carries the same credit. All three invoices are discounted identically — `once` would have discounted
    only the first and `recurring` with duration 2 only the first two, which is exactly the contrast the
    third period buys. The undiscounted invoice in this row is 10_000¢ of fees, 1_500¢ of tax, 11_500¢
    total. One more ordering is baked into these numbers: the true-up is a PRODUCER, created at
    calculate_fees_service.rb:46 before the coupon reducer at :54, and
    calculate_true_up_fee_service.rb:37-41 reads raw amount_cents. So it tops the period up to the 10_000¢
    floor from 5_000¢ of real fees, and the coupon then discounts the floor itself rather than being
    absorbed by the headroom under it.
