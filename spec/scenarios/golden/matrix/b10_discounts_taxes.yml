    nothing: coupon-first gives 2_500¢ off a 10_000¢ base, taxes on 7_500¢ = 1_125¢, total 8_625¢ — and
    tax-first would give 1_500¢ of tax on the gross, then 25% of the tax-inclusive 11_500¢ = 2_875¢, for a
    total of 8_625¢. That is why this row asserts the INTERMEDIATE fields rather than only the total:
