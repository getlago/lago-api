    The billing entity default is the LAST rung (apply_taxes_service.rb:77) — nothing can shadow it, so
    the only way to prove it is a rung rather than a global setting is to put a fee beside it that
    resolves higher. `b10_be_charge` carries 25% on the charge and takes rung 3 (:68); the subscription
    fee has no charge, no plan tax and no customer tax, so it falls all the way through :68-:74 and picks
