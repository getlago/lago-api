    The billing entity default is the LAST rung (apply_taxes_service.rb:77) — nothing can shadow it, so
    the only way to prove it is a rung rather than a global setting is to put a fee beside it that
    resolves higher. `b10_be_charge` carries 25% on the charge and takes rung 3 (:68); the subscription
    fee has no charge, no plan tax and no customer tax, so it falls all the way through :68-:74 and picks
    up the entity's 20%. Two different rates on one invoice is the assertion: a uniform 20% would mean
    rung 3 never fired, and a uniform 25% would mean the entity default is not a fallback at all. Which
    level won: billing-entity (rung 8, apply_taxes_service.rb:77). Overridden: rung 3 (the charge's own
    25%) shadows the entity default for the charge fee; the entity default is itself the bottom of the
    ladder and shadows nothing. Had the shadowed rung won instead, the entity default's 20% applied to the
    charge fee as well would have made the discounted invoice total 9_000¢ rather than 9_300¢. Order of
    the reducers. calculate_fees_service.rb:54 applies the coupon and :56 computes the taxes. A percentage
    coupon COMMUTES with a percentage tax, so the total alone proves nothing: coupon-first gives 2_500¢
    off a 10_000¢ base, taxes on 7_500¢ = 1_800¢, total 9_300¢ — and tax-first would give 2_400¢ of tax on
    the gross, then 25% of the tax-inclusive 12_400¢ = 3_100¢, for a total of 9_300¢. That is why this row
    asserts the INTERMEDIATE fields rather than only the total: coupons_amount_cents 2_500¢ (tax-first:
    3_100¢), sub_total_excluding_taxes_amount_cents 7_500¢ (tax-first: 12_400¢) and taxes_amount_cents
    1_800¢ (tax-first: 2_400¢). Each of the three separates the orders even where the total does not.
    Per-fee arithmetic, and it is per-fee because the rates differ (or, where they do not, because the
    invoice total would hide a wrong rung behind a blend). applied_coupon_service.rb:37 with fee.rb:235
    spreads the credit pro rata on amount_cents: 500¢ on the subscription fee + 2_000¢ on the charge fee.
    Each fee is then taxed at ITS own rate on what remains (apply_taxes_service.rb:37): 1_500 × 20% =
    300¢; 6_000 × 25% = 1_500¢ — 1_800¢ in total. fees_amount_cents is 10_000¢ under either order and is
    therefore not load-bearing here. `once` is asserted across TWO periods, not one, because a single
    invoice cannot tell the three frequencies apart. On the first invoice the credit equals the whole
    applied amount, so applied_coupon_service.rb:82 sees `credit_amount >= remaining_amount` and
    terminates the applied coupon; the second period's invoice therefore carries coupons_amount_cents: 0
    and the undiscounted tax. Had the coupon been `forever` the second invoice would repeat the first. The
    undiscounted invoice in this row is 10_000¢ of fees, 2_400¢ of tax, 12_400¢ total.

