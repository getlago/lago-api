          - {fee_type: fixed_charge, item_code: b10_fc_seat, amount_cents: 4000, taxes_amount_cents: 600}
  math: >-
    The fixed-charge rung (4, :69) against the plan rung (6, :71-73). The fixed charge prices an add-on on
    the plan and carries its own 20%, so `fee.fixed_charge? && fee.fixed_charge.taxes.any?` matches at :69
    and short-circuits before the plan check. The subscription fee is not a fixed charge, so it falls to
    the plan's 10%. The entity's 5% is configured and never used. Note the fee-type reach of rung 6: it
    explicitly lists fixed_charge, so without the fixed charge's own tax BOTH fees would have taken 10%.
    Which level won: fixed-charge (rung 4, apply_taxes_service.rb:69). Overridden: the plan (rung 6, 10%)
    for the fixed-charge fee, and the billing-entity default (rung 8, 5%) for everything. Had the shadowed
    rung won instead, the plan's 10% on every fee would have made the discounted invoice total 4_950¢
    rather than 5_250¢. Order of the reducers. calculate_fees_service.rb:54 applies the coupon and :56
    computes the taxes. A percentage coupon COMMUTES with a percentage tax, so the total alone proves
    nothing: coupon-first gives 1_500¢ off a 6_000¢ base, taxes on 4_500¢ = 750¢, total 5_250¢ — and
    tax-first would give 1_000¢ of tax on the gross, then 25% of the tax-inclusive 7_000¢ = 1_750¢, for a
    total of 5_250¢. That is why this row asserts the INTERMEDIATE fields rather than only the total:
    coupons_amount_cents 1_500¢ (tax-first: 1_750¢), sub_total_excluding_taxes_amount_cents 4_500¢
    (tax-first: 7_000¢) and taxes_amount_cents 750¢ (tax-first: 1_000¢). Each of the three separates the
    orders even where the total does not. Per-fee arithmetic, and it is per-fee because the rates differ
    (or, where they do not, because the invoice total would hide a wrong rung behind a blend).
    applied_coupon_service.rb:37 with fee.rb:235 spreads the credit pro rata on amount_cents: 500¢ on the
    subscription fee + 1_000¢ on the fixed_charge fee. Each fee is then taxed at ITS own rate on what
    remains (apply_taxes_service.rb:37): 1_500 × 10% = 150¢; 3_000 × 20% = 600¢ — 750¢ in total.
    fees_amount_cents is 6_000¢ under either order and is therefore not load-bearing here. `forever` is
    asserted across THREE periods. applied_coupon_service.rb:79 returns false from
    should_terminate_applied_coupon? unconditionally for a forever coupon, and amount_service.rb:32-35
    re-reads the full amount rather than a dwindling remainder, so every invoice carries the same credit.
    All three invoices are discounted identically — `once` would have discounted only the first and
    `recurring` with duration 2 only the first two, which is exactly the contrast the third period buys.
    The undiscounted invoice in this row is 6_000¢ of fees, 1_000¢ of tax, 7_000¢ total.

