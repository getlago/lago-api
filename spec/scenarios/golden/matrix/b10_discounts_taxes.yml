      events: [{code: b10_be_sum, properties: {amount: 80}}]
    - {at: "2024-05-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {index: 0}
        fees_amount_cents: 10000
        coupons_amount_cents: 2500
        sub_total_excluding_taxes_amount_cents: 7500
        taxes_amount_cents: 1800
        total_amount_cents: 9300
        fees_count: 2
        fees:
          - {fee_type: subscription, amount_cents: 2000, taxes_amount_cents: 300}
          - {fee_type: charge, amount_cents: 8000, taxes_amount_cents: 1500}
      - select: {index: 1}
        fees_amount_cents: 10000
        coupons_amount_cents: 0
        sub_total_excluding_taxes_amount_cents: 10000
        taxes_amount_cents: 2400
        total_amount_cents: 12400
        fees_count: 2
        fees:
          - {fee_type: subscription, amount_cents: 2000, taxes_amount_cents: 400}
          - {fee_type: charge, amount_cents: 8000, taxes_amount_cents: 2000}
