        taxes_amount_cents: 1500
        total_amount_cents: 9000
        fees_count: 2
        fees:
          - {fee_type: subscription, amount_cents: 2000, taxes_amount_cents: 300}
          - {fee_type: charge, amount_cents: 8000, taxes_amount_cents: 1200}
      - select: {index: 2}
        fees_amount_cents: 10000
        coupons_amount_cents: 0
        sub_total_excluding_taxes_amount_cents: 10000
        taxes_amount_cents: 2000
        total_amount_cents: 12000
        fees_count: 2
        fees:
          - {fee_type: subscription, amount_cents: 2000, taxes_amount_cents: 400}
          - {fee_type: charge, amount_cents: 8000, taxes_amount_cents: 1600}
  math: >-
    Three rungs stacked so that the winner is unambiguous. The plan carries 20% (rung 6, :71-73), the
    customer 10% (rung 7, :74) and the billing entity 5% (rung 8, :77). Rung 6 is guarded by a fee-type
    check — it only fires for charge, subscription, commitment and fixed_charge fees — and both fees here
    qualify, so the plan's 20% is what lands. A 20% observed rate can come from nowhere else in this
    setup, which is precisely why the customer was given 10% rather than the same 20%. Which level won:
    plan (rung 6, apply_taxes_service.rb:71-73). Overridden: the customer (rung 7, 10%) and the
    billing-entity default (rung 8, 5%). Had the shadowed rung won instead, the customer's 10% would have
    made the discounted invoice total 8_250¢ rather than 9_000¢. Order of the reducers.
    calculate_fees_service.rb:54 applies the coupon and :56 computes the taxes. A percentage coupon
    COMMUTES with a percentage tax, so the total alone proves nothing: coupon-first gives 2_500¢ off a
    10_000¢ base, taxes on 7_500¢ = 1_500¢, total 9_000¢ — and tax-first would give 2_000¢ of tax on the
    gross, then 25% of the tax-inclusive 12_000¢ = 3_000¢, for a total of 9_000¢. That is why this row
    asserts the INTERMEDIATE fields rather than only the total: coupons_amount_cents 2_500¢ (tax-first:
    3_000¢), sub_total_excluding_taxes_amount_cents 7_500¢ (tax-first: 12_000¢) and taxes_amount_cents
    1_500¢ (tax-first: 2_000¢). Each of the three separates the orders even where the total does not.
    Per-fee arithmetic, and it is per-fee because the rates differ (or, where they do not, because the
    invoice total would hide a wrong rung behind a blend). applied_coupon_service.rb:37 with fee.rb:235
    spreads the credit pro rata on amount_cents: 500¢ on the subscription fee + 2_000¢ on the charge fee.
    Each fee is then taxed at ITS own rate on what remains (apply_taxes_service.rb:37): 1_500 × 20% =
    300¢; 6_000 × 20% = 1_200¢ — 1_500¢ in total. fees_amount_cents is 10_000¢ under either order and is
    therefore not load-bearing here. `recurring` with frequency_duration 2 is asserted across THREE
    periods, which is the only window that separates it from both neighbours.
    applied_coupon_service.rb:88-89 decrements frequency_duration_remaining on each application and :84
    terminates when it reaches 0: 2 -> 1 after the first invoice (still active), 1 -> 0 after the second
    (terminated). So invoices 1 and 2 are discounted and invoice 3 is not. `once` would have discounted
    only the first; `forever` would have discounted all three. The undiscounted invoice in this row is
    10_000¢ of fees, 2_000¢ of tax, 12_000¢ total.

