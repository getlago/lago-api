          - {fee_type: charge, amount_cents: 8000, taxes_amount_cents: 1200}
      - select: {index: 1}
        fees_amount_cents: 10000
        coupons_amount_cents: 4000
        sub_total_excluding_taxes_amount_cents: 6000
        taxes_amount_cents: 1440
        total_amount_cents: 7440
        fees_count: 2
        fees:
          - {fee_type: subscription, amount_cents: 2000, taxes_amount_cents: 240}
          - {fee_type: charge, amount_cents: 8000, taxes_amount_cents: 1200}
      - select: {index: 2}
        fees_amount_cents: 10000
        coupons_amount_cents: 0
        sub_total_excluding_taxes_amount_cents: 10000
        taxes_amount_cents: 2400
        total_amount_cents: 12400
        fees_count: 2
