- id: b10/fixed_amount/once/fixed-charge
  block: B10
  axes: {coupon_type: fixed_amount, coupon_frequency: once, tax_level: fixed-charge}
  dimensions: {interval: monthly, billing_time: calendar, periods: 2, winning_rung: 4}
  provenance: coverage-gap
  runners: [rspec, live]
  setup:
    taxes:
      - {code: b10_fc_entity, name: entity default, rate: 5, applied_to_organization: true}
      - {code: b10_fc_plan, name: plan, rate: 10, applied_to_organization: false}
      - {code: b10_fc_fixed, name: fixed charge, rate: 20, applied_to_organization: false}
    add_ons: [{code: b10_fc_seat, name: Seat, amount_cents: 1000}]
    plan:
      code: golden_b10_fa_once_fc
      interval: monthly
      amount_cents: 2000
      tax_codes: [b10_fc_plan]
    fixed_charges:
      - {add_on_code: b10_fc_seat, charge_model: standard, units: 4, properties: {amount: "10"}, tax_codes: [b10_fc_fixed]}
    customer:
      external_id: golden_b10_fa_once_fc_cust
      currency: EUR
    subscription: {external_id: golden_b10_fa_once_fc_sub, billing_time: calendar}
    coupons:
      - name: b10 fa_once_fc coupon
        code: b10_fa_once_fc_coupon
        coupon_type: fixed_amount
        frequency: once
        amount_cents: 3000
        amount_currency: EUR
        expiration: no_expiration
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - {at: "2024-05-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {index: 0}
        fees_amount_cents: 6000
        coupons_amount_cents: 3000
        sub_total_excluding_taxes_amount_cents: 3000
        taxes_amount_cents: 500
        total_amount_cents: 3500
        fees_count: 2
        fees:
          - {fee_type: subscription, amount_cents: 2000, taxes_amount_cents: 100}
          - {fee_type: fixed_charge, item_code: b10_fc_seat, amount_cents: 4000, taxes_amount_cents: 400}
      - select: {index: 1}
        fees_amount_cents: 6000
        coupons_amount_cents: 0
        sub_total_excluding_taxes_amount_cents: 6000
        taxes_amount_cents: 1000
        total_amount_cents: 7000
        fees_count: 2
        fees:
          - {fee_type: subscription, amount_cents: 2000, taxes_amount_cents: 200}
          - {fee_type: fixed_charge, item_code: b10_fc_seat, amount_cents: 4000, taxes_amount_cents: 800}
  math: >-
    The fixed-charge rung (4, :69) against the plan rung (6, :71-73). The fixed charge prices an add-on on
    the plan and carries its own 20%, so `fee.fixed_charge? && fee.fixed_charge.taxes.any?` matches at :69
    and short-circuits before the plan check. The subscription fee is not a fixed charge, so it falls to
    the plan's 10%. The entity's 5% is configured and never used. Note the fee-type reach of rung 6: it
    explicitly lists fixed_charge, so without the fixed charge's own tax BOTH fees would have taken 10%.
    Which level won: fixed-charge (rung 4, apply_taxes_service.rb:69). Overridden: the plan (rung 6, 10%)
    for the fixed-charge fee, and the billing-entity default (rung 8, 5%) for everything. Had the shadowed
    rung won instead, the plan's 10% on every fee would have made the discounted invoice total 3_300¢
    rather than 3_500¢. Order of the reducers. calculate_fees_service.rb:54 applies the coupon and :56
    computes the taxes, in that order, so the coupon lands on the raw fees and the tax lands on what is
    left. 6_000¢ of fees, a 3_000¢ fixed coupon, taxable base 3_000¢, taxes 500¢, total 3_500¢. Reverse
    the two lines and the tax is computed on the undiscounted 6_000¢ (1_000¢ instead of 500¢) and the
    invoice totals 4_000¢. A fixed coupon does not commute with a tax, so those two totals differ and the
    row can name which order produced its number. Per-fee arithmetic, and it is per-fee because the rates
    differ (or, where they do not, because the invoice total would hide a wrong rung behind a blend).
    applied_coupon_service.rb:37 with fee.rb:235 spreads the credit pro rata on amount_cents: 1_000¢ on
    the subscription fee + 2_000¢ on the fixed_charge fee. Each fee is then taxed at ITS own rate on what
    remains (apply_taxes_service.rb:37): 1_000 × 10% = 100¢; 2_000 × 20% = 400¢ — 500¢ in total.
    fees_amount_cents is 6_000¢ under either order and is therefore not load-bearing here. `once` is
    asserted across TWO periods, not one, because a single invoice cannot tell the three frequencies
    apart. On the first invoice the credit equals the whole applied amount, so
    applied_coupon_service.rb:82 sees `credit_amount >= remaining_amount` and terminates the applied
    coupon; the second period's invoice therefore carries coupons_amount_cents: 0 and the undiscounted
    tax. Had the coupon been `forever` the second invoice would repeat the first. The undiscounted invoice
    in this row is 6_000¢ of fees, 1_000¢ of tax, 7_000¢ total.

