    absence is what the row pins. Which level won: customer (rung 7, apply_taxes_service.rb:74).
    Overridden: the billing-entity default (rung 8, 5%). Had the shadowed rung won instead, the entity
    default's 5% would have made the discounted invoice total 6_300¢ rather than 7_200¢. Order of the
    reducers. calculate_fees_service.rb:54 applies the coupon and :56 computes the taxes, in that order,
