    25%) shadows the entity default for the charge fee; the entity default is itself the bottom of the
    ladder and shadows nothing. Had the shadowed rung won instead, the entity default's 20% applied to the
    charge fee as well would have made the discounted invoice total 7_200¢ rather than 7_440¢. Order of
    the reducers. calculate_fees_service.rb:54 applies the coupon and :56 computes the taxes, in that
    order, so the coupon lands on the raw fees and the tax lands on what is left. 10_000¢ of fees, a
    4_000¢ fixed coupon, taxable base 6_000¢, taxes 1_440¢, total 7_440¢. Reverse the two lines and the
    tax is computed on the undiscounted 10_000¢ (2_400¢ instead of 1_440¢) and the invoice totals 8_400¢.
    A fixed coupon does not commute with a tax, so those two totals differ and the row can name which
    order produced its number. Per-fee arithmetic, and it is per-fee because the rates differ (or, where
    they do not, because the invoice total would hide a wrong rung behind a blend).
    applied_coupon_service.rb:37 with fee.rb:235 spreads the credit pro rata on amount_cents: 800¢ on the
    subscription fee + 3_200¢ on the charge fee. Each fee is then taxed at ITS own rate on what remains
    (apply_taxes_service.rb:37): 1_200 × 20% = 240¢; 4_800 × 25% = 1_200¢ — 1_440¢ in total.
    fees_amount_cents is 10_000¢ under either order and is therefore not load-bearing here. `recurring`
    with frequency_duration 2 is asserted across THREE periods, which is the only window that separates it
    from both neighbours. applied_coupon_service.rb:88-89 decrements frequency_duration_remaining on each
    application and :84 terminates when it reaches 0: 2 -> 1 after the first invoice (still active), 1 ->
    0 after the second (terminated). So invoices 1 and 2 are discounted and invoice 3 is not. `once` would
    have discounted only the first; `forever` would have discounted all three. The undiscounted invoice in
    this row is 10_000¢ of fees, 2_400¢ of tax, 12_400¢ total.

