# B10 — which tax applies, and what the coupon does to it.
#
# Fees::ApplyTaxesService#applicable_taxes is a ladder of eight rungs, first match wins
# (apply_taxes_service.rb:64-78). Every rung had been exercised somewhere except as a LADDER: no test
# put fees on one invoice that resolve to different rungs, which is the only way to prove a rung
# shadows the ones beneath it rather than merely working when it is the only one configured.
#
# The other half of the block is the reducer ORDER: calculate_fees_service.rb:54 applies the coupon
# and :56 computes the taxes. Every fixed_amount row names the total the reverse order would have
# produced. A PERCENTAGE coupon commutes with a percentage tax, so those rows cannot pin the order
# through the total at all — they assert coupons_amount_cents,
# sub_total_excluding_taxes_amount_cents and taxes_amount_cents instead, each of which differs
# between the two orders even when the total does not, and say so in `math`.
#
# Frequency is asserted across periods, never within one invoice: `once` rows run two billing
# periods (discounted, then not), `recurring` rows run three with frequency_duration 2 (discounted,
# discounted, then not) and `forever` rows run three, all discounted. Two periods cannot separate
# `recurring` from `forever`, which is why the third exists.
#
# TWO RUNGS ARE UNREACHABLE THROUGH THIS HARNESS, so the block tops out at 36 of 48 cells:
#   * rung 2, `fee.add_on.taxes` (:67) — only Fees::OneOffService creates an add_on fee
#     (fees/one_off_service.rb:40), and that runs from POST /invoices, for which the interpreter has
#     no timeline verb (schema.json step `do` enum). ScenariosHelper#create_one_off_invoice
#     (spec/support/scenarios_helper.rb:240) already exists; a `create_one_off_invoice` verb would
#     unblock the 6 add-on cells.
#   * rung 1, explicit `tax_codes` (:66) — fees/one_off_service.rb:60 is the ONLY call site in the
#     app that passes `tax_codes:` to Fees::ApplyTaxesService, so it needs the same verb; 6 cells.
#     Note that Invoices::CreateOneOffService never calls Credits::AppliedCouponsService, so even
#     with the verb a coupon does not participate in a one-off invoice — those 12 cells may turn out
#     to be inexpressible rather than merely unimplemented.
---
- id: b10/fixed_amount/once/charge
  block: B10
  axes: {coupon_type: fixed_amount, coupon_frequency: once, tax_level: charge}
  dimensions: {interval: monthly, billing_time: calendar}
  provenance: coverage-gap
  runners: [rspec, live]
  setup:
    taxes:
      - {code: b10_entity_tax, name: entity default, rate: 5, applied_to_organization: true}
      - {code: b10_customer_tax, name: customer, rate: 10, applied_to_organization: false}
      - {code: b10_plan_tax, name: plan, rate: 15, applied_to_organization: false}
      - {code: b10_charge_tax, name: charge, rate: 25, applied_to_organization: false}
    metrics:
      - {code: b10_taxed, aggregation_type: sum_agg, field_name: amount}
      - {code: b10_untaxed, aggregation_type: sum_agg, field_name: amount}
    plan:
      code: golden_b10_ladder
      interval: monthly
      amount_cents: 1000
      tax_codes: [b10_plan_tax]
    charges:
      - billable_metric_code: b10_taxed
        charge_model: standard
        properties: {amount: "1"}
        tax_codes: [b10_charge_tax]
      - {billable_metric_code: b10_untaxed, charge_model: standard, properties: {amount: "1"}}
    customer:
      external_id: golden_b10_ladder_cust
      currency: EUR
      tax_codes: [b10_customer_tax]
    subscription: {external_id: golden_b10_ladder_sub, billing_time: calendar}
    coupons:
      - name: b10 ladder coupon
        code: b10_ladder_coupon
        coupon_type: fixed_amount
        frequency: once
        amount_cents: 1600
        amount_currency: EUR
        expiration: no_expiration
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b10_taxed, properties: {amount: 100}}
        - {code: b10_untaxed, properties: {amount: 50}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_amount_cents: 16000
      coupons_amount_cents: 1600
      sub_total_excluding_taxes_amount_cents: 14400
      taxes_amount_cents: 3060
      total_amount_cents: 17460
      fees_count: 3
      fees:
        - {fee_type: subscription, amount_cents: 1000, taxes_amount_cents: 135}
        - {fee_type: charge, item_code: b10_taxed, amount_cents: 10000, taxes_amount_cents: 2250}
        - {fee_type: charge, item_code: b10_untaxed, amount_cents: 5000, taxes_amount_cents: 675}
  math: >-
    Four tax rates are configured at four levels of the ladder and three fees resolve to three
    different rungs on one invoice, which is what makes this a test of precedence rather than of
    whether a tax can be attached at all.
    `b10_taxed` carries its own 25% and takes rung 3, shadowing the plan, the customer and the entity
    default. The subscription fee and `b10_untaxed` have no charge-level tax so they fall to the
    plan's 15% (rung 6), which in turn shadows the customer's 10% and the entity's 5%. Neither of the
    lower two rates appears anywhere on the invoice — that absence IS the assertion, and it is
    checked per fee because the invoice total cannot distinguish 15% here and 10% there from a
    uniform blend.
    The coupon then makes the rates matter to each other. Fees are 1_000 + 10_000 + 5_000 = 16_000¢
    and the 1_600¢ coupon is spread across them in proportion — 100¢, 1_000¢, 500¢ — before any tax
    is computed, so each fee is taxed on what remains at ITS own rate:
    900 × 15% = 135¢, 9_000 × 25% = 2_250¢, 4_500 × 15% = 675¢ → 3_060¢.
    A flat 15% on the discounted 14_400¢ would give 2_160¢ and a flat 25% would give 3_600¢; both are
    wrong, and only the per-fee figures say which rung each fee actually used.

- id: b10/percentage/recurring/customer
  block: B10
  axes: {coupon_type: percentage, coupon_frequency: recurring, tax_level: customer}
  dimensions: {interval: monthly, billing_time: calendar}
  provenance: coverage-gap
  runners: [rspec, live]
  setup:
    taxes:
      - {code: b10_pc_entity, name: entity default, rate: 5, applied_to_organization: true}
      - {code: b10_pc_customer, name: customer, rate: 10, applied_to_organization: false}
    metrics: [{code: b10_pc_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b10_pc, interval: monthly, amount_cents: 1000}
    charges: [{billable_metric_code: b10_pc_sum, charge_model: standard, properties: {amount: "1"}}]
    customer:
      external_id: golden_b10_pc_cust
      currency: EUR
      tax_codes: [b10_pc_customer]
    subscription: {external_id: golden_b10_pc_sub, billing_time: calendar}
    coupons:
      - name: b10 percentage coupon
        code: b10_pc_coupon
        coupon_type: percentage
        frequency: recurring
        frequency_duration: 3
        percentage_rate: 10
        expiration: no_expiration
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b10_pc_sum, properties: {amount: 100}}]
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_amount_cents: 11000
      coupons_amount_cents: 1100
      sub_total_excluding_taxes_amount_cents: 9900
      taxes_amount_cents: 990
      total_amount_cents: 10890
      fees_count: 2
      fees:
        - {fee_type: subscription, amount_cents: 1000, taxes_amount_cents: 90}
        - {fee_type: charge, amount_cents: 10000, taxes_amount_cents: 900}
  math: >-
    The bottom two rungs of the ladder, which b10/fixed_amount/once/charge could not reach because
    anything configured above them shadows them.
    Nothing here carries a charge- or plan-level tax, so every fee falls to the customer's 10% (rung
    7) and the organization's 5% default (rung 8) never applies. Both fees are asserted individually:
    an invoice-level 990¢ on a 9_900¢ base is also what a uniform 10% looks like, and the point is
    that the 5% is absent rather than blended in.
    The coupon is a percentage rather than a fixed amount, which changes the arithmetic rather than
    just the number: 10% of the 11_000¢ of fees = 1_100¢, and because it is proportional by
    definition it lands on each fee in the same ratio a fixed coupon would have to be spread into —
    100¢ and 1_000¢. Each fee is then taxed on what remains, 900 and 9_000 at 10% → 90¢ and 900¢.
    A percentage coupon commutes with a single tax rate, so this row deliberately does NOT claim to
    prove the coupon runs before tax — b15/coupon/tax does that with a fixed coupon, where the two
    orders differ. What this row proves is which rate was chosen.

- id: b10/fixed_amount/once/billing-entity
  block: B10
  axes: {coupon_type: fixed_amount, coupon_frequency: once, tax_level: billing-entity}
  dimensions: {interval: monthly, billing_time: calendar, periods: 2, winning_rung: 8}
  provenance: coverage-gap
  runners: [rspec, live]
  setup:
    taxes:
      - {code: b10_be_entity, name: entity default, rate: 20, applied_to_organization: true}
      - {code: b10_be_charge, name: charge, rate: 25, applied_to_organization: false}
    metrics: [{code: b10_be_sum, aggregation_type: sum_agg, field_name: amount}]
    plan:
      code: golden_b10_fa_once_be
      interval: monthly
      amount_cents: 2000
    charges:
      - billable_metric_code: b10_be_sum
        charge_model: standard
        properties: {amount: "1"}
        tax_codes: [b10_be_charge]
    customer:
      external_id: golden_b10_fa_once_be_cust
      currency: EUR
    subscription: {external_id: golden_b10_fa_once_be_sub, billing_time: calendar}
    coupons:
      - name: b10 fa_once_be coupon
        code: b10_fa_once_be_coupon
        coupon_type: fixed_amount
        frequency: once
        amount_cents: 4000
        amount_currency: EUR
        expiration: no_expiration
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b10_be_sum, properties: {amount: 80}}]
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - at: "2024-04-05T10:00:00Z"
      do: ingest_events
      events: [{code: b10_be_sum, properties: {amount: 80}}]
    - {at: "2024-05-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {index: 0}
        fees_amount_cents: 10000
        coupons_amount_cents: 4000
        sub_total_excluding_taxes_amount_cents: 6000
        taxes_amount_cents: 1440
        total_amount_cents: 7440
        fees_count: 2
        fees:
          - {fee_type: subscription, amount_cents: 2000, taxes_amount_cents: 240}
          - {fee_type: charge, amount_cents: 8000, taxes_amount_cents: 1200}
      - select: {index: 1}
        fees_amount_cents: 10000
        coupons_amount_cents: 0
        sub_total_excluding_taxes_amount_cents: 10000
        taxes_amount_cents: 2400
        total_amount_cents: 12400
        fees_count: 2
        fees:
          - {fee_type: subscription, amount_cents: 2000, taxes_amount_cents: 400}
          - {fee_type: charge, amount_cents: 8000, taxes_amount_cents: 2000}
  math: >-
    The billing entity default is the LAST rung (apply_taxes_service.rb:77) — nothing can shadow it, so
    the only way to prove it is a rung rather than a global setting is to put a fee beside it that
    resolves higher. `b10_be_charge` carries 25% on the charge and takes rung 3 (:68); the subscription
    fee has no charge, no plan tax and no customer tax, so it falls all the way through :68-:74 and picks
    up the entity's 20%. Two different rates on one invoice is the assertion: a uniform 20% would mean
    rung 3 never fired, and a uniform 25% would mean the entity default is not a fallback at all. Which
    level won: billing-entity (rung 8, apply_taxes_service.rb:77). Overridden: rung 3 (the charge's own
    25%) shadows the entity default for the charge fee; the entity default is itself the bottom of the
    ladder and shadows nothing. Had the shadowed rung won instead, the entity default's 20% applied to the
    charge fee as well would have made the discounted invoice total 7_200¢ rather than 7_440¢. Order of
    the reducers. calculate_fees_service.rb:54 applies the coupon and :56 computes the taxes, in that
    order, so the coupon lands on the raw fees and the tax lands on what is left. 10_000¢ of fees, a
    4_000¢ fixed coupon, taxable base 6_000¢, taxes 1_440¢, total 7_440¢. Reverse the two lines and the
    tax is computed on the undiscounted 10_000¢ (2_400¢ instead of 1_440¢) and the invoice totals 8_400¢.
    A fixed coupon does not commute with a tax, so those two totals differ and the row can name which
    order produced its number. Per-fee arithmetic, and it is per-fee because the rates differ (or, where
    they do not, because the invoice total would hide a wrong rung behind a blend).
    applied_coupon_service.rb:37 with fee.rb:235 spreads the credit pro rata on amount_cents: 800¢ on the
    subscription fee + 3_200¢ on the charge fee. Each fee is then taxed at ITS own rate on what remains
    (apply_taxes_service.rb:37): 1_200 × 20% = 240¢; 4_800 × 25% = 1_200¢ — 1_440¢ in total.
    fees_amount_cents is 10_000¢ under either order and is therefore not load-bearing here. `once` is
    asserted across TWO periods, not one, because a single invoice cannot tell the three frequencies
    apart. On the first invoice the credit equals the whole applied amount, so
    applied_coupon_service.rb:82 sees `credit_amount >= remaining_amount` and terminates the applied
    coupon; the second period's invoice therefore carries coupons_amount_cents: 0 and the undiscounted
    tax. Had the coupon been `forever` the second invoice would repeat the first. The undiscounted invoice
    in this row is 10_000¢ of fees, 2_400¢ of tax, 12_400¢ total.

