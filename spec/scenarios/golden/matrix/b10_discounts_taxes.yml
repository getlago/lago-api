    coupon, taxable base 6_000¢, taxes 1_200¢, total 7_200¢. Reverse the two lines and the tax is computed
    on the undiscounted 10_000¢ (2_000¢ instead of 1_200¢) and the invoice totals 8_000¢. A fixed coupon
    does not commute with a tax, so those two totals differ and the row can name which order produced its
    number. Per-fee arithmetic, and it is per-fee because the rates differ (or, where they do not, because
    the invoice total would hide a wrong rung behind a blend). applied_coupon_service.rb:37 with
