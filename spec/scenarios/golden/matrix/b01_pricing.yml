    invoices: 1
    invoice:
      invoice_type: subscription
      status: finalized
      fees_amount_cents: 1000
      taxes_amount_cents: 0
      total_amount_cents: 1000
      fees_count: 1
      fees:
        - {fee_type: subscription, amount_cents: 1000}
  math: >-
    NO events at all. count_agg counts events and never reads a field, so the period aggregates to 0
    units. charge_models/package_service.rb:7-14 — paid_units = units − free_units (:56-58),
    package_count = paid_units.fdiv(package_size).ceil (:12), amount = package_count × amount (:13):
