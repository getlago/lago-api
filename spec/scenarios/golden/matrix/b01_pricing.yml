        charge_model: percentage
        properties: {rate: "10", fixed_amount: "0.5"}
    customer: {external_id: golden_b01_pct_ucnt_cu_many_cust, currency: EUR}
    subscription: {external_id: golden_b01_pct_ucnt_cu_many_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b01_pct_ucnt_cu_many, properties: {uid: "u1"}, timestamp: "2024-03-05T10:00:00Z"}
        - {code: b01_pct_ucnt_cu_many, properties: {uid: "u2"}, timestamp: "2024-03-05T11:00:00Z"}
        - {code: b01_pct_ucnt_cu_many, properties: {uid: "u2"}, timestamp: "2024-03-05T12:00:00Z"}
        - {code: b01_pct_ucnt_cu_many, properties: {uid: "u3"}, timestamp: "2024-03-05T13:00:00Z"}
        - {code: b01_pct_ucnt_cu_many, properties: {uid: "u4"}, timestamp: "2024-03-05T14:00:00Z"}
    - {at: "2024-03-20T10:00:00Z", do: fetch_current_usage}
  expect:
    usage:
      amount_cents: 240
      taxes_amount_cents: 0
      total_amount_cents: 240
      charges_usage:
        - {billable_metric_code: b01_pct_ucnt_cu_many, units: "4.0", amount_cents: 240}
  math: >-
    CORRECTED: an earlier derivation assumed `result.count` was the EVENT count (5) while
    `aggregation` was the distinct count (4), giving 290. It is not — `unique_count_service.rb:32`
    sets `result.count = result.aggregation`, so both are 4 and the per-event `fixed_amount`
    is charged 4 times, not 5: 240. The 290 reading is what a separate event counter would give,
    and `percentage_service.rb` has none.
    Five events carrying uids u1, u2, u2, u3, u4. unique_count_agg counts DISTINCT values of
    field_name, so the period aggregates to 4 units. charge_models/percentage_service.rb:7-13 —
    compute_percentage_amount (:54-58) + compute_fixed_amount (:60-66). free_units_value is 0
    (:70-79), so the percentage leg is (4 − 0) × 10 / 100 = 0.40; free_units_count is 0 (:81-86)
    against 5 event(s), so the fixed leg is (5 − 0) × 0.50 = 2.50. Total 2.90 → 240¢. Percentage set
    A carries no free-unit allowance at all: on the `one` cell the aggregation is 1 unit, and ANY
    allowance of 1 or more makes free_units_value return last_running_total (:75) and zeroes the
    cell outright, so the free-unit axes are crossed on the large-unit aggregations instead. Wrong
    implementation this row catches: charging fixed_amount ONCE for the period instead of once per
    paid event gives 90¢ — compute_fixed_amount multiplies by aggregation_result.count (:65), not by
    1. usage.amount_cents is fees_amount_cents — charges only, never the subscription fee
    (invoices/customer_usage_service.rb:255-266), which is why the plan amount does not appear here.
    The paired invoice cell for the same aggregation and event set must report the same 240¢ charge
    fee: two different computations of one number, not two numbers. Current usage is not projected
    here (calculate_projected_usage defaults to false, customer_usage_service.rb:14), so
    compute_amount is the number, not compute_projected_amount. The duplicate u2 is the assertion: 4
    DISTINCT uids over 5 events. counting all five events would report 5 units (300¢) instead.

- id: b01/percentage/weighted_sum_agg/current_usage/many
  block: B1
  axes: {charge_model: percentage, aggregation: weighted_sum_agg, observed_via: current-usage, events: many}
  dimensions: {recurring: true, pay_in_advance: false, prorated: false, interval: monthly, billing_time: calendar}
  provenance: coverage-gap
  runners: [rspec]
  calendar_sensitive: true
  setup:
    metrics: [{code: b01_pct_wsum_cu_many, aggregation_type: weighted_sum_agg, field_name: value, recurring: true, weighted_interval: seconds}]
    plan: {code: golden_b01_pct_wsum_cu_many, interval: monthly, amount_cents: 0}
    charges:
