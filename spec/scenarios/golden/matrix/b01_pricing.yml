  note: >-
    NO events, read through the usage surface on 20 March while the period is still open. count_agg
    counts events and there are none, so 0 units and 0¢. The two surfaces disagree on PRESENCE, not
    on value. Fees::ChargeService returns before the reject! that drops zero fees
    (fees/charge_service.rb:63-68 — `return result if current_usage` precedes it), and the empty
    default bucket makes init_charge_fees hydrate a zero-units fee in memory instead
    (charge_service.rb:112-123 with 185-197). So current usage REPORTS the charge at units 0.0 / 0¢
    while the paired invoice cell omits the fee entirely (fees_count 1). Both surfaces agree the
    amount is 0¢; only the fee's existence differs. usage.amount_cents is fees_amount_cents —
    charges only, never the subscription fee (invoices/customer_usage_service.rb:257-266).

