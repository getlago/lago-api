# B1 — Pricing grid: charge_model × aggregation × observed_via
#
# The invoice side of this grid is the largest measured hole in spec/scenarios: `volume` and
# `custom` charge models and `max_agg` / `weighted_sum_agg` / `custom_agg` are exercised only
# through current_usage, which is a different code path (Invoices::CustomerUsageService) from the
# one that prices an actual fee (Fees::ChargeService → Invoices::CalculateFeesService).
#
# These rows form a SPANNING CROSS through the 42-cell invoice grid rather than filling it: one arm
# holds the charge model at `standard` and varies all 7 aggregations, the other holds the aggregation
# at `sum_agg` and varies all 8 charge models. That touches every axis value at least once — closing
# the zero-coverage cells — before spending rows on the interior of the grid, where the marginal
# information per row is much lower.
#
# Shared conventions, so the `math` lines are comparable across rows:
#   * monthly / calendar, pay in arrears, no taxes, no coupons
#   * plan amount_cents 0, so the subscription fee is 0 and the charge fee is the whole invoice
#   * three events on 2024-03-05 carrying amount 10 / 20 / 30 → 60 units under sum_agg
#   * billed at 2024-04-01, one full period behind
#
# The volume row below predates that convention: it uses plan amount 1_000 and a 15-unit event set.
# Left as it is deliberately — it passes, its arithmetic is sound, and rewriting a green row to match
# a formatting convention is churn, not coverage.
---
- id: b01/volume/sum_agg/arrears/invoice
  block: B1
  axes:
    charge_model: volume
    aggregation: sum_agg
    observed_via: invoice
    events: many
  dimensions:
    recurring: false
    pay_in_advance: false
    prorated: false
    interval: monthly
    billing_time: calendar
  provenance: coverage-gap
  runners: [rspec, live]
  setup:
    metrics:
      - code: b01_vol_sum
        aggregation_type: sum_agg
        field_name: amount
        recurring: false
    plan:
      code: golden_b01_volume
      interval: monthly
      amount_cents: 1000
      pay_in_advance: false
    charges:
      - billable_metric_code: b01_vol_sum
        charge_model: volume
        properties:
          volume_ranges:
            - {from_value: 0, to_value: 10, per_unit_amount: "10", flat_amount: "0"}
            - {from_value: 11, to_value: null, per_unit_amount: "20", flat_amount: "0"}
    customer:
      external_id: golden_b01_volume_cust
      currency: EUR
    subscription:
      external_id: golden_b01_volume_sub
      billing_time: calendar
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b01_vol_sum, properties: {amount: 15}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      status: finalized
      currency: EUR
      fees_amount_cents: 31000
      coupons_amount_cents: 0
      taxes_amount_cents: 0
      total_amount_cents: 31000
      fees_count: 2
      fees:
        - fee_type: subscription
          amount_cents: 1000
          from_date: "2024-03-01T00:00:00Z"
          to_date: "2024-03-31T23:59:59Z"
        - fee_type: charge
          units: "15.0"
          amount_cents: 30000
          from_date: "2024-03-01T00:00:00Z"
          to_date: "2024-03-31T23:59:59Z"
  math: >-
    Subscription fee: a whole calendar month, unprorated → 1_000¢.
    Volume prices ALL units at the single tier they land in — unlike graduated, which prices each
    tier separately (ChargeModels::VolumeService#compute_amount = units × matching_range.per_unit
    + matching_range.flat). 15 units → tier 2 (from 11, per_unit 20, flat 0) → 15 × 20 = 300 →
    30_000¢. If this were graduated it would be 10 × 10 + 5 × 20 = 200; that difference is the
    point of the row. Total 1_000 + 30_000 = 31_000¢, no tax configured.

# ================================================================ arm A: standard × every aggregation

- id: b01/standard/count_agg/arrears/invoice
  block: B1
  axes: {charge_model: standard, aggregation: count_agg, observed_via: invoice, events: many}
  dimensions: {recurring: false, pay_in_advance: false, prorated: false, interval: monthly, billing_time: calendar}
  provenance: coverage-gap
  runners: [rspec, live]
  setup:
    metrics: [{code: b01_count, aggregation_type: count_agg}]
    plan: {code: golden_b01_std_count, interval: monthly, amount_cents: 0}
    charges: [{billable_metric_code: b01_count, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b01_std_count_cust, currency: EUR}
    subscription: {external_id: golden_b01_std_count_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b01_count, properties: {amount: 10}}
        - {code: b01_count, properties: {amount: 20}}
        - {code: b01_count, properties: {amount: 30}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      status: finalized
      fees_amount_cents: 300
      taxes_amount_cents: 0
      total_amount_cents: 300
      fees_count: 2
      fees:
        - {fee_type: subscription, amount_cents: 0}
        - {fee_type: charge, units: "3.0", amount_cents: 300}
  math: >-
    count_agg counts events and ignores their values: 3 events → 3 units. Standard prices each unit
    at amount 1.00 → 3 × 1.00 = 3.00 → 300¢. Plan amount is 0, so the subscription fee is 0¢ and the
    charge fee is the whole invoice.

- id: b01/standard/sum_agg/arrears/invoice
  block: B1
  axes: {charge_model: standard, aggregation: sum_agg, observed_via: invoice, events: many}
  dimensions: {recurring: false, pay_in_advance: false, prorated: false, interval: monthly, billing_time: calendar}
  provenance: coverage-gap
  runners: [rspec, live]
  setup:
    metrics: [{code: b01_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b01_std_sum, interval: monthly, amount_cents: 0}
    charges: [{billable_metric_code: b01_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b01_std_sum_cust, currency: EUR}
    subscription: {external_id: golden_b01_std_sum_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b01_sum, properties: {amount: 10}}
        - {code: b01_sum, properties: {amount: 20}}
        - {code: b01_sum, properties: {amount: 30}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_amount_cents: 6000
      total_amount_cents: 6000
      fees_count: 2
      fees:
        - {fee_type: subscription, amount_cents: 0}
        - {fee_type: charge, units: "60.0", amount_cents: 6000}
  math: >-
    sum_agg adds the field across events: 10 + 20 + 30 = 60 units. Standard at 1.00 per unit →
    60.00 → 6_000¢. This is the reference cell the other rows are compared against.

- id: b01/standard/max_agg/arrears/invoice
  block: B1
  axes: {charge_model: standard, aggregation: max_agg, observed_via: invoice, events: many}
  dimensions: {recurring: false, pay_in_advance: false, prorated: false, interval: monthly, billing_time: calendar}
  provenance: coverage-gap
  runners: [rspec, live]
  setup:
    metrics: [{code: b01_max, aggregation_type: max_agg, field_name: amount}]
    plan: {code: golden_b01_std_max, interval: monthly, amount_cents: 0}
    charges: [{billable_metric_code: b01_max, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b01_std_max_cust, currency: EUR}
    subscription: {external_id: golden_b01_std_max_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b01_max, properties: {amount: 10}}
        - {code: b01_max, properties: {amount: 20}}
        - {code: b01_max, properties: {amount: 30}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_amount_cents: 3000
      total_amount_cents: 3000
      fees_count: 2
      fees:
        - {fee_type: subscription, amount_cents: 0}
        - {fee_type: charge, units: "30.0", amount_cents: 3000}
  math: >-
    max_agg takes the largest field value in the period, not the sum: max(10, 20, 30) = 30 units →
    30 × 1.00 = 30.00 → 3_000¢. Before this row, max_agg had zero invoice coverage anywhere in the
    suite — only current_usage.

- id: b01/standard/latest_agg/arrears/invoice
  block: B1
  axes: {charge_model: standard, aggregation: latest_agg, observed_via: invoice, events: many}
  dimensions: {recurring: false, pay_in_advance: false, prorated: false, interval: monthly, billing_time: calendar}
  provenance: coverage-gap
  runners: [rspec, live]
  setup:
    metrics: [{code: b01_latest, aggregation_type: latest_agg, field_name: amount}]
    plan: {code: golden_b01_std_latest, interval: monthly, amount_cents: 0}
    charges: [{billable_metric_code: b01_latest, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b01_std_latest_cust, currency: EUR}
    subscription: {external_id: golden_b01_std_latest_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b01_latest, properties: {amount: 10}, timestamp: "2024-03-05T10:00:00Z"}
        - {code: b01_latest, properties: {amount: 30}, timestamp: "2024-03-05T11:00:00Z"}
        - {code: b01_latest, properties: {amount: 20}, timestamp: "2024-03-05T12:00:00Z"}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_amount_cents: 2000
      total_amount_cents: 2000
      fees_count: 2
      fees:
        - {fee_type: subscription, amount_cents: 0}
        - {fee_type: charge, units: "20.0", amount_cents: 2000}
  math: >-
    latest_agg takes the value of the last event by timestamp, which is deliberately NOT the largest
    here: the values arrive 10, 30, 20, so latest = 20 units → 20 × 1.00 = 20.00 → 2_000¢. If this
    row ever reports 3_000¢ it has silently become max_agg.

- id: b01/standard/unique_count_agg/arrears/invoice
  block: B1
  axes: {charge_model: standard, aggregation: unique_count_agg, observed_via: invoice, events: many}
  dimensions: {recurring: false, pay_in_advance: false, prorated: false, interval: monthly, billing_time: calendar}
  provenance: coverage-gap
  runners: [rspec, live]
  setup:
    metrics: [{code: b01_uniq, aggregation_type: unique_count_agg, field_name: uid}]
    plan: {code: golden_b01_std_uniq, interval: monthly, amount_cents: 0}
    charges: [{billable_metric_code: b01_uniq, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b01_std_uniq_cust, currency: EUR}
    subscription: {external_id: golden_b01_std_uniq_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b01_uniq, properties: {uid: "u1"}}
        - {code: b01_uniq, properties: {uid: "u2"}}
        - {code: b01_uniq, properties: {uid: "u2"}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_amount_cents: 200
      total_amount_cents: 200
      fees_count: 2
      fees:
        - {fee_type: subscription, amount_cents: 0}
        - {fee_type: charge, units: "2.0", amount_cents: 200}
  math: >-
    unique_count_agg counts distinct values of field_name, so the repeated "u2" is not counted twice:
    {u1, u2} = 2 units → 2 × 1.00 = 2.00 → 200¢. The duplicate is the point of the row; three events
    yielding 3 units would mean deduplication had stopped working.

- id: b01/standard/weighted_sum_agg/arrears/invoice
  block: B1
  axes: {charge_model: standard, aggregation: weighted_sum_agg, observed_via: invoice, events: one}
  dimensions: {recurring: true, pay_in_advance: false, prorated: false, interval: monthly, billing_time: calendar}
  provenance: coverage-gap
  runners: [rspec]
  calendar_sensitive: true
  setup:
    metrics:
      - {code: b01_ws, aggregation_type: weighted_sum_agg, field_name: value, recurring: true, weighted_interval: seconds}
    plan: {code: golden_b01_std_ws, interval: monthly, amount_cents: 0}
    charges: [{billable_metric_code: b01_ws, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b01_std_ws_cust, currency: EUR}
    subscription: {external_id: golden_b01_std_ws_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-16T00:00:00Z"
      do: ingest_events
      events:
        - {code: b01_ws, properties: {value: 62}, timestamp: "2024-03-16T00:00:00Z"}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_amount_cents: 3200
      total_amount_cents: 3200
      fees_count: 2
      fees:
        - {fee_type: subscription, amount_cents: 0}
        - {fee_type: charge, units: "32.0", amount_cents: 3200}
  math: >-
    weighted_sum_agg time-weights each value by how long it was held: units = value ×
    held_duration / period_duration. A value of 62 arriving on 16 March is held for the remaining
    16 days of a 31-day March → 62 × 16/31 = 32 units → 3_200¢.
    The value and date are chosen so the fraction lands on a whole number AND so the row is
    DISCRIMINATING: sum_agg, max_agg and latest_agg would all report 62 units here. An earlier
    version of this row put its single event at the exact period start, making the weighting 1 and
    the answer 60 — identical to what three other aggregations would produce, so it asserted a
    number without testing the time-weighting it claimed to cover.
    calendar_sensitive because the weighting divides by the length of this specific month.

- id: b01/graduated/sum_agg/arrears/invoice
  block: B1
  axes: {charge_model: graduated, aggregation: sum_agg, observed_via: invoice, events: many}
  dimensions: {recurring: false, pay_in_advance: false, prorated: false, interval: monthly, billing_time: calendar}
  provenance: coverage-gap
  runners: [rspec, live]
  setup:
    metrics: [{code: b01_grad_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b01_grad, interval: monthly, amount_cents: 0}
    charges:
      - billable_metric_code: b01_grad_sum
        charge_model: graduated
        properties:
          graduated_ranges:
            - {from_value: 0, to_value: 10, per_unit_amount: "2", flat_amount: "100"}
            - {from_value: 11, to_value: null, per_unit_amount: "1", flat_amount: "50"}
    customer: {external_id: golden_b01_grad_cust, currency: EUR}
    subscription: {external_id: golden_b01_grad_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b01_grad_sum, properties: {amount: 10}}
        - {code: b01_grad_sum, properties: {amount: 20}}
        - {code: b01_grad_sum, properties: {amount: 30}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_amount_cents: 22000
      total_amount_cents: 22000
      fees_count: 2
      fees:
        - {fee_type: subscription, amount_cents: 0}
        - {fee_type: charge, units: "60.0", amount_cents: 22000}
  math: >-
    Graduated prices each tier separately and adds them. 60 units: tier 1 covers units 1–10 →
    flat 100 + 10 × 2 = 120; tier 2 covers units 11–60, i.e. 50 units → flat 50 + 50 × 1 = 100.
    Total 220.00 → 22_000¢. Volume with the same tiers would instead charge all 60 units at the one
    tier they land in — that difference is what the graduated and volume rows jointly protect.

- id: b01/package/sum_agg/arrears/invoice
  block: B1
  axes: {charge_model: package, aggregation: sum_agg, observed_via: invoice, events: many}
