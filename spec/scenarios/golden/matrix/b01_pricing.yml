    NO events at all. count_agg counts events and never reads a field, so the period aggregates to 0
    units. charge_models/percentage_service.rb:7-13 — compute_percentage_amount (:54-58) +
    compute_fixed_amount (:60-66). At 0 units compute_percentage_amount is (0 − 0) × 10 / 100 = 0
