        properties:
          graduated_ranges:
            - {from_value: 0, to_value: 2, per_unit_amount: "2", flat_amount: "100"}
            - {from_value: 3, to_value: 25, per_unit_amount: "1", flat_amount: "50"}
            - {from_value: 26, to_value: null, per_unit_amount: "0.5", flat_amount: "20"}
    customer: {external_id: golden_b01_grd_cnt_inv_none_cust, currency: EUR}
    subscription: {external_id: golden_b01_grd_cnt_inv_none_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      status: finalized
      fees_amount_cents: 10000
      taxes_amount_cents: 0
      total_amount_cents: 10000
      fees_count: 2
      fees:
        - {fee_type: subscription, amount_cents: 0}
        - {fee_type: charge, units: "0.0", amount_cents: 10000}
  math: >-
    No events at all. count_agg counts events and never reads a field, so the period aggregates to 0
    units. Banded pricing then walks the tiers and ADDS them
    (charge_models/graduated_service.rb:28-34 walking amount_details (:11-18) with per-range widths
    from range_graduated_service.rb:54-65): t1 (0–2) prices 0 units → flat 100.00 + 0 × 2.00 =
    100.00. Total 100.00 → 10_000¢. Tier set B puts the first boundary at 2 units on purpose: with
    the file's 10/30/20 event set, count_agg yields 3 and unique_count_agg 4, and against the 0–10
    tier of set A those would never leave tier 1 — a graduated row whose units all sit in one tier
    tests nothing graduated. Wrong implementations this row catches: summing the flat_amounts of the
    2 tiers never reached gives 17_000¢. The fee is non-zero, so should_persist_fee?
    (fees/charge_service.rb:353-360) keeps it on the first clause and the invoice carries fees_count
    2. Plan amount 0¢ → total 10_000¢, no tax configured. This is the ING-13 shape: zero usage still
    bills tier 1's flat_amount, and unlike the `standard` cells of this block the fee therefore
    SURVIVES the drop. Its current_usage twin reports the identical amount, so that pair AGREES on
    both value and presence — the opposite of the standard/none pair. Every aggregation reports 0
    units on an empty period, so this cell cannot separate them — it is here for the charge model's
    behaviour at zero usage, not for the aggregation.

