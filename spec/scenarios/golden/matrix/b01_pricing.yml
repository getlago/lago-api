  runners: [rspec, live]
  setup:
    metrics: [{code: b01_pkg_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b01_pkg, interval: monthly, amount_cents: 0}
    charges:
      - billable_metric_code: b01_pkg_sum
        charge_model: package
        properties: {amount: "10", free_units: 0, package_size: 25}
    customer: {external_id: golden_b01_pkg_cust, currency: EUR}
    subscription: {external_id: golden_b01_pkg_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b01_pkg_sum, properties: {amount: 10}}
        - {code: b01_pkg_sum, properties: {amount: 20}}
        - {code: b01_pkg_sum, properties: {amount: 30}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_amount_cents: 3000
      total_amount_cents: 3000
      fees_count: 2
      fees:
        - {fee_type: subscription, amount_cents: 0}
        - {fee_type: charge, units: "60.0", amount_cents: 3000}
  math: >-
    Package charges per whole package started, so it rounds UP. 60 units at package_size 25 →
    ceil(60 / 25) = 3 packages × 10.00 = 30.00 → 3_000¢. package_size 25 is chosen so 60 is not a
    multiple of it: a row where units divide evenly could not tell rounding up from rounding down.

- id: b01/percentage/sum_agg/arrears/invoice
  block: B1
  axes: {charge_model: percentage, aggregation: sum_agg, observed_via: invoice, events: many}
