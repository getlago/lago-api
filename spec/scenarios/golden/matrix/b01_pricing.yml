    this row. Its current-usage twin REPORTS the charge at units 0.0 / 0¢, so that pair legitimately
    DISAGREES on the fee's existence while agreeing on 0¢. Every aggregation reports 0 units on an
    empty period, so this cell cannot separate them — it is here for the charge model's behaviour at
    zero usage, not for the aggregation.

