    customer: {external_id: golden_b01_pct_wsum_cu_many_cust, currency: EUR}
    subscription: {external_id: golden_b01_pct_wsum_cu_many_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-06T00:00:00Z"
