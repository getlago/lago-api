    days that have not happened yet at the moment of the 20 March read. The invoice cell for the
    same aggregation and event set therefore reports the SAME amount — two computations of one
    number. charge_models/percentage_service.rb:7-13 — compute_percentage_amount (:54-58) +
    compute_fixed_amount (:60-66). free_units_value is 0 (:70-79), so the percentage leg is (32 − 0)
