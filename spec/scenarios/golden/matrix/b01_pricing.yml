- id: b01/standard/weighted_sum_agg/invoice/many
  block: B1
  axes: {charge_model: standard, aggregation: weighted_sum_agg, observed_via: invoice, events: many}
  dimensions: {recurring: true, pay_in_advance: false, prorated: false, interval: monthly, billing_time: calendar}
  provenance: coverage-gap
  runners: [rspec]
  calendar_sensitive: true
  setup:
    metrics: [{code: b01_std_wsum_inv_many, aggregation_type: weighted_sum_agg, field_name: value, recurring: true, weighted_interval: seconds}]
    plan: {code: golden_b01_std_wsum_inv_many, interval: monthly, amount_cents: 0}
    charges: [{billable_metric_code: b01_std_wsum_inv_many, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b01_std_wsum_inv_many_cust, currency: EUR}
    subscription: {external_id: golden_b01_std_wsum_inv_many_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-06T00:00:00Z"
      do: ingest_events
      events:
        - {code: b01_std_wsum_inv_many, properties: {value: 10}, timestamp: "2024-03-06T00:00:00Z"}
    - at: "2024-03-10T00:00:00Z"
      do: ingest_events
      events:
        - {code: b01_std_wsum_inv_many, properties: {value: 30}, timestamp: "2024-03-10T00:00:00Z"}
    - at: "2024-03-16T00:00:00Z"
      do: ingest_events
      events:
        - {code: b01_std_wsum_inv_many, properties: {value: 20}, timestamp: "2024-03-16T00:00:00Z"}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      status: finalized
      fees_amount_cents: 4000
      taxes_amount_cents: 0
      total_amount_cents: 4000
      fees_count: 2
      fees:
        - {fee_type: subscription, amount_cents: 0}
        - {fee_type: charge, units: "40.0", amount_cents: 4000}
  math: >-
    Three events, and the FIRST weighted_sum cell in the suite with more than one. weighted_sum
    treats each event value as a DELTA and time-weights the running total: units =
    Σ(cumulative_value × seconds_until_next_event) / charges_duration_in_seconds
    (events/stores/postgres/weighted_sum_query.rb:99-116; the denominator is
    charges_duration.days.to_i = 31 days). Boundaries for the March period are charges_from
    2024-03-01T00:00:00Z and charges_to 2024-03-31T23:59:59.999999Z, and the query raises the upper
    bound with to_datetime.ceil (postgres_store.rb:358), i.e. 2024-04-01T00:00:00Z. Segments:
    03-01→03-06 at cumulative 0 contributes nothing; 03-06→03-10 is 4 days at 10 → 40 day-units;
    03-10→03-16 is 6 days at 40 → 240; 03-16→04-01 is 16 days at 60 → 960. Total 1_240 / 31 = 40.0
    units exactly → 40 × 1.00 = 4_000¢. The dates and values are picked so all four candidate
    answers are DISTINCT: sum_agg would give 60 units (6_000¢), max_agg 30 (3_000¢), latest_agg 20
    (2_000¢), weighted_sum 40 (4_000¢). No other B1 row pins the deltas-and-duration shape —
    b01/standard/weighted_sum_agg/arrears/invoice has one event, where the cumulative sum cannot be
    told from the value. calendar_sensitive because the divisor is the length of THIS month; runners
    is [rspec] only for the same reason (a live shift changes 31). The paired
    b01/standard/weighted_sum_agg/current_usage/many must produce this same 4_000¢.

