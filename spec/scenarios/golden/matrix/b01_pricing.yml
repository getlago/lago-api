    = 40.0 exactly. That is the FORECAST behaviour, not a bug: for current usage charges_to_datetime
    is still the end of the period in progress (subscriptions/dates/monthly_service.rb:26-28),
    raised to 2024-04-01T00:00:00Z by to_datetime.ceil (events/stores/postgres_store.rb:358), so the
    last held value is weighted over days that have not happened yet at the moment of the 20 March
    read. The invoice cell for the same aggregation and event set therefore reports the SAME amount
