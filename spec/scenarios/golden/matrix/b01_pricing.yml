    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b01_pct_max_cu_many, properties: {amount: 10}, timestamp: "2024-03-05T10:00:00Z"}
        - {code: b01_pct_max_cu_many, properties: {amount: 30}, timestamp: "2024-03-05T11:00:00Z"}
        - {code: b01_pct_max_cu_many, properties: {amount: 20}, timestamp: "2024-03-05T12:00:00Z"}
    - {at: "2024-03-20T10:00:00Z", do: fetch_current_usage}
  expect:
    usage:
      amount_cents: 350
      taxes_amount_cents: 0
      total_amount_cents: 350
      charges_usage:
        - {billable_metric_code: b01_pct_max_cu_many, units: "30.0", amount_cents: 350}
  math: >-
    Three events at 10:00, 11:00 and 12:00 carrying 10, 30, 20. max_agg takes the largest value in
    the period, so the period aggregates to 30 units. charge_models/percentage_service.rb:7-13 —
    compute_percentage_amount (:54-58) + compute_fixed_amount (:60-66). free_units_value is 0
    (:70-79), so the percentage leg is (30 − 0) × 10 / 100 = 3.00; free_units_count is 2 (:81-86)
    against 3 event(s), so the fixed leg is (3 − 2) × 0.50 = 0.50. Total 3.50 → 350¢. Percentage set
    E carries free_units_per_events 2, and this aggregation never populates options[:running_total]
    — max_service.rb:25 assigns the raw options hash and weighted_sum_service.rb:22 assigns {} — so
    last_running_total is 0 and free_units_value returns 0 on its first line (:71). The allowance
    therefore discounts the FIXED fee (through free_units_count:81-86, which falls back to
    free_units_per_events) but leaves the percentage base at the full unit count. An implementation
    that also discounted 2 units from the base would report 330¢. Ignoring the free-unit properties
    entirely gives 450¢. usage.amount_cents is fees_amount_cents — charges only, never the
    subscription fee (invoices/customer_usage_service.rb:255-266), which is why the plan amount does
    not appear here. The paired invoice cell for the same aggregation and event set must report the
    same 350¢ charge fee: two different computations of one number, not two numbers. Current usage
    is not projected here (calculate_projected_usage defaults to false,
    customer_usage_service.rb:14), so compute_amount is the number, not compute_projected_amount.
    The 10/30/20 values are chosen so every candidate answer is distinct: sum_agg would report 60
    units (650¢), count_agg would report 3 units (80¢).

- id: b01/percentage/unique_count_agg/current_usage/many
  block: B1
  axes: {charge_model: percentage, aggregation: unique_count_agg, observed_via: current-usage, events: many}
  dimensions: {recurring: false, pay_in_advance: false, prorated: false, interval: monthly, billing_time: calendar}
  provenance: coverage-gap
