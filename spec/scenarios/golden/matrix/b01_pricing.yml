- id: b01/dynamic/sum_agg/arrears/invoice
  block: B1
  axes: {charge_model: dynamic, aggregation: sum_agg, observed_via: invoice, events: many}
  dimensions: {recurring: false, pay_in_advance: false, prorated: false, interval: monthly, billing_time: calendar}
