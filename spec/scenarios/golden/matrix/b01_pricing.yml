- id: b01/volume/count_agg/invoice/none
  block: B1
  axes: {charge_model: volume, aggregation: count_agg, observed_via: invoice, events: none}
  dimensions: {recurring: false, pay_in_advance: false, prorated: false, interval: monthly, billing_time: calendar}
  provenance: coverage-gap
  runners: [rspec, live]
  setup:
    metrics: [{code: b01_vol_cnt_inv_none, aggregation_type: count_agg}]
    plan: {code: golden_b01_vol_cnt_inv_none, interval: monthly, amount_cents: 0}
    charges:
      - billable_metric_code: b01_vol_cnt_inv_none
        charge_model: volume
        properties:
          volume_ranges:
            - {from_value: 0, to_value: 2, per_unit_amount: "2", flat_amount: "100"}
            - {from_value: 3, to_value: 25, per_unit_amount: "1", flat_amount: "50"}
            - {from_value: 26, to_value: null, per_unit_amount: "0.5", flat_amount: "20"}
    customer: {external_id: golden_b01_vol_cnt_inv_none_cust, currency: EUR}
    subscription: {external_id: golden_b01_vol_cnt_inv_none_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      status: finalized
      fees_amount_cents: 10000
      taxes_amount_cents: 0
      total_amount_cents: 10000
      fees_count: 2
      fees:
        - {fee_type: subscription, amount_cents: 0}
        - {fee_type: charge, units: "0.0", amount_cents: 10000}
  math: >-
    NO events at all. count_agg counts events and never reads a field, so the period aggregates to 0
    units. charge_models/volume_service.rb:11-13 — ONE range is selected by the total unit count
    (matching_range, :56-60) and every unit is priced at that range's per_unit_amount (:52-54) plus
    its flat_amount (:44-46). 0 units select range 0–2 (per_unit 2.00, flat 100.00), so amount = 0 ×
    2.00 + 100.00 = 100.00 → 10_000¢. At 0 units only the first range is involved, so graduated band
    pricing over the same ranges would return the identical 10_000¢ — this cell cannot separate the
    two models, and the volume-vs-graduated contrast is carried by the cells whose units cross a
    boundary. Volume set B is byte-for-byte the tier set the sibling `graduated` rows of this file
    use, on purpose: every counterfactual above is then a number an existing green row already
    asserts rather than a fresh derivation. The fee is non-zero, so should_persist_fee?
    (fees/charge_service.rb:353-360) keeps it on the first clause and the invoice carries fees_count
    2. Plan amount 0¢ → total 10_000¢, no tax configured. This is the ING-13 shape: zero usage still
    bills the first range's flat_amount, so unlike the `package` and `percentage` columns of this
    block the fee SURVIVES the drop. Its current-usage twin reports the identical amount, so that
    pair AGREES on both value and presence. Every aggregation reports 0 units on an empty period, so
    this cell cannot separate them — it is here for the charge model's behaviour at zero usage, not
    for the aggregation.

