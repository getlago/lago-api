    subscription: {external_id: golden_b01_pct_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b01_pct_sum, properties: {amount: 10}}
        - {code: b01_pct_sum, properties: {amount: 20}}
        - {code: b01_pct_sum, properties: {amount: 30}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_amount_cents: 900
      total_amount_cents: 900
      fees_count: 2
      fees:
        - {fee_type: subscription, amount_cents: 0}
        - {fee_type: charge, units: "60.0", amount_cents: 900}
  math: >-
    Percentage takes a rate of the aggregated value PLUS a fixed amount per charged event — the fixed
    part is per event, not per invoice, which is the subtlety this row pins.
    10% of 60 = 6.00, plus 3 events × 1.00 = 3.00 → 9.00 → 900¢. Cross-checked against
    current_usage/by_charge_model/percentage_spec.rb, where rate 1 + fixed 5 with one charged event
    gives 510¢.

