    subscription: {external_id: golden_b01_std_wsum_cu_many_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-06T00:00:00Z"
      do: ingest_events
      events:
        - {code: b01_std_wsum_cu_many, properties: {value: 10}, timestamp: "2024-03-06T00:00:00Z"}
    - at: "2024-03-10T00:00:00Z"
      do: ingest_events
      events:
        - {code: b01_std_wsum_cu_many, properties: {value: 30}, timestamp: "2024-03-10T00:00:00Z"}
    - at: "2024-03-16T00:00:00Z"
      do: ingest_events
      events:
        - {code: b01_std_wsum_cu_many, properties: {value: 20}, timestamp: "2024-03-16T00:00:00Z"}
    - {at: "2024-03-20T10:00:00Z", do: fetch_current_usage}
  expect:
    usage:
      amount_cents: 4000
      taxes_amount_cents: 0
      total_amount_cents: 4000
      charges_usage:
        - {billable_metric_code: b01_std_wsum_cu_many, charge_model: standard, units: "40.0", amount_cents: 4000}
  math: >-
    The same three deltas as b01/standard/weighted_sum_agg/invoice/many — 10 on 03-06, 30 on 03-10,
    20 on 03-16 — read as usage on 20 March. Derived once: units = Σ(cumulative × seconds_to_next) /
    31 days (events/stores/postgres/weighted_sum_query.rb:99-116) = (10×4 + 40×6 + 60×16) / 31 =
    1_240 / 31 = 40.0 units → 4_000¢. The upper bound is the same on both surfaces: for current
    usage charges_to_datetime is still the end of the period in progress
    (subscriptions/dates/monthly_service.rb:26-28), raised to 2024-04-01T00:00:00Z by
