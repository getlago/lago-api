  setup:
    metrics: [{code: b01_std_cnt_inv_none, aggregation_type: count_agg}]
    plan: {code: golden_b01_std_cnt_inv_none, interval: monthly, amount_cents: 1000}
    charges: [{billable_metric_code: b01_std_cnt_inv_none, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b01_std_cnt_inv_none_cust, currency: EUR}
    subscription: {external_id: golden_b01_std_cnt_inv_none_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      status: finalized
      fees_amount_cents: 1000
      taxes_amount_cents: 0
      total_amount_cents: 1000
      fees_count: 1
      fees:
        - {fee_type: subscription, amount_cents: 1000}
  math: >-
    NO events. count_agg counts events, and there are none, so 0 units; StandardService prices them
    at 0 × 1.00 = 0 (charge_models/standard_service.rb:8), so the charge fee is built with units 0,
    amount_cents 0 and events_count 0. `should_persist_fee?` (fees/charge_service.rb:353-360) then
    DROPS that fee: perform_billing runs with context :finalize
    (invoices/subscription_service.rb:41-45), never :recurring, and there is no adjusted fee and no
    true-up, so the units == 0 && amount_cents == 0 && events_count == 0 fee fails every clause.
