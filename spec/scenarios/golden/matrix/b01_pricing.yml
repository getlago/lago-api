# custom_agg has NO rows here on purpose: `custom_aggregator` is not a permitted REST parameter, so
# a custom_agg metric — and with it the only legal cell of the `custom` charge model — cannot be
# created through the API this suite drives. GoldenLegality::API_UNREACHABLE_AGGREGATIONS records
# that, the ledger subtracts those cells and reports the count, and b14/custom-aggregator/... pins
# the refusal itself.

# ================================================================ event cardinality
# One event cannot tell an aggregation from a passthrough, and no events at all still produces a
# flat fee. These two rows exist because the rest of the grid fixes the event set at three.

- id: b01/graduated/sum_agg/arrears/invoice/no-events
  block: B1
  axes: {charge_model: graduated, aggregation: sum_agg, observed_via: invoice, events: none}
  dimensions: {recurring: false, pay_in_advance: false, prorated: false, interval: monthly, billing_time: calendar}
  provenance: coverage-gap
  runners: [rspec, live]
  setup:
    metrics: [{code: b01_grad_none, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b01_grad_none, interval: monthly, amount_cents: 0}
    charges:
      - billable_metric_code: b01_grad_none
        charge_model: graduated
        properties:
          graduated_ranges:
            - {from_value: 0, to_value: 10, per_unit_amount: "2", flat_amount: "100"}
            - {from_value: 11, to_value: null, per_unit_amount: "1", flat_amount: "50"}
    customer: {external_id: golden_b01_grad_none_cust, currency: EUR}
    subscription: {external_id: golden_b01_grad_none_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_amount_cents: 10000
      total_amount_cents: 10000
      fees_count: 2
      fees:
        - {fee_type: subscription, amount_cents: 0}
        - {fee_type: charge, units: "0.0", amount_cents: 10000}
  math: >-
    NO events at all, and the customer is still billed 10_000¢. Tier 1's flat_amount of 100.00 is
    charged for the period regardless of usage: 0 units still lands in the first range, so the range
    is entered and its flat fee applies. This is the shape of the ING-13 regression already recorded
    in current_usage/by_charge_model/graduated_spec.rb, here asserted against an invoice rather than
    against usage. A grid that only ever ingests events would never see it — which is why event
    cardinality is an axis.

