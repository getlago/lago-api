  setup:
    metrics: [{code: b01_std_wsum_cu_many, aggregation_type: weighted_sum_agg, field_name: value, recurring: true, weighted_interval: seconds}]
    plan: {code: golden_b01_std_wsum_cu_many, interval: monthly, amount_cents: 0}
