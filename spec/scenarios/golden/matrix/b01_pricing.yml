    here, against this file's amount_cents-0 convention: with a 0 plan the invoice would be 0¢
    everywhere and the row could not tell 'charge fee dropped' from 'charge fee present at 0¢'. An
    implementation that persisted the zero fee reports the same 1_000¢ total with fees_count 2 —
    which is why fees_count carries this row. Contrast
    b01/graduated/sum_agg/arrears/invoice/no-events, where tier 1's flat_amount makes the zero-usage
    fee non-zero and it DOES persist.

