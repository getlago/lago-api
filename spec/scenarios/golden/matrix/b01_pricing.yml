    the running total, so the period aggregates to 32 units. units = 62 × 16 / 31 = 32.0: the single
    delta is weighted from 03-16 to the END of the period
    (events/stores/postgres/weighted_sum_query.rb:99-116). That is the FORECAST behaviour, not a
    bug: for current usage charges_to_datetime is still the end of the period in progress
