    metrics: [{code: b12_adv_ann_sa, aggregation_type: sum_agg, field_name: amount}]
    plan:
      code: golden_b12_adv_ann_sa
      interval: semiannual
      amount_cents: 2000
      pay_in_advance: true
      minimum_commitment: {amount_cents: 10000}
    charges: [{billable_metric_code: b12_adv_ann_sa, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b12_adv_ann_sa_cust, currency: EUR}
    subscription: {external_id: golden_b12_adv_ann_sa_sub, billing_time: anniversary}
  timeline:
    - {at: "2024-02-10T00:00:00Z", do: create_subscription}
    - at: "2024-03-20T10:00:00Z"
      do: ingest_events
      events: [{code: b12_adv_ann_sa, properties: {amount: 10}}]
    - at: "2024-05-20T10:00:00Z"
      do: ingest_events
      events: [{code: b12_adv_ann_sa, properties: {amount: 10}}]
    - at: "2024-07-20T10:00:00Z"
      do: ingest_events
      events: [{code: b12_adv_ann_sa, properties: {amount: 10}}]
    - {at: "2024-08-10T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {index: 0}
        fees_amount_cents: 2000
        total_amount_cents: 2000
        fees_count: 1
        fees:
          - {fee_type: subscription, amount_cents: 2000, from_date: "2024-02-10T00:00:00Z", to_date: "2024-08-09T23:59:59Z"}
      - select: {index: 1}
        fees_amount_cents: 10000
        coupons_amount_cents: 0
        taxes_amount_cents: 0
        total_amount_cents: 10000
        fees_count: 3
        fees:
          - {fee_type: subscription, amount_cents: 2000, from_date: "2024-08-10T00:00:00Z", to_date: "2025-02-09T23:59:59Z"}
          - {fee_type: charge, amount_cents: 3000, units: "30", from_date: "2024-02-10T00:00:00Z", to_date: "2024-08-09T23:59:59Z"}
          - {fee_type: commitment, amount_cents: 5000, from_date: "2024-02-10T00:00:00Z", to_date: "2024-08-09T23:59:59Z"}
  math: >-
    In advance the commitment reconciles the PREVIOUS period, so it is the SECOND invoice that
    carries the true-up and this row asserts both. Invoice 1 (2024-02-10, raised on subscription
    creation by activate_service.rb:181-196) is the period-1 subscription fee alone: 2_000¢, and no
    commitment fee at all — calculate_fees_service.rb:250 and
    commitments/minimum/in_advance/calculate_true_up_fee_service.rb:9-19 both refuse a true-up while
    invoice_subscription.previous_invoice_subscription is nil — and no charge fee either, because a
    zero-units zero-amount fee is not persisted (fees/charge_service.rb:353-359). fees_count 1 is
    what pins that. Invoice 2 (2024-08-10) reconciles period 1 = 2024-02-10T00:00:00Z ..
    2024-08-09T23:59:59Z. That window is built from the PREVIOUS invoice_subscription with
    current_usage=true (in_advance/calculate_true_up_fee_service.rb:122-127,
    in_advance/dates_service.rb:7-9), resolved for a anniversary semiannual plan by
    subscriptions/dates/semiannual_service.rb:140-146 and :168-172. fees_total = 2_000¢ + 3_000¢ =
    5_000¢. The period-1 subscription fee is selected by properties->>'from_datetime' >=
    2024-02-10T00:00:00Z AND properties->>'to_datetime' <= 2024-08-09T23:59:59Z (:21-37), which is
    exactly why the period-2 subscription fee sitting on this same invoice (2024-08-10T00:00:00Z ..
    2025-02-09T23:59:59Z) is NOT counted; the 30 units x 1.00 of usage arrives as the arrears charge
    fee for period 1 and is selected by invoice id rather than by date (:39-48). The floor is not
    prorated: calculate_amount_service.rb:36-44 hands the PREVIOUS invoice_subscription to
    CalculateProratedCoefficientService, whose 182 / 182 days come out even because the subscription
    started on the period's own boundary, so the commitment is the full 10_000¢ and
    calculate_true_up_fee_service.rb:37-41 gives 10_000 - 5_000 = 5_000¢. Note what the invoice
    total does NOT say: invoice 2 sums to 10_000¢, but only 5_000¢ of that belongs to the reconciled
    period — the other 2_000¢ is period 2 charged in advance. An arrears invoice for the same money
    reads identically at invoice level, so the per-fee from_date / to_date are load-bearing: the
    commitment fee's period is copied off the reconciled invoice_subscription
    (fees/commitments/minimum/build_fee_base_service.rb:30-50) and names period 1, while the
    subscription fee beside it names period 2. What a wrong implementation gives. Both date
    comparisons are inclusive (>= and <=), so any window that does not fully span
    2024-02-10T00:00:00Z .. 2024-08-09T23:59:59Z — one day short at either end is enough — no longer
    contains the period-1 subscription fee, fees_total drops to the invoice-selected 3_000¢ charge
    fee and the true-up becomes 10_000 - 3_000 = 7_000¢. A window whose end reaches
    2025-02-09T23:59:59Z catches the period-2 subscription fee as well and gives 10_000 - (2_000 +
    2_000 + 3_000) = 3_000¢. One failure mode the amount cannot catch, and the dates can:
    reconciling the CURRENT period instead of the previous one would still total 5_000¢, because the
    charge fee is chosen by invoice id and the two subscription fees cost the same —
    `fees_amount_cents` is blind to it, and the commitment fee's from_date / to_date is the only
    assertion that fails.

