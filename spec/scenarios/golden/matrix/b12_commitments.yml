# B12 — minimum commitments and spending floors.
#
# A true-up is the one fee computed FROM the other fees, which makes it the only producer whose
# amount depends on what else landed on the invoice — and it is computed before any reducer runs.
#
# Two different mechanisms are called "true-up" in this codebase and only one of them is this block.
# The `commitment` fee here comes from Commitments::Minimum::CalculateTrueUpFeeService, a PLAN-level
# floor. Fees::CreateTrueUpService is the unrelated per-CHARGE `min_amount_cents` floor, and it
# returns early when the charge has no minimum (create_true_up_service.rb:22) — no charge in this
# block sets one, so it is inert in every row.
#
# `commitment_mode` is not a field: Commitments::DatesService:8-12, FetchInvoicesService:8-12 and
# CalculateTrueUpFeeService:9-13 all branch on `plan.pay_in_advance?`, so in-advance rows are
# pay-in-advance plans and in-arrears rows are pay-in-arrears ones. In arrears the true-up
# reconciles the period being invoiced; in advance it reconciles the PREVIOUS period, which is why
# the in-advance rows need two invoices and assert both.
#
# Pricing is pinned across every row — plan 2_000¢, 30 units x 1.00, floor 10_000¢, no tax, no
# coupon — so the only thing moving between cells is the dates. `premium: true` is mandatory, not
# decorative: plans/create_service.rb:68 drops `minimum_commitment` without a licence and answers
# HTTP 200, so a non-premium row would pass with no commitment on the plan at all.
---
- id: b12/in-arrears/calendar/monthly
  block: B12
  axes: {commitment_mode: in-arrears, billing_time: calendar, interval: monthly}
  dimensions: {commitment_amount_cents: 10000, tax_rate: 20}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    taxes: [{code: b12_vat, name: VAT, rate: 20}]
    metrics: [{code: b12_sum, aggregation_type: sum_agg, field_name: amount}]
    plan:
      code: golden_b12_commitment
      interval: monthly
      amount_cents: 2000
      minimum_commitment: {amount_cents: 10000}
    charges: [{billable_metric_code: b12_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b12_cust, currency: EUR}
    subscription: {external_id: golden_b12_sub, billing_time: calendar}
    coupons:
      - name: b12 coupon
        code: b12_coupon
        coupon_type: fixed_amount
        frequency: once
        amount_cents: 2000
        amount_currency: EUR
        expiration: no_expiration
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b12_sum, properties: {amount: 30}}]
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_amount_cents: 10000
      coupons_amount_cents: 2000
      sub_total_excluding_taxes_amount_cents: 8000
      taxes_amount_cents: 1600
      total_amount_cents: 9600
      fees_count: 3
      fees:
        - {fee_type: subscription, amount_cents: 2000, taxes_amount_cents: 320}
        - {fee_type: charge, amount_cents: 3000, taxes_amount_cents: 480}
        - {fee_type: commitment, amount_cents: 5000, taxes_amount_cents: 800}
  math: >-
    A minimum commitment tops the period up to a floor, and the true-up is the only fee whose amount
    is a function of the other fees on the same invoice.
    2_000¢ subscription + 30 units × 1.00 = 5_000¢ of real usage against a 10_000¢ commitment, so
    Commitments::Minimum::CalculateTrueUpFeeService adds `commitment - fees_total` = 5_000¢ as a
    `commitment` fee and the invoice reaches exactly the floor: 10_000¢.
    The order is what this row pins. The true-up is a PRODUCER — it is created alongside the
    subscription and charge fees (calculate_fees_service.rb:46), before any reducer — and it reads
    raw `amount_cents`, so it neither knows nor cares that a coupon is coming. The 2_000¢ coupon then
    applies to the topped-up 10_000¢ and the customer pays 8_000¢ net against a floor they committed
    to at 10_000¢.
    That is the consequence worth knowing: a coupon discounts the commitment itself rather than being
    absorbed by the headroom beneath it. Had the true-up run after the coupon it would have seen
    3_000¢ of discounted fees, topped up by 7_000¢ instead of 5_000¢, and the customer would have
    paid the full 10_000¢ with the coupon silently doing nothing.
    Both totals are 10_000¢ of fees, so `fees_amount_cents` cannot tell the two apart — the split
    across the three fees is what does, which is why each is asserted with its own tax:
    the coupon spreads pro rata (400¢, 600¢, 1_000¢) and each fee is taxed on the remainder at 20%.


- id: b12/in-arrears/calendar/weekly
  block: B12
  pins: ["F10"]
  axes: {commitment_mode: in-arrears, billing_time: calendar, interval: weekly}
  dimensions: {commitment_amount_cents: 10000, plan_amount_cents: 2000, usage_units: 30, taxes: none, coupons: none}
  provenance: coverage-gap
  runners: [rspec]
  premium: true
  calendar_sensitive: true
  setup:
    metrics: [{code: b12_arr_cal_wk, aggregation_type: sum_agg, field_name: amount}]
    plan:
      code: golden_b12_arr_cal_wk
      interval: weekly
      amount_cents: 2000
      minimum_commitment: {amount_cents: 10000}
    charges: [{billable_metric_code: b12_arr_cal_wk, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b12_arr_cal_wk_cust, currency: EUR}
    subscription: {external_id: golden_b12_arr_cal_wk_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-04T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b12_arr_cal_wk, properties: {amount: 10}}]
    - at: "2024-03-07T10:00:00Z"
      do: ingest_events
      events: [{code: b12_arr_cal_wk, properties: {amount: 10}}]
    - at: "2024-03-09T10:00:00Z"
      do: ingest_events
      events: [{code: b12_arr_cal_wk, properties: {amount: 10}}]
    - {at: "2024-03-11T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_amount_cents: 10000
      coupons_amount_cents: 0
      taxes_amount_cents: 0
      total_amount_cents: 10000
      fees_count: 3
      fees:
        - {fee_type: subscription, amount_cents: 2000, from_date: "2024-03-04T00:00:00Z", to_date: "2024-03-10T23:59:59Z"}
        - {fee_type: charge, amount_cents: 3000, units: "30", from_date: "2024-03-04T00:00:00Z", to_date: "2024-03-10T23:59:59Z"}
        - {fee_type: commitment, amount_cents: 5000, from_date: "2024-03-04T00:00:00Z", to_date: "2024-03-10T23:59:59Z"}
  math: >-
    In arrears the commitment reconciles the period being invoiced, so one invoice tells the whole
    story. Commitments::Minimum::InArrears::DatesService:9-11 asks Subscriptions::DatesService for
    current_usage=false — the subscription is neither terminated nor downgraded — which resolves the
    calendar weekly period billed on 2024-03-11 as 2024-03-04T00:00:00Z .. 2024-03-10T23:59:59Z
    (subscriptions/dates/weekly_service.rb:22-26 (compute_to_date) and :54-58
    (compute_previous_beginning_of_period)). fees_total = 2_000¢ subscription + 3_000¢ usage (30
    units x 1.00) = 5_000¢, and the two halves get there by DIFFERENT routes, which is what makes
    the boundary observable at all: the subscription fee is read off this invoice
    (commitments/minimum/in_arrears/calculate_true_up_fee_service.rb:9-20 — FetchInvoicesService
    returns just this one invoice, since the plan does not split charges monthly), while the charge
    fee has to satisfy charges_from_datetime >= previous_beginning_of_period AND charges_to_datetime
    <= end_of_period (:22-38). The floor is not prorated: CalculateProratedCoefficientService:45-57
    divides the days from the invoice_subscription's from_datetime to its to_datetime (7) by the
    days of the whole period (7) — the same span, because the subscription was created exactly on
    the period's own start — so the coefficient is 1 and CalculateAmountService:25-34 returns the
    full 10_000¢. commitments/minimum/calculate_true_up_fee_service.rb:37-41 then adds commitment -
    fees_total = 10_000 - 5_000 = 5_000¢ as a `commitment` fee, and the invoice lands exactly on the
    floor at 10_000¢. The true-up is a PRODUCER, created beside the other fees
    (invoices/calculate_fees_service.rb:41-46) from their raw amount_cents; this row deliberately
    carries no coupon and no tax so that nothing downstream can move the figure and the only
    arithmetic under test is the boundary. Every fee is asserted with its own from_date / to_date
    because those dates ARE the boundary — the `commitment` fee copies its period straight off the
    reconciled invoice_subscription (fees/commitments/minimum/build_fee_base_service.rb:30-50). What
    a wrong implementation gives. A window shifted off this one loses the charge fee — the only
    window-selected fee here — and the true-up climbs to 10_000 - 2_000 = 8_000¢; a window starting
    after 2024-03-04 also empties the coefficient query at :33-46, which then has no
    invoice_subscription to read. The other direction does not need a shift at all: reading this
    plan with the monthly rule gives 2024-03-01 .. 2024-03-31, which still CONTAINS both fees, but
    days_total becomes 31 against the 7 days billed, the floor is prorated to 10_000 x 7/31 =
    2_258¢, that is already under the 5_000¢ on the invoice, and line 38 returns 0 — no commitment
    fee at all and fees_count 2. 5_000¢ is reachable only from the window this row names.

