  expect:
    invoices: 4
    invoice:
      - select: {index: 0}
        fees_amount_cents: 10200
        total_amount_cents: 10200
        fees_count: 1
        fees: [{fee_type: charge, units: "1.0", events_count: 1, amount_cents: 10200}]
      - select: {index: 1}
        fees_amount_cents: 200
        total_amount_cents: 200
        fees_count: 1
        fees: [{fee_type: charge, units: "1.0", events_count: 1, amount_cents: 200}]
      - select: {index: 2}
        fees_amount_cents: 5100
        total_amount_cents: 5100
        fees_count: 1
        fees: [{fee_type: charge, units: "1.0", events_count: 1, amount_cents: 5100}]
      - select: last
        fees_amount_cents: 0
        total_amount_cents: 0
        fees_count: 1
