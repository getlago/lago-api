  axes: {charge_model: standard, aggregation: unique_count_agg, invoicing: invoiceable, events: one}
  dimensions: {pay_in_advance: true, invoiceable: true, interval: monthly, billing_time: calendar}
  provenance: coverage-gap
  runners: [rspec, live]
  setup:
