    invoices: 2
    invoice:
      - select: {invoice_type: advance_charges}
        invoice_type: advance_charges
        payment_status: succeeded
        fees_amount_cents: 220
        taxes_amount_cents: 0
        total_amount_cents: 220
        fees_count: 3
      - select: {invoice_type: subscription}
        invoice_type: subscription
        fees_amount_cents: 0
        total_amount_cents: 0
        fees_count: 1
        fees: [{fee_type: subscription, amount_cents: 0}]
  math: >-
    Percentage over count_agg is linear, so the boundary has to come from somewhere:
    free_units_per_events 1 makes the FIRST event of the period free and the fee sequence 0 / 110 /
    110 rather than a constant 110. count_service.rb:57-63 builds running_total =
    (1..cumulative_count), so at event k it is [1..k]. free_units_value
