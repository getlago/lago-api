- id: b03/standard/unique_count_agg/invoiceable/many
  block: B3
  axes: {charge_model: standard, aggregation: unique_count_agg, invoicing: invoiceable, events: many}
  dimensions: {pay_in_advance: true, invoiceable: true, interval: monthly, billing_time: calendar}
  provenance: coverage-gap
  runners: [rspec, live]
  setup:
    metrics: [{code: b03_inv_std_uniq_m, aggregation_type: unique_count_agg, field_name: uid}]
    plan: {code: golden_b03_inv_std_uniq_m, interval: monthly, amount_cents: 0}
    charges:
      - {billable_metric_code: b03_inv_std_uniq_m, charge_model: standard, pay_in_advance: true, properties: {amount: "1"}}
    customer: {external_id: golden_b03_inv_std_uniq_m_cust, currency: EUR}
    subscription: {external_id: golden_b03_inv_std_uniq_m_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-05T10:00:00Z", do: ingest_events, events: [{code: b03_inv_std_uniq_m, properties: {uid: "u1"}}]}
    - {at: "2024-03-06T10:00:00Z", do: ingest_events, events: [{code: b03_inv_std_uniq_m, properties: {uid: "u2"}}]}
    - {at: "2024-03-07T10:00:00Z", do: ingest_events, events: [{code: b03_inv_std_uniq_m, properties: {uid: "u1"}}]}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 4
    invoice:
      - select: {index: 0}
        fees_amount_cents: 100
        total_amount_cents: 100
        fees_count: 1
        fees: [{fee_type: charge, units: "1.0", events_count: 1, amount_cents: 100}]
      - select: {index: 1}
        fees_amount_cents: 100
        total_amount_cents: 100
        fees_count: 1
        fees: [{fee_type: charge, units: "1.0", events_count: 1, amount_cents: 100}]
      - select: {index: 2}
        fees_amount_cents: 0
        total_amount_cents: 0
        fees_count: 1
        fees: [{fee_type: charge, units: "0.0", events_count: 1, amount_cents: 0}]
      - select: last
        fees_amount_cents: 0
        total_amount_cents: 0
        fees_count: 1
        fees: [{fee_type: subscription, amount_cents: 0}]
  math: >-
    The third event REPEATS uid u1, and that is the whole point: dedup is a per-PERIOD property, so
    it can only be observed with more than one event. unique_count_service.rb:76-80 asks
    active_unique_property? (postgres_store.rb:117-128 — any earlier event carrying the same uid),
    gets true, and sets newly_applied_units = 0; the cached current_aggregation stays at 2, is not
    greater than the cached max of 2, so compute_pay_in_advance_aggregation returns 0 and
    units_applied 0. The delta is therefore f(2) − f(2 − 0) = 0.00 → a 0¢ fee with units 0.0 —
    Lago still opens an invoice for it (create_pay_in_advance_charge_service.rb only bails when
    fees.none?), which is why this row expects FOUR invoices and not three. Events 1 and 2 each add
    a new uid: f(1)−f(0) = 100¢ and f(2)−f(1) = 100¢. Counterfactual: per-event pricing would bill
    the duplicate as a fresh unit, 100¢, for 300¢ total instead of 200¢ — and the arrears reading of
    the same three events is 2 distinct uids × 1.00 = 200¢, which the advance total must match.

- id: b03/graduated/count_agg/invoiceable/one
  block: B3
  axes: {charge_model: graduated, aggregation: count_agg, invoicing: invoiceable, events: one}
  dimensions: {pay_in_advance: true, invoiceable: true, interval: monthly, billing_time: calendar}
  provenance: coverage-gap
  runners: [rspec, live]
  setup:
    metrics: [{code: b03_inv_grad_cnt_o, aggregation_type: count_agg}]
