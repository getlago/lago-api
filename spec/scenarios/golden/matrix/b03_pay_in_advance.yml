    unique_count_agg in advance: one event, one distinct value → 1 unit → 100¢. Deduplication still
    applies in advance (BillableMetrics::Aggregations::UniqueCountService) — a repeat of the same uid
    contributes a delta of zero rather than a second unit, so advance and arrears agree on the total.
    What differs is only WHEN the charge lands, not what it comes to.

- id: b03/graduated/sum_agg/invoiceable
  block: B3
  axes: {charge_model: graduated, aggregation: sum_agg, invoicing: invoiceable, events: many}
  dimensions: {pay_in_advance: true, invoiceable: true, interval: monthly, billing_time: calendar}
  provenance: coverage-gap
  runners: [rspec, live]
  setup:
    metrics: [{code: 'b03m_b03_grad', aggregation_type: 'sum_agg', field_name: 'amount'}]
    plan: {code: golden_b03_grad, interval: monthly, amount_cents: 0}
    charges:
      - billable_metric_code: b03m_b03_grad
        charge_model: graduated
        pay_in_advance: true
        properties:
          graduated_ranges:
            - {from_value: 0, to_value: 10, per_unit_amount: "2", flat_amount: "100"}
            - {from_value: 11, to_value: null, per_unit_amount: "1", flat_amount: "50"}
    customer: {external_id: golden_b03_grad_cust, currency: EUR}
    subscription: {external_id: golden_b03_grad_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b03m_b03_grad, properties: {amount: 10}}
    - at: "2024-03-06T10:00:00Z"
      do: ingest_events
      events:
        - {code: b03m_b03_grad, properties: {amount: 10}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 3
    invoice:
      select: {index: 1}
      fees_amount_cents: 6000
      total_amount_cents: 6000
      fees_count: 1
      fees:
        - {fee_type: charge, units: "10.0", amount_cents: 6000}
  math: >-
    A pay-in-advance charge is priced as a CUMULATIVE DELTA, not per event in isolation:
    Charges::ApplyPayInAdvanceChargeModelService computes
    amount_from_aggregation − amount_excluding_persisted_event.
    Event 1 (10 units): cost(10) − cost(0) = (flat 100 + 10 × 2) − 0 = 120.00 → 12_000¢.
    Event 2 (10 more): cost(20) − cost(10) = (120 + flat 50 + 10 × 1) − 120 = 60.00 → 6_000¢.
    The row asserts the SECOND advance invoice precisely because that is where the two readings
    diverge: the tier-1 flat fee is charged ONCE for the period, not again on each event. A
    single-event row cannot tell the two apart, which is why this one ingests two.

- id: b03/package/sum_agg/invoiceable
  block: B3
  axes: {charge_model: package, aggregation: sum_agg, invoicing: invoiceable, events: one}
  dimensions: {pay_in_advance: true, invoiceable: true, interval: monthly, billing_time: calendar}
  provenance: coverage-gap
  runners: [rspec, live]
  setup:
    metrics: [{code: 'b03m_b03_pkg', aggregation_type: 'sum_agg', field_name: 'amount'}]
    plan: {code: golden_b03_pkg, interval: monthly, amount_cents: 0}
    charges:
      - billable_metric_code: b03m_b03_pkg
        charge_model: package
        pay_in_advance: true
        properties: {amount: "10", free_units: 0, package_size: 25}
    customer: {external_id: golden_b03_pkg_cust, currency: EUR}
    subscription: {external_id: golden_b03_pkg_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b03m_b03_pkg, properties: {amount: 10}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      select: first
      fees_amount_cents: 1000
      total_amount_cents: 1000
      fees_count: 1
      fees:
        - {fee_type: charge, units: "10.0", amount_cents: 1000}
  math: >-
    Package rounds up: 10 units at package_size 25 → ceil(10 / 25) = 1 package × 10.00 = 1_000¢.
    Because the amount is a cumulative delta rather than a per-event price, ten one-unit events
    would together buy ONE package, not ten — each event is charged the difference its arrival
    makes to the running total, which is zero once the package is already paid for.

