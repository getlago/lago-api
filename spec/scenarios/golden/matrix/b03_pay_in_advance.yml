    charges:
      - billable_metric_code: b03_inv_grad_cnt_o
        charge_model: graduated
        pay_in_advance: true
        properties:
          graduated_ranges:
            - {from_value: 0, to_value: 10, per_unit_amount: "2", flat_amount: "100"}
            - {from_value: 11, to_value: null, per_unit_amount: "1", flat_amount: "50"}
    customer: {external_id: golden_b03_inv_grad_cnt_o_cust, currency: EUR}
    subscription: {external_id: golden_b03_inv_grad_cnt_o_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-05T10:00:00Z", do: ingest_events, events: [{code: b03_inv_grad_cnt_o}]}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: first
        fees_amount_cents: 10200
        total_amount_cents: 10200
        fees_count: 1
        fees: [{fee_type: charge, units: "1.0", events_count: 1, amount_cents: 10200}]
      - select: last
        fees_amount_cents: 0
        total_amount_cents: 0
        fees_count: 1
        fees: [{fee_type: subscription, amount_cents: 0}]
  math: >-
    ONE count event, so the cumulative aggregation is 1: tier 1 (0..10) bills its flat_amount 100.00
    plus 1 × 2.00 = 102.00 → 10_200¢ (range_graduated_service.rb:54-65 — from_value 0 means the
    range's units are min(total, to_value), here 1). The excluding side is
    f(0) with exclude_event, and graduated_service.rb:31 returns 0 there rather than the bare
    tier-1 flat: that guard is exactly what this row pins. Without it, f(0) would be the 100.00 flat
    (range_graduated_service.rb:47 keeps flat_unit_amount even at units 0) and the first event would
    be billed 2.00 → 200¢, with the tier-1 flat fee never charged at all. Contrast the sum_agg
    sibling on the same ranges, where the single event carries 10 units and pays 120.00.

- id: b03/graduated/count_agg/invoiceable/many
