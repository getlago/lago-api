- id: b03/standard/count_agg/invoiceable/many
  block: B3
  axes: {charge_model: standard, aggregation: count_agg, invoicing: invoiceable, events: many}
  dimensions: {pay_in_advance: true, invoiceable: true, interval: monthly, billing_time: calendar}
  provenance: coverage-gap
  runners: [rspec, live]
  setup:
    metrics: [{code: b03_inv_std_cnt_m, aggregation_type: count_agg}]
    plan: {code: golden_b03_inv_std_cnt_m, interval: monthly, amount_cents: 0}
    charges:
      - {billable_metric_code: b03_inv_std_cnt_m, charge_model: standard, pay_in_advance: true, properties: {amount: "1"}}
    customer: {external_id: golden_b03_inv_std_cnt_m_cust, currency: EUR}
    subscription: {external_id: golden_b03_inv_std_cnt_m_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-05T10:00:00Z", do: ingest_events, events: [{code: b03_inv_std_cnt_m}]}
    - {at: "2024-03-06T10:00:00Z", do: ingest_events, events: [{code: b03_inv_std_cnt_m}]}
    - {at: "2024-03-07T10:00:00Z", do: ingest_events, events: [{code: b03_inv_std_cnt_m}]}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 4
    invoice:
      - select: {index: 0}
        fees_amount_cents: 100
        total_amount_cents: 100
        fees_count: 1
        fees: [{fee_type: charge, units: "1.0", events_count: 1, amount_cents: 100}]
      - select: {index: 1}
        fees_amount_cents: 100
        total_amount_cents: 100
        fees_count: 1
        fees: [{fee_type: charge, units: "1.0", events_count: 1, amount_cents: 100}]
      - select: {index: 2}
        fees_amount_cents: 100
        total_amount_cents: 100
        fees_count: 1
        fees: [{fee_type: charge, units: "1.0", events_count: 1, amount_cents: 100}]
      - select: last
        fees_amount_cents: 0
        total_amount_cents: 0
        fees_count: 1
        fees: [{fee_type: subscription, amount_cents: 0}]
  math: >-
    Delta pricing on a LINEAR model: apply_pay_in_advance_charge_model_service.rb:20-21 bills
    f(cumulative including this event) − f(cumulative excluding it). count_agg contributes
    pay_in_advance_aggregation = 1 for every event (count_service.rb:13), so event k is
    f(k) − f(k−1) = 1 × 1.00 = 100¢, three times over. This is the one cell in the block where
    delta pricing and per-event pricing are PROVABLY indistinguishable — standard is linear and the
    per-event contribution is a constant 1 unit — so the counterfactual this row rules out is the
    other one: a service that priced the cumulative aggregation WITHOUT subtracting the previous
    total would bill f(1)+f(2)+f(3) = 100 + 200 + 300 = 600¢ and stamp units 1.0 / 2.0 / 3.0.
    Each fee carries units 1.0 and events_count 1 (result.count = 1, :32) even though the
    aggregation behind it counted k events. The 1 April invoice carries only the 0¢ subscription
    fee: calculate_fees_service.rb:132 excludes pay_in_advance charges on non-recurring metrics
    from arrears billing, so the usage is not billed twice.

