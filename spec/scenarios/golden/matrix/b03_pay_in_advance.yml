      - billable_metric_code: b03_reg_pct_cnt_o
        charge_model: percentage
        pay_in_advance: true
        invoiceable: false
        regroup_paid_fees: invoice
        properties: {rate: "10", fixed_amount: "1"}
    customer: {external_id: golden_b03_reg_pct_cnt_o_cust, currency: EUR}
    subscription: {external_id: golden_b03_reg_pct_cnt_o_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-05T10:00:00Z", do: ingest_events, events: [{code: b03_reg_pct_cnt_o}]}
    - {at: "2024-03-20T10:00:00Z", do: pay_fees}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {invoice_type: advance_charges}
        invoice_type: advance_charges
        payment_status: succeeded
        fees_amount_cents: 110
        taxes_amount_cents: 0
        total_amount_cents: 110
        fees_count: 1
        fees: [{fee_type: charge, item_code: b03_reg_pct_cnt_o, units: "1.0", events_count: 1, amount_cents: 110}]
      - select: {invoice_type: subscription}
        invoice_type: subscription
        fees_amount_cents: 0
        total_amount_cents: 0
        fees_count: 1
        fees: [{fee_type: subscription, amount_cents: 0}]
  math: >-
    Percentage over count_agg prices the COUNT as its units, which is the trap this cell exists for:
    with one event the aggregation is 1 unit, so percentage_service.rb:54-58 gives (1 - 0) × 10 /
    100 = 0.10 and :60-66 adds (count 1 - free_units_count 0) × fixed_amount 1.00 = 1.00, total 1.10
    → 110¢. Both free-unit terms are zero because running_total is empty when neither
    free_units_per_events nor free_units_per_total_aggregation is set (count_service.rb:57-63), so
    free_units_value falls to 0 via the last_running_total.zero? guard at :71. The excluding side is
    units 0 / count 0, where compute_fixed_amount returns 0.0 on the units.zero? guard at :61, so
    f(0) = 0. REGROUPED, not recomputed. invoiceable: false routes the event to
    Fees::CreatePayInAdvanceJob rather than to an invoice (events/pay_in_advance_service.rb:26), and
    that service persists the fee with invoice_id nil and payment_status PENDING
    (create_pay_in_advance_service.rb:120,151), applying taxes there and then because nothing
    downstream will (:147-148). regroup_paid_fees means literally PAID fees:
    advance_charges_service.rb:69-70 collects only fees whose payment_status is succeeded and whose
    succeeded_at precedes billing_at, which is why this row has a pay_fees step - without it no
    advance_charges invoice is produced at all and the usage is silently uninvoiced. At 1 April the
    fee above is moved onto an advance_charges invoice (:110-115, update_all invoice_id) totalling
    110¢, its taxes SUMMED from the fees rather than recomputed (AggregateAmountsAndTaxesFromFees at
    :126, deliberately not ComputeAmountsFromFees) and its payment_status stamped succeeded at :130.
    The row pins the two facts separately, because they are two facts: HOW MUCH (the regrouped fee
    is 110¢) and WHICH invoice carries it (the expectation is selected by invoice_type:
    advance_charges, not by index). With a single event the advance reading and the arrears reading
    are numerically identical (f(1) = 1 × 10/100 + 1 × 1.00 = 1.10 → 110¢), so what distinguishes
    REGROUPED from RECOMPUTED-AT-INVOICE-TIME here is purely WHERE the money sits: a recomputation
    in arrears would hang a 110¢ charge fee off the period (subscription) invoice, and the second
    expectation asserts that invoice has exactly one fee and it is the 0¢ subscription fee. The
    count discrimination is the many-event sibling's job. The second expectation also pins that the
    usage is not billed TWICE: the period invoice carries only the 0¢ subscription fee because
    calculate_fees_service.rb:130 scopes arrears charge fees to `invoiceable: true`. `premium: true`
    is load-bearing - Charges::CreateService assigns invoiceable and regroup_paid_fees only under a
    licence, and advance_charges_service.rb:83 requires regroup_paid_fees: :invoice, so without the
    licence there would be no advance_charges invoice to select at all.

- id: b03/percentage/count_agg/non-invoiceable-regrouped/many
  block: B3
  axes: {charge_model: percentage, aggregation: count_agg, invoicing: non-invoiceable-regrouped, events: many}
  dimensions: {pay_in_advance: true, invoiceable: false, regroup_paid_fees: invoice, interval: monthly, billing_time: calendar}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    metrics: [{code: b03_reg_pct_cnt_m, aggregation_type: count_agg}]
    plan: {code: golden_b03_reg_pct_cnt_m, interval: monthly, amount_cents: 0}
