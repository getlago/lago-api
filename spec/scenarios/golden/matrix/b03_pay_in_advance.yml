    metrics: [{code: b03_reg_pkg_uniq_m, aggregation_type: unique_count_agg, field_name: uid}]
    plan: {code: golden_b03_reg_pkg_uniq_m, interval: monthly, amount_cents: 0}
    charges:
      - billable_metric_code: b03_reg_pkg_uniq_m
        charge_model: package
        pay_in_advance: true
        invoiceable: false
        regroup_paid_fees: invoice
        properties: {amount: "5", free_units: 0, package_size: 2}
    customer: {external_id: golden_b03_reg_pkg_uniq_m_cust, currency: EUR}
    subscription: {external_id: golden_b03_reg_pkg_uniq_m_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-05T10:00:00Z", do: ingest_events, events: [{code: b03_reg_pkg_uniq_m, properties: {uid: "u1"}}]}
    - {at: "2024-03-06T10:00:00Z", do: ingest_events, events: [{code: b03_reg_pkg_uniq_m, properties: {uid: "u2"}}]}
    - {at: "2024-03-07T10:00:00Z", do: ingest_events, events: [{code: b03_reg_pkg_uniq_m, properties: {uid: "u3"}}]}
    - {at: "2024-03-20T10:00:00Z", do: pay_fees}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {invoice_type: advance_charges}
        invoice_type: advance_charges
        payment_status: succeeded
        fees_amount_cents: 1000
        taxes_amount_cents: 0
        total_amount_cents: 1000
        fees_count: 3
      - select: {invoice_type: subscription}
        invoice_type: subscription
        fees_amount_cents: 0
        total_amount_cents: 0
        fees_count: 1
        fees: [{fee_type: subscription, amount_cents: 0}]
  math: >-
    Three distinct uids take the cumulative unique count to 1, 2, 3 and package_size 2 puts the
    boundary under the third event, so the fees are 500 / 0 / 500 rather than a constant sequence. f
    = ceil(n / 2) × 5.00 (package_service.rb:12-13): f(1) = 5.00, f(2) = 5.00, f(3) = 10.00; deltas
    500, 0, 500¢. The 0¢ middle fee is the discriminating observation - per-event pricing can never
    produce one. Counterfactual: per-event pricing buys a package per uid, 500 × 3 = 1_500¢.
    REGROUPED, not recomputed. invoiceable: false routes the event to Fees::CreatePayInAdvanceJob
    rather than to an invoice (events/pay_in_advance_service.rb:26), and that service persists the
    fee with invoice_id nil and payment_status PENDING (create_pay_in_advance_service.rb:120,151),
    applying taxes there and then because nothing downstream will (:147-148). regroup_paid_fees
    means literally PAID fees: advance_charges_service.rb:69-70 collects only fees whose
    payment_status is succeeded and whose succeeded_at precedes billing_at, which is why this row
    has a pay_fees step - without it no advance_charges invoice is produced at all and the usage is
    silently uninvoiced. At 1 April the 3 fees above are moved onto ONE advance_charges invoice
    (:110-115, update_all invoice_id) totalling 1_000¢, its taxes SUMMED from the fees rather than
    recomputed (AggregateAmountsAndTaxesFromFees at :126, deliberately not ComputeAmountsFromFees)
    and its payment_status stamped succeeded at :130. The row pins the two facts separately, because
    they are two facts: HOW MUCH (the 3 regrouped fees come to 1_000¢, the per-event deltas 500 / 0
    / 500¢) and WHICH invoice carries it (the expectation is selected by invoice_type:
    advance_charges, not by index). fees_count 3 is what separates REGROUPED from
    RECOMPUTED-AT-INVOICE-TIME: the arrears reading of this period comes to the same total (f(3) =
    ceil(3/2) = 2 packages × 5.00 = 1_000¢), so a service that discarded the event-time fees and
    re-derived the period in arrears would land ONE fee of 1_000¢, never 3 unequal ones. The per-fee
    amounts are asserted as a count plus a sum rather than as a fees: list because all 3 fees share
    fee_type, item_code and period boundaries and GoldenRunner::FEE_MATCH_KEYS holds nothing that
    can tell them apart, so a list would be matched positionally against an unordered has_many :fees
    that AdvanceChargesService has just rewritten with update_all. See FINDINGS. The second
    expectation also pins that the usage is not billed TWICE: the period invoice carries only the 0¢
    subscription fee because calculate_fees_service.rb:130 scopes arrears charge fees to
    `invoiceable: true`. `premium: true` is load-bearing - Charges::CreateService assigns
    invoiceable and regroup_paid_fees only under a licence, and advance_charges_service.rb:83
    requires regroup_paid_fees: :invoice, so without the licence there would be no advance_charges
    invoice to select at all.

- id: b03/percentage/count_agg/non-invoiceable-regrouped/one
  block: B3
  axes: {charge_model: percentage, aggregation: count_agg, invoicing: non-invoiceable-regrouped, events: one}
  dimensions: {pay_in_advance: true, invoiceable: false, regroup_paid_fees: invoice, interval: monthly, billing_time: calendar}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    metrics: [{code: b03_reg_pct_cnt_o, aggregation_type: count_agg}]
    plan: {code: golden_b03_reg_pct_cnt_o, interval: monthly, amount_cents: 0}
