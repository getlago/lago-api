    metrics: [{code: b03_reg_grad_uniq_m, aggregation_type: unique_count_agg, field_name: uid}]
    plan: {code: golden_b03_reg_grad_uniq_m, interval: monthly, amount_cents: 0}
    charges:
      - billable_metric_code: b03_reg_grad_uniq_m
        charge_model: graduated
        pay_in_advance: true
        invoiceable: false
        regroup_paid_fees: invoice
        properties:
          graduated_ranges:
            - {from_value: 0, to_value: 2, per_unit_amount: "3", flat_amount: "20"}
            - {from_value: 3, to_value: null, per_unit_amount: "1", flat_amount: "5"}
    customer: {external_id: golden_b03_reg_grad_uniq_m_cust, currency: EUR}
    subscription: {external_id: golden_b03_reg_grad_uniq_m_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-05T10:00:00Z", do: ingest_events, events: [{code: b03_reg_grad_uniq_m, properties: {uid: "u1"}}]}
    - {at: "2024-03-06T10:00:00Z", do: ingest_events, events: [{code: b03_reg_grad_uniq_m, properties: {uid: "u2"}}]}
    - {at: "2024-03-07T10:00:00Z", do: ingest_events, events: [{code: b03_reg_grad_uniq_m, properties: {uid: "u3"}}]}
    - {at: "2024-03-20T10:00:00Z", do: pay_fees}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {invoice_type: advance_charges}
        invoice_type: advance_charges
        payment_status: succeeded
        fees_amount_cents: 3200
        taxes_amount_cents: 0
        total_amount_cents: 3200
        fees_count: 3
      - select: {invoice_type: subscription}
        invoice_type: subscription
        fees_amount_cents: 0
        total_amount_cents: 0
        fees_count: 1
        fees: [{fee_type: subscription, amount_cents: 0}]
  math: >-
    Three distinct uids drive the cumulative unique count to 1, 2, 3 and the third crosses the 0..2
    tier boundary, so the fees are three different numbers. f(1) = 20 + 1×3 = 23.00, f(2) = 20 + 2×3
    = 26.00, f(3) = (20 + 2×3) + (5 + 1×1) = 32.00 (range_graduated_service.rb:54-65: tier 2 is
    non-adjacent, so at total 3 it bills 3 − 3 + 1 = 1 unit); f(0) = 0 by the exclude_event guard.
    Deltas: 23.00 → 2_300¢, 3.00 → 300¢, 6.00 → 600¢. Counterfactual: per-event pricing bills every
    uid as a lone tier-1 unit, 23.00 × 3 = 6_900¢ - more than double, because it re-charges both
    flat fees on each event. REGROUPED, not recomputed. invoiceable: false routes the event to
    Fees::CreatePayInAdvanceJob rather than to an invoice (events/pay_in_advance_service.rb:26), and
    that service persists the fee with invoice_id nil and payment_status PENDING
    (create_pay_in_advance_service.rb:120,151), applying taxes there and then because nothing
    downstream will (:147-148). regroup_paid_fees means literally PAID fees:
    advance_charges_service.rb:69-70 collects only fees whose payment_status is succeeded and whose
    succeeded_at precedes billing_at, which is why this row has a pay_fees step - without it no
    advance_charges invoice is produced at all and the usage is silently uninvoiced. At 1 April the
    3 fees above are moved onto ONE advance_charges invoice (:110-115, update_all invoice_id)
    totalling 3_200¢, its taxes SUMMED from the fees rather than recomputed
    (AggregateAmountsAndTaxesFromFees at :126, deliberately not ComputeAmountsFromFees) and its
    payment_status stamped succeeded at :130. The row pins the two facts separately, because they
    are two facts: HOW MUCH (the 3 regrouped fees come to 3_200¢, the per-event deltas 2_300 / 300 /
    600¢) and WHICH invoice carries it (the expectation is selected by invoice_type:
    advance_charges, not by index). fees_count 3 is what separates REGROUPED from
    RECOMPUTED-AT-INVOICE-TIME: the arrears reading of this period comes to the same total (f(3) =
    (20 + 2×3) + (5 + 1×1) = 32.00 → 3_200¢), so a service that discarded the event-time fees and
    re-derived the period in arrears would land ONE fee of 3_200¢, never 3 unequal ones. The per-fee
    amounts are asserted as a count plus a sum rather than as a fees: list because all 3 fees share
    fee_type, item_code and period boundaries and GoldenRunner::FEE_MATCH_KEYS holds nothing that
    can tell them apart, so a list would be matched positionally against an unordered has_many :fees
    that AdvanceChargesService has just rewritten with update_all. See FINDINGS. The second
    expectation also pins that the usage is not billed TWICE: the period invoice carries only the 0¢
    subscription fee because calculate_fees_service.rb:130 scopes arrears charge fees to
    `invoiceable: true`. `premium: true` is load-bearing - Charges::CreateService assigns
    invoiceable and regroup_paid_fees only under a licence, and advance_charges_service.rb:83
    requires regroup_paid_fees: :invoice, so without the licence there would be no advance_charges
    invoice to select at all.

