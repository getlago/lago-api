    times = 330¢; the unsubtracted cumulative reading gives 0 + 110 + 220 = 330¢ too, and only the
    0¢ opening fee separates the correct answer from both. REGROUPED, not recomputed. invoiceable:
    false routes the event to Fees::CreatePayInAdvanceJob rather than to an invoice
    (events/pay_in_advance_service.rb:26), and that service persists the fee with invoice_id nil and
    payment_status PENDING (create_pay_in_advance_service.rb:120,151), applying taxes there and then
    because nothing downstream will (:147-148). regroup_paid_fees means literally PAID fees:
    advance_charges_service.rb:69-70 collects only fees whose payment_status is succeeded and whose
    succeeded_at precedes billing_at, which is why this row has a pay_fees step - without it no
    advance_charges invoice is produced at all and the usage is silently uninvoiced. At 1 April the
    3 fees above are moved onto ONE advance_charges invoice (:110-115, update_all invoice_id)
    totalling 220¢, its taxes SUMMED from the fees rather than recomputed
    (AggregateAmountsAndTaxesFromFees at :126, deliberately not ComputeAmountsFromFees) and its
    payment_status stamped succeeded at :130. The row pins the two facts separately, because they
    are two facts: HOW MUCH (the 3 regrouped fees come to 220¢, the per-event deltas 0 / 110 / 110¢)
    and WHICH invoice carries it (the expectation is selected by invoice_type: advance_charges, not
    by index). fees_count 3 is what separates REGROUPED from RECOMPUTED-AT-INVOICE-TIME: the arrears
    reading of this period comes to the same total (f(3) = (3−1) × 0.10 + (3−1) × 1.00 = 2.20 →
    220¢), so a service that discarded the event-time fees and re-derived the period in arrears
    would land ONE fee of 220¢, never 3 unequal ones. The per-fee amounts are asserted as a count
    plus a sum rather than as a fees: list because all 3 fees share fee_type, item_code and period
    boundaries and GoldenRunner::FEE_MATCH_KEYS holds nothing that can tell them apart, so a list
    would be matched positionally against an unordered has_many :fees that AdvanceChargesService has
    just rewritten with update_all. See FINDINGS. The second expectation also pins that the usage is
    not billed TWICE: the period invoice carries only the 0¢ subscription fee because
    calculate_fees_service.rb:130 scopes arrears charge fees to `invoiceable: true`. `premium: true`
    is load-bearing - Charges::CreateService assigns invoiceable and regroup_paid_fees only under a
    licence, and advance_charges_service.rb:83 requires regroup_paid_fees: :invoice, so without the
    licence there would be no advance_charges invoice to select at all.

