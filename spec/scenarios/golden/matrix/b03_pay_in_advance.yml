- id: b03/percentage/sum_agg/non-invoiceable-regrouped/many
  block: B3
  axes: {charge_model: percentage, aggregation: sum_agg, invoicing: non-invoiceable-regrouped, events: many}
  dimensions: {pay_in_advance: true, invoiceable: false, regroup_paid_fees: invoice, interval: monthly, billing_time: calendar}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    metrics: [{code: b03_reg_pct_sum_m, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b03_reg_pct_sum_m, interval: monthly, amount_cents: 0}
    charges:
      - billable_metric_code: b03_reg_pct_sum_m
        charge_model: percentage
        pay_in_advance: true
        invoiceable: false
        regroup_paid_fees: invoice
        properties: {rate: "10", fixed_amount: "1", free_units_per_total_aggregation: "20"}
    customer: {external_id: golden_b03_reg_pct_sum_m_cust, currency: EUR}
    subscription: {external_id: golden_b03_reg_pct_sum_m_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-05T10:00:00Z", do: ingest_events, events: [{code: b03_reg_pct_sum_m, properties: {amount: 10}}]}
    - {at: "2024-03-06T10:00:00Z", do: ingest_events, events: [{code: b03_reg_pct_sum_m, properties: {amount: 20}}]}
    - {at: "2024-03-07T10:00:00Z", do: ingest_events, events: [{code: b03_reg_pct_sum_m, properties: {amount: 5}}]}
    - {at: "2024-03-20T10:00:00Z", do: pay_fees}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {invoice_type: advance_charges}
        invoice_type: advance_charges
        payment_status: succeeded
        fees_amount_cents: 350
        taxes_amount_cents: 0
        total_amount_cents: 350
        fees_count: 3
      - select: {invoice_type: subscription}
        invoice_type: subscription
        fees_amount_cents: 0
        total_amount_cents: 0
        fees_count: 1
        fees: [{fee_type: subscription, amount_cents: 0}]
  math: >-
    The 20 free units are the boundary and the SECOND event (cumulative 10 → 30) crosses it, so the
    three fees are three different numbers. sum_service.rb:126-136 accumulates event values and
    stops once the total exceeds the free allowance: running_total is [10] at event 1 and [10, 30]
    at events 2 and 3. free_units_value (percentage_service.rb:70-79) is therefore 10 at event 1
    (last_running_total 10 <= 20) and 20 afterwards; free_units_count (:81-86) is [0,
    1].excluding(0).min = 1 throughout. Including side: f(10) = 0 (free_units_count 1 >= count 1);
    f(30) = (30−20) × 0.10 + (2−1) × 1.00 = 2.00; f(35) = (35−20) × 0.10 + (3−1) × 1.00 = 3.50.
    Excluding side, reusing the including running_total
    (apply_pay_in_advance_charge_model_service.rb:144): 0, then 0, then 2.00. Deltas: 0, 200, 150¢.
    Counterfactual: per-event pricing gives each event its own 20-unit allowance and bills 0¢ for
    all three; the unsubtracted cumulative reading gives 0 + 200 + 350 = 550¢. REGROUPED, not
    recomputed. invoiceable: false routes the event to Fees::CreatePayInAdvanceJob rather than to an
    invoice (events/pay_in_advance_service.rb:26), and that service persists the fee with invoice_id
    nil and payment_status PENDING (create_pay_in_advance_service.rb:120,151), applying taxes there
    and then because nothing downstream will (:147-148). regroup_paid_fees means literally PAID
    fees: advance_charges_service.rb:69-70 collects only fees whose payment_status is succeeded and
    whose succeeded_at precedes billing_at, which is why this row has a pay_fees step - without it
    no advance_charges invoice is produced at all and the usage is silently uninvoiced. At 1 April
    the 3 fees above are moved onto ONE advance_charges invoice (:110-115, update_all invoice_id)
    totalling 350¢, its taxes SUMMED from the fees rather than recomputed
    (AggregateAmountsAndTaxesFromFees at :126, deliberately not ComputeAmountsFromFees) and its
    payment_status stamped succeeded at :130. The row pins the two facts separately, because they
    are two facts: HOW MUCH (the 3 regrouped fees come to 350¢, the per-event deltas 0 / 200 / 150¢)
    and WHICH invoice carries it (the expectation is selected by invoice_type: advance_charges, not
    by index). fees_count 3 is what separates REGROUPED from RECOMPUTED-AT-INVOICE-TIME: the arrears
    reading of this period comes to the same total (f(35, count 3) = (35−20) × 0.10 + (3−1) × 1.00 =
    3.50 → 350¢), so a service that discarded the event-time fees and re-derived the period in
    arrears would land ONE fee of 350¢, never 3 unequal ones. The per-fee amounts are asserted as a
    count plus a sum rather than as a fees: list because all 3 fees share fee_type, item_code and
    period boundaries and GoldenRunner::FEE_MATCH_KEYS holds nothing that can tell them apart, so a
    list would be matched positionally against an unordered has_many :fees that
    AdvanceChargesService has just rewritten with update_all. See FINDINGS. The second expectation
    also pins that the usage is not billed TWICE: the period invoice carries only the 0¢
    subscription fee because calculate_fees_service.rb:130 scopes arrears charge fees to
    `invoiceable: true`. `premium: true` is load-bearing - Charges::CreateService assigns
    invoiceable and regroup_paid_fees only under a licence, and advance_charges_service.rb:83
    requires regroup_paid_fees: :invoice, so without the licence there would be no advance_charges
    invoice to select at all.

- id: b03/percentage/unique_count_agg/non-invoiceable-regrouped/one
  block: B3
  axes: {charge_model: percentage, aggregation: unique_count_agg, invoicing: non-invoiceable-regrouped, events: one}
  dimensions: {pay_in_advance: true, invoiceable: false, regroup_paid_fees: invoice, interval: monthly, billing_time: calendar}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    metrics: [{code: b03_reg_pct_uniq_o, aggregation_type: unique_count_agg, field_name: uid}]
    plan: {code: golden_b03_reg_pct_uniq_o, interval: monthly, amount_cents: 0}
    charges:
      - billable_metric_code: b03_reg_pct_uniq_o
        charge_model: percentage
        pay_in_advance: true
        invoiceable: false
        regroup_paid_fees: invoice
        properties: {rate: "20", fixed_amount: "2"}
    customer: {external_id: golden_b03_reg_pct_uniq_o_cust, currency: EUR}
    subscription: {external_id: golden_b03_reg_pct_uniq_o_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-05T10:00:00Z", do: ingest_events, events: [{code: b03_reg_pct_uniq_o, properties: {uid: "u1"}}]}
    - {at: "2024-03-20T10:00:00Z", do: pay_fees}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {invoice_type: advance_charges}
        invoice_type: advance_charges
        payment_status: succeeded
        fees_amount_cents: 220
        taxes_amount_cents: 0
        total_amount_cents: 220
        fees_count: 1
        fees: [{fee_type: charge, item_code: b03_reg_pct_uniq_o, units: "1.0", events_count: 1, amount_cents: 220}]
      - select: {invoice_type: subscription}
        invoice_type: subscription
        fees_amount_cents: 0
        total_amount_cents: 0
        fees_count: 1
        fees: [{fee_type: subscription, amount_cents: 0}]
  math: >-
    One distinct uid: unique_count_service.rb:32 sets result.count to the unique COUNT rather than
    the raw events_count, so both of percentage's inputs are 1 here. f(1) = (1 - 0) × 20/100 + (1 -
    0) × 2.00 = 2.20 → 220¢ (percentage_service.rb:54-66), against f(0) = 0 (the units.zero? guard
    at :61 kills the fixed term and the percentage term is 0). REGROUPED, not recomputed.
    invoiceable: false routes the event to Fees::CreatePayInAdvanceJob rather than to an invoice
    (events/pay_in_advance_service.rb:26), and that service persists the fee with invoice_id nil and
    payment_status PENDING (create_pay_in_advance_service.rb:120,151), applying taxes there and then
    because nothing downstream will (:147-148). regroup_paid_fees means literally PAID fees:
    advance_charges_service.rb:69-70 collects only fees whose payment_status is succeeded and whose
    succeeded_at precedes billing_at, which is why this row has a pay_fees step - without it no
    advance_charges invoice is produced at all and the usage is silently uninvoiced. At 1 April the
    fee above is moved onto an advance_charges invoice (:110-115, update_all invoice_id) totalling
    220¢, its taxes SUMMED from the fees rather than recomputed (AggregateAmountsAndTaxesFromFees at
    :126, deliberately not ComputeAmountsFromFees) and its payment_status stamped succeeded at :130.
    The row pins the two facts separately, because they are two facts: HOW MUCH (the regrouped fee
    is 220¢) and WHICH invoice carries it (the expectation is selected by invoice_type:
    advance_charges, not by index). With a single event the advance reading and the arrears reading
    are numerically identical (f(1, count 1) = 1 × 20/100 + 1 × 2.00 = 2.20 → 220¢), so what
    distinguishes REGROUPED from RECOMPUTED-AT-INVOICE-TIME here is purely WHERE the money sits: a
    recomputation in arrears would hang a 220¢ charge fee off the period (subscription) invoice, and
    the second expectation asserts that invoice has exactly one fee and it is the 0¢ subscription
    fee. The count discrimination is the many-event sibling's job. The second expectation also pins
    that the usage is not billed TWICE: the period invoice carries only the 0¢ subscription fee
    because calculate_fees_service.rb:130 scopes arrears charge fees to `invoiceable: true`.
    `premium: true` is load-bearing - Charges::CreateService assigns invoiceable and
    regroup_paid_fees only under a licence, and advance_charges_service.rb:83 requires
    regroup_paid_fees: :invoice, so without the licence there would be no advance_charges invoice to
    select at all.

