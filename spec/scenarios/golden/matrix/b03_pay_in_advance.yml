    The FIRST event of a graduated pay-in-advance charge, isolated: 10 units fill tier 1 exactly, so
    f(10) = flat 100.00 + 10 × 2.00 = 120.00 → 12_000¢, and the excluding side is f(0) which
    graduated_service.rb:31 forces to 0 under exclude_event. The single event therefore pays the
    tier-1 flat fee in full. This is the same charge shape as the existing many-event
    b03/graduated/sum_agg/invoiceable row and asserts its FIRST leg standalone, so a regression that
