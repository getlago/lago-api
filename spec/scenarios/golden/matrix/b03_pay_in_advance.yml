# B3 — Pay-in-advance & non-invoiceable
#
# The hottest measured bug cluster: Invoices::CreatePayInAdvanceChargeService (10 fixes),
# Fees::CreatePayInAdvanceService (10) and Invoices::AdvanceChargesService (10).
#
# The `invoicing` axis is what makes this block distinct from B1. A pay-in-advance charge behaves
# in three quite different ways depending on two flags. Note that the amount is always a CUMULATIVE
# DELTA — amount_from_aggregation − amount_excluding_persisted_event — so tier flat fees, package
# boundaries and unique-count dedup all behave per PERIOD, not per event:
#
#   invoiceable: true                          → the event immediately produces its own invoice
#   invoiceable: false, no regroup              → a fee is created and never invoiced at all
#   invoiceable: false, regroup_paid_fees       → fees accumulate and land on an advance_charges
#                                                 invoice at the next billing
#
# Both non-invoiceable modes need `premium: true`: Charges::CreateService only assigns invoiceable
# and regroup_paid_fees under a licence, so without one the flags are silently dropped and the row
# would quietly test the invoiceable path instead. See b14/invoiceable/silently-ignored-*.
#
# Shared conventions: monthly / calendar, plan amount_cents 0, one event of amount 10 on 5 March,
# standard charge at 1.00 per unit → the charge fee is 1_000¢ wherever it appears.
---
- id: b03/standard/sum_agg/invoiceable
  block: B3
  axes: {charge_model: standard, aggregation: sum_agg, invoicing: invoiceable, events: one}
  dimensions: {pay_in_advance: true, invoiceable: true, interval: monthly, billing_time: calendar}
  provenance: coverage-gap
  runners: [rspec, live]
  setup:
    metrics: [{code: b03_inv_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b03_invoiceable, interval: monthly, amount_cents: 0}
    charges:
      - {billable_metric_code: b03_inv_sum, charge_model: standard, pay_in_advance: true, properties: {amount: "1"}}
    customer: {external_id: golden_b03_invoiceable_cust, currency: EUR}
    subscription: {external_id: golden_b03_invoiceable_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b03_inv_sum, properties: {amount: 10}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      select: first
      fees_amount_cents: 1000
      total_amount_cents: 1000
      fees_count: 1
      fees:
        - {fee_type: charge, units: "10.0", amount_cents: 1000}
  math: >-
    An invoiceable pay-in-advance charge bills the moment the event arrives: the first invoice holds
    only that charge fee, 10 units × 1.00 = 10.00 → 1_000¢. The period invoice at 1 April is the
    second, and carries only the 0¢ subscription fee — the charge is not billed twice. Two invoices
    from one event is the shape this row exists to pin.

- id: b03/standard/sum_agg/non-invoiceable-dropped
  block: B3
  axes: {charge_model: standard, aggregation: sum_agg, invoicing: non-invoiceable-dropped, events: one}
  dimensions: {pay_in_advance: true, invoiceable: false, regroup_paid_fees: null, interval: monthly, billing_time: calendar}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    metrics: [{code: b03_drop_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b03_dropped, interval: monthly, amount_cents: 0}
    charges:
      - billable_metric_code: b03_drop_sum
        charge_model: standard
        pay_in_advance: true
        invoiceable: false
        properties: {amount: "1"}
    customer: {external_id: golden_b03_dropped_cust, currency: EUR}
    subscription: {external_id: golden_b03_dropped_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b03_drop_sum, properties: {amount: 10}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      select: last
      fees_amount_cents: 0
      total_amount_cents: 0
      fees_count: 1
      fees:
        - {fee_type: subscription, amount_cents: 0}
  math: >-
    Non-invoiceable and not regrouped: the event still creates a charge fee, but it is never attached
    to any invoice. Only the period invoice exists, carrying the 0¢ subscription fee — the 1_000¢ of
    usage is billed nowhere. That is the intended behaviour for externally-settled charges, and the
    reason the flag needs the regroup companion below to be useful.

- id: b03/standard/sum_agg/non-invoiceable-regrouped
  block: B3
  axes: {charge_model: standard, aggregation: sum_agg, invoicing: non-invoiceable-regrouped, events: one}
  dimensions: {pay_in_advance: true, invoiceable: false, regroup_paid_fees: invoice, interval: monthly, billing_time: calendar}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    metrics: [{code: b03_regroup_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b03_regrouped, interval: monthly, amount_cents: 0}
    charges:
      - billable_metric_code: b03_regroup_sum
        charge_model: standard
        pay_in_advance: true
        invoiceable: false
        regroup_paid_fees: invoice
        properties: {amount: "1"}
    customer: {external_id: golden_b03_regrouped_cust, currency: EUR}
    subscription: {external_id: golden_b03_regrouped_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b03_regroup_sum, properties: {amount: 10}}
    - {at: "2024-03-05T11:00:00Z", do: pay_fees}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      select: {invoice_type: advance_charges}
      invoice_type: advance_charges
      fees_amount_cents: 1000
      total_amount_cents: 1000
      fees_count: 1
      fees:
        - {fee_type: charge, units: "10.0", amount_cents: 1000}
  math: >-
    regroup_paid_fees means literally PAID fees: the fee is created pending, and
    Invoices::AdvanceChargesService only collects fees whose payment_status is succeeded and whose
    succeeded_at precedes the billing timestamp. Hence the pay_fees step — without it no
    advance_charges invoice is produced at all and the usage is silently uninvoiced, which is the
    trap this row exists to document. Once paid, the fee lands on an advance_charges invoice of
    1_000¢; the period invoice is the other of the two. This invoice type deliberately sums the taxes already applied to
    its fees rather than recomputing them (Invoices::AdvanceChargesService uses
    AggregateAmountsAndTaxesFromFees, not ComputeAmountsFromFees).

- id: b03/standard/count_agg/invoiceable
  block: B3
  axes: {charge_model: standard, aggregation: count_agg, invoicing: invoiceable, events: one}
  dimensions: {pay_in_advance: true, invoiceable: true, interval: monthly, billing_time: calendar}
  provenance: coverage-gap
  runners: [rspec, live]
  setup:
    metrics: [{code: 'b03m_b03_count', aggregation_type: 'count_agg'}]
    plan: {code: golden_b03_count, interval: monthly, amount_cents: 0}
    charges:
      - billable_metric_code: b03m_b03_count
        charge_model: standard
        pay_in_advance: true
        properties: {amount: "1"}
    customer: {external_id: golden_b03_count_cust, currency: EUR}
    subscription: {external_id: golden_b03_count_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b03m_b03_count, properties: {amount: 10}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      select: first
      fees_amount_cents: 100
      total_amount_cents: 100
      fees_count: 1
      fees:
        - {fee_type: charge, units: "1.0", amount_cents: 100}
  math: >-
    An invoiceable pay-in-advance charge bills per event, so the aggregation is evaluated over the
    single event that triggered it: count_agg → 1 unit → 1 × 1.00 = 100¢. Contrast the arrears
    count_agg row in B1, where all three events aggregate to 3 units on one period invoice.

