      - select: {invoice_type: advance_charges}
        invoice_type: advance_charges
        payment_status: succeeded
        fees_amount_cents: 2500
        taxes_amount_cents: 0
        total_amount_cents: 2500
        fees_count: 1
        fees: [{fee_type: charge, item_code: b03_reg_dyn_sum_o, units: "10.0", events_count: 1, amount_cents: 2500}]
      - select: {invoice_type: subscription}
        invoice_type: subscription
        fees_amount_cents: 0
        total_amount_cents: 0
        fees_count: 1
        fees: [{fee_type: subscription, amount_cents: 0}]
  math: >-
    Dynamic is the most direct combination in the block: the event carries its own price, so
    dynamic_service.rb:7-12 divides the summed precise_total_amount_cents by the currency subunit
    and the fee is exactly 2_500¢. The excluding side is units 0, where compute_amount
    short-circuits to 0 (:9). Units still come from the metric (sum_agg → 10), so units and amount
    stay decoupled. REGROUPED, not recomputed. invoiceable: false routes the event to
    Fees::CreatePayInAdvanceJob rather than to an invoice (events/pay_in_advance_service.rb:26), and
    that service persists the fee with invoice_id nil and payment_status PENDING
    (create_pay_in_advance_service.rb:120,151), applying taxes there and then because nothing
    downstream will (:147-148). regroup_paid_fees means literally PAID fees:
    advance_charges_service.rb:69-70 collects only fees whose payment_status is succeeded and whose
    succeeded_at precedes billing_at, which is why this row has a pay_fees step - without it no
    advance_charges invoice is produced at all and the usage is silently uninvoiced. At 1 April the
    fee above is moved onto an advance_charges invoice (:110-115, update_all invoice_id) totalling
    2_500¢, its taxes SUMMED from the fees rather than recomputed (AggregateAmountsAndTaxesFromFees
    at :126, deliberately not ComputeAmountsFromFees) and its payment_status stamped succeeded at
    :130. The row pins the two facts separately, because they are two facts: HOW MUCH (the regrouped
    fee is 2_500¢) and WHICH invoice carries it (the expectation is selected by invoice_type:
    advance_charges, not by index). With a single event the advance reading and the arrears reading
    are numerically identical (the summed precise_total_amount_cents, 2_500¢), so what distinguishes
    REGROUPED from RECOMPUTED-AT-INVOICE-TIME here is purely WHERE the money sits: a recomputation
    in arrears would hang a 2_500¢ charge fee off the period (subscription) invoice, and the second
    expectation asserts that invoice has exactly one fee and it is the 0¢ subscription fee. The
    count discrimination is the many-event sibling's job. The second expectation also pins that the
    usage is not billed TWICE: the period invoice carries only the 0¢ subscription fee because
    calculate_fees_service.rb:130 scopes arrears charge fees to `invoiceable: true`. `premium: true`
    is load-bearing - Charges::CreateService assigns invoiceable and regroup_paid_fees only under a
    licence, and advance_charges_service.rb:83 requires regroup_paid_fees: :invoice, so without the
    licence there would be no advance_charges invoice to select at all.

- id: b03/dynamic/sum_agg/non-invoiceable-regrouped/many
  block: B3
  axes: {charge_model: dynamic, aggregation: sum_agg, invoicing: non-invoiceable-regrouped, events: many}
  dimensions: {pay_in_advance: true, invoiceable: false, regroup_paid_fees: invoice, interval: monthly, billing_time: calendar}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    metrics: [{code: b03_reg_dyn_sum_m, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b03_reg_dyn_sum_m, interval: monthly, amount_cents: 0}
    charges:
      - billable_metric_code: b03_reg_dyn_sum_m
        charge_model: dynamic
        pay_in_advance: true
        invoiceable: false
        regroup_paid_fees: invoice
        properties: {}
    customer: {external_id: golden_b03_reg_dyn_sum_m_cust, currency: EUR}
    subscription: {external_id: golden_b03_reg_dyn_sum_m_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b03_reg_dyn_sum_m, properties: {amount: 10}, precise_total_amount_cents: "2500"}]
    - at: "2024-03-06T10:00:00Z"
      do: ingest_events
      events: [{code: b03_reg_dyn_sum_m, properties: {amount: 30}, precise_total_amount_cents: "500"}]
    - at: "2024-03-07T10:00:00Z"
      do: ingest_events
      events: [{code: b03_reg_dyn_sum_m, properties: {amount: 20}, precise_total_amount_cents: "1250"}]
    - {at: "2024-03-20T10:00:00Z", do: pay_fees}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {invoice_type: advance_charges}
        invoice_type: advance_charges
        payment_status: succeeded
        fees_amount_cents: 4250
        taxes_amount_cents: 0
        total_amount_cents: 4250
        fees_count: 3
      - select: {invoice_type: subscription}
        invoice_type: subscription
        fees_amount_cents: 0
        total_amount_cents: 0
        fees_count: 1
        fees: [{fee_type: subscription, amount_cents: 0}]
  math: >-
    Units and price are decoupled on purpose: the events carry amounts 10 / 30 / 20 but prices 2_500
    / 500 / 1_250¢, so no fee can be reconstructed from its units and the three fees are three
    different numbers. dynamic_service.rb:7-12 divides the SUMMED precise_total_amount_cents by the
    currency subunit, and the delta subtracts the event's own contribution
    (apply_pay_in_advance_charge_model_service.rb:64-77 subtracts
    pay_in_advance_precise_total_amount_cents, set from the event at sum_service.rb:83-86): event 1
    = 25.00 − 0, event 2 = 30.00 − 25.00 = 5.00, event 3 = 42.50 − 30.00 = 12.50. Dynamic is the one
    model where delta pricing and per-event pricing provably agree, so the counterfactual worth
    ruling out is the other one: pricing the cumulative precise_total_amount_cents without the
    subtraction would bill 2_500 + 3_000 + 4_250 = 9_750¢. REGROUPED, not recomputed. invoiceable:
    false routes the event to Fees::CreatePayInAdvanceJob rather than to an invoice
    (events/pay_in_advance_service.rb:26), and that service persists the fee with invoice_id nil and
    payment_status PENDING (create_pay_in_advance_service.rb:120,151), applying taxes there and then
    because nothing downstream will (:147-148). regroup_paid_fees means literally PAID fees:
    advance_charges_service.rb:69-70 collects only fees whose payment_status is succeeded and whose
    succeeded_at precedes billing_at, which is why this row has a pay_fees step - without it no
    advance_charges invoice is produced at all and the usage is silently uninvoiced. At 1 April the
    3 fees above are moved onto ONE advance_charges invoice (:110-115, update_all invoice_id)
    totalling 4_250¢, its taxes SUMMED from the fees rather than recomputed
    (AggregateAmountsAndTaxesFromFees at :126, deliberately not ComputeAmountsFromFees) and its
    payment_status stamped succeeded at :130. The row pins the two facts separately, because they
    are two facts: HOW MUCH (the 3 regrouped fees come to 4_250¢, the per-event deltas 2_500 / 500 /
    1_250¢) and WHICH invoice carries it (the expectation is selected by invoice_type:
    advance_charges, not by index). fees_count 3 is what separates REGROUPED from
    RECOMPUTED-AT-INVOICE-TIME: the arrears reading of this period comes to the same total (the
    summed precise_total_amount_cents, 4_250¢), so a service that discarded the event-time fees and
    re-derived the period in arrears would land ONE fee of 4_250¢, never 3 unequal ones. The per-fee
    amounts are asserted as a count plus a sum rather than as a fees: list because all 3 fees share
    fee_type, item_code and period boundaries and GoldenRunner::FEE_MATCH_KEYS holds nothing that
    can tell them apart, so a list would be matched positionally against an unordered has_many :fees
    that AdvanceChargesService has just rewritten with update_all. See FINDINGS. The second
    expectation also pins that the usage is not billed TWICE: the period invoice carries only the 0¢
    subscription fee because calculate_fees_service.rb:130 scopes arrears charge fees to
    `invoiceable: true`. `premium: true` is load-bearing - Charges::CreateService assigns
    invoiceable and regroup_paid_fees only under a licence, and advance_charges_service.rb:83
    requires regroup_paid_fees: :invoice, so without the licence there would be no advance_charges
    invoice to select at all.

