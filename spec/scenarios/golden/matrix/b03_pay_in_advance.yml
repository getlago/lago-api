    - at: "2024-03-06T10:00:00Z"
      do: ingest_events
      events: [{code: b03_inv_dyn_sum_m, properties: {amount: 30}, precise_total_amount_cents: "500"}]
    - at: "2024-03-07T10:00:00Z"
      do: ingest_events
      events: [{code: b03_inv_dyn_sum_m, properties: {amount: 20}, precise_total_amount_cents: "1250"}]
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 4
    invoice:
      - select: {index: 0}
        fees_amount_cents: 2500
        total_amount_cents: 2500
        fees_count: 1
        fees: [{fee_type: charge, units: "10.0", events_count: 1, amount_cents: 2500}]
      - select: {index: 1}
        fees_amount_cents: 500
        total_amount_cents: 500
        fees_count: 1
        fees: [{fee_type: charge, units: "30.0", events_count: 1, amount_cents: 500}]
      - select: {index: 2}
        fees_amount_cents: 1250
        total_amount_cents: 1250
        fees_count: 1
        fees: [{fee_type: charge, units: "20.0", events_count: 1, amount_cents: 1250}]
