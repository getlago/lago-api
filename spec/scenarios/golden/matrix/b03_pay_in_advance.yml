    per-event pricing provably agree, so the counterfactual worth ruling out is the other one: a
    service pricing the cumulative precise_total_amount_cents without the subtraction would bill
    2_500 + 3_000 + 4_250 = 9_750¢. Units still come from sum_agg's per-event delta (10, 30, 20),
    never from the price.

