    precise_total_amount_cents by the currency subunit, and the delta subtracts the event's own
    contribution (apply_pay_in_advance_charge_model_service.rb:64-77 subtracts
    pay_in_advance_precise_total_amount_cents, set from the event at sum_service.rb:83-86):
