  axes: {charge_model: percentage, aggregation: sum_agg, invoicing: non-invoiceable-dropped, events: one}
  dimensions: {pay_in_advance: true, invoiceable: false, regroup_paid_fees: null, interval: monthly, billing_time: calendar}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    metrics: [{code: b03_drp_pct_sum_o, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b03_drp_pct_sum_o, interval: monthly, amount_cents: 0}
    charges:
      - billable_metric_code: b03_drp_pct_sum_o
        charge_model: percentage
        pay_in_advance: true
        invoiceable: false
        properties: {rate: "10", fixed_amount: "1"}
    customer: {external_id: golden_b03_drp_pct_sum_o_cust, currency: EUR}
    subscription: {external_id: golden_b03_drp_pct_sum_o_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-05T10:00:00Z", do: ingest_events, events: [{code: b03_drp_pct_sum_o, properties: {amount: 10}}]}
    - {at: "2024-03-25T10:00:00Z", do: fetch_current_usage}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    resource:
      kind: charge
      code: b03_drp_pct_sum_o
      fields: {charge_model: percentage, pay_in_advance: true, invoiceable: false, regroup_paid_fees: null}
    usage:
      amount_cents: 200
      taxes_amount_cents: 0
      total_amount_cents: 200
      charges_usage:
        - {billable_metric_code: b03_drp_pct_sum_o, units: "10.0", amount_cents: 200}
    invoices: 1
    invoice:
      select: last
      invoice_type: subscription
      fees_amount_cents: 0
      total_amount_cents: 0
      fees_count: 1
      fees: [{fee_type: subscription, amount_cents: 0}]
  math: >-
    Percentage on the single event: 10% of 10 units = 1.00 (percentage_service.rb:54-58,
    free_units_value 0 because running_total is empty at :71 with no free-unit properties set) plus
    the per-event fixed amount (count 1 - 0) × 1.00 = 1.00 (:60-66), total 2.00 → 200¢. The
    excluding side is units 0 / count 0 → 0 via the units.zero? guard at :61. DROPPED. invoiceable:
    false with regroup_paid_fees nil creates the fee and then attaches it to nothing:
    events/pay_in_advance_service.rb:26 routes the event to Fees::CreatePayInAdvanceJob, which
    persists 1 fee(s) worth 200¢ with invoice_id nil (create_pay_in_advance_service.rb:151), and
    nothing ever picks them up - advance_charges_service.rb:83 requires regroup_paid_fees: :invoice,
    and calculate_fees_service.rb:130 scopes arrears charge fees to `invoiceable: true`. So the only
    invoice that exists is the period one, carrying the 0¢ subscription fee, and 200¢ of real usage
    is billed nowhere. An absence assertion on its own would pass for three WRONG reasons, so this
    row pairs it with positive evidence. (a) The events never landed: usage would read 0 units and
    0¢ instead of 10.0 units and 200¢. (b) The charge was never matched at all (wrong metric code or
    field_name): assert_golden_usage raises "no charge usage for metric" rather than comparing
    anything. (c) The licence gate silently dropped invoiceable, so the row was really exercising
    the invoiceable path: expect.resource would read invoiceable true, and the per-event invoices
    would push the count past 1 (compare b14/invoiceable/silently-ignored-*). The usage number is
    independent evidence rather than a restatement of the fee: Fees::ChargeService runs in
    :current_usage context against the ARREARS charge model over the whole aggregation
    (customer_usage_service.rb:129-159), so it reaches 200¢ by a different route - and that it
    equals the sum of the per-event deltas above is the invariant that makes the dropped amount
    unambiguous (f(10, count 1) = 10 × 10/100 + 1 × 1.00 = 2.00 → 200¢). This is NOT the zero-fee
    discard of fees/charge_service.rb:353-360, which drops a fee whose units, amount and
    events_count are ALL zero under context :finalize; here a fee worth 200¢ is built, taxed and
    saved, and simply never invoiced.

