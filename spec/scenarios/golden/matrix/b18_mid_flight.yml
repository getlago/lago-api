- id: b18/tax_rate/before-first-invoice/final
  block: B18
  group: b-inv
  key: b18_tax
  vars: {mut: {at: "2024-03-20T10:00:00Z", do: update_tax, params: {rate: 10}}}
  axes: {mutation: tax_rate, stage: before-first-invoice, observed_via: invoice}
  dimensions: {tax_rate: "20 -> 10", taxes: ~}
  runners: [rspec, live]
  setup:
    taxes: [{code: "%{key}_vat", name: VAT, rate: 20}]
    plan: {code: golden_b18_tax, amount_cents: 0}
    customer: {external_id: golden_b18_tax_cust}
    subscription: {external_id: golden_b18_tax_sub}
  expect:
    invoices: 1
    invoice:
      fees_amount_cents: 10000
      taxes_amount_cents: 1000
      total_amount_cents: 11000
  math: >-
    A tax rate is read when the invoice is built, not when the usage happened. The rate is cut from
    20% to 10% on 20 March, after all the usage was ingested but before the period closes, and the
    1 April invoice taxes the full 10_000¢ at the NEW rate: 1_000¢, total 11_000¢.
    Had the rate been read per event, or snapshotted at subscription time, this would be 2_000¢ and
    12_000¢. fees_amount_cents is asserted with it: all 10_000¢ of usage is on the invoice, so
    1_000¢ of tax can only be 10% of the whole base and not 20% of some part of it.

- id: b18/coupon/between-progressive-invoices/final
  block: B18
  group: p-inv
  key: b18_cpn
  vars: {mut: {at: "2024-03-10T10:00:00Z", do: update_coupon, params: {name: "b18 coupon raised", amount_cents: 9000}}}
  axes: {mutation: coupon, stage: between-progressive-invoices, observed_via: invoice}
  dimensions: {threshold_amount_cents: 5000}
  premium: true
  no_transaction: true
  setup:
    plan: {code: golden_b18_coupon}
    customer: {external_id: golden_b18_coupon_cust}
    subscription: {external_id: golden_b18_coupon_sub}
    coupons: [{name: "b18 coupon", code: b18_coupon, coupon_type: fixed_amount, frequency: recurring, frequency_duration: 5, amount_cents: 2000, amount_currency: EUR, expiration: no_expiration}]
  expect:
    invoices: 3
    invoice:
      - select: {invoice_type: progressive_billing, index: 0}
        fees_amount_cents: 6000
        coupons_amount_cents: 2000
        total_amount_cents: 4000
      - select: {invoice_type: progressive_billing, index: 1}
        fees_amount_cents: 13000
        coupons_amount_cents: 2000
        progressive_billing_credit_amount_cents: 4000
        total_amount_cents: 7000
      - select: {invoice_type: subscription}
        fees_amount_cents: 13000
        coupons_amount_cents: 2000
        progressive_billing_credit_amount_cents: 11000
        total_amount_cents: 0
  math: >-
    The coupon is edited between two threshold invoices, from 2_000¢ to 9_000¢, and NOTHING changes:
    all three invoices still discount 2_000¢.
    AppliedCoupon copies amount_cents, percentage_rate, frequency and frequency_duration at
    application time (visible in PreviewContextService#find_or_build_applied_coupons, which
    reconstructs one the same way), so a customer's discount is fixed when the coupon is applied to
    them. Editing the coupon changes what FUTURE applications get, not this one. A read-through would
    make the second threshold invoice discount 9_000¢ and the period invoice do the same.
    The rest is the two-threshold shape: 60 units crosses 5_000¢ → first threshold invoice bills
    6_000¢, less 2_000¢ coupon = 4_000¢ paid. 70 more units takes cumulative usage to 13_000¢, past
    the 12_000¢ threshold → second threshold invoice bills the cumulative 13_000¢, credits the 4_000¢
    collected (`fees - coupons` = 6_000 - 2_000) and applies the coupon again (it is `recurring` over
    5 periods) → 7_000¢. The period invoice bills 13_000¢, credits 4_000 + 7_000 = 11_000¢ already
    collected and discounts 2_000¢ once more, settling at 0.

- id: b18/tax_rate/on-draft/regenerated
  block: B18
  group: o-reg2
  key: b18_draft
  vars: {mut: {at: "2024-04-02T10:00:00Z", do: update_tax, params: {rate: 10}}}
  axes: {mutation: tax_rate, stage: on-draft, observed_via: regenerated}
  dimensions: {tax_rate: "20 -> 10"}
  premium: true
  setup:
    taxes: [{code: "%{key}_vat", name: VAT, rate: 20}]
    plan: {code: golden_b18_draft, amount_cents: 0}
    customer: {external_id: golden_b18_draft_cust, invoice_grace_period: 5}
    subscription: {external_id: golden_b18_draft_sub}
  expect:
    invoices: 1
    invoice:
      status: draft
      fees_amount_cents: 10000
      taxes_amount_cents: 1000
      total_amount_cents: 11000
  math: >-
    The regenerate path, end to end: a draft is not a snapshot but a recomputation, which is the whole
    reason a grace period exists.
    Under a 5-day grace period the 1 April invoice stays `draft`, taxed at 20% → 2_000¢, total
    12_000¢. The rate is then cut to 10%. Taxes::UpdateService flags the customer's draft invoices
    `ready_to_be_refreshed`, Clock::RefreshDraftInvoicesJob picks them up, and the draft is rebuilt at
    the new rate: 1_000¢ of tax, 11_000¢ total. Fees are asserted unchanged at 10_000¢ so the row
    distinguishes "re-taxed" from "re-billed".
    Without the flag the refresh job would never see the invoice — see
    b18/charge_amount/on-draft/regenerated, where exactly that happens.

- id: b18/charge_amount/after-finalize/final
  block: B18
  group: f-inv
  key: b18_fin
  vars: {mut: {at: "2024-04-02T10:00:00Z", do: update_plan_charge, charge: {billable_metric_code: b18_fin_sum, charge_model: standard, properties: {amount: "3"}}}}
  axes: {mutation: charge_amount, stage: after-finalize, observed_via: invoice}
  dimensions: {grace_period: none}
  runners: [rspec, live]
  setup:
    plan: {code: golden_b18_final, amount_cents: 0}
    customer: {external_id: golden_b18_final_cust}
    subscription: {external_id: golden_b18_final_sub}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-05T10:00:00Z", do: ingest_events, events: [{code: "%{key}_sum", properties: {amount: 100}}]}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - "%{mut}"
    - {at: "2024-04-02T11:00:00Z", do: perform_invoices_refresh}
  expect:
    invoices: 1
    invoice:
      status: finalized
      fees_amount_cents: 10000
      total_amount_cents: 10000
  math: >-
    The negative control for b18/charge_amount/on-draft/regenerated, and the more important of the
    two: an issued invoice must not move when the price list changes.
    With no grace period the 1 April invoice is `finalized` immediately. The same repricing to 3.00
    per unit is applied and the refresh clock job run — Invoices::RefreshDraftService operates on
    drafts only, so the invoice keeps its 10_000¢. If this row ever reads 30_000¢, Lago is retroacting
    a price change onto money already invoiced.

- id: b18/grace_period/on-draft/final
  block: B18
  group: o-inv
  key: grace
  vars: {mut: {at: "2024-04-02T10:00:00Z", do: update_customer, params: {invoice_grace_period: 0}}}
  axes: {mutation: grace_period, stage: on-draft, observed_via: invoice}
  dimensions: {grace_period: "5 -> 0"}
  runners: [rspec, live]
  premium: true
  setup:
    metrics: [{code: b18_gp_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {amount_cents: 0}
    charges: [{billable_metric_code: b18_gp_sum, charge_model: standard, properties: {amount: "1"}}]
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-05T10:00:00Z", do: ingest_events, events: [{code: b18_gp_sum, properties: {amount: 100}}]}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - "%{mut}"
    - {at: "2024-04-02T11:00:00Z", do: perform_finalize_refresh}
  expect:
    invoices: 1
    invoice:
      status: finalized
      fees_amount_cents: 10000
      total_amount_cents: 10000
  math: >-
    Shortening the grace period is what closes a draft, so this row proves the setting is acted upon
    rather than merely stored. The 1 April invoice sits in `draft` under a 5-day grace period; the
    period is then set to 0 and the finalize-refresh clock run, and the invoice becomes `finalized`
    with its amounts unchanged at 10_000¢.
    Rows write `invoice_grace_period` flat and the runner nests it under `billing_configuration`,
    which the API requires in both directions. Sent at the top level it is dropped by strong params
    with an HTTP 200, and the failure mode is the nastiest kind: the customer gets NO grace period,
    the invoice is finalized immediately, and a row asserting `finalized` passes while never having
    tested anything. That is exactly how the first draft of this row passed —
    b18/charge_amount/on-draft/regenerated, which needs a real draft, is what caught it.
    `premium: true` for the same reason: the field is discarded without a licence.

- id: b18/charge_amount/on-draft/regenerated
  block: B18
  group: o-reg2
  key: b18_amt
  vars: {mut: {at: "2024-04-02T10:00:00Z", do: update_plan_charge, charge: {billable_metric_code: b18_amt_sum, charge_model: standard, properties: {amount: "3"}}}}
  axes: {mutation: charge_amount, stage: on-draft, observed_via: regenerated}
  dimensions: {taxes: none}
  provenance: characterization
  premium: true
  characterization: true
  setup:
    plan: {code: golden_b18_amount, amount_cents: 0}
    customer: {external_id: golden_b18_amount_cust, invoice_grace_period: 5}
    subscription: {external_id: golden_b18_amount_sub}
  expect:
    invoices: 1
    invoice:
      status: draft
      fees_amount_cents: 10000
      total_amount_cents: 10000
  math: >-
    CHARACTERIZATION — repricing a charge does not reach a draft that is already open, and this row
    records that rather than endorsing it.
    Same shape as b18/tax_rate/on-draft/regenerated: a draft held by a 5-day grace period, the
    configuration corrected, the refresh clock run. Changing the TAX rate rebuilds the draft.
    Changing the CHARGE price does not: the draft still reads 10_000¢ at the old 1.00 per unit,
    though a refresh would produce 30_000¢.
    Cause: `Invoice.ready_to_be_refreshed` is a flag, and only some writers set it.
    Plans::UpdateService (update_service.rb:82), Taxes::UpdateService (:30), Taxes::DestroyService,
    BillableMetrics::DestroyService and Customers::ApplyTaxesService all flag the customer's drafts.
    Charges::UpdateService does not — so Clock::RefreshDraftInvoicesJob never sees the invoice.
    The asymmetry is the finding: the same repricing reaches the draft through
    `PUT /plans/:code` (Plans::UpdateService, which flags) and does not through
    `PUT /plans/:code/charges/:code`. Two endpoints for one intent, two outcomes, and the grace period
    silently stops being a correction window for the one people reach for.

- id: b18/plan_amount/on-draft/regenerated
  block: B18
  group: o-reg
  key: plan
  vars: {mut: {at: "2024-04-02T10:00:00Z", do: update_plan, params: {amount_cents: 9000}}}
  axes: {mutation: plan_amount, stage: on-draft, observed_via: regenerated}
  runners: [rspec, live]
  premium: true
  setup:
    metrics: ~
    charges: ~
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - "%{mut}"
    - {at: "2024-04-02T11:00:00Z", do: perform_invoices_refresh}
  expect:
    invoices: 1
    invoice:
      status: draft
      fees_amount_cents: 9000
      total_amount_cents: 9000
  math: >-
    The positive half of the draft-refresh asymmetry, and the direct comparison that makes
    b18/charge_amount/on-draft/regenerated a finding rather than a design choice.
    A 5_000¢ monthly plan bills 5_000¢ into a draft held by a 5-day grace period. The plan price is
    raised to 9_000¢ through `PUT /plans/:code`, and because Plans::UpdateService flags the plan's
    draft invoices `ready_to_be_refreshed` (update_service.rb:82) the refresh job rebuilds the draft
    at 9_000¢.
    The identical intent expressed through `PUT /plans/:code/charges/:code` does not reach the draft
    at all, because Charges::UpdateService sets no such flag. Same grace period, same refresh, two
    endpoints, two answers.
    The plan carries no charges on purpose: `PUT /plans/:code` replaces the plan wholesale, so a
    charge-bearing plan would have its charges deleted by this call and the row would be measuring
    that instead.

- id: b18/plan_amount/after-finalize/final
  block: B18
  group: f-inv
  key: plan_fin
  vars: {mut: {at: "2024-04-02T10:00:00Z", do: update_plan, params: {amount_cents: 9000}}}
  axes: {mutation: plan_amount, stage: after-finalize, observed_via: invoice}
  dimensions: {grace_period: none}
  runners: [rspec, live]
  setup:
    metrics: ~
    charges: ~
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - "%{mut}"
    - {at: "2024-04-02T11:00:00Z", do: perform_invoices_refresh}
  expect:
    invoices: 1
    invoice:
      status: finalized
      fees_amount_cents: 5000
      total_amount_cents: 5000
  math: >-
    The control for the row above, and the one that would matter most if it broke. With no grace
    period the invoice is finalized on 1 April at 5_000¢. Plans::UpdateService then flags draft
    invoices — this one is not a draft, so the flag cannot reach it, and Invoices::RefreshDraftService
    operates on drafts regardless. The invoice stays at 5_000¢.
    A failure here means a price change retroacting onto money already invoiced, which is worse than
    any amount the suite gets wrong in the other direction.

- id: b18/tax_rate/before-first-invoice/preview
  block: B18
  group: b-pre
  key: b18_pv
  vars: {mut: {at: "2024-03-20T10:00:00Z", do: update_tax, params: {rate: 10}}}
  axes: {mutation: tax_rate, stage: before-first-invoice, observed_via: preview}
  dimensions: {tax_rate: "20 -> 10", taxes: ~}
  premium: true
  calendar_sensitive: true
  setup:
    taxes: [{code: "%{key}_vat", name: VAT, rate: 20}]
    plan: {code: golden_b18_preview, amount_cents: 0}
    customer: {external_id: golden_b18_preview_cust}
    subscription: {external_id: golden_b18_preview_sub}
  expect:
    invoices: 1
    invoice:
      fees_amount_cents: 10000
      taxes_amount_cents: 1000
      total_amount_cents: 11000
    preview:
      fees_amount_cents: 10000
      taxes_amount_cents: 1000
      total_amount_cents: 11000
  math: >-
    A preview is a quote, so it is the surface a customer sees BEFORE the invoice exists, and a rate
    change between quote and invoice is the obvious way for the two to disagree.
    The rate is cut from 20% to 10% on 20 March, after all the usage and before the period closes. The
    preview on 25 March and the invoice on 1 April must both read the new rate: 10_000¢ of usage,
    1_000¢ of tax, 11_000¢ total. Asserted on both sides with identical numbers, so a preview that
    kept the old 20% shows up as 2_000¢ against 1_000¢ rather than as a plausible-looking quote.
    Pairs with b18/tax_rate/before-first-invoice/final, which asserts the invoice alone: that row says
    the rate is read at build time, this one says the quote is built the same way.

- id: b18/tax_rate/before-first-invoice/draft
  block: B18
  group: b-dra
  key: btr_dra
  vars: {mut: {at: "2024-03-20T10:00:00Z", do: update_tax, params: {rate: 10}}}
  axes: {mutation: tax_rate, stage: before-first-invoice, observed_via: draft}
  dimensions: {tax_rate: "20 -> 10", taxes: ~}
  premium: true
  calendar_sensitive: true
  setup:
    taxes: [{code: "%{key}_vat", name: VAT, rate: 20}]
  expect:
    invoices: 1
    invoice:
      status: draft
      fees_amount_cents: 15000
      taxes_amount_cents: 1500
      total_amount_cents: 16500
  math: >-
    A rate cut from 20% to 10% lands before anything is billed, so there is nothing yet for it to
    disagree with — every surface must show the new rate.
    5_000¢ subscription + 100 units = 15000¢ of fees, taxed at 10% = 1_500¢ → 16_500¢.
    Tax is the one thing a draft computes exactly as a finalized invoice does: it is applied by
    ComputeTaxesAndTotalsService before the finalizing gate that withholds coupons, credit notes and
    prepaid credit, which is why this family reads the same on all four surfaces while the coupon and
    wallet families below do not.

