- id: b18/coupon/before-first-invoice/final
  block: B18
  group: b-inv
  key: bcp_fin
  vars: {mut: {at: "2024-03-20T10:00:00Z", do: update_coupon, params: {name: "b18 coupon raised", amount_cents: 9000}}}
  axes: {mutation: coupon, stage: before-first-invoice, observed_via: invoice}
  dimensions: {coupon: "2000 -> 9000"}
  premium: true
  calendar_sensitive: true
  setup:
    coupons: [{name: "b18 coupon", code: "%{key}_coupon", coupon_type: fixed_amount, frequency: recurring, frequency_duration: 3, amount_cents: 2000, amount_currency: EUR, expiration: no_expiration}]
  expect:
    invoices: 1
    invoice:
      status: finalized
      fees_amount_cents: 15000
      coupons_amount_cents: 2000
      total_amount_cents: 13000
  math: >-
    Raising the coupon from 2_000¢ to 9_000¢ before the first invoice changes NOTHING: the
    customer still gets 2_000¢ off.
    AppliedCoupon copies amount, percentage, frequency and duration when the coupon is applied to
    the customer, so an edit reaches only future applications. 15_000¢ of fees less 2_000¢ = 13_000¢.
    b18/coupon/between-progressive-invoices/final asserts the same snapshot across two threshold
    invoices; this row establishes it at the simplest possible moment.

- id: b18/coupon/before-first-invoice/draft
  block: B18
  group: b-dra
  key: bcp_dra
  vars: {mut: {at: "2024-03-20T10:00:00Z", do: update_coupon, params: {name: "b18 coupon raised", amount_cents: 9000}}}
  axes: {mutation: coupon, stage: before-first-invoice, observed_via: draft}
  dimensions: {coupon: "2000 -> 9000"}
  premium: true
  calendar_sensitive: true
  setup:
    coupons: [{name: "b18 coupon", code: "%{key}_coupon", coupon_type: fixed_amount, frequency: recurring, frequency_duration: 3, amount_cents: 2000, amount_currency: EUR, expiration: no_expiration}]
  expect:
    invoices: 1
    invoice:
      status: draft
      fees_amount_cents: 15000
      coupons_amount_cents: 0
      total_amount_cents: 15000
  math: >-
    The draft shows NO discount at all — 15_000¢ where the customer will be billed 13_000¢.
    `should_create_coupon_credit?` returns false unless the invoice is finalizing
    (calculate_fees_service.rb:368), so coupons are allocated only at finalization. That is what
    stops a grace-period draft from consuming a `once` coupon that a later refresh would have to
    give back, and it is why coupons_amount_cents is asserted as 0 rather than omitted.

- id: b18/coupon/before-first-invoice/regenerated
  block: B18
  group: b-reg
  key: bcp_reg
  vars: {mut: {at: "2024-03-20T10:00:00Z", do: update_coupon, params: {name: "b18 coupon raised", amount_cents: 9000}}}
  axes: {mutation: coupon, stage: before-first-invoice, observed_via: regenerated}
  dimensions: {coupon: "2000 -> 9000"}
  premium: true
  calendar_sensitive: true
  setup:
    coupons: [{name: "b18 coupon", code: "%{key}_coupon", coupon_type: fixed_amount, frequency: recurring, frequency_duration: 3, amount_cents: 2000, amount_currency: EUR, expiration: no_expiration}]
  expect:
    invoices: 1
    invoice:
      status: draft
      fees_amount_cents: 15000
      coupons_amount_cents: 0
      total_amount_cents: 15000
  math: >-
    Refreshing the draft does not change it: still 15_000¢, still no coupon.
    A refresh rebuilds the invoice from current configuration, but it rebuilds it as a DRAFT, so
    the finalizing gate still withholds the coupon. Only finalization applies it — which is what
    b18/coupon/before-first-invoice/final shows at 13_000¢.

- id: b18/coupon/before-first-invoice/preview
  block: B18
  group: b-pre
  key: bcp_pre
  vars: {mut: {at: "2024-03-20T10:00:00Z", do: update_coupon, params: {name: "b18 coupon raised", amount_cents: 9000}}}
  axes: {mutation: coupon, stage: before-first-invoice, observed_via: preview}
  dimensions: {coupon: "2000 -> 9000"}
  premium: true
  calendar_sensitive: true
  setup:
    coupons: [{name: "b18 coupon", code: "%{key}_coupon", coupon_type: fixed_amount, frequency: recurring, frequency_duration: 3, amount_cents: 2000, amount_currency: EUR, expiration: no_expiration}]
  expect:
    invoices: 1
    preview:
      fees_amount_cents: 15000
      coupons_amount_cents: 2000
      total_amount_cents: 13000
  math: >-
    The quote agrees with the invoice: 2_000¢ off, not the 9_000¢ the coupon now says.
    PreviewContextService#find_or_build_applied_coupons reads the customer's ALREADY APPLIED
    coupons and only falls back to constructing one from the coupon definition when there are
    none — so a preview reproduces the snapshot rather than the current terms.

- id: b18/wallet_balance/before-first-invoice/final
  block: B18
  group: b-inv
  key: bwb_fin
  vars: {mut: {at: "2024-03-20T10:00:00Z", do: top_up_wallet, params: {granted_credits: "50"}}}
  axes: {mutation: wallet_balance, stage: before-first-invoice, observed_via: invoice}
  dimensions: {wallet_credits: "30 -> 80"}
  premium: true
  calendar_sensitive: true
  setup:
    wallets: [{name: granted, rate_amount: "1", currency: EUR, granted_credits: "30"}]
  expect:
    invoices: 1
    invoice:
      status: finalized
      fees_amount_cents: 15000
      prepaid_credit_amount_cents: 8000
      total_amount_cents: 7000
  math: >-
    A wallet topped up mid-period pays with everything it holds at billing time, not with what
    it held when the subscription started: 30 granted credits plus 50 more = 8_000¢ against
    15_000¢ of fees, leaving 7_000¢.
    Granted credits are spendable immediately. Purchased ones are not until the top-up invoice is
    settled, which is the distinction B6 covers and the reason this row grants rather than sells.

- id: b18/wallet_balance/before-first-invoice/draft
  block: B18
