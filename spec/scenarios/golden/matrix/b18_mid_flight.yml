- id: b18/plan_amount/between-progressive-invoices/final
  block: B18
  group: p-inv
  key: ppa_fin
  vars: {mut: {at: "2024-03-10T10:00:00Z", do: update_plan, params: {amount_cents: 9000}}}
  axes: {mutation: plan_amount, stage: between-progressive-invoices, observed_via: invoice}
  dimensions: {plan_amount: "0 -> 9000"}
  premium: true
  calendar_sensitive: true
  no_transaction: true
  expect:
    invoices: 3
    invoice:
      - select: {invoice_type: subscription}
        status: finalized
        fees_amount_cents: 22000
        progressive_billing_credit_amount_cents: 13000
        sub_total_excluding_taxes_amount_cents: 9000
        total_amount_cents: 9000
  math: >-
    Two threshold invoices with the edit landing between them, so the question is not just whether the
    mutation applies but which of the two already-issued demands it can still reach.
    60 units on 5 March cross the 5_000¢ threshold and are billed at once; 70 more on 15 March take
