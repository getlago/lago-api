- id: b18/charge_amount/before-first-invoice/final
  block: B18
  group: b-inv
  key: bca_fin
  vars: {mut: {at: "2024-03-20T10:00:00Z", do: update_plan_charge, charge: {billable_metric_code: bca_fin_sum, charge_model: standard, properties: {amount: "3"}}}}
  axes: {mutation: charge_amount, stage: before-first-invoice, observed_via: invoice}
  dimensions: {charge_amount: "1 -> 3"}
  premium: true
  calendar_sensitive: true
  expect:
    invoices: 1
    invoice:
      status: finalized
      fees_amount_cents: 35000
      total_amount_cents: 35000
  math: >-
    Repricing a charge before the period is billed reaches every surface, because none of them
    existed yet to be left stale.
    100 units re-rated from 1.00 to 3.00 = 30_000¢, plus the 5_000¢ subscription fee = 35_000¢.
    Contrast b18/charge_amount/on-draft/regenerated, where the identical edit AFTER the draft exists
    never reaches it: Charges::UpdateService sets no `ready_to_be_refreshed` flag, so the refresh job
    never picks the invoice up. Timing, not the edit, is what decides.

