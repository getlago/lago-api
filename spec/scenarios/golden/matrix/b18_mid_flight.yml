    cumulative usage to 13_000¢, past the 12_000¢ threshold, and the second demand credits what the
    first collected. The period invoice on 1 April then credits what the SECOND collected —
    `to_credit_amount` reads the most recent threshold invoice, net of its own coupons and credit notes
    but not of credits granted against it, which is why it is 13_000¢ and not 7_000¢.
    Raising the coupon between the demands changes nothing: 2_000¢ comes off each of the three
    invoices, never 9_000¢, because AppliedCoupon fixed the terms when it was applied.
    The coupon also shrinks what carries forward. `to_credit_amount` subtracts the second demand's
    coupon, so the period invoice credits 13_000 - 2_000 = 11_000¢ rather than the full 13_000¢ —
    the discount is deducted from the credit as well as from the bill, which b15/coupon/
    progressive_billing reports as a finding in its own right.
    Observed as a quote taken before the period closes. Preview reimplements the pipeline in
    Invoices::PreviewService, so it credits progressive billing at invoice level — added in this
    session — and applies the reducers a draft withholds.

- id: b18/tax_rate/between-progressive-invoices/final
  block: B18
  group: p-inv
  key: ptr_fin
  vars: {mut: {at: "2024-03-10T10:00:00Z", do: update_tax, params: {rate: 10}}}
  axes: {mutation: tax_rate, stage: between-progressive-invoices, observed_via: invoice}
  dimensions: {tax_rate: "20 -> 10", taxes: ~}
  premium: true
  calendar_sensitive: true
  no_transaction: true
  setup:
    taxes: [{code: "%{key}_vat", name: VAT, rate: 20}]
  expect:
    invoices: 3
    invoice:
      - select: {invoice_type: progressive_billing, index: 0}
        fees_amount_cents: 6000
        taxes_amount_cents: 1200
        total_amount_cents: 7200
      - select: {invoice_type: progressive_billing, index: 1}
        fees_amount_cents: 13000
        progressive_billing_credit_amount_cents: 6000
        sub_total_excluding_taxes_amount_cents: 7000
        taxes_amount_cents: 700
        total_amount_cents: 7700
      - select: {invoice_type: subscription}
        status: finalized
        fees_amount_cents: 13000
        progressive_billing_credit_amount_cents: 13000
        sub_total_excluding_taxes_amount_cents: 0
        taxes_amount_cents: 0
        total_amount_cents: 0
  math: >-
    A rate cut landing between two threshold invoices, which is the only stage where the same period
    carries two different tax rates.
    The first demand is cut on 5 March at 20%: 60 units = 6_000¢ plus 1_200¢ of tax = 7_200¢. The rate
    drops to 10% on 10 March. The second demand on 15 March bills the cumulative 13_000¢, credits the
    6_000¢ the first collected, and taxes the 7_000¢ that remains at the NEW rate = 700¢ → 7_700¢.
    Tax is read when each invoice is built, so a single period is legitimately taxed at two rates,
    each correct for the moment its demand was issued.
    The period invoice then credits the 13_000¢ the second demand collected, leaving a 0¢ base
    and 0¢ of tax — nothing further is owed and nothing further is taxed. All three invoices are
    asserted because the story is the sequence: 1_200¢ at the old rate, 700¢ at the new one, and
    nothing left to tax.
    Note the fee-level clamp does no harm here. `apply_credit_to_fees` writes the second demand's
    13_000¢ into the period invoice's charge fee, zeroing its taxable base — and the invoice's own
    base is 0 too, so the two agree. The clamp only misprices when a coupon or credit note has made
    `to_credit_amount` smaller than the amount billed, which is b17/pb-coupon-tax/invoice.

