- id: b18/grace_period/before-first-invoice/final
  block: B18
  group: b-inv
  key: bgp_fin
  vars: {mut: {at: "2024-03-20T10:00:00Z", do: update_customer, params: {invoice_grace_period: 5}}}
  axes: {mutation: grace_period, stage: before-first-invoice, observed_via: invoice}
  dimensions: {grace_period: "0 -> 5"}
  premium: true
  calendar_sensitive: true
  setup:
    customer: {invoice_grace_period: 0}
  expect:
    invoices: 1
    invoice:
      status: draft
      fees_amount_cents: 15000
      total_amount_cents: 15000
  math: >-
    The same edit read from the other end: with the grace period granted the invoice is NOT
    finalized on 1 April, so a row asserting `finalized` here would be asserting that the
    mutation failed. It asserts the amounts instead, unchanged at 15_000¢ — a grace period moves
    WHEN an invoice is issued and never WHAT it says.
    b18/grace_period/on-draft/final is the closing half: grace set back to 0 and the draft finalized.

- id: b18/grace_period/before-first-invoice/draft
  block: B18
  group: b-dra
  key: bgp_dra
  vars: {mut: {at: "2024-03-20T10:00:00Z", do: update_customer, params: {invoice_grace_period: 5}}}
  axes: {mutation: grace_period, stage: before-first-invoice, observed_via: draft}
  dimensions: {grace_period: "0 -> 5"}
  premium: true
  calendar_sensitive: true
  setup:
    customer: {invoice_grace_period: 0}
  expect:
    invoices: 1
    invoice:
      status: draft
      fees_amount_cents: 15000
      total_amount_cents: 15000
  math: >-
    Granting a grace period before the period closes is what makes the invoice a draft at all.
    The customer starts on 0 days and is moved to 5 on 20 March, so the 1 April invoice is held
    open instead of being issued: same 15_000¢, different status, and the status is the assertion.
    invoice_grace_period is written flat by rows and nested under billing_configuration by the
    runner; sent top-level to the API it is dropped silently with a 200, and the invoice would
    finalize while the row still claimed to be testing a draft.

- id: b18/grace_period/before-first-invoice/regenerated
  block: B18
  group: b-reg
  key: bgp_reg
  vars: {mut: {at: "2024-03-20T10:00:00Z", do: update_customer, params: {invoice_grace_period: 5}}}
  axes: {mutation: grace_period, stage: before-first-invoice, observed_via: regenerated}
  dimensions: {grace_period: "0 -> 5"}
  premium: true
  calendar_sensitive: true
  setup:
    customer: {invoice_grace_period: 0}
  expect:
    invoices: 1
    invoice:
      status: draft
      fees_amount_cents: 15000
      total_amount_cents: 15000
  math: >-
    The draft the grace period created, rebuilt by refresh: still open, still 15_000¢.
    A refresh recomputes an invoice from current configuration but cannot close it — only
    finalization does that — so the grace period survives the round trip.

- id: b18/grace_period/before-first-invoice/preview
  block: B18
  group: b-pre
  key: bgp_pre
  vars: {mut: {at: "2024-03-20T10:00:00Z", do: update_customer, params: {invoice_grace_period: 5}}}
  axes: {mutation: grace_period, stage: before-first-invoice, observed_via: preview}
  dimensions: {grace_period: "0 -> 5"}
  premium: true
  calendar_sensitive: true
  setup:
    customer: {invoice_grace_period: 0}
  expect:
    invoices: 1
    preview:
      fees_amount_cents: 15000
      total_amount_cents: 15000
  math: >-
    A preview ignores the grace period entirely: it forecasts the period's amounts, and the
    grace period governs only when the resulting invoice is issued. 15_000¢ either way.
    This is the cell that says the two settings are orthogonal, which is easy to assume and
    nowhere else asserted.

- id: b18/tax_rate/after-finalize/final
  block: B18
  group: f-inv
  key: ftr_fin
  vars: {mut: {at: "2024-04-02T10:00:00Z", do: update_tax, params: {rate: 10}}}
  axes: {mutation: tax_rate, stage: after-finalize, observed_via: invoice}
  dimensions: {tax_rate: "20 -> 10", taxes: ~}
  premium: true
  calendar_sensitive: true
  setup:
    taxes: [{code: "%{key}_vat", name: VAT, rate: 20}]
  expect:
    invoices: 1
    invoice:
      status: finalized
      fees_amount_cents: 15000
      taxes_amount_cents: 3000
      total_amount_cents: 18000
  math: >-
    A rate cut after the invoice is issued must not reach it. March was taxed at 20% —
    15_000¢ of fees, 3_000¢ of tax, 18_000¢ — and stays there even after the rate drops to 10%
    and a refresh is attempted: Invoices::RefreshDraftService operates on drafts only.
    Taxes::UpdateService does flag draft invoices for refresh, so this row is the proof that the
    flag cannot reach a finalized one. A failure here is retroactive re-taxation of money
    already invoiced.

- id: b18/tax_rate/after-finalize/preview
  block: B18
  group: f-pre
  key: ftr_pre
  vars: {mut: {at: "2024-04-02T10:00:00Z", do: update_tax, params: {rate: 10}}}
  axes: {mutation: tax_rate, stage: after-finalize, observed_via: preview}
  dimensions: {tax_rate: "20 -> 10", taxes: ~}
  premium: true
  calendar_sensitive: true
  setup:
    taxes: [{code: "%{key}_vat", name: VAT, rate: 20}]
  expect:
    preview:
      fees_amount_cents: 15000
      taxes_amount_cents: 1500
      total_amount_cents: 16500
  math: >-
    The same edit seen from the next period: the quote for April uses the NEW 10% rate,
    1_500¢ on 15_000¢ of fees.
    So one rate change produces two correct answers at once — March keeps 3_000¢ because it was
    already issued, April is quoted 1_500¢ because it has not been. The pairing is the point:
    neither number alone shows that the boundary is drawn at issuance.

- id: b18/charge_amount/after-finalize/preview
  block: B18
  group: f-pre
  key: fca_pre
  vars: {mut: {at: "2024-04-02T10:00:00Z", do: update_plan_charge, charge: {billable_metric_code: fca_pre_sum, charge_model: standard, properties: {amount: "3"}}}}
  axes: {mutation: charge_amount, stage: after-finalize, observed_via: preview}
  dimensions: {charge_amount: "1 -> 3"}
  premium: true
  calendar_sensitive: true
  expect:
    preview:
      fees_amount_cents: 35000
      total_amount_cents: 35000
  math: >-
    April, still open, is quoted at the new price: 100 units at 3.00 = 30_000¢ plus the
    5_000¢ subscription fee = 35_000¢.
    Preview reads the charge as it stands rather than as it stood, which is what makes it a
    forecast rather than a copy of the last invoice.

- id: b18/plan_amount/after-finalize/preview
  block: B18
  group: f-pre
  key: fpa_pre
  vars: {mut: {at: "2024-04-02T10:00:00Z", do: update_plan, params: {amount_cents: 9000}}}
  axes: {mutation: plan_amount, stage: after-finalize, observed_via: preview}
  dimensions: {plan_amount: "5000 -> 9000"}
  premium: true
  calendar_sensitive: true
  setup:
    metrics: ~
    charges: ~
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - "%{mut}"
    - {at: "2024-04-25T10:00:00Z", do: preview_invoice}
  expect:
    preview:
      fees_amount_cents: 9000
      total_amount_cents: 9000
  math: >-
    April is quoted at 9_000¢, the current plan price.
    The plan carries no charges deliberately: `PUT /plans/:code` replaces the plan wholesale and
    would delete them, and the row would be measuring that instead.

- id: b18/coupon/after-finalize/final
  block: B18
  group: f-inv
  key: fcp_fin
  vars: {mut: {at: "2024-04-02T10:00:00Z", do: update_coupon, params: {name: "b18 coupon raised", amount_cents: 9000}}}
  axes: {mutation: coupon, stage: after-finalize, observed_via: invoice}
  dimensions: {coupon: "2000 -> 9000"}
  premium: true
  calendar_sensitive: true
  setup:
    coupons: [{name: "b18 coupon", code: "%{key}_coupon", coupon_type: fixed_amount, frequency: recurring, frequency_duration: 3, amount_cents: 2000, amount_currency: EUR, expiration: no_expiration}]
  expect:
    invoices: 1
    invoice:
      status: finalized
      fees_amount_cents: 15000
      coupons_amount_cents: 2000
      total_amount_cents: 13000
  math: >-
    March keeps its 2_000¢ discount, which is unsurprising, and April is quoted the same
    2_000¢, which is the actual content: the edit reaches neither.
    AppliedCoupon snapshots amount, percentage, frequency and duration at application time, so
    raising the coupon to 9_000¢ changes only what a NEW application would receive. A customer
    already holding the coupon is unaffected for its whole remaining life.

- id: b18/coupon/after-finalize/preview
  block: B18
  group: f-pre
  key: fcp_pre
  vars: {mut: {at: "2024-04-02T10:00:00Z", do: update_coupon, params: {name: "b18 coupon raised", amount_cents: 9000}}}
  axes: {mutation: coupon, stage: after-finalize, observed_via: preview}
  dimensions: {coupon: "2000 -> 9000"}
  premium: true
  calendar_sensitive: true
  setup:
    coupons: [{name: "b18 coupon", code: "%{key}_coupon", coupon_type: fixed_amount, frequency: recurring, frequency_duration: 3, amount_cents: 2000, amount_currency: EUR, expiration: no_expiration}]
  expect:
    preview:
      fees_amount_cents: 15000
      coupons_amount_cents: 2000
      total_amount_cents: 13000
  math: >-
    April is quoted with the snapshotted 2_000¢, not the coupon's current 9_000¢.
    This is the cell that separates 'the invoice was already built' from 'the terms are fixed'.
    The tax and plan families both change the next period's quote; the coupon does not, because
    what is fixed is the customer's application rather than the issued invoice.

- id: b18/wallet_balance/after-finalize/final
  block: B18
  group: f-inv
  key: fwb_fin
  vars: {mut: {at: "2024-04-02T10:00:00Z", do: top_up_wallet, params: {granted_credits: "50"}}}
  axes: {mutation: wallet_balance, stage: after-finalize, observed_via: invoice}
  dimensions: {wallet_credits: "30 -> 80"}
  premium: true
  calendar_sensitive: true
  setup:
    wallets: [{name: granted, rate_amount: "1", currency: EUR, granted_credits: "30"}]
  expect:
    invoices: 1
    invoice:
      status: finalized
      fees_amount_cents: 15000
      prepaid_credit_amount_cents: 3000
      total_amount_cents: 12000
  math: >-
    March spent the 3_000¢ the wallet held at the time and is not revisited when 50 more
    credits arrive: 15_000¢ of fees less 3_000¢ = 12_000¢.
    Prepaid credit is consumed at finalization, and consumption is a transaction against the
    wallet rather than a figure recomputed from it. A failure here would mean topping up a
    wallet retroactively altered invoices already paid.

- id: b18/wallet_balance/after-finalize/preview
  block: B18
  group: f-pre
  key: fwb_pre
  vars: {mut: {at: "2024-04-02T10:00:00Z", do: top_up_wallet, params: {granted_credits: "50"}}}
  axes: {mutation: wallet_balance, stage: after-finalize, observed_via: preview}
  dimensions: {wallet_credits: "30 -> 80"}
  premium: true
  calendar_sensitive: true
  setup:
    wallets: [{name: granted, rate_amount: "1", currency: EUR, granted_credits: "30"}]
  expect:
    preview:
      fees_amount_cents: 15000
      prepaid_credit_amount_cents: 5000
      total_amount_cents: 10000
  math: >-
    April is quoted against the wallet as it now stands. March emptied the original 30
    credits, the top-up added 50, so 5_000¢ of cover remains and 10_000¢ is due.
    Together the two rows show the wallet has a history rather than a balance: the invoice
    records what was spent, the quote reads what is left.

- id: b18/grace_period/after-finalize/final
  block: B18
  group: f-inv
  key: fgp_fin
  vars: {mut: {at: "2024-04-02T10:00:00Z", do: update_customer, params: {invoice_grace_period: 5}}}
  axes: {mutation: grace_period, stage: after-finalize, observed_via: invoice}
  dimensions: {grace_period: "0 -> 5"}
  premium: true
  calendar_sensitive: true
  expect:
    invoices: 1
    invoice:
      status: finalized
      fees_amount_cents: 15000
      total_amount_cents: 15000
  math: >-
    Granting a grace period after an invoice is issued cannot reopen it. March was finalized
    on 1 April with no grace, and setting 5 days on 2 April leaves it finalized at 15_000¢.
    The setting governs future issuance only — there is no path back from finalized to draft
    short of voiding, which is B4's territory.

- id: b18/grace_period/after-finalize/preview
  block: B18
  group: f-pre
  key: fgp_pre
  vars: {mut: {at: "2024-04-02T10:00:00Z", do: update_customer, params: {invoice_grace_period: 5}}}
  axes: {mutation: grace_period, stage: after-finalize, observed_via: preview}
  dimensions: {grace_period: "0 -> 5"}
  premium: true
  calendar_sensitive: true
  expect:
    preview:
      fees_amount_cents: 15000
      total_amount_cents: 15000
  math: >-
    A quote is indifferent to the grace period in both directions: it forecasts amounts, and
    the grace period decides only when the resulting invoice is issued. 15_000¢ either way.
    Paired with b18/grace_period/before-first-invoice/preview, which asserts the same
    independence from the other side of the boundary.

- id: b18/tax_rate/on-draft/draft
  block: B18
  group: o-dra
  key: dtr
  vars: {mut: {at: "2024-04-02T10:00:00Z", do: update_tax, params: {rate: 10}}}
  axes: {mutation: tax_rate, stage: on-draft, observed_via: draft}
  dimensions: {tax_rate: "20 -> 10", taxes: ~}
  premium: true
  calendar_sensitive: true
  setup:
    taxes: [{code: "%{key}_vat", name: VAT, rate: 20}]
  expect:
    invoices: 1
    invoice:
      status: draft
      fees_amount_cents: 15000
      taxes_amount_cents: 3000
      total_amount_cents: 18000
  math: >-
    An open draft is not recomputed when the world changes — only when something refreshes it.
    The draft is cut on 1 April at the then-current 20%: 15_000¢ of fees, 3_000¢ of tax, 18_000¢.
    The rate drops to 10% the next day and the draft still reads 3_000¢, because nothing has asked
    it to rebuild. Taxes::UpdateService flags it `ready_to_be_refreshed`, but a flag is an intention
    rather than an act: b18/tax_rate/on-draft/regenerated runs the refresh job and gets 1_500¢.
    The pair is what separates 'stale' from 'wrong'. A customer reading this draft between the two
    moments sees a number that is real but superseded.

- id: b18/charge_amount/on-draft/draft
  block: B18
  group: o-dra
  key: dca
  vars: {mut: {at: "2024-04-02T10:00:00Z", do: update_plan_charge, charge: {billable_metric_code: dca_sum, charge_model: standard, properties: {amount: "3"}}}}
  axes: {mutation: charge_amount, stage: on-draft, observed_via: draft}
  dimensions: {charge_amount: "1 -> 3"}
  premium: true
  calendar_sensitive: true
  expect:
    invoices: 1
    invoice:
      status: draft
      fees_amount_cents: 15000
      total_amount_cents: 15000
  math: >-
    The draft holds its 15_000¢ after the charge is repriced to 3.00, and unlike the tax family it
    will go on holding it: Charges::UpdateService sets no `ready_to_be_refreshed` flag, so the
    refresh job never selects this invoice and b18/charge_amount/on-draft/regenerated reads the same
    15_000¢.
    Two rows, same number, different reasons — here nothing has refreshed it yet, there nothing ever
    will. That is why both cells are worth holding rather than collapsing into one.

- id: b18/plan_amount/on-draft/draft
  block: B18
  group: o-dra
  key: dpa
  vars: {mut: {at: "2024-04-02T10:00:00Z", do: update_plan, params: {amount_cents: 9000}}}
  axes: {mutation: plan_amount, stage: on-draft, observed_via: draft}
  dimensions: {plan_amount: "5000 -> 9000"}
  premium: true
  calendar_sensitive: true
  setup:
    metrics: ~
    charges: ~
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - "%{mut}"
  expect:
    invoices: 1
    invoice:
      status: draft
      fees_amount_cents: 5000
      total_amount_cents: 5000
  math: >-
    The draft was cut at 5_000¢ and still reads 5_000¢ the day after the plan is repriced to 9_000¢.
    Plans::UpdateService flags this invoice for refresh immediately, so the draft is already known to
    be stale — but it is not rebuilt until the refresh job runs, which is
    b18/plan_amount/on-draft/regenerated at 9_000¢.
    The flag and the rebuild are separate events, and a customer can read the invoice in between.

- id: b18/coupon/on-draft/draft
  block: B18
  group: o-dra
  key: dcp
  vars: {mut: {at: "2024-04-02T10:00:00Z", do: update_coupon, params: {name: "b18 coupon raised", amount_cents: 9000}}}
  axes: {mutation: coupon, stage: on-draft, observed_via: draft}
  dimensions: {coupon: "2000 -> 9000"}
  premium: true
  calendar_sensitive: true
  setup:
    coupons: [{name: "b18 coupon", code: "%{key}_coupon", coupon_type: fixed_amount, frequency: recurring, frequency_duration: 3, amount_cents: 2000, amount_currency: EUR, expiration: no_expiration}]
  expect:
    invoices: 1
    invoice:
      status: draft
      fees_amount_cents: 15000
      coupons_amount_cents: 0
      total_amount_cents: 15000
  math: >-
    Two independent reasons for the same 0, which is why the row asserts coupons_amount_cents
    explicitly rather than leaving it out.
    First, a draft never carries a coupon at all: `should_create_coupon_credit?` is gated on
    finalization, so the discount is allocated only when the invoice is issued.
    Second, even once it is issued the edit would not apply — AppliedCoupon snapshotted 2_000¢ when
    the coupon was applied to this customer.
    So the draft shows 15_000¢, the eventual invoice will show 13_000¢, and neither number ever
    reflects the 9_000¢ the coupon now claims.

- id: b18/wallet_balance/on-draft/draft
  block: B18
  group: o-dra
  key: dwb
  vars: {mut: {at: "2024-04-02T10:00:00Z", do: top_up_wallet, params: {granted_credits: "50"}}}
  axes: {mutation: wallet_balance, stage: on-draft, observed_via: draft}
  dimensions: {wallet_credits: "30 -> 80"}
  premium: true
  calendar_sensitive: true
  setup:
    wallets: [{name: granted, rate_amount: "1", currency: EUR, granted_credits: "30"}]
  expect:
    invoices: 1
    invoice:
      status: draft
      fees_amount_cents: 15000
      prepaid_credit_amount_cents: 0
      total_amount_cents: 15000
  math: >-
    The wallet is topped up while the draft is open and the draft does not move — not because the
    top-up was missed, but because a draft never spends prepaid credit in the first place
    (`should_create_applied_prepaid_credit?` is gated on finalization).
    That gating is what makes the top-up safe: had the draft already consumed the original 30
    credits, they would have to be returned when it was refreshed. Instead nothing is spent until
    the invoice is issued, at which point the wallet holds 8_000¢ — see
    b18/wallet_balance/before-first-invoice/final.

- id: b18/grace_period/on-draft/draft
  block: B18
  group: o-dra
  key: dgp
  vars: {mut: {at: "2024-04-02T10:00:00Z", do: update_customer, params: {invoice_grace_period: 10}}}
  axes: {mutation: grace_period, stage: on-draft, observed_via: draft}
  dimensions: {grace_period: "5 -> 10"}
  premium: true
  calendar_sensitive: true
  expect:
    invoices: 1
    invoice:
      status: draft
      fees_amount_cents: 15000
      total_amount_cents: 15000
  math: >-
    Extending the grace period from 5 days to 10 leaves the draft open and unchanged at 15_000¢: the
    setting moves the issuing date, never the amounts.
    The direction matters, and not symmetrically. SHORTENING the grace period does not merely change
    a date — Customers::UpdateInvoiceIssuingDateSettingsService walks the customer's draft invoices
    and enqueues Invoices::FinalizeJob for each one (update_invoice_issuing_date_settings_service.rb:
    24-32), so the drafts are issued there and then rather than waiting for
    Clock::FinalizeInvoicesJob. That is why this cell is reached by extending: a row that shortened
    the period would find a finalized invoice and could not observe a draft at all.

- id: b18/tax_rate/on-draft/final
  block: B18
  group: o-inv
  key: otr_fin
  vars: {mut: {at: "2024-04-02T10:00:00Z", do: update_tax, params: {rate: 10}}}
  axes: {mutation: tax_rate, stage: on-draft, observed_via: invoice}
  dimensions: {tax_rate: "20 -> 10", taxes: ~}
  premium: true
  calendar_sensitive: true
  setup:
    taxes: [{code: "%{key}_vat", name: VAT, rate: 20}]
  expect:
    invoices: 1
    invoice:
      status: finalized
      fees_amount_cents: 15000
      taxes_amount_cents: 1500
      total_amount_cents: 16500
  math: >-
    Finalizing an open draft rebuilds it, so the rate cut DOES reach it: 1_500¢ of tax on
    15_000¢ of fees, 16_500¢ issued, where the draft had read 3_000¢ and 18_000¢.
    Invoices::RefreshDraftAndFinalizeService calls RefreshDraftService with `context: :finalize`
    unconditionally — it does not consult `ready_to_be_refreshed`. Finalization is therefore the
    moment a draft stops being stale, whatever did or did not flag it.

- id: b18/charge_amount/on-draft/final
  block: B18
  group: o-inv
  key: oca_fin
  vars: {mut: {at: "2024-04-02T10:00:00Z", do: update_plan_charge, charge: {billable_metric_code: oca_fin_sum, charge_model: standard, properties: {amount: "3"}}}}
  axes: {mutation: charge_amount, stage: on-draft, observed_via: invoice}
  dimensions: {charge_amount: "1 -> 3"}
  premium: true
  calendar_sensitive: true
  expect:
    invoices: 1
    invoice:
      status: finalized
      fees_amount_cents: 35000
      total_amount_cents: 35000
  math: >-
    The row that resolves the draft-refresh asymmetry rather than just recording it.
    Charges::UpdateService never flags drafts, so b18/charge_amount/on-draft/regenerated shows the
    repricing failing to reach the invoice through the refresh job — but finalization recomputes
    unconditionally, so the same edit lands here: 100 units at 3.00 plus the 5_000¢ subscription fee =
    35_000¢.
    The customer is therefore billed at the NEW price even though every intermediate view showed the
    old one. The missing flag delays the correction; it does not lose it.

- id: b18/plan_amount/on-draft/final
  block: B18
  group: o-inv
  key: opa_fin
  vars: {mut: {at: "2024-04-02T10:00:00Z", do: update_plan, params: {amount_cents: 9000}}}
  axes: {mutation: plan_amount, stage: on-draft, observed_via: invoice}
  dimensions: {plan_amount: "5000 -> 9000"}
  premium: true
  calendar_sensitive: true
  setup:
    metrics: ~
    charges: ~
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - "%{mut}"
    - {at: "2024-04-03T10:00:00Z", do: finalize_invoice}
  expect:
    invoices: 1
    invoice:
      status: finalized
      fees_amount_cents: 9000
      total_amount_cents: 9000
  math: >-
    The plan reprice reaches the issued invoice: 9_000¢ rather than the 5_000¢ the draft carried.
    Here the flag and the finalization agree — Plans::UpdateService marks the draft and finalization
    would have rebuilt it anyway — which is what makes the charge_amount sibling above worth having as
    the case where they disagree.

- id: b18/coupon/on-draft/final
  block: B18
  group: o-inv
  key: ocp_fin
  vars: {mut: {at: "2024-04-02T10:00:00Z", do: update_coupon, params: {name: "b18 coupon raised", amount_cents: 9000}}}
  axes: {mutation: coupon, stage: on-draft, observed_via: invoice}
  dimensions: {coupon: "2000 -> 9000"}
  premium: true
  calendar_sensitive: true
  setup:
    coupons: [{name: "b18 coupon", code: "%{key}_coupon", coupon_type: fixed_amount, frequency: recurring, frequency_duration: 3, amount_cents: 2000, amount_currency: EUR, expiration: no_expiration}]
  expect:
    invoices: 1
    invoice:
      status: finalized
      fees_amount_cents: 15000
      coupons_amount_cents: 2000
      total_amount_cents: 13000
  math: >-
    Finalizing is when the coupon is allocated at all: the draft showed 15_000¢ with no discount
    and the issued invoice shows 13_000¢.
    The amount is the snapshotted 2_000¢, not the 9_000¢ the coupon was raised to while the draft was
    open — AppliedCoupon fixed the terms when it was applied to this customer. So finalization changes
    WHETHER the coupon applies, never HOW MUCH.

- id: b18/wallet_balance/on-draft/final
  block: B18
  group: o-inv
  key: owb_fin
  vars: {mut: {at: "2024-04-02T10:00:00Z", do: top_up_wallet, params: {granted_credits: "50"}}}
  axes: {mutation: wallet_balance, stage: on-draft, observed_via: invoice}
  dimensions: {wallet_credits: "30 -> 80"}
  premium: true
  calendar_sensitive: true
  setup:
    wallets: [{name: granted, rate_amount: "1", currency: EUR, granted_credits: "30"}]
  expect:
    invoices: 1
    invoice:
      status: finalized
      fees_amount_cents: 15000
      prepaid_credit_amount_cents: 8000
      total_amount_cents: 7000
  math: >-
    The wallet is spent for the first time at finalization, and it spends the topped-up balance:
    the original 30 credits were never touched by the draft, 50 more arrived while it was open, so
    8_000¢ of cover meets 15_000¢ of fees and 7_000¢ is due.
    This is the payoff of the gate that keeps drafts from consuming credit. Had the draft spent 3_000¢
    on 1 April, the top-up would have had to be reconciled against an invoice that already claimed
    part of it.

- id: b18/coupon/on-draft/regenerated
  block: B18
  group: o-reg
  key: ocp_reg
  vars: {mut: {at: "2024-04-02T10:00:00Z", do: update_coupon, params: {name: "b18 coupon raised", amount_cents: 9000}}}
  axes: {mutation: coupon, stage: on-draft, observed_via: regenerated}
  dimensions: {coupon: "2000 -> 9000"}
  premium: true
  calendar_sensitive: true
  setup:
    coupons: [{name: "b18 coupon", code: "%{key}_coupon", coupon_type: fixed_amount, frequency: recurring, frequency_duration: 3, amount_cents: 2000, amount_currency: EUR, expiration: no_expiration}]
  expect:
    invoices: 1
    invoice:
      status: draft
      fees_amount_cents: 15000
      coupons_amount_cents: 0
      total_amount_cents: 15000
  math: >-
    Refreshing the draft leaves it without a coupon, because a refreshed draft is still a draft.
    15_000¢ before, 15_000¢ after, coupons_amount_cents 0 throughout — asserted rather than omitted,
    since 'no coupon field' and 'a coupon of zero' would look identical in a total.
    b18/coupon/on-draft/final is the same scenario carried one step further, where finalization
    allocates the discount and the invoice drops to 13_000¢.

- id: b18/wallet_balance/on-draft/regenerated
  block: B18
  group: o-reg
  key: owb_reg
  vars: {mut: {at: "2024-04-02T10:00:00Z", do: top_up_wallet, params: {granted_credits: "50"}}}
