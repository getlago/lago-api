    Invoices::PreviewService, so it credits progressive billing at invoice level — added in this
    session — and applies the reducers a draft withholds.

- id: b18/wallet_balance/between-progressive-invoices/final
  block: B18
  group: p-inv
  key: pwb_fin
  vars: {mut: {at: "2024-03-10T10:00:00Z", do: top_up_wallet, params: {granted_credits: "50"}}}
  axes: {mutation: wallet_balance, stage: between-progressive-invoices, observed_via: invoice}
  dimensions: {wallet_credits: "200 -> 250"}
  premium: true
  calendar_sensitive: true
  no_transaction: true
  setup:
    plan: {amount_cents: 5000}
    wallets: [{name: granted, rate_amount: "1", currency: EUR, granted_credits: "200"}]
  expect:
    invoices: 3
    invoice:
      - select: {invoice_type: subscription}
        status: finalized
        fees_amount_cents: 18000
        progressive_billing_credit_amount_cents: 13000
        sub_total_excluding_taxes_amount_cents: 5000
        prepaid_credit_amount_cents: 5000
        total_amount_cents: 0
    wallet:
      balance_cents: 7000
  math: >-
    Two threshold invoices with the edit landing between them, so the question is not just whether the
    mutation applies but which of the two already-issued demands it can still reach.
