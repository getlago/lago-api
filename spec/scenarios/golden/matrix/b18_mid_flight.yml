# B18 — the configuration changes while an invoice is in flight.
#
# Every other block configures, then bills. These rows change the configuration in between and ask
# which surfaces re-read it. The answer is not uniform and is not documented anywhere: a draft
# re-reads on refresh, a finalized invoice must not, an applied coupon snapshots its terms and so
# ignores edits to the coupon entirely.
---
- __matrix:
    defaults:
      provenance: coverage-gap
      runners: [rspec]
      dimensions: {interval: monthly, billing_time: calendar}
      setup:
        metrics: [{code: "%{key}_sum", aggregation_type: sum_agg, field_name: amount}]
        plan: {code: "golden_b18_%{key}", interval: monthly, amount_cents: 5000}
        charges: [{billable_metric_code: "%{key}_sum", charge_model: standard, properties: {amount: "1"}}]
        customer: {external_id: "golden_b18_%{key}_cust", currency: EUR}
        subscription: {external_id: "golden_b18_%{key}_sub", billing_time: calendar}
    groups:
      b-inv:
        timeline:
          - {at: "2024-03-01T00:00:00Z", do: create_subscription}
          - {at: "2024-03-05T10:00:00Z", do: ingest_events, events: [{code: "%{key}_sum", properties: {amount: 100}}]}
          - "%{mut}"
          - {at: "2024-04-01T01:00:00Z", do: perform_billing}
        dimensions: {taxes: none}
      p-inv:
        setup:
          organization: {premium_integrations: [progressive_billing]}
          plan: {amount_cents: 0, usage_thresholds: [{amount_cents: 5000}, {amount_cents: 12000}]}
        timeline:
          - {at: "2024-03-01T00:00:00Z", do: create_subscription}
          - {at: "2024-03-05T10:00:00Z", do: ingest_events, events: [{code: "%{key}_sum", properties: {amount: 60}}]}
          - {at: "2024-03-05T11:00:00Z", do: perform_usage_update}
          - "%{mut}"
          - {at: "2024-03-15T10:00:00Z", do: ingest_events, events: [{code: "%{key}_sum", properties: {amount: 70}}]}
          - {at: "2024-03-15T11:00:00Z", do: perform_usage_update}
          - {at: "2024-04-01T01:00:00Z", do: perform_billing}
        dimensions: {threshold_amount_cents: "5000+12000", taxes: none}
      o-reg:
        setup:
          customer: {invoice_grace_period: 5}
        timeline:
          - {at: "2024-03-01T00:00:00Z", do: create_subscription}
          - {at: "2024-03-05T10:00:00Z", do: ingest_events, events: [{code: "%{key}_sum", properties: {amount: 100}}]}
          - {at: "2024-04-01T01:00:00Z", do: perform_billing}
          - "%{mut}"
          - {at: "2024-04-03T10:00:00Z", do: refresh_invoice}
        dimensions: {grace_period: 5, taxes: none}
      o-reg2:
        timeline:
          - {at: "2024-03-01T00:00:00Z", do: create_subscription}
          - {at: "2024-03-05T10:00:00Z", do: ingest_events, events: [{code: "%{key}_sum", properties: {amount: 100}}]}
          - {at: "2024-04-01T01:00:00Z", do: perform_billing}
          - "%{mut}"
          - {at: "2024-04-02T11:00:00Z", do: perform_invoices_refresh}
        dimensions: {grace_period: 5}
        runners: [rspec, live]
      f-inv:
        timeline:
          - {at: "2024-03-01T00:00:00Z", do: create_subscription}
          - {at: "2024-03-05T10:00:00Z", do: ingest_events, events: [{code: "%{key}_sum", properties: {amount: 100}}]}
