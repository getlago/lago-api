    7_000¢. `should_create_applied_prepaid_credit?` is gated on finalization
    (calculate_fees_service.rb:375), which is what stops a draft from burning credits that a
    later refresh would have to return.

- id: b18/wallet_balance/before-first-invoice/regenerated
