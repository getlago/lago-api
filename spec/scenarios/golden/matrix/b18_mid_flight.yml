- id: b18/coupon/between-progressive-invoices/draft
  block: B18
  group: p-dra
  key: pcp_dra
  vars: {mut: {at: "2024-03-10T10:00:00Z", do: update_coupon, params: {name: "b18 coupon raised", amount_cents: 9000}}}
  axes: {mutation: coupon, stage: between-progressive-invoices, observed_via: draft}
  dimensions: {coupon: "2000 -> 9000"}
  premium: true
  calendar_sensitive: true
  no_transaction: true
  setup:
    coupons: [{name: "b18 coupon", code: "%{key}_coupon", coupon_type: fixed_amount, frequency: recurring, frequency_duration: 5, amount_cents: 2000, amount_currency: EUR, expiration: no_expiration}]
  expect:
    invoices: 3
    invoice:
      - select: {invoice_type: subscription}
        status: draft
        fees_amount_cents: 13000
        coupons_amount_cents: 0
        progressive_billing_credit_amount_cents: 11000
        sub_total_excluding_taxes_amount_cents: 2000
        total_amount_cents: 2000
  math: >-
    Two threshold invoices with the edit landing between them, so the question is not just whether the
    mutation applies but which of the two already-issued demands it can still reach.
    60 units on 5 March cross the 5_000¢ threshold and are billed at once; 70 more on 15 March take
