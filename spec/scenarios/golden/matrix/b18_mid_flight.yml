    on it, and prepaid_credit_amount_cents 0 states exactly that.

- id: b18/grace_period/on-draft/regenerated
  block: B18
  group: o-reg
  key: ogp_reg
  vars: {mut: {at: "2024-04-02T10:00:00Z", do: update_customer, params: {invoice_grace_period: 10}}}
  axes: {mutation: grace_period, stage: on-draft, observed_via: regenerated}
  dimensions: {grace_period: "5 -> 10"}
  premium: true
  calendar_sensitive: true
  expect:
    invoices: 1
    invoice:
      status: draft
      fees_amount_cents: 15000
      total_amount_cents: 15000
  math: >-
    Extending the grace period and refreshing changes nothing: the invoice is rebuilt, stays open,
    and stays at 15_000¢.
    A refresh cannot close an invoice and the grace period cannot alter its amounts, so this cell is
    the intersection of two independent no-ops — worth pinning precisely because it is the kind of
    combination that would be assumed rather than checked.

- id: b18/tax_rate/on-draft/preview
  block: B18
  group: o-pre
  key: otr_pre
  vars: {mut: {at: "2024-04-02T10:00:00Z", do: update_tax, params: {rate: 10}}}
  axes: {mutation: tax_rate, stage: on-draft, observed_via: preview}
  dimensions: {tax_rate: "20 -> 10", taxes: ~}
  premium: true
  calendar_sensitive: true
  setup:
    taxes: [{code: "%{key}_vat", name: VAT, rate: 20}]
  expect:
    preview:
      fees_amount_cents: 15000
      taxes_amount_cents: 1500
      total_amount_cents: 16500
  math: >-
    A quote taken while a stale draft sits open reads the CURRENT rate, not the draft's.
    April is previewed at 10% — 1_500¢ on 15_000¢ — while the March draft still shows 3_000¢ at the old
    20%. Two views of the same customer, minutes apart, disagreeing correctly: one is a period already
    computed, the other a period not yet computed.

- id: b18/charge_amount/on-draft/preview
  block: B18
  group: o-pre
  key: oca_pre
  vars: {mut: {at: "2024-04-02T10:00:00Z", do: update_plan_charge, charge: {billable_metric_code: oca_pre_sum, charge_model: standard, properties: {amount: "3"}}}}
