  premium: true
  calendar_sensitive: true
  expect:
    preview:
      fees_amount_cents: 35000
      total_amount_cents: 35000
  math: >-
    April is quoted at the new 3.00 per unit (35_000¢) while the March draft remains at the old
    price it was cut with.
    Preview reads configuration live and has no notion of staleness, which is precisely why it cannot
    be used to check what an open draft will finalize to — b18/charge_amount/on-draft/final is the row
    that answers that.

- id: b18/plan_amount/on-draft/preview
  block: B18
  group: o-pre
