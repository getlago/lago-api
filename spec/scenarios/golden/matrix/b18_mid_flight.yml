- id: b18/plan_amount/before-first-invoice/final
  block: B18
  group: b-inv
  key: bpa_fin
  vars: {mut: {at: "2024-03-20T10:00:00Z", do: update_plan, params: {amount_cents: 9000}}}
  axes: {mutation: plan_amount, stage: before-first-invoice, observed_via: invoice}
  dimensions: {plan_amount: "5000 -> 9000"}
  premium: true
  calendar_sensitive: true
  setup:
    metrics: ~
    charges: ~
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - "%{mut}"
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      status: finalized
      fees_amount_cents: 9000
      total_amount_cents: 9000
  math: >-
    The plan is repriced before the first invoice exists, so the subscription fee is simply built at
    the new price: 9_000¢ rather than 5_000¢, on every surface.
    The plan carries no charges deliberately — `PUT /plans/:code` replaces the plan wholesale and
    would delete them, leaving the row measuring that instead of the reprice.
    Its pair is b18/plan_amount/after-finalize/final, where the same edit must NOT move an invoice
    that has already been issued.

