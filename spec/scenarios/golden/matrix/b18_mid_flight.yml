- id: b18/tax_rate/between-progressive-invoices/preview
  block: B18
  group: p-pre
  key: ptr_pre
  vars: {mut: {at: "2024-03-10T10:00:00Z", do: update_tax, params: {rate: 10}}}
  axes: {mutation: tax_rate, stage: between-progressive-invoices, observed_via: preview}
  dimensions: {tax_rate: "20 -> 10", taxes: ~}
  provenance: characterization
  premium: true
  calendar_sensitive: true
  no_transaction: true
  setup:
    taxes: [{code: "%{key}_vat", name: VAT, rate: 20}]
  expect:
    invoices: 3
    preview:
      fees_amount_cents: 13000
      progressive_billing_credit_amount_cents: 13000
      sub_total_excluding_taxes_amount_cents: 0
      taxes_amount_cents: 1300
      total_amount_cents: 1300
  math: >-
    A rate cut landing between two threshold invoices, which is the only stage where the same period
    carries two different tax rates.
    The first demand is cut on 5 March at 20%: 60 units = 6_000¢ plus 1_200¢ of tax = 7_200¢. The rate
    drops to 10% on 10 March. The second demand on 15 March bills the cumulative 13_000¢, credits the
    6_000¢ the first collected, and taxes the 7_000¢ that remains at the NEW rate = 700¢ → 7_700¢.
    Tax is read when each invoice is built, so a single period is legitimately taxed at two rates,
    each correct for the moment its demand was issued.
    CHARACTERIZATION — the quote disagrees with the invoice, and the disagreement is the whole
    value of the cell: preview says 1_300¢ is owed where the invoice says 0¢.
    Preview credits progressive billing at invoice level, so its base is correctly 0. But it never
    applies the credit at FEE level, so each fee is still taxed on its full 13_000¢ at 10% = 1_300¢ —
    tax on money the customer has already paid, against a base of zero.
    The invoice reaches 0 through the opposite error: `apply_credit_to_fees` clamps the charge fee's
    taxable amount to zero by writing the amount billed into it. Here that lands on the right answer
    by luck, because the base is zero anyway. Fixing the fee-level distribution settles both, and this
    row and its /final sibling should then agree.
