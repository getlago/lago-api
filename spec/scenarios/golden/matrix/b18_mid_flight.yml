      prepaid_credit_amount_cents: 8000
      total_amount_cents: 7000
  math: >-
    The quote sees the whole topped-up wallet — 8_000¢ against 15_000¢, so 7_000¢ due — because the
    open March draft has not spent any of it.
    Had drafts consumed credit, this quote and the March draft would each be claiming the same 3_000¢,
    and the customer would be shown cover that does not exist twice over.

- id: b18/grace_period/on-draft/preview
  block: B18
  group: o-pre
  key: ogp_pre
  vars: {mut: {at: "2024-04-02T10:00:00Z", do: update_customer, params: {invoice_grace_period: 10}}}
  axes: {mutation: grace_period, stage: on-draft, observed_via: preview}
  dimensions: {grace_period: "5 -> 10"}
  premium: true
  calendar_sensitive: true
  expect:
    preview:
      fees_amount_cents: 15000
      total_amount_cents: 15000
  math: >-
    Extending the grace period does not move a quote: 15_000¢ before and after.
    The setting governs when an invoice is issued, and a preview has nothing to issue. Together with
    b18/grace_period/before-first-invoice/preview and .../after-finalize/preview, the three cells say
    the independence holds at every stage rather than coincidentally at one.

- id: b18/charge_amount/between-progressive-invoices/final
  block: B18
  group: p-inv
  key: pca_fin
  vars: {mut: {at: "2024-03-10T10:00:00Z", do: update_plan_charge, charge: {billable_metric_code: pca_fin_sum, charge_model: standard, properties: {amount: "3"}}}}
  axes: {mutation: charge_amount, stage: between-progressive-invoices, observed_via: invoice}
  dimensions: {charge_amount: "1 -> 3"}
  premium: true
  calendar_sensitive: true
  no_transaction: true
  expect:
    invoices: 3
    invoice:
      - select: {invoice_type: subscription}
        status: finalized
        fees_amount_cents: 39000
        progressive_billing_credit_amount_cents: 39000
        sub_total_excluding_taxes_amount_cents: 0
        total_amount_cents: 0
  math: >-
    Two threshold invoices with the edit landing between them, so the question is not just whether the
    mutation applies but which of the two already-issued demands it can still reach.
    60 units on 5 March cross the 5_000¢ threshold and are billed at once; 70 more on 15 March take
    cumulative usage to 13_000¢, past the 12_000¢ threshold, and the second demand credits what the
    first collected. The period invoice on 1 April then credits what the SECOND collected —
    `to_credit_amount` reads the most recent threshold invoice, net of its own coupons and credit notes
    but not of credits granted against it, which is why it is 13_000¢ and not 7_000¢.
    Repricing to 3.00 between the two demands re-rates the cumulative usage rather than only the
    new part: the second demand bills 130 units x 3.00 = 39_000¢, credits the 6_000¢ the first
    collected at the old price, and the period invoice credits the full 39_000¢ back.
    Nothing is owed at the end, but the customer has paid 6_000 + 33_000 = 39_000¢ — the whole
    period at the new price, including the 60 units metered while the old price was in force.
    Observed as the issued period invoice, which is where the arithmetic above is settled.

- id: b18/charge_amount/between-progressive-invoices/draft
  block: B18
  group: p-dra
  key: pca_dra
  vars: {mut: {at: "2024-03-10T10:00:00Z", do: update_plan_charge, charge: {billable_metric_code: pca_dra_sum, charge_model: standard, properties: {amount: "3"}}}}
  axes: {mutation: charge_amount, stage: between-progressive-invoices, observed_via: draft}
  dimensions: {charge_amount: "1 -> 3"}
  premium: true
  calendar_sensitive: true
  no_transaction: true
  expect:
    invoices: 3
    invoice:
      - select: {invoice_type: subscription}
        status: draft
        fees_amount_cents: 39000
        progressive_billing_credit_amount_cents: 39000
        sub_total_excluding_taxes_amount_cents: 0
        total_amount_cents: 0
  math: >-
