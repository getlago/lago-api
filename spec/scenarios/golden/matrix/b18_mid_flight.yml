  expect:
    preview:
      fees_amount_cents: 15000
      coupons_amount_cents: 2000
      total_amount_cents: 13000
  math: >-
    The quote applies the snapshotted 2_000¢, so April is 13_000¢.
    Note what this row shows against its regenerated sibling: the preview applies the coupon and the
    draft does not, for the same customer at the same moment. The difference is not the coupon's terms
    but which surface is allowed to allocate it.

- id: b18/wallet_balance/on-draft/preview
  block: B18
  group: o-pre
  key: owb_pre
  vars: {mut: {at: "2024-04-02T10:00:00Z", do: top_up_wallet, params: {granted_credits: "50"}}}
