    but not of credits granted against it, which is why it is 13_000¢ and not 7_000¢.
    Repricing to 3.00 between the two demands re-rates the cumulative usage rather than only the
    new part: the second demand bills 130 units x 3.00 = 39_000¢, credits the 6_000¢ the first
    collected at the old price, and the period invoice credits the full 39_000¢ back.
    Nothing is owed at the end, but the customer has paid 6_000 + 33_000 = 39_000¢ — the whole
