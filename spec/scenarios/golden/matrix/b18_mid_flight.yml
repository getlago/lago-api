    Observed as an open draft, so coupons, credit notes and prepaid credit are all withheld
    (`not_in_finalizing_process?`, calculate_fees_service.rb:364-379) while the progressive credit,
    which runs ahead of that gate, is present. The draft therefore shows the credit but not the
    discount.

