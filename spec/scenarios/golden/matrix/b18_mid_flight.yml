    first collected. The period invoice on 1 April then credits what the SECOND collected —
    `to_credit_amount` reads the most recent threshold invoice, net of its own coupons and credit notes
    but not of credits granted against it, which is why it is 13_000¢ and not 7_000¢.
    Granting a grace period between the two demands has no effect on either — both are already
    issued, and a threshold invoice is a payment demand rather than a draft — but it holds the period
    invoice open.
    The amounts are identical on every surface here: 13_000¢ billed, 13_000¢ credited, nothing owed.
    What the four cells separate is whether that invoice is open or issued, which is the only thing
    the mutation touches.
    Observed as the issued period invoice, which is where the arithmetic above is settled.

