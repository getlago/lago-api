- id: b18/grace_period/between-progressive-invoices/final
  block: B18
  group: p-inv
  key: pgp_fin
  vars: {mut: {at: "2024-03-10T10:00:00Z", do: update_customer, params: {invoice_grace_period: 5}}, mut2: {at: "2024-03-20T10:00:00Z", do: update_customer, params: {invoice_grace_period: 5}}}
  axes: {mutation: grace_period, stage: between-progressive-invoices, observed_via: invoice}
  dimensions: {grace_period: "0 -> 5"}
  premium: true
  calendar_sensitive: true
  no_transaction: true
  setup:
    customer: {invoice_grace_period: 0}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-05T10:00:00Z", do: ingest_events, events: [{code: "%{key}_sum", properties: {amount: 60}}]}
    - {at: "2024-03-05T11:00:00Z", do: perform_usage_update}
    - "%{mut}"
    - {at: "2024-03-15T10:00:00Z", do: ingest_events, events: [{code: "%{key}_sum", properties: {amount: 70}}]}
    - {at: "2024-03-15T11:00:00Z", do: perform_usage_update}
    - "%{mut2}"
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - {at: "2024-04-01T02:00:00Z", do: finalize_invoice}
  expect:
    invoices: 3
    invoice:
      - select: {invoice_type: subscription}
        status: finalized
        fees_amount_cents: 13000
        progressive_billing_credit_amount_cents: 13000
        sub_total_excluding_taxes_amount_cents: 0
        total_amount_cents: 0
  math: >-
    Two threshold invoices with the edit landing between them, so the question is not just whether the
    mutation applies but which of the two already-issued demands it can still reach.
    60 units on 5 March cross the 5_000¢ threshold and are billed at once; 70 more on 15 March take
