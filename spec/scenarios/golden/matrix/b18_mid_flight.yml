    but not of credits granted against it, which is why it is 13_000¢ and not 7_000¢.
    Giving the plan a 9_000¢ subscription fee between the demands does not touch either of them —
    threshold invoices carry usage charges only — but it appears on the period invoice, which is the
    first thing to bill a subscription fee at all.
    So the period invoice is 9_000¢ of subscription plus 13_000¢ of usage, credits the 13_000¢ of
    usage already collected, and bills the subscription fee alone. The progressive credit is capped
    at the charges it relates to and cannot spill onto the new fee.
    Observed as the issued period invoice, which is where the arithmetic above is settled.

