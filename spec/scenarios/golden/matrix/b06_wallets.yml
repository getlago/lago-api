  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_twc_th_nt, properties: {amount: 10, target_wallet_code: b06_twc_th_nt_a}}
        - {code: b06_twc_th_nt, properties: {amount: 15, target_wallet_code: b06_twc_th_nt_a}}
        - {code: b06_twc_th_nt, properties: {amount: 5, target_wallet_code: b06_twc_th_nt_a}}
        - {code: b06_twc_th_nt, properties: {amount: 12, target_wallet_code: b06_twc_th_nt_b}}
        - {code: b06_twc_th_nt, properties: {amount: 8, target_wallet_code: b06_twc_th_nt_b}}
    - {at: "2024-03-10T00:00:00Z", do: perform_wallet_refresh}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      fees_count: 3
      fees_amount_cents: 5000
      coupons_amount_cents: 2000
      sub_total_excluding_taxes_amount_cents: 3000
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 1800
      prepaid_granted_credit_amount_cents: 1800
      total_amount_cents: 1200
    wallet:
      code: b06_twc_th_nt_a
      balance_cents: 8200
  math: >-
    An auto-refilled wallet ends up holding three times the invoice while 1_200¢ stays unpaid — the
    total never goes negative and the surplus is never refunded. The rule fires at the 10 March refresh
    on the wallet's OWN bucket only: ongoing_usage 3_000 (its tagged fee, not the 5_000 of total usage —
    allocate_ongoing_usage_by_wallets_service.rb:118-130), ongoing_balance = 2_000 − 3_000 = −1_000,
    credits_ongoing_balance −10 ≤ 0, one flat 80-credit grant (recurring_transaction_rule.rb:104-111 via
    update_ongoing_service.rb:26) → balance 10_000¢, and the cascade re-refresh reads 70 credits > 0 and
    stops. Granted credits raise no invoice, so invoices is 1.
    Fees 5_000¢: 3_000¢ tagged b06_twc_th_nt_a (10/15/5: sum 30 ≠ max 15 ≠ latest 5) and 2_000¢ tagged
    b06_twc_th_nt_b. The fixed_amount coupon spreads BY WEIGHT
    (fee.rb:232-236 through credits/applied_coupon_service.rb:35-37): 2_000 × 3_000/5_000 = 1_200 onto
    the a fee and 800 onto the b fee, so the caps are `sub_total_excluding_taxes + taxes_precise −
    precise_credit_notes` = 1_800 and 1_200 (allocate_prepaid_credits_by_wallets_service.rb:77-79).
    Wallet b holds no credits, so `with_positive_balance` (wallet.rb:65) drops it and its 1_200¢ can be
    paid by nobody — wallet a is refused it by the tag (:109-114) while sitting on 8_200¢. Every draw is
    also bounded by `remaining_invoice_amount` (:53, :57), so prepaid is 1_800 and the total clamps at
    1_200 rather than −7_000.
    The named alternatives: credits applied before the coupon would cap the a fee at 3_000 → prepaid
    3_000, total 0, balance 7_000; a tag-blind allocator would pay both caps → the same 3_000 and 0,
    and mid-period would have absorbed 5_000 of usage instead of 3_000; a wallet drained to 0 or a
    credit note for the surplus — neither happens. The post-billing refresh leaves 82 credits > 0, so
    the rule does not re-arm and 8_200 is stable.

