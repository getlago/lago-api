      prepaid_granted_credit_amount_cents: 3000
      total_amount_cents: 0
    wallet:
      code: b06_paid_prio_second
      balance_cents: 2200
  math: >-
    Two wallets, each with a pending purchased top-up of 30 credits and a settled grant. That
    makes three invoices — two `credit` invoices of 3_000¢ each plus the period invoice — and
    spendable balances of 1_200¢ (priority 1) and 4_000¢ (priority 20), not 4_200¢ and 7_000¢,
    because a purchased top-up is created `pending` (create_from_params_service.rb:129) and only
    Invoices::PrepaidCreditJob:20-21 on a succeeded payment turns it into balance.
    Consumption follows `priority` ascending, not creation order (wallet.rb:69
    `order(:priority, :created_at)`, used by applied_prepaid_credits_service.rb:114), so the
    wallets are declared in the wrong order on purpose. The single bucket ["charge", metric] is
    3_000¢. The priority-1 wallet pays min(3_000, 1_200, 3_000) = 1_200 and is emptied; the
    priority-20 wallet then pays min(1_800, 4_000, 1_800) = 1_800 (allocate:53). Total prepaid
    3_000¢, invoice 0.
    The row asserts the SECOND wallet, because that is the number the order decides: correct
    order leaves it at 4_000 - 1_800 = 2_200¢, the wrong order (creation order, or descending
    priority) drains 3_000 from it and leaves 1_000¢, and an implementation that spent the
    pending purchased credits would let the priority-1 wallet (4_200¢) absorb the whole invoice
    and leave the second untouched at 7_000¢. One assertion kills all three.
    `expect.wallet` takes a single wallet, not a list, so the first wallet's balance is pinned
    indirectly: prepaid_credit_amount_cents 3_000 minus the second wallet's 1_800 consumption
    leaves exactly 1_200, which is its whole spendable balance.

- id: b06/paid/none/rounding
  block: B6
  axes: {source: paid, limitation: none, application: rounding}
  dimensions: {interval: monthly, billing_time: calendar, rate_amount: "0.33", credits: "3.5"}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    metrics: [{code: b06_paid_rnd, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_paid_rnd, interval: monthly, amount_cents: 0}
    charges: [{billable_metric_code: b06_paid_rnd, charge_model: standard, properties: {amount: "0.5"}}]
    customer: {external_id: golden_b06_paid_rnd_cust, currency: EUR}
    subscription: {external_id: golden_b06_paid_rnd_sub, billing_time: calendar}
    wallets:
      - {name: awkward rate, code: b06_paid_rnd_w, rate_amount: "0.33", currency: EUR, paid_credits: "3.5", granted_credits: "3.5"}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_paid_rnd, properties: {amount: 10}}
        - {code: b06_paid_rnd, properties: {amount: 30}}
        - {code: b06_paid_rnd, properties: {amount: 20}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {invoice_type: credit}
        fees_amount_cents: 116
        taxes_amount_cents: 0
        total_amount_cents: 116
        payment_status: pending
        fees:
          - {fee_type: credit, amount_cents: 116, units: "3.51515"}
      - select: {invoice_type: subscription}
        fees_amount_cents: 3000
        prepaid_credit_amount_cents: 116
        prepaid_granted_credit_amount_cents: 116
        total_amount_cents: 2884
    wallet:
      code: b06_paid_rnd_w
      balance_cents: 0
  math: >-
    3.5 credits at a rate of 0.33 is 1.155 — exactly half a cent. WalletCredit rounds the MONEY,
    not the credits: `@amount = (credit_amount * rate_amount).round(currency.exponent)`
    (wallet_credit.rb:26) with BigDecimal's default ROUND_HALF_UP gives 1.16, so
    amount_cents = 116. Truncating or rounding half-down would give 115, and that one cent is
    visible three times in this row: the purchase invoice is 116¢ not 115¢, the granted pool is
    116¢ not 115¢, and the period invoice ends at 3_000 - 116 = 2_884¢ rather than 2_885¢.
    The credit fee's `units` pins the second half of the conversion. An invoiceable credit is
    re-derived FROM the rounded amount — `amount.fdiv(wallet.rate_amount)`
    (wallet_credit.rb:29-32) — so the customer is billed for 1.16 / 0.33 = 3.51515 credits, not
    the 3.5 they asked for. An implementation that kept the requested 3.5 would put 3.5 here and
    would then disagree with its own 116¢ price.
    The purchased 116¢ stays pending (create_from_params_service.rb:129) and the granted 116¢ is
    what the invoice draws on, which is why prepaid_credit_amount_cents equals
    prepaid_granted_credit_amount_cents. Both are 116, so 2_884¢ is still owed in cash.

- id: b06/paid/none/negative-total
  block: B6
  axes: {source: paid, limitation: none, application: negative-total}
  dimensions: {interval: monthly, billing_time: calendar, rate_amount: 1, granted_credits: 100}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    metrics: [{code: b06_paid_neg, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_paid_neg, interval: monthly, amount_cents: 0}
    charges: [{billable_metric_code: b06_paid_neg, charge_model: standard, properties: {amount: "0.5"}}]
    customer: {external_id: golden_b06_paid_neg_cust, currency: EUR}
    subscription: {external_id: golden_b06_paid_neg_sub, billing_time: calendar}
    wallets:
      - {name: over funded, code: b06_paid_neg_w, rate_amount: "1", currency: EUR, paid_credits: "20", granted_credits: "100"}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_paid_neg, properties: {amount: 10}}
        - {code: b06_paid_neg, properties: {amount: 30}}
        - {code: b06_paid_neg, properties: {amount: 20}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      select: {invoice_type: subscription}
      fees_amount_cents: 3000
      prepaid_credit_amount_cents: 3000
      prepaid_granted_credit_amount_cents: 3000
      total_amount_cents: 0
      payment_status: succeeded
    wallet:
      code: b06_paid_neg_w
      balance_cents: 7000
  math: >-
    10_000¢ of spendable credit against a 3_000¢ invoice. Three outcomes are conceivable and the
    row does not assume one: (a) the debit is clamped to what is owed, (b) the wallet is drained
    and the invoice goes to -7_000¢, (c) the excess becomes a credit note or a refund invoice.
    The implementation gives (a). `remaining_invoice_amount` is seeded from
    invoice.total_amount_cents (allocate:31) and every debit is
    min(bucket_remaining, wallet_remaining, remaining_invoice_amount) (allocate:53), so no
    allocation can exceed what is still owed; refresh_amounts then subtracts exactly that
    (calculate_fees_service.rb:394-396), landing on 0. Nothing in the prepaid path creates a
    credit note, so `invoices` stays at 2 — the purchase invoice and the period invoice — and (c)
    is excluded by the count. (b) is excluded twice over: by the clamp, and by
    `validates :balance_cents, numericality: {greater_than_or_equal_to: 0}, if: :traceable?`
    (wallet.rb:54), which would reject a wallet debited past its balance.
    The leftover balance is the load-bearing number: 10_000 - 3_000 = 7_000¢. An implementation
    spending the still-pending 20 purchased credits would leave 9_000¢, and one that drained the
    wallet on full cover would leave 0.

- id: b06/paid/none/ongoing-balance
  block: B6
  axes: {source: paid, limitation: none, application: ongoing-balance}
  dimensions: {interval: monthly, billing_time: calendar, rate_amount: 1, read: mid-period}
  provenance: coverage-gap
  runners: [rspec]
  premium: true
  setup:
    metrics: [{code: b06_paid_ob, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_paid_ob, interval: monthly, amount_cents: 0}
    charges: [{billable_metric_code: b06_paid_ob, charge_model: standard, properties: {amount: "0.5"}}]
    customer: {external_id: golden_b06_paid_ob_cust, currency: EUR}
    subscription: {external_id: golden_b06_paid_ob_sub, billing_time: calendar}
    wallets:
      - {name: thin grant, code: b06_paid_ob_w, rate_amount: "1", currency: EUR, paid_credits: "20", granted_credits: "12"}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_paid_ob, properties: {amount: 10}}
        - {code: b06_paid_ob, properties: {amount: 30}}
        - {code: b06_paid_ob, properties: {amount: 20}}
    - {at: "2024-03-06T00:00:00Z", do: perform_wallet_refresh}
    - {at: "2024-03-06T01:00:00Z", do: fetch_current_usage}
  expect:
    invoices: 1
    usage:
      amount_cents: 3000
      taxes_amount_cents: 0
      total_amount_cents: 3000
      charges_usage:
        - {billable_metric_code: b06_paid_ob, units: "60", amount_cents: 3000}
    wallet:
      code: b06_paid_ob_w
      balance_cents: 1200
      ongoing_usage_balance_cents: 3000
      ongoing_balance_cents: -1800
  math: >-
    A mid-period read, and a different code path from every other row in this slice: no invoice
    is billed, so Credits::AllocatePrepaidCreditsByWalletsService never runs. The number comes
    from Clock::RefreshWalletsOngoingBalanceJob -> Customers::RefreshWalletsService ->
    Wallets::Balance::AllocateOngoingUsageByWalletsService, and it is the ONGOING path.
    Current usage is 60 units at 0.50 = 3_000¢ and consists of charge fees only
    (customer_usage_service.rb:103,120 — the subscription fee is not part of current usage at
    all). The single unrestricted wallet is the last applicable wallet for that fee key, so it
    absorbs the whole amount and is explicitly allowed to go negative
    (allocate_ongoing_usage_by_wallets_service.rb:48-51): ongoing_usage_balance_cents = 3_000 and
    ongoing_balance_cents = balance_cents - ongoing_usage = 1_200 - 3_000 = -1_800
    (refresh_ongoing_usage_service.rb:62-63).
    That negative is the point. The invoice-time path clamps at the balance, so an implementation
    that reused it here would report 1_200 / 0 instead of 3_000 / -1_800. And the pending
    purchased 20 credits are still not money: were they counted, balance_cents would read 3_200
    and ongoing_balance_cents +200 rather than -1_800. `invoices: 1` is the purchase invoice
    alone — the 3_000¢ of usage is unbilled, which is exactly what makes it "ongoing".

- id: b06/paid/fee-types/full-cover
  block: B6
  axes: {source: paid, limitation: fee-types, application: full-cover}
  dimensions: {interval: monthly, billing_time: calendar, allowed_fee_types: charge, tax_rate: 20}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    taxes: [{code: b06_paid_ft_tax, name: standard, rate: 20, applied_to_organization: true}]
    metrics: [{code: b06_paid_ft, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_paid_ft, interval: monthly, amount_cents: 5000}
    charges: [{billable_metric_code: b06_paid_ft, charge_model: standard, properties: {amount: "0.5"}}]
    customer: {external_id: golden_b06_paid_ft_cust, currency: EUR}
    subscription: {external_id: golden_b06_paid_ft_sub, billing_time: calendar}
    wallets:
      - name: charges only
        code: b06_paid_ft_w
        rate_amount: "1"
        currency: EUR
        paid_credits: "20"
        granted_credits: "100"
        applies_to: {fee_types: [charge]}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_paid_ft, properties: {amount: 10}}
        - {code: b06_paid_ft, properties: {amount: 30}}
        - {code: b06_paid_ft, properties: {amount: 20}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {invoice_type: credit}
        fees_amount_cents: 2000
        taxes_amount_cents: 0
        total_amount_cents: 2000
      - select: {invoice_type: subscription}
        fees_amount_cents: 8000
        sub_total_excluding_taxes_amount_cents: 8000
        taxes_amount_cents: 1600
        sub_total_including_taxes_amount_cents: 9600
        prepaid_credit_amount_cents: 3600
        prepaid_granted_credit_amount_cents: 3600
        total_amount_cents: 6000
        payment_status: pending
        fees:
          - {fee_type: subscription, item_code: golden_b06_paid_ft, amount_cents: 5000, taxes_amount_cents: 1000, units: "1"}
          - {fee_type: charge, item_code: b06_paid_ft, amount_cents: 3000, taxes_amount_cents: 600, units: "60"}
    wallet:
      code: b06_paid_ft_w
      balance_cents: 6400
  math: >-
    Two fee types on one taxed invoice: a 5_000¢ subscription fee (+1_000¢ tax) and a 3_000¢
    charge fee (+600¢ tax), 8_000¢ of fees and 9_600¢ due. The wallet is limited to fee_type
    `charge`, so `applicable_fee?` matches only the charge bucket (allocate:108-120 —
    type_match on fee_key.first, with unrestricted_wallet false because types is non-empty).
    The subscription fee is a fee this wallet may NOT pay, and the assertion that it is still
    owed in cash is total_amount_cents 6_000 = 5_000 + 1_000: an implementation that ignored
    limitations would pay all 9_600 and land on 0.
    The ceiling of the allowed bucket is the number this row exists for. It is
    `sub_total_excluding_taxes_amount_cents + taxes_precise_amount_cents -
    precise_credit_notes_amount_cents` (allocate:77-81), i.e. 3_000 + 600 = 3_600 — a wallet may
    pay the tax on a fee it is allowed to pay. An implementation using the pre-tax amount as the
    ceiling would pay 3_000 and leave 6_600¢ owed with 7_000¢ on the wallet. With 10_000¢
    available the bucket, not the balance, is binding, which is why "full cover" here means the
    allowed portion is covered whole and 6_400¢ is left stranded on the wallet.
    balance_cents 6_400 also excludes the pending purchase: if the 20 purchased credits counted,
    the pool would be 12_000¢ and the leftover 8_400¢. prepaid_granted equal to prepaid_credit
    says the same thing from the invoice side.

- id: b06/paid/fee-types/partial-cover
  block: B6
  axes: {source: paid, limitation: fee-types, application: partial-cover}
  dimensions: {interval: monthly, billing_time: calendar, allowed_fee_types: charge+subscription}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    metrics: [{code: b06_paid_ftp, aggregation_type: sum_agg, field_name: amount}]
