  setup:
    metrics:
      - {code: b06_paid_bmn_m_in, aggregation_type: sum_agg, field_name: amount}
      - {code: b06_paid_bmn_m_out, aggregation_type: sum_agg, field_name: amount}
    plan: {code: golden_b06_paid_bmn, interval: monthly, amount_cents: 0}
    charges:
      - {billable_metric_code: b06_paid_bmn_m_in, charge_model: standard, properties: {amount: "0.5"}}
      - {billable_metric_code: b06_paid_bmn_m_out, charge_model: standard, properties: {amount: "0.01"}}
    customer: {external_id: golden_b06_paid_bmn_cust, currency: EUR}
    subscription: {external_id: golden_b06_paid_bmn_sub, billing_time: calendar}
    wallets:
      - name: one metric only, over funded
        code: b06_paid_bmn_w
        rate_amount: "1"
        currency: EUR
        paid_credits: "20"
        granted_credits: "100"
        applies_to: {billable_metric_codes: [b06_paid_bmn_m_in]}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_paid_bmn_m_in, properties: {amount: 10}}
        - {code: b06_paid_bmn_m_in, properties: {amount: 30}}
        - {code: b06_paid_bmn_m_in, properties: {amount: 20}}
        - {code: b06_paid_bmn_m_out, properties: {amount: 10}}
        - {code: b06_paid_bmn_m_out, properties: {amount: 30}}
        - {code: b06_paid_bmn_m_out, properties: {amount: 20}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      select: {invoice_type: subscription}
      fees_amount_cents: 3060
      prepaid_credit_amount_cents: 3000
      prepaid_granted_credit_amount_cents: 3000
      total_amount_cents: 60
      payment_status: pending
      fees:
        - {fee_type: subscription, item_code: golden_b06_paid_bmn, amount_cents: 0, units: "1"}
        - {fee_type: charge, item_code: b06_paid_bmn_m_in, amount_cents: 3000, units: "60"}
        - {fee_type: charge, item_code: b06_paid_bmn_m_out, amount_cents: 60, units: "60"}
    wallet:
      code: b06_paid_bmn_w
      balance_cents: 7000
  math: >-
    10_000¢ of spendable credit targeted at one metric, against 3_000¢ on that metric and 60¢ on
    another. After covering its own bucket in full the wallet still holds 7_000¢ — far more than
    the whole rest of the invoice. Four outcomes are conceivable: (a) the debit stops at the
    targeted bucket and 60¢ is owed in cash, (b) the excess spills onto the untargeted charge and
    the invoice reaches 0, (c) the total goes negative, (d) a credit note or refund appears for
    the excess.
    The implementation gives (a). Bucket keys carry the billable_metric_id (allocate:81) and
    `applicable_fee?` matches the wallet's WalletTarget pair ["charge", metric_id]
    (allocate:108-120), so the other metric's bucket is unreachable no matter how much credit is
    left. Every debit is also capped by remaining_invoice_amount (allocate:31,53), which is what
    makes (c) impossible in general, and the prepaid path creates no credit note, so
    `invoices: 2` — purchase plus period — excludes (d).
    So 0.60 is invoiced and the invoice stays `pending` while 70.00 of usable credit sits beside
    it. total_amount_cents 60 (not 0, not -6_940) and balance_cents 7_000 (not 0, and not the
    9_000 an implementation that spent the pending purchased credits would leave) are the two
    numbers that say so.

- id: b06/paid/billable-metrics/ongoing-balance
  block: B6
  axes: {source: paid, limitation: billable-metrics, application: ongoing-balance}
  dimensions: {interval: monthly, billing_time: calendar, read: mid-period}
  provenance: coverage-gap
  runners: [rspec]
  premium: true
  setup:
    metrics:
      - {code: b06_paid_bmo_m_in, aggregation_type: sum_agg, field_name: amount}
      - {code: b06_paid_bmo_m_out, aggregation_type: sum_agg, field_name: amount}
    plan: {code: golden_b06_paid_bmo, interval: monthly, amount_cents: 0}
    charges:
      - {billable_metric_code: b06_paid_bmo_m_in, charge_model: standard, properties: {amount: "0.5"}}
      - {billable_metric_code: b06_paid_bmo_m_out, charge_model: standard, properties: {amount: "0.5"}}
    customer: {external_id: golden_b06_paid_bmo_cust, currency: EUR}
    subscription: {external_id: golden_b06_paid_bmo_sub, billing_time: calendar}
    wallets:
      - name: one metric only
        code: b06_paid_bmo_w
        rate_amount: "1"
        currency: EUR
        paid_credits: "20"
        granted_credits: "12"
        applies_to: {billable_metric_codes: [b06_paid_bmo_m_in]}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_paid_bmo_m_in, properties: {amount: 10}}
        - {code: b06_paid_bmo_m_in, properties: {amount: 30}}
        - {code: b06_paid_bmo_m_in, properties: {amount: 20}}
        - {code: b06_paid_bmo_m_out, properties: {amount: 5}}
        - {code: b06_paid_bmo_m_out, properties: {amount: 25}}
        - {code: b06_paid_bmo_m_out, properties: {amount: 10}}
    - {at: "2024-03-06T00:00:00Z", do: perform_wallet_refresh}
    - {at: "2024-03-06T01:00:00Z", do: fetch_current_usage}
  expect:
    invoices: 1
    usage:
      amount_cents: 5000
      total_amount_cents: 5000
      charges_usage:
        - {billable_metric_code: b06_paid_bmo_m_in, units: "60", amount_cents: 3000}
        - {billable_metric_code: b06_paid_bmo_m_out, units: "40", amount_cents: 2000}
    wallet:
      code: b06_paid_bmo_w
      balance_cents: 1200
      ongoing_usage_balance_cents: 3000
      ongoing_balance_cents: -1800
  math: >-
    A mid-period read on the ONGOING path (Customers::RefreshWalletsService ->
    Wallets::Balance::AllocateOngoingUsageByWalletsService); nothing is billed, so no prepaid
    credit is applied and the invoice-time allocator never runs.
    Unbilled usage is 5_000¢ — 3_000¢ on the targeted metric (60 units) and 2_000¢ on the other
    (40 units) — under two separate fee keys, because the key carries the billable_metric_id
    (allocate_ongoing:118-123). The wallet targets only the first, so `applicable_fee?`
    (allocate_ongoing:126-134) leaves the 2_000¢ key with no applicable wallet at all and it is
    simply not allocated. For the 3_000¢ key the wallet is the only, hence last, applicable
    wallet, so it absorbs the whole amount and is allowed to go negative (allocate_ongoing:48-51):
    ongoing_usage_balance_cents = 3_000, ongoing_balance_cents = 1_200 - 3_000 = -1_800
    (refresh_ongoing_usage_service.rb:62-63).
    The row asserts a positive allocation and an exclusion at the same time, so it cannot be
    passed by an implementation that allocates nothing. Ignore the target and the wallet would
    absorb all 5_000¢, giving -3_800. Reuse the invoice-time clamp and it would report 1_200 / 0
    rather than 3_000 / -1_800. Count the pending 20 purchased credits as money and balance_cents
    would read 3_200 with ongoing_balance +200. The 2_000¢ of usage the wallet may not cover is
    asserted through the usage payload, which still reports the full 5_000¢ as owed.

- id: b06/hns/granted/target-wallet-code/partial-cover
  block: B6
  axes: {source: granted, limitation: target-wallet-code, application: partial-cover}
  dimensions: {interval: monthly, billing_time: calendar, rate_amount: 1}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    organization: {premium_integrations: [events_targeting_wallets]}
    metrics: [{code: b06_hns_tw, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_hns_tw, interval: monthly, amount_cents: 0}
    charges:
      - billable_metric_code: b06_hns_tw
        charge_model: standard
        properties: {amount: "1"}
        accepts_target_wallet: true
    customer: {external_id: golden_b06_hns_tw_cust, currency: EUR}
    subscription: {external_id: golden_b06_hns_tw_sub, billing_time: calendar}
    wallets:
      - {name: alpha, code: b06_hns_tw_alpha, rate_amount: "1", currency: EUR, granted_credits: "10"}
      - {name: beta, code: b06_hns_tw_beta, rate_amount: "1", currency: EUR, granted_credits: "100"}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_hns_tw, properties: {amount: 30, target_wallet_code: b06_hns_tw_alpha}}
        - {code: b06_hns_tw, properties: {amount: 20, target_wallet_code: b06_hns_tw_beta}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      fees_count: 3
      fees_amount_cents: 5000
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 3000
      total_amount_cents: 2000
  math: >-
    The fourth `limitation` value, and the only one that lives on the CHARGE rather than on the
    wallet. With `accepts_target_wallet` the charge's grouped_by keys gain "target_wallet_code"
    (fees/charge_service.rb:496), so the 50 units split into TWO charge fees by the property the
    events carry: 30 units → 3_000¢ tagged b06_hns_tw_alpha and 20 units → 2_000¢ tagged
    b06_hns_tw_beta, plus the 0¢ subscription fee — fees_count 3, fees_amount_cents 5_000¢.
    Allocation then keys each fee bucket by [fee_type, billable_metric_id, target_wallet_code]
    (allocate_prepaid_credits_by_wallets_service.rb:83) and `applicable_fee?` (:109-114) short-circuits
    on a present target: ONLY the wallet whose `code` equals the tag may pay that fee, whatever its
    own limitations say. So alpha's 1_000¢ balance is drained onto its own 3_000¢ fee and stops
    (partial cover), and beta — holding 10_000¢, ten times what is needed — may pay its own 2_000¢
    fee and nothing more. Prepaid credit is 1_000 + 2_000 = 3_000¢ and 2_000¢ is still owed.
    The counterfactual is exactly the state before the harness could send the flag: without it there
    is no grouping, ONE 5_000¢ charge fee, one unrestricted bucket, and both wallets spend freely —
    1_000¢ from alpha then 4_000¢ from beta, prepaid 5_000¢, total 0¢, fees_count 2. So the row
    separates "the tag routes credit" from "credit is spent wherever it fits" by 2_000¢ and by a
    fee count. fees_count carries the split rather than a per-fee list because two fees of one charge
    share every FEE_MATCH_KEYS identity field.

- id: b06/hns/granted/target-wallet-code/multi-wallet-priority
  block: B6
  axes: {source: granted, limitation: target-wallet-code, application: multi-wallet-priority}
  dimensions: {interval: monthly, billing_time: calendar, rate_amount: 1}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    organization: {premium_integrations: [events_targeting_wallets]}
    metrics: [{code: b06_hns_twp, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_hns_twp, interval: monthly, amount_cents: 0}
    charges:
      - billable_metric_code: b06_hns_twp
        charge_model: standard
        properties: {amount: "1"}
        accepts_target_wallet: true
    customer: {external_id: golden_b06_hns_twp_cust, currency: EUR}
    subscription: {external_id: golden_b06_hns_twp_sub, billing_time: calendar}
    wallets:
      - {name: untargeted first, code: b06_hns_twp_beta, rate_amount: "1", currency: EUR, granted_credits: "100", priority: 1}
      - {name: targeted last, code: b06_hns_twp_alpha, rate_amount: "1", currency: EUR, granted_credits: "100", priority: 20}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_hns_twp, properties: {amount: 30, target_wallet_code: b06_hns_twp_alpha}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_count: 2
      fees_amount_cents: 3000
      prepaid_credit_amount_cents: 3000
      total_amount_cents: 0
    wallet:
      code: b06_hns_twp_beta
      balance_cents: 10000
  math: >-
    Target beats priority — the one thing a single-wallet target row cannot say. Both wallets hold
    100 credits at rate 1.00 (10_000¢) and the charge fee is 30 × 1.00 = 3_000¢, so EITHER could
    cover it alone. `Wallet.in_application_order` walks priority ASC
    (allocate_prepaid_credits_by_wallets_service.rb:34 over :126), which reaches b06_hns_twp_beta
    (priority 1) FIRST; but the fee carries grouped_by["target_wallet_code"] = b06_hns_twp_alpha, and
    `applicable_fee?` returns `wallet.code == target_wallet_code` before it ever looks at targets,
    types or the unrestricted case (:109-114). So beta is skipped entirely and alpha, reached second,
    pays all 3_000¢ — total 0¢, and beta's balance is UNTOUCHED at 10_000¢.
    That last figure is the whole assertion: the invoice total is 0 under either behaviour, so a row
    asserting only the invoice would pass while the tag was being ignored. Before the harness could
    send `accepts_target_wallet` the fee had no tag, beta was unrestricted, and priority 1 spent
    beta's credits: balance 7_000¢, consumed 3_000¢. The 3_000¢ difference on ONE named wallet is the
    only place this cell is visible.

- id: b06/target-method/none/full-cover
  block: B6
  axes: {source: target-method, limitation: none, application: full-cover}
  dimensions: {interval: monthly, billing_time: calendar, rate_amount: 1, trigger: threshold, target_ongoing_balance: 20, grants_target_top_up: false}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    organization: {premium_integrations: [manual_payments]}
    metrics: [{code: b06_tgt_fc_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_tgt_fc, interval: monthly, amount_cents: 0}
    charges: [{billable_metric_code: b06_tgt_fc_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b06_tgt_fc_cust, currency: EUR}
    subscription: {external_id: golden_b06_tgt_fc_sub, billing_time: calendar}
    wallets:
      - name: target top-up
        code: b06_tgt_fc_w
        rate_amount: "1"
        currency: EUR
        recurring_transaction_rules:
          - {trigger: threshold, threshold_credits: "0", method: target, target_ongoing_balance: "20"}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_tgt_fc_sum, properties: {amount: 10}}
        - {code: b06_tgt_fc_sum, properties: {amount: 30}}
        - {code: b06_tgt_fc_sum, properties: {amount: 20}}
    - {at: "2024-03-06T00:00:00Z", do: perform_wallet_refresh}
    - {at: "2024-03-07T00:00:00Z", do: pay_invoice, invoice_type: credit}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {invoice_type: credit}
        fees_amount_cents: 8000
        taxes_amount_cents: 0
        total_amount_cents: 8000
      - select: {invoice_type: subscription}
        fees_amount_cents: 6000
        taxes_amount_cents: 0
        prepaid_credit_amount_cents: 6000
        prepaid_purchased_credit_amount_cents: 6000
        total_amount_cents: 0
        payment_status: succeeded
    wallet:
      code: b06_tgt_fc_w
      balance_cents: 2000
  math: >-
    `method: target` is one of the two RecurringTransactionRule methods (recurring_transaction_rule.rb:38-41,
    enum at :49). A `fixed` rule tops up BY a stated `paid_credits`/`granted_credits`; a `target` rule
    tops up TO `target_ongoing_balance` and derives the amount as
    `target_ongoing_balance − ongoing_balance` (:138-150, reached through compute_paid_credits :92-102
    and compute_granted_credits :104-112). The wallet therefore declares NO credits of its own — every
    credit in this row is sized by the rule.
    The `ongoing_balance` the gap is measured against is CREDITS_ONGOING_BALANCE, i.e. balance MINUS
    unbilled usage (refresh_ongoing_usage_service.rb:54-68:
    `ongoing_balance_cents = balance_cents − ongoing_usage_balance_cents`, then
    `credits_ongoing_balance = ongoing_balance_cents / 100 / rate_amount`), and that is the whole point
    of this slice. Three events 10/30/20 so sum 60 is distinguishable from max 30 and latest 20:
    60 units × 1.00 = 6_000¢ of unbilled usage. At the 6 March refresh the wallet holds 0¢, so
    ongoing_usage_balance_cents = 6_000, ongoing_balance_cents = −6_000, credits_ongoing_balance = −60.
    The rule fires because −60 is not above threshold_credits 0
    (threshold_top_up_service.rb:20-21) and asks for 20 − (−60) = 80 credits = 8_000¢. An
    implementation that measured the gap against `balance_cents` instead would ask for 20 − 0 = 20
    credits: name both, 8_000¢ vs 2_000¢ of top-up and a period total of 0 vs 4_000.
    `grants_target_top_up` is omitted, so it is false (recurring_transaction_rules/create_service.rb:44-46)
    and the top-up is PURCHASED: create_from_params_service.rb:114-143 creates it PENDING and raises a
    `credit` invoice — asserted directly at 8_000¢, which pins the computed amount without inferring it
    — so invoices is 2, and the credits are unusable until 7 March settles it. The period invoice then
    draws min(6_000 fee cap, 8_000 balance, 6_000 invoice) = 6_000
    (allocate_prepaid_credits_by_wallets_service.rb:53), leaving total 0, payment_status succeeded
    (calculate_fees_service.rb:63) and 2_000¢ in the wallet — the wallet is debited what the invoice
    needs, not its whole balance. prepaid_purchased is the full 6_000 and prepaid_granted is unset:
    a target top-up that is not granted lands entirely in the purchased pool
    (applied_prepaid_credits_service.rb:83-92). The rule does not re-arm after billing: the synchronous
    refresh at applied_prepaid_credits_service.rb:39 leaves credits_ongoing_balance at 20, above
    threshold 0, so threshold_top_up_service.rb:20 returns.

- id: b06/target-method/none/partial-cover
  block: B6
  axes: {source: target-method, limitation: none, application: partial-cover}
  dimensions: {interval: monthly, billing_time: calendar, rate_amount: 1, trigger: threshold, target_ongoing_balance: 0, grants_target_top_up: true}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    metrics: [{code: b06_tgt_pc_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_tgt_pc, interval: monthly, amount_cents: 0}
    charges: [{billable_metric_code: b06_tgt_pc_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b06_tgt_pc_cust, currency: EUR}
    subscription: {external_id: golden_b06_tgt_pc_sub, billing_time: calendar}
    wallets:
      - name: target zero
        code: b06_tgt_pc_w
        rate_amount: "1"
        currency: EUR
        recurring_transaction_rules:
          - {trigger: threshold, threshold_credits: "0", method: target, target_ongoing_balance: "0", grants_target_top_up: true}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-03T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_tgt_pc_sum, properties: {amount: 2}}
        - {code: b06_tgt_pc_sum, properties: {amount: 6}}
        - {code: b06_tgt_pc_sum, properties: {amount: 4}}
    - {at: "2024-03-04T00:00:00Z", do: perform_wallet_refresh}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_tgt_pc_sum, properties: {amount: 10}}
        - {code: b06_tgt_pc_sum, properties: {amount: 30}}
        - {code: b06_tgt_pc_sum, properties: {amount: 20}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_amount_cents: 7200
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 1200
      prepaid_granted_credit_amount_cents: 1200
      total_amount_cents: 6000
    wallet:
      code: b06_tgt_pc_w
      balance_cents: 0
  math: >-
    A target rule is sized WHEN IT FIRES, against the usage visible at that instant — so the way to
    make a target rule under-cover is to let usage grow after the top-up. 12 units (2+6+4) exist at the
    4 March refresh: ongoing_usage_balance_cents 1_200, balance 0, credits_ongoing_balance −12
    (refresh_ongoing_usage_service.rb:54-68). target_ongoing_balance is 0, so the gap is 0 − (−12) = 12
    credits = 1_200¢ (recurring_transaction_rule.rb:138-150) — a target of zero means "fund exactly the
    unbilled usage", which is the sharpest statement of what the method measures. grants_target_top_up
    is true, so the credits are GRANTED: settled immediately, no invoice
    (create_from_params_service.rb:145-173), which is why invoices stays 1.
    Then 60 more units (10/30/20 — sum 60 ≠ max 30 ≠ latest 20) arrive with no refresh between, so the
    period invoice is 72 units × 1.00 = 7_200¢ against a 1_200¢ wallet: prepaid is
    min(7_200, 1_200, 7_200) = 1_200 (allocate_prepaid_credits_by_wallets_service.rb:53) and 6_000¢ stays
    owed in cash. Two wrong implementations, both named: a rule measuring the gap against `balance_cents`
    (0) would top up 0 − 0 = 0 credits, prepaid 0 and total 7_200; a rule evaluated at billing time
    instead of at the refresh would see 72 units and top up 7_200¢, prepaid 7_200 and total 0.
    The re-arm after billing is a provable no-op rather than an omission: the wallet is drained to 0 and
    the synchronous refresh (applied_prepaid_credits_service.rb:39) reports
    credits_ongoing_balance 0, which is NOT above threshold_credits 0, so threshold_top_up_service.rb:23
    runs — but compute_target_top_up_amount returns 0.0 when ongoing_balance >= target
    (recurring_transaction_rule.rb:139-141), and CreateFromParamsService creates nothing for a zero
    amount (:115, :146). balance_cents 0 and consumed 1_200 therefore also assert that no second top-up
    appeared.

- id: b06/target-method/none/multi-wallet-priority
  block: B6
  axes: {source: target-method, limitation: none, application: multi-wallet-priority}
  dimensions: {interval: monthly, billing_time: calendar, rate_amount: 1, trigger: threshold, target_ongoing_balance: 10, grants_target_top_up: true}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    organization: {premium_integrations: [manual_payments]}
    metrics: [{code: b06_tgt_mwp_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_tgt_mwp, interval: monthly, amount_cents: 0}
    charges: [{billable_metric_code: b06_tgt_mwp_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b06_tgt_mwp_cust, currency: EUR}
    subscription: {external_id: golden_b06_tgt_mwp_sub, billing_time: calendar}
    wallets:
      - name: target wallet, low priority
        code: b06_tgt_mwp_target
        rate_amount: "1"
        currency: EUR
        priority: 20
        recurring_transaction_rules:
          - {trigger: threshold, threshold_credits: "0", method: target, target_ongoing_balance: "10", grants_target_top_up: true}
      - name: purchased wallet, high priority
        code: b06_tgt_mwp_paid
        rate_amount: "1"
        currency: EUR
        priority: 1
        paid_credits: "20"
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-02T00:00:00Z", do: pay_invoice, invoice_type: credit}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_tgt_mwp_sum, properties: {amount: 10}}
        - {code: b06_tgt_mwp_sum, properties: {amount: 30}}
        - {code: b06_tgt_mwp_sum, properties: {amount: 20}}
    - {at: "2024-03-06T00:00:00Z", do: perform_wallet_refresh}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      select: {invoice_type: subscription}
      fees_amount_cents: 6000
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 6000
      prepaid_granted_credit_amount_cents: 4000
      prepaid_purchased_credit_amount_cents: 2000
      total_amount_cents: 0
    wallet:
      code: b06_tgt_mwp_target
      balance_cents: 1000
  math: >-
    Two wallets, declared in the WRONG order on purpose — the low-priority target wallet first —
    because both the ongoing allocation and the billing draw follow `Wallet.in_application_order`,
    priority ASC then created_at (wallet.rb:69-71), not declaration order. b06_tgt_mwp_paid holds 20
    PURCHASED credits (2_000¢, settled on 2 March) at priority 1; b06_tgt_mwp_target holds nothing and
    carries the target rule at priority 20. One wallet purchased-only and the other granted-only, so
    the prepaid breakdown (applied_prepaid_credits_service.rb:83-92) maps one-to-one onto the wallets
    and both contributions are pinned even though `expect.wallet` takes a single wallet.
    The mid-period cascade sizes the target top-up, and this is where priority first bites. At the
    6 March refresh 60 units (10/30/20) = 6_000¢ are unbilled. allocate_ongoing_usage_by_wallets_service.rb
    walks the applicable wallets in application order: index 0 is the purchased wallet, which is NOT a
    threshold wallet, so it is capped by its own room — min(6_000, 2_000) = 2_000 (:53-55). Index 1 is
    the target wallet, and a wallet with an active threshold rule is deliberately allowed to absorb
    everything and go negative so its rule can refill it (:48-51, threshold_wallet? at :139-141), so it
    takes the remaining 4_000. Its credits_ongoing_balance is therefore −40, not −60, and the rule asks
    for 10 − (−40) = 50 credits = 5_000¢ granted (recurring_transaction_rule.rb:138-150). An
    implementation that let the threshold wallet swallow the whole 6_000 regardless of the cascade would
    ask for 70 credits: name both, target-wallet balance 1_000 vs 3_000 at the end.
    At billing the draw is again in priority order and the amounts are chosen so the order CHANGES the
    split: purchased first takes min(6_000, 2_000, 6_000) = 2_000, then the target wallet takes
    min(4_000, 5_000, 4_000) = 4_000 (allocate_prepaid_credits_by_wallets_service.rb:53-57). Total prepaid
    6_000, total 0, and the breakdown is 2_000 purchased / 4_000 granted. Creation order first would draw
    5_000 from the target wallet and 1_000 from the purchased one — 5_000 granted / 1_000 purchased, and
    the target wallet emptied instead of holding 1_000. No re-arm: 1_000¢ left is
    credits_ongoing_balance 10, above threshold 0 (threshold_top_up_service.rb:20).

- id: b06/target-method/none/rounding
  block: B6
  axes: {source: target-method, limitation: none, application: rounding}
  dimensions: {interval: monthly, billing_time: calendar, rate_amount: "0.3333", trigger: threshold, target_ongoing_balance: "9.982", grants_target_top_up: true}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    metrics: [{code: b06_tgt_rnd_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_tgt_rnd, interval: monthly, amount_cents: 0}
    charges: [{billable_metric_code: b06_tgt_rnd_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b06_tgt_rnd_cust, currency: EUR}
    subscription: {external_id: golden_b06_tgt_rnd_sub, billing_time: calendar}
    wallets:
      - name: target at a fractional rate
        code: b06_tgt_rnd_w
        rate_amount: "0.3333"
        currency: EUR
        recurring_transaction_rules:
          - {trigger: threshold, threshold_credits: "0", method: target, target_ongoing_balance: "9.982", grants_target_top_up: true}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_tgt_rnd_sum, properties: {amount: 10}}
        - {code: b06_tgt_rnd_sum, properties: {amount: 30}}
        - {code: b06_tgt_rnd_sum, properties: {amount: 20}}
    - {at: "2024-03-06T00:00:00Z", do: perform_wallet_refresh}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_amount_cents: 6000
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 6000
      prepaid_granted_credit_amount_cents: 6000
      total_amount_cents: 0
    wallet:
      code: b06_tgt_rnd_w
      balance_cents: 333
  math: >-
    A target rule rounds TWICE, and the two roundings are in different units. First, the ongoing
    balance the gap is measured against is computed in CREDITS by float division and stored in a
    decimal(30,5) column: `ongoing_balance_cents.to_f.fdiv(100).fdiv(rate_amount)`
    (refresh_ongoing_usage_service.rb:66-68). 60 units × 1.00 = 6_000¢ of unbilled usage against a 0¢
    balance gives −6_000¢, and −60 / 0.3333 = −180.018001800180…, stored as −180.01800. Second, the
    credits the rule asks for are converted back to money by
    `(credit_amount × rate_amount).round(currency.exponent) × 100` (wallet_credit.rb:26-27), a HALF-UP
    round of the currency amount and not a truncation.
    target_ongoing_balance 9.982 is chosen so the gap is exact: 9.982 − (−180.018) = 190.00000 credits
    (recurring_transaction_rule.rb:143). 190 × 0.3333 = 63.327, which HALF-UP is 63.33 → 6_333¢ of
    granted credits. TRUNCATING would give 63.32 → 6_332¢. Name both: the top-up is 6_333 vs 6_332 and
    the wallet ends on 333¢ vs 332¢. A third wrong answer, the rule measuring its gap against
    `balance_cents` (0) rather than the ongoing balance: 9.982 × 0.3333 = 3.32700 → 3.33 → 333¢ of
    top-up, prepaid 333 and total 5_667.
    Three events 10/30/20 so sum 60 is distinguishable from max 30 and latest 20. The invoice is 6_000¢
    and the wallet holds 6_333¢, so prepaid is min(6_000, 6_333, 6_000) = 6_000
    (allocate_prepaid_credits_by_wallets_service.rb:53) and the residue is 333¢ — the rounding survives
    into the asserted balance rather than being absorbed by the invoice. No re-arm: 333¢ is
    credits_ongoing_balance 9.991, above threshold_credits 0 (threshold_top_up_service.rb:20).

- id: b06/target-method/none/negative-total
  block: B6
  pins: ["F38"]
  axes: {source: target-method, limitation: none, application: negative-total}
  dimensions: {interval: monthly, billing_time: calendar, rate_amount: 1, trigger: threshold, target_ongoing_balance: 100, coupon: fixed_2000_once}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    metrics: [{code: b06_tgt_neg_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_tgt_neg, interval: monthly, amount_cents: 0}
    charges: [{billable_metric_code: b06_tgt_neg_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b06_tgt_neg_cust, currency: EUR}
    subscription: {external_id: golden_b06_tgt_neg_sub, billing_time: calendar}
    coupons:
      - {code: b06_tgt_neg_cpn, coupon_type: fixed_amount, amount_cents: 2000, amount_currency: EUR, frequency: once, expiration: no_expiration}
    wallets:
      - name: over-funded by target
        code: b06_tgt_neg_w
        rate_amount: "1"
        currency: EUR
        recurring_transaction_rules:
          - {trigger: threshold, threshold_credits: "0", method: target, target_ongoing_balance: "100", grants_target_top_up: true}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_tgt_neg_sum, properties: {amount: 10}}
        - {code: b06_tgt_neg_sum, properties: {amount: 30}}
        - {code: b06_tgt_neg_sum, properties: {amount: 20}}
    - {at: "2024-03-06T00:00:00Z", do: perform_wallet_refresh}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_amount_cents: 6000
      coupons_amount_cents: 2000
      sub_total_excluding_taxes_amount_cents: 4000
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 4000
      prepaid_granted_credit_amount_cents: 4000
      total_amount_cents: 0
      payment_status: succeeded
    wallet:
      code: b06_tgt_neg_w
      balance_cents: 12000
  math: >-
    A target rule over-funds by construction here, which is the cleanest way to ask what Lago does when
    a wallet is worth more than the invoice. target_ongoing_balance 100 against 60 units × 1.00 = 6_000¢
    of unbilled usage: at the 6 March refresh credits_ongoing_balance is −60, so the gap is
    100 − (−60) = 160 credits = 16_000¢ of granted credit
    (recurring_transaction_rule.rb:138-150), against an invoice that will owe only 4_000¢.
    Lago CLAMPS and leaves the surplus in the wallet. Every draw is bounded by
    `remaining_invoice_amount` (allocate_prepaid_credits_by_wallets_service.rb:53, decremented at :57),
    so exactly 4_000¢ leaves and 12_000¢ stays. The three alternatives, named: (a) total −12_000 if the
    applicable balance were drained, (b) a `credit` invoice or credit note for the 12_000 surplus —
    none is issued, invoices stays 1, (c) the wallet drained to 0. None happens.
    The 4_000 ceiling is the row's second half, and it is what the coupon is for. Prepaid credit is the
    LAST reducer (calculate_fees_service.rb:53-62: progressive billing → coupon → tax → credit note →
    prepaid) and the per-fee cap is `sub_total_excluding_taxes + taxes_precise − precise_credit_notes`
    (allocate_prepaid_credits_by_wallets_service.rb:77-79) where
    `sub_total_excluding_taxes_amount_cents = amount_cents − precise_coupons_amount_cents`: 6_000 − 2_000
    = 4_000, which equals invoice.total so `reconcile_remaining_amounts` (:93-106) adds nothing. Credits
    applied BEFORE the coupon would have taken 6_000 and left 10_000 — name both, prepaid 4_000 vs 6_000
    and wallet 12_000 vs 10_000.
    A third fact only a target rule can show: the top-up is sized against GROSS unbilled usage. Ongoing
    usage is pooled as `fee.amount_cents + fee.taxes_amount_cents`
    (allocate_ongoing_usage_by_wallets_service.rb:90) with no coupon subtracted, so the rule funds
    16_000¢ for an invoice that will only ever need 4_000 — it over-funds by exactly the coupon. A rule
    that netted the pending coupon would have asked for 140 credits and ended on 10_000¢.
    No re-arm: 12_000¢ left is credits_ongoing_balance 120, above threshold_credits 0
    (threshold_top_up_service.rb:20).

- id: b06/target-method/none/ongoing-balance
  block: B6
  axes: {source: target-method, limitation: none, application: ongoing-balance}
  dimensions: {interval: monthly, billing_time: calendar, rate_amount: 1, trigger: threshold, target_ongoing_balance: 25, read_at: mid-period}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    metrics: [{code: b06_tgt_ong_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_tgt_ong, interval: monthly, amount_cents: 0}
    charges: [{billable_metric_code: b06_tgt_ong_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b06_tgt_ong_cust, currency: EUR}
    subscription: {external_id: golden_b06_tgt_ong_sub, billing_time: calendar}
    wallets:
      - name: target read mid-period
        code: b06_tgt_ong_w
        rate_amount: "1"
        currency: EUR
        recurring_transaction_rules:
          - {trigger: threshold, threshold_credits: "0", method: target, target_ongoing_balance: "25", grants_target_top_up: true}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_tgt_ong_sum, properties: {amount: 10}}
        - {code: b06_tgt_ong_sum, properties: {amount: 30}}
        - {code: b06_tgt_ong_sum, properties: {amount: 20}}
    - {at: "2024-03-06T00:00:00Z", do: perform_wallet_refresh}
  expect:
    invoices: 0
    wallet:
      code: b06_tgt_ong_w
      balance_cents: 8500
      ongoing_usage_balance_cents: 6000
      ongoing_balance_cents: 2500
  math: >-
    A mid-period read with NO invoice anywhere, and for a target rule it is the only surface on which
    the method's defining claim is directly visible: after the rule fires, ongoing_balance_cents equals
    the target. `perform_wallet_refresh` runs Clock::RefreshWalletsOngoingBalanceJob (premium-gated at
    refresh_wallets_ongoing_balance_job.rb:8, hence `premium: true`) → Customers::RefreshWalletsService →
    Wallets::Balance::AllocateOngoingUsageByWalletsService, a reimplementation of the billing allocator
    rather than the same code (allocate_ongoing_usage_by_wallets_service.rb:33-65).
    The refresh runs twice and the two passes are the row. Pass one: balance 0, unbilled usage 60 units
    × 1.00 = 6_000¢ (pooled as `fee.amount_cents + fee.taxes_amount_cents`, :90), so
    ongoing_usage_balance_cents 6_000, ongoing_balance_cents −6_000, credits_ongoing_balance −60
    (refresh_ongoing_usage_service.rb:62-68) — a single threshold wallet is allowed to go negative
    (:48-51). Persisting that changes the wallet's ongoing columns, which is what arms the rule:
    `state_changed` is exactly `saved_change_to_ongoing_usage_balance_cents? ||
    saved_change_to_ongoing_balance_cents?` (update_ongoing_service.rb:18-19) and the rule is skipped
    outright without it (threshold_top_up_service.rb:18). −60 is not above threshold_credits 0, so the
    rule asks for 25 − (−60) = 85 credits = 8_500¢ granted. Wallets::Balance::IncreaseService then
    re-enqueues the refresh (increase_service.rb:36), and pass two reports ongoing_usage 6_000 against a
    balance of 8_500 → ongoing_balance 2_500 = 25 credits, which IS above threshold 0, so the rule stops
    (:20). It converges after exactly one top-up.
    The alternatives, named: a rule sizing the gap against `balance_cents` (0) would grant 25 credits and
    leave balance 2_500 with ongoing_balance 2_500 − 6_000 = −3_500; a rule that clamped the ongoing
    balance at zero would never see −60 and would grant 25 credits as well. So balance_cents 8_500 vs
    2_500 and ongoing_balance_cents +2_500 vs −3_500 are the discriminating pair, and asserting both is
    what makes this a target row rather than a restatement of the granted one.
    invoices is 0 and consumed_amount_cents is 0: a GRANTED target top-up raises no invoice
    (create_from_params_service.rb:145-173) and the ongoing figures are a projection that never debits
    the wallet.

- id: b06/target-method/fee-types/full-cover
  block: B6
  axes: {source: target-method, limitation: fee-types, application: full-cover}
  dimensions: {interval: monthly, billing_time: calendar, allowed_fee_types: charge, target_ongoing_balance: 20, grants_target_top_up: false}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    organization: {premium_integrations: [manual_payments]}
    metrics: [{code: b06_tgt_ftf_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_tgt_ftf, interval: monthly, amount_cents: 5000}
    charges: [{billable_metric_code: b06_tgt_ftf_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b06_tgt_ftf_cust, currency: EUR}
    subscription: {external_id: golden_b06_tgt_ftf_sub, billing_time: calendar}
    wallets:
      - name: charges only, target
        code: b06_tgt_ftf_w
        rate_amount: "1"
        currency: EUR
        applies_to: {fee_types: [charge]}
        recurring_transaction_rules:
          - {trigger: threshold, threshold_credits: "0", method: target, target_ongoing_balance: "20"}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_tgt_ftf_sum, properties: {amount: 10}}
        - {code: b06_tgt_ftf_sum, properties: {amount: 30}}
        - {code: b06_tgt_ftf_sum, properties: {amount: 20}}
    - {at: "2024-03-06T00:00:00Z", do: perform_wallet_refresh}
    - {at: "2024-03-07T00:00:00Z", do: pay_invoice, invoice_type: credit}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {invoice_type: credit}
        fees_amount_cents: 8000
        total_amount_cents: 8000
      - select: {invoice_type: subscription}
        fees_amount_cents: 11000
        taxes_amount_cents: 0
        prepaid_credit_amount_cents: 6000
        prepaid_purchased_credit_amount_cents: 6000
        total_amount_cents: 5000
        fees:
          - {fee_type: subscription, amount_cents: 5000, taxes_amount_cents: 0}
          - {fee_type: charge, item_code: b06_tgt_ftf_sum, amount_cents: 6000, taxes_amount_cents: 0}
    wallet:
      code: b06_tgt_ftf_w
      balance_cents: 2000
  math: >-
    The invoice holds two kinds of fee — a 5_000¢ subscription fee and a 6_000¢ charge fee, both listed
    so the split is pinned rather than inferred — and the wallet is limited to fee_type `charge`. The
    subscription fee is the fee the wallet may NOT pay, and it is asserted as still owed in cash:
    total_amount_cents 5_000 is exactly it.
    The limitation shapes the target rule too, which is the part a fixed rule cannot show. Ongoing usage
    is filtered by the same `applicable_fee?` predicate as billing
    (allocate_ongoing_usage_by_wallets_service.rb:126-137), and Invoices::CustomerUsageService emits only
    CHARGE fees, so the charge-limited wallet sees the whole 6_000¢ pool and absorbs it as a threshold
    wallet (:48-51). credits_ongoing_balance is −60 and the rule asks for 20 − (−60) = 80 credits =
    8_000¢ (recurring_transaction_rule.rb:138-150). Note what it does NOT see: the 5_000¢ subscription
    fee the invoice will carry is invisible to a current-usage read, so a target rule systematically
    under-funds a plan with a subscription fee — 8_000¢ funded against an 11_000¢ invoice.
    grants_target_top_up is false, so this is a PURCHASED top-up: pending on creation, with its own
    `credit` invoice asserted at 8_000¢ (create_from_params_service.rb:114-143), unusable until 7 March
    settles it, hence invoices 2. At billing the buckets are ["charge", metric] capped at 6_000 and
    ["subscription", nil] capped at 5_000
    (allocate_prepaid_credits_by_wallets_service.rb:70-91); the wallet matches only the first
    (:108-122, type_match on allowed_fee_types) and draws min(6_000, 8_000, 11_000) = 6_000, leaving
    2_000¢ behind. A limitation-blind implementation would draw 8_000 and report total 3_000: name both,
    prepaid 6_000 vs 8_000 and total 5_000 vs 3_000. No re-arm: 2_000¢ is credits_ongoing_balance 20,
    above threshold 0 (threshold_top_up_service.rb:20).

- id: b06/target-method/fee-types/partial-cover
  block: B6
  axes: {source: target-method, limitation: fee-types, application: partial-cover}
  dimensions: {interval: monthly, billing_time: calendar, allowed_fee_types: charge, target_ongoing_balance: 0, grants_target_top_up: true}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    metrics: [{code: b06_tgt_ftp_sum, aggregation_type: sum_agg, field_name: amount}]
