  axes: {source: interval-rule, limitation: target-wallet-code, application: negative-total}
  dimensions: {interval: monthly, billing_time: calendar, rate_amount: 1, coupon: fixed_2000_once, top_up: granted-80}
  provenance: coverage-gap
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  setup:
    organization: {premium_integrations: [events_targeting_wallets]}
    metrics: [{code: b06_itv_tnt_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_itv_tnt, interval: monthly, amount_cents: 0}
    charges:
      - billable_metric_code: b06_itv_tnt_sum
        charge_model: standard
        properties: {amount: "1"}
        accepts_target_wallet: true
    customer: {external_id: golden_b06_itv_tnt_cust, currency: EUR}
    subscription: {external_id: golden_b06_itv_tnt_sub, billing_time: calendar}
    coupons:
      - {name: itv target negative coupon, code: b06_itv_tnt_cpn, coupon_type: fixed_amount, amount_cents: 2000, amount_currency: EUR, frequency: once, expiration: no_expiration}
    wallets:
      - name: targeted, over refilled on schedule
        code: b06_itv_tnt_a
        rate_amount: "1"
        currency: EUR
        priority: 1
        recurring_transaction_rules:
          - {trigger: interval, interval: monthly, method: fixed, granted_credits: "80"}
      - {name: empty target, code: b06_itv_tnt_b, rate_amount: "1", currency: EUR, priority: 20}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_itv_tnt_sum, properties: {amount: 10, target_wallet_code: b06_itv_tnt_a}}
        - {code: b06_itv_tnt_sum, properties: {amount: 15, target_wallet_code: b06_itv_tnt_a}}
        - {code: b06_itv_tnt_sum, properties: {amount: 5, target_wallet_code: b06_itv_tnt_a}}
        - {code: b06_itv_tnt_sum, properties: {amount: 12, target_wallet_code: b06_itv_tnt_b}}
        - {code: b06_itv_tnt_sum, properties: {amount: 8, target_wallet_code: b06_itv_tnt_b}}
    - {at: "2024-04-01T00:30:00Z", do: perform_interval_wallet_top_ups}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      fees_count: 3
      fees_amount_cents: 5000
      coupons_amount_cents: 2000
      sub_total_excluding_taxes_amount_cents: 3000
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 1800
      prepaid_granted_credit_amount_cents: 1800
      total_amount_cents: 1200
      payment_status: pending
    wallet:
      code: b06_itv_tnt_a
      balance_cents: 6200
  math: >-
    A wallet refilled on schedule to five times the invoice's payable ceiling while 1_200¢ stays
    unpaid: the total never goes negative and the surplus is never refunded. Wallet a is created
    EMPTY on 1 March inside the first step's travel_to, excluded from the rule that day
    (create_interval_wallet_transactions_service.rb:74) and due on the day-1 monthly anniversary of
    1 April (:120-130), where a flat 80 granted credits = 8_000¢ land
    (recurring_transaction_rule.rb:104-111). Granted credits settle at once and raise no invoice, so
    invoices stays 1, and nothing scales the grant to what is owed.
    Fees 5_000¢ over three fees (two tagged plus the 0¢ subscription fee a plan with amount_cents 0 still emits, hence fees_count 3):
    3_000¢ tagged b06_itv_tnt_a (10/15/5: sum 30 ≠ max 15 ≠ latest 5) and 2_000¢ tagged
    b06_itv_tnt_b. The fixed_amount coupon spreads BY WEIGHT (fee.rb:232-236 through
    credits/applied_coupon_service.rb:35-37): 2_000 × 3_000/5_000 = 1_200 onto the a fee and 800 onto
    the b fee, so the caps are `sub_total_excluding_taxes + taxes_precise − precise_credit_notes` =
    1_800 and 1_200 (allocate_prepaid_credits_by_wallets_service.rb:77-79) and invoice.total is
    5_000 − 2_000 = 3_000.
    Wallet b holds no credits at all, so `with_positive_balance` (wallet.rb:65) drops it and its
    1_200¢ can be paid by nobody — wallet a is refused it by the tag (:109-114) while sitting on
    6_200¢. Every draw is also bounded by `remaining_invoice_amount` (:53, :57), so prepaid is 1_800
    and the total clamps at 1_200 rather than −5_000.
    Named alternatives: credits applied BEFORE the coupon would cap the a fee at 3_000 → prepaid
    3_000, total 0, balance 5_000; a tag-blind allocator would let a pay both caps → the same 3_000
    and 0, balance 5_000; a `credit` invoice or credit note for the surplus, or a wallet drained to 0
    — neither happens. Nothing re-arms after billing either: an interval rule is due on a date, so
    the post-billing refresh (applied_prepaid_credits_service.rb:34-39) cannot top a up the way it
    would a threshold wallet, and 6_200 is stable.

- id: b06/interval-rule/target-wallet-code/ongoing-balance
  block: B6
  axes: {source: interval-rule, limitation: target-wallet-code, application: ongoing-balance}
  dimensions: {interval: monthly, billing_time: calendar, rate_amount: 1, read_at: mid-period, top_up: granted-40}
  provenance: coverage-gap
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  setup:
    organization: {premium_integrations: [events_targeting_wallets]}
    metrics: [{code: b06_itv_tob_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_itv_tob, interval: monthly, amount_cents: 0}
    charges:
      - billable_metric_code: b06_itv_tob_sum
        charge_model: standard
        properties: {amount: "1"}
        accepts_target_wallet: true
    customer: {external_id: golden_b06_itv_tob_cust, currency: EUR}
    subscription: {external_id: golden_b06_itv_tob_sub, billing_time: calendar}
    wallets:
      - name: targeted, interval refilled
        code: b06_itv_tob_a
        rate_amount: "1"
        currency: EUR
        priority: 1
        recurring_transaction_rules:
          - {trigger: interval, interval: monthly, method: fixed, granted_credits: "40"}
      - {name: targeted neighbour, code: b06_itv_tob_b, rate_amount: "1", currency: EUR, granted_credits: "50", priority: 20}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-04-01T00:30:00Z", do: perform_interval_wallet_top_ups}
    - at: "2024-04-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_itv_tob_sum, properties: {amount: 10, target_wallet_code: b06_itv_tob_a}}
        - {code: b06_itv_tob_sum, properties: {amount: 30, target_wallet_code: b06_itv_tob_a}}
        - {code: b06_itv_tob_sum, properties: {amount: 20, target_wallet_code: b06_itv_tob_a}}
        - {code: b06_itv_tob_sum, properties: {amount: 25, target_wallet_code: b06_itv_tob_b}}
        - {code: b06_itv_tob_sum, properties: {amount: 15, target_wallet_code: b06_itv_tob_b}}
    - {at: "2024-04-10T00:00:00Z", do: perform_wallet_refresh}
  expect:
    invoices: 0
    wallet:
      code: b06_itv_tob_a
      balance_cents: 4000
      ongoing_usage_balance_cents: 6000
      ongoing_balance_cents: -2000
  math: >-
    The tag decides how much unbilled usage a scheduled top-up is measured against, and that is
    exactly where a tag-blind implementation is visible: the two wallets have DIFFERENT balances, so
    merging the buckets changes which of them absorbs what. Both clock jobs appear and do different
    things — the interval verb (Clock::CreateIntervalWalletTransactionsJob →
    Wallets::CreateIntervalWalletTransactionsService, its only caller) puts a flat 40 granted credits
    = 4_000¢ into wallet a on the day-1 monthly anniversary of 1 April
    (create_interval_wallet_transactions_service.rb:120-130, both wallets having been created on
    1 March inside the first step's travel_to and therefore excluded that day, :74); the refresh verb
    (Clock::RefreshWalletsOngoingBalanceJob, premium-gated at
    refresh_wallets_ongoing_balance_job.rb:8) then computes the ongoing balance. March carries no
    events and is never billed, so invoices is 0 and the pool is April usage only.
    Current-usage fees keep their grouping (fees/charge_service.rb:493-499), so the pool holds two
    keys: 6_000¢ tagged b06_itv_tob_a (10/30/20: sum 60 ≠ max 30 ≠ latest 20) and 4_000¢ tagged
    b06_itv_tob_b. `applicable_fee?` gives each key exactly one wallet
    (allocate_ongoing_usage_by_wallets_service.rb:126-137), and that wallet is therefore the last
    applicable one for its key, so it absorbs the whole amount with no room check (:47-58) — wallet a
    reserves against its OWN 6_000, not the 10_000 of total usage. ongoing_usage_balance_cents 6_000
    and ongoing_balance_cents = 4_000 − 6_000 = −2_000 (refresh_ongoing_usage_service.rb:63): a
    wallet is allowed NEGATIVE on the ongoing side and `depleted_ongoing_balance` flips true
    (:41-45). Nothing re-arms — an interval rule is due on a date, not on a balance, so unlike a
    threshold wallet there is no cascade after the read.
    Tag-blind, the two keys merge into one 10_000¢ pool with both wallets applicable. Wallet a
    (priority 1) is then NOT the last applicable one, so it is capped at its own room:
    take = min(10_000, 4_000) = 4_000 (:52-55), leaving ongoing_usage 4_000 and ongoing_balance 0,
    with b absorbing the remaining 6_000 as the last wallet. Name both: ongoing_usage 6_000 vs 4_000
    and ongoing_balance −2_000 vs 0. A hollowed interval verb gives balance 0, ongoing_usage 6_000
    and ongoing_balance −6_000, which is why the balance is asserted beside the pair.
