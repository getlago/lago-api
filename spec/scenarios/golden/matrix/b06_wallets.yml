    (recurring_transaction_rule.rb:138-150), and `(150 × 0.6665).round(2) × 100` (wallet_credit.rb:26-27)
    is 99.975 → HALF-UP 99.98 → 9_998¢. Truncation or half-even would give 99.97 → 9_997¢: both numbers
    are named, and the row carries the single cent into the invoice total. The re-refresh reads
    (9_998 − 6_665)/100/0.6665 = 50.0075 credits, above the target of 50, so exactly one top-up occurs;
