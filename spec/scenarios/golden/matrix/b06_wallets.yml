      - {name: targeted broke, code: b06_itv_tmp_d, rate_amount: "1", currency: EUR, granted_credits: "5", priority: 30}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_itv_tmp_sum, properties: {amount: 5, target_wallet_code: b06_itv_tmp_a}}
        - {code: b06_itv_tmp_sum, properties: {amount: 15, target_wallet_code: b06_itv_tmp_a}}
        - {code: b06_itv_tmp_sum, properties: {amount: 10, target_wallet_code: b06_itv_tmp_a}}
        - {code: b06_itv_tmp_sum, properties: {amount: 12, target_wallet_code: b06_itv_tmp_d}}
        - {code: b06_itv_tmp_sum, properties: {amount: 8, target_wallet_code: b06_itv_tmp_d}}
    - {at: "2024-04-01T00:30:00Z", do: perform_interval_wallet_top_ups}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      fees_count: 3
      fees_amount_cents: 5000
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 3500
      prepaid_granted_credit_amount_cents: 3500
      total_amount_cents: 1500
      payment_status: pending
    wallet:
      code: b06_itv_tmp_g
      balance_cents: 10000
  math: >-
    Target beats priority, with a scheduled top-up as the thing being confined. Three wallets:
    b06_itv_tmp_g at priority 1, unrestricted, 10_000¢; b06_itv_tmp_a at priority 20, created EMPTY,
    with an interval rule; b06_itv_tmp_d at priority 30 with 500¢. Both charge fees carry a tag —
    3_000¢ to a (5/15/10: sum 30 ≠ max 15 ≠ latest 10) and 2_000¢ to d — plus the 0¢ subscription
    fee a plan with amount_cents 0 still emits, hence fees_count 3 on 5_000¢ of fees. g is
    applicable to NEITHER tagged bucket
    (allocate_prepaid_credits_by_wallets_service.rb:109-114) even though
    `Wallet.in_application_order` reaches it first (wallet.rb:69-71); an unrestricted wallet is not
    unrestricted against a tag.
    Wallet a is created on 1 March inside the first step's travel_to, so its rule is excluded that
    day (create_interval_wallet_transactions_service.rb:74) and due on the day-1 monthly anniversary
    of 1 April (:120-130), granting a flat 80 credits = 8_000¢ (recurring_transaction_rule.rb:104-111)
    — settled at once, no `credit` invoice, invoices stays 1.
    At billing g contributes nothing and is dropped on `next if total_amount_cents <= 0` (:64),
    keeping all 10_000¢; a pays its own 3_000¢, min(3_000, 8_000, 5_000) = 3_000, ending at 5_000¢; d
    pays min(2_000, 500, 2_000) = 500 and empties. Prepaid 3_500 of 5_000¢, total 1_500 owed in cash
    — d's unfunded remainder, which the wallet with 10_000¢ in it is forbidden to pay.
    g's balance is the whole assertion because it is the number the tag decides: tag-blind, the two
    buckets merge into one 5_000¢ key and g, first in application order, pays all of it — prepaid
    5_000, total 0, g at 5_000. A hollowed interval verb leaves a on a zero balance, dropped by
    `with_positive_balance` (wallet.rb:65): prepaid 500, total 4_500, g still at 10_000, which is why
    the invoice figures are asserted beside it. Name all three: g 10_000 / 5_000 / 10_000 with total
    1_500 / 0 / 4_500.

- id: b06/interval-rule/target-wallet-code/rounding
  block: B6
  axes: {source: interval-rule, limitation: target-wallet-code, application: rounding}
  dimensions: {interval: monthly, billing_time: calendar, rate_amount: "0.3335", top_up: granted-70}
  provenance: coverage-gap
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  setup:
    organization: {premium_integrations: [events_targeting_wallets]}
    metrics: [{code: b06_itv_trd_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_itv_trd, interval: monthly, amount_cents: 0}
    charges:
      - billable_metric_code: b06_itv_trd_sum
        charge_model: standard
        properties: {amount: "0.1"}
        accepts_target_wallet: true
    customer: {external_id: golden_b06_itv_trd_cust, currency: EUR}
    subscription: {external_id: golden_b06_itv_trd_sub, billing_time: calendar}
    wallets:
      - name: awkward rate, targeted, interval refilled
        code: b06_itv_trd_a
        rate_amount: "0.3335"
        currency: EUR
        priority: 1
        recurring_transaction_rules:
          - {trigger: interval, interval: monthly, method: fixed, granted_credits: "70"}
      - {name: "targeted, whole rate", code: b06_itv_trd_b, rate_amount: "1", currency: EUR, granted_credits: "10", priority: 20}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_itv_trd_sum, properties: {amount: 10, target_wallet_code: b06_itv_trd_a}}
        - {code: b06_itv_trd_sum, properties: {amount: 30, target_wallet_code: b06_itv_trd_a}}
        - {code: b06_itv_trd_sum, properties: {amount: 20, target_wallet_code: b06_itv_trd_a}}
        - {code: b06_itv_trd_sum, properties: {amount: 25, target_wallet_code: b06_itv_trd_b}}
        - {code: b06_itv_trd_sum, properties: {amount: 15, target_wallet_code: b06_itv_trd_b}}
    - {at: "2024-04-01T00:30:00Z", do: perform_interval_wallet_top_ups}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      fees_count: 3
      fees_amount_cents: 1000
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 1000
      prepaid_granted_credit_amount_cents: 1000
      total_amount_cents: 0
      payment_status: succeeded
    wallet:
      code: b06_itv_trd_a
      balance_cents: 1735
  math: >-
    Two wallets at DIFFERENT rates, each confined to its own tagged fee, so the half-cent conversion
    is observed on one of them without the other's arithmetic being able to absorb it. The interval
    rule grants wallet a a flat 70 credits (recurring_transaction_rule.rb:104-111) at rate 0.3335:
    `(credit_amount × rate_amount).round(currency.exponent) × 100` (wallet_credit.rb:26-27) is
    HALF-UP on the currency amount, so 70 × 0.3335 = 23.345 → 23.35 → 2_335¢, where truncation would
    give 2_334¢. Wallet a is created empty on 1 March inside the first step's travel_to, excluded
    from the rule that day (create_interval_wallet_transactions_service.rb:74) and due on the day-1
    anniversary of 1 April (:120-130); granted credits settle at once, so invoices stays 1.
    Fees 1_000¢ over three fees (two tagged plus the 0¢ subscription fee a plan with amount_cents 0 still emits, hence fees_count 3): 60
    units tagged a (10/30/20 — sum 60 ≠ max 30 ≠ latest 20) × 0.10 = 6.00 → 600¢, and 40 units tagged
    b × 0.10 = 4.00 → 400¢. At billing each wallet may only pay the bucket carrying its own code
    (allocate_prepaid_credits_by_wallets_service.rb:109-114): a draws min(600, 2_335, 1_000) = 600 and
    b draws min(400, 1_000, 400) = 400, so prepaid is the full 1_000 and the total clamps to 0.
    The outbound is sized by `WalletCredit.from_amount_cents` (wallet_credit.rb:7-11), which carries
    the 600¢ through unrounded, so a ends at 2_335 − 600 = 1_735¢ and a truncating implementation
    would print 1_734¢ — the single cent, and the only asserted number that separates the two, since
    prepaid and total are 1_000 and 0 under both. Tag-blind the one merged 1_000¢ bucket would be paid
    by a alone (priority 1, 2_335¢ ≥ 1_000): a at 1_335, b untouched at 1_000, prepaid and total
    unchanged — so the same assertion also carries the tag. A hollowed interval verb drops a on
    `with_positive_balance` (wallet.rb:65): prepaid 400, total 600, a at 0.

- id: b06/interval-rule/target-wallet-code/negative-total
