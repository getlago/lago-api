      - billable_metric_code: b06_itv_tfc_sum
        charge_model: standard
        properties: {amount: "1"}
        accepts_target_wallet: true
    customer: {external_id: golden_b06_itv_tfc_cust, currency: EUR}
    subscription: {external_id: golden_b06_itv_tfc_sub, billing_time: calendar}
    wallets:
      - name: targeted, interval refilled
        code: b06_itv_tfc_a
        rate_amount: "1"
        currency: EUR
        priority: 1
        recurring_transaction_rules:
          - {trigger: interval, interval: monthly, method: fixed, granted_credits: "90"}
      - {name: targeted poor, code: b06_itv_tfc_b, rate_amount: "1", currency: EUR, granted_credits: "10", priority: 20}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_itv_tfc_sum, properties: {amount: 10, target_wallet_code: b06_itv_tfc_a}}
        - {code: b06_itv_tfc_sum, properties: {amount: 30, target_wallet_code: b06_itv_tfc_a}}
        - {code: b06_itv_tfc_sum, properties: {amount: 20, target_wallet_code: b06_itv_tfc_a}}
        - {code: b06_itv_tfc_sum, properties: {amount: 25, target_wallet_code: b06_itv_tfc_b}}
        - {code: b06_itv_tfc_sum, properties: {amount: 15, target_wallet_code: b06_itv_tfc_b}}
    - {at: "2024-04-01T00:30:00Z", do: perform_interval_wallet_top_ups}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      fees_count: 3
      fees_amount_cents: 10000
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 7000
      prepaid_granted_credit_amount_cents: 7000
      total_amount_cents: 3000
      payment_status: pending
    wallet:
      code: b06_itv_tfc_a
      balance_cents: 3000
  math: >-
    The tag confines a SCHEDULED top-up to the fee it was tagged for, and that is a different claim
    from the threshold sibling: there the tag decided how much usage the wallet could see and
    therefore how often its rule fired, here the rule's amount is fixed by the calendar and the tag
    only decides what the credits may pay. `accepts_target_wallet` on the charge gives the fee's
    grouped_by keys a `target_wallet_code` (fees/charge_service.rb:496-499) and the fee key gains a
    third element (allocate_prepaid_credits_by_wallets_service.rb:83-85), at which point
    `applicable_fee?` refuses every wallet whose `code` does not match it (:109-114) — ahead of
    fee-type and metric limits. It needs `events_targeting_wallets` as well as the premium licence,
    hence the organization block.
    Two tagged charge fees plus the 0¢ subscription fee that a plan with amount_cents 0 still emits, so fees_count is 3 and fees_amount 10_000¢:
    6_000¢ tagged b06_itv_tfc_a (10/30/20: sum 60 ≠ max 30 ≠ latest 20) and 4_000¢ tagged
    b06_itv_tfc_b. Wallet a is created EMPTY on 1 March inside the first step's travel_to — excluded
    from the rule that day (create_interval_wallet_transactions_service.rb:74), due on the day-1
    monthly anniversary of 1 April (:120-130) — and receives a flat 90 granted credits = 9_000¢
    (recurring_transaction_rule.rb:104-111), settled at once, raising no `credit` invoice, so invoices
    stays 1. Wallet b holds its initial 1_000¢.
    At billing wallet a pays only its own bucket: min(6_000, 9_000, 10_000) = 6_000 (:53 gated by
    :109-114) — full cover of the allowed slice with 3_000¢ of surplus — and wallet b pays
    min(4_000, 1_000, 4_000) = 1_000 and empties. Prepaid 7_000, total 3_000 owed in cash that
    wallet a's surplus may not touch, so payment_status is pending.
    Tag-blind the two buckets merge into one 10_000¢ key and wallet a, first in
    `Wallet.in_application_order` (wallet.rb:69-71), would draw min(10_000, 9_000, 10_000) = 9_000 and
    end at 0, b would add its 1_000, prepaid 10_000 and total 0. Name both: a at 3_000 vs 0, total
    3_000 vs 0. A hollowed interval verb leaves a with a zero balance, dropped by
    `with_positive_balance` (wallet.rb:65): prepaid 1_000, total 9_000, a at 0.

