- id: b06/threshold-rule/target-wallet-code/rounding
  block: B6
  axes: {source: threshold-rule, limitation: target-wallet-code, application: rounding}
  dimensions: {interval: monthly, billing_time: calendar, rate_amount: "0.6665", threshold_credits: 0, top_up: granted-50}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    organization: {premium_integrations: [events_targeting_wallets]}
    metrics: [{code: b06_twc_th_rn, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_twc_th_rn, interval: monthly, amount_cents: 0}
    charges:
      - billable_metric_code: b06_twc_th_rn
        charge_model: standard
        properties: {amount: "1"}
        accepts_target_wallet: true
    customer: {external_id: golden_b06_twc_th_rn_cust, currency: EUR}
    subscription: {external_id: golden_b06_twc_th_rn_sub, billing_time: calendar}
    wallets:
      - name: odd rate auto refilled
        code: b06_twc_th_rn_a
        rate_amount: "0.6665"
        currency: EUR
        granted_credits: "10"
        priority: 1
        recurring_transaction_rules:
          - {trigger: threshold, method: fixed, threshold_credits: "0", granted_credits: "50"}
      - {name: rich neighbour, code: b06_twc_th_rn_b, rate_amount: "1", currency: EUR, granted_credits: "100", priority: 20}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-03T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_twc_th_rn, properties: {amount: 10, target_wallet_code: b06_twc_th_rn_a}}
    - {at: "2024-03-04T00:00:00Z", do: perform_wallet_refresh}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_twc_th_rn, properties: {amount: 30, target_wallet_code: b06_twc_th_rn_a}}
        - {code: b06_twc_th_rn, properties: {amount: 20, target_wallet_code: b06_twc_th_rn_a}}
        - {code: b06_twc_th_rn, properties: {amount: 12, target_wallet_code: b06_twc_th_rn_b}}
        - {code: b06_twc_th_rn, properties: {amount: 8, target_wallet_code: b06_twc_th_rn_b}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      fees_count: 3
      fees_amount_cents: 8000
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 6000
      prepaid_granted_credit_amount_cents: 6000
      total_amount_cents: 2000
    wallet:
      code: b06_twc_th_rn_b
      balance_cents: 8000
  math: >-
    Two half-up rounds at rate 0.6665, both landing in the same wallet, and the cent they produce
    decides the invoice total. `(credit_amount × rate_amount).round(currency.exponent) × 100`
    (wallet_credit.rb:26-27) turns the 10 granted credits into 6.665 → 6.67 → 667¢ and the rule's 50
    credits into 33.325 → 33.33 → 3_333¢, a spendable pool of exactly 4_000¢; truncation would give
    666 + 3_332 = 3_998¢.
    The rule is sized at the 4 March refresh, when only 10 a-tagged units (1_000¢) exist: wallet a is
    given only its own bucket (allocate_ongoing_usage_by_wallets_service.rb:118-130), so
    ongoing_balance = 667 − 1_000 = −333 and credits_ongoing_balance = −333/100/0.6665 = −4.996 ≤ 0.
    The rule fires once for a flat 50 granted credits (recurring_transaction_rule.rb:104-111, called
    from update_ongoing_service.rb:26) and the cascade re-refresh reads (4_000 − 1_000)/100/0.6665 =
    45.01 credits > 0, so it stops.
    50 more a-tagged units and 20 b-tagged units then arrive with no refresh, so the fees are 6_000¢
    tagged a (10/30/20: sum 60 ≠ max 30 ≠ latest 20), 2_000¢ tagged b and the 0¢ subscription fee.
    Wallet a is drained for its whole 4_000¢ against its own bucket
    (allocate_prepaid_credits_by_wallets_service.rb:53) and wallet b pays its own 2_000¢, keeping
    8_000¢ it may not lend (:109-114). Prepaid 6_000, total 2_000.
    Truncation instead of half-up: prepaid 5_998 and total 2_002 — a two-cent difference carried from
    the wallet arithmetic to the invoice. Tag-blind: b covers a's 2_000¢ shortfall, prepaid 8_000,
    total 0, b at 6_000¢. Wallet b is asserted rather than a because a ends at 0 in every variant and
    because its rule re-arms after billing (applied_prepaid_credits_service.rb:39 sees a drained
    wallet at 0 credits, which is not > 0), which changes a's balance after the invoice is final.

