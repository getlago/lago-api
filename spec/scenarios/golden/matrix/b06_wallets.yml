  math: >-
    One credit→cents conversion landing exactly on a half-cent, so the asserted balance moves if the
    rounding mode changes. `(credit_amount × rate_amount).round(currency.exponent) × 100`
    (wallet_credit.rb:26-27) is a HALF-UP round of the currency amount, not a truncation: the
    interval rule's flat 70 granted credits at rate 0.3335 are 70 × 0.3335 = 23.345 → 23.35 →
    2_335¢. Truncating instead would give 23.34 → 2_334¢.
    Fees: 60 units (10/30/20, so sum 60 is distinguishable from max 30 and latest 20) × 0.10 = 6.00
    → 600¢, deliberately small so the top-up over-covers it and the residue carries the rounding
    difference into the asserted balance rather than into the invoice.
    The wallet is created empty on 1 March inside the first step's travel_to; the rule is silent
    that day (create_interval_wallet_transactions_service.rb:74 excludes wallets born today) and due
    on 1 April on the day-1 monthly anniversary (:120-130). Granted credits settle at once and raise
    no `credit` invoice, so invoices stays 1.
    At billing the draw is min(600, 2_335, 600) = 600 (allocate_prepaid_credits_by_wallets_service
    .rb:53), the total clamps to 0, and the outbound is sized by `WalletCredit.from_amount_cents`
    (wallet_credit.rb:7-11), which carries the 600¢ through unrounded. Balance ends 2_335 − 600 =
    1_735¢; a truncating implementation would print 1_734¢, and that single cent is the only
    asserted number that separates the two, since prepaid and total are 600 and 0 under both.

- id: b06/interval-rule/none/negative-total
  block: B6
  axes: {source: interval-rule, limitation: none, application: negative-total}
  dimensions: {interval: monthly, billing_time: calendar, coupon: fixed_1500_once, top_up: granted-200}
  provenance: coverage-gap
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  setup:
    metrics: [{code: b06_itv_nnt_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_itv_nnt, interval: monthly, amount_cents: 0}
    charges: [{billable_metric_code: b06_itv_nnt_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b06_itv_nnt_cust, currency: EUR}
    subscription: {external_id: golden_b06_itv_nnt_sub, billing_time: calendar}
    coupons:
      - {name: itv none negative coupon, code: b06_itv_nnt_cpn, coupon_type: fixed_amount, amount_cents: 1500, amount_currency: EUR, frequency: once, expiration: no_expiration}
    wallets:
      - name: wildly over refilled on schedule
        code: b06_itv_nnt_w
        rate_amount: "1"
        currency: EUR
        recurring_transaction_rules:
          - {trigger: interval, interval: monthly, method: fixed, granted_credits: "200"}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_itv_nnt_sum, properties: {amount: 10}}
        - {code: b06_itv_nnt_sum, properties: {amount: 30}}
        - {code: b06_itv_nnt_sum, properties: {amount: 20}}
    - {at: "2024-04-01T00:30:00Z", do: perform_interval_wallet_top_ups}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      fees_amount_cents: 6000
      coupons_amount_cents: 1500
      sub_total_excluding_taxes_amount_cents: 4500
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 4500
      prepaid_granted_credit_amount_cents: 4500
      total_amount_cents: 0
      payment_status: succeeded
    wallet:
      code: b06_itv_nnt_w
      balance_cents: 15500
  math: >-
    A scheduled rule that grossly over-refills — a flat 200 granted credits = 20_000¢ landing on an
    invoice whose payable ceiling is 4_500¢ — which is the case where the total could go negative.
    It does NOT. Lago clamps at zero and leaves the surplus in the wallet: every draw is bounded by
    `remaining_invoice_amount` (allocate_prepaid_credits_by_wallets_service.rb:53, decremented at
    :57), so exactly 4_500¢ leaves and 15_500¢ stays. The three alternatives, named: (a) total
    −15_500 if the whole balance were drained against the invoice, (b) a `credit` invoice or a
    credit note for the 15_500 surplus — none is issued and invoices stays 1, (c) the wallet emptied
    to 0.
    Nothing scales the top-up down to what is needed: `compute_granted_credits` returns the rule's
    amount verbatim for a non-target rule (recurring_transaction_rule.rb:104-111), and unlike a
    threshold rule it is not even a function of the ongoing balance — the interval path reads
    `credits_ongoing_balance` only for the paid leg (create_interval_wallet_transactions_service
    .rb:9-11). The wallet is created empty on 1 March inside the first step's travel_to, so it is
    excluded that day (:74) and due on the day-1 anniversary of 1 April (:120-130).
    The 4_500 ceiling is the row's second half. Prepaid credit is the LAST reducer
    (calculate_fees_service.rb:57-62: coupon → tax → credit note → prepaid) and the per-fee cap is
    `sub_total_excluding_taxes + taxes_precise − precise_credit_notes` (:77-79), where
    `sub_total_excluding_taxes_amount_cents = amount_cents − precise_coupons_amount_cents`
    (fee.rb:238-240): 6_000 − 1_500 = 4_500 on the single charge fee (60 units from 10/30/20 ×
    1.00), which equals invoice.total exactly so `reconcile_remaining_amounts` (:93-106) adds
    nothing. Credits applied BEFORE the coupon would have taken 6_000 and left 14_000 — name both:
    prepaid 4_500 vs 6_000, wallet 15_500 vs 14_000.
    The coupon is `frequency: once` and is still unspent when the period invoice is built, because a
    granted interval top-up raises no invoice for it to be consumed on.

- id: b06/interval-rule/none/ongoing-balance
  block: B6
  axes: {source: interval-rule, limitation: none, application: ongoing-balance}
  dimensions: {interval: monthly, billing_time: calendar, read_at: mid-period, top_up: granted-50, period: april}
  provenance: coverage-gap
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  setup:
    metrics: [{code: b06_itv_nob_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_itv_nob, interval: monthly, amount_cents: 0}
    charges: [{billable_metric_code: b06_itv_nob_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b06_itv_nob_cust, currency: EUR}
    subscription: {external_id: golden_b06_itv_nob_sub, billing_time: calendar}
    wallets:
      - name: interval refilled, read mid period
        code: b06_itv_nob_w
        rate_amount: "1"
        currency: EUR
        recurring_transaction_rules:
          - {trigger: interval, interval: monthly, method: fixed, granted_credits: "50"}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-04-01T00:30:00Z", do: perform_interval_wallet_top_ups}
    - at: "2024-04-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_itv_nob_sum, properties: {amount: 10}}
        - {code: b06_itv_nob_sum, properties: {amount: 30}}
        - {code: b06_itv_nob_sum, properties: {amount: 20}}
    - {at: "2024-04-10T00:00:00Z", do: perform_wallet_refresh}
  expect:
    invoices: 0
    wallet:
      code: b06_itv_nob_w
      balance_cents: 5000
      ongoing_usage_balance_cents: 6000
      ongoing_balance_cents: -1000
  math: >-
    A mid-period read of a wallet whose credits arrived from a SCHEDULE rather than from a
    threshold, which is why the two clock jobs have to appear in the same timeline and in this
    order. `perform_interval_wallet_top_ups` (Clock::CreateIntervalWalletTransactionsJob, the sole
    caller of Wallets::CreateIntervalWalletTransactionsService) puts the credits in; only then does
    `perform_wallet_refresh` (Clock::RefreshWalletsOngoingBalanceJob) compute an ongoing balance
    against them. Neither verb substitutes for the other: the refresh job's only top-up path is
    Wallets::ThresholdTopUpService (update_ongoing_service.rb:26), i.e. `trigger: threshold` alone.
    March is deliberately EMPTY of events and is never billed — the timeline holds no
    perform_billing — so invoices is 0 and the ongoing pool contains April usage only. The wallet is
    created on 1 March inside the first step's travel_to, is excluded from the rule that day
    (create_interval_wallet_transactions_service.rb:74) and is due on the day-1 monthly anniversary
    of 1 April (:120-130), where it receives a flat 50 granted credits = 5_000¢
    (recurring_transaction_rule.rb:104-111). Granted credits settle immediately, so no `credit`
    invoice appears either.
    Three April events 10/30/20 (sum 60 ≠ max 30 ≠ latest 20) × 1.00 = 6_000¢ of unbilled usage,
    pooled as `fee.amount_cents + fee.taxes_amount_cents` from Invoices::CustomerUsageService output
    for the CURRENT period (allocate_ongoing_usage_by_wallets_service.rb:114-123 via
    refresh_wallets_service.rb:52-54). One wallet, so it is the last applicable one for the single
    key and absorbs the whole 6_000 rather than being capped at its balance (:47-58):
    ongoing_usage_balance_cents 6_000 and ongoing_balance_cents = 5_000 − 6_000 = −1_000
    (refresh_ongoing_usage_service.rb:63) — the wallet is allowed NEGATIVE and
    `depleted_ongoing_balance` flips true (:41-45). There is no cascade here: nothing re-arms,
    because an interval rule is fired by a date and not by a balance.
    The plausible wrong answers, all named: a hollowed interval verb (or `perform_wallet_refresh`
    standing in for it) → balance 0 and ongoing_balance −6_000; a clamp of ongoing usage at the
    balance → ongoing_usage 5_000 and ongoing_balance 0; a top-up re-armed by the deficit the way a
    threshold rule would be → balance 10_000 and ongoing_balance 4_000.

- id: b06/interval-rule/fee-types/full-cover
  block: B6
  axes: {source: interval-rule, limitation: fee-types, application: full-cover}
  dimensions: {interval: monthly, billing_time: calendar, allowed_fee_types: charge, top_up: granted-90}
  provenance: coverage-gap
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  setup:
    metrics: [{code: b06_itv_ffc_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_itv_ffc, interval: monthly, amount_cents: 5000}
    charges: [{billable_metric_code: b06_itv_ffc_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b06_itv_ffc_cust, currency: EUR}
    subscription: {external_id: golden_b06_itv_ffc_sub, billing_time: calendar}
    wallets:
      - name: charges only, interval refilled
        code: b06_itv_ffc_w
        rate_amount: "1"
        currency: EUR
        applies_to: {fee_types: [charge]}
        recurring_transaction_rules:
          - {trigger: interval, interval: monthly, method: fixed, granted_credits: "90"}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_itv_ffc_sum, properties: {amount: 10}}
        - {code: b06_itv_ffc_sum, properties: {amount: 30}}
        - {code: b06_itv_ffc_sum, properties: {amount: 20}}
    - {at: "2024-04-01T00:30:00Z", do: perform_interval_wallet_top_ups}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      fees_amount_cents: 11000
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 6000
      prepaid_granted_credit_amount_cents: 6000
      total_amount_cents: 5000
      payment_status: pending
      fees:
        - {fee_type: subscription, amount_cents: 5000}
        - {fee_type: charge, amount_cents: 6000, units: "60"}
    wallet:
      code: b06_itv_ffc_w
      balance_cents: 3000
  math: >-
    Under a limitation, "full cover" means the wallet fully covers the slice it is ALLOWED to pay and
    keeps a surplus, while the rest stays cash. The invoice holds two fees: a 5_000¢ subscription fee
    and a 6_000¢ charge fee (60 units from 10/30/20, so sum 60 ≠ max 30 ≠ latest 20), 11_000¢ total.
    The wallet is created EMPTY on 1 March inside the first step's travel_to, which is what makes the
    rule reachable at all: create_interval_wallet_transactions_service.rb:74 excludes wallets born
    today, and the monthly anniversary is day 1 on both sides (:120-130). So the rule is silent on
    1 March and due at 00:30 on 1 April, where it grants a flat 90 credits = 9_000¢
    (recurring_transaction_rule.rb:104-111). Granted credits settle on creation and raise no `credit`
    invoice, so invoices stays 1 — the whole balance is spendable at 01:00.
    At billing the buckets are [charge, bm_id] = 6_000 and [subscription, nil] = 5_000, sorted
    descending (allocate_prepaid_credits_by_wallets_service.rb:89). allowed_fee_types is ["charge"],
    so for the subscription bucket `applicable_fee?` (:108-122) finds no type match, no target match,
    and `unrestricted_wallet` false because types is non-empty — the bucket is SKIPPED ENTIRELY, not
    merely reduced. The charge bucket draws min(6_000, 9_000, 11_000) = 6_000. Prepaid 6_000, total
    5_000 — exactly the subscription fee, still owed in cash, which is the fee this wallet may not
    pay for and the reason payment_status is pending despite 3_000¢ of unusable surplus sitting in
    the same wallet.
    Counterfactuals, named: ignoring allowed_fee_types → prepaid 9_000, total 2_000, balance 0; a
    hollowed interval verb (or `perform_wallet_refresh` in its place, which reaches `trigger:
    threshold` only) → prepaid 0, total 11_000, balance 0. The limitation and not the balance is what
    binds here, which is the point of sizing the top-up ABOVE the allowed bucket.

- id: b06/interval-rule/fee-types/partial-cover
  block: B6
  axes: {source: interval-rule, limitation: fee-types, application: partial-cover}
  dimensions: {interval: monthly, billing_time: calendar, allowed_fee_types: subscription, top_up: granted-30, second_period_read: true}
  provenance: coverage-gap
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  setup:
    metrics: [{code: b06_itv_fpc_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_itv_fpc, interval: monthly, amount_cents: 5000}
    charges: [{billable_metric_code: b06_itv_fpc_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b06_itv_fpc_cust, currency: EUR}
    subscription: {external_id: golden_b06_itv_fpc_sub, billing_time: calendar}
    wallets:
      - name: subscription only, interval refilled
        code: b06_itv_fpc_w
        rate_amount: "1"
        currency: EUR
        applies_to: {fee_types: [subscription]}
        recurring_transaction_rules:
          - {trigger: interval, interval: monthly, method: fixed, granted_credits: "30"}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_itv_fpc_sum, properties: {amount: 10}}
        - {code: b06_itv_fpc_sum, properties: {amount: 30}}
        - {code: b06_itv_fpc_sum, properties: {amount: 20}}
    - {at: "2024-04-01T00:30:00Z", do: perform_interval_wallet_top_ups}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - at: "2024-04-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_itv_fpc_sum, properties: {amount: 10}}
        - {code: b06_itv_fpc_sum, properties: {amount: 30}}
        - {code: b06_itv_fpc_sum, properties: {amount: 20}}
    - {at: "2024-04-10T00:00:00Z", do: perform_wallet_refresh}
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      fees_amount_cents: 11000
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 3000
      prepaid_granted_credit_amount_cents: 3000
      total_amount_cents: 8000
      payment_status: pending
      fees:
        - {fee_type: subscription, amount_cents: 5000}
        - {fee_type: charge, amount_cents: 6000, units: "60"}
    wallet:
      code: b06_itv_fpc_w
      balance_cents: 0
      ongoing_usage_balance_cents: 0
      ongoing_balance_cents: 0
  math: >-
    Partial cover under a limitation is the one shape whose INVOICE figures cannot separate a
    limitation-aware allocator from a limitation-blind one, and this row says so rather than
    pretending otherwise. Prepaid is always min(balance, Σ applicable caps, invoice total)
    (allocate_prepaid_credits_by_wallets_service.rb:49-57); once the balance is the binding term, the
    applicable SET drops out of the arithmetic. So a second observation is bolted onto the same row —
    a mid-period ongoing read in the FOLLOWING period, which is limitation-sensitive — and that pair
    is what makes the row worth keeping.
    March: 5_000¢ subscription fee plus 6_000¢ charge fee (60 units from 10/30/20, sum 60 ≠ max 30 ≠
    latest 20) = 11_000¢. The wallet is created empty on 1 March inside the first step's travel_to,
    so the rule is excluded that day (create_interval_wallet_transactions_service.rb:74) and due on
    the day-1 anniversary of 1 April (:120-130), granting a flat 30 credits = 3_000¢
    (recurring_transaction_rule.rb:104-111); granted credits settle at once, so invoices stays 1.
    At billing the buckets sort descending — charge 6_000 then subscription 5_000. allowed_fee_types
    is ["subscription"], so the charge bucket is skipped outright by `applicable_fee?` (:108-122) and
    the subscription bucket draws min(5_000, 3_000, 11_000) = 3_000: the wallet is emptied WITHOUT
    finishing the fee it is allowed to pay. Total owed 8_000¢ = the whole 6_000 charge fee (the fee
    this wallet may not pay for) plus the 2_000 of subscription fee the credits could not reach.
    A limitation-blind allocator reports the identical prepaid 3_000 and total 8_000 — it would take
    the same 3_000 off the charge bucket instead — which is exactly why the second half exists.
    Three more events in April, then `perform_wallet_refresh`: the pool is built from
    Invoices::CustomerUsageService output for the current period, i.e. CHARGE fees only, since a
    subscription fee is not usage (refresh_wallets_service.rb:52-54). Asked whether a wallet with
    types=["subscription"] matches a fee_key whose fee_type is "charge",
    allocate_ongoing_usage_by_wallets_service.rb:126-137 finds no type match, no target match and
    `unrestricted_wallet` false, so `applicable` is EMPTY and the 6_000¢ is dropped rather than
    forced onto the wallet: ongoing_usage_balance_cents 0 and ongoing_balance_cents = 0 − 0 = 0
    (refresh_ongoing_usage_service.rb:63). The limitation-blind answer is ongoing_usage 6_000 and
    ongoing_balance −6_000. Name both pairs, and note that the interval rule does NOT fire again on
    5 April — an interval rule is due on its anniversary and nothing else re-arms it, so no cascade
    disturbs the read.

- id: b06/interval-rule/fee-types/multi-wallet-priority
  block: B6
  axes: {source: interval-rule, limitation: fee-types, application: multi-wallet-priority}
  dimensions: {interval: monthly, billing_time: calendar, priorities: "1 charges-only / 20 unrestricted", top_up: granted-30}
  provenance: coverage-gap
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  setup:
    metrics: [{code: b06_itv_fmp_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_itv_fmp, interval: monthly, amount_cents: 5000}
    charges: [{billable_metric_code: b06_itv_fmp_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b06_itv_fmp_cust, currency: EUR}
    subscription: {external_id: golden_b06_itv_fmp_sub, billing_time: calendar}
    wallets:
      - {name: "unrestricted, second", code: b06_itv_fmp_u, rate_amount: "1", currency: EUR, granted_credits: "100", priority: 20}
      - name: charges only, interval refilled, first
        code: b06_itv_fmp_c
        rate_amount: "1"
        currency: EUR
        priority: 1
        applies_to: {fee_types: [charge]}
        recurring_transaction_rules:
          - {trigger: interval, interval: monthly, method: fixed, granted_credits: "30"}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_itv_fmp_sum, properties: {amount: 10}}
        - {code: b06_itv_fmp_sum, properties: {amount: 30}}
        - {code: b06_itv_fmp_sum, properties: {amount: 20}}
    - {at: "2024-04-01T00:30:00Z", do: perform_interval_wallet_top_ups}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      fees_amount_cents: 11000
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 11000
      prepaid_granted_credit_amount_cents: 11000
      total_amount_cents: 0
      payment_status: succeeded
      fees:
        - {fee_type: subscription, amount_cents: 5000}
        - {fee_type: charge, amount_cents: 6000, units: "60"}
    wallet:
      code: b06_itv_fmp_u
      balance_cents: 2000
  math: >-
    A limited wallet drawn FIRST and an unrestricted one drawn second, declared in the reverse order
    so only `Wallet.in_application_order` — priority ASC then created_at (wallet.rb:69-71) — produces
    the asserted numbers. Fees 11_000¢: 5_000 subscription + 6_000 charge (60 units from 10/30/20,
    sum 60 ≠ max 30 ≠ latest 20).
    Both wallets are created on 1 March inside the first step's travel_to, so the interval rule on
    the charges-only wallet is excluded that day
    (create_interval_wallet_transactions_service.rb:74) and due on the day-1 anniversary of 1 April
    (:120-130), granting it a flat 30 credits = 3_000¢ (recurring_transaction_rule.rb:104-111). The
    unrestricted wallet holds its initial 100 granted credits = 10_000¢. Both pools are purely
    granted, so prepaid_granted equals prepaid and the breakdown cannot separate the two orders; the
    unrestricted wallet's ending balance can.
    The allocation loop is wallet-outer / bucket-inner (allocate_prepaid_credits_by_wallets_service
    .rb:34-62) with the buckets sorted descending: charge 6_000 then subscription 5_000. Wallet c
    (priority 1, 3_000¢, types ["charge"]) draws min(6_000, 3_000, 11_000) = 3_000 off the charge
    bucket, then skips the subscription bucket entirely on `applicable_fee?` (:108-122); it empties.
    Wallet u (priority 20, 10_000¢, unrestricted) then finds charge at 3_000 and draws
    min(3_000, 10_000, 8_000) = 3_000, and subscription at 5_000 and draws
    min(5_000, 10_000 − 3_000, 5_000) = 5_000 — note `remaining_wallet_balance` is recomputed from
    `used_amount` within the same wallet (:49-50). u contributes 8_000 and ends at 2_000¢. Prepaid
    11_000, total 0.
    Creation order instead of priority is different in every asserted number: u would draw
    min(6_000, 10_000, 11_000) = 6_000 off charge and min(5_000, 4_000, 5_000) = 4_000 off
    subscription, ending at 0; c would then find charge at 0 and subscription inapplicable, contribute
    nothing (`next if total_amount_cents <= 0`, :64) and keep its 3_000 — prepaid 10_000, total 1_000,
    u at 0. And with the interval verb hollowed, c has a zero balance and is dropped by
    `with_positive_balance` (wallet.rb:65) before the loop even starts: u pays min(6_000, 10_000,
    11_000) + min(5_000, 4_000, 5_000) = 10_000, prepaid 10_000, total 1_000, u at 0. Name all three:
    u at 2_000 versus 0 versus 0, with total 0 versus 1_000 versus 1_000.

- id: b06/interval-rule/fee-types/rounding
  block: B6
  axes: {source: interval-rule, limitation: fee-types, application: rounding}
  dimensions: {interval: monthly, billing_time: calendar, rate_amount: "0.3335", allowed_fee_types: charge, top_up: granted-70}
  provenance: coverage-gap
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  setup:
    metrics: [{code: b06_itv_frd_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_itv_frd, interval: monthly, amount_cents: 500}
    charges: [{billable_metric_code: b06_itv_frd_sum, charge_model: standard, properties: {amount: "0.1"}}]
    customer: {external_id: golden_b06_itv_frd_cust, currency: EUR}
    subscription: {external_id: golden_b06_itv_frd_sub, billing_time: calendar}
    wallets:
      - name: awkward rate, charges only
        code: b06_itv_frd_w
        rate_amount: "0.3335"
        currency: EUR
        applies_to: {fee_types: [charge]}
        recurring_transaction_rules:
          - {trigger: interval, interval: monthly, method: fixed, granted_credits: "70"}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_itv_frd_sum, properties: {amount: 10}}
        - {code: b06_itv_frd_sum, properties: {amount: 30}}
        - {code: b06_itv_frd_sum, properties: {amount: 20}}
    - {at: "2024-04-01T00:30:00Z", do: perform_interval_wallet_top_ups}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      fees_amount_cents: 1100
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 600
      prepaid_granted_credit_amount_cents: 600
      total_amount_cents: 500
      payment_status: pending
      fees:
        - {fee_type: subscription, amount_cents: 500}
        - {fee_type: charge, amount_cents: 600, units: "60"}
    wallet:
      code: b06_itv_frd_w
      balance_cents: 1735
  math: >-
    Rounding and a limitation in one row, arranged so that each is observed on a different number.
    The interval rule grants a flat 70 credits (recurring_transaction_rule.rb:104-111) at rate
    0.3335: `(credit_amount × rate_amount).round(currency.exponent) × 100`
    (wallet_credit.rb:26-27) is HALF-UP on the currency amount, so 70 × 0.3335 = 23.345 → 23.35 →
    2_335¢, where truncation would give 2_334¢. The wallet is created empty on 1 March inside the
    first step's travel_to, excluded that day
    (create_interval_wallet_transactions_service.rb:74) and due on the day-1 anniversary of 1 April
    (:120-130); granted credits settle at once, so invoices stays 1.
    Fees 1_100¢: a 500¢ subscription fee and a 600¢ charge fee (60 units from 10/30/20 — sum 60 ≠
    max 30 ≠ latest 20 — × 0.10 = 6.00). allowed_fee_types is ["charge"], so the subscription bucket
    is skipped outright by `applicable_fee?` (allocate_prepaid_credits_by_wallets_service.rb:108-122)
    and the charge bucket draws min(600, 2_335, 1_100) = 600 (:53). The limitation and not the
    balance binds: 500¢ stays cash beside 1_735¢ of unusable credit, and payment_status is pending.
    The outbound is sized by `WalletCredit.from_amount_cents` (wallet_credit.rb:7-11), which carries
    the 600¢ through unrounded, so the balance ends 2_335 − 600 = 1_735¢ and a truncating
    implementation would print 1_734¢ — the single cent that separates them, since prepaid and total
    are 600 and 500 under both. Ignoring allowed_fee_types would instead give prepaid 1_100, total 0
    and balance 1_235 (or 1_234 truncated); a hollowed interval verb gives prepaid 0, total 1_100 and
    balance 0.

- id: b06/interval-rule/fee-types/negative-total
  block: B6
  axes: {source: interval-rule, limitation: fee-types, application: negative-total}
  dimensions: {interval: monthly, billing_time: calendar, allowed_fee_types: charge, top_up: granted-200}
  provenance: coverage-gap
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  setup:
    metrics: [{code: b06_itv_fnt_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_itv_fnt, interval: monthly, amount_cents: 1000}
    charges: [{billable_metric_code: b06_itv_fnt_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b06_itv_fnt_cust, currency: EUR}
    subscription: {external_id: golden_b06_itv_fnt_sub, billing_time: calendar}
    wallets:
      - name: over refilled on schedule, charges only
        code: b06_itv_fnt_w
        rate_amount: "1"
        currency: EUR
        applies_to: {fee_types: [charge]}
        recurring_transaction_rules:
          - {trigger: interval, interval: monthly, method: fixed, granted_credits: "200"}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_itv_fnt_sum, properties: {amount: 10}}
        - {code: b06_itv_fnt_sum, properties: {amount: 30}}
        - {code: b06_itv_fnt_sum, properties: {amount: 20}}
    - {at: "2024-04-01T00:30:00Z", do: perform_interval_wallet_top_ups}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      fees_amount_cents: 7000
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 6000
      prepaid_granted_credit_amount_cents: 6000
      total_amount_cents: 1000
      payment_status: pending
      fees:
        - {fee_type: subscription, amount_cents: 1000}
        - {fee_type: charge, amount_cents: 6000, units: "60"}
    wallet:
      code: b06_itv_fnt_w
      balance_cents: 14000
  math: >-
    The sharpest form of "negative total" under a limitation: a wallet holding 20_000¢ against a
    7_000¢ invoice that STILL leaves 1_000¢ owed in cash, because the limitation and not the balance
    decides what credits may touch. Fees 7_000¢: 1_000 subscription + 6_000 charge (60 units from
    10/30/20, sum 60 ≠ max 30 ≠ latest 20).
    The top-up is sized by the RULE and by nothing else: `compute_granted_credits` returns
    `granted_credits` verbatim for a non-target rule (recurring_transaction_rule.rb:104-111), and the
    interval path never consults the deficit — it reads `credits_ongoing_balance` only for the paid
    leg (create_interval_wallet_transactions_service.rb:9-11). The wallet is created empty on 1 March
    inside the first step's travel_to, so it is excluded that day (:74) and due on the day-1
    anniversary of 1 April (:120-130), where a flat 200 granted credits = 20_000¢ land, settled at
    once and raising no `credit` invoice.
    At billing the charge bucket draws min(6_000, 20_000, 7_000) = 6_000
    (allocate_prepaid_credits_by_wallets_service.rb:53) and the subscription bucket is skipped
    outright by `applicable_fee?` (:108-122). So the total does not merely fail to go negative — it
    does not even reach zero: 1_000¢ of subscription fee is cash while 14_000¢ of credit sits
    unusable in the same wallet, and payment_status is pending.
    Named alternatives, none of which happens: (a) total −13_000 if the balance were drained against
    the whole invoice, (b) total 0 with the limitation ignored, since 20_000 ≥ 7_000, and the wallet
    at 13_000, (c) a `credit` invoice or a credit note for the 14_000 surplus — invoices stays 1,
    (d) the wallet emptied to 0.

- id: b06/interval-rule/fee-types/ongoing-balance
  block: B6
  axes: {source: interval-rule, limitation: fee-types, application: ongoing-balance}
  dimensions: {interval: monthly, billing_time: calendar, allowed_fee_types: subscription, read_at: mid-period, top_up: granted-50}
  provenance: coverage-gap
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  setup:
    metrics: [{code: b06_itv_fob_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_itv_fob, interval: monthly, amount_cents: 5000}
    charges: [{billable_metric_code: b06_itv_fob_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b06_itv_fob_cust, currency: EUR}
    subscription: {external_id: golden_b06_itv_fob_sub, billing_time: calendar}
    wallets:
      - name: subscription only, interval refilled
        code: b06_itv_fob_w
        rate_amount: "1"
        currency: EUR
        applies_to: {fee_types: [subscription]}
        recurring_transaction_rules:
          - {trigger: interval, interval: monthly, method: fixed, granted_credits: "50"}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-04-01T00:30:00Z", do: perform_interval_wallet_top_ups}
    - at: "2024-04-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_itv_fob_sum, properties: {amount: 10}}
        - {code: b06_itv_fob_sum, properties: {amount: 30}}
        - {code: b06_itv_fob_sum, properties: {amount: 20}}
    - {at: "2024-04-10T00:00:00Z", do: perform_wallet_refresh}
  expect:
    invoices: 0
    wallet:
      code: b06_itv_fob_w
      balance_cents: 5000
      ongoing_usage_balance_cents: 0
      ongoing_balance_cents: 5000
  math: >-
    The row where the fee-type limitation makes a scheduled top-up completely invisible to the
    ongoing balance. Both clock jobs appear, in order and doing different things: the interval verb
    (Clock::CreateIntervalWalletTransactionsJob → Wallets::CreateIntervalWalletTransactionsService,
    its only caller) puts 50 granted credits = 5_000¢ into the wallet on the day-1 monthly
    anniversary of 1 April (create_interval_wallet_transactions_service.rb:120-130, the wallet having
    been created on 1 March inside the first step's travel_to and therefore excluded that day, :74);
    the refresh verb (Clock::RefreshWalletsOngoingBalanceJob, premium-gated at
    refresh_wallets_ongoing_balance_job.rb:8) then computes an ongoing balance against them.
    The mid-period pool is built from `current_usage_fees` (refresh_wallets_service.rb:52-54), i.e.
    Invoices::CustomerUsageService output, which is CHARGE fees only: a subscription fee is not usage
    and never appears there. So `applicable_fee?` (allocate_ongoing_usage_by_wallets_service
    .rb:126-137) is asked whether a wallet with types=["subscription"] matches a fee_key whose
    fee_type is "charge" — no type match, no target match, and `unrestricted_wallet` false because
    types is non-empty. `applicable` is EMPTY for the only key in the pool, the loop at :40-62
    allocates nothing, and the 6_000¢ of April charge usage (60 units from 10/30/20, sum 60 ≠ max 30
    ≠ latest 20 × 1.00) is simply dropped rather than forced onto the wallet:
    ongoing_usage_balance_cents 0 and ongoing_balance_cents = 5_000 − 0 = 5_000
    (refresh_ongoing_usage_service.rb:63), so `depleted_ongoing_balance` never fires.
    The wrong answer, and the one a reader expects, is an implementation that ignores
    allowed_fee_types on the ongoing path: ongoing_usage 6_000 and ongoing_balance −1_000. A hollowed
    interval verb gives balance 0, ongoing_usage 0 and ongoing_balance 0 — which is why the balance
    is asserted alongside the pair rather than left implicit. invoices is 0: the top-up is granted so
    it raises no `credit` invoice, March carries no events, and the timeline never bills.
    The 6_000¢ of charge usage is the amount this wallet may not pay for and it will be owed in cash
    at period end; the wallet reserves nothing against it.

- id: b06/interval-rule/billable-metrics/full-cover
  block: B6
  axes: {source: interval-rule, limitation: billable-metrics, application: full-cover}
  dimensions: {interval: monthly, billing_time: calendar, top_up: granted-90}
  provenance: coverage-gap
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  setup:
    metrics:
      - {code: b06_itv_bfc_cov, aggregation_type: sum_agg, field_name: amount}
      - {code: b06_itv_bfc_oth, aggregation_type: sum_agg, field_name: amount}
    plan: {code: golden_b06_itv_bfc, interval: monthly, amount_cents: 0}
    charges:
      - {billable_metric_code: b06_itv_bfc_cov, charge_model: standard, properties: {amount: "1"}}
      - {billable_metric_code: b06_itv_bfc_oth, charge_model: standard, properties: {amount: "1"}}
    customer: {external_id: golden_b06_itv_bfc_cust, currency: EUR}
    subscription: {external_id: golden_b06_itv_bfc_sub, billing_time: calendar}
    wallets:
      - name: one metric only, interval refilled
        code: b06_itv_bfc_w
        rate_amount: "1"
        currency: EUR
        applies_to: {billable_metric_codes: [b06_itv_bfc_cov]}
        recurring_transaction_rules:
          - {trigger: interval, interval: monthly, method: fixed, granted_credits: "90"}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_itv_bfc_cov, properties: {amount: 10}}
        - {code: b06_itv_bfc_cov, properties: {amount: 30}}
        - {code: b06_itv_bfc_cov, properties: {amount: 20}}
        - {code: b06_itv_bfc_oth, properties: {amount: 5}}
        - {code: b06_itv_bfc_oth, properties: {amount: 15}}
        - {code: b06_itv_bfc_oth, properties: {amount: 10}}
    - {at: "2024-04-01T00:30:00Z", do: perform_interval_wallet_top_ups}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      fees_amount_cents: 9000
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 6000
      prepaid_granted_credit_amount_cents: 6000
      total_amount_cents: 3000
      payment_status: pending
      fees:
        - {fee_type: subscription, amount_cents: 0}
        - {fee_type: charge, item_code: b06_itv_bfc_cov, amount_cents: 6000, units: "60"}
        - {fee_type: charge, item_code: b06_itv_bfc_oth, amount_cents: 3000, units: "30"}
    wallet:
      code: b06_itv_bfc_w
      balance_cents: 3000
  math: >-
    The same shape as b06/interval-rule/fee-types/full-cover but discriminating on METRIC rather than
    fee kind — separate rows because they are separate branches of `applicable_fee?`
    (allocate_prepaid_credits_by_wallets_service.rb:108-122: `targets` from wallet_targets versus
    `types` from allowed_fee_types). Two charges, each with three events so sum is distinguishable
    from max and latest: 10/30/20 → 60 units → 6_000¢ on the covered metric, 5/15/10 → 30 units →
    3_000¢ on the other, 9_000¢ of fees on a plan whose own amount is 0.
    The wallet is created EMPTY on 1 March inside the first step's travel_to, which is what makes the
    interval rule reachable: create_interval_wallet_transactions_service.rb:74 excludes wallets born
    today and the monthly anniversary is day 1 on both sides (:120-130). At 00:30 on 1 April it
    grants a flat 90 credits = 9_000¢ (recurring_transaction_rule.rb:104-111) — an inbound GRANT,
    settled on creation, raising no `credit` invoice, so invoices stays 1.
    At billing the buckets are [charge, cov_id] = 6_000 and [charge, oth_id] = 3_000, sorted
    descending (:89). The wallet's targets are [["charge", cov_id]] and its types are empty, so for
    the `oth` key there is no target match, no type match, and `unrestricted_wallet` is false because
    targets is non-empty — the bucket is SKIPPED ENTIRELY. The `cov` bucket draws min(6_000, 9_000,
    9_000) = 6_000. Prepaid 6_000, total 3_000 — the whole `oth` charge fee, owed in cash: the fee
    this wallet may not pay for, beside 3_000¢ of surplus it may not spend, which is why
    payment_status is pending.
    Counterfactuals: ignoring wallet_targets → prepaid 9_000, total 0, balance 0; a hollowed interval
    verb (or `perform_wallet_refresh` in its place, which reaches `trigger: threshold` only) →
    prepaid 0, total 9_000, balance 0. The top-up is sized ABOVE the allowed bucket on purpose, so
    the limitation and not the balance is what binds.

- id: b06/interval-rule/billable-metrics/partial-cover
  block: B6
  axes: {source: interval-rule, limitation: billable-metrics, application: partial-cover}
  dimensions: {interval: monthly, billing_time: calendar, top_up: granted-40, second_period_read: true}
  provenance: coverage-gap
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  setup:
    metrics:
      - {code: b06_itv_bpc_cov, aggregation_type: sum_agg, field_name: amount}
      - {code: b06_itv_bpc_oth, aggregation_type: sum_agg, field_name: amount}
    plan: {code: golden_b06_itv_bpc, interval: monthly, amount_cents: 0}
    charges:
      - {billable_metric_code: b06_itv_bpc_cov, charge_model: standard, properties: {amount: "1"}}
      - {billable_metric_code: b06_itv_bpc_oth, charge_model: standard, properties: {amount: "1"}}
    customer: {external_id: golden_b06_itv_bpc_cust, currency: EUR}
    subscription: {external_id: golden_b06_itv_bpc_sub, billing_time: calendar}
    wallets:
      - name: one metric only, refilled too little
        code: b06_itv_bpc_w
        rate_amount: "1"
        currency: EUR
        applies_to: {billable_metric_codes: [b06_itv_bpc_cov]}
        recurring_transaction_rules:
          - {trigger: interval, interval: monthly, method: fixed, granted_credits: "40"}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_itv_bpc_cov, properties: {amount: 10}}
        - {code: b06_itv_bpc_cov, properties: {amount: 30}}
        - {code: b06_itv_bpc_cov, properties: {amount: 20}}
        - {code: b06_itv_bpc_oth, properties: {amount: 5}}
        - {code: b06_itv_bpc_oth, properties: {amount: 15}}
        - {code: b06_itv_bpc_oth, properties: {amount: 10}}
    - {at: "2024-04-01T00:30:00Z", do: perform_interval_wallet_top_ups}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
    - at: "2024-04-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_itv_bpc_cov, properties: {amount: 10}}
        - {code: b06_itv_bpc_cov, properties: {amount: 30}}
        - {code: b06_itv_bpc_cov, properties: {amount: 20}}
        - {code: b06_itv_bpc_oth, properties: {amount: 5}}
        - {code: b06_itv_bpc_oth, properties: {amount: 15}}
        - {code: b06_itv_bpc_oth, properties: {amount: 10}}
    - {at: "2024-04-10T00:00:00Z", do: perform_wallet_refresh}
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      fees_amount_cents: 9000
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 4000
      prepaid_granted_credit_amount_cents: 4000
      total_amount_cents: 5000
      payment_status: pending
      fees:
        - {fee_type: subscription, amount_cents: 0}
        - {fee_type: charge, item_code: b06_itv_bpc_cov, amount_cents: 6000, units: "60"}
        - {fee_type: charge, item_code: b06_itv_bpc_oth, amount_cents: 3000, units: "30"}
    wallet:
      code: b06_itv_bpc_w
      balance_cents: 0
      ongoing_usage_balance_cents: 6000
      ongoing_balance_cents: -6000
  math: >-
    Partial cover under a limitation cannot be separated from a limitation-blind allocator by the
    INVOICE figures alone: prepaid is min(balance, Σ applicable caps, invoice total)
    (allocate_prepaid_credits_by_wallets_service.rb:49-57), so once the balance is the binding term
    the applicable SET drops out of the arithmetic. This row says so and then adds a second
    observation on the same wallet that IS metric-sensitive — the following period's ongoing read.
    March: 10/30/20 → 60 units → 6_000¢ on `cov` and 5/15/10 → 30 units → 3_000¢ on `oth`
    (three events each, so sum is distinguishable from max and latest), 9_000¢ of fees. The wallet is
    created empty on 1 March inside the first step's travel_to, so the rule is excluded that day
    (create_interval_wallet_transactions_service.rb:74) and due on the day-1 anniversary of 1 April
    (:120-130), granting a flat 40 credits = 4_000¢ (recurring_transaction_rule.rb:104-111); granted
    credits settle at once, so invoices stays 1.
    At billing the buckets sort descending — cov 6_000 then oth 3_000. Targets are
    [["charge", cov_id]], so the `oth` bucket is skipped outright by `applicable_fee?` (:108-122) and
    the `cov` bucket draws min(6_000, 4_000, 9_000) = 4_000: the wallet empties WITHOUT finishing the
    fee it is allowed to pay. Total owed 5_000¢ = the whole 3_000 `oth` fee (the fee this wallet may
    not pay for) plus the 2_000 of `cov` fee the credits could not reach. A target-blind allocator
    reports the identical prepaid 4_000 and total 5_000, taking the same 4_000 off the same
    descending-first bucket.
    Six more events in April, then `perform_wallet_refresh`: the pool has two keys again, cov 6_000
    and oth 3_000, and `applicable` is EMPTY for `oth`
    (allocate_ongoing_usage_by_wallets_service.rb:126-137) so its 3_000 is dropped rather than
    reassigned, while for `cov` the wallet is the only applicable one and therefore the last, so it
    absorbs the whole 6_000 with no room check (:47-58). ongoing_usage_balance_cents 6_000 and
    ongoing_balance_cents = 0 − 6_000 = −6_000 (refresh_ongoing_usage_service.rb:63) — a wallet
    emptied by the invoice is allowed to go negative on the ongoing side. The target-blind answer is
    ongoing_usage 9_000 and ongoing_balance −9_000; a hollowed interval verb gives prepaid 0, total
    9_000 and the same 6_000/−6_000 pair. Name all three sets. Note the interval rule does NOT fire
    again in April — it is due on its anniversary and nothing re-arms it — so no cascade disturbs the
    read.

