    empties, and g pays NOTHING while holding twice the invoice. Prepaid 3_500 of 5_000¢, total 1_500 in
    cash. g's untouched 10_000¢ is the assertion: tag-blind, one 5_000¢ bucket and g first in order pays
    all of it — prepaid 5_000, total 0, g at 5_000¢ — and a's rule would have been sized against 5_000¢
    of usage instead of 3_000¢, asking for 120 credits. Name both: g 10_000 vs 5_000, total 1_500 vs 0.

