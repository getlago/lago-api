      code: b06_twc_p_mp_g
      balance_cents: 10000
  math: >-
    Target beats priority, and the wallet that proves it is the one that never moves. Three wallets:
    b06_twc_p_mp_g at priority 1 holding 10_000¢ and unrestricted, b06_twc_p_mp_a at priority 20
    holding 10_000¢ spendable (its 30 purchased credits are pending and excluded from balance_cents),
    b06_twc_p_mp_d at priority 30 holding 500¢. `Wallet.in_application_order` is priority ASC then
    created_at (wallet.rb:69-71), so the allocator reaches g FIRST
    (allocate_prepaid_credits_by_wallets_service.rb:126 over :34).
    Both charge fees carry a tag — 30 units → 3_000¢ tagged a (5/15/10: sum 30 ≠ max 15 ≠ latest 10)
