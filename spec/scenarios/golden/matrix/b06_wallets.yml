      code: b06_paid_ftn_w
      balance_cents: 7000
  math: >-
    A wallet holding 10_000¢ of spendable credit, allowed to pay only charge fees, against an
    invoice of 3_000¢ of charge and 60¢ of subscription. After paying the charge bucket in full
    it still has 7_000¢ — more than a hundred times what is left owed. Four outcomes are
    conceivable: (a) the debit stops at the allowed bucket and 60¢ is owed in cash, (b) the
    excess spills onto the disallowed subscription fee and the invoice reaches 0, (c) the invoice
    goes negative, (d) a credit note or refund is issued for the excess.
    The implementation gives (a). `applicable_fee?` (allocate:108-120) rejects the
    ["subscription", nil] bucket outright, so there is nothing for the excess to spill onto; each
    debit is additionally capped by remaining_invoice_amount (allocate:31,53), which is why (c)
    cannot happen even without a limitation; and no credit note is created anywhere in the
    prepaid path, so `invoices: 2` — purchase plus period — rules out (d).
    So a customer with 70.00 of usable credit is still invoiced 0.60 and the invoice stays
    `pending`. That is the whole finding of the row, and the two numbers that carry it are
    total_amount_cents 60 (not 0, not -6_940) and balance_cents 7_000 (not 0, and not the 9_000
    an implementation spending the pending purchased credits would leave).

