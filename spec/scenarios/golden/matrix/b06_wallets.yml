- id: b06/paid-settled/billable-metrics/rounding
  block: B6
  axes: {source: paid-settled, limitation: billable-metrics, application: rounding}
  dimensions: {interval: monthly, billing_time: calendar, rate_amount: "1.66675"}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    organization: {premium_integrations: [manual_payments]}
    metrics:
      - {code: b06_stl_bmr_a, aggregation_type: sum_agg, field_name: amount}
      - {code: b06_stl_bmr_b, aggregation_type: sum_agg, field_name: amount}
    plan: {code: golden_b06_stl_bmr, interval: monthly, amount_cents: 0}
    charges:
      - {billable_metric_code: b06_stl_bmr_a, charge_model: standard, properties: {amount: "1"}}
      - {billable_metric_code: b06_stl_bmr_b, charge_model: standard, properties: {amount: "1"}}
    customer: {external_id: golden_b06_stl_bmr_cust, currency: EUR}
    subscription: {external_id: golden_b06_stl_bmr_sub, billing_time: calendar}
    wallets:
      - name: metric a only
        code: b06_stl_bmr_w
        rate_amount: "1.66675"
        currency: EUR
        paid_credits: "10"
        applies_to: {billable_metric_codes: [b06_stl_bmr_a]}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-02T00:00:00Z", do: pay_invoice, invoice_type: credit}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_stl_bmr_a, properties: {amount: 10}}
        - {code: b06_stl_bmr_a, properties: {amount: 30}}
        - {code: b06_stl_bmr_a, properties: {amount: 20}}
        - {code: b06_stl_bmr_b, properties: {amount: 5}}
        - {code: b06_stl_bmr_b, properties: {amount: 10}}
        - {code: b06_stl_bmr_b, properties: {amount: 5}}
    - {at: "2024-03-06T00:00:00Z", do: top_up_wallet, params: {paid_credits: "10"}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 3
    invoice:
      select: {invoice_type: subscription}
      fees_amount_cents: 8000
      prepaid_credit_amount_cents: 1667
      prepaid_purchased_credit_amount_cents: 1667
      total_amount_cents: 6333
    wallet:
      code: b06_stl_bmr_w
      balance_cents: 0
  math: >-
    Rate 1.66675, the full five decimals the column allows. 10 credits is
    `(10 × 1.66675).round(2) × 100` = 16.6675 → 16.67 → 1_667¢ (wallet_credit.rb:26-27, HALF-UP
    on the third decimal). Truncating gives 16.66 → 1_666¢. Name both: prepaid 1_667 vs 1_666,
    total 6_333 vs 6_334. This is the amount the customer was invoiced for the top-up, so the
    rounding decides the price as well as the cover.
    Fees 8_000¢ (metric a 6_000, metric b 2_000). The wallet is limited to metric a, so the
    reachable bucket is 6_000 and the draw is min(6000, 1667, 8000) = 1_667 — the whole settled
    balance. Total 8_000 − 1_667 = 6_333, which contains metric b's untouchable 2_000¢ in full.
    The 6 March top-up of another 10 credits is never paid, stays pending
    (create_from_params_service.rb:125-138) and is excluded from the balance and from
    `available_inbound` (wallet_transaction.rb:80). Had it settled the draw would be
    min(6000, 3334, 8000) = 3_334 and the total 4_666 — so the row pins rounding, the metric
    limitation and the settlement boundary with one set of numbers.

- id: b06/paid-settled/billable-metrics/negative-total
