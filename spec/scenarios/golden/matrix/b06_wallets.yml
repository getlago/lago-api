    invoice:
      invoice_type: subscription
      fees_count: 3
      fees_amount_cents: 10000
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 6000
      prepaid_granted_credit_amount_cents: 6000
      total_amount_cents: 4000
      payment_status: pending
    wallet:
      code: b06_itv_tpc_b
      balance_cents: 6000
  math: >-
    Target-wallet is the ONE limitation whose partial-cover row is separable on the invoice figures,
    because the tag partitions the buckets rather than merely filtering them: a rich wallet that is
    forbidden the OTHER wallet's bucket leaves that remainder in cash, and prepaid is therefore not
    min(total balance, invoice total) at all.
    Fees 10_000¢ over three fees (two tagged, plus the 0¢ subscription fee a plan with amount_cents 0 still emits, hence fees_count 3):
    6_000¢ tagged b06_itv_tpc_a (10/30/20: sum 60 ≠ max 30 ≠ latest 20) and 4_000¢ tagged
    b06_itv_tpc_b. Wallet a is created EMPTY on 1 March inside the first step's travel_to, excluded
    from the rule that day (create_interval_wallet_transactions_service.rb:74) and due on the day-1
    anniversary of 1 April (:120-130), where it receives a flat 20 granted credits = 2_000¢
    (recurring_transaction_rule.rb:104-111) — settled at once, no `credit` invoice, so invoices stays
    1. Nothing sizes that 20 to the 60 credits its own bucket needs: the interval path never consults
    the deficit (create_interval_wallet_transactions_service.rb:9-11 reads
    `credits_ongoing_balance` only for the paid leg), and there is no cascade to re-arm it.
    At billing wallet a (priority 1) is confined to its own bucket and holds a third of it:
    min(6_000, 2_000, 10_000) = 2_000, and it empties
    (allocate_prepaid_credits_by_wallets_service.rb:53 gated by :109-114). Wallet b then finds a's
    bucket at 4_000 but is refused it by the tag, pays its own 4_000¢ in full —
    min(4_000, 10_000, 8_000) = 4_000 — and keeps 6_000¢ it may not put against a's remainder. So
    prepaid is 6_000 and 4_000¢ of a's own usage is owed in CASH beside a fully solvent wallet;
    payment_status pending.
    b is the asserted wallet because a ends at 0 under every behaviour. Tag-blind, the buckets merge
    into one 10_000¢ key: a draws its 2_000, b draws min(8_000, 10_000, 8_000) = 8_000 and ends at
    2_000, prepaid 10_000, total 0. Name both: b at 6_000 vs 2_000, total 4_000 vs 0. A hollowed
    interval verb drops a entirely on `with_positive_balance` (wallet.rb:65), leaving b at 6_000 as
    asserted but prepaid 4_000 and total 6_000 — which is why the invoice figures are asserted
    alongside the balance.

- id: b06/interval-rule/target-wallet-code/multi-wallet-priority
  block: B6
  axes: {source: interval-rule, limitation: target-wallet-code, application: multi-wallet-priority}
  dimensions: {interval: monthly, billing_time: calendar, rate_amount: 1, wallets: 3, top_up: granted-80}
  provenance: coverage-gap
