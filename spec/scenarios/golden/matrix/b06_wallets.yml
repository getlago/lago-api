    - at: "2024-03-03T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_twc_th_pc, properties: {amount: 10, target_wallet_code: b06_twc_th_pc_a}}
    - {at: "2024-03-04T00:00:00Z", do: perform_wallet_refresh}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_twc_th_pc, properties: {amount: 30, target_wallet_code: b06_twc_th_pc_a}}
        - {code: b06_twc_th_pc, properties: {amount: 20, target_wallet_code: b06_twc_th_pc_a}}
        - {code: b06_twc_th_pc, properties: {amount: 25, target_wallet_code: b06_twc_th_pc_b}}
        - {code: b06_twc_th_pc, properties: {amount: 15, target_wallet_code: b06_twc_th_pc_b}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      fees_count: 3
      fees_amount_cents: 10000
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 6000
      prepaid_granted_credit_amount_cents: 6000
      total_amount_cents: 4000
    wallet:
      code: b06_twc_th_pc_b
      balance_cents: 6000
  math: >-
    A threshold rule is sized WHEN IT FIRES, so the way to make it under-cover is to let usage grow
    afterwards. Wallet a is created with no credits of its own — every credit in this row comes from
    the rule. Only 10 units (1_000¢, tagged a) exist at the 4 March refresh: ongoing_usage 1_000,
    ongoing_balance = 0 − 1_000 = −1_000, credits_ongoing_balance −10 ≤ 0, so the rule fires for a
    flat 20 granted credits = 2_000¢ (recurring_transaction_rule.rb:104-111; the only call site is
    update_ongoing_service.rb:26). Granted credits settle immediately and raise no invoice
    (create_from_params_service.rb:145-173), which is why invoices stays 1. The cascade re-refresh
    reads 2_000 − 1_000 = 1_000, 10 credits > 0, and stops.
    Then 50 more a-tagged units and 40 b-tagged units arrive with no refresh between, so at billing
    the fees are 6_000¢ tagged a (10/30/20 across the two batches: sum 60 ≠ max 30 ≠ latest 20),
    4_000¢ tagged b and the 0¢ subscription fee. Wallet a is confined to its own bucket and holds a
    third of it: min(6_000, 2_000, 10_000) = 2_000 and it empties
    (allocate_prepaid_credits_by_wallets_service.rb:53). Wallet b pays its own 4_000¢ in full and keeps
    6_000¢ that `applicable_fee?` (:109-114) forbids it from putting against a's 4_000¢ remainder, so
    that remainder is owed in CASH.
    Wallet b is the asserted wallet for two reasons: a ends at 0 under either behaviour, and a's rule
    RE-ARMS after billing — the synchronous refresh at applied_prepaid_credits_service.rb:39 sees a
    drained wallet with 0 credits ongoing, which is not > 0, so a fresh 20-credit grant lands after the
    invoice is already computed. It cannot change any invoice figure, but it does make a's balance
    unassertable. Tag-blind, the buckets merge, b covers the remaining 8_000¢ and ends at 2_000¢ with
    total 0. Name both: b 6_000 vs 2_000, total 4_000 vs 0.

