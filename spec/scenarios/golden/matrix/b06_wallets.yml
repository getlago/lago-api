    - {at: "2024-04-01T00:30:00Z", do: perform_interval_wallet_top_ups}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      fees_amount_cents: 9000
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 9000
      prepaid_granted_credit_amount_cents: 9000
      total_amount_cents: 0
      payment_status: succeeded
      fees:
        - {fee_type: subscription, amount_cents: 0}
        - {fee_type: charge, item_code: b06_itv_bmp_cov, amount_cents: 6000, units: "60"}
        - {fee_type: charge, item_code: b06_itv_bmp_oth, amount_cents: 3000, units: "30"}
    wallet:
      code: b06_itv_bmp_u
      balance_cents: 4000
  math: >-
    A metric-limited wallet drawn FIRST and an unrestricted one second, declared in the reverse order
    so that only `Wallet.in_application_order` — priority ASC then created_at (wallet.rb:69-71) —
    produces the asserted number. Fees 9_000¢: 6_000 on `cov` (10/30/20 → 60 units) and 3_000 on
    `oth` (5/15/10 → 30 units), three events each so sum is distinguishable from max and latest.
    Both wallets are created on 1 March inside the first step's travel_to, so the interval rule on
    the limited one is excluded that day (create_interval_wallet_transactions_service.rb:74) and due
    on the day-1 anniversary of 1 April (:120-130), granting it a flat 30 credits = 3_000¢
    (recurring_transaction_rule.rb:104-111). The unrestricted wallet holds its initial 100 granted
    credits = 10_000¢. Both pools are purely granted, so prepaid_granted equals prepaid and the
    breakdown cannot separate the two orders; the unrestricted wallet's ending balance can.
    The loop is wallet-outer / bucket-inner (allocate_prepaid_credits_by_wallets_service.rb:34-62)
    with buckets sorted descending: cov 6_000 then oth 3_000. Wallet c (priority 1, 3_000¢, targets
    [["charge", cov_id]]) draws min(6_000, 3_000, 9_000) = 3_000 off cov, skips oth on
    `applicable_fee?` (:108-122) and empties. Wallet u (priority 20, 10_000¢, unrestricted) then finds
    cov at 3_000 and draws min(3_000, 10_000, 6_000) = 3_000, then oth at 3_000 and draws
    min(3_000, 10_000 − 3_000, 3_000) = 3_000 — `remaining_wallet_balance` is recomputed from
    `used_amount` within the same wallet (:49-50). u contributes 6_000 and ends at 4_000¢. Prepaid
    9_000, total 0.
    Creation order instead of priority moves the asserted number without moving the invoice at all: u
    would draw min(6_000, 10_000, 9_000) = 6_000 off cov and min(3_000, 4_000, 3_000) = 3_000 off
    oth, contributing 9_000 and ending at 1_000, while c found both buckets at 0 and kept its 3_000 —
    prepaid 9_000 and total 0 EXACTLY as asserted, u at 1_000 instead of 4_000. That is why the
    balance is the assertion and not the totals. With the interval verb hollowed, c has a zero
    balance and is dropped by `with_positive_balance` (wallet.rb:65) before the loop: u pays all
    9_000, ends at 1_000, prepaid 9_000, total 0 — the same trap, same answer, still separated by the
    balance.

- id: b06/interval-rule/billable-metrics/rounding
  block: B6
  axes: {source: interval-rule, limitation: billable-metrics, application: rounding}
  dimensions: {interval: monthly, billing_time: calendar, rate_amount: "0.3335", top_up: granted-70}
  provenance: coverage-gap
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  setup:
    metrics:
      - {code: b06_itv_brd_cov, aggregation_type: sum_agg, field_name: amount}
      - {code: b06_itv_brd_oth, aggregation_type: sum_agg, field_name: amount}
    plan: {code: golden_b06_itv_brd, interval: monthly, amount_cents: 0}
    charges:
      - {billable_metric_code: b06_itv_brd_cov, charge_model: standard, properties: {amount: "0.1"}}
      - {billable_metric_code: b06_itv_brd_oth, charge_model: standard, properties: {amount: "0.1"}}
    customer: {external_id: golden_b06_itv_brd_cust, currency: EUR}
    subscription: {external_id: golden_b06_itv_brd_sub, billing_time: calendar}
    wallets:
      - name: awkward rate, one metric only
        code: b06_itv_brd_w
        rate_amount: "0.3335"
        currency: EUR
        applies_to: {billable_metric_codes: [b06_itv_brd_cov]}
        recurring_transaction_rules:
          - {trigger: interval, interval: monthly, method: fixed, granted_credits: "70"}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_itv_brd_cov, properties: {amount: 10}}
        - {code: b06_itv_brd_cov, properties: {amount: 30}}
        - {code: b06_itv_brd_cov, properties: {amount: 20}}
        - {code: b06_itv_brd_oth, properties: {amount: 5}}
        - {code: b06_itv_brd_oth, properties: {amount: 15}}
        - {code: b06_itv_brd_oth, properties: {amount: 10}}
    - {at: "2024-04-01T00:30:00Z", do: perform_interval_wallet_top_ups}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      fees_amount_cents: 900
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 600
      prepaid_granted_credit_amount_cents: 600
      total_amount_cents: 300
      payment_status: pending
      fees:
        - {fee_type: subscription, amount_cents: 0}
        - {fee_type: charge, item_code: b06_itv_brd_cov, amount_cents: 600, units: "60"}
        - {fee_type: charge, item_code: b06_itv_brd_oth, amount_cents: 300, units: "30"}
    wallet:
      code: b06_itv_brd_w
      balance_cents: 1735
  math: >-
    Rounding observed on the balance, the metric limitation observed on the total, one row. The
    interval rule grants a flat 70 credits (recurring_transaction_rule.rb:104-111) at rate 0.3335:
    `(credit_amount × rate_amount).round(currency.exponent) × 100` (wallet_credit.rb:26-27) is
    HALF-UP on the currency amount, so 70 × 0.3335 = 23.345 → 23.35 → 2_335¢, where truncation gives
    2_334¢. The wallet is created empty on 1 March inside the first step's travel_to, excluded that
    day (create_interval_wallet_transactions_service.rb:74) and due on the day-1 anniversary of
    1 April (:120-130); granted credits settle at once, so invoices stays 1.
    Fees 900¢: 60 units on `cov` (10/30/20 — sum 60 ≠ max 30 ≠ latest 20) × 0.10 = 6.00 → 600¢ and
    30 units on `oth` (5/15/10) × 0.10 = 3.00 → 300¢. The wallet's targets are [["charge", cov_id]]
    and its types are empty, so the `oth` bucket is skipped outright by `applicable_fee?`
    (allocate_prepaid_credits_by_wallets_service.rb:108-122) and the `cov` bucket draws
    min(600, 2_335, 900) = 600 (:53). The limitation and not the balance binds: 300¢ stays cash
    beside 1_735¢ of unusable credit, payment_status pending.
    The outbound is sized by `WalletCredit.from_amount_cents` (wallet_credit.rb:7-11) which carries
    the 600¢ through unrounded, so the balance ends 2_335 − 600 = 1_735¢, and a truncating
    implementation would print 1_734¢ — the single cent separating them, since prepaid and total are
    600 and 300 under both. Ignoring wallet_targets would instead give prepaid 900, total 0 and
    balance 1_435 (1_434 truncated); a hollowed interval verb gives prepaid 0, total 900, balance 0.

- id: b06/interval-rule/billable-metrics/negative-total
  block: B6
  axes: {source: interval-rule, limitation: billable-metrics, application: negative-total}
  dimensions: {interval: monthly, billing_time: calendar, top_up: granted-200}
  provenance: coverage-gap
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  setup:
    metrics:
      - {code: b06_itv_bnt_cov, aggregation_type: sum_agg, field_name: amount}
      - {code: b06_itv_bnt_oth, aggregation_type: sum_agg, field_name: amount}
    plan: {code: golden_b06_itv_bnt, interval: monthly, amount_cents: 0}
    charges:
      - {billable_metric_code: b06_itv_bnt_cov, charge_model: standard, properties: {amount: "1"}}
      - {billable_metric_code: b06_itv_bnt_oth, charge_model: standard, properties: {amount: "1"}}
    customer: {external_id: golden_b06_itv_bnt_cust, currency: EUR}
    subscription: {external_id: golden_b06_itv_bnt_sub, billing_time: calendar}
    wallets:
      - name: over refilled on schedule, one metric only
        code: b06_itv_bnt_w
        rate_amount: "1"
        currency: EUR
        applies_to: {billable_metric_codes: [b06_itv_bnt_cov]}
        recurring_transaction_rules:
          - {trigger: interval, interval: monthly, method: fixed, granted_credits: "200"}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_itv_bnt_cov, properties: {amount: 10}}
        - {code: b06_itv_bnt_cov, properties: {amount: 30}}
        - {code: b06_itv_bnt_cov, properties: {amount: 20}}
        - {code: b06_itv_bnt_oth, properties: {amount: 5}}
        - {code: b06_itv_bnt_oth, properties: {amount: 15}}
        - {code: b06_itv_bnt_oth, properties: {amount: 10}}
    - {at: "2024-04-01T00:30:00Z", do: perform_interval_wallet_top_ups}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      fees_amount_cents: 9000
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 6000
      prepaid_granted_credit_amount_cents: 6000
      total_amount_cents: 3000
      payment_status: pending
      fees:
        - {fee_type: subscription, amount_cents: 0}
        - {fee_type: charge, item_code: b06_itv_bnt_cov, amount_cents: 6000, units: "60"}
        - {fee_type: charge, item_code: b06_itv_bnt_oth, amount_cents: 3000, units: "30"}
    wallet:
      code: b06_itv_bnt_w
      balance_cents: 14000
  math: >-
    A wallet holding 20_000¢ against a 9_000¢ invoice that still leaves 3_000¢ owed in cash, because
    a METRIC limitation and not the balance decides what credits may touch. Fees 9_000¢: 6_000 on
    `cov` (10/30/20 → 60 units) and 3_000 on `oth` (5/15/10 → 30 units), three events each so sum is
    distinguishable from max and latest.
    Nothing scales the top-up to the deficit: `compute_granted_credits` returns `granted_credits`
    verbatim for a non-target rule (recurring_transaction_rule.rb:104-111), and the interval path
    reads `credits_ongoing_balance` only for the paid leg
    (create_interval_wallet_transactions_service.rb:9-11). The wallet is created empty on 1 March
    inside the first step's travel_to, excluded that day (:74) and due on the day-1 anniversary of
    1 April (:120-130), where a flat 200 granted credits = 20_000¢ land, settled at once and raising
    no `credit` invoice, so invoices stays 1.
    At billing the `cov` bucket draws min(6_000, 20_000, 9_000) = 6_000
    (allocate_prepaid_credits_by_wallets_service.rb:53) and the `oth` bucket is skipped outright by
    `applicable_fee?` (:108-122) — no target match, no type match, `unrestricted_wallet` false
    because targets is non-empty. So the total does not merely fail to go negative, it does not reach
    zero: 3_000¢ is cash while 14_000¢ of credit sits unusable in the same wallet.
    Named alternatives, none of which happens: (a) total −11_000 if the balance were drained against
    the whole invoice, (b) total 0 with the limitation ignored, since 20_000 ≥ 9_000, and the wallet
    at 11_000, (c) a `credit` invoice or a credit note for the 14_000 surplus — invoices stays 1,
    (d) the wallet emptied to 0.

- id: b06/interval-rule/billable-metrics/ongoing-balance
  block: B6
  axes: {source: interval-rule, limitation: billable-metrics, application: ongoing-balance}
  dimensions: {interval: monthly, billing_time: calendar, read_at: mid-period, top_up: granted-50}
  provenance: coverage-gap
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  setup:
    metrics:
      - {code: b06_itv_bob_cov, aggregation_type: sum_agg, field_name: amount}
      - {code: b06_itv_bob_oth, aggregation_type: sum_agg, field_name: amount}
    plan: {code: golden_b06_itv_bob, interval: monthly, amount_cents: 0}
    charges:
      - {billable_metric_code: b06_itv_bob_cov, charge_model: standard, properties: {amount: "1"}}
      - {billable_metric_code: b06_itv_bob_oth, charge_model: standard, properties: {amount: "1"}}
    customer: {external_id: golden_b06_itv_bob_cust, currency: EUR}
    subscription: {external_id: golden_b06_itv_bob_sub, billing_time: calendar}
    wallets:
      - name: small metric only, interval refilled
        code: b06_itv_bob_w
        rate_amount: "1"
        currency: EUR
        applies_to: {billable_metric_codes: [b06_itv_bob_oth]}
        recurring_transaction_rules:
          - {trigger: interval, interval: monthly, method: fixed, granted_credits: "50"}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-04-01T00:30:00Z", do: perform_interval_wallet_top_ups}
    - at: "2024-04-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_itv_bob_cov, properties: {amount: 10}}
        - {code: b06_itv_bob_cov, properties: {amount: 30}}
        - {code: b06_itv_bob_cov, properties: {amount: 20}}
        - {code: b06_itv_bob_oth, properties: {amount: 5}}
        - {code: b06_itv_bob_oth, properties: {amount: 15}}
        - {code: b06_itv_bob_oth, properties: {amount: 10}}
    - {at: "2024-04-10T00:00:00Z", do: perform_wallet_refresh}
  expect:
    invoices: 0
    wallet:
      code: b06_itv_bob_w
      balance_cents: 5000
      ongoing_usage_balance_cents: 3000
      ongoing_balance_cents: 2000
  math: >-
    A mid-period read where the metric limitation PARTIALLY narrows what a scheduled top-up reserves
    against — the middle case between b06/interval-rule/none/ongoing-balance (absorbs everything) and
    b06/interval-rule/fee-types/ongoing-balance (absorbs nothing). Both clock jobs appear and do
    different jobs: the interval verb (Clock::CreateIntervalWalletTransactionsJob →
    Wallets::CreateIntervalWalletTransactionsService, its only caller) puts a flat 50 granted credits
    = 5_000¢ in on the day-1 monthly anniversary of 1 April
    (create_interval_wallet_transactions_service.rb:120-130, the wallet having been created on
    1 March inside the first step's travel_to and therefore excluded that day, :74); the refresh verb
    (Clock::RefreshWalletsOngoingBalanceJob, premium-gated at
    refresh_wallets_ongoing_balance_job.rb:8) then computes the ongoing balance against them. March
    carries no events and is never billed, so invoices is 0 and the pool is April usage only.
    Unbilled usage is 9_000¢ in two keys: `cov` 60 units (10/30/20) × 1.00 = 6_000 and `oth` 30 units
    (5/15/10) × 1.00 = 3_000 — three events each, so sum is distinguishable from max and latest. The
    wallet is limited to `oth`, so `applicable_fee?`
    (allocate_ongoing_usage_by_wallets_service.rb:126-137) leaves `applicable` EMPTY for the `cov`
    key — dropped, not reassigned onto the only wallet there is — while for `oth` the wallet is the
    only applicable one and therefore the last, absorbing the whole 3_000 with no room check
    (:47-58). ongoing_usage_balance_cents 3_000 and ongoing_balance_cents = 5_000 − 3_000 = 2_000
    (refresh_ongoing_usage_service.rb:63), which stays positive so `depleted_ongoing_balance` never
    fires. Nothing re-arms: an interval rule is due on a date, not on a balance, so there is no
    cascade after the read.
    The wrong answers, named: ignoring wallet_targets → ongoing_usage 9_000 and ongoing_balance
    −4_000; limiting the absorption to the wallet's own balance rather than the whole applicable key
    → identical here (3_000 < 5_000), which this row therefore does NOT distinguish —
    b06/interval-rule/billable-metrics/partial-cover is the row where the absorbed amount exceeds the
    balance; a hollowed interval verb → balance 0, ongoing_usage 3_000 and ongoing_balance −3_000.

- id: b06/interval-rule/target-wallet-code/full-cover
  block: B6
  axes: {source: interval-rule, limitation: target-wallet-code, application: full-cover}
  dimensions: {interval: monthly, billing_time: calendar, rate_amount: 1, top_up: granted-90}
  provenance: coverage-gap
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  setup:
    organization: {premium_integrations: [events_targeting_wallets]}
    metrics: [{code: b06_itv_tfc_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_itv_tfc, interval: monthly, amount_cents: 0}
