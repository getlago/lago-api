    metric b's fee, which this wallet may not pay for, owed in CASH while 6_000¢ of purchased
    credit stays unusable.
    Alternatives with their numbers: (a) limitation ignored → the invoice clamp takes over,
    prepaid 8_000, total 0, wallet 4_000; (b) no clamp anywhere → total −4_000 and the wallet
    drained to 0; (c) the unusable surplus refunded — no credit note, no inbound transaction, the
    only movement is the 6_000¢ outbound. Because (a) and the truth differ on the wallet as much
    as the invoice, balance_cents 6_000 and consumed_amount_cents 6_000 are asserted with the
    total.
    Both fees are `fee_type: charge`, so nothing but the wallet_targets lookup can tell them
    apart. The 6 March top-up of 40 credits is never paid and stays pending
    (create_from_params_service.rb:125-138); if pending credits counted the balance would end at
    10_000. prepaid_purchased 6_000 with prepaid_granted absent confirms a purchased-only pool.

- id: b06/paid-settled/billable-metrics/ongoing-balance
  block: B6
  axes: {source: paid-settled, limitation: billable-metrics, application: ongoing-balance}
  dimensions: {interval: monthly, billing_time: calendar, read_at: mid-period}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    organization: {premium_integrations: [manual_payments]}
    metrics:
      - {code: b06_stl_bmo_a, aggregation_type: sum_agg, field_name: amount}
      - {code: b06_stl_bmo_b, aggregation_type: sum_agg, field_name: amount}
    plan: {code: golden_b06_stl_bmo, interval: monthly, amount_cents: 0}
    charges:
      - {billable_metric_code: b06_stl_bmo_a, charge_model: standard, properties: {amount: "1"}}
      - {billable_metric_code: b06_stl_bmo_b, charge_model: standard, properties: {amount: "1"}}
    customer: {external_id: golden_b06_stl_bmo_cust, currency: EUR}
    subscription: {external_id: golden_b06_stl_bmo_sub, billing_time: calendar}
    wallets:
      - name: metric a only
        code: b06_stl_bmo_w
        rate_amount: "1"
        currency: EUR
        paid_credits: "100"
        applies_to: {billable_metric_codes: [b06_stl_bmo_a]}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-02T00:00:00Z", do: pay_invoice, invoice_type: credit}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_stl_bmo_a, properties: {amount: 10}}
        - {code: b06_stl_bmo_a, properties: {amount: 30}}
        - {code: b06_stl_bmo_a, properties: {amount: 20}}
        - {code: b06_stl_bmo_b, properties: {amount: 5}}
        - {code: b06_stl_bmo_b, properties: {amount: 10}}
        - {code: b06_stl_bmo_b, properties: {amount: 5}}
    - {at: "2024-03-06T00:00:00Z", do: top_up_wallet, params: {paid_credits: "50"}}
    - {at: "2024-03-10T00:00:00Z", do: perform_wallet_refresh}
  expect:
    invoices: 2
    wallet:
      code: b06_stl_bmo_w
      balance_cents: 10000
      ongoing_usage_balance_cents: 6000
      ongoing_balance_cents: 4000
  math: >-
    Mid-period on the ongoing allocator
    (allocate_ongoing_usage_by_wallets_service.rb:33-65 via
    Clock::RefreshWalletsOngoingBalanceJob → Customers::RefreshWalletsService — premium-gated at
    refresh_wallets_ongoing_balance_job.rb:8), with a wallet limited to metric a.
    Unbilled usage: metric a 6_000¢, metric b 2_000¢. Fee keys are
    `[fee_type, billable_metric_id, target_wallet_code, currency]` (:118-124) — one element wider
    than the billing allocator's key, which is why this needs its own row rather than reusing the
    billing derivation. The pool is sorted descending (:98-104) so metric a is offered first with
    `budgets["EUR"]` = 8_000; the wallet is the only applicable one so it takes all 6_000
    (:48-51). Metric b's key has NO applicable wallet (:126-137, targets do not include it), so
    its 2_000 is dropped — the budget falls but no wallet claims it.
    `ongoing_balance_cents = 10_000 − 6_000 = 4_000` (refresh_ongoing_usage_service.rb:63).
    Wrong answers: ignoring the metric limitation gives ongoing_usage 8_000 and ongoing_balance
    2_000; the last-wallet-absorbs rule (:48) firing for metric b as well would give the same
    8_000 — asserting 6_000 exactly excludes both.
    The 6 March top-up of 50 credits is never paid; it is created `pending`
    (create_from_params_service.rb:125-138) and Balance::IncreaseService only runs from
    Wallets::ApplyPaidCreditsService on payment (apply_paid_credits_service.rb:12-20), so
    `balance_cents` stays 10_000 and the ongoing balance stays 4_000 rather than 9_000 —
    purchased-but-unsettled credit does not make a wallet look solvent mid-period either.
    invoices is 2: both `credit` top-up invoices, no billing having run.

- id: b06/paid/none/full-cover
  block: B6
  axes: {source: paid, limitation: none, application: full-cover}
  dimensions: {interval: monthly, billing_time: calendar, rate_amount: 1, paid_credits: 20, granted_credits: 50}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    metrics: [{code: b06_paid_fc, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_paid_fc, interval: monthly, amount_cents: 0}
    charges: [{billable_metric_code: b06_paid_fc, charge_model: standard, properties: {amount: "0.5"}}]
    customer: {external_id: golden_b06_paid_fc_cust, currency: EUR}
    subscription: {external_id: golden_b06_paid_fc_sub, billing_time: calendar}
    wallets:
      - {name: purchased and granted, code: b06_paid_fc_w, rate_amount: "1", currency: EUR, paid_credits: "20", granted_credits: "50"}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_paid_fc, properties: {amount: 10}}
        - {code: b06_paid_fc, properties: {amount: 30}}
        - {code: b06_paid_fc, properties: {amount: 20}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {invoice_type: credit}
        fees_amount_cents: 2000
        taxes_amount_cents: 0
        total_amount_cents: 2000
        payment_status: pending
      - select: {invoice_type: subscription}
        fees_amount_cents: 3000
        sub_total_excluding_taxes_amount_cents: 3000
        taxes_amount_cents: 0
        prepaid_credit_amount_cents: 3000
        prepaid_granted_credit_amount_cents: 3000
        total_amount_cents: 0
        payment_status: succeeded
        fees:
          - {fee_type: subscription, item_code: golden_b06_paid_fc, amount_cents: 0, units: "1"}
          - {fee_type: charge, item_code: b06_paid_fc, amount_cents: 3000, units: "60", taxes_amount_cents: 0}
    wallet:
      code: b06_paid_fc_w
      balance_cents: 2000
  math: >-
    One wallet holding BOTH pools. The 20 purchased credits create an inbound transaction with
    status `pending` and transaction_status `purchased`
    (create_from_params_service.rb:129,131) plus a finalized-but-unpaid `credit` invoice of
    20 x 1.00 = 2_000¢ — credit fees are never taxed (fees/paid_credit_service.rb:36), so that
    invoice is exactly 2_000¢ even under a taxed organization. Those credits are worth nothing
    until Invoices::PrepaidCreditJob:20-21 runs ApplyPaidCreditsService on a SUCCEEDED payment,
    which never happens here, so `balance_cents` carries only the 50 granted credits = 5_000¢.
    Three events (10+30+20) give 60 units at 0.50 = 3_000¢ — three, because one event cannot
    tell sum_agg (60) from max_agg (30) or latest_agg (20).
    Prepaid credit is the last reducer (calculate_fees_service.rb:62): the single bucket
    ["charge", metric] has cap 3_000 + 0 tax = 3_000 (allocate:77-81) and the wallet pays
    min(3_000, 5_000, 3_000) = 3_000 (allocate:53), so the invoice lands at 0 and is stamped
    `succeeded`. The wallet keeps 5_000 - 3_000 = 2_000¢.
    Two wrong implementations are excluded by balance_cents alone. If the pending purchased
    credits were spendable the pool would be 7_000¢ and the balance would end at 4_000¢, not
    2_000¢. If wallets were ignored the total would be 3_000¢. And because
    prepaid_granted_credit_amount_cents (3_000) equals prepaid_credit_amount_cents (3_000),
    every cent came from the granted pool — the purchased pool moved nothing
    (applied_prepaid_credits_service.rb:73-91 builds that split from WalletTransactionConsumption
    rows, and only a GRANTED inbound gets a remaining_amount_cents to be consumed from,
    wallet_transactions/create_service.rb:56-62).

