    charges:
      - {billable_metric_code: b06_thr_bf_cov, charge_model: standard, properties: {amount: "1"}}
      - {billable_metric_code: b06_thr_bf_oth, charge_model: standard, properties: {amount: "1"}}
    customer: {external_id: golden_b06_thr_bf_cust, currency: EUR}
    subscription: {external_id: golden_b06_thr_bf_sub, billing_time: calendar}
