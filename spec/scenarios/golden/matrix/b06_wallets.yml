- id: b06/paid-settled/target-wallet-code/rounding
  block: B6
  axes: {source: paid-settled, limitation: target-wallet-code, application: rounding}
  dimensions: {interval: monthly, billing_time: calendar, rate_amount: "0.6665", paid_credits: 50, settled_at: "2024-03-02"}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    organization: {premium_integrations: [events_targeting_wallets, manual_payments]}
    metrics: [{code: b06_twc_ps_rn, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_twc_ps_rn, interval: monthly, amount_cents: 0}
