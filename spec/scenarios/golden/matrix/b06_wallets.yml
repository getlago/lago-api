      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 1200
      prepaid_granted_credit_amount_cents: 1200
      total_amount_cents: 8400
      fees:
        - {fee_type: subscription, amount_cents: 0}
        - {fee_type: charge, item_code: b06_tgt_bmp_cov, amount_cents: 7200, taxes_amount_cents: 0}
        - {fee_type: charge, item_code: b06_tgt_bmp_oth, amount_cents: 2400, taxes_amount_cents: 0}
  math: >-
    Two fees are left owing and both are asserted. b06_tgt_bmp_oth's 2_400¢ is the fee the metric-limited
    wallet may NOT pay at all; 6_000¢ of b06_tgt_bmp_cov's own 7_200¢ is what it may pay but cannot afford.
    total_amount_cents 8_400 = 2_400 + 6_000, and the fee list pins which is which.
    The shortfall is the target rule's own timing. Only 12 units of the covered metric (2+6+4) = 1_200¢
    exist at the 4 March refresh; the wallet is the only applicable wallet for that bucket
    (allocate_ongoing_usage_by_wallets_service.rb:126-137) and absorbs it as a threshold wallet (:48-51),
    so credits_ongoing_balance is −12 and target_ongoing_balance 0 makes the gap 0 − (−12) = 12 credits =
    1_200¢ of GRANTED credit — settled at once, no invoice, so invoices stays 1
    (create_from_params_service.rb:145-173). 60 more covered units (10/30/20, sum 60 ≠ max 30 ≠ latest 20)
    and 24 units of the other metric then arrive with no refresh between, so the invoice is 7_200 + 2_400 =
    9_600¢ and the wallet holds 1_200¢: min(7_200 covered bucket, 1_200 balance, 9_600 invoice) = 1_200
    (allocate_prepaid_credits_by_wallets_service.rb:53). Two wrong readings, named: a rule evaluated at
    billing would have funded 7_200¢ and reported total 2_400; a rule measuring its gap against
    `balance_cents` would have funded nothing and reported total 9_600.
    The re-arm after billing is a provable no-op: the wallet is drained to 0, the synchronous refresh
    (applied_prepaid_credits_service.rb:39) reports credits_ongoing_balance 0 which is not above
    threshold_credits 0, so the rule runs — and compute_target_top_up_amount returns 0.0 once
    ongoing_balance >= target (recurring_transaction_rule.rb:139-141), which CreateFromParamsService turns
    into no transaction at all (:115, :146).

- id: b06/target-method/billable-metrics/multi-wallet-priority
  block: B6
  axes: {source: target-method, limitation: billable-metrics, application: multi-wallet-priority}
  dimensions: {interval: monthly, billing_time: calendar, rate_amount: 1, target_ongoing_balance: 10, grants_target_top_up: true}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    organization: {premium_integrations: [manual_payments]}
    metrics:
      - {code: b06_tgt_bmm_cov, aggregation_type: sum_agg, field_name: amount}
      - {code: b06_tgt_bmm_oth, aggregation_type: sum_agg, field_name: amount}
    plan: {code: golden_b06_tgt_bmm, interval: monthly, amount_cents: 0}
    charges:
      - {billable_metric_code: b06_tgt_bmm_cov, charge_model: standard, properties: {amount: "1"}}
      - {billable_metric_code: b06_tgt_bmm_oth, charge_model: standard, properties: {amount: "1"}}
    customer: {external_id: golden_b06_tgt_bmm_cust, currency: EUR}
    subscription: {external_id: golden_b06_tgt_bmm_sub, billing_time: calendar}
    wallets:
      - name: target wallet, low priority
        code: b06_tgt_bmm_target
        rate_amount: "1"
        currency: EUR
        priority: 20
        applies_to: {billable_metric_codes: [b06_tgt_bmm_cov]}
        recurring_transaction_rules:
          - {trigger: threshold, threshold_credits: "0", method: target, target_ongoing_balance: "10", grants_target_top_up: true}
      - name: purchased wallet, high priority
        code: b06_tgt_bmm_paid
        rate_amount: "1"
        currency: EUR
        priority: 1
        paid_credits: "20"
        applies_to: {billable_metric_codes: [b06_tgt_bmm_cov]}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-02T00:00:00Z", do: pay_invoice, invoice_type: credit}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_tgt_bmm_cov, properties: {amount: 10}}
        - {code: b06_tgt_bmm_cov, properties: {amount: 30}}
        - {code: b06_tgt_bmm_cov, properties: {amount: 20}}
        - {code: b06_tgt_bmm_oth, properties: {amount: 4}}
        - {code: b06_tgt_bmm_oth, properties: {amount: 12}}
        - {code: b06_tgt_bmm_oth, properties: {amount: 8}}
    - {at: "2024-03-06T00:00:00Z", do: perform_wallet_refresh}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      select: {invoice_type: subscription}
      fees_amount_cents: 8400
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 6000
      prepaid_granted_credit_amount_cents: 4000
      prepaid_purchased_credit_amount_cents: 2000
      total_amount_cents: 2400
    wallet:
      code: b06_tgt_bmm_target
      balance_cents: 1000
  math: >-
    Two wallets, both limited to the metric b06_tgt_bmm_cov, declared in the wrong order on purpose:
    consumption follows `Wallet.in_application_order`, priority ASC then created_at (wallet.rb:69-71).
    b06_tgt_bmm_paid holds 20 PURCHASED credits (2_000¢, settled 2 March) at priority 1;
    b06_tgt_bmm_target holds nothing and carries the target rule at priority 20. Purchased-only against
    granted-only, so the prepaid breakdown (applied_prepaid_credits_service.rb:83-92) maps one-to-one onto
    the wallets and both are pinned though `expect.wallet` names one.
    b06_tgt_bmm_oth's 2_400¢ is the fee NEITHER wallet may pay — no wallet is applicable to that bucket at
    all (allocate_prepaid_credits_by_wallets_service.rb:108-122) — and total_amount_cents 2_400 asserts it
    is still owed in cash.
    Priority sets the target top-up's size first. At the 6 March refresh the covered bucket holds 60 units
    × 1.00 = 6_000¢ and the other bucket's 2_400¢ has no applicable wallet. Index 0 is the purchased
    wallet, not a threshold wallet, so it is capped by its own room: min(6_000, 2_000) = 2_000
    (allocate_ongoing_usage_by_wallets_service.rb:53-55). Index 1 is the target wallet, and a threshold
    wallet absorbs the remainder and may go negative so its rule can refill it (:48-51, :139-141), taking
    4_000. credits_ongoing_balance −40 makes the gap 10 − (−40) = 50 credits = 5_000¢ granted
    (recurring_transaction_rule.rb:138-150). Ignoring the cascade would ask for 70 credits, and ignoring
    the limitation would ask for 10 − (−64) = 74: name the consequence, target-wallet balance 1_000 vs
    3_000 vs 3_400.
    Then priority sets the split: purchased first takes min(6_000, 2_000, 8_400) = 2_000, the target wallet
    takes min(4_000, 5_000, 6_400) = 4_000 (allocate_prepaid_credits_by_wallets_service.rb:53-57).
    Creation order first would give 5_000 granted / 1_000 purchased with the target wallet emptied. No
    re-arm: 1_000¢ is credits_ongoing_balance 10, above threshold 0 (threshold_top_up_service.rb:20).

- id: b06/target-method/billable-metrics/rounding
  block: B6
  axes: {source: target-method, limitation: billable-metrics, application: rounding}
  dimensions: {interval: monthly, billing_time: calendar, rate_amount: "0.4", target_ongoing_balance: "12.5625", grants_target_top_up: true}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    metrics:
      - {code: b06_tgt_bmr_cov, aggregation_type: sum_agg, field_name: amount}
      - {code: b06_tgt_bmr_oth, aggregation_type: sum_agg, field_name: amount}
    plan: {code: golden_b06_tgt_bmr, interval: monthly, amount_cents: 0}
    charges:
      - {billable_metric_code: b06_tgt_bmr_cov, charge_model: standard, properties: {amount: "1"}}
      - {billable_metric_code: b06_tgt_bmr_oth, charge_model: standard, properties: {amount: "1"}}
    customer: {external_id: golden_b06_tgt_bmr_cust, currency: EUR}
    subscription: {external_id: golden_b06_tgt_bmr_sub, billing_time: calendar}
    wallets:
      - name: one metric only, quarter rate
        code: b06_tgt_bmr_w
        rate_amount: "0.4"
        currency: EUR
        applies_to: {billable_metric_codes: [b06_tgt_bmr_cov]}
        recurring_transaction_rules:
          - {trigger: threshold, threshold_credits: "0", method: target, target_ongoing_balance: "12.5625", grants_target_top_up: true}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_tgt_bmr_cov, properties: {amount: 10}}
        - {code: b06_tgt_bmr_cov, properties: {amount: 30}}
        - {code: b06_tgt_bmr_cov, properties: {amount: 20}}
        - {code: b06_tgt_bmr_oth, properties: {amount: 4}}
        - {code: b06_tgt_bmr_oth, properties: {amount: 12}}
        - {code: b06_tgt_bmr_oth, properties: {amount: 8}}
    - {at: "2024-03-06T00:00:00Z", do: perform_wallet_refresh}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_amount_cents: 8400
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 6000
      prepaid_granted_credit_amount_cents: 6000
      total_amount_cents: 2400
    wallet:
      code: b06_tgt_bmr_w
      balance_cents: 503
  math: >-
    rate_amount 0.4 is chosen so the FIRST of the two roundings is exact and the SECOND is a true
    half-cent, which isolates the one that matters. Ongoing usage in the covered bucket is 60 units × 1.00
    = 6_000¢ — the other metric's 2_400¢ has no applicable wallet
    (allocate_ongoing_usage_by_wallets_service.rb:126-137) and is allocated to nobody — so
    credits_ongoing_balance is −60 / 0.4 = −150.00000 exactly, with no residue from the float division
    into the decimal(30,5) column (refresh_ongoing_usage_service.rb:66-68).
    target_ongoing_balance 12.5625 makes the gap 12.5625 − (−150) = 162.5625 credits
    (recurring_transaction_rule.rb:143). Money is then
    `(credit_amount × rate_amount).round(currency.exponent) × 100` (wallet_credit.rb:26-27) and
    162.5625 × 0.4 = 65.025 exactly — a tie. HALF-UP gives 65.03 → 6_503¢; truncation gives 65.02 →
    6_502¢; and half-EVEN, the other plausible reading of "round", also gives 65.02 because 2 is even.
    Name all three: top-up 6_503 vs 6_502, and because the invoice takes exactly 6_000, the asserted
    wallet balance is 503¢ vs 502¢ — the residue is the only place the tie survives.
    b06_tgt_bmr_oth's 2_400¢ is the fee the metric-limited wallet may NOT pay, asserted as still owed in
    cash: fees 8_400, prepaid capped at the covered bucket's 6_000 (min(6_000, 6_503, 8_400),
    allocate_prepaid_credits_by_wallets_service.rb:53 with buckets at :70-91 matched at :108-122), total
    2_400. A limitation-blind implementation would draw 6_503 and report total 1_897 with the wallet
    emptied. No re-arm: 503¢ is credits_ongoing_balance 12.575, above threshold_credits 0
    (threshold_top_up_service.rb:20).

- id: b06/target-method/billable-metrics/negative-total
  block: B6
  axes: {source: target-method, limitation: billable-metrics, application: negative-total}
  dimensions: {interval: monthly, billing_time: calendar, rate_amount: 1, target_ongoing_balance: 100, grants_target_top_up: true}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    metrics:
      - {code: b06_tgt_bmn_cov, aggregation_type: sum_agg, field_name: amount}
      - {code: b06_tgt_bmn_oth, aggregation_type: sum_agg, field_name: amount}
    plan: {code: golden_b06_tgt_bmn, interval: monthly, amount_cents: 0}
    charges:
      - {billable_metric_code: b06_tgt_bmn_cov, charge_model: standard, properties: {amount: "1"}}
      - {billable_metric_code: b06_tgt_bmn_oth, charge_model: standard, properties: {amount: "1"}}
    customer: {external_id: golden_b06_tgt_bmn_cust, currency: EUR}
    subscription: {external_id: golden_b06_tgt_bmn_sub, billing_time: calendar}
    wallets:
      - name: one metric only, over-funded
        code: b06_tgt_bmn_w
        rate_amount: "1"
        currency: EUR
        applies_to: {billable_metric_codes: [b06_tgt_bmn_cov]}
        recurring_transaction_rules:
          - {trigger: threshold, threshold_credits: "0", method: target, target_ongoing_balance: "100", grants_target_top_up: true}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_tgt_bmn_cov, properties: {amount: 10}}
        - {code: b06_tgt_bmn_cov, properties: {amount: 30}}
        - {code: b06_tgt_bmn_cov, properties: {amount: 20}}
        - {code: b06_tgt_bmn_oth, properties: {amount: 4}}
        - {code: b06_tgt_bmn_oth, properties: {amount: 12}}
        - {code: b06_tgt_bmn_oth, properties: {amount: 8}}
    - {at: "2024-03-06T00:00:00Z", do: perform_wallet_refresh}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_amount_cents: 8400
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 6000
      prepaid_granted_credit_amount_cents: 6000
      total_amount_cents: 2400
      payment_status: pending
      fees:
        - {fee_type: subscription, amount_cents: 0}
        - {fee_type: charge, item_code: b06_tgt_bmn_cov, amount_cents: 6000, taxes_amount_cents: 0}
        - {fee_type: charge, item_code: b06_tgt_bmn_oth, amount_cents: 2400, taxes_amount_cents: 0}
    wallet:
      code: b06_tgt_bmn_w
      balance_cents: 10000
  math: >-
    With a metric limitation the invoice total cannot go negative, and the reason is the per-BUCKET cap
    rather than any clamp on the total — worth pinning rather than assuming. target_ongoing_balance 100
    against the covered bucket's 60 units × 1.00 = 6_000¢ of unbilled usage funds 100 − (−60) = 160
    credits = 16_000¢ of granted credit (recurring_transaction_rule.rb:138-150), nearly twice the whole
    8_400¢ invoice. The other metric's 2_400¢ is invisible to the ongoing read because no wallet is
    applicable to it (allocate_ongoing_usage_by_wallets_service.rb:126-137), so it does not inflate the
    gap either — a limitation-blind read would have funded 100 − (−84) = 184 credits.
    At billing the draw is `[remaining_amount, remaining_wallet_balance, remaining_invoice_amount].min`
    (allocate_prepaid_credits_by_wallets_service.rb:53) where remaining_amount is the covered metric's
    bucket, 6_000, and the other bucket is skipped because the wallet's wallet_targets do not name that
    metric (:37-42, :108-122). So prepaid is 6_000, total is 2_400 and 10_000¢ stays in the wallet.
    Four wrong answers, named: (a) prepaid 8_400 and total 0, if the limitation were ignored; (b) prepaid
    16_000 and total −7_600, if the balance drove the draw; (c) the wallet drained to 0 rather than left on
    10_000; (d) a `credit` invoice or credit note for the surplus — none is issued, invoices stays 1.
    payment_status pending is asserted because a positive total is pending while a zero one is succeeded
    (calculate_fees_service.rb:63): it is the difference between "the wallet could not reach this fee" and
    "the wallet paid it". No re-arm: 10_000¢ is credits_ongoing_balance 100, above threshold_credits 0
    (threshold_top_up_service.rb:20).

- id: b06/target-method/billable-metrics/ongoing-balance
  block: B6
  axes: {source: target-method, limitation: billable-metrics, application: ongoing-balance}
  dimensions: {interval: monthly, billing_time: calendar, rate_amount: 1, target_ongoing_balance: 15, read_at: mid-period}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    metrics:
      - {code: b06_tgt_bmo_cov, aggregation_type: sum_agg, field_name: amount}
      - {code: b06_tgt_bmo_oth, aggregation_type: sum_agg, field_name: amount}
    plan: {code: golden_b06_tgt_bmo, interval: monthly, amount_cents: 0}
    charges:
      - {billable_metric_code: b06_tgt_bmo_cov, charge_model: standard, properties: {amount: "1"}}
      - {billable_metric_code: b06_tgt_bmo_oth, charge_model: standard, properties: {amount: "1"}}
    customer: {external_id: golden_b06_tgt_bmo_cust, currency: EUR}
    subscription: {external_id: golden_b06_tgt_bmo_sub, billing_time: calendar}
    wallets:
      - name: one metric only, read mid-period
        code: b06_tgt_bmo_w
        rate_amount: "1"
        currency: EUR
        applies_to: {billable_metric_codes: [b06_tgt_bmo_cov]}
        recurring_transaction_rules:
          - {trigger: threshold, threshold_credits: "0", method: target, target_ongoing_balance: "15", grants_target_top_up: true}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_tgt_bmo_cov, properties: {amount: 10}}
        - {code: b06_tgt_bmo_cov, properties: {amount: 30}}
        - {code: b06_tgt_bmo_cov, properties: {amount: 20}}
        - {code: b06_tgt_bmo_oth, properties: {amount: 4}}
        - {code: b06_tgt_bmo_oth, properties: {amount: 12}}
        - {code: b06_tgt_bmo_oth, properties: {amount: 8}}
    - {at: "2024-03-06T00:00:00Z", do: perform_wallet_refresh}
  expect:
    invoices: 0
    wallet:
      code: b06_tgt_bmo_w
      balance_cents: 7500
      ongoing_usage_balance_cents: 6000
      ongoing_balance_cents: 1500
  math: >-
    A mid-period read on a different code path: Clock::RefreshWalletsOngoingBalanceJob (premium-gated,
    refresh_wallets_ongoing_balance_job.rb:8) → Customers::RefreshWalletsService →
    Wallets::Balance::AllocateOngoingUsageByWalletsService, a reimplementation of the billing allocator
    rather than the same code (allocate_ongoing_usage_by_wallets_service.rb:33-65). No invoice is built,
    hence invoices 0 and consumed_amount_cents 0.
    What this cell adds is that a metric limitation SHAPES THE POOL a target rule measures itself against.
    Usage is 60 units of b06_tgt_bmo_cov (6_000¢) and 24 units of b06_tgt_bmo_oth (2_400¢), three events
    each so sum is distinguishable from max and latest on both. The wallet's wallet_targets name only the
    covered metric, so `applicable_fee?` (:126-137) admits it to the 6_000¢ bucket and excludes it from the
    2_400¢ one, which is then allocated to NO wallet at all. It is a threshold wallet, so it absorbs the
    whole covered bucket and is allowed to go negative (:48-51, :139-141):
    ongoing_usage_balance_cents 6_000 — not 8_400 — ongoing_balance_cents −6_000, credits_ongoing_balance
    −60 (refresh_ongoing_usage_service.rb:62-68).
    Persisting those columns is what arms the rule (`state_changed`, update_ongoing_service.rb:18-19;
    threshold_top_up_service.rb:18 skips outright without it), and the gap is 15 − (−60) = 75 credits =
    7_500¢ granted (recurring_transaction_rule.rb:138-150). IncreaseService re-enqueues the refresh
    (increase_service.rb:36) and the second pass reports ongoing_balance 7_500 − 6_000 = 1_500 = 15 credits,
    which is above threshold 0, so the rule stops (:20): the target is reached exactly, in one top-up.
    The discriminating pair is the reason all three cents fields are asserted: a limitation-blind ongoing
    read would pool 8_400, ask for 15 − (−84) = 99 credits and report balance_cents 9_900 with
    ongoing_usage_balance_cents 8_400 — while ongoing_balance_cents would still be 1_500, because a target
    rule always drives that one field to the target. Asserting the ongoing balance alone would let the
    wrong implementation pass.

- id: b06/threshold-rule/none/full-cover
  block: B6
  axes: {source: threshold-rule, limitation: none, application: full-cover}
  dimensions: {interval: monthly, billing_time: calendar, rate_amount: 1, threshold_credits: 20, top_up: granted-40}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    metrics: [{code: b06_thr_nf_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_thr_nf, interval: monthly, amount_cents: 0}
    charges: [{billable_metric_code: b06_thr_nf_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b06_thr_nf_cust, currency: EUR}
    subscription: {external_id: golden_b06_thr_nf_sub, billing_time: calendar}
    wallets:
      - name: auto refilled
        code: b06_thr_nf_w
        rate_amount: "1"
        currency: EUR
        granted_credits: "50"
        recurring_transaction_rules:
          - {trigger: threshold, method: fixed, threshold_credits: "20", granted_credits: "40"}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_thr_nf_sum, properties: {amount: 10}}
        - {code: b06_thr_nf_sum, properties: {amount: 30}}
        - {code: b06_thr_nf_sum, properties: {amount: 20}}
    - {at: "2024-03-10T00:00:00Z", do: perform_wallet_refresh}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      fees_amount_cents: 6000
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 6000
      prepaid_granted_credit_amount_cents: 6000
      total_amount_cents: 0
      payment_status: succeeded
    wallet:
      code: b06_thr_nf_w
      balance_cents: 3000
  math: >-
    A threshold rule is NOT fired by a scheduler: its only call site is
    `Wallets::Balance::UpdateOngoingService` (update_ongoing_service.rb:26), reached whenever the
    wallet's ongoing balance is recomputed. `perform_wallet_refresh` (Clock::
    RefreshWalletsOngoingBalanceJob → Customers::RefreshWalletJob → Customers::RefreshWalletsService)
    is therefore the verb that arms it, and the rule itself only exists at all with a premium
    licence (recurring_transaction_rules/create_service.rb:16 returns early otherwise), hence
    `premium: true`.
    Three events 10/30/20 so sum 60 is distinguishable from max 30 and latest 20:
    60 units × 1.00 = 6_000¢ of fees. Wallet starts at 50 granted credits = 5_000¢.
    At wallet creation the customer has no subscription, so the ongoing pool is empty,
    ongoing_balance_cents = balance_cents = 5_000 and credits_ongoing_balance = 50 > 20: the guard
    at threshold_top_up_service.rb:20 returns and the rule does NOT fire on creation.
    On 10 March the refresh allocates the 6_000¢ of unbilled usage to the wallet — a wallet with an
    active threshold rule is deliberately allowed to go negative rather than being capped at its
    balance (allocate_ongoing_usage_by_wallets_service.rb:48-51, `balance: threshold ? 0` at :74) —
    so ongoing_balance_cents = 5_000 − 6_000 = −1_000 (refresh_ongoing_usage_service.rb:63) and
    credits_ongoing_balance = −10 ≤ 20. The rule fires for a flat 40 granted credits
    (recurring_transaction_rule.rb:104-111: a non-target rule returns `granted_credits`
    unchanged, it does NOT top up to the threshold), so the balance becomes 9_000¢. The cascade
    re-refresh then sees 9_000 − 6_000 = 3_000, i.e. 30 credits > 20, and stops: exactly ONE
    top-up, which is why 40 and not 20 was chosen — 20 would land the ongoing balance on 20
    credits and `>` (not `>=`) would fire a second time.
    At billing the wallet holds 9_000¢ against a 6_000¢ invoice, so the draw is
    min(6000, 9000, 6000) = 6_000 (allocate_prepaid_credits_by_wallets_service.rb:53), the total
    clamps to 0 and payment_status is succeeded. Balance ends 3_000, consumed 6_000, and the
    post-billing refresh leaves it there (April usage is 0, 30 credits > 20).
    Without the threshold top-up the wallet would have had only 5_000¢: prepaid 5_000, total
    1_000, balance 0. Name both — total 0 vs 1_000, prepaid 6_000 vs 5_000, balance 3_000 vs 0.
    prepaid_granted is the whole 6_000 because both inbounds are grants; no `credit` invoice is
    issued for either, so invoices stays 1.

- id: b06/threshold-rule/none/partial-cover
  block: B6
  axes: {source: threshold-rule, limitation: none, application: partial-cover}
  dimensions: {interval: monthly, billing_time: calendar, rate_amount: 1, threshold_credits: 20, refresh: after-billing-only}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    metrics: [{code: b06_thr_np_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_thr_np, interval: monthly, amount_cents: 0}
    charges: [{billable_metric_code: b06_thr_np_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b06_thr_np_cust, currency: EUR}
    subscription: {external_id: golden_b06_thr_np_sub, billing_time: calendar}
    wallets:
      - name: refilled too late
        code: b06_thr_np_w
        rate_amount: "1"
        currency: EUR
        granted_credits: "50"
        recurring_transaction_rules:
          - {trigger: threshold, method: fixed, threshold_credits: "20", granted_credits: "40"}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_thr_np_sum, properties: {amount: 10}}
        - {code: b06_thr_np_sum, properties: {amount: 30}}
        - {code: b06_thr_np_sum, properties: {amount: 20}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      fees_amount_cents: 6000
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 5000
      prepaid_granted_credit_amount_cents: 5000
      total_amount_cents: 1000
      payment_status: pending
    wallet:
      code: b06_thr_np_w
      balance_cents: 4000
  math: >-
    The same wallet and the same rule as the row above with ONE step removed — no mid-period
    `perform_wallet_refresh` — and that single omission moves 1_000¢ from credits to cash. This is
    the row that pins WHEN a threshold rule fires relative to the invoice it would have paid.
    60 units × 1.00 = 6_000¢ of fees. Nothing recomputes the ongoing balance between the events
    and the billing run: `perform_billing` runs Clock::SubscriptionsBillerJob, not
    Clock::RefreshWalletsOngoingBalanceJob, so credits_ongoing_balance is still the 50 it was set
    to at wallet creation and the rule is still asleep. The invoice therefore draws against the
    5_000¢ actually in the wallet: min(6000, 5000, 6000) = 5_000
    (allocate_prepaid_credits_by_wallets_service.rb:53), leaving 1_000¢ owed in cash and
    payment_status pending rather than succeeded.
    Only AFTER the credits are consumed does the wallet get refreshed: Credits::
    AppliedPrepaidCreditsService calls Wallets::Balance::DecreaseService with `skip_refresh: true`
    and then Customers::RefreshWalletsService itself (applied_prepaid_credits_service.rb:34-39).
    At that point the balance is 0 and the new April period has no usage, so
    ongoing_balance_cents = 0 − 0 = 0, credits_ongoing_balance 0 ≤ 20, and the rule fires for 40
    granted credits — 4_000¢ that arrive one step too late to reduce the invoice that emptied the
    wallet. The next cascade refresh sees 40 credits > 20 and stops.
    The wrong implementation to name is the one that refreshes (and so tops up) BEFORE applying
    credits: it would report prepaid 6_000, total 0 and balance 3_000 — the full-cover row's
    numbers — instead of prepaid 5_000, total 1_000 and balance 4_000. Note also that the wallet
    ends RICHER than the invoice was short (4_000 in the wallet, 1_000 owed in cash): the top-up
    is a flat 40 credits, not a top-up to the invoice's shortfall.

- id: b06/threshold-rule/none/multi-wallet-priority
  block: B6
  axes: {source: threshold-rule, limitation: none, application: multi-wallet-priority}
  dimensions: {interval: monthly, billing_time: calendar, priorities: "1 threshold / 20 purchased"}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    organization: {premium_integrations: [manual_payments]}
    metrics: [{code: b06_thr_nm_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_thr_nm, interval: monthly, amount_cents: 0}
    charges: [{billable_metric_code: b06_thr_nm_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b06_thr_nm_cust, currency: EUR}
    subscription: {external_id: golden_b06_thr_nm_sub, billing_time: calendar}
    wallets:
      - name: purchased pool
        code: b06_thr_nm_paid
        rate_amount: "1"
        currency: EUR
        paid_credits: "60"
        priority: 20
      - name: auto refilled pool
        code: b06_thr_nm_thr
        rate_amount: "1"
        currency: EUR
        granted_credits: "20"
        priority: 1
        recurring_transaction_rules:
          - {trigger: threshold, method: fixed, threshold_credits: "10", granted_credits: "60"}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-02T00:00:00Z", do: pay_invoice, invoice_type: credit}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_thr_nm_sum, properties: {amount: 10}}
        - {code: b06_thr_nm_sum, properties: {amount: 30}}
        - {code: b06_thr_nm_sum, properties: {amount: 20}}
    - {at: "2024-03-10T00:00:00Z", do: perform_wallet_refresh}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      select: {invoice_type: subscription}
      fees_amount_cents: 6000
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 6000
      prepaid_granted_credit_amount_cents: 6000
      total_amount_cents: 0
      payment_status: succeeded
    wallet:
      code: b06_thr_nm_thr
      balance_cents: 2000
  math: >-
    Two wallets, declared in the WRONG order on purpose: the purchased one (priority 20, 60 paid
    credits = 6_000¢, settled by paying its `credit` invoice on 2 March) comes first in the YAML,
    the threshold one (priority 1, 20 granted credits = 2_000¢ plus a rule that grants 60 more)
    second. Consumption follows `Wallet.in_application_order` — priority ASC then created_at
    (wallet.rb:69-71) — so the threshold wallet is drawn first.
    Mid-period the threshold wallet also absorbs the WHOLE unbilled pool, not just its own
    balance's worth: `wallet_meta` reports `balance: 0` for it and the loop takes `remaining`
    outright (allocate_ongoing_usage_by_wallets_service.rb:48-51, :68-75), so of the 6_000¢ of
    usage it takes 6_000 and the purchased wallet takes 0 (`break if remaining <= 0`, :46).
    Its ongoing balance is 2_000 − 6_000 = −4_000, i.e. −40 credits ≤ 10, so the rule fires for a
    flat 60 granted credits and the balance becomes 8_000¢; the cascade refresh then sees
    8_000 − 6_000 = 2_000 (20 credits > 10) and stops.
    At billing the invoice is 6_000¢ and the threshold wallet holds 8_000¢, so it pays the entire
    invoice: min(6000, 8000, 6000) = 6_000, `remaining_invoice_amount` drops to 0 and the purchased
    wallet is skipped on `next if remaining_amount <= 0`
    (allocate_prepaid_credits_by_wallets_service.rb:44). Balances end 2_000 (threshold, consumed
    6_000) and 6_000 (purchased, consumed 0).
    Both wallets are pinned without an `expect.wallets` list, because one pool is purely granted
    and the other purely purchased, so the breakdown at
    applied_prepaid_credits_service.rb:83-92 maps one-to-one: prepaid_granted 6_000 with
    prepaid_credit 6_000 means the purchased wallet contributed nothing and still holds its 6_000.
    The counterfactual is different in every asserted number: consuming in declaration/creation
    order would report prepaid_granted nil and prepaid_purchased 6_000, with
    wallet[b06_thr_nm_thr].balance_cents still 8_000 and consumed 0, and the purchased wallet
    drained to 0. invoices is 2 — the purchased top-up's `credit` invoice plus the period invoice;
    paying an invoice through POST /payments is itself premium, hence `manual_payments`.

- id: b06/threshold-rule/none/rounding
  block: B6
  axes: {source: threshold-rule, limitation: none, application: rounding}
  dimensions: {interval: monthly, billing_time: calendar, rate_amount: "0.3335", threshold_credits: 5}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    metrics: [{code: b06_thr_nr_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_thr_nr, interval: monthly, amount_cents: 0}
    charges: [{billable_metric_code: b06_thr_nr_sum, charge_model: standard, properties: {amount: "0.1"}}]
    customer: {external_id: golden_b06_thr_nr_cust, currency: EUR}
    subscription: {external_id: golden_b06_thr_nr_sub, billing_time: calendar}
    wallets:
      - name: awkward rate
        code: b06_thr_nr_w
        rate_amount: "0.3335"
        currency: EUR
        granted_credits: "10"
        recurring_transaction_rules:
          - {trigger: threshold, method: fixed, threshold_credits: "5", granted_credits: "70"}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_thr_nr_sum, properties: {amount: 10}}
        - {code: b06_thr_nr_sum, properties: {amount: 30}}
        - {code: b06_thr_nr_sum, properties: {amount: 20}}
    - {at: "2024-03-10T00:00:00Z", do: perform_wallet_refresh}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      fees_amount_cents: 600
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 600
      prepaid_granted_credit_amount_cents: 600
      total_amount_cents: 0
      payment_status: succeeded
    wallet:
      code: b06_thr_nr_w
      balance_cents: 2069
  math: >-
    Two credit→cents conversions on one wallet, both landing exactly on a half-cent, so the whole
    row moves if the rounding mode changes. `(credit_amount × rate_amount).round(currency.exponent)
    × 100` (wallet_credit.rb:26-27) is a HALF-UP round of the currency amount, not a truncation.
    At rate 0.3335 the initial grant is 10 × 0.3335 = 3.335 → 3.34 → 334¢ and the threshold
    top-up is 70 × 0.3335 = 23.345 → 23.35 → 2_335¢, so the balance after the top-up is
    334 + 2_335 = 2_669¢. Truncating instead of rounding gives 333 + 2_334 = 2_667¢ — name both.
    Fees: 60 units (10/30/20, so sum 60 is distinguishable from max 30 and latest 20) × 0.10 =
    6.00 → 600¢, deliberately small enough that the top-up over-covers it.
    The rule stays asleep at wallet creation: with no subscription the ongoing pool is empty, so
    ongoing_balance_cents = 334 and credits_ongoing_balance = 3.34 ÷ 0.3335 = 10.01499 > 5
    (threshold_top_up_service.rb:20). On 10 March the refresh gives the wallet the 600¢ of unbilled
    usage — a threshold wallet is not capped at its balance
    (allocate_ongoing_usage_by_wallets_service.rb:48-51) — so ongoing_balance_cents = 334 − 600 =
    −266, i.e. −7.97601 credits ≤ 5, and the rule fires once for a flat 70 granted credits. The
    cascade refresh then sees 2_669 − 600 = 2_069, i.e. 62.03898 credits > 5, and stops.
    At billing the draw is min(600, 2669, 600) = 600 (allocate_prepaid_credits_by_wallets_service
    .rb:53) so the total clamps to 0, and the outbound is sized by
    `WalletCredit.from_amount_cents` (wallet_credit.rb:8-11) which carries the 600¢ through
    unrounded. Balance ends 2_669 − 600 = 2_069¢, and the truncating implementation would print
    2_067¢ — the single asserted number that separates the two, since prepaid and total are
    identical under both.

- id: b06/threshold-rule/none/negative-total
  block: B6
  axes: {source: threshold-rule, limitation: none, application: negative-total}
  dimensions: {interval: monthly, billing_time: calendar, coupon: fixed_1500_once, top_up: granted-200}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    metrics: [{code: b06_thr_nn_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_thr_nn, interval: monthly, amount_cents: 0}
    charges: [{billable_metric_code: b06_thr_nn_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b06_thr_nn_cust, currency: EUR}
    subscription: {external_id: golden_b06_thr_nn_sub, billing_time: calendar}
    coupons:
      - {code: b06_thr_nn_cpn, coupon_type: fixed_amount, amount_cents: 1500, amount_currency: EUR, frequency: once, expiration: no_expiration}
    wallets:
      - name: wildly over refilled
        code: b06_thr_nn_w
        rate_amount: "1"
        currency: EUR
        granted_credits: "50"
        recurring_transaction_rules:
          - {trigger: threshold, method: fixed, threshold_credits: "20", granted_credits: "200"}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_thr_nn_sum, properties: {amount: 10}}
        - {code: b06_thr_nn_sum, properties: {amount: 30}}
        - {code: b06_thr_nn_sum, properties: {amount: 20}}
    - {at: "2024-03-10T00:00:00Z", do: perform_wallet_refresh}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      fees_amount_cents: 6000
      coupons_amount_cents: 1500
      sub_total_excluding_taxes_amount_cents: 4500
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 4500
      prepaid_granted_credit_amount_cents: 4500
      total_amount_cents: 0
      payment_status: succeeded
    wallet:
      code: b06_thr_nn_w
      balance_cents: 20500
  math: >-
    A threshold rule that grossly over-refills — 200 granted credits on a wallet already holding
    50, against an invoice whose payable ceiling is 4_500¢ — which is the case where the total
    could go negative. It does NOT. Lago clamps at zero and leaves the surplus in the wallet:
    every draw is bounded by `remaining_invoice_amount`
    (allocate_prepaid_credits_by_wallets_service.rb:53, decremented at :57), so exactly 4_500¢
    leaves the wallet and 20_500¢ stays. The three alternatives, named: (a) total −20_500 if the
    whole balance were drained against the invoice, (b) a `credit` invoice or a credit note for
    the 20_500 surplus — none is issued and invoices stays 1, (c) the wallet emptied to 0.
    Getting there: 60 units × 1.00 = 6_000¢ of fees. The rule is asleep at creation
    (ongoing pool empty, 50 credits > 20). On 10 March the refresh hands the wallet all 6_000¢ of
    unbilled usage, so ongoing_balance_cents = 5_000 − 6_000 = −1_000, −10 credits ≤ 20, and the
    rule fires once for 200 granted credits → balance 25_000¢; the cascade refresh sees
    25_000 − 6_000 = 19_000 (190 credits > 20) and stops. Note the top-up is sized by the RULE, not
    by the deficit: `compute_granted_credits` returns `granted_credits` verbatim for a non-target
    rule (recurring_transaction_rule.rb:104-111), so nothing scales it down to the 1_000¢ actually
    missing.
    The 4_500 ceiling is the row's second half. Prepaid credit is the LAST reducer
    (calculate_fees_service.rb:57-62: coupon → tax → credit note → prepaid) and the per-fee cap is
    `sub_total_excluding_taxes + taxes_precise − precise_credit_notes` (:77-79), where
    `sub_total_excluding_taxes_amount_cents = amount_cents − precise_coupons_amount_cents`
    (fee.rb:238-240): 6_000 − 1_500 = 4_500, which equals invoice.total exactly so
    `reconcile_remaining_amounts` (:93-106) adds nothing. Credits applied BEFORE the coupon would
    have taken 6_000 and left 19_000 — name both: prepaid 4_500 vs 6_000, wallet 20_500 vs 19_000.
    The coupon is `frequency: once` and is still unspent when the period invoice is built because
    the threshold top-up is granted, so it raises no invoice for the coupon to be consumed on.

- id: b06/threshold-rule/none/ongoing-balance
  block: B6
  axes: {source: threshold-rule, limitation: none, application: ongoing-balance}
  dimensions: {interval: monthly, billing_time: calendar, read_at: mid-period, threshold_credits: 20}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    metrics: [{code: b06_thr_no_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_thr_no, interval: monthly, amount_cents: 0}
    charges: [{billable_metric_code: b06_thr_no_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b06_thr_no_cust, currency: EUR}
    subscription: {external_id: golden_b06_thr_no_sub, billing_time: calendar}
    wallets:
      - name: mid period refill
        code: b06_thr_no_w
        rate_amount: "1"
        currency: EUR
        granted_credits: "50"
        recurring_transaction_rules:
          - {trigger: threshold, method: fixed, threshold_credits: "20", granted_credits: "40"}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_thr_no_sum, properties: {amount: 10}}
        - {code: b06_thr_no_sum, properties: {amount: 30}}
        - {code: b06_thr_no_sum, properties: {amount: 20}}
    - {at: "2024-03-10T00:00:00Z", do: perform_wallet_refresh}
  expect:
    invoices: 0
    wallet:
      code: b06_thr_no_w
      balance_cents: 9000
      ongoing_usage_balance_cents: 6000
      ongoing_balance_cents: 3000
  math: >-
    A mid-period read, and the only row in this slice where the threshold rule's effect is observed
    WITHOUT an invoice existing at all: the timeline stops at the refresh, so no billing code runs
    and invoices is 0. The path is Clock::RefreshWalletsOngoingBalanceJob (premium-gated at
    refresh_wallets_ongoing_balance_job.rb:8) → Customers::RefreshWalletsService →
    Wallets::Balance::AllocateOngoingUsageByWalletsService → RefreshOngoingUsageService →
    UpdateOngoingService, whose after_commit is the one and only caller of
    Wallets::ThresholdTopUpService (update_ongoing_service.rb:26).
    60 units (10/30/20) × 1.00 = 6_000¢ of unbilled usage, pooled as
    `fee.amount_cents + fee.taxes_amount_cents` (allocate_ongoing_usage_by_wallets_service.rb:88).
    First pass: balance 5_000, ongoing_usage 6_000, ongoing_balance_cents = 5_000 − 6_000 = −1_000
    (refresh_ongoing_usage_service.rb:63) — the wallet is allowed NEGATIVE, and
    `depleted_ongoing_balance` flips true (:41-45). credits_ongoing_balance −10 ≤ 20 so the rule
    fires for a flat 40 granted credits. Wallets::Balance::IncreaseService then re-enqueues the
    refresh (increase_service.rb:36), which is the state asserted: balance 9_000, ongoing_usage
    6_000 again, ongoing_balance 3_000 — and 30 credits > 20, so the loop terminates after exactly
    one top-up.
    The plausible wrong answers, all named: no top-up at all → balance 5_000 and ongoing_balance
    −1_000; a top-up sized to the deficit rather than the rule's flat 40 → balance 6_000 and
    ongoing_balance 0; a clamp of ongoing usage at the balance → ongoing_usage 5_000 and
    ongoing_balance 0. Honest limitation of this row: with a single wallet the threshold
    special-case and the ordinary "last applicable wallet absorbs the overflow" branch coincide
    (`meta[:threshold] || index == applicable.length - 1`, :48), so it does not distinguish them —
    the two-wallet form in b06/threshold-rule/none/multi-wallet-priority is what separates a
    threshold wallet from a merely-last one. Note too that there is no granted/purchased breakdown
    on this path: ongoing usage is allocated against `balance_cents` as a single pool and no
    WalletTransactionConsumption rows are written.

- id: b06/threshold-rule/fee-types/full-cover
  block: B6
  axes: {source: threshold-rule, limitation: fee-types, application: full-cover}
  dimensions: {interval: monthly, billing_time: calendar, allowed_fee_types: charge, threshold_credits: 20}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    metrics: [{code: b06_thr_ff_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_thr_ff, interval: monthly, amount_cents: 5000}
    charges: [{billable_metric_code: b06_thr_ff_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b06_thr_ff_cust, currency: EUR}
    subscription: {external_id: golden_b06_thr_ff_sub, billing_time: calendar}
    wallets:
      - name: charges only, auto refilled
        code: b06_thr_ff_w
        rate_amount: "1"
        currency: EUR
        granted_credits: "50"
        applies_to: {fee_types: [charge]}
        recurring_transaction_rules:
          - {trigger: threshold, method: fixed, threshold_credits: "20", granted_credits: "40"}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_thr_ff_sum, properties: {amount: 10}}
        - {code: b06_thr_ff_sum, properties: {amount: 30}}
        - {code: b06_thr_ff_sum, properties: {amount: 20}}
    - {at: "2024-03-10T00:00:00Z", do: perform_wallet_refresh}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      fees_amount_cents: 11000
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 6000
      prepaid_granted_credit_amount_cents: 6000
      total_amount_cents: 5000
      payment_status: pending
      fees:
        - {fee_type: subscription, amount_cents: 5000}
        - {fee_type: charge, amount_cents: 6000, units: "60"}
    wallet:
      code: b06_thr_ff_w
      balance_cents: 3000
  math: >-
    Under a limitation "full cover" means the wallet fully covers the slice it is ALLOWED to pay
    and keeps a surplus, while the rest stays cash. The invoice holds two fees: a 5_000¢
    subscription fee and a 6_000¢ charge fee (60 units from 10/30/20 × 1.00), 11_000¢ total.
    Mid-period the ongoing pool contains only the charge bucket — `current_usage_fees` is
    Invoices::CustomerUsageService output, charge fees only, a subscription fee is not usage
    (refresh_wallets_service.rb:52-54) — and the wallet allows fee_type `charge`, so
    `applicable_fee?` (allocate_ongoing_usage_by_wallets_service.rb:126-137) matches and the
    threshold wallet absorbs all 6_000¢ (:48-51). ongoing_balance_cents = 5_000 − 6_000 = −1_000,
    −10 credits ≤ 20, so the rule fires once for a flat 40 granted credits → balance 9_000¢; the
    cascade refresh sees 3_000 (30 credits > 20) and stops.
    At billing the buckets are [charge, bm] = 6_000 and [subscription, nil] = 5_000, sorted
    descending (allocate_prepaid_credits_by_wallets_service.rb:88). The wallet's
    allowed_fee_types is ["charge"], so for the subscription bucket `applicable_fee?`
    (:105-121) finds no type match, no target match, and `unrestricted_wallet` false because
    types is non-empty — the bucket is SKIPPED ENTIRELY, not merely reduced. The charge bucket
    draws min(6000, 9000, 11000) = 6_000. So prepaid is 6_000 and total is 5_000 — exactly the
    subscription fee, still owed in cash, which is the fee this wallet may not pay for and the
    reason payment_status is pending despite a wallet that could have covered the lot.
    Counterfactuals, named: ignoring allowed_fee_types at billing → prepaid 9_000, total 2_000,
    balance 0; ignoring it mid-period changes nothing here because the pool is charges only, which
    is why the fee-types/ongoing-balance row uses the opposite limitation. Without the threshold
    top-up the wallet would have held 5_000: prepaid 5_000, total 6_000, balance 0.

- id: b06/threshold-rule/fee-types/partial-cover
  block: B6
  axes: {source: threshold-rule, limitation: fee-types, application: partial-cover}
  dimensions: {interval: monthly, billing_time: calendar, allowed_fee_types: charge, refresh: after-billing-only}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    metrics: [{code: b06_thr_fp_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_thr_fp, interval: monthly, amount_cents: 5000}
    charges: [{billable_metric_code: b06_thr_fp_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b06_thr_fp_cust, currency: EUR}
    subscription: {external_id: golden_b06_thr_fp_sub, billing_time: calendar}
    wallets:
      - name: charges only, refilled too late
        code: b06_thr_fp_w
        rate_amount: "1"
        currency: EUR
        granted_credits: "30"
        applies_to: {fee_types: [charge]}
        recurring_transaction_rules:
          - {trigger: threshold, method: fixed, threshold_credits: "10", granted_credits: "40"}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_thr_fp_sum, properties: {amount: 10}}
        - {code: b06_thr_fp_sum, properties: {amount: 30}}
        - {code: b06_thr_fp_sum, properties: {amount: 20}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      fees_amount_cents: 11000
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 3000
      prepaid_granted_credit_amount_cents: 3000
      total_amount_cents: 8000
      payment_status: pending
      fees:
        - {fee_type: subscription, amount_cents: 5000}
        - {fee_type: charge, amount_cents: 6000, units: "60"}
    wallet:
      code: b06_thr_fp_w
      balance_cents: 4000
  math: >-
    Partial cover TWICE over: the wallet runs dry part-way through the slice it is allowed to pay,
    AND the slice it is not allowed to pay is untouched. Fees 11_000¢ (5_000 subscription + 6_000
    charge, 60 units from 10/30/20 × 1.00).
    No mid-period refresh, so as in b06/threshold-rule/none/partial-cover the rule is still asleep
    when the invoice is built (`perform_billing` runs Clock::SubscriptionsBillerJob, never
    Clock::RefreshWalletsOngoingBalanceJob, and credits_ongoing_balance is still the 30 set at
    wallet creation, 30 > 10 at threshold_top_up_service.rb:20). The wallet therefore has only its
    30 granted credits = 3_000¢. The subscription bucket is skipped outright by `applicable_fee?`
    (allocate_prepaid_credits_by_wallets_service.rb:105-121) because allowed_fee_types is
    ["charge"], and the charge bucket draws min(6000, 3000, 11000) = 3_000 (:53) — the wallet is
    emptied without finishing the charge fee. Total owed 8_000¢ = the whole 5_000 subscription fee
    plus the 3_000 of charge fee the credits could not reach; both halves are cash.
    Only after the credits are consumed is the wallet refreshed
    (applied_prepaid_credits_service.rb:34-39: DecreaseService with `skip_refresh: true`, then
    Customers::RefreshWalletsService). Balance is then 0 and the new April period has no usage, so
    ongoing_balance_cents = 0, 0 credits ≤ 10, and the rule fires for a flat 40 granted credits:
    the wallet ends at 4_000¢, richer than it started, while 8_000¢ went out as cash.
    Named counterfactuals: a refresh (and so a top-up) before applying credits → prepaid 6_000,
    total 5_000, balance 1_000; ignoring allowed_fee_types → prepaid 3_000 still (the wallet is the
    binding constraint) but drawn off the subscription bucket first, so
    prepaid stays 3_000 while total stays 8_000 — which is why this row also asserts the per-fee
    split, the only place the two differ is which fee remains payable.

- id: b06/threshold-rule/fee-types/multi-wallet-priority
  block: B6
  axes: {source: threshold-rule, limitation: fee-types, application: multi-wallet-priority}
  dimensions: {interval: monthly, billing_time: calendar, allowed_fee_types: charge, priorities: "1 threshold / 20 purchased"}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    organization: {premium_integrations: [manual_payments]}
    metrics: [{code: b06_thr_fm_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_thr_fm, interval: monthly, amount_cents: 5000}
    charges: [{billable_metric_code: b06_thr_fm_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b06_thr_fm_cust, currency: EUR}
    subscription: {external_id: golden_b06_thr_fm_sub, billing_time: calendar}
    wallets:
      - name: purchased pool, charges only
        code: b06_thr_fm_paid
        rate_amount: "1"
        currency: EUR
        paid_credits: "60"
        priority: 20
        applies_to: {fee_types: [charge]}
      - name: auto refilled pool, charges only
        code: b06_thr_fm_thr
        rate_amount: "1"
        currency: EUR
        granted_credits: "20"
        priority: 1
        applies_to: {fee_types: [charge]}
        recurring_transaction_rules:
          - {trigger: threshold, method: fixed, threshold_credits: "10", granted_credits: "60"}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-02T00:00:00Z", do: pay_invoice, invoice_type: credit}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_thr_fm_sum, properties: {amount: 10}}
        - {code: b06_thr_fm_sum, properties: {amount: 30}}
        - {code: b06_thr_fm_sum, properties: {amount: 20}}
    - {at: "2024-03-10T00:00:00Z", do: perform_wallet_refresh}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      select: {invoice_type: subscription}
      fees_amount_cents: 11000
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 6000
      prepaid_granted_credit_amount_cents: 6000
      total_amount_cents: 5000
      fees:
        - {fee_type: subscription, amount_cents: 5000}
        - {fee_type: charge, amount_cents: 6000, units: "60"}
    wallet:
      code: b06_thr_fm_thr
      balance_cents: 2000
  math: >-
    Granted-and-auto-refilled versus purchased, both limited to fee_type `charge`, declared in the
    wrong order so that only `Wallet.in_application_order` (priority ASC then created_at,
    wallet.rb:69-71) produces the asserted numbers. Fees 11_000¢ (5_000 subscription + 6_000
    charge, 60 units from 10/30/20 × 1.00).
    The purchased wallet's 60 paid credits are pending until its `credit` invoice is paid on
    2 March (hence `manual_payments`), after which it holds 6_000¢; the threshold wallet holds
    20 granted credits = 2_000¢ and a rule granting 60 more below 10 credits.
    Mid-period the pool is the 6_000¢ charge bucket only (a subscription fee is not usage,
    refresh_wallets_service.rb:52-54) and both wallets are applicable, but the threshold wallet is
    first AND absorbs the whole remaining amount rather than only its balance's worth
    (allocate_ongoing_usage_by_wallets_service.rb:48-51, `balance: threshold ? 0` at :74), so it
    takes 6_000 and the purchased wallet takes 0 (`break if remaining <= 0`, :46). Its ongoing
    balance is 2_000 − 6_000 = −4_000, −40 credits ≤ 10, so the rule fires once for a flat 60
    granted credits → 8_000¢; the cascade refresh sees 2_000 (20 credits > 10) and stops.
    At billing the buckets are charge 6_000 and subscription 5_000. Wallet 1 (priority 1, 8_000¢):
    the subscription bucket is skipped by `applicable_fee?`
    (allocate_prepaid_credits_by_wallets_service.rb:105-121) since allowed_fee_types is ["charge"],
    and the charge bucket draws min(6000, 8000, 11000) = 6_000, zeroing it. Wallet 2 (priority 20)
    then finds the charge bucket at 0 (`next if remaining_amount <= 0`, :44) and the subscription
    bucket inapplicable, contributes nothing and is dropped (`next if total_amount_cents <= 0`,
    :64). Prepaid 6_000, total 5_000 — the subscription fee, still cash, the fee neither wallet may
    pay for. Balances end 2_000 (threshold, consumed 6_000) and 6_000 (purchased, consumed 0).
    Both wallets are pinned without an `expect.wallets` list: one pool is purely granted and the
    other purely purchased, so prepaid_granted 6_000 alongside prepaid_credit 6_000 means the
    purchased wallet contributed nothing and still holds 6_000
    (applied_prepaid_credits_service.rb:83-92). Creation order instead of priority would report
    prepaid_granted nil and prepaid_purchased 6_000, with wallet[b06_thr_fm_thr] still at 8_000
    and consumed 0 — every asserted number differs.

- id: b06/threshold-rule/fee-types/rounding
  block: B6
  axes: {source: threshold-rule, limitation: fee-types, application: rounding}
  dimensions: {interval: monthly, billing_time: calendar, rate_amount: "0.2225", allowed_fee_types: charge}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    metrics: [{code: b06_thr_fr_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_thr_fr, interval: monthly, amount_cents: 5000}
    charges: [{billable_metric_code: b06_thr_fr_sum, charge_model: standard, properties: {amount: "0.1"}}]
    customer: {external_id: golden_b06_thr_fr_cust, currency: EUR}
    subscription: {external_id: golden_b06_thr_fr_sub, billing_time: calendar}
    wallets:
      - name: awkward rate, charges only
        code: b06_thr_fr_w
        rate_amount: "0.2225"
        currency: EUR
        granted_credits: "10"
        applies_to: {fee_types: [charge]}
        recurring_transaction_rules:
          - {trigger: threshold, method: fixed, threshold_credits: "5", granted_credits: "70"}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_thr_fr_sum, properties: {amount: 10}}
        - {code: b06_thr_fr_sum, properties: {amount: 30}}
        - {code: b06_thr_fr_sum, properties: {amount: 20}}
    - {at: "2024-03-10T00:00:00Z", do: perform_wallet_refresh}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      fees_amount_cents: 5600
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 600
      prepaid_granted_credit_amount_cents: 600
      total_amount_cents: 5000
      fees:
        - {fee_type: subscription, amount_cents: 5000}
        - {fee_type: charge, amount_cents: 600, units: "60"}
    wallet:
      code: b06_thr_fr_w
      balance_cents: 1181
  math: >-
    Two half-cent conversions on a fee-type-limited wallet. `(credit_amount × rate_amount)
    .round(currency.exponent) × 100` (wallet_credit.rb:26-27) is HALF-UP on the currency amount:
    at rate 0.2225 the initial grant is 10 × 0.2225 = 2.225 → 2.23 → 223¢ and the threshold top-up
    is 70 × 0.2225 = 15.575 → 15.58 → 1_558¢, so the balance after the top-up is 223 + 1_558 =
    1_781¢. Truncating gives 222 + 1_557 = 1_779¢ — name both.
    Fees 5_600¢: a 5_000¢ subscription fee plus 60 units (10/30/20, so sum 60 ≠ max 30 ≠ latest 20)
    × 0.10 = 600¢ of charge.
    The rule is asleep at creation: no subscription yet, so ongoing_balance_cents = 223 and
    credits_ongoing_balance = 2.23 ÷ 0.2225 = 10.02247 > 5 (threshold_top_up_service.rb:20). On
    10 March the pool is the 600¢ charge bucket, which this wallet may pay, so the threshold wallet
    absorbs all of it (allocate_ongoing_usage_by_wallets_service.rb:48-51): ongoing_balance_cents =
    223 − 600 = −377, −16.94382 credits ≤ 5, one top-up of 70 granted credits. The cascade refresh
    sees 1_781 − 600 = 1_181, i.e. 53.07865 credits > 5, and stops.
    At billing the buckets sort descending, so subscription 5_000 is tried FIRST and skipped —
    allowed_fee_types is ["charge"], so `applicable_fee?`
    (allocate_prepaid_credits_by_wallets_service.rb:105-121) finds no match and
    `unrestricted_wallet` is false — and only then does the charge bucket draw
    min(600, 1781, 5600) = 600. Total 5_000 is the subscription fee, still owed in cash: the fee
    this wallet may not pay for. Balance ends 1_781 − 600 = 1_181¢ against the truncating
    implementation's 1_179¢, the one asserted number that separates them, since prepaid, total and
    the per-fee split are identical under both.

- id: b06/threshold-rule/fee-types/negative-total
  block: B6
  axes: {source: threshold-rule, limitation: fee-types, application: negative-total}
  dimensions: {interval: monthly, billing_time: calendar, allowed_fee_types: charge, top_up: granted-200}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    metrics: [{code: b06_thr_fn_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_thr_fn, interval: monthly, amount_cents: 5000}
    charges: [{billable_metric_code: b06_thr_fn_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b06_thr_fn_cust, currency: EUR}
    subscription: {external_id: golden_b06_thr_fn_sub, billing_time: calendar}
    wallets:
      - name: over refilled, charges only
        code: b06_thr_fn_w
        rate_amount: "1"
        currency: EUR
        granted_credits: "50"
        applies_to: {fee_types: [charge]}
        recurring_transaction_rules:
          - {trigger: threshold, method: fixed, threshold_credits: "20", granted_credits: "200"}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_thr_fn_sum, properties: {amount: 10}}
        - {code: b06_thr_fn_sum, properties: {amount: 30}}
        - {code: b06_thr_fn_sum, properties: {amount: 20}}
    - {at: "2024-03-10T00:00:00Z", do: perform_wallet_refresh}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      fees_amount_cents: 11000
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 6000
      prepaid_granted_credit_amount_cents: 6000
      total_amount_cents: 5000
      payment_status: pending
      fees:
        - {fee_type: subscription, amount_cents: 5000}
        - {fee_type: charge, amount_cents: 6000, units: "60"}
    wallet:
      code: b06_thr_fn_w
      balance_cents: 19000
  math: >-
    The sharpest form of "negative total" under a limitation: a wallet holding 25_000¢ against an
    11_000¢ invoice that STILL leaves 5_000¢ owed in cash, because the limitation and not the
    balance decides what credits may touch. Fees 11_000¢ (5_000 subscription + 6_000 charge,
    60 units from 10/30/20 × 1.00).
    The rule is asleep at creation (no subscription, so ongoing_balance_cents = 5_000 and 50
    credits > 20). On 10 March the pool is the 6_000¢ charge bucket, which the wallet may pay, so
    the threshold wallet absorbs it all (allocate_ongoing_usage_by_wallets_service.rb:48-51):
    ongoing_balance_cents = 5_000 − 6_000 = −1_000, −10 credits ≤ 20, and the rule fires once for a
    flat 200 granted credits — `compute_granted_credits` returns the rule's amount verbatim for a
    non-target rule (recurring_transaction_rule.rb:104-111), so nothing scales it to the 1_000¢
    actually missing. Balance 25_000; the cascade refresh sees 19_000 (190 credits > 20) and stops.
    At billing the charge bucket draws min(6000, 25000, 11000) = 6_000
    (allocate_prepaid_credits_by_wallets_service.rb:53) and the subscription bucket is skipped
    outright by `applicable_fee?` (:105-121). So the total does not merely fail to go negative — it
    does not even reach zero: 5_000¢ of subscription fee is cash while 19_000¢ of credit sits
    unusable in the same wallet, and payment_status is pending.
    Named alternatives, none of which happens: (a) total −14_000 if the balance were drained
    against the whole invoice, (b) total 0 with the limitation ignored, since 25_000 ≥ 11_000, and
    the wallet at 14_000, (c) a `credit` invoice or credit note for the 19_000 surplus — invoices
    stays 1, (d) the wallet emptied to 0.

- id: b06/threshold-rule/fee-types/ongoing-balance
  block: B6
  axes: {source: threshold-rule, limitation: fee-types, application: ongoing-balance}
  dimensions: {interval: monthly, billing_time: calendar, allowed_fee_types: subscription, read_at: mid-period}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    metrics: [{code: b06_thr_fo_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_thr_fo, interval: monthly, amount_cents: 5000}
    charges: [{billable_metric_code: b06_thr_fo_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b06_thr_fo_cust, currency: EUR}
    subscription: {external_id: golden_b06_thr_fo_sub, billing_time: calendar}
    wallets:
      - name: subscription only, never armed
        code: b06_thr_fo_w
        rate_amount: "1"
        currency: EUR
        granted_credits: "50"
        applies_to: {fee_types: [subscription]}
        recurring_transaction_rules:
          - {trigger: threshold, method: fixed, threshold_credits: "20", granted_credits: "40"}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_thr_fo_sum, properties: {amount: 10}}
        - {code: b06_thr_fo_sum, properties: {amount: 30}}
        - {code: b06_thr_fo_sum, properties: {amount: 20}}
    - {at: "2024-03-10T00:00:00Z", do: perform_wallet_refresh}
  expect:
    invoices: 0
    wallet:
      code: b06_thr_fo_w
      balance_cents: 5000
      ongoing_usage_balance_cents: 0
      ongoing_balance_cents: 5000
  math: >-
    The row where the fee-type limitation DISARMS the threshold rule. A threshold rule has exactly
    one trigger — the ongoing-balance recompute (update_ongoing_service.rb:26) — and the ongoing
    balance only moves if the wallet is allowed to absorb the usage. This wallet may pay only
    `subscription` fees, and the mid-period pool is built from `current_usage_fees`
    (refresh_wallets_service.rb:52-54), i.e. Invoices::CustomerUsageService output, which is CHARGE
    fees only: a subscription fee is not usage and never appears there.
    So `applicable_fee?` (allocate_ongoing_usage_by_wallets_service.rb:126-137) is asked whether a
    wallet with types=["subscription"] matches a fee_key whose fee_type is "charge": no type match,
    no target match, and `unrestricted_wallet` is false because types is non-empty. `applicable` is
    EMPTY for the only key in the pool, the loop at :45-61 allocates nothing, and the 6_000¢ of
    charge usage (60 units from 10/30/20 × 1.00) is simply dropped rather than forced onto some
    wallet. ongoing_usage_balance_cents is 0 and ongoing_balance_cents = 5_000 − 0 = 5_000
    (refresh_ongoing_usage_service.rb:63).
    credits_ongoing_balance is therefore 50, and 50 > 20, so threshold_top_up_service.rb:20 returns
    and the rule never fires: balance stays at its initial 50 granted credits. The wrong answer,
    and the one a reader expects, is an implementation that ignores allowed_fee_types on the ongoing
    path — ongoing_usage 6_000, ongoing_balance −1_000, the rule fires for 40 granted credits and
    balance ends 9_000. Name all three: balance 5_000 vs 9_000, ongoing_usage 0 vs 6_000,
    ongoing_balance 5_000 vs −1_000.
    The 6_000¢ of charge usage is the fee this wallet may not pay for and it will be owed in cash at
    period end; the wallet reserves nothing against it, which is why `depleted_ongoing_balance`
    never fires here. invoices is 0: the top-up is granted so it raises no `credit` invoice, and the
    timeline stops before billing.

- id: b06/threshold-rule/billable-metrics/full-cover
  block: B6
  axes: {source: threshold-rule, limitation: billable-metrics, application: full-cover}
  dimensions: {interval: monthly, billing_time: calendar, threshold_credits: 20}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    metrics:
