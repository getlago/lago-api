      code: b06_twc_ps_nt_a
      balance_cents: 8200
  math: >-
    10_000¢ of settled purchased credits against a 3_000¢ invoice whose only reachable fee is capped
    at 1_800¢ — the strongest form of "could the total go negative", and it does not. Draws are
    bounded by `remaining_invoice_amount` (allocate_prepaid_credits_by_wallets_service.rb:53,
    decremented at :57) and by the per-fee cap at :77-81, so 1_800¢ leaves the wallet, 8_200¢ stays,
    and 1_200¢ is still owed in cash. No credit note and no second `credit` invoice appear for the
    surplus: invoices is 2, the top-up and the period invoice.
    Fees 5_000¢: 30 units → 3_000¢ tagged b06_twc_ps_nt_a (10/15/5: sum 30 ≠ max 15 ≠ latest 5) and
