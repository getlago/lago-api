  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_twc_tm_nt, properties: {amount: 10, target_wallet_code: b06_twc_tm_nt_a}}
        - {code: b06_twc_tm_nt, properties: {amount: 15, target_wallet_code: b06_twc_tm_nt_a}}
        - {code: b06_twc_tm_nt, properties: {amount: 5, target_wallet_code: b06_twc_tm_nt_a}}
        - {code: b06_twc_tm_nt, properties: {amount: 12, target_wallet_code: b06_twc_tm_nt_b}}
        - {code: b06_twc_tm_nt, properties: {amount: 8, target_wallet_code: b06_twc_tm_nt_b}}
    - {at: "2024-03-10T00:00:00Z", do: perform_wallet_refresh}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      fees_count: 3
      fees_amount_cents: 5000
      coupons_amount_cents: 2000
      sub_total_excluding_taxes_amount_cents: 3000
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 1800
      prepaid_granted_credit_amount_cents: 1800
      total_amount_cents: 1200
    wallet:
      code: b06_twc_tm_nt_a
      balance_cents: 8200
  math: >-
    A target rule that overshoots the invoice, and the total still does not go negative. At the 10 March
    refresh wallet a sees only its own tagged 3_000¢ (allocate_ongoing_usage_by_wallets_service.rb:
    118-130), so credits_ongoing_balance = −30 ≤ threshold 0 and the rule asks for 70 − (−30) = 100
    credits = 10_000¢, granted, no invoice (recurring_transaction_rule.rb:138-150;
    create_from_params_service.rb:145-173) — invoices stays 1. The re-refresh reads 70 credits, not
    below the target, so there is exactly one top-up. Coupons do not enter the ongoing pool, which is
    `fee.amount_cents + fee.taxes_amount_cents` (:88).
    Fees 5_000¢: 3_000¢ tagged b06_twc_tm_nt_a (10/15/5: sum 30 ≠ max 15 ≠ latest 5) and 2_000¢ tagged
    b06_twc_tm_nt_b. The fixed_amount coupon spreads BY WEIGHT (fee.rb:232-236 through
    credits/applied_coupon_service.rb:35-37): 2_000 × 3_000/5_000 = 1_200 onto the a fee and 800 onto
    the b fee, so the per-fee caps are `sub_total_excluding_taxes + taxes_precise −
    precise_credit_notes` = 1_800 and 1_200 (allocate_prepaid_credits_by_wallets_service.rb:77-79).
    Wallet b holds no credits, so `with_positive_balance` (wallet.rb:65) drops it from the allocator and
    its 1_200¢ is unpayable by anyone; wallet a is refused it by the tag (:109-114) while holding
    8_200¢. Draws are bounded by `remaining_invoice_amount` (:53, :57), so prepaid is 1_800 and the
    total clamps at 1_200 instead of −7_000, with no credit note and no `credit` invoice for the
    surplus.
    Named alternatives: credits before the coupon would cap the a fee at 3_000 → prepaid 3_000, total 0,
    balance 7_000; a tag-blind allocator would size the rule against 5_000¢ of usage (120 credits =
    12_000¢) and pay both caps → total 0 and balance 9_000; a rule measuring the gap against
    `balance_cents` would ask for 70 credits = 7_000¢ → prepaid still 1_800 but balance 5_200. The
    post-billing refresh leaves 82 credits above the target, so nothing re-arms.

- id: b06/target-method/target-wallet-code/ongoing-balance
  block: B6
  axes: {source: target-method, limitation: target-wallet-code, application: ongoing-balance}
  dimensions: {interval: monthly, billing_time: calendar, rate_amount: 1, read_at: mid-period, target_ongoing_balance: 40, grants_target_top_up: true}
  provenance: coverage-gap
  runners: [rspec]
  premium: true
  setup:
    organization: {premium_integrations: [events_targeting_wallets]}
    metrics: [{code: b06_twc_tm_ob, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_twc_tm_ob, interval: monthly, amount_cents: 0}
    charges:
      - billable_metric_code: b06_twc_tm_ob
        charge_model: standard
        properties: {amount: "1"}
        accepts_target_wallet: true
    customer: {external_id: golden_b06_twc_tm_ob_cust, currency: EUR}
    subscription: {external_id: golden_b06_twc_tm_ob_sub, billing_time: calendar}
    wallets:
      - name: targeted target top-up
        code: b06_twc_tm_ob_a
        rate_amount: "1"
        currency: EUR
        priority: 1
        recurring_transaction_rules:
          - {trigger: threshold, threshold_credits: "0", method: target, target_ongoing_balance: "40", grants_target_top_up: true}
      - {name: other target, code: b06_twc_tm_ob_b, rate_amount: "1", currency: EUR, granted_credits: "100", priority: 20}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_twc_tm_ob, properties: {amount: 10, target_wallet_code: b06_twc_tm_ob_a}}
        - {code: b06_twc_tm_ob, properties: {amount: 30, target_wallet_code: b06_twc_tm_ob_a}}
        - {code: b06_twc_tm_ob, properties: {amount: 20, target_wallet_code: b06_twc_tm_ob_a}}
        - {code: b06_twc_tm_ob, properties: {amount: 25, target_wallet_code: b06_twc_tm_ob_b}}
        - {code: b06_twc_tm_ob, properties: {amount: 15, target_wallet_code: b06_twc_tm_ob_b}}
    - {at: "2024-03-10T00:00:00Z", do: perform_wallet_refresh}
    - {at: "2024-03-10T01:00:00Z", do: fetch_current_usage}
  expect:
    invoices: 0
    wallet:
      code: b06_twc_tm_ob_a
      balance_cents: 10000
      ongoing_usage_balance_cents: 6000
      ongoing_balance_cents: 4000
    usage:
      amount_cents: 10000
      total_amount_cents: 10000
  math: >-
    The mid-period read where the tag sizes the top-up and NOTHING else can show it. No invoice exists
    (invoices 0) and no billing code runs: Clock::RefreshWalletsOngoingBalanceJob (premium-gated at
    refresh_wallets_ongoing_balance_job.rb:8) → Customers::RefreshWalletsService →
    AllocateOngoingUsageByWalletsService → RefreshOngoingUsageService → UpdateOngoingService, whose
    after_commit is the only caller of Wallets::ThresholdTopUpService (update_ongoing_service.rb:26).
    Current-usage fees keep their grouping (fees/charge_service.rb:493-499), so the pool is 6_000¢
    tagged b06_twc_tm_ob_a (10/30/20: sum 60 ≠ max 30 ≠ latest 20) and 4_000¢ tagged b06_twc_tm_ob_b,
    and `applicable_fee?` (:127-130) gives each key exactly one wallet. Wallet a therefore measures its
    gap against its OWN bucket: ongoing_balance = 0 − 6_000 = −6_000
    (refresh_ongoing_usage_service.rb:63), credits_ongoing_balance −60 ≤ 0, and the target rule asks for
    40 − (−60) = 100 credits = 10_000¢ granted (recurring_transaction_rule.rb:138-150 via
    compute_granted_credits :104-112). Balance::IncreaseService re-enqueues the refresh
    (increase_service.rb:36) and the second pass reads 40 credits, not below the target, so it
    terminates after one top-up.
    The trap this row has to dodge: a target rule always lands the ongoing balance ON the target, so
    ongoing_balance_cents is 4_000 whether or not the tag is honoured. Tag-blind the wallet would absorb
    all 10_000¢, ask for 140 credits and end at 14_000¢ with ongoing_usage 10_000 — identical
    ongoing_balance. The separating figures are therefore balance_cents 10_000 vs 14_000 and
    ongoing_usage_balance_cents 6_000 vs 10_000; a rule measuring the gap against `balance_cents` would
    instead ask for 40 credits and report balance 4_000 with ongoing_balance −2_000. The current-usage
    payload is asserted alongside because the customer still owes the whole 10_000¢: the ongoing figures
    are a projection that never debits the wallet, and no WalletTransactionConsumption rows exist on
    this path.

- id: b06/hns2/interval-rule/none/full-cover
  block: B6
  axes: {source: interval-rule, limitation: none, application: full-cover}
  dimensions: {interval: monthly, billing_time: calendar, rate_amount: 1, rule_interval: monthly, top_up: granted-60}
  provenance: coverage-gap
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  setup:
    metrics: [{code: b06_hns2_int_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_hns2_int, interval: monthly, amount_cents: 0}
    charges: [{billable_metric_code: b06_hns2_int_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b06_hns2_int_cust, currency: EUR}
    subscription: {external_id: golden_b06_hns2_int_sub, billing_time: calendar}
    wallets:
      - name: interval refilled
        code: b06_hns2_int_w
        rate_amount: "1"
        currency: EUR
        recurring_transaction_rules:
          - {trigger: interval, interval: monthly, method: fixed, granted_credits: "60"}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_hns2_int_sum, properties: {amount: 10}}
        - {code: b06_hns2_int_sum, properties: {amount: 30}}
        - {code: b06_hns2_int_sum, properties: {amount: 20}}
    - {at: "2024-04-01T00:30:00Z", do: perform_interval_wallet_top_ups}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      fees_amount_cents: 6000
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 6000
      prepaid_granted_credit_amount_cents: 6000
      total_amount_cents: 0
      payment_status: succeeded
    wallet:
      code: b06_hns2_int_w
      balance_cents: 0
  math: >-
    An `interval` rule is fired by ONE caller and no other:
    Clock::CreateIntervalWalletTransactionsJob → Wallets::CreateIntervalWalletTransactionsService
    (create_interval_wallet_transactions_job.rb:8). `perform_wallet_refresh` cannot stand in for it —
    that verb runs Clock::RefreshWalletsOngoingBalanceJob, whose only top-up path is
    Wallets::ThresholdTopUpService and therefore `trigger: threshold` alone
    (balance/update_ongoing_service.rb:26). `top_up_wallet` cannot either: POST
    /api/v1/wallet_transactions does not permit `source`
    (wallet_transactions_controller.rb:125-135), so it always writes `source: :manual` and never the
    `:interval` this row is about.
    The wallet is created empty at setup time, i.e. at 2024-03-01T00:00:00Z, which is what makes the
    rule reachable at all: the service excludes wallets created today outright
    (`DATE(wallets.created_at) != DATE(:today)`), and the monthly anniversary is
    `DATE_PART('day', COALESCE(rule.started_at, wallets.created_at)) = DATE_PART('day', :today)` — day 1
    both sides. So the rule is silent on 1 March and due on 1 April.
    Three events 10/30/20 so the sum 60 is distinguishable from max 30 and latest 20: March's usage is
    60 units x 1.00 = 6_000¢. On 1 April at 00:30 the interval rule grants a FLAT 60 credits
    (recurring_transaction_rule.rb:104-111 returns `granted_credits` verbatim for a non-target rule),
    which is an inbound GRANT and so raises no `credit` invoice and needs no settlement — hence
    invoices stays 1. At 01:00 billing draws min(6_000, 6_000, 6_000) = 6_000¢
    (allocate_prepaid_credits_by_wallets_service.rb:53), the total clamps to 0, payment_status is
    succeeded and the wallet ends at exactly 0.
    THE COUNTERFACTUAL IS AN UNTOUCHED WALLET: prepaid_credit 0, total 6_000¢, balance 0 — which is
    what this row produced for the whole of its timeline before the verb existed, and which is
    indistinguishable from a row whose rule was never configured. prepaid_granted_credit_amount_cents is
    asserted beside prepaid_credit_amount_cents because the pool matters: an interval rule's
    `paid_credits` leg would have shown up in the purchased column and would have needed a settled
    `credit` invoice first (F29 explains why only the non-nil side is named).

- id: b06/interval-rule/none/partial-cover
  block: B6
  axes: {source: interval-rule, limitation: none, application: partial-cover}
  dimensions: {interval: monthly, billing_time: calendar, rate_amount: 1, rule_interval: monthly, top_up: granted-40}
  provenance: coverage-gap
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  setup:
    metrics: [{code: b06_itv_npc_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_itv_npc, interval: monthly, amount_cents: 0}
    charges: [{billable_metric_code: b06_itv_npc_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b06_itv_npc_cust, currency: EUR}
    subscription: {external_id: golden_b06_itv_npc_sub, billing_time: calendar}
    wallets:
      - name: interval refilled, too little
        code: b06_itv_npc_w
        rate_amount: "1"
        currency: EUR
        recurring_transaction_rules:
          - {trigger: interval, interval: monthly, method: fixed, granted_credits: "40"}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_itv_npc_sum, properties: {amount: 10}}
        - {code: b06_itv_npc_sum, properties: {amount: 30}}
        - {code: b06_itv_npc_sum, properties: {amount: 20}}
    - {at: "2024-04-01T00:30:00Z", do: perform_interval_wallet_top_ups}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      fees_amount_cents: 6000
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 4000
      prepaid_granted_credit_amount_cents: 4000
      total_amount_cents: 2000
      payment_status: pending
    wallet:
      code: b06_itv_npc_w
      balance_cents: 0
  math: >-
    The interval sibling of b06/threshold-rule/none/partial-cover, and it under-covers for a
    completely different reason. A threshold rule under-covers because it fires at the wrong TIME
    (the balance was already spent); an interval rule fires exactly on schedule and under-covers
    because its AMOUNT is flat. `compute_granted_credits` returns `granted_credits` verbatim for a
    non-target rule (recurring_transaction_rule.rb:104-111), so nothing scales the 40 credits to
    the 60 the invoice actually needs, and no re-arming loop exists: the interval path has no
    cascade at all, unlike Wallets::Balance::IncreaseService re-enqueueing the refresh for a
    threshold rule (increase_service.rb:36).
    The wallet is created EMPTY at setup time, i.e. inside the travel_to of the first timeline step
    (2024-03-01T00:00:00Z), which is what makes the rule reachable: the service drops wallets born
    today outright (`DATE(wallets.created_at AT TIME ZONE ...) != DATE(:today ...)`,
    create_interval_wallet_transactions_service.rb:74) and matches the monthly anniversary on
    `DATE_PART('day', COALESCE(rule.started_at, wallets.created_at)) = DATE_PART('day', :today)`
    (:120-130) — day 1 on both sides. Silent on 1 March, due on 1 April.
    Three events 10/30/20 so the sum 60 is distinguishable from max 30 and latest 20: 60 units ×
    1.00 = 6_000¢ of fees. At 00:30 on 1 April the rule grants a flat 40 credits = 4_000¢ — an
    inbound GRANT, settled on creation, raising no `credit` invoice, hence invoices stays 1. At
    01:00 billing draws min(6_000, 4_000, 6_000) = 4_000
    (allocate_prepaid_credits_by_wallets_service.rb:53), leaving 2_000¢ owed in cash and
    payment_status pending rather than succeeded, and the wallet at exactly 0.
    Name the counterfactuals: a hollowed verb (or a `perform_wallet_refresh` in its place, which
    reaches `trigger: threshold` only) gives prepaid 0 and total 6_000; a rule sized to the deficit
    instead of the flat 40 gives prepaid 6_000, total 0 and balance 0 — the same balance, which is
    why prepaid_credit_amount_cents and total_amount_cents are the load-bearing assertions here and
    the balance is only the third witness.

- id: b06/interval-rule/none/multi-wallet-priority
  block: B6
  axes: {source: interval-rule, limitation: none, application: multi-wallet-priority}
  dimensions: {interval: monthly, billing_time: calendar, priorities: "1 interval / 20 granted", top_up: granted-30}
  provenance: coverage-gap
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  setup:
    metrics: [{code: b06_itv_nmp_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_itv_nmp, interval: monthly, amount_cents: 0}
    charges: [{billable_metric_code: b06_itv_nmp_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b06_itv_nmp_cust, currency: EUR}
    subscription: {external_id: golden_b06_itv_nmp_sub, billing_time: calendar}
    wallets:
      - {name: rich but second, code: b06_itv_nmp_b, rate_amount: "1", currency: EUR, granted_credits: "50", priority: 20}
      - name: interval refilled, first
        code: b06_itv_nmp_a
        rate_amount: "1"
        currency: EUR
        priority: 1
        recurring_transaction_rules:
          - {trigger: interval, interval: monthly, method: fixed, granted_credits: "30"}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_itv_nmp_sum, properties: {amount: 10}}
        - {code: b06_itv_nmp_sum, properties: {amount: 30}}
        - {code: b06_itv_nmp_sum, properties: {amount: 20}}
    - {at: "2024-04-01T00:30:00Z", do: perform_interval_wallet_top_ups}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      fees_amount_cents: 6000
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 6000
      prepaid_granted_credit_amount_cents: 6000
      total_amount_cents: 0
      payment_status: succeeded
    wallet:
      code: b06_itv_nmp_b
      balance_cents: 2000
  math: >-
    Two wallets declared in the WRONG order on purpose: the 50-credit one (priority 20) first in the
    YAML, the interval-refilled one (priority 1, created empty) second. Consumption follows
    `Wallet.in_application_order` — priority ASC then created_at (wallet.rb:69-71) — so the
    interval wallet is drawn first even though it was created second and is the poorer of the two.
    Both pools are purely GRANTED, so the granted/purchased breakdown cannot separate them
    (applied_prepaid_credits_service.rb:83-92 would report prepaid_granted 6_000 either way) and the
    invoice total is 0 either way. The one number that moves is wallet b's ending balance, and it is
    the whole assertion.
    60 units (10/30/20: sum 60 ≠ max 30 ≠ latest 20) × 1.00 = 6_000¢ of fees. At 00:30 on 1 April
    the interval rule grants wallet a a flat 30 credits = 3_000¢ (a granted inbound, settled on
    creation, no `credit` invoice, so invoices stays 1); the anniversary matches because both
    wallets were created on 1 March inside the first step's travel_to and
    create_interval_wallet_transactions_service.rb:74 only excludes wallets born TODAY.
    At billing there is one bucket, [charge, bm_id] = 6_000¢, and the loop is wallet-outer /
    bucket-inner (allocate_prepaid_credits_by_wallets_service.rb:34-62). Wallet a draws
    min(6_000, 3_000, 6_000) = 3_000 and empties, leaving the bucket at 3_000 and
    remaining_invoice_amount at 3_000. Wallet b then draws min(3_000, 5_000, 3_000) = 3_000 and ends
    at 5_000 − 3_000 = 2_000¢.
    Creation order instead of priority would drain b FIRST: min(6_000, 5_000, 6_000) = 5_000, b ends
    at 0 and a covers the last 1_000, ending at 2_000. And with the interval verb hollowed, a has a
    0 balance so `with_positive_balance` (wallet.rb:65) drops it entirely, b pays 5_000, ends at 0
    and 1_000 stays cash. Name all three: b at 2_000 (correct) versus 0 under either wrong answer,
    with total 0 versus 0 versus 1_000.

