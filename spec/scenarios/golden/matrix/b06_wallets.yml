      - {billable_metric_code: b06_thr_bm_oth, charge_model: standard, properties: {amount: "1"}}
    customer: {external_id: golden_b06_thr_bm_cust, currency: EUR}
    subscription: {external_id: golden_b06_thr_bm_sub, billing_time: calendar}
    wallets:
      - name: purchased pool, one metric
        code: b06_thr_bm_paid
        rate_amount: "1"
        currency: EUR
        paid_credits: "60"
        priority: 20
        applies_to: {billable_metric_codes: [b06_thr_bm_cov]}
      - name: auto refilled pool, one metric
        code: b06_thr_bm_thr
        rate_amount: "1"
        currency: EUR
        granted_credits: "20"
        priority: 1
        applies_to: {billable_metric_codes: [b06_thr_bm_cov]}
        recurring_transaction_rules:
          - {trigger: threshold, method: fixed, threshold_credits: "10", granted_credits: "60"}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-02T00:00:00Z", do: pay_invoice, invoice_type: credit}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_thr_bm_cov, properties: {amount: 10}}
        - {code: b06_thr_bm_cov, properties: {amount: 30}}
        - {code: b06_thr_bm_cov, properties: {amount: 20}}
        - {code: b06_thr_bm_oth, properties: {amount: 5}}
        - {code: b06_thr_bm_oth, properties: {amount: 15}}
        - {code: b06_thr_bm_oth, properties: {amount: 10}}
    - {at: "2024-03-10T00:00:00Z", do: perform_wallet_refresh}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      select: {invoice_type: subscription}
      fees_amount_cents: 9000
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 6000
      prepaid_granted_credit_amount_cents: 6000
      total_amount_cents: 3000
      fees:
        - {fee_type: subscription, amount_cents: 0}
        - {fee_type: charge, item_code: b06_thr_bm_cov, amount_cents: 6000, units: "60"}
        - {fee_type: charge, item_code: b06_thr_bm_oth, amount_cents: 3000, units: "30"}
    wallet:
      code: b06_thr_bm_thr
      balance_cents: 2000
  math: >-
    Two wallets limited to the SAME metric, declared in the wrong order so only
    `Wallet.in_application_order` (priority ASC then created_at, wallet.rb:69-71) yields the
    asserted numbers. Fees 9_000¢: 60 units (10/30/20) × 1.00 on `cov`, 30 units (5/15/10) × 1.00
    on `oth`.
    The purchased wallet's 60 paid credits stay pending until its `credit` invoice is paid on
    2 March (hence `manual_payments`), giving it 6_000¢; the threshold wallet holds 20 granted
    credits = 2_000¢ and a rule granting 60 more below 10 credits.
    Mid-period the pool has [charge, cov_id] = 6_000 and [charge, oth_id] = 3_000. Neither wallet is
    applicable to `oth` (targets is [["charge", cov_id]], types empty, so no match and
    `unrestricted_wallet` false — allocate_ongoing_usage_by_wallets_service.rb:126-137), so those
    3_000¢ are dropped. For `cov` both wallets are applicable, and the threshold wallet is both
    first and allowed to absorb the whole remaining amount rather than only its balance's worth
    (:48-51, `balance: threshold ? 0` at :74): it takes 6_000, the purchased wallet takes 0
    (`break if remaining <= 0`, :46). Its ongoing balance is 2_000 − 6_000 = −4_000, −40 credits
    ≤ 10, so the rule fires once for a flat 60 granted credits → 8_000¢, and the cascade refresh
    sees 2_000 (20 credits > 10) and stops.
    At billing `cov` (6_000) is drawn first. Wallet 1 (priority 1, 8_000¢) takes
    min(6000, 8000, 9000) = 6_000, zeroing that bucket; `oth` is inapplicable to it. Wallet 2 then
    finds `cov` at 0 (`next if remaining_amount <= 0`, :44) and `oth` inapplicable, so it
    contributes nothing and is dropped (`next if total_amount_cents <= 0`, :64). Prepaid 6_000,
    total 3_000 — the whole `oth` fee, the fee neither wallet may pay for, owed in cash. Balances
    end 2_000 (threshold, consumed 6_000) and 6_000 (purchased, consumed 0).
    Both wallets are pinned without an `expect.wallets` list because one pool is purely granted and
    the other purely purchased, so prepaid_granted 6_000 with prepaid_credit 6_000 means the
    purchased wallet contributed nothing and still holds 6_000
    (applied_prepaid_credits_service.rb:83-92). Creation order instead of priority would report
    prepaid_granted nil and prepaid_purchased 6_000, with wallet[b06_thr_bm_thr] at 8_000 and
    consumed 0 — every asserted number differs.

- id: b06/threshold-rule/billable-metrics/rounding
  block: B6
  axes: {source: threshold-rule, limitation: billable-metrics, application: rounding}
  dimensions: {interval: monthly, billing_time: calendar, rate_amount: "0.1115", threshold_credits: 5}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    metrics:
      - {code: b06_thr_br_cov, aggregation_type: sum_agg, field_name: amount}
      - {code: b06_thr_br_oth, aggregation_type: sum_agg, field_name: amount}
    plan: {code: golden_b06_thr_br, interval: monthly, amount_cents: 0}
    charges:
      - {billable_metric_code: b06_thr_br_cov, charge_model: standard, properties: {amount: "0.1"}}
      - {billable_metric_code: b06_thr_br_oth, charge_model: standard, properties: {amount: "0.1"}}
    customer: {external_id: golden_b06_thr_br_cust, currency: EUR}
    subscription: {external_id: golden_b06_thr_br_sub, billing_time: calendar}
    wallets:
      - name: awkward rate, one metric
        code: b06_thr_br_w
        rate_amount: "0.1115"
        currency: EUR
        granted_credits: "10"
        applies_to: {billable_metric_codes: [b06_thr_br_cov]}
        recurring_transaction_rules:
          - {trigger: threshold, method: fixed, threshold_credits: "5", granted_credits: "70"}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_thr_br_cov, properties: {amount: 10}}
        - {code: b06_thr_br_cov, properties: {amount: 30}}
        - {code: b06_thr_br_cov, properties: {amount: 20}}
        - {code: b06_thr_br_oth, properties: {amount: 5}}
        - {code: b06_thr_br_oth, properties: {amount: 15}}
        - {code: b06_thr_br_oth, properties: {amount: 10}}
    - {at: "2024-03-10T00:00:00Z", do: perform_wallet_refresh}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      fees_amount_cents: 900
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 600
      prepaid_granted_credit_amount_cents: 600
      total_amount_cents: 300
      fees:
        - {fee_type: subscription, amount_cents: 0}
        - {fee_type: charge, item_code: b06_thr_br_cov, amount_cents: 600, units: "60"}
        - {fee_type: charge, item_code: b06_thr_br_oth, amount_cents: 300, units: "30"}
    wallet:
      code: b06_thr_br_w
      balance_cents: 293
  math: >-
    Two half-cent conversions on a metric-limited wallet. `(credit_amount × rate_amount)
    .round(currency.exponent) × 100` (wallet_credit.rb:26-27) is HALF-UP on the currency amount: at
    rate 0.1115 the initial grant is 10 × 0.1115 = 1.115 → 1.12 → 112¢ and the threshold top-up is
    70 × 0.1115 = 7.805 → 7.81 → 781¢, so the balance after the top-up is 112 + 781 = 893¢.
    Truncating gives 111 + 780 = 891¢ — name both.
    Fees 900¢: 60 units (10/30/20, so sum 60 ≠ max 30 ≠ latest 20) × 0.10 = 600¢ on `cov` and 30
    units (5/15/10) × 0.10 = 300¢ on `oth`.
    The rule is asleep at creation: no subscription, so ongoing_balance_cents = 112 and
    credits_ongoing_balance = 1.12 ÷ 0.1115 = 10.04484 > 5 (threshold_top_up_service.rb:20). On
    10 March the `oth` key is dropped (targets is [["charge", cov_id]], so no match and
    `unrestricted_wallet` false — allocate_ongoing_usage_by_wallets_service.rb:126-137) and the
    threshold wallet absorbs all 600¢ of `cov` (:48-51): ongoing_balance_cents = 112 − 600 = −488,
    −43.76682 credits ≤ 5, one top-up of 70 granted credits. The cascade refresh sees 893 − 600 =
    293, i.e. 26.27803 credits > 5, and stops.
    At billing `cov` (600) is drawn first and takes min(600, 893, 900) = 600
    (allocate_prepaid_credits_by_wallets_service.rb:53); `oth` is skipped by the same target
    mismatch (:105-121), so 300¢ stays cash — the fee this wallet may not pay for. Balance ends
    893 − 600 = 293¢ against the truncating implementation's 291¢, the one asserted number that
    separates them, since prepaid, total and the per-fee split are identical under both.

- id: b06/threshold-rule/billable-metrics/negative-total
  block: B6
  axes: {source: threshold-rule, limitation: billable-metrics, application: negative-total}
  dimensions: {interval: monthly, billing_time: calendar, top_up: granted-200}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    metrics:
      - {code: b06_thr_bn_cov, aggregation_type: sum_agg, field_name: amount}
      - {code: b06_thr_bn_oth, aggregation_type: sum_agg, field_name: amount}
    plan: {code: golden_b06_thr_bn, interval: monthly, amount_cents: 0}
    charges:
      - {billable_metric_code: b06_thr_bn_cov, charge_model: standard, properties: {amount: "1"}}
      - {billable_metric_code: b06_thr_bn_oth, charge_model: standard, properties: {amount: "1"}}
    customer: {external_id: golden_b06_thr_bn_cust, currency: EUR}
    subscription: {external_id: golden_b06_thr_bn_sub, billing_time: calendar}
    wallets:
      - name: over refilled, one metric
        code: b06_thr_bn_w
        rate_amount: "1"
        currency: EUR
        granted_credits: "50"
        applies_to: {billable_metric_codes: [b06_thr_bn_cov]}
        recurring_transaction_rules:
          - {trigger: threshold, method: fixed, threshold_credits: "20", granted_credits: "200"}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_thr_bn_cov, properties: {amount: 10}}
        - {code: b06_thr_bn_cov, properties: {amount: 30}}
        - {code: b06_thr_bn_cov, properties: {amount: 20}}
        - {code: b06_thr_bn_oth, properties: {amount: 5}}
        - {code: b06_thr_bn_oth, properties: {amount: 15}}
        - {code: b06_thr_bn_oth, properties: {amount: 10}}
    - {at: "2024-03-10T00:00:00Z", do: perform_wallet_refresh}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      fees_amount_cents: 9000
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 6000
      prepaid_granted_credit_amount_cents: 6000
      total_amount_cents: 3000
      payment_status: pending
      fees:
        - {fee_type: subscription, amount_cents: 0}
        - {fee_type: charge, item_code: b06_thr_bn_cov, amount_cents: 6000, units: "60"}
        - {fee_type: charge, item_code: b06_thr_bn_oth, amount_cents: 3000, units: "30"}
    wallet:
      code: b06_thr_bn_w
      balance_cents: 19000
  math: >-
    A wallet holding 25_000¢ against a 9_000¢ invoice that still leaves 3_000¢ owed in cash: the
    METRIC limitation, not the balance, decides what credits may touch, so no amount of over-refill
    can drive the total to zero, let alone negative. Fees 9_000¢ — 60 units (10/30/20) × 1.00 on
    `cov`, 30 units (5/15/10) × 1.00 on `oth`.
    The rule is asleep at creation (no subscription, ongoing_balance_cents 5_000, 50 credits > 20).
    On 10 March the `oth` key is dropped as inapplicable
    (allocate_ongoing_usage_by_wallets_service.rb:126-137) and the threshold wallet absorbs all
    6_000¢ of `cov` (:48-51): ongoing_balance_cents = 5_000 − 6_000 = −1_000, −10 credits ≤ 20, and
    the rule fires once for a flat 200 granted credits — `compute_granted_credits` returns the
    rule's amount verbatim for a non-target rule (recurring_transaction_rule.rb:104-111), so nothing
    scales it to the 1_000¢ actually missing. Balance 25_000; the cascade refresh sees 19_000 (190
    credits > 20) and stops.
    At billing the `cov` bucket draws min(6000, 25000, 9000) = 6_000
    (allocate_prepaid_credits_by_wallets_service.rb:53) and `oth` is skipped by the target mismatch
    (:105-121). Total 3_000¢ of cash while 19_000¢ of credit sits unusable in the same wallet.
    Named alternatives, none of which happens: (a) total −16_000 if the balance were drained against
    the whole invoice, (b) total 0 with the limitation ignored, since 25_000 ≥ 9_000, leaving the
    wallet at 16_000, (c) a `credit` invoice or credit note for the 19_000 surplus — invoices stays
    1 because the top-up is granted and raises no invoice, (d) the wallet emptied to 0.

- id: b06/threshold-rule/billable-metrics/ongoing-balance
  block: B6
  axes: {source: threshold-rule, limitation: billable-metrics, application: ongoing-balance}
  dimensions: {interval: monthly, billing_time: calendar, read_at: mid-period, threshold_credits: 30}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    metrics:
      - {code: b06_thr_bo_cov, aggregation_type: sum_agg, field_name: amount}
      - {code: b06_thr_bo_oth, aggregation_type: sum_agg, field_name: amount}
    plan: {code: golden_b06_thr_bo, interval: monthly, amount_cents: 0}
    charges:
      - {billable_metric_code: b06_thr_bo_cov, charge_model: standard, properties: {amount: "1"}}
      - {billable_metric_code: b06_thr_bo_oth, charge_model: standard, properties: {amount: "1"}}
    customer: {external_id: golden_b06_thr_bo_cust, currency: EUR}
    subscription: {external_id: golden_b06_thr_bo_sub, billing_time: calendar}
    wallets:
      - name: small metric only, mid period refill
        code: b06_thr_bo_w
        rate_amount: "1"
        currency: EUR
        granted_credits: "50"
        applies_to: {billable_metric_codes: [b06_thr_bo_oth]}
        recurring_transaction_rules:
          - {trigger: threshold, method: fixed, threshold_credits: "30", granted_credits: "40"}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_thr_bo_cov, properties: {amount: 10}}
        - {code: b06_thr_bo_cov, properties: {amount: 30}}
        - {code: b06_thr_bo_cov, properties: {amount: 20}}
        - {code: b06_thr_bo_oth, properties: {amount: 5}}
        - {code: b06_thr_bo_oth, properties: {amount: 15}}
        - {code: b06_thr_bo_oth, properties: {amount: 10}}
    - {at: "2024-03-10T00:00:00Z", do: perform_wallet_refresh}
  expect:
    invoices: 0
    wallet:
      code: b06_thr_bo_w
      balance_cents: 9000
      ongoing_usage_balance_cents: 3000
      ongoing_balance_cents: 6000
  math: >-
    A mid-period read where the metric limitation PARTIALLY narrows what the wallet reserves against
    — the middle case between b06/threshold-rule/none/ongoing-balance (absorbs everything) and
    b06/threshold-rule/fee-types/ongoing-balance (absorbs nothing). The timeline stops at the
    refresh, so no invoice exists and invoices is 0; the path is
    Clock::RefreshWalletsOngoingBalanceJob (premium-gated at
    refresh_wallets_ongoing_balance_job.rb:8) → Customers::RefreshWalletsService →
    Wallets::Balance::AllocateOngoingUsageByWalletsService → RefreshOngoingUsageService →
    UpdateOngoingService, whose after_commit is the only caller of Wallets::ThresholdTopUpService
    (update_ongoing_service.rb:26).
    Unbilled usage is 9_000¢ in two keys: `cov` 60 units (10/30/20) × 1.00 = 6_000 and `oth` 30
    units (5/15/10) × 1.00 = 3_000. The wallet is limited to `oth`, so `applicable_fee?`
    (allocate_ongoing_usage_by_wallets_service.rb:126-137) leaves `applicable` empty for the `cov`
    key — dropped, not reassigned — while for `oth` the threshold wallet absorbs the whole 3_000
    (:48-51, `balance: threshold ? 0` at :74).
    First pass: ongoing_usage 3_000, ongoing_balance_cents = 5_000 − 3_000 = 2_000
    (refresh_ongoing_usage_service.rb:63), credits_ongoing_balance 20 ≤ 30 — note it takes only
    2_000¢ of reachable usage to arm a wallet still holding 5_000¢, because the threshold is read
    against the ONGOING balance and not the settled one. The rule fires for a flat 40 granted
    credits, and the state asserted is after Wallets::Balance::IncreaseService re-enqueues the
    refresh (increase_service.rb:36): balance 9_000, ongoing_usage 3_000 again, ongoing_balance
    6_000 — and 60 credits > 30, so exactly one top-up.
    The wrong implementation to name is the one that ignores wallet_targets on the ongoing path:
    ongoing_usage 9_000, ongoing_balance −4_000, the rule fires, balance 9_000, ongoing_balance 0,
    which is still ≤ 30 so it fires AGAIN — balance 13_000, ongoing_usage 9_000, ongoing_balance
    4_000. All three asserted numbers differ (9_000 vs 13_000, 3_000 vs 9_000, 6_000 vs 4_000).
    The 6_000¢ of `cov` usage is the fee this wallet may not pay for; it is excluded from the
    wallet's ongoing reservation and will be owed in cash at period end.

- id: b06/granted/target-wallet-code/full-cover
  block: B6
  axes: {source: granted, limitation: target-wallet-code, application: full-cover}
  dimensions: {interval: monthly, billing_time: calendar, rate_amount: 1, targeted_bucket: 6000, foreign_bucket: 4000}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    organization: {premium_integrations: [events_targeting_wallets]}
    metrics: [{code: b06_twc_g_fc, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_twc_g_fc, interval: monthly, amount_cents: 0}
    charges:
