        - {code: b06_stl_bmp_a, properties: {amount: 30}}
        - {code: b06_stl_bmp_a, properties: {amount: 20}}
        - {code: b06_stl_bmp_b, properties: {amount: 5}}
        - {code: b06_stl_bmp_b, properties: {amount: 10}}
        - {code: b06_stl_bmp_b, properties: {amount: 5}}
    - {at: "2024-03-06T00:00:00Z", do: top_up_wallet, params: {paid_credits: "100"}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 3
    invoice:
      select: {invoice_type: subscription}
      fees_amount_cents: 8000
      prepaid_credit_amount_cents: 2000
      prepaid_purchased_credit_amount_cents: 2000
      total_amount_cents: 6000
      fees:
        - {fee_type: subscription, amount_cents: 0}
        - {fee_type: charge, item_code: b06_stl_bmp_a, amount_cents: 6000, units: "60"}
        - {fee_type: charge, item_code: b06_stl_bmp_b, amount_cents: 2000, units: "20"}
    wallet:
      code: b06_stl_bmp_w
      balance_cents: 0
  math: >-
    The mirror of the metric full-cover row: fees 8_000¢ (metric a 6_000, metric b 2_000) but
    only 20 credits settled — 2_000¢ against a 6_000¢ allowed slice. The wallet is drained: draw
    min(6000, 2000, 8000) = 2_000 (allocate_prepaid_credits_by_wallets_service.rb:53), so 4_000¢
    of metric a's fee plus all 2_000¢ of metric b's are owed in cash, total 6_000.
    The 6 March top-up is 100 credits — deliberately far more than the shortfall — and it is
    never paid. It is created `pending` (create_from_params_service.rb:125-138) with
    `remaining_amount_cents` nil (create_service.rb:56-62), so it is invisible both to
    `balance_cents` and to `available_inbound` (wallet_transaction.rb:80). If purchased but
    unsettled credits were spendable, the draw would be min(6000, 12000, 8000) = 6_000, prepaid
    6_000 and total 2_000 — a 4_000¢ swing on the customer's bill from credits nobody has paid
    for. Asserting balance_cents 0 and consumed_amount_cents 2_000 alongside the total pins which
    of the two Lago does.
    Metric b's fee is the one the limitation forbids and it is asserted at its full 2_000¢ inside
    the 6_000 total; both fees are `fee_type: charge`, so only the wallet_targets lookup
    (:37-41, :117) can distinguish them. invoices is 3 — subscription plus two `credit` invoices,
