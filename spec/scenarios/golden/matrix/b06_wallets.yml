    invoices: 2
    invoice:
      select: {invoice_type: subscription}
      fees_amount_cents: 3060
      prepaid_credit_amount_cents: 3000
      prepaid_granted_credit_amount_cents: 3000
      total_amount_cents: 60
      payment_status: pending
      fees:
        - {fee_type: subscription, item_code: golden_b06_paid_ftn, amount_cents: 60, units: "1"}
        - {fee_type: charge, item_code: b06_paid_ftn, amount_cents: 3000, units: "60"}
