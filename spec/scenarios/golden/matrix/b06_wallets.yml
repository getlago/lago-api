        charge_model: standard
        properties: {amount: "1"}
        accepts_target_wallet: true
    customer: {external_id: golden_b06_twc_g_fc_cust, currency: EUR}
    subscription: {external_id: golden_b06_twc_g_fc_sub, billing_time: calendar}
    wallets:
      - {name: targeted rich, code: b06_twc_g_fc_a, rate_amount: "1", currency: EUR, granted_credits: "100", priority: 1}
      - {name: targeted poor, code: b06_twc_g_fc_b, rate_amount: "1", currency: EUR, granted_credits: "10", priority: 20}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_twc_g_fc, properties: {amount: 10, target_wallet_code: b06_twc_g_fc_a}}
        - {code: b06_twc_g_fc, properties: {amount: 30, target_wallet_code: b06_twc_g_fc_a}}
        - {code: b06_twc_g_fc, properties: {amount: 20, target_wallet_code: b06_twc_g_fc_a}}
        - {code: b06_twc_g_fc, properties: {amount: 25, target_wallet_code: b06_twc_g_fc_b}}
        - {code: b06_twc_g_fc, properties: {amount: 15, target_wallet_code: b06_twc_g_fc_b}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      fees_count: 3
      fees_amount_cents: 10000
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 7000
      prepaid_granted_credit_amount_cents: 7000
      total_amount_cents: 3000
    wallet:
      code: b06_twc_g_fc_a
      balance_cents: 4000
  math: >-
    Under a limitation, "full cover" means the wallet covers the whole slice it is ALLOWED to pay and
    keeps a surplus. With `accepts_target_wallet` the charge's grouped_by keys gain
    "target_wallet_code" (fees/charge_service.rb:496-499), so the 100 units split into TWO charge
    fees by the property the events carry: 60 units → 6_000¢ tagged b06_twc_g_fc_a and 40 units →
    4_000¢ tagged b06_twc_g_fc_b, plus the 0¢ subscription fee — fees_count 3, fees 10_000¢.
    Allocation keys buckets by [fee_type, billable_metric_id, target_wallet_code]
    (allocate_prepaid_credits_by_wallets_service.rb:83-85) and `applicable_fee?` short-circuits on a
    present tag: only the wallet whose `code` equals it may pay (:109-114). Wallet a holds
    100 granted credits at rate 1.00 = 10_000¢ — more than the entire invoice — and still pays only
    its own 6_000¢ bucket: min(6_000, 10_000, 10_000) = 6_000 (:53). Wallet b, reached second, pays
    min(4_000, 1_000, 4_000) = 1_000. Prepaid 7_000¢, and 3_000¢ of the b-tagged fee is still owed in
    CASH even though wallet a is sitting on 4_000¢ that would cover it — the limitation, not the
    balance, is what binds, which is the whole point of the column.
    The counterfactual is the pre-capability state: with no tag there is ONE 10_000¢ bucket,
    wallet a (priority 1) pays min(10_000, 10_000, 10_000) = 10_000, prepaid 10_000, total 0,
    balance 0, fees_count 2. Name both: total 3_000 vs 0, balance 4_000 vs 0.
    Three events in the a bucket (10/30/20) so sum 60 is distinguishable from max 30 and latest 20.
    Both wallets are traceable (wallets/create_service.rb:44,245-246 — a fresh customer's wallets
    all are), so prepaid_granted 7_000 equals prepaid_credit: every cent came from granted inbounds
    (applied_prepaid_credits_service.rb:74-91). Granted credits raise no `credit` invoice, so
    invoices stays 1.

- id: b06/granted/target-wallet-code/rounding
  block: B6
  axes: {source: granted, limitation: target-wallet-code, application: rounding}
  dimensions: {interval: monthly, billing_time: calendar, rate_amount: "0.6665", targeted_bucket: 6000, foreign_bucket: 2000}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    organization: {premium_integrations: [events_targeting_wallets]}
    metrics: [{code: b06_twc_g_rn, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_twc_g_rn, interval: monthly, amount_cents: 0}
    charges:
      - billable_metric_code: b06_twc_g_rn
        charge_model: standard
        properties: {amount: "1"}
        accepts_target_wallet: true
    customer: {external_id: golden_b06_twc_g_rn_cust, currency: EUR}
    subscription: {external_id: golden_b06_twc_g_rn_sub, billing_time: calendar}
    wallets:
      - {name: odd rate, code: b06_twc_g_rn_a, rate_amount: "0.6665", currency: EUR, granted_credits: "50", priority: 1}
      - {name: rich neighbour, code: b06_twc_g_rn_b, rate_amount: "1", currency: EUR, granted_credits: "100", priority: 20}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_twc_g_rn, properties: {amount: 10, target_wallet_code: b06_twc_g_rn_a}}
        - {code: b06_twc_g_rn, properties: {amount: 30, target_wallet_code: b06_twc_g_rn_a}}
        - {code: b06_twc_g_rn, properties: {amount: 20, target_wallet_code: b06_twc_g_rn_a}}
        - {code: b06_twc_g_rn, properties: {amount: 12, target_wallet_code: b06_twc_g_rn_b}}
        - {code: b06_twc_g_rn, properties: {amount: 8, target_wallet_code: b06_twc_g_rn_b}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      fees_count: 3
      fees_amount_cents: 8000
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 5333
      prepaid_granted_credit_amount_cents: 5333
      total_amount_cents: 2667
    wallet:
      code: b06_twc_g_rn_b
      balance_cents: 8000
  math: >-
    Credits→cents is `(credit_amount × rate_amount).round(currency.exponent) × 100`
    (wallet_credit.rb:26-27) — a HALF-UP round of the currency amount, not a truncation. 50 credits
    at rate 0.6665 is 33.325 → 33.33 → 3_333¢; truncating gives 33.32 → 3_332¢. Both numbers are
    named because this row propagates the single cent all the way to the invoice total.
    Two tagged charge fees: 60 units → 6_000¢ tagged b06_twc_g_rn_a (10/30/20, so sum 60 ≠ max 30 ≠
    latest 20) and 20 units → 2_000¢ tagged b06_twc_g_rn_b, plus the 0¢ subscription fee = 8_000¢.
    Wallet a may only pay its own bucket and holds less than it (3_333 < 6_000), so it is drained:
    min(6_000, 3_333, 8_000) = 3_333 (allocate_prepaid_credits_by_wallets_service.rb:53). Wallet b
    holds 10_000¢ — five times what its own bucket needs — and may NOT top up a's shortfall
    (:109-114), so it pays exactly its own 2_000¢ and keeps 8_000¢. Prepaid 5_333¢, total 2_667¢.
    Truncation instead of half-up would give prepaid 5_332 and total 2_668; ignoring the tag would
    merge the buckets and let b pay a's remaining 4_667¢, giving prepaid 8_000, total 0 and
    balance 5_333. All three are separated by the pair (total 2_667, wallet b 8_000).
    b is the asserted wallet because a ends at 0 under every one of those implementations, while b's
    balance is the only place the refusal to cross buckets is visible — and `expect.wallet` takes one
    wallet, not a list.

- id: b06/granted/target-wallet-code/negative-total
  block: B6
  axes: {source: granted, limitation: target-wallet-code, application: negative-total}
  dimensions: {interval: monthly, billing_time: calendar, rate_amount: 1, coupon: fixed_2000_once, foreign_wallet: empty}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    organization: {premium_integrations: [events_targeting_wallets]}
    metrics: [{code: b06_twc_g_nt, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_twc_g_nt, interval: monthly, amount_cents: 0}
    charges:
      - billable_metric_code: b06_twc_g_nt
        charge_model: standard
        properties: {amount: "1"}
        accepts_target_wallet: true
    customer: {external_id: golden_b06_twc_g_nt_cust, currency: EUR}
    subscription: {external_id: golden_b06_twc_g_nt_sub, billing_time: calendar}
    coupons:
      - {code: b06_twc_g_nt_cpn, coupon_type: fixed_amount, amount_cents: 2000, amount_currency: EUR, frequency: once, expiration: no_expiration}
    wallets:
      - {name: over funded, code: b06_twc_g_nt_a, rate_amount: "1", currency: EUR, granted_credits: "100", priority: 1}
      - {name: empty target, code: b06_twc_g_nt_b, rate_amount: "1", currency: EUR, priority: 20}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_twc_g_nt, properties: {amount: 10, target_wallet_code: b06_twc_g_nt_a}}
        - {code: b06_twc_g_nt, properties: {amount: 15, target_wallet_code: b06_twc_g_nt_a}}
        - {code: b06_twc_g_nt, properties: {amount: 5, target_wallet_code: b06_twc_g_nt_a}}
        - {code: b06_twc_g_nt, properties: {amount: 12, target_wallet_code: b06_twc_g_nt_b}}
        - {code: b06_twc_g_nt, properties: {amount: 8, target_wallet_code: b06_twc_g_nt_b}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      fees_count: 3
      fees_amount_cents: 5000
      coupons_amount_cents: 2000
      sub_total_excluding_taxes_amount_cents: 3000
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 1800
      prepaid_granted_credit_amount_cents: 1800
      total_amount_cents: 1200
    wallet:
      code: b06_twc_g_nt_a
      balance_cents: 8200
  math: >-
    A wallet holding 10_000¢ against an invoice of 3_000¢, where the only fee it may pay is capped at
    1_800¢ — the sharpest form of "could the total go negative". It does not, and the surplus is not
    refunded either: every draw is bounded by `remaining_invoice_amount`
    (allocate_prepaid_credits_by_wallets_service.rb:53, decremented at :57) and by the per-fee cap at
    :77-81, so 1_800¢ leaves the wallet, 8_200¢ stays in it, and 1_200¢ is still owed in cash. The
    three alternatives, named: total −7_000 if the whole applicable balance were drained, a `credit`
    invoice or credit note for the surplus (none is issued — invoices stays 1), or the wallet drained
    to 0.
    The cap is the second half of the row. Two tagged charge fees: 30 units → 3_000¢ tagged
    b06_twc_g_nt_a (10/15/5, sum 30 ≠ max 15 ≠ latest 5) and 20 units → 2_000¢ tagged
    b06_twc_g_nt_b, 5_000¢ of fees. A fixed_amount coupon spreads BY WEIGHT,
    `credit × (amount_cents − precise_coupons_amount_cents) / invoice.sub_total_excluding_taxes`
    (fee.rb:232-236 via credits/applied_coupon_service.rb:35-37): 2_000 × 3_000/5_000 = 1_200 onto
    the a fee and 800 onto the b fee, nothing onto the 0¢ subscription fee. Caps are then
    `sub_total_excluding_taxes + taxes_precise − precise_credit_notes` (allocate:77-79) = 1_800 for a
    and 1_200 for b. Wallet b is declared with NO credits, so `with_positive_balance`
    (wallet.rb:65) drops it from the allocator entirely and its 1_200¢ can never be paid by anyone —
    wallet a is refused it by `applicable_fee?` (:109-114) despite holding 8_200¢.
    Prepaid credit is the LAST reducer (calculate_fees_service.rb:57-62), so credits applied BEFORE
    the coupon would have seen a 3_000¢ cap on the a fee and left balance 7_000 and total 0. Name
    both: prepaid 1_800 vs 3_000, balance 8_200 vs 7_000. And a tag-blind allocator would pay both
    caps, 3_000 in total, for the same total 0 and balance 7_000.

- id: b06/granted/target-wallet-code/ongoing-balance
  block: B6
  axes: {source: granted, limitation: target-wallet-code, application: ongoing-balance}
  dimensions: {interval: monthly, billing_time: calendar, rate_amount: 1, read_at: mid-period}
  provenance: coverage-gap
  runners: [rspec]
  premium: true
  setup:
    organization: {premium_integrations: [events_targeting_wallets]}
    metrics: [{code: b06_twc_g_ob, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_twc_g_ob, interval: monthly, amount_cents: 0}
    charges:
      - billable_metric_code: b06_twc_g_ob
        charge_model: standard
        properties: {amount: "1"}
        accepts_target_wallet: true
    customer: {external_id: golden_b06_twc_g_ob_cust, currency: EUR}
    subscription: {external_id: golden_b06_twc_g_ob_sub, billing_time: calendar}
    wallets:
      - {name: targeted, code: b06_twc_g_ob_a, rate_amount: "1", currency: EUR, granted_credits: "100", priority: 1}
      - {name: other target, code: b06_twc_g_ob_b, rate_amount: "1", currency: EUR, granted_credits: "100", priority: 20}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_twc_g_ob, properties: {amount: 10, target_wallet_code: b06_twc_g_ob_a}}
        - {code: b06_twc_g_ob, properties: {amount: 30, target_wallet_code: b06_twc_g_ob_a}}
        - {code: b06_twc_g_ob, properties: {amount: 20, target_wallet_code: b06_twc_g_ob_a}}
        - {code: b06_twc_g_ob, properties: {amount: 25, target_wallet_code: b06_twc_g_ob_b}}
        - {code: b06_twc_g_ob, properties: {amount: 15, target_wallet_code: b06_twc_g_ob_b}}
    - {at: "2024-03-10T00:00:00Z", do: perform_wallet_refresh}
    - {at: "2024-03-10T01:00:00Z", do: fetch_current_usage}
  expect:
    invoices: 0
    wallet:
      code: b06_twc_g_ob_a
      balance_cents: 10000
      ongoing_usage_balance_cents: 6000
      ongoing_balance_cents: 4000
    usage:
      amount_cents: 10000
      total_amount_cents: 10000
  math: >-
    A mid-period read, and a DIFFERENT implementation of the same rule: no invoice is built at all
    (invoices 0). `perform_wallet_refresh` runs Clock::RefreshWalletsOngoingBalanceJob (premium-gated
    at refresh_wallets_ongoing_balance_job.rb:8) → Customers::RefreshWalletsService →
    Wallets::Balance::AllocateOngoingUsageByWalletsService, which re-derives the tag itself at
    allocate_ongoing_usage_by_wallets_service.rb:118-123 and re-implements the refusal at :127-130 —
    a second copy of the branch, so the billing rows do not cover it.
    Current-usage fees are grouped exactly as billed ones: `UsageFilters::WITHOUT_PRESENTATION_FILTER`
    leaves skip_grouping false, so grouped_by survives (fees/charge_service.rb:493-499). The pool is
    `fee.amount_cents + fee.taxes_amount_cents` per key (:88): 6_000¢ tagged a (10/30/20 — sum 60 ≠
    max 30 ≠ latest 20) and 4_000¢ tagged b. Each bucket's `applicable` list has exactly ONE wallet,
    so `index == applicable.length - 1` holds and that wallet takes the whole bucket (:47-58) —
    wallet a absorbs 6_000 and NOT the 4_000 that belongs to b, giving
    ongoing_balance_cents = balance − ongoing_usage = 10_000 − 6_000 = 4_000
    (refresh_ongoing_usage_service.rb:63).
    Without the tag both wallets are unrestricted, the two keys merge into one 10_000¢ pool and
    wallet a — first in `in_application_order` (customers/refresh_wallets_service.rb:48) with room
    10_000 — absorbs all of it: ongoing_usage 10_000 and ongoing_balance 0. Name both: 6_000 vs
    10_000 and 4_000 vs 0. `balance_cents` stays 10_000 either way: the ongoing figures are a
    projection and never debit the wallet, which is why the row also asserts the current-usage
    payload — the full 10_000¢ is still owed by the customer, the wallet has merely reserved the part
    it is allowed to reserve. There is no granted/purchased split on this path: ongoing usage is
    allocated against `balance_cents` as a single pool and no WalletTransactionConsumption rows are
    written.

- id: b06/paid/target-wallet-code/full-cover
  block: B6
  axes: {source: paid, limitation: target-wallet-code, application: full-cover}
  dimensions: {interval: monthly, billing_time: calendar, rate_amount: 1, paid_credits: 40, granted_credits: 100}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    organization: {premium_integrations: [events_targeting_wallets]}
    metrics: [{code: b06_twc_p_fc, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_twc_p_fc, interval: monthly, amount_cents: 0}
    charges:
      - billable_metric_code: b06_twc_p_fc
        charge_model: standard
        properties: {amount: "1"}
        accepts_target_wallet: true
    customer: {external_id: golden_b06_twc_p_fc_cust, currency: EUR}
    subscription: {external_id: golden_b06_twc_p_fc_sub, billing_time: calendar}
    wallets:
      - {name: targeted mixed pools, code: b06_twc_p_fc_a, rate_amount: "1", currency: EUR, granted_credits: "100", paid_credits: "40", priority: 1}
      - {name: targeted poor, code: b06_twc_p_fc_b, rate_amount: "1", currency: EUR, granted_credits: "10", priority: 20}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_twc_p_fc, properties: {amount: 10, target_wallet_code: b06_twc_p_fc_a}}
        - {code: b06_twc_p_fc, properties: {amount: 30, target_wallet_code: b06_twc_p_fc_a}}
        - {code: b06_twc_p_fc, properties: {amount: 20, target_wallet_code: b06_twc_p_fc_a}}
        - {code: b06_twc_p_fc, properties: {amount: 25, target_wallet_code: b06_twc_p_fc_b}}
        - {code: b06_twc_p_fc, properties: {amount: 15, target_wallet_code: b06_twc_p_fc_b}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {invoice_type: credit}
        fees_amount_cents: 4000
        taxes_amount_cents: 0
        total_amount_cents: 4000
        payment_status: pending
      - select: {invoice_type: subscription}
        fees_count: 3
        fees_amount_cents: 10000
        taxes_amount_cents: 0
        prepaid_credit_amount_cents: 7000
        prepaid_granted_credit_amount_cents: 7000
        total_amount_cents: 3000
    wallet:
      code: b06_twc_p_fc_a
      balance_cents: 4000
  math: >-
    `source: paid` means the purchase is PENDING: the 40 purchased credits create an inbound
    transaction with status pending (wallet_transactions/create_from_params_service.rb:129) and a
    finalized-but-unpaid `credit` invoice of 40 × 1.00 = 4_000¢ — credit fees are never taxed
    (fees/paid_credit_service.rb:36). Pending credits are excluded from `balance_cents`
    (wallet_transaction.rb:80, inbound.settled), so the wallet's spendable pool is only the 100
    granted credits = 10_000¢. A row funded ONLY with pending paid credits would assert 0 prepaid and
    would pass under an implementation that ignored wallets entirely, so both pools are funded and
    the row asserts that the granted one moved while the purchased one did not.
    Two tagged charge fees (fees/charge_service.rb:496-499): 60 units → 6_000¢ tagged b06_twc_p_fc_a
    (10/30/20, so sum 60 ≠ max 30 ≠ latest 20) and 40 units → 4_000¢ tagged b06_twc_p_fc_b, plus the
    0¢ subscription fee = 10_000¢. Wallet a may only pay its own bucket
    (allocate_prepaid_credits_by_wallets_service.rb:83-85, :109-114): min(6_000, 10_000, 10_000) =
    6_000, full cover of the allowed slice with 4_000¢ left over. Wallet b pays min(4_000, 1_000,
    4_000) = 1_000. Prepaid 7_000, total 3_000 owed in cash — wallet a's 4_000¢ surplus is forbidden
    from covering it.
    Three implementations are excluded by the pair (total 3_000, balance 4_000). If the pending
    purchase were spendable the pool would be 14_000¢, wallet a would still pay only its 6_000¢
    bucket and end at 8_000¢. If the tag were ignored there would be one 10_000¢ bucket, wallet a
    (priority 1) would pay all of it and end at 0 with total 0. If credits were applied before taxes
    or coupons nothing would move here (neither exists), which is why fees_amount and taxes are
    asserted too. prepaid_granted 7_000 = prepaid_credit proves the purchased pool contributed
    nothing (applied_prepaid_credits_service.rb:74-91).

- id: b06/paid/target-wallet-code/partial-cover
  block: B6
  axes: {source: paid, limitation: target-wallet-code, application: partial-cover}
  dimensions: {interval: monthly, billing_time: calendar, rate_amount: 1, paid_credits: 60, granted_credits: 20}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
