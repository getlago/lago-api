  math: >-
    The settled twin of the paid row: paying the top-up invoice on 2 March runs
    Invoices::UpdateService:117 → PrepaidCreditJob → Wallets::ApplyPaidCreditsService, which moves the
    inbound transaction to settled and raises balance_cents to 10_000¢. Recording a payment through
    the API is itself premium (POST /payments answers 403 feature_unavailable without both
    License.premium? and `manual_payments`), so the row declares that integration alongside
    `events_targeting_wallets` — `apply_golden_organization` (golden_runner.rb:96-100) REPLACES the
    list, so both must be named together or the charge silently loses accepts_target_wallet.
