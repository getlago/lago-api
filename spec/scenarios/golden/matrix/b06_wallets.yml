    plan: {code: golden_b06_twc_th_ob, interval: monthly, amount_cents: 0}
    charges:
      - billable_metric_code: b06_twc_th_ob
        charge_model: standard
        properties: {amount: "1"}
        accepts_target_wallet: true
    customer: {external_id: golden_b06_twc_th_ob_cust, currency: EUR}
    subscription: {external_id: golden_b06_twc_th_ob_sub, billing_time: calendar}
    wallets:
      - name: targeted auto refilled
        code: b06_twc_th_ob_a
        rate_amount: "1"
        currency: EUR
        granted_credits: "20"
        priority: 1
        recurring_transaction_rules:
          - {trigger: threshold, method: fixed, threshold_credits: "0", granted_credits: "80"}
      - {name: other target, code: b06_twc_th_ob_b, rate_amount: "1", currency: EUR, granted_credits: "100", priority: 20}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_twc_th_ob, properties: {amount: 10, target_wallet_code: b06_twc_th_ob_a}}
        - {code: b06_twc_th_ob, properties: {amount: 30, target_wallet_code: b06_twc_th_ob_a}}
        - {code: b06_twc_th_ob, properties: {amount: 20, target_wallet_code: b06_twc_th_ob_a}}
        - {code: b06_twc_th_ob, properties: {amount: 25, target_wallet_code: b06_twc_th_ob_b}}
        - {code: b06_twc_th_ob, properties: {amount: 15, target_wallet_code: b06_twc_th_ob_b}}
    - {at: "2024-03-10T00:00:00Z", do: perform_wallet_refresh}
    - {at: "2024-03-10T01:00:00Z", do: fetch_current_usage}
  expect:
    invoices: 0
    wallet:
      code: b06_twc_th_ob_a
      balance_cents: 10000
      ongoing_usage_balance_cents: 6000
      ongoing_balance_cents: 4000
    usage:
      amount_cents: 10000
      total_amount_cents: 10000
  math: >-
    The purest form of the interaction: no invoice exists at all (invoices 0), so the only thing under
    test is how much unbilled usage the tag lets the wallet see and what its rule does about it. The
    path is Clock::RefreshWalletsOngoingBalanceJob (premium-gated at
    refresh_wallets_ongoing_balance_job.rb:8) → Customers::RefreshWalletsService →
    AllocateOngoingUsageByWalletsService → RefreshOngoingUsageService → UpdateOngoingService, whose
    after_commit is the one and only caller of Wallets::ThresholdTopUpService
    (update_ongoing_service.rb:26).
    Current-usage fees keep their grouping (fees/charge_service.rb:493-499 —
    `UsageFilters::WITHOUT_PRESENTATION_FILTER` leaves skip_grouping false), so the pool is 6_000¢
    tagged b06_twc_th_ob_a (10/30/20: sum 60 ≠ max 30 ≠ latest 20) and 4_000¢ tagged b06_twc_th_ob_b.
    `applicable_fee?` (:127-130) gives each key exactly one wallet, so wallet a absorbs 6_000 and not
    the 4_000 that belongs to b: ongoing_balance = 2_000 − 6_000 = −1_000
    (refresh_ongoing_usage_service.rb:63), credits_ongoing_balance −10 ≤ 0, and the rule fires ONCE for
    a flat 80 granted credits (recurring_transaction_rule.rb:104-111). Balance::IncreaseService
    re-enqueues the refresh (increase_service.rb:36), which is the state asserted: balance 10_000,
    ongoing_usage 6_000 again, ongoing_balance 4_000 — and 40 credits > 0 terminates the loop.
    Tag-blind, wallet a is applicable to both keys and, having an active threshold rule, absorbs
    everything with no room check (:47-58, `balance: threshold ? 0` at :74): ongoing_usage 10_000,
    credits_ongoing_balance −80, one grant to 10_000¢, then a re-refresh landing on exactly 0 credits
    which is NOT > 0, so a SECOND grant to 18_000¢. Name all three figures: balance 10_000 vs 18_000,
    ongoing_usage 6_000 vs 10_000, ongoing_balance 4_000 vs 8_000. The current-usage payload is
    asserted alongside because the customer still owes the whole 10_000¢ — the wallet has only reserved
    the part the tag allows, and no WalletTransactionConsumption rows are written on this path.

- id: b06/target-method/target-wallet-code/full-cover
  block: B6
  axes: {source: target-method, limitation: target-wallet-code, application: full-cover}
  dimensions: {interval: monthly, billing_time: calendar, rate_amount: 1, trigger: threshold, target_ongoing_balance: 40, grants_target_top_up: true}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    organization: {premium_integrations: [events_targeting_wallets]}
    metrics: [{code: b06_twc_tm_fc, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_twc_tm_fc, interval: monthly, amount_cents: 0}
    charges:
      - billable_metric_code: b06_twc_tm_fc
        charge_model: standard
        properties: {amount: "1"}
        accepts_target_wallet: true
    customer: {external_id: golden_b06_twc_tm_fc_cust, currency: EUR}
    subscription: {external_id: golden_b06_twc_tm_fc_sub, billing_time: calendar}
    wallets:
      - name: targeted target top-up
        code: b06_twc_tm_fc_a
        rate_amount: "1"
        currency: EUR
        priority: 1
        recurring_transaction_rules:
          - {trigger: threshold, threshold_credits: "0", method: target, target_ongoing_balance: "40", grants_target_top_up: true}
      - {name: targeted poor, code: b06_twc_tm_fc_b, rate_amount: "1", currency: EUR, granted_credits: "10", priority: 20}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_twc_tm_fc, properties: {amount: 10, target_wallet_code: b06_twc_tm_fc_a}}
        - {code: b06_twc_tm_fc, properties: {amount: 30, target_wallet_code: b06_twc_tm_fc_a}}
        - {code: b06_twc_tm_fc, properties: {amount: 20, target_wallet_code: b06_twc_tm_fc_a}}
        - {code: b06_twc_tm_fc, properties: {amount: 25, target_wallet_code: b06_twc_tm_fc_b}}
        - {code: b06_twc_tm_fc, properties: {amount: 15, target_wallet_code: b06_twc_tm_fc_b}}
    - {at: "2024-03-10T00:00:00Z", do: perform_wallet_refresh}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      fees_count: 3
      fees_amount_cents: 10000
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 7000
      prepaid_granted_credit_amount_cents: 7000
      total_amount_cents: 3000
    wallet:
      code: b06_twc_tm_fc_a
      balance_cents: 4000
  math: >-
    A `method: target` rule tops up TO `target_ongoing_balance` and derives the amount as a gap against
    CREDITS_ONGOING_BALANCE — balance MINUS unbilled usage (recurring_transaction_rule.rb:138-150 via
    compute_granted_credits :104-112) — so under this limitation the tag decides the SIZE of the top-up.
    The wallet declares no credits of its own; every credit here is sized by the rule.
    Two tagged charge fees (fees/charge_service.rb:496-499): 6_000¢ tagged b06_twc_tm_fc_a (10/30/20:
    sum 60 ≠ max 30 ≠ latest 20) and 4_000¢ tagged b06_twc_tm_fc_b. At the 10 March refresh the ongoing
    allocator gives wallet a only its own bucket (allocate_ongoing_usage_by_wallets_service.rb:118-130),
    so ongoing_usage 6_000, ongoing_balance = 0 − 6_000 = −1_000 × 6 = −6_000
    (refresh_ongoing_usage_service.rb:63) and credits_ongoing_balance −60 ≤ threshold 0
    (threshold_top_up_service.rb:20-21). The rule asks for 40 − (−60) = 100 credits = 10_000¢, granted
    because `grants_target_top_up` is true, so it settles at once and raises no invoice
    (create_from_params_service.rb:145-173) — invoices stays 1. The cascade re-refresh reads
    (10_000 − 6_000)/100 = 40 credits, not > 0 is false, so it stops after exactly one top-up.
    At billing wallet a pays only its own bucket, min(6_000, 10_000, 10_000) = 6_000
    (allocate_prepaid_credits_by_wallets_service.rb:53 gated by :109-114) — full cover of the allowed
    slice, 4_000¢ of surplus — and wallet b pays min(4_000, 1_000, 4_000) = 1_000, leaving 3_000¢ in
    cash that a's surplus is forbidden to touch.
    Two wrong implementations, both named: a rule measuring the gap against `balance_cents` (0) would
    ask for 40 credits, so prepaid would be 4_000 + 1_000 = 5_000 and the total 5_000 with balance 0.
    A tag-blind allocator would absorb all 10_000¢ mid-period, ask for 140 credits, then pay the whole
    merged bucket: prepaid 10_000 and total 0 — and its residual balance would ALSO be 4_000, because a
    target rule always lands the ongoing balance on the target. That is why this row asserts prepaid and
    the total rather than resting on the balance.

- id: b06/target-method/target-wallet-code/partial-cover
