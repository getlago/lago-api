        - {code: b06_grt_bmp_a, properties: {amount: 30}}
        - {code: b06_grt_bmp_a, properties: {amount: 20}}
        - {code: b06_grt_bmp_b, properties: {amount: 5}}
        - {code: b06_grt_bmp_b, properties: {amount: 10}}
        - {code: b06_grt_bmp_b, properties: {amount: 5}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      select: {invoice_type: subscription}
