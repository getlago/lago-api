        total_amount_cents: 6000
        payment_status: pending
      - select: {invoice_type: subscription}
        fees_count: 3
        fees_amount_cents: 10000
        taxes_amount_cents: 0
        prepaid_credit_amount_cents: 6000
        prepaid_granted_credit_amount_cents: 6000
        total_amount_cents: 4000
    wallet:
      code: b06_twc_p_pc_b
      balance_cents: 6000
  math: >-
    Partial cover under the tag: the targeted wallet runs dry INSIDE its own bucket while a wallet
    holding five times the shortfall is forbidden to finish it. Wallet a's 60 purchased credits are
    pending and unspendable (create_from_params_service.rb:129; wallet_transaction.rb:80), so its pool
    is the 20 granted credits = 2_000¢ against its own 6_000¢ bucket: min(6_000, 2_000, 10_000) =
