        - {code: b06_grt_bmo_a, properties: {amount: 30}}
        - {code: b06_grt_bmo_a, properties: {amount: 20}}
        - {code: b06_grt_bmo_b, properties: {amount: 5}}
        - {code: b06_grt_bmo_b, properties: {amount: 10}}
        - {code: b06_grt_bmo_b, properties: {amount: 5}}
    - {at: "2024-03-10T00:00:00Z", do: perform_wallet_refresh}
  expect:
    invoices: 1
    wallet:
      code: b06_grt_bmo_w
      balance_cents: 8000
      ongoing_usage_balance_cents: 6000
      ongoing_balance_cents: 2000
  math: >-
    Mid-period, the ongoing allocator path
    (allocate_ongoing_usage_by_wallets_service.rb:33-65 via
    Clock::RefreshWalletsOngoingBalanceJob → Customers::RefreshWalletsService), with a wallet
    limited to metric a. Both charges are unbilled usage: metric a 6_000¢, metric b 2_000¢. Fee
    keys here are `[fee_type, billable_metric_id, target_wallet_code, currency]` (:118-124) — one
    element wider than the billing allocator's key, a second implementation of the same idea.
    The pool is sorted descending (:98-104) so metric a is offered first and
    `budgets["EUR"]` starts at 6_000 + 2_000 = 8_000. Metric a: remaining = min(6000, 8000) =
    6_000; `applicable` is just this wallet, so `index == applicable.length - 1` and it takes all
    6_000 (:48-51). Metric b: `applicable` is EMPTY because the wallet's targets do not include
    it (:126-137), so its 2_000 is dropped from the allocation entirely — the budget still fell
    to 2_000 but no wallet can claim it.
    ongoing_usage_balance_cents 6_000, and ongoing_balance_cents = 8_000 − 6_000 = 2_000
    (refresh_ongoing_usage_service.rb:63). Wrong answers: ignoring the metric limitation gives
    8_000 / 0 and would additionally flip `depleted_ongoing_balance` (:41-46); charging the
    limitation against `credits_ongoing_usage_balance` instead of cents would leave
    ongoing_usage_balance_cents at 0.
