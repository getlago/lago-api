        applies_to: {fee_types: [charge]}
      - name: subscriptions only
        code: b06_paid_ftp_sub
        rate_amount: "1"
        currency: EUR
        paid_credits: "30"
        granted_credits: "70"
        priority: 20
        applies_to: {fee_types: [subscription]}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_paid_ftp, properties: {amount: 10}}
        - {code: b06_paid_ftp, properties: {amount: 30}}
        - {code: b06_paid_ftp, properties: {amount: 20}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 3
    invoice:
      select: {invoice_type: subscription}
      fees_amount_cents: 8000
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 6200
      prepaid_granted_credit_amount_cents: 6200
      total_amount_cents: 1800
      fees:
        - {fee_type: subscription, item_code: golden_b06_paid_ftp, amount_cents: 5000, units: "1"}
        - {fee_type: charge, item_code: b06_paid_ftp, amount_cents: 3000, units: "60"}
    wallet:
      code: b06_paid_ftp_sub
      balance_cents: 2000
  math: >-
    Two disjointly limited wallets: one may pay only charge fees (1_200¢ spendable), the other
    only subscription fees (7_000¢ spendable). Each also carries a pending 30-credit purchase, so
    there are three invoices and the spendable balances are NOT 4_200 and 10_000.
    Buckets are consumed largest first (`ordered = remaining.sort_by { -v }`, allocate:89):
    subscription 5_000 then charge 3_000. The charge wallet skips the subscription bucket and
    pays min(3_000, 1_200, 8_000) = 1_200 of the charge fee. The subscription wallet then pays
    min(5_000, 7_000, 6_800) = 5_000 of the subscription fee and STOPS — the 1_800¢ still owed on
    the charge fee is a fee it may not pay, so 8_000 - 6_200 = 1_800¢ is owed in cash even though
    2_000¢ of credit is sitting on the wallet.
    That stranded 2_000¢ is what makes the limitation observable. When a wallet's balance is the
    binding constraint the invoice total is blind to WHICH fee it paid, so this row is built so
    the limitation, not the balance, stops the second wallet. Ignore limitations and the answer
    moves: the charge wallet's 1_200 goes to the subscription bucket, the other wallet then pays
    3_800 of subscription plus 1_800 of charge = 5_600, giving prepaid 6_800, a total of 1_200¢
    and a leftover of 1_400¢. Both asserted numbers change.
    Priority is deliberately not load-bearing here — the wallets are limited to disjoint fee
    types, so swapping their priorities gives the same split. The ordering question belongs to
    the multi-wallet-priority cell.

