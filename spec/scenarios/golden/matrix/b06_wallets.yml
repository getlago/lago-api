# B6 — Wallets & prepaid credits
#
# The heaviest measured bug cluster in the suite: 85 fix commits across app/services/wallets (52),
# app/services/wallet_transactions (23) and the prepaid-credit application services (10).
#
# Credits are applied at the very END of the invoice pipeline — after fees, progressive billing,
# coupons, taxes and credit notes (Invoices::CalculateFeesService:62) — so a wallet reduces
# total_amount_cents without touching fees_amount_cents or taxes_amount_cents. Every row below
# asserts both, because a change that started applying credits earlier would move the tax base and
# still leave the total looking right.
#
# Shared conventions: monthly / calendar, plan amount_cents 0, one event of amount 30 against a
# standard charge at 1.00 per unit → 3_000¢ of usage before credits. rate_amount 1 means one credit
# is worth 1.00, so granted_credits 10 is 1_000¢ of cover.
#
# A plan with amount_cents 0 STILL produces a subscription fee: Fees::SubscriptionService saves
# unconditionally (subscription_service.rb:25-30 — no zero-amount guard, unlike the charge path's
# should_persist_fee?, charge_service.rb:353-360), so every `fees:` list under a free plan carries
# `{fee_type: subscription, amount_cents: 0}` alongside its charge fees. It moves no money —
# AllocatePrepaidCreditsByWalletsService skips a fee whose sub_total is 0 (:75), so it creates no
# wallet bucket and every prepaid figure below is unaffected — but assert_golden_fees compares the
# COUNT, so omitting it fails the row before a single amount is compared.
---
- id: b06/granted/none/partial-cover
  block: B6
  axes: {source: granted, limitation: none, application: partial-cover}
  dimensions: {interval: monthly, billing_time: calendar, rate_amount: 1}
  provenance: coverage-gap
  runners: [rspec, live]
  setup:
    metrics: [{code: b06_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_granted, interval: monthly, amount_cents: 0}
    charges: [{billable_metric_code: b06_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b06_granted_cust, currency: EUR}
    subscription: {external_id: golden_b06_granted_sub, billing_time: calendar}
    wallets:
      - {name: granted, rate_amount: "1", currency: EUR, granted_credits: "10"}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_sum, properties: {amount: 30}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      fees_amount_cents: 3000
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 1000
      total_amount_cents: 2000
  math: >-
    30 units × 1.00 = 30.00 → 3_000¢ of fees. The wallet holds 10 granted credits at rate 1.00, i.e.
    1_000¢ of cover, which is less than the invoice — so it is fully consumed and the customer still
    owes 3_000 − 1_000 = 2_000¢. fees_amount_cents stays 3_000: credits reduce what is owed, not what
    was charged. Granted credits are free, so no `credit` invoice is issued and the count stays at 1.

- id: b06/paid/none/partial-cover
  block: B6
  axes: {source: paid, limitation: none, application: partial-cover}
  dimensions: {interval: monthly, billing_time: calendar, rate_amount: 1}
  provenance: coverage-gap
  runners: [rspec, live]
  setup:
    metrics: [{code: b06_paid_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_paid, interval: monthly, amount_cents: 0}
    charges: [{billable_metric_code: b06_paid_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b06_paid_cust, currency: EUR}
    subscription: {external_id: golden_b06_paid_sub, billing_time: calendar}
    wallets:
      - {name: purchased, rate_amount: "1", currency: EUR, paid_credits: "10"}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_paid_sum, properties: {amount: 30}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      select: {invoice_type: subscription}
      fees_amount_cents: 3000
      prepaid_credit_amount_cents: 0
      total_amount_cents: 3000
  math: >-
    PAID credits are sold, so buying them issues a separate invoice of type `credit` for the top-up
    — two invoices where the granted row has one. But the purchase is not money yet: the wallet
    transaction is created PENDING and the balance only rises once that top-up invoice is settled.
    So the period invoice gets 0¢ of cover and the customer owes the full 3_000¢, even though a
    wallet with 10 credits appears to exist. The paired row below settles the top-up and gets the
    1_000¢ of cover; the two together pin the boundary between credits bought and credits usable.

- id: b06/paid-settled/none/partial-cover
  block: B6
  axes: {source: paid-settled, limitation: none, application: partial-cover}
  dimensions: {interval: monthly, billing_time: calendar, rate_amount: 1}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    organization: {premium_integrations: [manual_payments]}
    metrics: [{code: b06_settled_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_settled, interval: monthly, amount_cents: 0}
    charges: [{billable_metric_code: b06_settled_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b06_settled_cust, currency: EUR}
    subscription: {external_id: golden_b06_settled_sub, billing_time: calendar}
    wallets:
      - {name: purchased, rate_amount: "1", currency: EUR, paid_credits: "10"}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-02T00:00:00Z", do: pay_invoice, invoice_type: credit}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_settled_sum, properties: {amount: 30}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      select: {invoice_type: subscription}
      fees_amount_cents: 3000
      prepaid_credit_amount_cents: 1000
      total_amount_cents: 2000
  math: >-
    The same wallet as the row above, with the top-up invoice paid on 2 March. Settling it moves the
    wallet transaction from pending to settled and raises the balance to 10 credits, so the period
    invoice now draws 1_000¢ of cover and the customer owes 3_000 − 1_000 = 2_000¢ — the same
    arithmetic the granted row reaches without a payment, because granted credits are free.
    Recording a payment through the API is itself premium: POST /payments answers 403
    feature_unavailable without both License.premium? and the `manual_payments` premium integration
    on the organization, which is why this row declares both.

- id: b06/granted/none/full-cover
  block: B6
  axes: {source: granted, limitation: none, application: full-cover}
  dimensions: {interval: monthly, billing_time: calendar, rate_amount: 1}
  provenance: coverage-gap
  runners: [rspec, live]
  setup:
    metrics: [{code: b06_full_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_full, interval: monthly, amount_cents: 0}
    charges: [{billable_metric_code: b06_full_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b06_full_cust, currency: EUR}
    subscription: {external_id: golden_b06_full_sub, billing_time: calendar}
    wallets:
      - {name: granted, rate_amount: "1", currency: EUR, granted_credits: "100"}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_full_sum, properties: {amount: 30}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_amount_cents: 3000
      prepaid_credit_amount_cents: 3000
      total_amount_cents: 0
      payment_status: succeeded
  math: >-
    100 granted credits = 10_000¢ of cover against 3_000¢ of fees, so the wallet absorbs the invoice
    entirely: prepaid_credit_amount_cents equals fees_amount_cents and nothing is owed. The wallet is
    debited only 3_000¢, not its whole balance. payment_status is asserted because a zero total is
    marked succeeded rather than pending (CalculateFeesService sets it from total_amount_cents), which
    is the difference between "paid by credits" and "awaiting payment".

- id: b06/granted/fee-types/partial-cover
  block: B6
  axes: {source: granted, limitation: fee-types, application: partial-cover}
  dimensions: {interval: monthly, billing_time: calendar, allowed_fee_types: charge}
  provenance: coverage-gap
  runners: [rspec, live]
  setup:
    metrics: [{code: b06_ft_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_fee_types, interval: monthly, amount_cents: 5000}
    charges: [{billable_metric_code: b06_ft_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b06_fee_types_cust, currency: EUR}
    subscription: {external_id: golden_b06_fee_types_sub, billing_time: calendar}
    wallets:
      - name: charges only
        rate_amount: "1"
        currency: EUR
        granted_credits: "100"
        applies_to: {fee_types: [charge]}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_ft_sum, properties: {amount: 30}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_amount_cents: 8000
      prepaid_credit_amount_cents: 3000
      total_amount_cents: 5000
  math: >-
    The invoice holds two kinds of fee: a 5_000¢ subscription fee and a 3_000¢ charge fee, 8_000¢
    total. The wallet is limited to fee_type `charge`, so despite holding 10_000¢ of cover it may
    only pay the 3_000¢ charge fee — the subscription fee is left owing. That the limitation caps
    what credits may touch rather than how much they are worth is the whole point of the row.

- id: b06/granted/billable-metrics/partial-cover
  block: B6
  axes: {source: granted, limitation: billable-metrics, application: partial-cover}
  dimensions: {interval: monthly, billing_time: calendar}
  provenance: coverage-gap
  runners: [rspec, live]
  setup:
    metrics:
      - {code: b06_bm_covered, aggregation_type: sum_agg, field_name: amount}
      - {code: b06_bm_other, aggregation_type: sum_agg, field_name: amount}
    plan: {code: golden_b06_bm, interval: monthly, amount_cents: 0}
    charges:
      - {billable_metric_code: b06_bm_covered, charge_model: standard, properties: {amount: "1"}}
      - {billable_metric_code: b06_bm_other, charge_model: standard, properties: {amount: "1"}}
    customer: {external_id: golden_b06_bm_cust, currency: EUR}
    subscription: {external_id: golden_b06_bm_sub, billing_time: calendar}
    wallets:
      - name: one metric only
        rate_amount: "1"
        currency: EUR
        granted_credits: "100"
        applies_to: {billable_metric_codes: [b06_bm_covered]}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_bm_covered, properties: {amount: 30}}
        - {code: b06_bm_other, properties: {amount: 20}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_amount_cents: 5000
      prepaid_credit_amount_cents: 3000
      total_amount_cents: 2000
  math: >-
    Two charges, 30 units and 20 units at 1.00 → 3_000¢ + 2_000¢ = 5_000¢ of fees. The wallet is
    limited to the metric b06_bm_covered, so it pays that charge's 3_000¢ and leaves the other
    charge's 2_000¢ owing. Same shape as the fee-types row but discriminating on metric rather than
    fee kind — worth separate rows because they are separate lookups in
    Credits::AllocatePrepaidCreditsByWalletsService.

- id: b06/granted/none/multi-wallet-priority
  block: B6
  axes: {source: granted, limitation: none, application: multi-wallet-priority}
  dimensions: {interval: monthly, billing_time: calendar}
  provenance: coverage-gap
  runners: [rspec, live]
  setup:
    metrics: [{code: b06_prio_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_prio, interval: monthly, amount_cents: 0}
    charges: [{billable_metric_code: b06_prio_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b06_prio_cust, currency: EUR}
    subscription: {external_id: golden_b06_prio_sub, billing_time: calendar}
    wallets:
      - {name: second, code: b06_low_priority, rate_amount: "1", currency: EUR, granted_credits: "100", priority: 20}
      - {name: first, code: b06_high_priority, rate_amount: "1", currency: EUR, granted_credits: "10", priority: 1}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_prio_sum, properties: {amount: 30}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_amount_cents: 3000
      prepaid_credit_amount_cents: 3000
      total_amount_cents: 0
  math: >-
    Two wallets holding 10 and 100 credits. Together they cover the 3_000¢ invoice completely, so the
    total is 0 and prepaid_credit_amount_cents is the full 3_000¢. The wallets are declared in the
    wrong order on purpose — the low-priority one first — because consumption follows `priority`
    ascending, not creation order (Wallet.in_application_order). The 10-credit wallet at priority 1
    is drained first and the remaining 2_000¢ comes from the other; a regression that ignored
    priority would still total 0 here, so the paired balance check belongs in a follow-up row rather
    than this one.

- id: b06/granted/none/rounding
  block: B6
  axes: {source: granted, limitation: none, application: rounding}
  dimensions: {interval: monthly, billing_time: calendar, rate_amount: "0.6665"}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    organization: {premium_integrations: [manual_payments]}
    metrics: [{code: b06_grt_rnd_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_grt_rnd, interval: monthly, amount_cents: 0}
    charges: [{billable_metric_code: b06_grt_rnd_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b06_grt_rnd_cust, currency: EUR}
    subscription: {external_id: golden_b06_grt_rnd_sub, billing_time: calendar}
    wallets:
      - name: mixed pools
        code: b06_grt_rnd_w
        rate_amount: "0.6665"
        currency: EUR
        granted_credits: "10"
        paid_credits: "50"
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-02T00:00:00Z", do: pay_invoice, invoice_type: credit}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_grt_rnd_sum, properties: {amount: 10}}
        - {code: b06_grt_rnd_sum, properties: {amount: 30}}
        - {code: b06_grt_rnd_sum, properties: {amount: 20}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      select: {invoice_type: subscription}
      fees_amount_cents: 6000
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 4000
      prepaid_granted_credit_amount_cents: 667
      prepaid_purchased_credit_amount_cents: 3333
      total_amount_cents: 2000
    wallet:
      code: b06_grt_rnd_w
      balance_cents: 0
  math: >-
    Credits→cents is `(credit_amount × rate_amount).round(currency.exponent) × 100`
    (wallet_credit.rb:26-27), a HALF-UP round of the currency amount, not a truncation. At rate
    0.6665 the granted grant is 10 × 0.6665 = 6.665 → 6.67 → 667¢ and the purchased top-up is
    50 × 0.6665 = 33.325 → 33.33 → 3333¢, so the settled balance is 4_000¢ exactly. Truncating
    instead of rounding would give 666 + 3332 = 3_998¢ — name both: 4_000 vs 3_998, and the
    invoice total 2_000 vs 2_002. Three events (10/30/20) so sum 60 is distinguishable from max
    30 and latest 20: 60 units × 1.00 = 6_000¢ of fees. The draw is capped at
    `[remaining_fee_amount, remaining_wallet_balance, remaining_invoice_amount].min`
    (allocate_prepaid_credits_by_wallets_service.rb:53) = min(6000, 4000, 6000) = 4_000, so the
    wallet is emptied and 2_000¢ stays owed. The split across pools is the point: one outbound
    transaction of 4_000¢ is decomposed by
    `WalletTransaction.in_consumption_order` (wallet_transaction.rb:81-88), which orders inbound
    priority ASC then `CASE WHEN transaction_status = granted THEN 0 ELSE 1 END` then created_at.
    Both inbounds default to priority 50 and the PURCHASED one is created FIRST
    (create_from_params_service.rb:36-53 handles paid before granted), so a created_at FIFO would
    report prepaid_granted nil / prepaid_purchased 3_333+667=4_000 — but granted sorts ahead of
    purchased at equal priority, giving 667 granted + 3_333 purchased
    (applied_prepaid_credits_service.rb:83-92 buckets the consumptions by transaction_status).

- id: b06/granted/none/negative-total
  block: B6
  axes: {source: granted, limitation: none, application: negative-total}
  dimensions: {interval: monthly, billing_time: calendar, coupon: fixed_2000_once}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    organization: {premium_integrations: [manual_payments]}
    metrics: [{code: b06_grt_neg_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_grt_neg, interval: monthly, amount_cents: 0}
    charges: [{billable_metric_code: b06_grt_neg_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b06_grt_neg_cust, currency: EUR}
    subscription: {external_id: golden_b06_grt_neg_sub, billing_time: calendar}
    coupons:
      - {code: b06_grt_neg_cpn, coupon_type: fixed_amount, amount_cents: 2000, amount_currency: EUR, frequency: once, expiration: no_expiration}
    wallets:
      - name: over-funded
        code: b06_grt_neg_w
        rate_amount: "1"
        currency: EUR
        granted_credits: "20"
        paid_credits: "80"
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-02T00:00:00Z", do: pay_invoice, invoice_type: credit}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_grt_neg_sum, properties: {amount: 10}}
        - {code: b06_grt_neg_sum, properties: {amount: 30}}
        - {code: b06_grt_neg_sum, properties: {amount: 20}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      select: {invoice_type: subscription}
      fees_amount_cents: 6000
      coupons_amount_cents: 2000
      sub_total_excluding_taxes_amount_cents: 4000
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 4000
      prepaid_granted_credit_amount_cents: 2000
      prepaid_purchased_credit_amount_cents: 2000
      total_amount_cents: 0
      payment_status: succeeded
    wallet:
      code: b06_grt_neg_w
      balance_cents: 6000
  math: >-
    A wallet holding 10_000¢ (20 granted + 80 purchased at rate 1) against an invoice whose total
    is only 4_000¢ — the case where the total could go negative. It does not. Lago CLAMPS at zero
    and leaves the surplus in the wallet: every draw is bounded by `remaining_invoice_amount`
    (allocate_prepaid_credits_by_wallets_service.rb:53, decremented at :57), so exactly 4_000¢
    leaves the wallet and 6_000¢ stays. The three alternatives, named: (a) total −6_000 if the
    applicable balance were drained, (b) a `credit` invoice or credit note for the 6_000 surplus —
    none is issued, (c) the wallet drained to 0. None happens.
    The 4_000 ceiling is itself the row's second half. Prepaid credit is the LAST reducer
    (calculate_fees_service.rb:57-62: coupon → tax → credit note → prepaid), and the per-fee cap is
    `sub_total_excluding_taxes + taxes_precise − precise_credit_notes` (:77-79) where
    `sub_total_excluding_taxes_amount_cents = amount_cents − precise_coupons_amount_cents`
    (fee.rb:238-240): 6_000 − 2_000 = 4_000, matching invoice.total exactly so
    `reconcile_remaining_amounts` (:93-106) adds nothing. Credits applied BEFORE the coupon would
    have taken 6_000 and left the wallet at 4_000 — name both: wallet 6_000 vs 4_000, prepaid
    4_000 vs 6_000. The coupon is `frequency: once` and the `credit` top-up invoice is issued
    first, but credit invoices never run the coupon or prepaid stages
    (invoices/paid_credit_service.rb:80-91 computes their totals directly), so the coupon is still
    unspent when the period invoice is built. Draw order: granted 2_000 is exhausted first, then
    2_000 of purchased — a created_at FIFO would report 0 granted / 4_000 purchased.

- id: b06/granted/none/ongoing-balance
  block: B6
  axes: {source: granted, limitation: none, application: ongoing-balance}
  dimensions: {interval: monthly, billing_time: calendar, read_at: mid-period}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    organization: {premium_integrations: [manual_payments]}
    metrics: [{code: b06_grt_ong_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_grt_ong, interval: monthly, amount_cents: 0}
    charges: [{billable_metric_code: b06_grt_ong_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b06_grt_ong_cust, currency: EUR}
    subscription: {external_id: golden_b06_grt_ong_sub, billing_time: calendar}
    wallets:
      - name: mixed pools
        code: b06_grt_ong_w
        rate_amount: "1"
        currency: EUR
        granted_credits: "20"
        paid_credits: "30"
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-02T00:00:00Z", do: pay_invoice, invoice_type: credit}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_grt_ong_sum, properties: {amount: 10}}
        - {code: b06_grt_ong_sum, properties: {amount: 30}}
        - {code: b06_grt_ong_sum, properties: {amount: 20}}
    - {at: "2024-03-10T00:00:00Z", do: perform_wallet_refresh}
  expect:
    invoices: 1
    wallet:
      code: b06_grt_ong_w
      balance_cents: 5000
      ongoing_usage_balance_cents: 6000
      ongoing_balance_cents: -1000
  math: >-
    A mid-period read, and a DIFFERENT code path from every other row in this slice: no invoice is
    built. `perform_wallet_refresh` runs Clock::RefreshWalletsOngoingBalanceJob (premium-gated at
    refresh_wallets_ongoing_balance_job.rb:8, hence `premium: true`) →
    Customers::RefreshWalletsService → Wallets::Balance::AllocateOngoingUsageByWalletsService, a
    reimplementation of the billing allocator, not the same code
    (allocate_ongoing_usage_by_wallets_service.rb:33-65).
    Balance is 20 granted + 30 purchased = 5_000¢ once the top-up invoice is settled. Unbilled
    usage is 60 units × 1.00 = 6_000¢, pooled as `fee.amount_cents + fee.taxes_amount_cents` (:90)
    — note this bucket does NOT subtract credit notes the way the billing cap does. With one
    wallet, `applicable` has length 1 so `index == applicable.length - 1` and it takes the whole
    remaining amount with no room check (:48-51): the wallet is allowed to go NEGATIVE.
    `ongoing_balance_cents = balance_cents − ongoing_usage_balance_cents`
    (refresh_ongoing_usage_service.rb:63) = 5_000 − 6_000 = −1_000. An implementation that clamped
    at zero — the plausible wrong answer — would report ongoing_usage 5_000 and ongoing_balance 0.
    invoices is 1: the purchased top-up's `credit` invoice, and nothing else, because no billing
    ran. `balance_cents` stays 5_000: the ongoing figures are a projection and never debit the
    wallet. There is no granted/purchased breakdown on this path at all — ongoing usage is
    allocated against `balance_cents`, a single pool, and no WalletTransactionConsumption rows are
    written, so the draw order this block exists to pin is invisible mid-period.

- id: b06/granted/fee-types/full-cover
  block: B6
  axes: {source: granted, limitation: fee-types, application: full-cover}
  dimensions: {interval: monthly, billing_time: calendar, allowed_fee_types: charge}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    organization: {premium_integrations: [manual_payments]}
    metrics: [{code: b06_grt_ftf_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_grt_ftf, interval: monthly, amount_cents: 5000}
    charges: [{billable_metric_code: b06_grt_ftf_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b06_grt_ftf_cust, currency: EUR}
    subscription: {external_id: golden_b06_grt_ftf_sub, billing_time: calendar}
    wallets:
      - name: charges only
        code: b06_grt_ftf_w
        rate_amount: "1"
        currency: EUR
        granted_credits: "20"
        paid_credits: "60"
        applies_to: {fee_types: [charge]}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-02T00:00:00Z", do: pay_invoice, invoice_type: credit}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_grt_ftf_sum, properties: {amount: 10}}
        - {code: b06_grt_ftf_sum, properties: {amount: 30}}
        - {code: b06_grt_ftf_sum, properties: {amount: 20}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      select: {invoice_type: subscription}
      fees_amount_cents: 11000
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 6000
      prepaid_granted_credit_amount_cents: 2000
      prepaid_purchased_credit_amount_cents: 4000
      total_amount_cents: 5000
      fees:
        - {fee_type: subscription, amount_cents: 5000}
        - {fee_type: charge, amount_cents: 6000, units: "60"}
    wallet:
      code: b06_grt_ftf_w
      balance_cents: 2000
  math: >-
    Two fees: a 5_000¢ subscription fee and a 6_000¢ charge fee (60 units × 1.00), 11_000¢ total.
    Under a limitation, "full cover" means the wallet fully covers the slice it is ALLOWED to pay
    and keeps a surplus — as opposed to partial cover, where it runs dry before finishing that
    slice. Balance is 20 granted + 60 purchased = 8_000¢; the allowed slice is the charge bucket
    only, 6_000¢. `applicable_fee?` (allocate_prepaid_credits_by_wallets_service.rb:108-122) sees
    types=["charge"], so the subscription bucket matches neither `types` nor `targets` and
    `unrestricted_wallet` is false — it is skipped entirely, never merely reduced. The draw is
    min(6000, 8000, 11000) = 6_000, leaving balance 8_000 − 6_000 = 2_000 and total
    11_000 − 6_000 = 5_000, i.e. the subscription fee still owed in CASH. Name the wrong answers:
    a wallet that ignored allowed_fee_types would take 8_000 and leave 3_000 owed; one that read
    the limitation as a discount on the whole invoice rather than a per-bucket filter would leave
    the same 5_000 total but a 0 balance. Both are excluded by asserting balance_cents 2_000
    alongside the total.
    Draw order: the 2_000 granted pool goes first and 4_000 comes from purchased
    (wallet_transaction.rb:81-88 sorts granted ahead of purchased at equal priority 50). The
    purchased inbound was created FIRST (create_from_params_service.rb:36-53), so a created_at
    FIFO would report 0 granted / 6_000 purchased.

- id: b06/granted/fee-types/multi-wallet-priority
  block: B6
  axes: {source: granted, limitation: fee-types, application: multi-wallet-priority}
  dimensions: {interval: monthly, billing_time: calendar, allowed_fee_types: charge}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    organization: {premium_integrations: [manual_payments]}
    metrics: [{code: b06_grt_ftp_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_grt_ftp, interval: monthly, amount_cents: 5000}
    charges: [{billable_metric_code: b06_grt_ftp_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b06_grt_ftp_cust, currency: EUR}
    subscription: {external_id: golden_b06_grt_ftp_sub, billing_time: calendar}
    wallets:
      - name: purchased pool
        code: b06_grt_ftp_paid
        rate_amount: "1"
        currency: EUR
        paid_credits: "60"
        priority: 20
        applies_to: {fee_types: [charge]}
      - name: granted pool
        code: b06_grt_ftp_granted
        rate_amount: "1"
        currency: EUR
        granted_credits: "20"
        priority: 1
        applies_to: {fee_types: [charge]}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-02T00:00:00Z", do: pay_invoice, invoice_type: credit}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_grt_ftp_sum, properties: {amount: 10}}
        - {code: b06_grt_ftp_sum, properties: {amount: 30}}
        - {code: b06_grt_ftp_sum, properties: {amount: 20}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      select: {invoice_type: subscription}
      fees_amount_cents: 11000
      prepaid_credit_amount_cents: 6000
      prepaid_granted_credit_amount_cents: 2000
      prepaid_purchased_credit_amount_cents: 4000
      total_amount_cents: 5000
    wallet:
      code: b06_grt_ftp_granted
      balance_cents: 0
  math: >-
    Granted-heavy versus paid-heavy, the sharpest form of this cell: wallet
    b06_grt_ftp_granted holds 20 GRANTED credits (2_000¢) at priority 1, wallet b06_grt_ftp_paid
    holds 60 PURCHASED credits (6_000¢) at priority 20, and they are declared in the wrong order
    on purpose because consumption follows `Wallet.in_application_order` — priority ASC then
    created_at (wallet.rb:69-71) — not declaration order.
    Fees 11_000¢ (5_000 subscription + 6_000 charge); both wallets are limited to fee_type
    `charge`, so only the 6_000¢ bucket is reachable. Wallet 1 (priority 1): min(6000, 2000,
    11000) = 2_000, leaving the bucket at 4_000 and the invoice at 9_000. Wallet 2: min(4000,
    6000, 9000) = 4_000. Total prepaid 6_000, total owed 5_000, and the subscription fee is still
    cash. Balances end 0 and 2_000.
    Wrong order gives DIFFERENT numbers, which is why the amounts are 2_000/6_000 against a
    6_000 bucket: creation order first would draw 6_000 from the purchased wallet and 0 from the
    granted one, so prepaid_granted would be nil and prepaid_purchased 6_000, with
    wallet[b06_grt_ftp_granted].balance_cents still 2_000. Both wallets' contributions are
    pinned without an `expect.wallets` list: the granted wallet directly (balance 0, consumed
    2_000) and the purchased wallet as prepaid_credit − prepaid_granted = 4_000. Because one
    wallet is granted-only and the other purchased-only, the breakdown
    (applied_prepaid_credits_service.rb:83-92) maps one-to-one onto the wallets.

- id: b06/granted/fee-types/rounding
  block: B6
  axes: {source: granted, limitation: fee-types, application: rounding}
  dimensions: {interval: monthly, billing_time: calendar, rate_amount: "0.4445", allowed_fee_types: subscription}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    organization: {premium_integrations: [manual_payments]}
    metrics: [{code: b06_grt_ftr_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_grt_ftr, interval: monthly, amount_cents: 5000}
    charges: [{billable_metric_code: b06_grt_ftr_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b06_grt_ftr_cust, currency: EUR}
    subscription: {external_id: golden_b06_grt_ftr_sub, billing_time: calendar}
    wallets:
      - name: subscription only
        code: b06_grt_ftr_w
        rate_amount: "0.4445"
        currency: EUR
        granted_credits: "30"
        paid_credits: "30"
        applies_to: {fee_types: [subscription]}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-02T00:00:00Z", do: pay_invoice, invoice_type: credit}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_grt_ftr_sum, properties: {amount: 10}}
        - {code: b06_grt_ftr_sum, properties: {amount: 30}}
        - {code: b06_grt_ftr_sum, properties: {amount: 20}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      select: {invoice_type: subscription}
      fees_amount_cents: 11000
      prepaid_credit_amount_cents: 2668
      prepaid_granted_credit_amount_cents: 1334
      prepaid_purchased_credit_amount_cents: 1334
      total_amount_cents: 8332
    wallet:
      code: b06_grt_ftr_w
      balance_cents: 0
  math: >-
    Rate 0.4445 with two 30-credit top-ups. Each converts as
    `(30 × 0.4445).round(2) × 100` = 13.335 → 13.34 → 1_334¢ (wallet_credit.rb:26-27, HALF-UP),
    so the settled balance is 2_668¢. Truncating the third decimal instead gives 13.33 → 1_333¢
    twice = 2_666¢: name both, 2_668 vs 2_666, and the invoice total 8_332 vs 8_334. The error
    doubles because each top-up rounds independently — a per-wallet rounding of the 60-credit
    total (60 × 0.4445 = 26.67 → 2_667¢) is a third candidate and also wrong.
    The wallet may only pay `subscription` fees, so the reachable bucket is the 5_000¢
    subscription fee; the 6_000¢ charge fee is skipped by `applicable_fee?`
    (allocate_prepaid_credits_by_wallets_service.rb:108-122) and stays owed in cash. The draw is
    min(5000, 2668, 11000) = 2_668, the whole balance, so total = 11_000 − 2_668 = 8_332 and the
    wallet ends empty. Granted goes first (wallet_transaction.rb:81-88) and here both pools are
    equal at 1_334, but the split is still load-bearing: the purchased inbound is created first
    (create_from_params_service.rb:36-53), so a created_at FIFO would report prepaid_purchased
    1_334 and prepaid_granted 1_334 only by coincidence of equal pools — the assertion that
    matters is that BOTH are non-nil, which fails under any order that drains one pool first.

- id: b06/granted/fee-types/negative-total
  block: B6
  axes: {source: granted, limitation: fee-types, application: negative-total}
  dimensions: {interval: monthly, billing_time: calendar, allowed_fee_types: subscription}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    organization: {premium_integrations: [manual_payments]}
    metrics: [{code: b06_grt_ftn_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_grt_ftn, interval: monthly, amount_cents: 5000}
    charges: [{billable_metric_code: b06_grt_ftn_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b06_grt_ftn_cust, currency: EUR}
    subscription: {external_id: golden_b06_grt_ftn_sub, billing_time: calendar}
    wallets:
      - name: subscription only, over-funded
        code: b06_grt_ftn_w
        rate_amount: "1"
        currency: EUR
        granted_credits: "30"
        paid_credits: "110"
        applies_to: {fee_types: [subscription]}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-02T00:00:00Z", do: pay_invoice, invoice_type: credit}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_grt_ftn_sum, properties: {amount: 10}}
        - {code: b06_grt_ftn_sum, properties: {amount: 30}}
        - {code: b06_grt_ftn_sum, properties: {amount: 20}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      select: {invoice_type: subscription}
      fees_amount_cents: 11000
      prepaid_credit_amount_cents: 5000
      prepaid_granted_credit_amount_cents: 3000
      prepaid_purchased_credit_amount_cents: 2000
      total_amount_cents: 6000
      fees:
        - {fee_type: subscription, amount_cents: 5000}
        - {fee_type: charge, amount_cents: 6000, units: "60"}
    wallet:
      code: b06_grt_ftn_w
      balance_cents: 9000
  math: >-
    The wallet holds 14_000¢ (30 granted + 110 purchased) against an 11_000¢ invoice, so it could
    over-pay the whole invoice, let alone its allowed slice. Two clamps could fire and only one
    does. The limitation clamp: `applicable_fee?`
    (allocate_prepaid_credits_by_wallets_service.rb:108-122) with types=["subscription"] admits
    only the 5_000¢ subscription bucket, so the 6_000¢ charge bucket is never touched. The draw
    is min(5000, 14000, 11000) = 5_000. The invoice clamp never has to fire here, which is the
    finding: the ALLOWED SLICE bounds the draw before `remaining_invoice_amount` does.
    Result: prepaid 5_000, total 6_000 — exactly the charge fee, owed in cash — and the wallet
    keeps 9_000. Name the alternatives: (a) limitation ignored → prepaid 11_000, total 0, wallet
    3_000; (b) neither clamp → total −3_000 with a 14_000 draw; (c) the surplus refunded as a
    credit note — no credit note is created. Asserting the total alone cannot separate these from
    the truth, so balance_cents 9_000 and the per-fee split are asserted too.
    Pools: 3_000 granted then 2_000 purchased (wallet_transaction.rb:81-88); a created_at FIFO
    would report 0 granted / 5_000 purchased.

- id: b06/granted/fee-types/ongoing-balance
  block: B6
  axes: {source: granted, limitation: fee-types, application: ongoing-balance}
  dimensions: {interval: monthly, billing_time: calendar, allowed_fee_types: subscription, read_at: mid-period}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    organization: {premium_integrations: [manual_payments]}
    metrics: [{code: b06_grt_fto_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_grt_fto, interval: monthly, amount_cents: 5000}
    charges: [{billable_metric_code: b06_grt_fto_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b06_grt_fto_cust, currency: EUR}
    subscription: {external_id: golden_b06_grt_fto_sub, billing_time: calendar}
    wallets:
      - name: subscription only
        code: b06_grt_fto_w
        rate_amount: "1"
        currency: EUR
        granted_credits: "20"
        paid_credits: "30"
        applies_to: {fee_types: [subscription]}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-02T00:00:00Z", do: pay_invoice, invoice_type: credit}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_grt_fto_sum, properties: {amount: 10}}
        - {code: b06_grt_fto_sum, properties: {amount: 30}}
        - {code: b06_grt_fto_sum, properties: {amount: 20}}
    - {at: "2024-03-10T00:00:00Z", do: perform_wallet_refresh}
  expect:
    invoices: 1
    wallet:
      code: b06_grt_fto_w
      balance_cents: 5000
      ongoing_usage_balance_cents: 0
      ongoing_balance_cents: 5000
  math: >-
    The mid-period path (Wallets::Balance::AllocateOngoingUsageByWalletsService, reached via
    Clock::RefreshWalletsOngoingBalanceJob → Customers::RefreshWalletsService), and the row where
    the fee-type limitation bites hardest. The pool of unbilled amounts is built from
    `current_usage_fees` (refresh_wallets_service.rb:52-54), which is
    Invoices::CustomerUsageService output — CHARGE fees only; a subscription fee is not usage and
    never appears. This wallet may pay only `subscription` fees, so `applicable_fee?`
    (allocate_ongoing_usage_by_wallets_service.rb:126-137) finds types=["subscription"] against a
    fee_key whose fee_type is "charge": no type match, targets empty but non-empty types means
    `unrestricted_wallet` is false. `applicable` is therefore EMPTY for the only key in the pool,
    and the loop at :45-61 allocates nothing (:40-62 simply moves on — an unallocatable key is
    dropped, not forced onto some wallet).
    So with 6_000¢ of unbilled usage sitting there, ongoing_usage_balance_cents is 0 and
    ongoing_balance_cents = 5_000 − 0 = 5_000 (refresh_ongoing_usage_service.rb:63). The wrong
    answer, and the one a reader expects: 6_000 and −1_000, which is what an implementation that
    ignored allowed_fee_types on the ongoing path would print. The 6_000¢ of charge usage is the
    fee this wallet may not pay for, and it will be owed in cash at period end — the wallet
    reserves nothing against it, which is exactly what the mid-period number should say and the
    reason `depleted_ongoing_balance` never fires here.
    Balance is 20 granted + 30 purchased = 5_000¢; invoices is 1, the `credit` top-up invoice.

- id: b06/granted/billable-metrics/full-cover
  block: B6
  axes: {source: granted, limitation: billable-metrics, application: full-cover}
  dimensions: {interval: monthly, billing_time: calendar}
