    pool are 116¢, where truncation would give 115¢.
    The charge fee is deliberately tiny: 60 units at 0.01 = 60¢, smaller than the wallet. The
    wallet may pay only charge fees, so it pays min(60, 116, 5_060) = 60 and the 5_000¢
    subscription fee is owed in cash. The residue is where the rounding lands: 116 - 60 = 56¢
    stranded on the wallet, or 55¢ under the truncating alternative.
    The limitation is what strands it. Without it the wallet would spend all 116¢ against the
    5_000¢ subscription bucket (consumed first, allocate:89), giving a total of 4_944¢ and a
    balance of 0 — so both the 5_000 total and the 56¢ balance test the limitation, and the 56
    versus 55 tests the rounding.

- id: b06/paid/fee-types/negative-total
