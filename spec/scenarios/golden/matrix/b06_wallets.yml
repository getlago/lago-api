      prepaid_credit_amount_cents: 6000
      prepaid_granted_credit_amount_cents: 3000
      prepaid_purchased_credit_amount_cents: 3000
      total_amount_cents: 2000
    wallet:
      code: b06_grt_bmp_granted
      balance_cents: 0
  math: >-
    Granted-heavy versus paid-heavy again, this time discriminating on billable metric rather
    than fee type. b06_grt_bmp_granted holds 30 granted credits (3_000¢) at priority 1;
    b06_grt_bmp_paid holds 40 purchased (4_000¢) at priority 20; both are limited to metric a and
    the purchased one is declared first so declaration order cannot be mistaken for
    `Wallet.in_application_order` (wallet.rb:69-71, priority ASC then created_at).
    Fees 8_000¢ = metric a 6_000 + metric b 2_000. Only metric a's bucket is reachable by either
    wallet. Wallet at priority 1: min(6000, 3000, 8000) = 3_000, bucket down to 3_000, invoice
    remaining 5_000. Wallet at priority 20: min(3000, 4000, 5000) = 3_000. Prepaid 6_000, total
    2_000 (metric b's fee, cash), balances 0 and 1_000.
    The amounts are chosen so the wrong order gives different numbers on BOTH sides: creation
    order first would draw min(6000, 4000, 8000) = 4_000 from the purchased wallet then
    min(2000, 3000, 4000) = 2_000 from the granted one → prepaid_granted 2_000 /
    prepaid_purchased 4_000, and wallet[b06_grt_bmp_granted].balance_cents 1_000 rather than 0.
    Both wallets are pinned with a single `expect.wallet`: the granted one directly, the
    purchased one as prepaid_credit − prepaid_granted = 3_000, valid because one wallet holds
    only granted and the other only purchased inbounds, so the breakdown
    (applied_prepaid_credits_service.rb:83-92) maps one-to-one onto wallets.

- id: b06/granted/billable-metrics/rounding
  block: B6
  axes: {source: granted, limitation: billable-metrics, application: rounding}
  dimensions: {interval: monthly, billing_time: calendar, rate_amount: "2.2225"}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    organization: {premium_integrations: [manual_payments]}
    metrics:
      - {code: b06_grt_bmr_a, aggregation_type: sum_agg, field_name: amount}
      - {code: b06_grt_bmr_b, aggregation_type: sum_agg, field_name: amount}
    plan: {code: golden_b06_grt_bmr, interval: monthly, amount_cents: 0}
    charges:
      - {billable_metric_code: b06_grt_bmr_a, charge_model: standard, properties: {amount: "1"}}
      - {billable_metric_code: b06_grt_bmr_b, charge_model: standard, properties: {amount: "1"}}
    customer: {external_id: golden_b06_grt_bmr_cust, currency: EUR}
    subscription: {external_id: golden_b06_grt_bmr_sub, billing_time: calendar}
    wallets:
      - name: metric a only
        code: b06_grt_bmr_w
        rate_amount: "2.2225"
        currency: EUR
        granted_credits: "10"
        paid_credits: "10"
        applies_to: {billable_metric_codes: [b06_grt_bmr_a]}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-02T00:00:00Z", do: pay_invoice, invoice_type: credit}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_grt_bmr_a, properties: {amount: 10}}
        - {code: b06_grt_bmr_a, properties: {amount: 30}}
        - {code: b06_grt_bmr_a, properties: {amount: 20}}
        - {code: b06_grt_bmr_b, properties: {amount: 5}}
        - {code: b06_grt_bmr_b, properties: {amount: 10}}
        - {code: b06_grt_bmr_b, properties: {amount: 5}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      select: {invoice_type: subscription}
      fees_amount_cents: 8000
      prepaid_credit_amount_cents: 4446
      prepaid_granted_credit_amount_cents: 2223
      prepaid_purchased_credit_amount_cents: 2223
      total_amount_cents: 3554
    wallet:
      code: b06_grt_bmr_w
      balance_cents: 0
  math: >-
    Rate 2.2225 — above 1, so a credit is worth more than a euro and the rounding runs the other
    way. Each 10-credit top-up converts as `(10 × 2.2225).round(2) × 100` = 22.225 → 22.23 →
    2_223¢ (wallet_credit.rb:26-27), so the settled balance is 4_446¢. Truncating gives 22.22 →
    2_222¢ twice = 4_444¢: name both, 4_446 vs 4_444, with the invoice total 3_554 vs 3_556.
    A third candidate, rounding the 20-credit total once (20 × 2.2225 = 44.45 → 4_445¢), is also
    wrong and is excluded because prepaid_granted and prepaid_purchased are asserted separately at
    2_223 each.
    Fees 8_000¢ (metric a 6_000, metric b 2_000). The wallet is limited to metric a, so the
    reachable bucket is 6_000 and the draw is min(6000, 4446, 8000) = 4_446 — the whole balance.
    Total 8_000 − 4_446 = 3_554, which includes metric b's untouchable 2_000¢ in full. Granted
    is consumed before purchased (wallet_transaction.rb:81-88) even though the purchased inbound
    was created first (create_from_params_service.rb:36-53); with equal pools the discriminator
    is that both breakdown fields are non-nil, which no single-pool-first order produces.

- id: b06/granted/billable-metrics/negative-total
  block: B6
  axes: {source: granted, limitation: billable-metrics, application: negative-total}
  dimensions: {interval: monthly, billing_time: calendar}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
