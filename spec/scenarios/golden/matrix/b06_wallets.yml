    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_twc_tm_rn, properties: {amount: 10, target_wallet_code: b06_twc_tm_rn_a}}
        - {code: b06_twc_tm_rn, properties: {amount: 25, target_wallet_code: b06_twc_tm_rn_a}}
        - {code: b06_twc_tm_rn, properties: {amount: 15, target_wallet_code: b06_twc_tm_rn_a}}
        - {code: b06_twc_tm_rn, properties: {amount: 12, target_wallet_code: b06_twc_tm_rn_b}}
        - {code: b06_twc_tm_rn, properties: {amount: 8, target_wallet_code: b06_twc_tm_rn_b}}
