        - {code: b06_twc_ps_nt, properties: {amount: 12, target_wallet_code: b06_twc_ps_nt_b}}
        - {code: b06_twc_ps_nt, properties: {amount: 8, target_wallet_code: b06_twc_ps_nt_b}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {invoice_type: credit}
        total_amount_cents: 10000
        payment_status: succeeded
