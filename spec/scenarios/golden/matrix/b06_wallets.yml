        applies_to: {fee_types: [charge]}
        recurring_transaction_rules:
          - {trigger: threshold, threshold_credits: "0", method: target, target_ongoing_balance: "0", grants_target_top_up: true}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-03T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_tgt_ftp_sum, properties: {amount: 2}}
        - {code: b06_tgt_ftp_sum, properties: {amount: 6}}
        - {code: b06_tgt_ftp_sum, properties: {amount: 4}}
    - {at: "2024-03-04T00:00:00Z", do: perform_wallet_refresh}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_tgt_ftp_sum, properties: {amount: 10}}
        - {code: b06_tgt_ftp_sum, properties: {amount: 30}}
        - {code: b06_tgt_ftp_sum, properties: {amount: 20}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_amount_cents: 12200
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 1200
      prepaid_granted_credit_amount_cents: 1200
      total_amount_cents: 11000
      fees:
        - {fee_type: subscription, amount_cents: 5000, taxes_amount_cents: 0}
        - {fee_type: charge, item_code: b06_tgt_ftp_sum, amount_cents: 7200, taxes_amount_cents: 0}
  math: >-
    Two things are left owing here and both are asserted. The 5_000¢ subscription fee is the fee the
    charge-limited wallet may NOT pay at all; the remaining 6_000¢ of the charge fee is what the wallet
    could have paid but cannot afford. total_amount_cents 11_000 = 5_000 + 6_000 is the sum of the two,
    and the fee list pins which is which.
    The under-funding is the target rule's own doing. It is sized when it fires: 12 units (2+6+4) =
    1_200¢ of unbilled charge usage exist at the 4 March refresh, credits_ongoing_balance is −12, and
    target_ongoing_balance 0 makes the gap 0 − (−12) = 12 credits = 1_200¢ of GRANTED credit
    (recurring_transaction_rule.rb:138-150, create_from_params_service.rb:145-173 — settled at once, no
    invoice, so invoices stays 1). 60 more units (10/30/20, sum 60 ≠ max 30 ≠ latest 20) then arrive with
    no refresh between, so the charge fee is 72 units × 1.00 = 7_200¢ and the wallet holds 1_200¢:
    min(7_200 bucket cap, 1_200 balance, 12_200 invoice) = 1_200
    (allocate_prepaid_credits_by_wallets_service.rb:53). A rule evaluated at billing time instead would
    have funded 7_200¢ and reported total 5_000; a rule measuring its gap against `balance_cents` would
    have funded nothing and reported total 12_200. Name all three: prepaid 1_200 vs 7_200 vs 0.
    The re-arm after billing is a provable no-op, not an omission: the wallet is drained to 0, the
    synchronous refresh (applied_prepaid_credits_service.rb:39) reports credits_ongoing_balance 0 which
    is not above threshold_credits 0, so the rule runs — and compute_target_top_up_amount returns 0.0
    when ongoing_balance >= target (recurring_transaction_rule.rb:139-141), which
    CreateFromParamsService turns into no transaction at all (:115, :146).

- id: b06/target-method/fee-types/multi-wallet-priority
  block: B6
  axes: {source: target-method, limitation: fee-types, application: multi-wallet-priority}
  dimensions: {interval: monthly, billing_time: calendar, allowed_fee_types: charge, target_ongoing_balance: 10, grants_target_top_up: true}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    organization: {premium_integrations: [manual_payments]}
    metrics: [{code: b06_tgt_ftm_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_tgt_ftm, interval: monthly, amount_cents: 5000}
    charges: [{billable_metric_code: b06_tgt_ftm_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b06_tgt_ftm_cust, currency: EUR}
    subscription: {external_id: golden_b06_tgt_ftm_sub, billing_time: calendar}
    wallets:
      - name: target wallet, low priority
        code: b06_tgt_ftm_target
        rate_amount: "1"
        currency: EUR
        priority: 20
        applies_to: {fee_types: [charge]}
        recurring_transaction_rules:
          - {trigger: threshold, threshold_credits: "0", method: target, target_ongoing_balance: "10", grants_target_top_up: true}
      - name: purchased wallet, high priority
        code: b06_tgt_ftm_paid
        rate_amount: "1"
        currency: EUR
        priority: 1
        paid_credits: "20"
        applies_to: {fee_types: [charge]}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-02T00:00:00Z", do: pay_invoice, invoice_type: credit}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_tgt_ftm_sum, properties: {amount: 10}}
        - {code: b06_tgt_ftm_sum, properties: {amount: 30}}
        - {code: b06_tgt_ftm_sum, properties: {amount: 20}}
    - {at: "2024-03-06T00:00:00Z", do: perform_wallet_refresh}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      select: {invoice_type: subscription}
      fees_amount_cents: 11000
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 6000
      prepaid_granted_credit_amount_cents: 4000
      prepaid_purchased_credit_amount_cents: 2000
      total_amount_cents: 5000
    wallet:
      code: b06_tgt_ftm_target
      balance_cents: 1000
  math: >-
    Two wallets, both limited to fee_type `charge`, declared in the wrong order on purpose because both
    the ongoing cascade and the billing draw follow `Wallet.in_application_order` — priority ASC then
    created_at (wallet.rb:69-71) — not declaration order. b06_tgt_ftm_paid holds 20 PURCHASED credits
    (2_000¢, settled 2 March) at priority 1; b06_tgt_ftm_target holds nothing and carries the target rule
    at priority 20. One purchased-only and one granted-only, so the prepaid breakdown
    (applied_prepaid_credits_service.rb:83-92) maps one-to-one onto the wallets and both contributions are
    pinned though `expect.wallet` names one.
    The 5_000¢ subscription fee is the fee NEITHER wallet may pay, and total_amount_cents 5_000 asserts it
    is still owed in cash: fees are 11_000 (5_000 subscription + 6_000 charge) and prepaid stops at 6_000.
    Priority decides the target top-up's SIZE first. At the 6 March refresh 60 units (10/30/20) = 6_000¢
    of charge usage are unbilled and both wallets are applicable
    (allocate_ongoing_usage_by_wallets_service.rb:126-137). Index 0 is the purchased wallet, not a
    threshold wallet, so it is capped by its own room: min(6_000, 2_000) = 2_000 (:53-55). Index 1 is the
    target wallet, and a threshold wallet absorbs the remainder and may go negative so its rule can refill
    it (:48-51, :139-141), taking 4_000. Its credits_ongoing_balance is −40, not −60, so the rule asks for
    10 − (−40) = 50 credits = 5_000¢ granted. Ignoring the cascade would ask for 70 credits — name both,
    target-wallet balance 1_000 vs 3_000.
    Then priority decides the SPLIT: purchased first takes min(6_000, 2_000, 11_000) = 2_000, the target
    wallet takes min(4_000, 5_000, 9_000) = 4_000
    (allocate_prepaid_credits_by_wallets_service.rb:53-57). Creation order first would give 5_000 granted /
    1_000 purchased with the target wallet emptied. No re-arm: 1_000¢ is credits_ongoing_balance 10, above
    threshold 0 (threshold_top_up_service.rb:20).

- id: b06/target-method/fee-types/rounding
  block: B6
  axes: {source: target-method, limitation: fee-types, application: rounding}
  dimensions: {interval: monthly, billing_time: calendar, rate_amount: "0.6667", allowed_fee_types: charge, target_ongoing_balance: "5.0045"}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    metrics: [{code: b06_tgt_ftr_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_tgt_ftr, interval: monthly, amount_cents: 5000}
    charges: [{billable_metric_code: b06_tgt_ftr_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b06_tgt_ftr_cust, currency: EUR}
    subscription: {external_id: golden_b06_tgt_ftr_sub, billing_time: calendar}
    wallets:
      - name: charges only, fractional rate
        code: b06_tgt_ftr_w
        rate_amount: "0.6667"
        currency: EUR
        applies_to: {fee_types: [charge]}
        recurring_transaction_rules:
          - {trigger: threshold, threshold_credits: "0", method: target, target_ongoing_balance: "5.0045", grants_target_top_up: true}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_tgt_ftr_sum, properties: {amount: 10}}
        - {code: b06_tgt_ftr_sum, properties: {amount: 30}}
        - {code: b06_tgt_ftr_sum, properties: {amount: 20}}
    - {at: "2024-03-06T00:00:00Z", do: perform_wallet_refresh}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_amount_cents: 11000
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 6000
      prepaid_granted_credit_amount_cents: 6000
      total_amount_cents: 5000
      fees:
        - {fee_type: subscription, amount_cents: 5000, taxes_amount_cents: 0}
        - {fee_type: charge, item_code: b06_tgt_ftr_sum, amount_cents: 6000, taxes_amount_cents: 0}
    wallet:
      code: b06_tgt_ftr_w
      balance_cents: 334
  math: >-
    The rounding and the limitation are load-bearing at the same time, and they meet in the residue.
    Ongoing usage is filtered to the charge bucket the wallet is allowed to pay
    (allocate_ongoing_usage_by_wallets_service.rb:126-137) and Invoices::CustomerUsageService emits only
    charge fees, so the pool is 60 units × 1.00 = 6_000¢. credits_ongoing_balance is computed in credits
    by float division into a decimal(30,5) column: −60 / 0.6667 = −89.995500224988…, stored −89.99550
    (refresh_ongoing_usage_service.rb:66-68). target_ongoing_balance 5.0045 makes the gap exact:
    5.0045 − (−89.99550) = 95.00000 credits (recurring_transaction_rule.rb:143).
    Credits become money by `(credit_amount × rate_amount).round(currency.exponent) × 100`
    (wallet_credit.rb:26-27), a HALF-UP round: 95 × 0.6667 = 63.3365 → 63.34 → 6_334¢ of granted credit.
    Truncation would give 63.33 → 6_333¢, and a half-EVEN round would give 63.34 here but 63.33 on the
    truncating reading — name the pair that matters: top-up 6_334 vs 6_333, and because the invoice takes
    exactly 6_000, the wallet ends on 334¢ vs 333¢. That residue is the only place a one-cent rounding
    error survives, and it is asserted below.
    The 5_000¢ subscription fee is the fee the wallet may NOT pay, asserted as still owed in cash:
    fees 11_000, prepaid stops at the charge bucket's 6_000 (min(6_000, 6_334, 11_000),
    allocate_prepaid_credits_by_wallets_service.rb:53 with the buckets built at :70-91 and matched at
    :108-122), total 5_000. A limitation-blind implementation would draw 6_334 and report total 4_666.
    No re-arm: 334¢ is credits_ongoing_balance 5.00975, above threshold_credits 0
    (threshold_top_up_service.rb:20). The wallet balance is asserted because prepaid is 6_000 under either
    rounding — the residue is the only observable difference.

- id: b06/target-method/fee-types/negative-total
  block: B6
  axes: {source: target-method, limitation: fee-types, application: negative-total}
  dimensions: {interval: monthly, billing_time: calendar, rate_amount: 1, allowed_fee_types: charge, target_ongoing_balance: 100}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    metrics: [{code: b06_tgt_ftn_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_tgt_ftn, interval: monthly, amount_cents: 5000}
    charges: [{billable_metric_code: b06_tgt_ftn_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b06_tgt_ftn_cust, currency: EUR}
    subscription: {external_id: golden_b06_tgt_ftn_sub, billing_time: calendar}
    wallets:
      - name: charges only, over-funded
        code: b06_tgt_ftn_w
        rate_amount: "1"
        currency: EUR
        applies_to: {fee_types: [charge]}
        recurring_transaction_rules:
          - {trigger: threshold, threshold_credits: "0", method: target, target_ongoing_balance: "100", grants_target_top_up: true}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_tgt_ftn_sum, properties: {amount: 10}}
        - {code: b06_tgt_ftn_sum, properties: {amount: 30}}
        - {code: b06_tgt_ftn_sum, properties: {amount: 20}}
    - {at: "2024-03-06T00:00:00Z", do: perform_wallet_refresh}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      fees_amount_cents: 11000
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 6000
      prepaid_granted_credit_amount_cents: 6000
      total_amount_cents: 5000
      payment_status: pending
      fees:
        - {fee_type: subscription, amount_cents: 5000, taxes_amount_cents: 0}
        - {fee_type: charge, item_code: b06_tgt_ftn_sum, amount_cents: 6000, taxes_amount_cents: 0}
    wallet:
      code: b06_tgt_ftn_w
      balance_cents: 10000
  math: >-
    The interesting answer here is that with a limitation the invoice total CANNOT go negative, and that
    is worth pinning rather than assuming. target_ongoing_balance 100 against 60 units × 1.00 = 6_000¢ of
    unbilled charge usage funds 100 − (−60) = 160 credits = 16_000¢ of granted credit
    (recurring_transaction_rule.rb:138-150) — more than the whole 11_000¢ invoice. Yet prepaid is 6_000
    and the customer still owes 5_000 in cash, because the draw is capped per FEE BUCKET, not only per
    invoice: `[remaining_amount, remaining_wallet_balance, remaining_invoice_amount].min`
    (allocate_prepaid_credits_by_wallets_service.rb:53) where remaining_amount is the ["charge", metric]
    bucket's 6_000 (:70-91), and the ["subscription", nil] bucket is skipped entirely because the wallet's
    allowed_fee_types does not include it (:108-122).
    Four wrong answers, all named: (a) prepaid 11_000 and total 0, if the limitation were ignored;
    (b) prepaid 16_000 and total −5_000, if the balance drove the draw; (c) the wallet drained to 0 rather
    than left on 10_000; (d) a `credit` invoice or credit note for the 10_000 surplus — none is issued,
    invoices stays 1. payment_status is asserted because a positive total is `pending` while a zero one is
    `succeeded` (calculate_fees_service.rb:63), which is the difference between "the wallet could not
    reach this fee" and "the wallet paid it".
    The 5_000¢ subscription fee is the fee the wallet may not pay and total_amount_cents 5_000 is exactly
    it. No re-arm: 10_000¢ left is credits_ongoing_balance 100, above threshold_credits 0
    (threshold_top_up_service.rb:20).

- id: b06/target-method/fee-types/ongoing-balance
  block: B6
  axes: {source: target-method, limitation: fee-types, application: ongoing-balance}
  dimensions: {interval: monthly, billing_time: calendar, allowed_fee_types: charge, target_ongoing_balance: 15, read_at: mid-period}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    metrics: [{code: b06_tgt_fto_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_tgt_fto, interval: monthly, amount_cents: 5000}
    charges: [{billable_metric_code: b06_tgt_fto_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b06_tgt_fto_cust, currency: EUR}
    subscription: {external_id: golden_b06_tgt_fto_sub, billing_time: calendar}
    wallets:
      - name: charges only, read mid-period
        code: b06_tgt_fto_w
        rate_amount: "1"
        currency: EUR
        applies_to: {fee_types: [charge]}
        recurring_transaction_rules:
          - {trigger: threshold, threshold_credits: "0", method: target, target_ongoing_balance: "15", grants_target_top_up: true}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_tgt_fto_sum, properties: {amount: 10}}
        - {code: b06_tgt_fto_sum, properties: {amount: 30}}
        - {code: b06_tgt_fto_sum, properties: {amount: 20}}
    - {at: "2024-03-06T00:00:00Z", do: perform_wallet_refresh}
  expect:
    invoices: 0
    wallet:
      code: b06_tgt_fto_w
      balance_cents: 7500
      ongoing_usage_balance_cents: 6000
      ongoing_balance_cents: 1500
  math: >-
    A mid-period read on a different code path — Clock::RefreshWalletsOngoingBalanceJob (premium-gated,
    refresh_wallets_ongoing_balance_job.rb:8) → Customers::RefreshWalletsService →
    Wallets::Balance::AllocateOngoingUsageByWalletsService, which reimplements the billing allocator
    rather than sharing it (allocate_ongoing_usage_by_wallets_service.rb:33-65). No invoice is built at
    all, which is why invoices is 0 and consumed_amount_cents is 0.
    The cell's whole content is what a fee-type limitation does to the pool a target rule measures. The
    plan carries a 5_000¢ monthly subscription fee, but Invoices::CustomerUsageService emits only CHARGE
    fees, so the ongoing pool is the 60 units × 1.00 = 6_000¢ of usage and nothing else — the upcoming
    subscription fee is invisible here even though the wallet's `charge` limitation would forbid paying it
    anyway. Ongoing usage is pooled as `fee.amount_cents + fee.taxes_amount_cents` (:90), the wallet is
    applicable (:126-137), it is a threshold wallet so it absorbs the lot and is allowed to go negative
    (:48-51, :139-141): ongoing_usage_balance_cents 6_000, ongoing_balance_cents −6_000,
    credits_ongoing_balance −60 (refresh_ongoing_usage_service.rb:62-68). That change arms the rule
    (`state_changed`, update_ongoing_service.rb:18-19; without it threshold_top_up_service.rb:18 skips
    outright), and the gap is 15 − (−60) = 75 credits = 7_500¢ granted
    (recurring_transaction_rule.rb:138-150). IncreaseService re-enqueues the refresh
    (increase_service.rb:36) and the second pass reports ongoing_balance 7_500 − 6_000 = 1_500 = 15
    credits, above threshold 0, so the rule stops (:20) — the target is reached exactly, in one top-up.
    The discriminating numbers: if the ongoing pool had included the 5_000¢ subscription fee the gap would
    have been 15 − (−110) = 125 credits, so balance_cents 7_500 vs 12_500 and ongoing_usage_balance_cents
    6_000 vs 11_000 — while ongoing_balance_cents would be 1_500 either way, which is exactly why
    asserting only the ongoing balance would let the wrong implementation pass.

- id: b06/target-method/billable-metrics/full-cover
  block: B6
  axes: {source: target-method, limitation: billable-metrics, application: full-cover}
  dimensions: {interval: monthly, billing_time: calendar, rate_amount: 1, target_ongoing_balance: 20, grants_target_top_up: false}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    organization: {premium_integrations: [manual_payments]}
    metrics:
      - {code: b06_tgt_bmf_cov, aggregation_type: sum_agg, field_name: amount}
      - {code: b06_tgt_bmf_oth, aggregation_type: sum_agg, field_name: amount}
    plan: {code: golden_b06_tgt_bmf, interval: monthly, amount_cents: 0}
    charges:
      - {billable_metric_code: b06_tgt_bmf_cov, charge_model: standard, properties: {amount: "1"}}
      - {billable_metric_code: b06_tgt_bmf_oth, charge_model: standard, properties: {amount: "1"}}
    customer: {external_id: golden_b06_tgt_bmf_cust, currency: EUR}
    subscription: {external_id: golden_b06_tgt_bmf_sub, billing_time: calendar}
    wallets:
      - name: one metric only, target
        code: b06_tgt_bmf_w
        rate_amount: "1"
        currency: EUR
        applies_to: {billable_metric_codes: [b06_tgt_bmf_cov]}
        recurring_transaction_rules:
          - {trigger: threshold, threshold_credits: "0", method: target, target_ongoing_balance: "20"}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_tgt_bmf_cov, properties: {amount: 10}}
        - {code: b06_tgt_bmf_cov, properties: {amount: 30}}
        - {code: b06_tgt_bmf_cov, properties: {amount: 20}}
        - {code: b06_tgt_bmf_oth, properties: {amount: 4}}
        - {code: b06_tgt_bmf_oth, properties: {amount: 12}}
        - {code: b06_tgt_bmf_oth, properties: {amount: 8}}
    - {at: "2024-03-06T00:00:00Z", do: perform_wallet_refresh}
    - {at: "2024-03-07T00:00:00Z", do: pay_invoice, invoice_type: credit}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {invoice_type: credit}
        fees_amount_cents: 8000
        total_amount_cents: 8000
      - select: {invoice_type: subscription}
        fees_amount_cents: 8400
        taxes_amount_cents: 0
        prepaid_credit_amount_cents: 6000
        prepaid_purchased_credit_amount_cents: 6000
        total_amount_cents: 2400
        fees:
          - {fee_type: subscription, amount_cents: 0}
          - {fee_type: charge, item_code: b06_tgt_bmf_cov, amount_cents: 6000, taxes_amount_cents: 0}
          - {fee_type: charge, item_code: b06_tgt_bmf_oth, amount_cents: 2400, taxes_amount_cents: 0}
  math: >-
    Two metered charges, three events each so sum is distinguishable from max and latest on both:
    b06_tgt_bmf_cov 10/30/20 → 60 units → 6_000¢, b06_tgt_bmf_oth 4/12/8 → 24 units → 2_400¢. The wallet
    is limited to b06_tgt_bmf_cov, so b06_tgt_bmf_oth's 2_400¢ is the fee it may NOT pay and
    total_amount_cents 2_400 asserts it is still owed in cash. Discriminating on metric rather than on fee
    kind is a separate lookup — `wallet_targets` matched as ["charge", billable_metric_id] rather than
    allowed_fee_types (allocate_prepaid_credits_by_wallets_service.rb:37-42, :108-122) — which is why it
    needs its own rows.
    The limitation shapes the target rule as well, and only a target rule can show that. The ongoing
    allocation applies the same predicate (allocate_ongoing_usage_by_wallets_service.rb:126-137), so the
    covered bucket's 6_000¢ is absorbed by the wallet (threshold wallets take the remainder and may go
    negative, :48-51, :139-141) while the other metric's 2_400¢ has NO applicable wallet and is allocated
    to nobody. credits_ongoing_balance is therefore −60, not −84, and the rule asks for 20 − (−60) = 80
    credits = 8_000¢ (recurring_transaction_rule.rb:138-150). A limitation-blind ongoing read would have
    asked for 20 − (−84) = 104 credits: name both, top-up 8_000¢ vs 10_400¢.
    grants_target_top_up is omitted so it is false and the top-up is PURCHASED — pending on creation with
    its own `credit` invoice, asserted at 8_000¢, which pins the computed amount directly
    (create_from_params_service.rb:114-143); hence invoices 2 and the 7 March settlement before the
    credits can be spent. At billing the wallet draws min(6_000 covered bucket, 8_000 balance, 8_400
    invoice) = 6_000 and skips the other bucket entirely, leaving 2_000¢ unspent. prepaid_purchased is the
    whole 6_000 and prepaid_granted is unset: a non-granted target top-up lands entirely in the purchased
    pool (applied_prepaid_credits_service.rb:83-92).

