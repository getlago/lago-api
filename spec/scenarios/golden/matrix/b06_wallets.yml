      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 12664
      prepaid_granted_credit_amount_cents: 12664
      total_amount_cents: 3332
    wallet:
      code: b06_twc_tm_rn_b
      balance_cents: 7334
  math: >-
    A target top-up whose credit amount is a half-cent, and the numbers are chosen so the gap itself is
    exact. Charge rate 1.333 makes 50 units cost 66.65 → 6_665¢, and wallet a's rate is 0.6665, so at
