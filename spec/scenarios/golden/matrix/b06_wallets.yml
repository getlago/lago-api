        recurring_transaction_rules:
          - {trigger: threshold, method: fixed, threshold_credits: "20", granted_credits: "40"}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_thr_bf_cov, properties: {amount: 10}}
        - {code: b06_thr_bf_cov, properties: {amount: 30}}
        - {code: b06_thr_bf_cov, properties: {amount: 20}}
        - {code: b06_thr_bf_oth, properties: {amount: 5}}
        - {code: b06_thr_bf_oth, properties: {amount: 15}}
        - {code: b06_thr_bf_oth, properties: {amount: 10}}
    - {at: "2024-03-10T00:00:00Z", do: perform_wallet_refresh}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      fees_amount_cents: 9000
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 6000
      prepaid_granted_credit_amount_cents: 6000
      total_amount_cents: 3000
      payment_status: pending
      fees:
        - {fee_type: subscription, amount_cents: 0}
        - {fee_type: charge, item_code: b06_thr_bf_cov, amount_cents: 6000, units: "60"}
        - {fee_type: charge, item_code: b06_thr_bf_oth, amount_cents: 3000, units: "30"}
    wallet:
      code: b06_thr_bf_w
      balance_cents: 3000
  math: >-
    Same shape as the fee-types full-cover row but discriminating on METRIC rather than fee kind —
    separate rows because they are separate branches of `applicable_fee?`
    (allocate_prepaid_credits_by_wallets_service.rb:105-121: `targets` from wallet_targets versus
    `types` from allowed_fee_types). Two charges, each with three events so sum is distinguishable
    from max and latest: 10/30/20 → 60 units → 6_000¢ on the covered metric, 5/15/10 → 30 units →
    3_000¢ on the other, 9_000¢ of fees.
    Mid-period the pool has two keys, [charge, cov_id] = 6_000 and [charge, oth_id] = 3_000. The
    wallet's targets are [["charge", cov_id]] and its types are empty, so for the `oth` key there is
    no target match, no type match, and `unrestricted_wallet` is false because targets is non-empty
    (allocate_ongoing_usage_by_wallets_service.rb:126-137) — `applicable` is empty for it and it is
    dropped. For the `cov` key the threshold wallet absorbs the whole 6_000 rather than being capped
    at its balance (:48-51, `balance: threshold ? 0` at :74), so ongoing_balance_cents = 5_000 −
    6_000 = −1_000, −10 credits ≤ 20, and the rule fires once for a flat 40 granted credits →
    9_000¢; the cascade refresh sees 3_000 (30 credits > 20) and stops.
    At billing the buckets sort descending, so `cov` (6_000) is drawn first: min(6000, 9000, 9000) =
    6_000, and the `oth` bucket is then skipped by the same target mismatch. Prepaid 6_000, total
    3_000 — the whole `oth` charge fee, owed in cash: the fee this wallet may not pay for. Balance
    ends 3_000, consumed 6_000, and the post-billing refresh leaves it there (April usage 0, 30
    credits > 20).
    Counterfactuals: ignoring wallet_targets at billing → prepaid 9_000, total 0, balance 0;
    ignoring them mid-period → ongoing_usage 9_000, ongoing_balance −4_000, two top-ups and a
    13_000¢ balance before billing. Without the threshold top-up at all the wallet would have held
    5_000: prepaid 5_000, total 4_000, balance 0.

- id: b06/threshold-rule/billable-metrics/partial-cover
  block: B6
  axes: {source: threshold-rule, limitation: billable-metrics, application: partial-cover}
  dimensions: {interval: monthly, billing_time: calendar, refresh: after-billing-only}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    metrics:
      - {code: b06_thr_bp_cov, aggregation_type: sum_agg, field_name: amount}
      - {code: b06_thr_bp_oth, aggregation_type: sum_agg, field_name: amount}
    plan: {code: golden_b06_thr_bp, interval: monthly, amount_cents: 0}
    charges:
      - {billable_metric_code: b06_thr_bp_cov, charge_model: standard, properties: {amount: "1"}}
      - {billable_metric_code: b06_thr_bp_oth, charge_model: standard, properties: {amount: "1"}}
    customer: {external_id: golden_b06_thr_bp_cust, currency: EUR}
    subscription: {external_id: golden_b06_thr_bp_sub, billing_time: calendar}
    wallets:
      - name: one metric only, refilled too late
        code: b06_thr_bp_w
        rate_amount: "1"
        currency: EUR
        granted_credits: "30"
        applies_to: {billable_metric_codes: [b06_thr_bp_cov]}
        recurring_transaction_rules:
          - {trigger: threshold, method: fixed, threshold_credits: "10", granted_credits: "40"}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_thr_bp_cov, properties: {amount: 10}}
        - {code: b06_thr_bp_cov, properties: {amount: 30}}
        - {code: b06_thr_bp_cov, properties: {amount: 20}}
        - {code: b06_thr_bp_oth, properties: {amount: 5}}
        - {code: b06_thr_bp_oth, properties: {amount: 15}}
        - {code: b06_thr_bp_oth, properties: {amount: 10}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      fees_amount_cents: 9000
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 3000
      prepaid_granted_credit_amount_cents: 3000
      total_amount_cents: 6000
      payment_status: pending
      fees:
        - {fee_type: subscription, amount_cents: 0}
        - {fee_type: charge, item_code: b06_thr_bp_cov, amount_cents: 6000, units: "60"}
        - {fee_type: charge, item_code: b06_thr_bp_oth, amount_cents: 3000, units: "30"}
    wallet:
      code: b06_thr_bp_w
      balance_cents: 4000
  math: >-
    Partial cover twice over, on the metric axis: the wallet runs dry half-way through the metric it
    is allowed to pay, and the other metric is untouched. Fees 9_000¢ — 60 units (10/30/20) × 1.00
    on the covered metric, 30 units (5/15/10) × 1.00 on the other.
    No mid-period refresh, so the rule is still asleep when the invoice is built: `perform_billing`
    runs Clock::SubscriptionsBillerJob, never Clock::RefreshWalletsOngoingBalanceJob, and
    credits_ongoing_balance is still the 30 set at wallet creation, 30 > 10 at
    threshold_top_up_service.rb:20. The wallet therefore has only its 30 granted credits = 3_000¢.
    The `oth` bucket is skipped outright by `applicable_fee?`
    (allocate_prepaid_credits_by_wallets_service.rb:105-121) — targets is [["charge", cov_id]], so
    no target match, no type match, `unrestricted_wallet` false — and the `cov` bucket (drawn first,
    buckets sort descending at :88) takes min(6000, 3000, 9000) = 3_000, emptying the wallet.
    Total 6_000¢ = the 3_000 of `cov` charge the credits could not reach plus the whole 3_000 of
    `oth`; both halves are cash and payment_status is pending.
    Only after the credits are consumed does the refresh run
    (applied_prepaid_credits_service.rb:34-39: DecreaseService with `skip_refresh: true`, then
    Customers::RefreshWalletsService), by which time the balance is 0 and the new April period has
    no usage: ongoing_balance_cents = 0, 0 credits ≤ 10, and the rule fires for a flat 40 granted
    credits. The wallet ends at 4_000¢ — more than the 3_000 it spent — while 6_000¢ went out as
    cash, because the top-up is sized by the rule and not by the shortfall
    (recurring_transaction_rule.rb:104-111).
    Named counterfactuals: refreshing (and topping up) before applying credits → prepaid 6_000,
    total 3_000, balance 1_000; ignoring wallet_targets → prepaid 3_000 still, the wallet being the
    binding constraint, but drawn off the `oth` bucket first, which is why the per-fee split is
    asserted — the totals alone cannot tell the two apart.

- id: b06/threshold-rule/billable-metrics/multi-wallet-priority
  block: B6
  axes: {source: threshold-rule, limitation: billable-metrics, application: multi-wallet-priority}
  dimensions: {interval: monthly, billing_time: calendar, priorities: "1 threshold / 20 purchased"}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
