        priority: 1
        recurring_transaction_rules:
          - {trigger: threshold, threshold_credits: "0", method: target, target_ongoing_balance: "50", grants_target_top_up: true}
      - {name: rich neighbour, code: b06_twc_tm_rn_b, rate_amount: "1", currency: EUR, granted_credits: "100", priority: 20}
  timeline:
