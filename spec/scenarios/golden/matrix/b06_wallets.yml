        - {code: b06_stl_bmn_a, properties: {amount: 30}}
        - {code: b06_stl_bmn_a, properties: {amount: 20}}
        - {code: b06_stl_bmn_b, properties: {amount: 5}}
        - {code: b06_stl_bmn_b, properties: {amount: 10}}
        - {code: b06_stl_bmn_b, properties: {amount: 5}}
    - {at: "2024-03-06T00:00:00Z", do: top_up_wallet, params: {paid_credits: "40"}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 3
    invoice:
      select: {invoice_type: subscription}
      fees_amount_cents: 8000
      prepaid_credit_amount_cents: 6000
      prepaid_purchased_credit_amount_cents: 6000
      total_amount_cents: 2000
      fees:
        - {fee_type: subscription, amount_cents: 0}
        - {fee_type: charge, item_code: b06_stl_bmn_a, amount_cents: 6000, units: "60"}
        - {fee_type: charge, item_code: b06_stl_bmn_b, amount_cents: 2000, units: "20"}
    wallet:
      code: b06_stl_bmn_w
      balance_cents: 6000
  math: >-
    12_000¢ of settled purchased credit against an 8_000¢ invoice — enough to drive the total
    negative by 4_000. It does not. The metric limitation caps the reachable amount at metric a's
    6_000¢ bucket (allocate_prepaid_credits_by_wallets_service.rb:108-122, matching through
