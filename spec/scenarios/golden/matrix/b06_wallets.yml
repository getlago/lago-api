    charges: [{billable_metric_code: b06_tgt_ftp_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b06_tgt_ftp_cust, currency: EUR}
    subscription: {external_id: golden_b06_tgt_ftp_sub, billing_time: calendar}
    wallets:
      - name: charges only, target zero
        code: b06_tgt_ftp_w
