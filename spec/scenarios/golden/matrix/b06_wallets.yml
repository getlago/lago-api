    40 units → 4_000¢ tagged b06_twc_ps_fc_b, and the 0¢ subscription fee. Wallet a holds the whole
    invoice's worth and still pays only its own bucket, min(6_000, 10_000, 10_000) = 6_000
    (allocate_prepaid_credits_by_wallets_service.rb:53, gated by :109-114): full cover of the allowed
    slice with 4_000¢ of surplus that may NOT touch the b-tagged fee. Wallet b pays min(4_000, 1_000,
    4_000) = 1_000, so 3_000¢ is owed in cash.
