  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-02T00:00:00Z", do: pay_invoice, invoice_type: credit}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_grt_bmf_a, properties: {amount: 10}}
        - {code: b06_grt_bmf_a, properties: {amount: 30}}
        - {code: b06_grt_bmf_a, properties: {amount: 20}}
        - {code: b06_grt_bmf_b, properties: {amount: 5}}
        - {code: b06_grt_bmf_b, properties: {amount: 10}}
        - {code: b06_grt_bmf_b, properties: {amount: 5}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      select: {invoice_type: subscription}
      fees_amount_cents: 8000
      prepaid_credit_amount_cents: 6000
      prepaid_granted_credit_amount_cents: 2000
      prepaid_purchased_credit_amount_cents: 4000
      total_amount_cents: 2000
      fees:
        - {fee_type: subscription, amount_cents: 0}
        - {fee_type: charge, item_code: b06_grt_bmf_a, amount_cents: 6000, units: "60"}
        - {fee_type: charge, item_code: b06_grt_bmf_b, amount_cents: 2000, units: "20"}
    wallet:
      code: b06_grt_bmf_w
      balance_cents: 2000
  math: >-
    Two charges on the same subscription: metric a sums 10+30+20 = 60 units → 6_000¢, metric b
    sums 5+10+5 = 20 units → 2_000¢, fees 8_000¢. Three events per metric so sum is
    distinguishable from max and latest. The wallet is limited to metric a and holds 8_000¢
    (20 granted + 60 purchased): "full cover" of its allowed slice, with a surplus left over.
    Buckets are keyed `[fee_type, billable_metric_id]` and sorted by descending amount
    (allocate_prepaid_credits_by_wallets_service.rb:82-89), so metric a's 6_000 is offered first.
    `applicable_fee?` (:108-122) matches it via `targets` — the wallet_targets array is
    `[["charge", bm_a_id]]` (:37-41) — and metric b's key matches neither targets nor types, so
    it is skipped. Draw: min(6000, 8000, 8000) = 6_000. Total 8_000 − 6_000 = 2_000, exactly
    metric b's fee, owed in cash; wallet keeps 2_000.
    This is a DIFFERENT lookup from the fee-types rows (wallet_targets versus
    allowed_fee_types, ORed at :121), which is why both limitations get their own rows. Name the
    wrong answers: a wallet ignoring wallet_targets takes 8_000 and leaves 0 owed; one that
    matched on fee_type alone would also take 8_000 because both fees are `charge`. Asserting
    the per-fee amounts alongside prepaid_credit_amount_cents 6_000 excludes both.
    Pools: 2_000 granted then 4_000 purchased (wallet_transaction.rb:81-88); created_at FIFO
    would give 0 granted / 6_000 purchased.

- id: b06/granted/billable-metrics/multi-wallet-priority
  block: B6
  axes: {source: granted, limitation: billable-metrics, application: multi-wallet-priority}
  dimensions: {interval: monthly, billing_time: calendar}
