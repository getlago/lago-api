    plan: {code: golden_b06_twc_tm_pc, interval: monthly, amount_cents: 0}
    charges:
      - billable_metric_code: b06_twc_tm_pc
        charge_model: standard
        properties: {amount: "1"}
        accepts_target_wallet: true
    customer: {external_id: golden_b06_twc_tm_pc_cust, currency: EUR}
    subscription: {external_id: golden_b06_twc_tm_pc_sub, billing_time: calendar}
    wallets:
      - name: targeted target top-up
        code: b06_twc_tm_pc_a
        rate_amount: "1"
        currency: EUR
        priority: 1
        recurring_transaction_rules:
          - {trigger: threshold, threshold_credits: "0", method: target, target_ongoing_balance: "10", grants_target_top_up: true}
      - {name: rich neighbour, code: b06_twc_tm_pc_b, rate_amount: "1", currency: EUR, granted_credits: "100", priority: 20}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-03T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_twc_tm_pc, properties: {amount: 10, target_wallet_code: b06_twc_tm_pc_a}}
    - {at: "2024-03-04T00:00:00Z", do: perform_wallet_refresh}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_twc_tm_pc, properties: {amount: 30, target_wallet_code: b06_twc_tm_pc_a}}
        - {code: b06_twc_tm_pc, properties: {amount: 20, target_wallet_code: b06_twc_tm_pc_a}}
        - {code: b06_twc_tm_pc, properties: {amount: 25, target_wallet_code: b06_twc_tm_pc_b}}
        - {code: b06_twc_tm_pc, properties: {amount: 15, target_wallet_code: b06_twc_tm_pc_b}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      fees_count: 3
      fees_amount_cents: 10000
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 6000
      prepaid_granted_credit_amount_cents: 6000
      total_amount_cents: 4000
    wallet:
      code: b06_twc_tm_pc_b
      balance_cents: 6000
  math: >-
    A target rule is sized WHEN IT FIRES, against the usage visible at that instant and — under this
    limitation — only the usage TAGGED FOR IT. Only 10 a-tagged units (1_000¢) exist at the 4 March
    refresh: wallet a is given its own bucket alone
    (allocate_ongoing_usage_by_wallets_service.rb:118-130), so ongoing_balance = 0 − 1_000 = −1_000 and
    credits_ongoing_balance = −10 ≤ threshold 0 (threshold_top_up_service.rb:20-21). The gap is
    10 − (−10) = 20 credits = 2_000¢ (recurring_transaction_rule.rb:138-150), granted so it settles at
    once with no invoice — invoices stays 1. The re-refresh reads (2_000 − 1_000)/100 = 10 credits,
    which is not below the target, so it stops.
    Then 50 more a-tagged units and 40 b-tagged units arrive with no refresh between, so at billing the
    fees are 6_000¢ tagged a (10/30/20 across the two batches: sum 60 ≠ max 30 ≠ latest 20), 4_000¢
    tagged b and the 0¢ subscription fee. Wallet a is confined to its own bucket and holds a third of
    it: min(6_000, 2_000, 10_000) = 2_000 and it empties
    (allocate_prepaid_credits_by_wallets_service.rb:53). Wallet b pays its own 4_000¢ in full and keeps
    6_000¢ that `applicable_fee?` (:109-114) forbids it from putting against a's remainder, so 4_000¢
    is owed in CASH.
    Wallet b is the asserted wallet: a ends at 0 under every variant, and its rule re-arms after billing
    — the synchronous refresh at applied_prepaid_credits_service.rb:39 sees balance 0 and no usage, so
    credits_ongoing_balance 0 is below the target of 10 and a fresh 10-credit grant lands after the
    invoice is final. Named alternatives: a rule measuring the gap against `balance_cents` would ask for
    10 credits, prepaid 5_000 and total 5_000; a tag-blind allocator merges the buckets so b covers a's
    shortfall, prepaid 10_000, total 0 and b at 2_000¢. Name both: b 6_000 vs 2_000, total 4_000 vs 0.

