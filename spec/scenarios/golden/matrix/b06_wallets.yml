    charges:
      - billable_metric_code: b06_twc_th_fc
        charge_model: standard
        properties: {amount: "1"}
        accepts_target_wallet: true
    customer: {external_id: golden_b06_twc_th_fc_cust, currency: EUR}
    subscription: {external_id: golden_b06_twc_th_fc_sub, billing_time: calendar}
    wallets:
      - name: targeted auto refilled
        code: b06_twc_th_fc_a
        rate_amount: "1"
        currency: EUR
        granted_credits: "20"
        priority: 1
        recurring_transaction_rules:
          - {trigger: threshold, method: fixed, threshold_credits: "0", granted_credits: "80"}
      - {name: targeted poor, code: b06_twc_th_fc_b, rate_amount: "1", currency: EUR, granted_credits: "10", priority: 20}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_twc_th_fc, properties: {amount: 10, target_wallet_code: b06_twc_th_fc_a}}
        - {code: b06_twc_th_fc, properties: {amount: 30, target_wallet_code: b06_twc_th_fc_a}}
        - {code: b06_twc_th_fc, properties: {amount: 20, target_wallet_code: b06_twc_th_fc_a}}
        - {code: b06_twc_th_fc, properties: {amount: 25, target_wallet_code: b06_twc_th_fc_b}}
        - {code: b06_twc_th_fc, properties: {amount: 15, target_wallet_code: b06_twc_th_fc_b}}
    - {at: "2024-03-10T00:00:00Z", do: perform_wallet_refresh}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 1
    invoice:
      invoice_type: subscription
      fees_count: 3
      fees_amount_cents: 10000
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 7000
      prepaid_granted_credit_amount_cents: 7000
      total_amount_cents: 3000
    wallet:
      code: b06_twc_th_fc_a
      balance_cents: 4000
  math: >-
    The tag decides how much unbilled usage the wallet can SEE, and therefore how often its threshold
    rule fires — the interaction no `limitation: none` row can express. A threshold rule has one call
    site, `Wallets::Balance::UpdateOngoingService`'s after_commit (update_ongoing_service.rb:26), so
    `perform_wallet_refresh` is the verb that arms it, and the rule needs a premium licence
    (recurring_transaction_rules/create_service.rb:16).
    Two tagged charge fees (fees/charge_service.rb:496-499): 6_000¢ tagged b06_twc_th_fc_a (10/30/20:
    sum 60 ≠ max 30 ≠ latest 20) and 4_000¢ tagged b06_twc_th_fc_b. At the 10 March refresh the
    ongoing allocator gives wallet a ONLY its own bucket — each key's `applicable` list holds the one
    wallet whose code matches (allocate_ongoing_usage_by_wallets_service.rb:118-130), and a wallet with
    an active threshold rule absorbs its whole applicable pool with no room check (:47-58, `balance:
    threshold ? 0` at :74). So ongoing_usage is 6_000, ongoing_balance = 2_000 − 6_000 = −1_000
    (refresh_ongoing_usage_service.rb:63) and credits_ongoing_balance −10 ≤ 0: the rule fires ONCE for
    a flat 80 granted credits (recurring_transaction_rule.rb:104-111 — a non-target rule returns
    granted_credits unchanged), balance 10_000¢. The cascade re-refresh then reads 10_000 − 6_000 =
    3_000, i.e. 40 credits > 0, and stops.
    At billing wallet a pays only its own bucket, min(6_000, 10_000, 10_000) = 6_000
    (allocate_prepaid_credits_by_wallets_service.rb:53 gated by :109-114) — full cover of the allowed
    slice with 4_000¢ of surplus — and wallet b pays min(4_000, 1_000, 4_000) = 1_000. Prepaid 7_000,
    total 3_000 owed in cash that wallet a's surplus may not touch. The post-billing refresh
    (applied_prepaid_credits_service.rb:39) sees April usage 0 and 40 credits > 0, so nothing re-arms.
    Tag-blind, the wallet would absorb the entire 10_000¢ pool: credits_ongoing_balance −80 fires 80,
    the re-refresh lands on exactly 0 credits which is NOT > 0 so it fires a SECOND time, and the
    wallet reaches 18_000¢, pays the whole merged bucket and ends at 8_000¢ with total 0. Name both:
    total 3_000 vs 0, balance 4_000 vs 8_000, one top-up vs two.

