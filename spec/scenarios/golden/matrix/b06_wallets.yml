    to 4_000¢ — the configuration where the total could go negative. Lago clamps at zero: every
    draw is bounded by `remaining_invoice_amount`
    (allocate_prepaid_credits_by_wallets_service.rb:53, decremented :57), so exactly 4_000¢
    leaves the wallet and 6_000¢ stays. Alternatives, named: total −6_000 if the balance were
    drained; a credit note or `credit` invoice for the 6_000 surplus (none is created); the
    wallet emptied to 0.
    Why the ceiling is 4_000 and not 6_000: prepaid credit is the LAST reducer
    (calculate_fees_service.rb:57-62 — progressive billing → coupon → tax → credit note →
    prepaid), and the per-fee cap is `sub_total_excluding_taxes + taxes_precise −
    precise_credit_notes` (:77-79) with
    `sub_total_excluding_taxes_amount_cents = amount_cents − precise_coupons_amount_cents`
    (fee.rb:238-240) = 6_000 − 2_000. Credits before the coupon would have drawn 6_000 and left
    the wallet at 4_000; both numbers are asserted so the order is pinned, not just the totals.
    The coupon is spent HERE and not on the top-up invoice: the `credit` invoice is issued first
    in time, but Invoices::PaidCreditService computes its totals directly (:80-91) and never runs
    the coupon or prepaid stages, so a `frequency: once` coupon survives to the period invoice.
    The 6 March top-up of 20 credits is never paid, stays pending and does not raise the balance;
    had it settled the balance would end at 8_000 rather than 6_000, which is the assertion that
    separates settled from purchased-but-unsettled here.

- id: b06/paid-settled/none/ongoing-balance
  block: B6
  axes: {source: paid-settled, limitation: none, application: ongoing-balance}
  dimensions: {interval: monthly, billing_time: calendar, read_at: mid-period}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    organization: {premium_integrations: [manual_payments]}
    metrics: [{code: b06_stl_ong_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_stl_ong, interval: monthly, amount_cents: 0}
    charges: [{billable_metric_code: b06_stl_ong_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b06_stl_ong_cust, currency: EUR}
    subscription: {external_id: golden_b06_stl_ong_sub, billing_time: calendar}
    wallets:
      - name: purchased
        code: b06_stl_ong_w
        rate_amount: "1"
        currency: EUR
        paid_credits: "100"
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-02T00:00:00Z", do: pay_invoice, invoice_type: credit}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_stl_ong_sum, properties: {amount: 10}}
        - {code: b06_stl_ong_sum, properties: {amount: 30}}
        - {code: b06_stl_ong_sum, properties: {amount: 20}}
    - {at: "2024-03-06T00:00:00Z", do: top_up_wallet, params: {paid_credits: "50"}}
    - {at: "2024-03-10T00:00:00Z", do: perform_wallet_refresh}
  expect:
    invoices: 2
    wallet:
      code: b06_stl_ong_w
      balance_cents: 10000
      ongoing_usage_balance_cents: 6000
      ongoing_balance_cents: 4000
  math: >-
    A mid-period read on the ongoing path — Clock::RefreshWalletsOngoingBalanceJob (premium-gated,
    refresh_wallets_ongoing_balance_job.rb:8) → Customers::RefreshWalletsService →
    Wallets::Balance::AllocateOngoingUsageByWalletsService — which is a separate implementation
    from the billing allocator, not a shared helper.
    The 100 credits paid on 2 March are settled, so `balance_cents` is 10_000¢. Unbilled usage is
    60 units × 1.00 = 6_000¢, pooled as `fee.amount_cents + fee.taxes_amount_cents`
    (allocate_ongoing_usage_by_wallets_service.rb:90). One wallet, so it is the last applicable
    and absorbs the whole key (:48-51). `ongoing_balance_cents = balance_cents −
    ongoing_usage_balance_cents` (refresh_ongoing_usage_service.rb:63) = 10_000 − 6_000 = 4_000.
    The 6 March top-up of 50 credits is the row's real question. It is created pending
    (create_from_params_service.rb:125-138) and nothing settles it, so `balance_cents` stays
    10_000 and the ongoing figure stays 4_000. An implementation that projected PURCHASED but
    unsettled credits into the ongoing balance — plausible, since the customer has been invoiced
    for them — would report balance 10_000 with ongoing_balance 9_000, i.e. a wallet that looks
    solvent on credits nobody has paid for. Asserting all three fields excludes it.
    invoices is 2: both `credit` top-up invoices. No billing ran, so there is no subscription
    invoice and no WalletTransactionConsumption — the ongoing path debits nothing.

- id: b06/paid-settled/fee-types/full-cover
  block: B6
  axes: {source: paid-settled, limitation: fee-types, application: full-cover}
  dimensions: {interval: monthly, billing_time: calendar, allowed_fee_types: charge}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    organization: {premium_integrations: [manual_payments]}
    metrics: [{code: b06_stl_ftf_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_stl_ftf, interval: monthly, amount_cents: 5000}
    charges: [{billable_metric_code: b06_stl_ftf_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b06_stl_ftf_cust, currency: EUR}
    subscription: {external_id: golden_b06_stl_ftf_sub, billing_time: calendar}
    wallets:
      - name: charges only
        code: b06_stl_ftf_w
        rate_amount: "1"
        currency: EUR
        paid_credits: "100"
        applies_to: {fee_types: [charge]}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-02T00:00:00Z", do: pay_invoice, invoice_type: credit}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_stl_ftf_sum, properties: {amount: 10}}
        - {code: b06_stl_ftf_sum, properties: {amount: 30}}
        - {code: b06_stl_ftf_sum, properties: {amount: 20}}
    - {at: "2024-03-06T00:00:00Z", do: top_up_wallet, params: {paid_credits: "50"}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 3
    invoice:
      select: {invoice_type: subscription}
      fees_amount_cents: 11000
      prepaid_credit_amount_cents: 6000
      prepaid_purchased_credit_amount_cents: 6000
      total_amount_cents: 5000
      fees:
        - {fee_type: subscription, amount_cents: 5000}
        - {fee_type: charge, amount_cents: 6000, units: "60"}
    wallet:
      code: b06_stl_ftf_w
      balance_cents: 4000
  math: >-
    Fees 11_000¢ = 5_000 subscription + 6_000 charge. The wallet holds 10_000¢ of SETTLED
    purchased credit and is limited to `charge`, so "full cover" here means the allowed slice is
    covered in full and a surplus remains — the discriminator against the partial-cover row
    below, where the same wallet runs dry mid-slice.
    `applicable_fee?` (allocate_prepaid_credits_by_wallets_service.rb:108-122) admits only the
    charge bucket: the subscription key matches neither `types` (["charge"]) nor `targets`
    (empty), and `unrestricted_wallet` is false because types is non-empty. Draw
    min(6000, 10000, 11000) = 6_000 → total 5_000, the subscription fee owed in CASH, and the
    wallet retains 4_000. A wallet ignoring allowed_fee_types would draw 10_000 and leave 1_000
    owed; one treating the limitation as an invoice-level discount would reach the same 5_000
    total with a 0 balance — balance_cents 4_000 rules both out.
    The 6 March top-up of 50 credits is never paid: created `pending`
    (create_from_params_service.rb:125-138), excluded from `available_inbound`
    (wallet_transaction.rb:80) and from the balance, so it changes nothing. Had it settled the
    wallet would end at 9_000 with the same invoice. prepaid_purchased 6_000 and no
    prepaid_granted: every cent came from a purchased inbound
    (applied_prepaid_credits_service.rb:83-92). invoices is 3 — subscription plus two `credit`
    invoices, one settled and one pending.

- id: b06/paid-settled/fee-types/partial-cover
  block: B6
  axes: {source: paid-settled, limitation: fee-types, application: partial-cover}
  dimensions: {interval: monthly, billing_time: calendar, allowed_fee_types: charge}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    organization: {premium_integrations: [manual_payments]}
    metrics: [{code: b06_stl_ftp_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_stl_ftp, interval: monthly, amount_cents: 5000}
    charges: [{billable_metric_code: b06_stl_ftp_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b06_stl_ftp_cust, currency: EUR}
    subscription: {external_id: golden_b06_stl_ftp_sub, billing_time: calendar}
    wallets:
      - name: charges only, small
        code: b06_stl_ftp_w
        rate_amount: "1"
        currency: EUR
        paid_credits: "20"
        applies_to: {fee_types: [charge]}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-02T00:00:00Z", do: pay_invoice, invoice_type: credit}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_stl_ftp_sum, properties: {amount: 10}}
        - {code: b06_stl_ftp_sum, properties: {amount: 30}}
        - {code: b06_stl_ftp_sum, properties: {amount: 20}}
    - {at: "2024-03-06T00:00:00Z", do: top_up_wallet, params: {paid_credits: "100"}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 3
    invoice:
      select: {invoice_type: subscription}
      fees_amount_cents: 11000
      prepaid_credit_amount_cents: 2000
      prepaid_purchased_credit_amount_cents: 2000
      total_amount_cents: 9000
      fees:
        - {fee_type: subscription, amount_cents: 5000}
        - {fee_type: charge, amount_cents: 6000, units: "60"}
    wallet:
      code: b06_stl_ftp_w
      balance_cents: 0
  math: >-
    The mirror of the full-cover row: the same 11_000¢ invoice (5_000 subscription + 6_000
    charge), the same `charge`-only limitation, but only 20 credits settled — 2_000¢, less than
    the 6_000¢ allowed slice. The wallet is drained: draw min(6000, 2000, 11000) = 2_000
    (allocate_prepaid_credits_by_wallets_service.rb:53), so 4_000¢ of the charge fee AND the
    whole 5_000¢ subscription fee are owed in cash, total 9_000.
    The 6 March top-up is 100 credits — deliberately more than enough to finish the job — and it
    is never paid. It is created `pending` with `remaining_amount_cents` nil
    (create_from_params_service.rb:125-138, create_service.rb:56-62), so it is invisible to both
    the balance and `available_inbound` (wallet_transaction.rb:80). If purchased-but-unsettled
    credits were spendable, the draw would be min(6000, 12000, 11000) = 6_000, prepaid 6_000 and
    total 5_000 — a 4_000¢ difference on the customer's bill. That is the sharpest form of the
    paid/paid-settled boundary in this slice, and it is why the row bills 12_000¢ of credit and
    lets only 2_000¢ of it work.
    Both the settled and the pending top-up appear as `credit` invoices, so invoices is 3. The
    subscription fee is the fee the limitation forbids and it is asserted at its full 5_000¢
    inside a 9_000 total.

- id: b06/paid-settled/fee-types/rounding
  block: B6
  axes: {source: paid-settled, limitation: fee-types, application: rounding}
  dimensions: {interval: monthly, billing_time: calendar, rate_amount: "3.4565", allowed_fee_types: subscription}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    organization: {premium_integrations: [manual_payments]}
    metrics: [{code: b06_stl_ftr_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_stl_ftr, interval: monthly, amount_cents: 5000}
    charges: [{billable_metric_code: b06_stl_ftr_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b06_stl_ftr_cust, currency: EUR}
    subscription: {external_id: golden_b06_stl_ftr_sub, billing_time: calendar}
    wallets:
      - name: subscription only
        code: b06_stl_ftr_w
        rate_amount: "3.4565"
        currency: EUR
        paid_credits: "10"
        applies_to: {fee_types: [subscription]}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-02T00:00:00Z", do: pay_invoice, invoice_type: credit}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_stl_ftr_sum, properties: {amount: 10}}
        - {code: b06_stl_ftr_sum, properties: {amount: 30}}
        - {code: b06_stl_ftr_sum, properties: {amount: 20}}
    - {at: "2024-03-06T00:00:00Z", do: top_up_wallet, params: {paid_credits: "10"}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 3
    invoice:
      select: {invoice_type: subscription}
      fees_amount_cents: 11000
      prepaid_credit_amount_cents: 3457
      prepaid_purchased_credit_amount_cents: 3457
      total_amount_cents: 7543
    wallet:
      code: b06_stl_ftr_w
      balance_cents: 0
  math: >-
    Rate 3.4565 — a credit worth more than a euro, and 10 credits land exactly on a half-cent:
    `(10 × 3.4565).round(2) × 100` = 34.565 → 34.57 → 3_457¢ (wallet_credit.rb:26-27, HALF-UP).
    Truncating gives 34.56 → 3_456¢. Name both: prepaid 3_457 vs 3_456, total 7_543 vs 7_544.
    The customer is invoiced 3_457¢ for the top-up, so the rounding decides both what they paid
    and what they got.
    Fees 11_000¢ (5_000 subscription + 6_000 charge). The wallet may pay only `subscription`
    fees, so the reachable bucket is 5_000¢ and the 6_000¢ charge fee is skipped by
    `applicable_fee?` (allocate_prepaid_credits_by_wallets_service.rb:108-122) and owed in cash
    in full. Draw min(5000, 3457, 11000) = 3_457, the whole settled balance; total
    11_000 − 3_457 = 7_543.
    The 6 March top-up of another 10 credits is never paid and stays pending
    (create_from_params_service.rb:125-138), so it neither settles nor raises the balance; had it
    settled the draw would be min(5000, 6914, 11000) = 5_000 and the total 6_000. Rounding and
    settlement are therefore pinned by the same three numbers.

- id: b06/paid-settled/fee-types/negative-total
  block: B6
  axes: {source: paid-settled, limitation: fee-types, application: negative-total}
  dimensions: {interval: monthly, billing_time: calendar, allowed_fee_types: subscription}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    organization: {premium_integrations: [manual_payments]}
    metrics: [{code: b06_stl_ftn_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_stl_ftn, interval: monthly, amount_cents: 5000}
    charges: [{billable_metric_code: b06_stl_ftn_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b06_stl_ftn_cust, currency: EUR}
    subscription: {external_id: golden_b06_stl_ftn_sub, billing_time: calendar}
    wallets:
      - name: subscription only, over-funded
        code: b06_stl_ftn_w
        rate_amount: "1"
        currency: EUR
        paid_credits: "140"
        applies_to: {fee_types: [subscription]}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-02T00:00:00Z", do: pay_invoice, invoice_type: credit}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_stl_ftn_sum, properties: {amount: 10}}
        - {code: b06_stl_ftn_sum, properties: {amount: 30}}
        - {code: b06_stl_ftn_sum, properties: {amount: 20}}
    - {at: "2024-03-06T00:00:00Z", do: top_up_wallet, params: {paid_credits: "50"}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 3
    invoice:
      select: {invoice_type: subscription}
      fees_amount_cents: 11000
      prepaid_credit_amount_cents: 5000
      prepaid_purchased_credit_amount_cents: 5000
      total_amount_cents: 6000
      fees:
        - {fee_type: subscription, amount_cents: 5000}
        - {fee_type: charge, amount_cents: 6000, units: "60"}
    wallet:
      code: b06_stl_ftn_w
      balance_cents: 9000
  math: >-
    14_000¢ of settled purchased credit against an 11_000¢ invoice: more than enough to drive the
    total negative, and more than enough to pay the whole invoice. Neither happens. The
    limitation clamp fires FIRST — `applicable_fee?`
    (allocate_prepaid_credits_by_wallets_service.rb:108-122) with types=["subscription"] admits
    only the 5_000¢ subscription bucket, so the draw is min(5000, 14000, 11000) = 5_000 and
    `remaining_invoice_amount` (:53) never becomes the binding constraint. Total 6_000 — exactly
    the charge fee, owed in cash — while 9_000¢ of paid-for credit sits unusable.
    The alternatives with their numbers: (a) limitation ignored → prepaid 11_000, total 0, wallet
    3_000; (b) no clamp anywhere → total −3_000; (c) the unusable surplus refunded via a credit
    note or expired — neither occurs, the only wallet transaction is the 5_000¢ outbound. Because
    (a) and the truth differ in the wallet as much as in the invoice, balance_cents 9_000 and
    consumed_amount_cents 5_000 are asserted alongside the total.
    The 6 March top-up of 50 credits is never paid and stays pending
    (create_from_params_service.rb:125-138); the balance would end at 14_000 rather than 9_000 if
    pending credits counted. prepaid_purchased 5_000 with prepaid_granted absent: a
    purchased-only wallet, which is what makes this the paid-settled row rather than the granted
    one.

- id: b06/paid-settled/fee-types/ongoing-balance
  block: B6
  axes: {source: paid-settled, limitation: fee-types, application: ongoing-balance}
  dimensions: {interval: monthly, billing_time: calendar, allowed_fee_types: charge, read_at: mid-period}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    organization: {premium_integrations: [manual_payments]}
    metrics: [{code: b06_stl_fto_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_stl_fto, interval: monthly, amount_cents: 5000}
    charges: [{billable_metric_code: b06_stl_fto_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b06_stl_fto_cust, currency: EUR}
    subscription: {external_id: golden_b06_stl_fto_sub, billing_time: calendar}
    wallets:
      - name: charges only
        code: b06_stl_fto_w
        rate_amount: "1"
        currency: EUR
        paid_credits: "100"
        applies_to: {fee_types: [charge]}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-02T00:00:00Z", do: pay_invoice, invoice_type: credit}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_stl_fto_sum, properties: {amount: 10}}
        - {code: b06_stl_fto_sum, properties: {amount: 30}}
        - {code: b06_stl_fto_sum, properties: {amount: 20}}
    - {at: "2024-03-06T00:00:00Z", do: top_up_wallet, params: {paid_credits: "50"}}
    - {at: "2024-03-10T00:00:00Z", do: perform_wallet_refresh}
  expect:
    invoices: 2
    wallet:
      code: b06_stl_fto_w
      balance_cents: 10000
      ongoing_usage_balance_cents: 6000
      ongoing_balance_cents: 4000
  math: >-
    Mid-period, on the ongoing allocator
    (allocate_ongoing_usage_by_wallets_service.rb:33-65, reached from
    Clock::RefreshWalletsOngoingBalanceJob → Customers::RefreshWalletsService), with a
    `charge`-only wallet — the positive branch of the fee-type filter on this path, complementary
    to the granted `subscription`-only row which asserts a 0 allocation.
    The pool contains ONLY the charge fee: it is built from `current_usage_fees`
    (refresh_wallets_service.rb:52-54) = Invoices::CustomerUsageService output, which produces
    usage fees, so the plan's 5_000¢ subscription fee — the fee this wallet may not pay for — is
    absent from the mid-period picture altogether and will be owed in cash at period end with
    nothing reserved against it. The charge key matches `types` (:126-137), the wallet is the
    only applicable one, so it absorbs the whole 6_000¢ (:48-51).
    `ongoing_balance_cents = 10_000 − 6_000 = 4_000` (refresh_ongoing_usage_service.rb:63).
    Wrong answers: 11_000 of usage and −1_000 if the ongoing pool included the subscription fee
    AND the limitation were ignored; 1_000 if the subscription fee entered the pool but the
    limitation held. Both are excluded by asserting ongoing_usage_balance_cents 6_000 exactly.
    The 6 March top-up of 50 credits stays pending (create_from_params_service.rb:125-138) and
    does not move `balance_cents` off 10_000, so it cannot inflate the ongoing balance either —
    9_000 would be the wrong answer there. invoices is 2, both `credit` top-up invoices.

