    wallets:
      - {name: odd rate purchased, code: b06_twc_ps_rn_a, rate_amount: "0.6665", currency: EUR, paid_credits: "50", priority: 1}
      - {name: rich neighbour, code: b06_twc_ps_rn_b, rate_amount: "1", currency: EUR, granted_credits: "100", priority: 20}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-02T00:00:00Z", do: pay_invoice, invoice_type: credit}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_twc_ps_rn, properties: {amount: 10, target_wallet_code: b06_twc_ps_rn_a}}
        - {code: b06_twc_ps_rn, properties: {amount: 30, target_wallet_code: b06_twc_ps_rn_a}}
        - {code: b06_twc_ps_rn, properties: {amount: 20, target_wallet_code: b06_twc_ps_rn_a}}
        - {code: b06_twc_ps_rn, properties: {amount: 12, target_wallet_code: b06_twc_ps_rn_b}}
        - {code: b06_twc_ps_rn, properties: {amount: 8, target_wallet_code: b06_twc_ps_rn_b}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {invoice_type: credit}
        fees_amount_cents: 3333
        total_amount_cents: 3333
        payment_status: succeeded
      - select: {invoice_type: subscription}
        fees_count: 3
        fees_amount_cents: 8000
        taxes_amount_cents: 0
        prepaid_credit_amount_cents: 5333
        prepaid_purchased_credit_amount_cents: 3333
        prepaid_granted_credit_amount_cents: 2000
        total_amount_cents: 2667
    wallet:
      code: b06_twc_ps_rn_b
      balance_cents: 8000
  math: >-
    The half-cent is charged to the customer and then spent. 50 credits at rate 0.6665 is
    50 × 0.6665 = 33.325, and `(credit_amount × rate_amount).round(currency.exponent) × 100`
    (wallet_credit.rb:26-27) rounds HALF-UP to 33.33 → a top-up invoice of 3_333¢, asserted directly;
    truncation would bill 3_332¢. Paying it on 2 March settles the transaction
    (Invoices::UpdateService:117 → PrepaidCreditJob → ApplyPaidCreditsService) so the whole 3_333¢ is
    spendable, and the same cent then reappears in the period invoice.
    Fees 8_000¢: 60 units → 6_000¢ tagged b06_twc_ps_rn_a (10/30/20: sum 60 ≠ max 30 ≠ latest 20),
    20 units → 2_000¢ tagged b06_twc_ps_rn_b, plus the 0¢ subscription fee. Wallet a is confined to
    its own bucket and holds less than it, so it is drained for 3_333¢ exactly
    (allocate_prepaid_credits_by_wallets_service.rb:53); wallet b pays its own 2_000¢ and keeps 8_000¢
    that may not reach a's 2_667¢ remainder (:109-114). Prepaid 5_333 = purchased 3_333 + granted
    2_000, total 2_667.
    Truncation instead of half-up: top-up 3_332, prepaid 5_332, total 2_668. Ignoring the tag: b
    covers a's shortfall, prepaid 8_000 (purchased 3_333 + granted 4_667), total 0, b at 5_333¢. The
    pair (total 2_667, wallet b 8_000) separates all three, and the purchased/granted split confirms
    which wallet each cent came from (applied_prepaid_credits_service.rb:74-91).

