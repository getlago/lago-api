    invoice:
      - select: {invoice_type: credit}
        fees_amount_cents: 116
        total_amount_cents: 116
        payment_status: pending
        fees:
          - {fee_type: credit, amount_cents: 116, units: "3.51515"}
      - select: {invoice_type: subscription}
        fees_amount_cents: 4060
        prepaid_credit_amount_cents: 60
        prepaid_granted_credit_amount_cents: 60
        total_amount_cents: 4000
        fees:
          - {fee_type: subscription, item_code: golden_b06_paid_bmr, amount_cents: 0, units: "1"}
