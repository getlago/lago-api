      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 3500
      prepaid_granted_credit_amount_cents: 3500
      total_amount_cents: 1500
    wallet:
      code: b06_twc_tm_mp_g
      balance_cents: 10000
  math: >-
    Target beats priority, and here it also decides how large a target top-up is. Three wallets:
    b06_twc_tm_mp_g at priority 1, granted, unrestricted, 10_000¢; b06_twc_tm_mp_a at priority 20 with
    no credits and a target rule; b06_twc_tm_mp_d at priority 30 with 500¢. Both charge fees carry a tag
