    0¢ subscription fee; prepaid 6_000; 4_000¢ still owed in cash.
    Wallet b is the asserted wallet because a ends at 0 under both behaviours. Tag-blind, the two
    buckets merge into one 10_000¢ pool, a pays 2_000, b pays the remaining 8_000 and ends at
    2_000¢ with total 0. Name both: b 6_000 vs 2_000, total 4_000 vs 0. If the pending purchase were
    spendable a would hold 8_000¢, pay 6_000 of its own bucket and the total would be 0 as well —
    excluded by the same two numbers. prepaid_granted equals prepaid_credit, so every cent came from
