    never debit the wallet, and no WalletTransactionConsumption is written, so the
    granted-before-purchased order is simply not observable on this path. invoices is 1 — the
    `credit` top-up invoice; no billing ran.

- id: b06/paid-settled/none/full-cover
  block: B6
  axes: {source: paid-settled, limitation: none, application: full-cover}
  dimensions: {interval: monthly, billing_time: calendar, rate_amount: 1}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    organization: {premium_integrations: [manual_payments]}
    metrics: [{code: b06_stl_full_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_stl_full, interval: monthly, amount_cents: 0}
    charges: [{billable_metric_code: b06_stl_full_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b06_stl_full_cust, currency: EUR}
    subscription: {external_id: golden_b06_stl_full_sub, billing_time: calendar}
    wallets:
      - name: purchased
        code: b06_stl_full_w
        rate_amount: "1"
        currency: EUR
        paid_credits: "100"
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-02T00:00:00Z", do: pay_invoice, invoice_type: credit}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_stl_full_sum, properties: {amount: 10}}
        - {code: b06_stl_full_sum, properties: {amount: 30}}
        - {code: b06_stl_full_sum, properties: {amount: 20}}
    - {at: "2024-03-06T00:00:00Z", do: top_up_wallet, params: {paid_credits: "50"}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 3
    invoice:
      select: {invoice_type: subscription}
      fees_amount_cents: 6000
      taxes_amount_cents: 0
      prepaid_credit_amount_cents: 6000
      prepaid_purchased_credit_amount_cents: 6000
      total_amount_cents: 0
      payment_status: succeeded
    wallet:
      code: b06_stl_full_w
      balance_cents: 4000
  math: >-
    This row pins what `paid-settled` MEANS, in both directions, on one wallet. A purchased top-up
    is created with `status: :pending` and no `remaining_amount_cents`
    (create_from_params_service.rb:125-138, create_service.rb:56-62), and the balance is NOT
    touched. Settlement is what makes the credits spendable: paying the `credit` invoice flips its
    payment_status, Invoices::UpdateService fires Invoices::PrepaidCreditJob
    (prepaid_credit_job.rb:17-25) → Wallets::ApplyPaidCreditsService
    (apply_paid_credits_service.rb:12-20) → SettleService (status settled,
    `remaining_amount_cents = amount_cents`, settle_service.rb:18-25) then Balance::IncreaseService
    (+10_000¢). So the 100 credits paid on 2 March are worth 10_000¢ of cover.
    The second top-up, on 6 March, is never paid. Its transaction stays pending, so it is excluded
    from `available_inbound` (wallet_transaction.rb:80, `inbound.settled`) AND from the balance —
    an UNSETTLED top-up's credits are NOT spendable, which is the answer to the revenue question:
    pending credits cannot be spent, so no revenue leaks; the risk lives on the other side, a
    customer who has been invoiced 5_000¢ of credits they cannot yet use.
    Arithmetic: 60 units × 1.00 = 6_000¢ of fees, fully covered — prepaid 6_000, total 0,
    payment_status succeeded (calculate_fees_service.rb:64 marks a zero total succeeded, not
    pending). The wallet keeps 4_000, not the whole balance. If pending credits HAD been spendable
    the balance would be 15_000 and end at 9_000 with the same invoice numbers, so
    balance_cents 4_000 is the only assertion that separates the two. prepaid_purchased 6_000 with
    prepaid_granted absent shows the pool: this wallet has no granted inbound at all.
    invoices is 3 — subscription plus two `credit` invoices, one settled and one not.

- id: b06/paid-settled/none/rounding
  block: B6
  axes: {source: paid-settled, limitation: none, application: rounding}
  dimensions: {interval: monthly, billing_time: calendar, rate_amount: "0.12345"}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    organization: {premium_integrations: [manual_payments]}
    metrics: [{code: b06_stl_rnd_sum, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_stl_rnd, interval: monthly, amount_cents: 0}
    charges: [{billable_metric_code: b06_stl_rnd_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b06_stl_rnd_cust, currency: EUR}
    subscription: {external_id: golden_b06_stl_rnd_sub, billing_time: calendar}
    wallets:
      - name: purchased
        code: b06_stl_rnd_w
        rate_amount: "0.12345"
        currency: EUR
        paid_credits: "100"
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-02T00:00:00Z", do: pay_invoice, invoice_type: credit}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_stl_rnd_sum, properties: {amount: 10}}
        - {code: b06_stl_rnd_sum, properties: {amount: 30}}
        - {code: b06_stl_rnd_sum, properties: {amount: 20}}
    - {at: "2024-03-06T00:00:00Z", do: top_up_wallet, params: {paid_credits: "100"}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 3
    invoice:
      select: {invoice_type: subscription}
      fees_amount_cents: 6000
      prepaid_credit_amount_cents: 1235
      prepaid_purchased_credit_amount_cents: 1235
      total_amount_cents: 4765
    wallet:
      code: b06_stl_rnd_w
      balance_cents: 0
  math: >-
    Rate 0.12345, five decimals, so 100 credits is 12.345 currency units — exactly on the
    half-cent. `WalletCredit` computes `(credit_amount × rate_amount).round(currency.exponent)`
    then × 100 (wallet_credit.rb:26-27); BigDecimal#round is HALF-UP, so 12.345 → 12.35 →
    1_235¢. A truncating implementation gives 12.34 → 1_234¢. Name both: prepaid 1_235 vs 1_234
    and total 4_765 vs 4_766. The `credit` invoice the customer pays is for 1_235¢, so the
    rounding is money the customer was actually billed.
    Fees are 60 units × 1.00 = 6_000¢. The draw is
    min(6000, 1235, 6000) = 1_235 (allocate_prepaid_credits_by_wallets_service.rb:53), the whole
    settled balance, leaving 4_765 owed and the wallet empty.
    The 6 March top-up of another 100 credits is never paid, so it neither settles nor raises the
    balance (create_from_params_service.rb:125-138 creates it `pending`; only
    Wallets::ApplyPaidCreditsService, driven by the payment, settles it). Had pending credits been
    spendable the prepaid would be 2_470 and the total 3_530 — the row therefore pins the rounding
    and the settlement boundary with the same numbers.

