    100 × 1.333 = 133.30 → 13_330¢ tagged a (events 10/25/15 twice: sum 50 per batch ≠ max 25 ≠ latest
    15), 20 × 1.333 = 26.66 → 2_666¢ tagged b, and the 0¢ subscription fee: 15_996¢. Wallet a is
    drained for its whole 9_998¢ against its own bucket
    (allocate_prepaid_credits_by_wallets_service.rb:53) and wallet b pays its own 2_666¢, keeping
    7_334¢ that the tag forbids it from lending (:109-114). Prepaid 12_664, total 3_332.
    Truncating the top-up: prepaid 12_663 and total 3_333. Ignoring the tag: a's rule would have been
    sized against the whole 15_996¢ pool (≈290 credits, ≈19_329¢) and would then have paid the entire
    merged bucket, total 0 with b untouched at 10_000¢. Wallet b is asserted rather than a because a
    ends at 0 in every variant and its rule re-arms after billing
    (applied_prepaid_credits_service.rb:39).

