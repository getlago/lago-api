        - {code: b06_stl_bmf_b, properties: {amount: 10}}
        - {code: b06_stl_bmf_b, properties: {amount: 5}}
    - {at: "2024-03-06T00:00:00Z", do: top_up_wallet, params: {paid_credits: "50"}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 3
    invoice:
      select: {invoice_type: subscription}
      fees_amount_cents: 8000
      prepaid_credit_amount_cents: 6000
      prepaid_purchased_credit_amount_cents: 6000
      total_amount_cents: 2000
      fees:
        - {fee_type: subscription, amount_cents: 0}
        - {fee_type: charge, item_code: b06_stl_bmf_a, amount_cents: 6000, units: "60"}
        - {fee_type: charge, item_code: b06_stl_bmf_b, amount_cents: 2000, units: "20"}
    wallet:
      code: b06_stl_bmf_w
      balance_cents: 4000
  math: >-
    Two charges: metric a 10+30+20 = 60 units → 6_000¢, metric b 5+10+5 = 20 units → 2_000¢,
    fees 8_000¢. Three events per metric so sum is distinguishable from max and latest. The
    wallet holds 10_000¢ of SETTLED purchased credit and is limited to metric a, so it covers its
    allowed slice in full with a surplus — the distinction from the partial-cover row, where the
    same limitation applies but the balance runs out inside the slice.
    Buckets are `[fee_type, billable_metric_id]` sorted by descending amount
    (allocate_prepaid_credits_by_wallets_service.rb:82-89), so metric a's 6_000 is offered first
    and matched through `wallet_targets` (:37-41, :117); metric b's key matches neither targets
    nor types and is skipped. Draw min(6000, 10000, 8000) = 6_000, total 2_000 — metric b's fee,
    owed in cash — and the wallet keeps 4_000. Note this is a DIFFERENT lookup from the fee-types
    rows, ORed against it at :121: both fees here are `fee_type: charge`, so a wallet that matched
    on fee type alone would take 8_000 and leave 0 owed. The per-fee amounts plus prepaid 6_000
    exclude that.
    The 6 March top-up of 50 credits is never paid and stays pending
    (create_from_params_service.rb:125-138, `remaining_amount_cents` nil at
    create_service.rb:56-62): it neither joins `available_inbound`
    (wallet_transaction.rb:80) nor the balance, so the wallet ends at 4_000 rather than 9_000.

