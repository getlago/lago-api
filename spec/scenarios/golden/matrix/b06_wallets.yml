      - {billable_metric_code: b06_grt_bmn_b, charge_model: standard, properties: {amount: "1"}}
    customer: {external_id: golden_b06_grt_bmn_cust, currency: EUR}
    subscription: {external_id: golden_b06_grt_bmn_sub, billing_time: calendar}
    wallets:
      - name: metric a only, over-funded
        code: b06_grt_bmn_w
        rate_amount: "1"
        currency: EUR
        granted_credits: "40"
        paid_credits: "60"
        applies_to: {billable_metric_codes: [b06_grt_bmn_a]}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-02T00:00:00Z", do: pay_invoice, invoice_type: credit}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_grt_bmn_a, properties: {amount: 10}}
        - {code: b06_grt_bmn_a, properties: {amount: 30}}
        - {code: b06_grt_bmn_a, properties: {amount: 20}}
        - {code: b06_grt_bmn_b, properties: {amount: 5}}
        - {code: b06_grt_bmn_b, properties: {amount: 10}}
        - {code: b06_grt_bmn_b, properties: {amount: 5}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      select: {invoice_type: subscription}
      fees_amount_cents: 8000
      prepaid_credit_amount_cents: 6000
      prepaid_granted_credit_amount_cents: 4000
      prepaid_purchased_credit_amount_cents: 2000
      total_amount_cents: 2000
      fees:
        - {fee_type: subscription, amount_cents: 0}
        - {fee_type: charge, item_code: b06_grt_bmn_a, amount_cents: 6000, units: "60"}
        - {fee_type: charge, item_code: b06_grt_bmn_b, amount_cents: 2000, units: "20"}
    wallet:
      code: b06_grt_bmn_w
      balance_cents: 4000
  math: >-
    10_000¢ of credits (40 granted + 60 purchased) against an 8_000¢ invoice — enough to push the
    total negative twice over. It does not go negative and it does not zero out either. The
    metric limitation caps the reachable amount at metric a's 6_000¢ bucket
    (allocate_prepaid_credits_by_wallets_service.rb:108-122, matching on wallet_targets), and the
    draw is min(6000, 10000, 8000) = 6_000. Total 8_000 − 6_000 = 2_000 — metric b's fee, which
    the wallet may not pay for, owed in CASH while 4_000¢ of credit sits unused.
    The alternatives, with their numbers: (a) limitation ignored → the invoice clamp
    `remaining_invoice_amount` (:53, :57) takes over and prepaid is 8_000, total 0, wallet 2_000;
    (b) no clamp at all → total −2_000; (c) the unusable 4_000 refunded or expired — neither
    happens, no credit note and no wallet transaction beyond the 6_000 outbound. Asserting the
    total alone cannot separate (a) from the truth once the total is small, so balance_cents
    4_000 and consumed_amount_cents 6_000 carry the row.
    Pools: 4_000 granted exhausts the grant, then 2_000 purchased
    (wallet_transaction.rb:81-88); a created_at FIFO would report 0 granted / 6_000 purchased.

