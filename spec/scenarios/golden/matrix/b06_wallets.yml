    credit invoices never run the coupon or prepaid stages (invoices/paid_credit_service.rb:80-91).

- id: b06/paid-settled/target-wallet-code/ongoing-balance
  block: B6
  axes: {source: paid-settled, limitation: target-wallet-code, application: ongoing-balance}
  dimensions: {interval: monthly, billing_time: calendar, rate_amount: 1, read_at: mid-period, settled_at: "2024-03-02"}
  provenance: coverage-gap
  runners: [rspec]
  premium: true
  setup:
    organization: {premium_integrations: [events_targeting_wallets, manual_payments]}
    metrics: [{code: b06_twc_ps_ob, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_twc_ps_ob, interval: monthly, amount_cents: 0}
    charges:
      - billable_metric_code: b06_twc_ps_ob
        charge_model: standard
        properties: {amount: "1"}
        accepts_target_wallet: true
    customer: {external_id: golden_b06_twc_ps_ob_cust, currency: EUR}
    subscription: {external_id: golden_b06_twc_ps_ob_sub, billing_time: calendar}
    wallets:
      - {name: targeted purchased, code: b06_twc_ps_ob_a, rate_amount: "1", currency: EUR, paid_credits: "100", priority: 1}
      - {name: other target, code: b06_twc_ps_ob_b, rate_amount: "1", currency: EUR, granted_credits: "100", priority: 20}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - {at: "2024-03-02T00:00:00Z", do: pay_invoice, invoice_type: credit}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_twc_ps_ob, properties: {amount: 10, target_wallet_code: b06_twc_ps_ob_a}}
        - {code: b06_twc_ps_ob, properties: {amount: 30, target_wallet_code: b06_twc_ps_ob_a}}
        - {code: b06_twc_ps_ob, properties: {amount: 20, target_wallet_code: b06_twc_ps_ob_a}}
        - {code: b06_twc_ps_ob, properties: {amount: 25, target_wallet_code: b06_twc_ps_ob_b}}
        - {code: b06_twc_ps_ob, properties: {amount: 15, target_wallet_code: b06_twc_ps_ob_b}}
    - {at: "2024-03-10T00:00:00Z", do: perform_wallet_refresh}
    - {at: "2024-03-10T01:00:00Z", do: fetch_current_usage}
  expect:
    invoices: 1
    invoice:
      select: {invoice_type: credit}
      total_amount_cents: 10000
      payment_status: succeeded
    wallet:
      code: b06_twc_ps_ob_a
      balance_cents: 10000
      ongoing_usage_balance_cents: 6000
      ongoing_balance_cents: 4000
    usage:
      amount_cents: 10000
      total_amount_cents: 10000
  math: >-
    A mid-period read with a SETTLED purchase, so balance_cents is a real 10_000¢ rather than the
    pending 0 of the paid twin, and the only invoice in the row is the paid top-up. The path is
    Clock::RefreshWalletsOngoingBalanceJob (premium-gated at refresh_wallets_ongoing_balance_job.rb:8)
    → Customers::RefreshWalletsService → Wallets::Balance::AllocateOngoingUsageByWalletsService, a
    SECOND implementation of the tag rule: it re-derives the key at
    allocate_ongoing_usage_by_wallets_service.rb:118-123 and re-implements the refusal at :127-130,
    so no billing row covers this branch.
    Current-usage fees keep their grouping (`UsageFilters::WITHOUT_PRESENTATION_FILTER` leaves
    skip_grouping false — fees/charge_service.rb:493-499), so the pool is two keys:
    6_000¢ tagged a (10/30/20: sum 60 ≠ max 30 ≠ latest 20) and 4_000¢ tagged b. Each key's
    `applicable` list holds one wallet, which is therefore also the last and takes the whole bucket
    (:47-58): wallet a reserves 6_000, not 10_000, and
    ongoing_balance = balance − ongoing_usage = 10_000 − 6_000 = 4_000
    (refresh_ongoing_usage_service.rb:63).
    Tag-blind, the keys merge into one 10_000¢ pool and wallet a — first in `in_application_order`
    (customers/refresh_wallets_service.rb:48), room 10_000 — absorbs all of it: ongoing_usage 10_000,
    ongoing_balance 0. Name both: 6_000 vs 10_000 and 4_000 vs 0. balance_cents stays 10_000 because
    the ongoing figures are a projection that never debits the wallet, and the current-usage payload
    is asserted alongside to show the customer still owes the whole 10_000¢. No
    WalletTransactionConsumption rows are written on this path, so there is no purchased/granted split
    to read mid-period even though this wallet is entirely purchased.

