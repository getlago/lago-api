    purchase contributed nothing (applied_prepaid_credits_service.rb:74-91), and the `credit` invoice
    for it stays pending at 3_000¢ — invoices 2.

- id: b06/paid/target-wallet-code/rounding
  block: B6
  axes: {source: paid, limitation: target-wallet-code, application: rounding}
  dimensions: {interval: monthly, billing_time: calendar, rate_amount: "0.6665", paid_credits: 20, granted_credits: 50}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    organization: {premium_integrations: [events_targeting_wallets]}
    metrics: [{code: b06_twc_p_rn, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_twc_p_rn, interval: monthly, amount_cents: 0}
    charges:
      - billable_metric_code: b06_twc_p_rn
        charge_model: standard
        properties: {amount: "1"}
        accepts_target_wallet: true
    customer: {external_id: golden_b06_twc_p_rn_cust, currency: EUR}
    subscription: {external_id: golden_b06_twc_p_rn_sub, billing_time: calendar}
    wallets:
      - {name: odd rate mixed pools, code: b06_twc_p_rn_a, rate_amount: "0.6665", currency: EUR, granted_credits: "50", paid_credits: "20", priority: 1}
      - {name: rich neighbour, code: b06_twc_p_rn_b, rate_amount: "1", currency: EUR, granted_credits: "100", priority: 20}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_twc_p_rn, properties: {amount: 10, target_wallet_code: b06_twc_p_rn_a}}
        - {code: b06_twc_p_rn, properties: {amount: 30, target_wallet_code: b06_twc_p_rn_a}}
        - {code: b06_twc_p_rn, properties: {amount: 20, target_wallet_code: b06_twc_p_rn_a}}
        - {code: b06_twc_p_rn, properties: {amount: 12, target_wallet_code: b06_twc_p_rn_b}}
        - {code: b06_twc_p_rn, properties: {amount: 8, target_wallet_code: b06_twc_p_rn_b}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {invoice_type: credit}
        fees_amount_cents: 1333
        total_amount_cents: 1333
        payment_status: pending
      - select: {invoice_type: subscription}
        fees_count: 3
        fees_amount_cents: 8000
        taxes_amount_cents: 0
        prepaid_credit_amount_cents: 5333
        prepaid_granted_credit_amount_cents: 5333
        total_amount_cents: 2667
    wallet:
      code: b06_twc_p_rn_b
      balance_cents: 8000
  math: >-
    Two half-up rounds at rate 0.6665, one on each pool, and only one of them is spendable.
    `(credit_amount × rate_amount).round(currency.exponent) × 100` (wallet_credit.rb:26-27) turns the
    50 granted credits into 33.325 → 33.33 → 3_333¢ and the 20 purchased credits into 13.33 → 1_333¢,
    which is asserted directly as the pending `credit` invoice — truncation would give 3_332¢ and
    1_332¢, so both numbers are named on both pools.
    Only the granted 3_333¢ is spendable (create_from_params_service.rb:129). Fees are 60 units →
    6_000¢ tagged b06_twc_p_rn_a (10/30/20: sum 60 ≠ max 30 ≠ latest 20) + 20 units → 2_000¢ tagged
    b06_twc_p_rn_b + the 0¢ subscription fee = 8_000¢. Wallet a is confined to its own bucket and
    holds less than it, so it is drained for exactly 3_333¢
    (allocate_prepaid_credits_by_wallets_service.rb:53); wallet b pays its own 2_000¢ and keeps
    8_000¢ that it may not put against a's 2_667¢ remainder (:109-114). Prepaid 5_333, total 2_667.
    Truncation instead of half-up: prepaid 5_332 and total 2_668. Ignoring the tag: b covers a's
    shortfall, prepaid 8_000, total 0, b at 5_333¢. If the pending purchase were spendable a would
    hold 4_666¢ and prepaid would be 6_666 with total 1_334. Three wrong answers, all separated by
    the pair (total 2_667, wallet b 8_000).

- id: b06/paid/target-wallet-code/negative-total
  block: B6
  axes: {source: paid, limitation: target-wallet-code, application: negative-total}
  dimensions: {interval: monthly, billing_time: calendar, rate_amount: 1, coupon: fixed_2000_once, foreign_wallet: empty}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  setup:
    organization: {premium_integrations: [events_targeting_wallets]}
    metrics: [{code: b06_twc_p_nt, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_twc_p_nt, interval: monthly, amount_cents: 0}
    charges:
      - billable_metric_code: b06_twc_p_nt
        charge_model: standard
        properties: {amount: "1"}
        accepts_target_wallet: true
    customer: {external_id: golden_b06_twc_p_nt_cust, currency: EUR}
    subscription: {external_id: golden_b06_twc_p_nt_sub, billing_time: calendar}
    coupons:
      - {code: b06_twc_p_nt_cpn, coupon_type: fixed_amount, amount_cents: 2000, amount_currency: EUR, frequency: once, expiration: no_expiration}
    wallets:
      - {name: over funded mixed pools, code: b06_twc_p_nt_a, rate_amount: "1", currency: EUR, granted_credits: "100", paid_credits: "40", priority: 1}
      - {name: empty target, code: b06_twc_p_nt_b, rate_amount: "1", currency: EUR, priority: 20}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_twc_p_nt, properties: {amount: 10, target_wallet_code: b06_twc_p_nt_a}}
        - {code: b06_twc_p_nt, properties: {amount: 15, target_wallet_code: b06_twc_p_nt_a}}
        - {code: b06_twc_p_nt, properties: {amount: 5, target_wallet_code: b06_twc_p_nt_a}}
        - {code: b06_twc_p_nt, properties: {amount: 12, target_wallet_code: b06_twc_p_nt_b}}
        - {code: b06_twc_p_nt, properties: {amount: 8, target_wallet_code: b06_twc_p_nt_b}}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {invoice_type: credit}
        fees_amount_cents: 4000
        total_amount_cents: 4000
        payment_status: pending
      - select: {invoice_type: subscription}
        fees_count: 3
        fees_amount_cents: 5000
        coupons_amount_cents: 2000
        sub_total_excluding_taxes_amount_cents: 3000
        taxes_amount_cents: 0
        prepaid_credit_amount_cents: 1800
        prepaid_granted_credit_amount_cents: 1800
        total_amount_cents: 1200
    wallet:
      code: b06_twc_p_nt_a
      balance_cents: 8200
  math: >-
    Over-funded wallet, tag-confined fee, and a coupon in front of it: the case where the total could
    go negative. It cannot. 100 granted credits = 10_000¢ are spendable and the 40 purchased ones are
    pending (create_from_params_service.rb:129), and the wallet still leaves 8_200¢ untouched while
    1_200¢ stays owed in cash. No `credit` invoice for the surplus and no credit note is issued — the
    only credit invoice is the 4_000¢ top-up, which is why invoices is 2 and its payment_status is
    asserted pending.
    Fees 5_000¢: 30 units → 3_000¢ tagged b06_twc_p_nt_a (10/15/5: sum 30 ≠ max 15 ≠ latest 5) and
    20 units → 2_000¢ tagged b06_twc_p_nt_b, plus the 0¢ subscription fee. The fixed_amount coupon
    spreads by weight, `credit × (amount_cents − precise_coupons) / invoice.sub_total`
    (fee.rb:232-236 through credits/applied_coupon_service.rb:35-37): 1_200 onto the a fee, 800 onto
    the b fee. Caps become `sub_total_excluding_taxes + taxes_precise − precise_credit_notes`
    (allocate_prepaid_credits_by_wallets_service.rb:77-79) = 1_800 and 1_200. Wallet b has no credits
    at all, so `with_positive_balance` (wallet.rb:65) removes it from the allocator and its 1_200¢
    cannot be paid by anybody; wallet a is refused it by the tag (:109-114). Prepaid 1_800, total
    1_200, balance 10_000 − 1_800 = 8_200.
    The named alternatives: credits applied before the coupon would cap the a fee at 3_000, giving
    prepaid 3_000, total 0 and balance 7_000; a tag-blind allocator would pay both caps for the same
    prepaid 3_000 and total 0; draining the applicable balance would give total −7_000. The coupon
    survives the top-up invoice because credit invoices never run the coupon or prepaid stages
    (invoices/paid_credit_service.rb:80-91), even though the coupon is applied before the wallet is
    created (golden_runner.rb:58-60).

- id: b06/paid/target-wallet-code/ongoing-balance
  block: B6
  axes: {source: paid, limitation: target-wallet-code, application: ongoing-balance}
  dimensions: {interval: monthly, billing_time: calendar, rate_amount: 1, read_at: mid-period, paid_credits: 40}
  provenance: coverage-gap
  runners: [rspec]
  premium: true
  setup:
    organization: {premium_integrations: [events_targeting_wallets]}
    metrics: [{code: b06_twc_p_ob, aggregation_type: sum_agg, field_name: amount}]
    plan: {code: golden_b06_twc_p_ob, interval: monthly, amount_cents: 0}
    charges:
      - billable_metric_code: b06_twc_p_ob
        charge_model: standard
        properties: {amount: "1"}
        accepts_target_wallet: true
    customer: {external_id: golden_b06_twc_p_ob_cust, currency: EUR}
    subscription: {external_id: golden_b06_twc_p_ob_sub, billing_time: calendar}
    wallets:
      - {name: targeted mixed pools, code: b06_twc_p_ob_a, rate_amount: "1", currency: EUR, granted_credits: "100", paid_credits: "40", priority: 1}
      - {name: other target, code: b06_twc_p_ob_b, rate_amount: "1", currency: EUR, granted_credits: "100", priority: 20}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_twc_p_ob, properties: {amount: 10, target_wallet_code: b06_twc_p_ob_a}}
        - {code: b06_twc_p_ob, properties: {amount: 30, target_wallet_code: b06_twc_p_ob_a}}
        - {code: b06_twc_p_ob, properties: {amount: 20, target_wallet_code: b06_twc_p_ob_a}}
        - {code: b06_twc_p_ob, properties: {amount: 25, target_wallet_code: b06_twc_p_ob_b}}
        - {code: b06_twc_p_ob, properties: {amount: 15, target_wallet_code: b06_twc_p_ob_b}}
    - {at: "2024-03-10T00:00:00Z", do: perform_wallet_refresh}
    - {at: "2024-03-10T01:00:00Z", do: fetch_current_usage}
  expect:
    invoices: 1
    invoice:
      select: {invoice_type: credit}
      total_amount_cents: 4000
      payment_status: pending
    wallet:
      code: b06_twc_p_ob_a
      balance_cents: 10000
      ongoing_usage_balance_cents: 6000
      ongoing_balance_cents: 4000
    usage:
      amount_cents: 10000
      total_amount_cents: 10000
  math: >-
    A mid-period read on the OTHER implementation of the rule — no billing runs, so the only invoice
    in the row is the pending 4_000¢ top-up. Wallets::Balance::AllocateOngoingUsageByWalletsService
    re-derives the tag at allocate_ongoing_usage_by_wallets_service.rb:118-123 and re-implements the
    refusal at :127-130; current-usage fees are grouped exactly as billed ones because
    `UsageFilters::WITHOUT_PRESENTATION_FILTER` leaves skip_grouping false
    (fees/charge_service.rb:493-499).
    The pool is `fee.amount_cents + fee.taxes_amount_cents` per key (:88): 6_000¢ tagged a (10/30/20:
    sum 60 ≠ max 30 ≠ latest 20) and 4_000¢ tagged b. Each bucket's `applicable` list holds exactly
    one wallet, so it is also the last one and takes the whole bucket (:47-58): wallet a reserves
    6_000 and not the 4_000 that belongs to b, so ongoing_balance = 10_000 − 6_000 = 4_000
    (refresh_ongoing_usage_service.rb:63).
    `balance_cents` is 10_000, not 14_000: the 40 purchased credits are pending and excluded
    (create_from_params_service.rb:129; wallet_transaction.rb:80) — and if they were counted the
    ongoing balance would read 8_000 instead of 4_000, which is the second thing this row separates.
    Tag-blind, the keys merge into one 10_000¢ pool and wallet a, first in `in_application_order`
    with room 10_000, absorbs all of it: ongoing_usage 10_000 and ongoing_balance 0. Name all three:
    ongoing_usage 6_000 vs 10_000, ongoing_balance 4_000 vs 0 vs 8_000. The current-usage payload is
    asserted alongside because the customer still owes the whole 10_000¢ — the ongoing figures are a
    projection that never debits the wallet, and no WalletTransactionConsumption rows exist on this
    path, so there is no granted/purchased split to read.

