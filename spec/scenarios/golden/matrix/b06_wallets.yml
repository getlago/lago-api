      - {name: targeted broke, code: b06_twc_tm_mp_d, rate_amount: "1", currency: EUR, granted_credits: "5", priority: 30}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b06_twc_tm_mp, properties: {amount: 5, target_wallet_code: b06_twc_tm_mp_a}}
        - {code: b06_twc_tm_mp, properties: {amount: 15, target_wallet_code: b06_twc_tm_mp_a}}
        - {code: b06_twc_tm_mp, properties: {amount: 10, target_wallet_code: b06_twc_tm_mp_a}}
        - {code: b06_twc_tm_mp, properties: {amount: 12, target_wallet_code: b06_twc_tm_mp_d}}
        - {code: b06_twc_tm_mp, properties: {amount: 8, target_wallet_code: b06_twc_tm_mp_d}}
    - {at: "2024-03-10T00:00:00Z", do: perform_wallet_refresh}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
