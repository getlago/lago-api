    credit notes on it).
    Compare with the fixed row of the same shape: the recurring flag changes only how often the
    trigger arms, and termination gives it no second chance to.

- id: b05/recurring/multiple-in-period/terminated-mid-period
  block: B5
  axes: {threshold: recurring, crossing: multiple-in-period, settlement: terminated-mid-period}
  dimensions: {interval: monthly, billing_time: calendar, thresholds: "recurring 2000", taxes: none}
  provenance: coverage-gap
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  no_transaction: true
  setup:
    organization: {premium_integrations: [progressive_billing]}
