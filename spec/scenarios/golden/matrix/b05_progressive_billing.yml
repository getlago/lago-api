# `terminated-mid-period` — the credit has to survive a period boundary the customer never reached.
# credits/progressive_billing_service.rb:20-21 looks the threshold invoices up by the
# `charges_from_datetime` of the invoice being built (1 April here), and the threshold invoice's own
# window still contains it (progressive_billed_amount.rb:34-41 wants
# `charges_to_datetime > timestamp` and `charges_from_datetime <= timestamp`). Matching on the
# period END instead would find nothing on a shortened period and charge the whole thing twice.
# Plan amount is 0 and arrears, so no subscription fee and no proration is in the way: the only
# thing on either invoice is the charge, which is what makes a double charge visible.

