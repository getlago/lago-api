    b05/recurring/multiple-in-period/terminated-mid-period.
    With no fixed threshold `largest_threshold_amount` is 0, so check_service.rb:36 is false and the
    recurring test at :48-52 runs: remainder 0, actual 10_000 >= 5_000. 100 units x 1.00 = 10_000
    cents is billed on 5 April.
    Terminating on 16 April bills the consumed usage — the same 10_000 — and credits the 10_000
    already collected, so nothing more is due. `to_credit_amount` is the threshold invoice's fees with
