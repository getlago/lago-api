- id: b05/multiple/single/terminated-mid-period
  block: B5
  axes: {threshold: multiple, crossing: single, settlement: terminated-mid-period}
  dimensions: {interval: monthly, billing_time: calendar, thresholds: "fixed 2000 + fixed 5000 + recurring 4000", taxes: none}
  provenance: coverage-gap
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  no_transaction: true
  setup:
    organization: {premium_integrations: [progressive_billing]}
    metrics: [{code: b05_mst_sum, aggregation_type: sum_agg, field_name: amount}]
    plan:
      code: golden_b05_mst
      interval: monthly
      amount_cents: 0
      usage_thresholds:
        - {amount_cents: 2000}
        - {amount_cents: 5000}
        - {amount_cents: 4000, recurring: true}
    charges: [{billable_metric_code: b05_mst_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b05_mst_cust, currency: EUR}
    subscription: {external_id: golden_b05_mst_sub, billing_time: calendar}
  timeline:
    - {at: "2024-04-01T00:00:00Z", do: create_subscription}
    - at: "2024-04-05T10:00:00Z"
      do: ingest_events
      events: [{code: b05_mst_sum, properties: {amount: 60}}]
    - {at: "2024-04-05T11:00:00Z", do: perform_usage_update}
    - {at: "2024-04-16T10:00:00Z", do: terminate_subscription}
  expect:
    invoices: 2
    invoice:
      - select: {invoice_type: progressive_billing}
        fees_amount_cents: 6000
        progressive_billing_credit_amount_cents: 0
        sub_total_excluding_taxes_amount_cents: 6000
        total_amount_cents: 6000
      - select: {invoice_type: subscription}
        fees_amount_cents: 6000
        progressive_billing_credit_amount_cents: 6000
        coupons_amount_cents: 0
        sub_total_excluding_taxes_amount_cents: 0
        taxes_amount_cents: 0
        total_amount_cents: 0
  math: >-
    Two fixed rungs armed in one jump on a plan that also holds a recurring threshold, then a
    termination.
    5 April, 60 units x 1.00 = 6_000 cents: invoiced 0 < largest fixed 5_000, so the fixed branch
    arms both 2_000 and 5_000 (check_service.rb:39-41); the recurring guard at :43 sees
    6_000 - 5_000 = 1_000 < 4_000 and stays out. Both armed thresholds go into ONE invoice
    (progressive_billing_service.rb:15-19), billing the accrued 6_000.
    Terminating on 16 April bills the consumed 6_000 and credits the 6_000 collected: total 0.
    An implementation invoicing per armed threshold would have produced two threshold invoices of
    6_000 each, and the termination invoice would then credit only the later one — 6_000 credited
    against 12_000 collected, so the customer would be 6_000 out of pocket with a zero-total invoice
    to look at. `invoices: 2` is what stops that reading.

