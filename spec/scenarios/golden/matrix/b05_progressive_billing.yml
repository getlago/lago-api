    - {at: "2024-04-13T11:00:00Z", do: perform_usage_update}
    - {at: "2024-04-16T10:00:00Z", do: terminate_subscription}
  expect:
    invoices: 4
    invoice:
      - select: {invoice_type: progressive_billing, index: 0}
        fees_amount_cents: 3000
        progressive_billing_credit_amount_cents: 0
        total_amount_cents: 3000
      - select: {invoice_type: progressive_billing, index: 1}
        fees_amount_cents: 7000
        progressive_billing_credit_amount_cents: 3000
        total_amount_cents: 4000
      - select: {invoice_type: progressive_billing, index: 2}
        fees_amount_cents: 12000
        progressive_billing_credit_amount_cents: 7000
        sub_total_excluding_taxes_amount_cents: 5000
        total_amount_cents: 5000
      - select: {invoice_type: subscription}
        fees_amount_cents: 12000
        progressive_billing_credit_amount_cents: 12000
        coupons_amount_cents: 0
        sub_total_excluding_taxes_amount_cents: 0
        taxes_amount_cents: 0
        total_amount_cents: 0
  math: >-
    Three threshold invoices spanning the fixed-to-recurring hand-off, and then a termination eleven
    days before the period would have ended.
    Thresholds fixed 2_000 / 5_000 and recurring 4_000, largest fixed 5_000.
    5 April, 30 units = 3_000: fixed branch, armed [2_000], invoice 1 bills 3_000.
    9 April, +40 units = 7_000: invoiced 3_000 < 5_000, armed [5_000] (2_000 excluded by
    `> invoiced_usage`); recurring guard 7_000 - 5_000 = 2_000 < 4_000. Invoice 2 bills 7_000,
    credits 3_000, demands 4_000.
    13 April, +50 units = 12_000: invoiced 7_000, so `7_000 < 5_000` is false and the recurring branch
    at check_service.rb:47-52 applies — remainder 7_000 % 4_000 = 3_000, actual 12_000 - 7_000 =
    5_000, 5_000 + 3_000 >= 4_000. Invoice 3 bills 12_000, credits 7_000, demands 5_000.
    Cash 3_000 + 4_000 + 5_000 = 12_000.
    Terminating on 16 April bills the consumed 12_000 and credits `to_credit_amount` of the LAST
    threshold invoice = 12_000 (progressive_billed_amount.rb:55-63), so nothing is owed and the
    excess branch at credits/progressive_billing_service.rb:36 is not entered — hence no credit note.
    Both wrong readings are excluded by the numbers on the page: summing the three invoices gives
    20_000 against 12_000 of charges, which would clamp the credit and refund 8_000; taking the first
    gives 3_000 and leaves 9_000 due for usage already paid.

