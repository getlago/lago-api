    plan:
      code: golden_b05_mmf
      interval: monthly
      amount_cents: 0
      usage_thresholds:
        - {amount_cents: 2000}
        - {amount_cents: 5000}
        - {amount_cents: 4000, recurring: true}
    charges: [{billable_metric_code: b05_mmf_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b05_mmf_cust, currency: EUR}
