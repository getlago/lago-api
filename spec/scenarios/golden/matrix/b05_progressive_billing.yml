    The hand-off from the fixed ladder to the recurring threshold, which no other cell in this block
    reaches: check_service.rb:36 chooses between two entirely different branches on
    `invoiced_usage < largest_threshold_amount`, and this row crosses that line mid-period.
    Thresholds: fixed 2_000 and 5_000, recurring 4_000, so `largest_threshold_amount` is 5_000.
    5 March, 30 units = 3_000: invoiced 0 < 5_000, fixed branch, armed = [2_000] (5_000 > 3_000).
    Recurring guard 3_000 - 5_000 is negative, disarmed. Invoice 1 bills 3_000.
    12 March, +40 units = 7_000 accrued: invoiced = 3_000, still < 5_000, fixed branch, armed =
