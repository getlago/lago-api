    fixed threshold and the recurring one contribute nothing — which is the assertion, since a
    ladder that armed everything at or below the largest threshold would demand 2_000 and then
    re-demand it.

# `excess-to-credit-note` — the settlement where the threshold invoices have already collected MORE
# than the period turns out to be worth. Read from credits/progressive_billing_service.rb:36-42:
# when `to_credit_amount > total_charges_amount`, Lago raises an automatic credit note on the
# threshold invoice for the difference and then credits only what the period's charges can absorb.
# It is a real credit note, not a zero invoice and not a negative line, and it is left AVAILABLE on
# the customer rather than spent on the period invoice — that invoice's total is already 0 by the
# time Credits::CreditNoteService runs (calculate_fees_service.rb:53 before :61), so
# credit_note_service.rb:41-47 finds nothing to apply.
#
# Falling usage is produced with `latest_agg`: the metric's value is the LAST event in the period
# (aggregations/latest_service.rb:17-19), so a smaller later event genuinely reduces what the period
# is worth. A monotonic aggregation cannot reach this cell at all.

- id: b05/fixed/single/excess-to-credit-note
  block: B5
  axes: {threshold: fixed, crossing: single, settlement: excess-to-credit-note}
  dimensions: {interval: monthly, billing_time: calendar, thresholds: "fixed 5000", aggregation: latest_agg, taxes: none}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  no_transaction: true
  setup:
    organization: {premium_integrations: [progressive_billing]}
    metrics: [{code: b05_fse_latest, aggregation_type: latest_agg, field_name: amount}]
    plan:
      code: golden_b05_fse
      interval: monthly
      amount_cents: 0
      usage_thresholds: [{amount_cents: 5000}]
    charges: [{billable_metric_code: b05_fse_latest, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b05_fse_cust, currency: EUR}
    subscription: {external_id: golden_b05_fse_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b05_fse_latest, properties: {amount: 100}}]
    - {at: "2024-03-05T11:00:00Z", do: perform_usage_update}
    - at: "2024-03-15T10:00:00Z"
      do: ingest_events
      events: [{code: b05_fse_latest, properties: {amount: 20}}]
    - {at: "2024-03-15T11:00:00Z", do: perform_usage_update}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {invoice_type: progressive_billing}
        fees_amount_cents: 10000
        progressive_billing_credit_amount_cents: 0
        sub_total_excluding_taxes_amount_cents: 10000
        total_amount_cents: 10000
      - select: {invoice_type: subscription}
        fees_amount_cents: 2000
        progressive_billing_credit_amount_cents: 2000
        credit_notes_amount_cents: 0
        coupons_amount_cents: 0
        sub_total_excluding_taxes_amount_cents: 0
        taxes_amount_cents: 0
        total_amount_cents: 0
    credit_note:
      select: {credit_status: available}
      credit_status: available
      reason: other
      credit_amount_cents: 8000
      refund_amount_cents: 0
      balance_amount_cents: 8000
      total_amount_cents: 8000
      taxes_amount_cents: 0
      items_count: 1
  math: >-
    Money already taken for a period that then shrinks. 5 March a single event of 100 units x 1.00 =
    10_000 cents crosses the 5_000 threshold and is billed in full — one crossing, one threshold
    invoice of 10_000.
    15 March a second event of 20 units arrives. With `latest_agg` the period is now worth the LAST
    event only (latest_service.rb:17-19), so accrued usage falls to 2_000. No further threshold can
    arm: check_service.rb:25-27 computes `actual_current_usage = current - progressive_billed` =
    2_000 - 10_000 = -8_000 and returns immediately on the negative.
    1 April the period invoice's charges are 2_000 while
    `to_credit_amount` is still the threshold invoice's 10_000 (progressive_billed_amount.rb:60-63:
    fees, less its own coupons, less credits pointing AT it, less credit notes on it — all zero
    here). credits/progressive_billing_service.rb:26-31 measures what the period can absorb —
    `total_charges_amount` = 2_000, the charge fees sharing the threshold invoice's charge_id — and
    :36-42 finds 10_000 > 2_000, so it issues a credit note on the THRESHOLD invoice for
    10_000 - 2_000 = 8_000 and clamps the credit to 2_000.
    The credit note is 8_000 exactly: create_from_progressive_billing_invoice.rb:41-58 takes items
    off the threshold invoice's fees largest-first (one 10_000 fee, creditable 10_000, so a single
    8_000 item) and :69-79 grosses it up by taxes less coupon adjustment — both zero — giving
    credit_amount_cents 8_000, balance 8_000, total 8_000 (create_service.rb:68-73).
    The period invoice therefore reads 2_000 of fees fully credited, total 0, and
    credit_notes_amount_cents 0 — the 8_000 is NOT spent on it, because
    credit_note_service.rb:41-47 starts from `invoice.total_amount_cents`, which the progressive
    credit already took to 0.
    Net cash: 10_000 collected, 8_000 returned as credit, 2_000 kept — the period's real value.
    Had the clamp at :41 been omitted the period invoice would carry a 10_000 credit against 2_000
    of fees and a negative total; had the credit-note branch been omitted the customer would simply
    keep paying 10_000 for 2_000 of usage.

