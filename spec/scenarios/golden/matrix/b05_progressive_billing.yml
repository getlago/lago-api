# B5 — Progressive billing
#
# Invoices::ProgressiveBillingService 7 fixes, Credits::ProgressiveBillingService 5,
# Subscriptions::ProgressiveBilledAmount 7.
#
# A usage threshold bills the customer MID-period as soon as accrued usage crosses it, then the
# period's real invoice credits back whatever was already collected. Two invoices describe one
# period, and the credit-back is what stops the customer paying twice — so every row asserts both
# sides.
#
# Every row needs three things beyond the usual: `premium: true`, the `progressive_billing` premium
# integration on the organization, and `no_transaction: true` — the service runs inside an
# idempotent_transaction, which refuses to start while a wrapping transaction is open.
#
# Shared conventions: monthly / calendar, plan amount_cents 0, standard charge at 1.00 per unit.
---
- id: b05/fixed/single/credited-on-final
  block: B5
  axes: {threshold: fixed, crossing: single, settlement: credited-on-final}
  dimensions: {interval: monthly, billing_time: calendar, threshold_amount_cents: 2000}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  no_transaction: true
  setup:
    organization: {premium_integrations: [progressive_billing]}
    metrics: [{code: b05_sum, aggregation_type: sum_agg, field_name: amount}]
    plan:
      code: golden_b05_fixed
      interval: monthly
      amount_cents: 0
      usage_thresholds: [{amount_cents: 2000}]
    charges: [{billable_metric_code: b05_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b05_fixed_cust, currency: EUR}
    subscription: {external_id: golden_b05_fixed_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b05_sum, properties: {amount: 30}}
    - {at: "2024-03-05T11:00:00Z", do: perform_usage_update}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      select: {invoice_type: subscription}
      invoice_type: subscription
      fees_amount_cents: 3000
      progressive_billing_credit_amount_cents: 3000
      total_amount_cents: 0
  math: >-
    30 units × 1.00 = 3_000¢ of accrued usage crosses the 2_000¢ threshold, and the mid-period
    progressive_billing invoice then bills ALL accrued usage — 3_000¢, not the 2_000¢ of the
    threshold. The threshold is a TRIGGER, not a cap; billing only up to it would leave the
    remaining 1_000¢ uncollected until period end.
    At period end the subscription invoice re-computes the same 3_000¢ of fees and credits back
    everything already collected, so progressive_billing_credit_amount_cents is 3_000¢ and nothing
    further is owed. fees_amount_cents stays 3_000: the credit reduces what is due, not what was
    charged — the same shape as a wallet in B6, and the reason double-billing here is invisible in
    the fees total.

- id: b05/fixed/exact-hit/credited-on-final
  block: B5
  axes: {threshold: fixed, crossing: exact-hit, settlement: credited-on-final}
  dimensions: {interval: monthly, billing_time: calendar, threshold_amount_cents: 3000}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  no_transaction: true
  setup:
    organization: {premium_integrations: [progressive_billing]}
    metrics: [{code: b05_exact_sum, aggregation_type: sum_agg, field_name: amount}]
    plan:
      code: golden_b05_exact
      interval: monthly
      amount_cents: 0
      usage_thresholds: [{amount_cents: 3000}]
    charges: [{billable_metric_code: b05_exact_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b05_exact_cust, currency: EUR}
    subscription: {external_id: golden_b05_exact_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b05_exact_sum, properties: {amount: 30}}
    - {at: "2024-03-05T11:00:00Z", do: perform_usage_update}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      select: {invoice_type: subscription}
      fees_amount_cents: 3000
      progressive_billing_credit_amount_cents: 3000
      total_amount_cents: 0
  math: >-
    Usage lands EXACTLY on the threshold: 30 units × 1.00 = 3_000¢ against a 3_000¢ threshold. The
    boundary is inclusive — reaching the threshold triggers billing, it does not have to be exceeded
    — so the same two invoices appear as in the previous row. An off-by-one that required strictly
    greater-than would produce a single invoice here and nothing would look wrong until the customer
    was billed a period late.

- id: b05/recurring/single/credited-on-final
  block: B5
  axes: {threshold: recurring, crossing: single, settlement: credited-on-final}
  dimensions: {interval: monthly, billing_time: calendar, threshold_amount_cents: 2000, recurring: true}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  no_transaction: true
  setup:
    organization: {premium_integrations: [progressive_billing]}
    metrics: [{code: b05_rec_sum, aggregation_type: sum_agg, field_name: amount}]
    plan:
      code: golden_b05_recurring
      interval: monthly
      amount_cents: 0
      usage_thresholds: [{amount_cents: 2000, recurring: true}]
    charges: [{billable_metric_code: b05_rec_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b05_recurring_cust, currency: EUR}
    subscription: {external_id: golden_b05_recurring_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events:
        - {code: b05_rec_sum, properties: {amount: 30}}
    - {at: "2024-03-05T11:00:00Z", do: perform_usage_update}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      select: {invoice_type: subscription}
      fees_amount_cents: 3000
      progressive_billing_credit_amount_cents: 3000
      total_amount_cents: 0
  math: >-
    A RECURRING threshold re-arms after each crossing rather than firing once per period, so it bills
    every further 2_000¢ of usage. Over a single crossing the outcome is identical to the fixed row —
    3_000¢ billed early, 3_000¢ credited back, nothing owed — which is deliberate: this row pins that
    the recurring flag does not change the settlement arithmetic, only how often the trigger arms.
    A plan may hold at most one recurring threshold (UsageThreshold validates uniqueness on
    [plan_id, recurring]), so this is the only shape it can take.

- id: b05/fixed/single/terminated-mid-period
  block: B5
  axes: {threshold: fixed, crossing: single, settlement: terminated-mid-period}
  dimensions: {interval: monthly, billing_time: calendar, threshold_amount_cents: 5000, taxes: none}
  provenance: coverage-gap
  runners: [rspec]
  calendar_sensitive: true
  premium: true
  no_transaction: true
  setup:
    organization: {premium_integrations: [progressive_billing]}
    metrics: [{code: b05_term_sum, aggregation_type: sum_agg, field_name: amount}]
    plan:
      code: golden_b05_term
      interval: monthly
      amount_cents: 0
      usage_thresholds: [{amount_cents: 5000}]
    charges: [{billable_metric_code: b05_term_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b05_term_cust, currency: EUR}
    subscription: {external_id: golden_b05_term_sub, billing_time: calendar}
  timeline:
    - {at: "2024-04-01T00:00:00Z", do: create_subscription}
    - at: "2024-04-05T10:00:00Z"
      do: ingest_events
      events: [{code: b05_term_sum, properties: {amount: 100}}]
    - {at: "2024-04-05T11:00:00Z", do: perform_usage_update}
    - {at: "2024-04-16T10:00:00Z", do: terminate_subscription}
  expect:
    invoices: 2
    invoice:
      - select: {invoice_type: progressive_billing}
        fees_amount_cents: 10000
        total_amount_cents: 10000
      - select: {invoice_type: subscription}
        fees_amount_cents: 10000
        progressive_billing_credit_amount_cents: 10000
        total_amount_cents: 0
  math: >-
    A threshold invoice is money taken for a period that then ends early, so the credit has to survive
    a boundary the customer never reached.
    100 units on 5 April cross the 5_000¢ threshold and are billed immediately — 10_000¢. Terminating
    on 16 April closes the period there and bills the consumed usage, which is the same 100 units, so
    the final invoice is 10_000¢ of charges credited by the 10_000¢ already collected: nothing more is
    owed.
    The credit survives because ProgressiveBillingService looks the threshold invoice up by the
    charges_from_datetime of the invoice being built (1 April), not by the period's end, and the
    threshold invoice's own window still contains it. Had it matched on the period end instead, the
    shortened period would find nothing and the customer would pay 20_000¢ for 10_000¢ of usage.
    The plan bills in arrears and carries no subscription fee, so the only thing on either invoice is
    the charge — which is what makes the double-charge visible rather than buried in a proration.

- id: b05/fixed/multiple-in-period/credited-on-final
  block: B5
  axes: {threshold: fixed, crossing: multiple-in-period, settlement: credited-on-final}
  dimensions: {interval: monthly, billing_time: calendar, thresholds: "fixed 2000 + fixed 5000", taxes: none}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  no_transaction: true
  setup:
    organization: {premium_integrations: [progressive_billing]}
    metrics: [{code: b05_fmf_sum, aggregation_type: sum_agg, field_name: amount}]
    plan:
      code: golden_b05_fmf
      interval: monthly
      amount_cents: 0
      usage_thresholds: [{amount_cents: 2000}, {amount_cents: 5000}]
    charges: [{billable_metric_code: b05_fmf_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b05_fmf_cust, currency: EUR}
    subscription: {external_id: golden_b05_fmf_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b05_fmf_sum, properties: {amount: 30}}]
    - {at: "2024-03-05T11:00:00Z", do: perform_usage_update}
    - at: "2024-03-12T10:00:00Z"
      do: ingest_events
      events: [{code: b05_fmf_sum, properties: {amount: 50}}]
    - {at: "2024-03-12T11:00:00Z", do: perform_usage_update}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 3
    invoice:
      - select: {invoice_type: progressive_billing, index: 0}
        fees_amount_cents: 3000
        progressive_billing_credit_amount_cents: 0
        sub_total_excluding_taxes_amount_cents: 3000
        total_amount_cents: 3000
      - select: {invoice_type: progressive_billing, index: 1}
        fees_amount_cents: 8000
        progressive_billing_credit_amount_cents: 3000
        sub_total_excluding_taxes_amount_cents: 5000
        total_amount_cents: 5000
      - select: {invoice_type: subscription}
        fees_amount_cents: 8000
        progressive_billing_credit_amount_cents: 8000
        coupons_amount_cents: 0
        sub_total_excluding_taxes_amount_cents: 0
        taxes_amount_cents: 0
        total_amount_cents: 0
  math: >-
    Two non-recurring thresholds on one plan, crossed at two different moments: three invoices
    describe one period and all three are asserted.
    Which thresholds arm is decided by check_service.rb:39-41 —
    `threshold.amount_cents > invoiced_usage && threshold.amount_cents <= total_usage` — where
    `invoiced_usage` is the last threshold invoice's own fees (check_service.rb:28 feeding on
    progressive_billed_amount.rb:58) and `total_usage` is everything accrued.
    5 March, 30 units x 1.00 = 3_000 cents accrued: invoiced_usage 0, total_usage 3_000, so the
    2_000 threshold arms and the 5_000 one does not. progressive_billing_service.rb:94-107 then
    bills the FULL accrued usage over the whole period boundaries (:118-136), so the demand is
    3_000 cents, not the 2_000 of the threshold.
    12 March, +50 units = 8_000 cents accrued: invoiced_usage is now 3_000, total_usage 8_000, so
    the 5_000 threshold arms while the 2_000 one is excluded by `> invoiced_usage` — it cannot fire
    twice. The second threshold invoice re-bills the whole 8_000 and credits the first invoice's
    3_000 back (credits/progressive_billing_service.rb:20-58), demanding 5_000 of new cash.
    3_000 + 5_000 = 8_000 collected, exactly the usage.
    1 April the period invoice re-computes the same 8_000 of fees and credits
    `to_credit_amount`, which reads ONLY the last threshold invoice
    (progressive_billed_amount.rb:55-63): 8_000 cents. That is right because threshold invoices are
    cumulative and each already credited its predecessor.
    Summing every threshold invoice instead would credit 11_000 and hand the customer 3_000 they
    never paid; taking the FIRST invoice instead would credit 3_000 and charge the 5_000 a second
    time. Both are visible here and neither can be seen in a single-crossing row.

- id: b05/recurring/multiple-in-period/credited-on-final
  block: B5
  axes: {threshold: recurring, crossing: multiple-in-period, settlement: credited-on-final}
  dimensions: {interval: monthly, billing_time: calendar, thresholds: "recurring 2000", taxes: none}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  no_transaction: true
  setup:
    organization: {premium_integrations: [progressive_billing]}
    metrics: [{code: b05_rmf_sum, aggregation_type: sum_agg, field_name: amount}]
    plan:
      code: golden_b05_rmf
      interval: monthly
      amount_cents: 0
      usage_thresholds: [{amount_cents: 2000, recurring: true}]
    charges: [{billable_metric_code: b05_rmf_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b05_rmf_cust, currency: EUR}
    subscription: {external_id: golden_b05_rmf_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b05_rmf_sum, properties: {amount: 30}}]
    - {at: "2024-03-05T11:00:00Z", do: perform_usage_update}
    - at: "2024-03-12T10:00:00Z"
      do: ingest_events
      events: [{code: b05_rmf_sum, properties: {amount: 30}}]
    - {at: "2024-03-12T11:00:00Z", do: perform_usage_update}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 3
    invoice:
      - select: {invoice_type: progressive_billing, index: 0}
        fees_amount_cents: 3000
        progressive_billing_credit_amount_cents: 0
        sub_total_excluding_taxes_amount_cents: 3000
        total_amount_cents: 3000
      - select: {invoice_type: progressive_billing, index: 1}
        fees_amount_cents: 6000
        progressive_billing_credit_amount_cents: 3000
        sub_total_excluding_taxes_amount_cents: 3000
        total_amount_cents: 3000
      - select: {invoice_type: subscription}
        fees_amount_cents: 6000
        progressive_billing_credit_amount_cents: 6000
        coupons_amount_cents: 0
        sub_total_excluding_taxes_amount_cents: 0
        taxes_amount_cents: 0
        total_amount_cents: 0
  math: >-
    The recurring threshold is the only one that can fire twice for the same amount, and this is the
    row that makes it do so.
    With no fixed threshold `largest_threshold_amount` is 0 (check_service.rb:32), so
    `invoiced_usage < largest_threshold_amount` is false from the very first check and every
    crossing goes through the recurring branch at check_service.rb:47-52:
    `actual_current_usage + (invoiced_usage % R) >= R`.
    5 March, 30 units = 3_000 cents: invoiced_usage 0, remainder 0, actual 3_000 >= 2_000, so it
    fires and bills all accrued usage — 3_000 cents.
    12 March, +30 units = 6_000 accrued: invoiced_usage = the first invoice's fees = 3_000
    (progressive_billed_amount.rb:58), remainder = 3_000 % 2_000 = 1_000, actual = 6_000 - 3_000 =
    3_000, and 3_000 + 1_000 = 4_000 >= 2_000, so it re-arms. The second invoice re-bills 6_000 and
    credits the first's 3_000, demanding 3_000. Cash 3_000 + 3_000 = 6_000.
    Note this second invoice only exists because progressive_billing_service.rb:32-34 widens the
    idempotency key with `previous_progressive_billing_invoice_id` when the last armed threshold is
    recurring — without it the key (invoiced_usage 0, threshold_amount 2_000, :21-26) is identical
    to the first invoice's and the second demand is swallowed as a duplicate, leaving 3_000 of usage
    uncollected until period end.
    1 April: fees 6_000, credit = the LAST threshold invoice's `to_credit_amount` = 6_000, nothing
    owed. Crediting the sum of both threshold invoices would give 9_000 and refund 3_000 that was
    never paid.

- id: b05/recurring/exact-hit/credited-on-final
  block: B5
  axes: {threshold: recurring, crossing: exact-hit, settlement: credited-on-final}
  dimensions: {interval: monthly, billing_time: calendar, thresholds: "recurring 3000", taxes: none}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  no_transaction: true
  setup:
    organization: {premium_integrations: [progressive_billing]}
    metrics: [{code: b05_ref_sum, aggregation_type: sum_agg, field_name: amount}]
    plan:
      code: golden_b05_ref
      interval: monthly
      amount_cents: 0
      usage_thresholds: [{amount_cents: 3000, recurring: true}]
    charges: [{billable_metric_code: b05_ref_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b05_ref_cust, currency: EUR}
    subscription: {external_id: golden_b05_ref_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b05_ref_sum, properties: {amount: 30}}]
    - {at: "2024-03-05T11:00:00Z", do: perform_usage_update}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {invoice_type: progressive_billing}
        fees_amount_cents: 3000
        progressive_billing_credit_amount_cents: 0
        sub_total_excluding_taxes_amount_cents: 3000
        total_amount_cents: 3000
      - select: {invoice_type: subscription}
        fees_amount_cents: 3000
        progressive_billing_credit_amount_cents: 3000
        coupons_amount_cents: 0
        sub_total_excluding_taxes_amount_cents: 0
        taxes_amount_cents: 0
        total_amount_cents: 0
  math: >-
    The recurring boundary, hit exactly. 30 units x 1.00 = 3_000 cents against a 3_000 recurring
    threshold. The recurring branch is check_service.rb:48-52 and the comparison is
    `actual_current_usage + recurring_remainder >= recurring_threshold.amount_cents`: with
    invoiced_usage 0 the remainder is 0 and 3_000 >= 3_000 is true, so the threshold fires.
    The row sits on the boundary on purpose. One cent below — `amount: 29.99`, 2_999 cents — the
    comparison fails and there is ONE invoice, 2_999 cents charged a month later. One cent above,
    3_001 cents, it fires and bills 3_001. So a `>` in place of `>=` at check_service.rb:50 turns
    `invoices: 3` worth of assertions here into a single invoice of 3_000, and the failure is the
    invoice count rather than a rounding argument.
    The settlement is the same shape as the fixed rows: 3_000 billed early,
    `to_credit_amount` = 3_000 (progressive_billed_amount.rb:60-63, nothing having reduced the
    threshold invoice), credited in full, nothing owed. That is deliberate — the recurring flag
    changes how often the trigger arms, never the settlement arithmetic.

- id: b05/multiple/single/credited-on-final
  block: B5
  axes: {threshold: multiple, crossing: single, settlement: credited-on-final}
  dimensions: {interval: monthly, billing_time: calendar, thresholds: "fixed 2000 + fixed 5000 + recurring 4000", taxes: none}
  provenance: coverage-gap
  runners: [rspec, live]
  premium: true
  no_transaction: true
  setup:
    organization: {premium_integrations: [progressive_billing]}
    metrics: [{code: b05_msf_sum, aggregation_type: sum_agg, field_name: amount}]
    plan:
      code: golden_b05_msf
      interval: monthly
      amount_cents: 0
      usage_thresholds:
        - {amount_cents: 2000}
        - {amount_cents: 5000}
        - {amount_cents: 4000, recurring: true}
    charges: [{billable_metric_code: b05_msf_sum, charge_model: standard, properties: {amount: "1"}}]
    customer: {external_id: golden_b05_msf_cust, currency: EUR}
    subscription: {external_id: golden_b05_msf_sub, billing_time: calendar}
  timeline:
    - {at: "2024-03-01T00:00:00Z", do: create_subscription}
    - at: "2024-03-05T10:00:00Z"
      do: ingest_events
      events: [{code: b05_msf_sum, properties: {amount: 60}}]
    - {at: "2024-03-05T11:00:00Z", do: perform_usage_update}
    - {at: "2024-04-01T01:00:00Z", do: perform_billing}
  expect:
    invoices: 2
    invoice:
      - select: {invoice_type: progressive_billing}
        fees_amount_cents: 6000
        progressive_billing_credit_amount_cents: 0
        sub_total_excluding_taxes_amount_cents: 6000
        total_amount_cents: 6000
      - select: {invoice_type: subscription}
        fees_amount_cents: 6000
        progressive_billing_credit_amount_cents: 6000
        coupons_amount_cents: 0
        sub_total_excluding_taxes_amount_cents: 0
        taxes_amount_cents: 0
        total_amount_cents: 0
  math: >-
    Three thresholds on one plan — two fixed and the one recurring one a plan is allowed
    (UsageThreshold:20-21) — and a single jump that passes TWO of them at once. The point of the
    row is that two armed thresholds still produce exactly ONE invoice.
    60 units x 1.00 = 6_000 cents on 5 March. invoiced_usage 0, total_usage 6_000, so
    check_service.rb:39-41 arms both 2_000 and 5_000. The recurring one is guarded separately at
    :42-46 by `total_usage - largest_threshold_amount >= recurring_threshold.amount_cents`:
    6_000 - 5_000 = 1_000, which is under 4_000, so it stays disarmed — the recurring threshold only
    starts counting once the whole fixed ladder is behind it.
    Invoices::ProgressiveBillingService is handed the armed set as one list and creates ONE invoice
    for it (progressive_billing_service.rb:15-19, with one AppliedUsageThreshold per threshold at
    :138-147), billing the accrued 6_000 once.
    An implementation that invoiced per armed threshold would produce three invoices here, and by
    billing accrued usage each time would demand 6_000 twice — 12_000 for 6_000 of usage. That is
    what `invoices: 2` pins, and it is unreachable from a plan with a single threshold.
    1 April: fees 6_000, `to_credit_amount` 6_000, credited in full, nothing owed.

- id: b05/multiple/multiple-in-period/credited-on-final
  block: B5
  axes: {threshold: multiple, crossing: multiple-in-period, settlement: credited-on-final}
  dimensions: {interval: monthly, billing_time: calendar, thresholds: "fixed 2000 + fixed 5000 + recurring 4000", taxes: none}
  provenance: coverage-gap
