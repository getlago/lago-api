    largest 5_000, so the fixed branch runs and check_service.rb:40 asks
    `2_000 > 0 && 2_000 <= 2_000` — true on the inclusive upper bound, so exactly one threshold
    arms. The recurring guard at :43 sees 2_000 - 5_000, negative, and stays out.
    One cent below (`amount: 19.99`, 1_999 cents) nothing arms and the whole period is a single
    invoice of 1_999 a month later; one cent above, 2_001, the same single threshold arms and bills
