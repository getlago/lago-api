    < 4_000, still disarmed. Invoice 2 bills 7_000 and credits 3_000, demanding 4_000.
    20 March, +50 units = 12_000 accrued: invoiced = 7_000, and 7_000 < 5_000 is now FALSE, so the
    elsif at :47 takes over: remainder = 7_000 % 4_000 = 3_000, actual = 12_000 - 7_000 = 5_000,
    5_000 + 3_000 = 8_000 >= 4_000, so the recurring threshold arms for the first time. Invoice 3
    bills 12_000 and credits 7_000, demanding 5_000.
