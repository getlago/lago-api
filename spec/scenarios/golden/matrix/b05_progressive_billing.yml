    customer: {external_id: golden_b05_rmt_cust, currency: EUR}
    subscription: {external_id: golden_b05_rmt_sub, billing_time: calendar}
  timeline:
    - {at: "2024-04-01T00:00:00Z", do: create_subscription}
    - at: "2024-04-05T10:00:00Z"
      do: ingest_events
      events: [{code: b05_rmt_sum, properties: {amount: 30}}]
    - {at: "2024-04-05T11:00:00Z", do: perform_usage_update}
    - at: "2024-04-10T10:00:00Z"
      do: ingest_events
      events: [{code: b05_rmt_sum, properties: {amount: 30}}]
    - {at: "2024-04-10T11:00:00Z", do: perform_usage_update}
    - {at: "2024-04-16T10:00:00Z", do: terminate_subscription}
  expect:
    invoices: 3
    invoice:
      - select: {invoice_type: progressive_billing, index: 0}
        fees_amount_cents: 3000
        progressive_billing_credit_amount_cents: 0
        total_amount_cents: 3000
      - select: {invoice_type: progressive_billing, index: 1}
        fees_amount_cents: 6000
        progressive_billing_credit_amount_cents: 3000
        sub_total_excluding_taxes_amount_cents: 3000
        total_amount_cents: 3000
      - select: {invoice_type: subscription}
        fees_amount_cents: 6000
        progressive_billing_credit_amount_cents: 6000
        coupons_amount_cents: 0
        sub_total_excluding_taxes_amount_cents: 0
        taxes_amount_cents: 0
        total_amount_cents: 0
  math: >-
    A recurring threshold that fires twice and then has its period cut short.
    5 April, 30 units = 3_000: remainder 0 % 2_000 = 0, actual 3_000 >= 2_000, invoice 1 bills 3_000.
    10 April, +30 units = 6_000 accrued: invoiced_usage 3_000, remainder 3_000 % 2_000 = 1_000, actual
    3_000, and 3_000 + 1_000 >= 2_000, so it re-arms (check_service.rb:48-52). Invoice 2 re-bills
    6_000, credits 3_000, demands 3_000. This second invoice exists only because
    progressive_billing_service.rb:32-34 adds `previous_progressive_billing_invoice_id` to the
    idempotency key for a recurring threshold — the rest of the key (:21-26) is identical between the
    two demands.
    Terminating on 16 April bills the consumed 6_000 and credits `to_credit_amount` of the LAST
    threshold invoice = 6_000, so nothing is owed. Cash 3_000 + 3_000 = 6_000 = the period's value.
    Crediting the sum of both threshold invoices would give 9_000, exceed the 6_000 of charges, trip
    the excess branch at credits/progressive_billing_service.rb:36 and refund 3_000 that was never
    overpaid — which is why the credit-note count matters here even though this row expects none.

